questions:
- id: 8001
  chapter_title: Basic Python Language
  section_title: Python 的定位與執行方式
  text: Python 被稱為動態型別語言，主要代表什麼意思？
  type: multiple_choice
  options:
  - Python 程式一定會自動使用 GPU 執行
  - 變數宣告時必須明確指定資料型別
  - 變數本身不固定型別，型別會跟著當前指派的值而定
  - Python 只能在 Jupyter Notebook 中執行
  correct_index: 2
  explanation: 動態型別表示變數名稱不綁定固定型別，執行時的值決定其型別。
  tags:
  - chap-m6-ch1
  - sec-python-runtime
  usage: both
- id: 8002
  chapter_title: Basic Python Language
  section_title: 變數、型別與資料結構
  text: 下列哪一種 Python 資料結構最適合表示 key-value 對應，例如模型標籤名稱對應到數字？
  type: multiple_choice
  options:
  - list
  - tuple
  - dict
  - set
  correct_index: 2
  explanation: dict 用 key-value 形式儲存資料，適合表示設定、JSON 結構與標籤對應。
  tags:
  - chap-m6-ch1
  - sec-python-data-structures
  usage: both
- id: 8003
  chapter_title: Basic Python Language
  section_title: 流程控制與函式
  text: Python 使用什麼方式表示 if、for、def 等語法區塊的範圍？
  type: multiple_choice
  options:
  - 大括號
  - 縮排
  - 分號
  - XML 標籤
  correct_index: 1
  explanation: Python 使用縮排表示程式區塊，因此縮排一致性會直接影響程式語意。
  tags:
  - chap-m6-ch1
  - sec-python-control-functions
  usage: both
- id: 8004
  chapter_title: Basic Python Language
  section_title: 流程控制與函式
  text: Python type hints 的主要用途是什麼？
  type: multiple_choice
  options:
  - 強制所有變數在執行時都不能改變型別
  - 提升可讀性，並協助 IDE 與靜態分析工具發現問題
  - 讓 Python 程式自動編譯成 C 語言
  - 完全取代單元測試
  correct_index: 1
  explanation: type hints 主要提供型別意圖與靜態分析資訊，不等於執行時強制型別檢查。
  tags:
  - chap-m6-ch1
  - sec-python-control-functions
  usage: both
- id: 8005
  chapter_title: Basic Python Language
  section_title: List Comprehension 與 Generator
  text: 當資料量很大、不希望一次把所有結果放進記憶體時，較適合使用哪一種 Python 機制？
  type: multiple_choice
  options:
  - generator
  - global variable
  - set literal
  - f-string
  correct_index: 0
  explanation: generator 可逐步產生資料，適合串流或批次處理大量資料。
  tags:
  - chap-m6-ch1
  - sec-python-comprehension
  usage: both
- id: 8006
  chapter_title: Basic Python Language
  section_title: 檔案、例外與環境管理
  text: 使用 Python 的虛擬環境主要是為了解決什麼問題？
  type: multiple_choice
  options:
  - 讓 Python 程式不需要任何套件
  - 隔離不同專案的相依套件版本，避免互相衝突
  - 自動把所有程式碼部署到雲端
  - 強制所有模型只能在 CPU 執行
  correct_index: 1
  explanation: 虛擬環境能隔離套件與版本，降低專案之間相依衝突。
  tags:
  - chap-m6-ch1
  - sec-python-files-env
  usage: both
- id: 8007
  chapter_title: Basic Python Language
  section_title: 檔案、例外與環境管理
  text: Python 中使用 with open(...) as f 的主要好處是什麼？
  type: multiple_choice
  options:
  - 自動把文字翻譯成英文
  - 自動管理檔案資源，區塊結束後關閉檔案
  - 讓檔案永遠不會發生讀取錯誤
  - 將檔案內容自動轉成神經網路
  correct_index: 1
  explanation: with statement 會管理資源生命週期，常用於檔案讀寫與需要關閉的外部資源。
  tags:
  - chap-m6-ch1
  - sec-python-files-env
  usage: both
- id: 8008
  chapter_title: Basic Python Language
  section_title: 模組、套件與匯入
  text: 當 Python 專案逐漸變大時，將程式拆成多個模組的主要目的為何？
  type: multiple_choice
  options:
  - 讓程式碼無法被測試
  - 讓每個檔案責任更清楚，方便重用、測試與維護
  - 避免使用任何第三方套件
  - 保證模型準確率達到百分之百
  correct_index: 1
  explanation: 模組化能讓資料讀取、特徵工程、模型與訓練流程有清楚邊界。
  tags:
  - chap-m6-ch1
  - sec-python-modules
  usage: both
- id: 8071
  chapter_title: Basic Python Language
  section_title: Python 的定位與執行方式
  text: 下列哪一種 Python 執行方式最適合探索式資料分析與逐步紀錄實驗結果？
  type: multiple_choice
  options:
  - Jupyter Notebook
  - CSS stylesheet
  - SQL index
  - Docker image tag
  correct_index: 0
  explanation: Jupyter Notebook 適合逐步執行、觀察輸出、保留圖表與分析過程，因此常用於探索式資料分析。
  tags:
  - chap-m6-ch1
  - sec-python-runtime
  usage: both
- id: 8072
  chapter_title: Basic Python Language
  section_title: 變數、型別與資料結構
  text: Python 的 tuple 與 list 相比，主要差異是什麼？
  type: multiple_choice
  options:
  - tuple 有序但不可變，list 有序且可變
  - tuple 只能儲存浮點數，list 只能儲存字串
  - tuple 會自動訓練模型，list 不會
  - tuple 無法被函式回傳
  correct_index: 0
  explanation: tuple 是不可變序列，適合表示固定組合；list 是可變序列，適合持續新增或修改元素。
  tags:
  - chap-m6-ch1
  - sec-python-data-structures
  usage: both
- id: 8073
  chapter_title: Basic Python Language
  section_title: List Comprehension 與 Generator
  text: list comprehension 最適合用於哪一類工作？
  type: multiple_choice
  options:
  - 對序列資料進行簡潔的篩選與轉換
  - 自動安裝所有缺少的套件
  - 將 GPU 記憶體永久鎖定
  - 取代所有錯誤處理
  correct_index: 0
  explanation: list comprehension 常用於用一行程式完成篩選、映射與簡單轉換。
  tags:
  - chap-m6-ch1
  - sec-python-comprehension
  usage: both
- id: 8074
  chapter_title: Basic Python Language
  section_title: 檔案、例外與環境管理
  text: 例外處理 try/except 的主要目的為何？
  type: multiple_choice
  options:
  - 處理可預期錯誤，讓程式能採取替代流程
  - 讓所有函式自動平行化
  - 將文字資料轉為影像
  - 保證模型不會過擬合
  correct_index: 0
  explanation: try/except 可攔截特定錯誤並執行替代處理，避免程式在可預期錯誤下直接中斷。
  tags:
  - chap-m6-ch1
  - sec-python-files-env
  usage: both
- id: 8075
  chapter_title: Basic Python Language
  section_title: Python 在 AI 專案中的典型檔案結構
  text: 在 AI 專案中，將探索性 Notebook 中的核心邏輯移到 src/ 目錄，主要好處是什麼？
  type: multiple_choice
  options:
  - 讓核心邏輯可重用、可測試，也更容易由他人維護
  - 讓模型自動取得更高準確率
  - 讓資料集不需要任何標籤
  - 讓 Python 變成靜態型別語言
  correct_index: 0
  explanation: Notebook 適合探索，src/ 中的模組化程式碼更適合測試、重複執行與團隊維護。
  tags:
  - chap-m6-ch1
  - sec-python-project-structure
  usage: both
- id: 8076
  chapter_title: Basic Python Language
  section_title: 可讀性與可維護性原則
  text: 為什麼 AI 實驗中應集中管理 batch size、learning rate、資料路徑等設定？
  type: multiple_choice
  options:
  - 方便重現實驗、比較結果與調整參數
  - 讓訓練資料自動變成無缺失值
  - 讓所有程式都不需要 import
  - 讓模型只能使用 CPU
  correct_index: 0
  explanation: 設定集中管理可降低散落在多處造成的不一致，也方便追蹤實驗條件。
  tags:
  - chap-m6-ch1
  - sec-python-maintainability
  usage: both
- id: 8077
  chapter_title: Basic Python Language
  section_title: 常見錯誤與除錯方法
  text: 當 AI 程式出現矩陣或張量維度錯誤時，最直接的除錯動作是什麼？
  type: multiple_choice
  options:
  - 印出每一步資料的 shape
  - 立即更換作業系統
  - 將所有變數改成全域變數
  - 刪除測試資料集
  correct_index: 0
  explanation: 維度錯誤通常需要逐步追蹤資料 shape，確認哪一步的轉換造成不相容。
  tags:
  - chap-m6-ch1
  - sec-python-debugging
  usage: both
- id: 8078
  chapter_title: Basic Python Language
  section_title: 可讀性與可維護性原則
  text: 在 Python AI 專案中，過度依賴全域變數最主要的風險是什麼？
  type: multiple_choice
  options:
  - 程式結果容易依賴隱藏狀態與執行順序
  - 會讓 dict 無法使用 key 查詢
  - 會讓 NumPy 陣列無法相加
  - 會讓所有註解失效
  correct_index: 0
  explanation: 全域變數會讓函式依賴外部狀態，特別在 Notebook 中容易因執行順序不同而得到不同結果。
  tags:
  - chap-m6-ch1
  - sec-python-maintainability
  usage: both
