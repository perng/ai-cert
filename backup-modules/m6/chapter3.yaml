questions:
- id: 8021
  chapter_title: SciPy 與 scikit-learn
  section_title: SciPy 的角色
  text: SciPy 主要建立在哪個 Python 數值運算套件之上？
  type: multiple_choice
  options:
  - NumPy
  - Flask
  - NLTK
  - OpenCV
  correct_index: 0
  explanation: SciPy 建立在 NumPy 之上，提供統計、最佳化、稀疏矩陣與訊號處理等高階科學運算功能。
  tags:
  - chap-m6-ch3
  - sec-scipy-role
  usage: both
- id: 8022
  chapter_title: SciPy 與 scikit-learn
  section_title: SciPy 的角色
  text: 若需要使用統計分布、假設檢定與相關係數，SciPy 中最相關的模組是哪一個？
  type: multiple_choice
  options:
  - scipy.stats
  - scipy.camera
  - scipy.router
  - scipy.tokenizer
  correct_index: 0
  explanation: scipy.stats 提供統計分布、檢定與相關統計工具。
  tags:
  - chap-m6-ch3
  - sec-scipy-role
  usage: both
- id: 8023
  chapter_title: SciPy 與 scikit-learn
  section_title: 最佳化與曲線擬合
  text: 機器學習訓練常被視為最佳化問題，主要是在尋找什麼？
  type: multiple_choice
  options:
  - 讓損失函數盡可能小的模型參數
  - 讓檔案名稱最短的資料集
  - 讓程式碼行數最多的實作方式
  - 讓所有特徵都變成字串的轉換方式
  correct_index: 0
  explanation: 模型訓練通常是調整參數以最小化 loss，使預測更接近目標。
  tags:
  - chap-m6-ch3
  - sec-scipy-optimize
  usage: both
- id: 8024
  chapter_title: SciPy 與 scikit-learn
  section_title: scikit-learn 的標準流程
  text: scikit-learn estimator 的常見使用流程為何？
  type: multiple_choice
  options:
  - 建立模型、fit 訓練、predict 或 transform 使用
  - 先刪除資料、再隨機輸出答案
  - 只呼叫 print 即可完成模型訓練
  - 先部署到雲端才允許訓練
  correct_index: 0
  explanation: scikit-learn API 通常遵循 fit、predict、transform 等一致介面。
  tags:
  - chap-m6-ch3
  - sec-sklearn-workflow
  usage: both
- id: 8025
  chapter_title: SciPy 與 scikit-learn
  section_title: 前處理與 Pipeline
  text: scikit-learn Pipeline 的重要優點是什麼？
  type: multiple_choice
  options:
  - 將前處理與模型訓練串成一致流程，降低資料洩漏風險
  - 讓模型完全不需要資料
  - 將所有模型轉成影像檔
  - 強制模型只能做分群
  correct_index: 0
  explanation: Pipeline 可把 scaler、encoder、classifier 等步驟一起 fit，避免測試資料資訊滲入訓練流程。
  tags:
  - chap-m6-ch3
  - sec-sklearn-preprocessing-pipeline
  usage: both
- id: 8026
  chapter_title: SciPy 與 scikit-learn
  section_title: 分類、迴歸與分群
  text: 下列哪一類任務的目標是預測連續數值？
  type: multiple_choice
  options:
  - 分類
  - 迴歸
  - 分群
  - Tokenization
  correct_index: 1
  explanation: 迴歸任務預測連續數值，例如價格、溫度或需求量。
  tags:
  - chap-m6-ch3
  - sec-sklearn-model-types
  usage: both
- id: 8027
  chapter_title: SciPy 與 scikit-learn
  section_title: 評估、交叉驗證與超參數搜尋
  text: 使用交叉驗證的主要目的為何？
  type: multiple_choice
  options:
  - 讓模型不用評估
  - 降低單一次資料切分造成的評估偶然性
  - 將所有資料永久刪除
  - 把影像轉成灰階
  correct_index: 1
  explanation: 交叉驗證會使用多個切分進行訓練與驗證，使評估結果較穩定。
  tags:
  - chap-m6-ch3
  - sec-sklearn-evaluation
  usage: both
- id: 8028
  chapter_title: SciPy 與 scikit-learn
  section_title: 評估、交叉驗證與超參數搜尋
  text: 在分類不平衡問題中，只看 accuracy 可能有什麼風險？
  type: multiple_choice
  options:
  - 可能掩蓋少數類別預測很差的事實
  - 一定會讓模型無法執行
  - 會自動造成 GPU 記憶體不足
  - 會讓訓練資料變成非結構化資料
  correct_index: 0
  explanation: 多數類別比例很高時，模型只預測多數類別也可能有高 accuracy，因此還需觀察 precision、recall、F1 等指標。
  tags:
  - chap-m6-ch3
  - sec-sklearn-evaluation
  usage: both
- id: 8091
  chapter_title: SciPy 與 scikit-learn
  section_title: SciPy 的角色
  text: scipy.sparse 特別常用於哪一類資料表示？
  type: multiple_choice
  options:
  - 高維但大多數元素為 0 的稀疏矩陣，例如文字特徵
  - RGB 影像的通道轉換
  - PyTorch 模型的 state_dict
  - Docker container 的網路設定
  correct_index: 0
  explanation: 文字特徵如 Bag-of-Words 或 TF-IDF 常是高維稀疏矩陣，適合用 scipy.sparse 表示。
  tags:
  - chap-m6-ch3
  - sec-scipy-role
  usage: both
- id: 8092
  chapter_title: SciPy 與 scikit-learn
  section_title: 最佳化與曲線擬合
  text: 若最佳化問題中的 learning rate 或步長過大，常見結果是什麼？
  type: multiple_choice
  options:
  - 可能跳過最小值或導致 loss 發散
  - 模型一定會完美收斂
  - 資料集會自動變大
  - 所有特徵都會變成類別欄位
  correct_index: 0
  explanation: 步長過大可能讓參數更新過度，無法穩定接近最佳解。
  tags:
  - chap-m6-ch3
  - sec-scipy-optimize
  usage: both
- id: 8093
  chapter_title: SciPy 與 scikit-learn
  section_title: 前處理與 Pipeline
  text: 在 Pipeline 中，StandardScaler 應該在哪個資料集上 fit？
  type: multiple_choice
  options:
  - 只在訓練資料上 fit，再套用到驗證或測試資料
  - 在測試資料上 fit，再回頭套用到訓練資料
  - 在全部資料上 fit 後再切分
  - 不需要 fit，直接隨機產生平均值
  correct_index: 0
  explanation: 前處理參數應只由訓練資料學得，否則測試資料資訊會洩漏到訓練流程。
  tags:
  - chap-m6-ch3
  - sec-sklearn-preprocessing-pipeline
  usage: both
- id: 8094
  chapter_title: SciPy 與 scikit-learn
  section_title: 建立 Baseline 的重要性
  text: 建立 baseline 模型的主要目的不是什麼？
  type: multiple_choice
  options:
  - 一開始就保證達到最佳商業結果
  - 快速檢查資料是否有可學習訊號
  - 作為複雜模型的比較基準
  - 檢查評估流程是否合理
  correct_index: 0
  explanation: baseline 是簡單基準，用於比較與檢查，不保證是最佳最終模型。
  tags:
  - chap-m6-ch3
  - sec-sklearn-baseline
  usage: both
- id: 8095
  chapter_title: SciPy 與 scikit-learn
  section_title: Train、Validation、Test 的分工
  text: Validation set 的主要用途是什麼？
  type: multiple_choice
  options:
  - 選模型與調整超參數
  - 作為唯一訓練資料
  - 替代所有測試資料
  - 儲存模型權重
  correct_index: 0
  explanation: Validation set 會參與模型選擇與調參決策，因此不應當作最終客觀評估。
  tags:
  - chap-m6-ch3
  - sec-sklearn-data-splits
  usage: both
- id: 8096
  chapter_title: SciPy 與 scikit-learn
  section_title: 模型選擇的實務判斷
  text: 若資料是中小型表格資料，且需要快速建立 baseline，通常可優先考慮哪類工具？
  type: multiple_choice
  options:
  - scikit-learn 的傳統機器學習模型
  - 從零訓練大型語言模型
  - 手寫 CUDA kernel
  - 只使用 OpenCV 閾值處理
  correct_index: 0
  explanation: scikit-learn 對中小型表格資料、baseline 與傳統模型流程非常適合。
  tags:
  - chap-m6-ch3
  - sec-sklearn-model-selection
  usage: both
- id: 8097
  chapter_title: SciPy 與 scikit-learn
  section_title: 常見評估指標
  text: 在迴歸任務中，MAE 與 RMSE 主要用來評估什麼？
  type: multiple_choice
  options:
  - 預測連續數值的誤差大小
  - 文字 tokenizer 的詞彙表大小
  - 影像通道順序
  - DataLoader 的批次順序
  correct_index: 0
  explanation: MAE 與 RMSE 都是迴歸誤差指標，用於衡量預測值與真實連續目標的差距。
  tags:
  - chap-m6-ch3
  - sec-sklearn-metrics-detail
  usage: both
- id: 8098
  chapter_title: SciPy 與 scikit-learn
  section_title: scikit-learn 與深度學習的界線
  text: 下列哪一種任務通常更適合使用 PyTorch 而不是 scikit-learn？
  type: multiple_choice
  options:
  - 需要自訂神經網路並使用 GPU 訓練影像模型
  - 小型表格資料的 Logistic Regression baseline
  - CSV 欄位統計摘要
  - Pandas groupby 報表
  correct_index: 0
  explanation: PyTorch 適合自訂深度學習架構、GPU 訓練與影像、文字、語音等複雜資料。
  tags:
  - chap-m6-ch3
  - sec-sklearn-vs-deep-learning
  usage: both
