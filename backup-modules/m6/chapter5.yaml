questions:
- id: 8041
  chapter_title: PyTorch 基礎
  section_title: Tensor 與裝置
  text: PyTorch Tensor 與 NumPy array 相比，對深度學習特別重要的能力是什麼？
  type: multiple_choice
  options:
  - 可支援 GPU 運算與自動微分
  - 只能儲存文字
  - 不允許矩陣運算
  - 只能在瀏覽器中執行
  correct_index: 0
  explanation: PyTorch Tensor 支援裝置管理與 autograd，是深度學習訓練的核心。
  tags:
  - chap-m6-ch5
  - sec-pytorch-tensor-device
  usage: both
- id: 8042
  chapter_title: PyTorch 基礎
  section_title: Tensor 與裝置
  text: PyTorch 中模型與輸入 tensor 在不同 device 時，通常會發生什麼？
  type: multiple_choice
  options:
  - 可能產生執行錯誤，因為運算要求資料與模型在同一裝置
  - 模型會自動轉成 HTML
  - loss 永遠等於 0
  - optimizer 會自動刪除資料集
  correct_index: 0
  explanation: 模型參數與輸入 tensor 必須在同一 device，例如都在 CPU 或都在同一張 GPU。
  tags:
  - chap-m6-ch5
  - sec-pytorch-tensor-device
  usage: both
- id: 8043
  chapter_title: PyTorch 基礎
  section_title: Autograd 與反向傳播
  text: 在 PyTorch 中呼叫 loss.backward() 的主要作用是什麼？
  type: multiple_choice
  options:
  - 根據計算圖計算參數梯度
  - 自動儲存模型到雲端
  - 將所有 tensor 轉成 Pandas DataFrame
  - 把文字切成 token
  correct_index: 0
  explanation: backward 會依照計算圖執行反向傳播，將梯度累積到需要梯度的參數上。
  tags:
  - chap-m6-ch5
  - sec-pytorch-autograd
  usage: both
- id: 8044
  chapter_title: PyTorch 基礎
  section_title: Autograd 與反向傳播
  text: 訓練迴圈中通常需要呼叫 optimizer.zero_grad()，原因是什麼？
  type: multiple_choice
  options:
  - 清空上一輪累積的梯度，避免梯度被不當累加
  - 將 learning rate 設為 0
  - 刪除模型所有權重
  - 關閉 Dataset
  correct_index: 0
  explanation: PyTorch 預設梯度會累加，因此每次更新前通常要清空舊梯度。
  tags:
  - chap-m6-ch5
  - sec-pytorch-autograd
  usage: both
- id: 8045
  chapter_title: PyTorch 基礎
  section_title: Dataset 與 DataLoader
  text: PyTorch DataLoader 的主要責任是什麼？
  type: multiple_choice
  options:
  - 批次化、打亂與載入 Dataset 中的資料
  - 將所有模型轉成 scikit-learn estimator
  - 自動撰寫模型論文
  - 修改 Python 語言語法
  correct_index: 0
  explanation: DataLoader 根據 Dataset 產生 mini-batch，並可處理 shuffle 與平行讀取。
  tags:
  - chap-m6-ch5
  - sec-pytorch-dataset-dataloader
  usage: both
- id: 8046
  chapter_title: PyTorch 基礎
  section_title: nn.Module 與模型定義
  text: 自訂 PyTorch 模型時，forward 方法主要定義什麼？
  type: multiple_choice
  options:
  - 輸入資料如何通過模型各層得到輸出
  - 套件如何安裝
  - CSV 檔案如何合併
  - GPU 如何製造
  correct_index: 0
  explanation: forward 定義模型的前向傳播邏輯，通常透過 model(x) 間接呼叫。
  tags:
  - chap-m6-ch5
  - sec-pytorch-nn-module
  usage: both
- id: 8047
  chapter_title: PyTorch 基礎
  section_title: Loss、Optimizer 與訓練迴圈
  text: 使用 nn.CrossEntropyLoss 做多類別分類時，模型最後通常應輸出什麼？
  type: multiple_choice
  options:
  - 未經 softmax 的 logits
  - 已經轉成字串的機率表
  - 圖片檔案路徑
  - Pandas groupby 物件
  correct_index: 0
  explanation: CrossEntropyLoss 內部會處理 log-softmax，因此模型輸出 logits 即可。
  tags:
  - chap-m6-ch5
  - sec-pytorch-training-loop
  usage: both
- id: 8048
  chapter_title: PyTorch 基礎
  section_title: 儲存與載入模型
  text: PyTorch 實務上常儲存模型的 state_dict，主要保存的是什麼？
  type: multiple_choice
  options:
  - 模型參數權重的字典
  - 原始訓練資料全部內容
  - Jupyter Notebook 的所有輸出圖片
  - 作業系統使用者密碼
  correct_index: 0
  explanation: state_dict 保存模型各層參數，可由同樣架構的模型載入。
  tags:
  - chap-m6-ch5
  - sec-pytorch-save-load
  usage: both
- id: 8111
  chapter_title: PyTorch 基礎
  section_title: Tensor 與裝置
  text: 若要把 tensor 移到與模型相同的 GPU 或 CPU，通常會使用哪個方法？
  type: multiple_choice
  options:
  - to(device)
  - groupby()
  - fit_transform()
  - cvtColor()
  correct_index: 0
  explanation: PyTorch 中可用 tensor.to(device) 或 model.to(device) 將資料與模型移到指定裝置。
  tags:
  - chap-m6-ch5
  - sec-pytorch-tensor-device
  usage: both
- id: 8112
  chapter_title: PyTorch 基礎
  section_title: Dataset 與 DataLoader
  text: DataLoader 中 shuffle=True 通常在訓練資料上有什麼作用？
  type: multiple_choice
  options:
  - 每個 epoch 打亂資料順序，降低模型依賴固定順序
  - 將標籤全部改成 0
  - 將資料轉成 BGR
  - 自動增加模型層數
  correct_index: 0
  explanation: 訓練時打亂資料能讓 mini-batch 更隨機，通常有助於穩定訓練。
  tags:
  - chap-m6-ch5
  - sec-pytorch-dataset-dataloader
  usage: both
- id: 8113
  chapter_title: PyTorch 基礎
  section_title: nn.Module 與模型定義
  text: 為什麼通常用 model(x) 而不是直接呼叫 model.forward(x)？
  type: multiple_choice
  options:
  - model(x) 會經過 PyTorch Module 的標準呼叫流程與 hooks
  - forward 不能接收任何 tensor
  - model(x) 會自動下載資料集
  - forward 只適用於 NumPy
  correct_index: 0
  explanation: 直接呼叫 model(x) 會觸發 Module 的 __call__ 流程，包含 hooks 等 PyTorch 機制。
  tags:
  - chap-m6-ch5
  - sec-pytorch-nn-module
  usage: both
- id: 8114
  chapter_title: PyTorch 基礎
  section_title: Loss、Optimizer 與訓練迴圈
  text: 訓練分類模型時，loss.backward() 與 optimizer.step() 的先後順序通常為何？
  type: multiple_choice
  options:
  - 先 backward 計算梯度，再 step 更新參數
  - 先 step 更新參數，再 backward 清空資料
  - 兩者順序永遠不重要
  - 只需要 step，不需要 backward
  correct_index: 0
  explanation: optimizer.step() 依賴已計算好的梯度，因此必須先執行 loss.backward()。
  tags:
  - chap-m6-ch5
  - sec-pytorch-training-loop
  usage: both
- id: 8115
  chapter_title: PyTorch 基礎
  section_title: PyTorch 訓練流程的完整心智模型
  text: PyTorch 訓練流程中，保存最佳模型通常應依據哪一類資料集表現？
  type: multiple_choice
  options:
  - Validation set 表現
  - Training set 最後一個 batch 的 loss
  - 未切分的全部資料
  - 原始 CSV 檔案大小
  correct_index: 0
  explanation: Validation set 用於模型選擇，常以其指標決定是否保存目前最佳模型。
  tags:
  - chap-m6-ch5
  - sec-pytorch-training-mental-model
  usage: both
- id: 8116
  chapter_title: PyTorch 基礎
  section_title: Tensor Shape 與 dtype 常見規則
  text: 使用 CrossEntropyLoss 時，分類 target 通常應是什麼格式？
  type: multiple_choice
  options:
  - LongTensor 類別 id，shape 通常為 (batch,)
  - one-hot float 矩陣，且必須先 softmax
  - BGR 影像陣列
  - Pandas DataFrame 欄位名稱
  correct_index: 0
  explanation: CrossEntropyLoss 預期輸入為 logits，target 通常是 long 型別的類別 id。
  tags:
  - chap-m6-ch5
  - sec-pytorch-shape-dtype
  usage: both
- id: 8117
  chapter_title: PyTorch 基礎
  section_title: Learning Rate 與 Optimizer
  text: AdamW 與 Transformer 訓練中常見的 weight decay 有什麼關係？
  type: multiple_choice
  options:
  - AdamW 將 weight decay 與 Adam 更新解耦，常用於 Transformer 訓練
  - AdamW 只能用於 OpenCV
  - AdamW 會自動建立 tokenizer
  - AdamW 不需要梯度
  correct_index: 0
  explanation: AdamW 是深度學習常見 optimizer，尤其在 Transformer 訓練與微調中很常使用。
  tags:
  - chap-m6-ch5
  - sec-pytorch-optimizer-detail
  usage: both
- id: 8118
  chapter_title: PyTorch 基礎
  section_title: PyTorch 常見錯誤排查
  text: 若模型連 20 筆小資料都無法 overfit，最可能代表什麼？
  type: multiple_choice
  options:
  - 訓練程式、資料、loss 或標籤設定可能有基本錯誤
  - 模型一定已經泛化得很好
  - 測試資料太大
  - Pandas 沒有安裝
  correct_index: 0
  explanation: 小資料 overfit 測試是檢查訓練流程是否基本正確的常用方法。
  tags:
  - chap-m6-ch5
  - sec-pytorch-debugging
  usage: both
