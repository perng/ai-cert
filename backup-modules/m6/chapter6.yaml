questions:
- id: 8051
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: MLP 的基本架構
  text: MLP 主要由哪一類神經網路層組成？
  type: multiple_choice
  options:
  - Fully connected / Linear layers
  - 只由 OpenCV resize 函式組成
  - 只由 tokenizer 組成
  - 只由資料庫索引組成
  correct_index: 0
  explanation: 多層感知器主要由線性層與 activation function 堆疊而成。
  tags:
  - chap-m6-ch6
  - sec-pytorch-mlp
  usage: both
- id: 8052
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: MLP 的基本架構
  text: 二分類或多類別分類模型最後輸出維度通常應對應什麼？
  type: multiple_choice
  options:
  - 類別數
  - 訓練集檔案數
  - Python 版本號
  - CPU 核心數
  correct_index: 0
  explanation: 分類模型通常為每個類別輸出一個 logit，因此最後一層輸出維度對應類別數。
  tags:
  - chap-m6-ch6
  - sec-pytorch-mlp
  usage: both
- id: 8053
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 訓練 MLP
  text: 標準 PyTorch 訓練步驟中，optimizer.step() 的作用是什麼？
  type: multiple_choice
  options:
  - 根據梯度更新模型參數
  - 計算 token id
  - 將圖片讀成 BGR
  - 產生 DataFrame 欄位名稱
  correct_index: 0
  explanation: optimizer.step() 會根據目前梯度與最佳化演算法更新參數。
  tags:
  - chap-m6-ch6
  - sec-pytorch-train-mlp
  usage: both
- id: 8054
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: CNN 的核心觀念
  text: PyTorch 中影像 batch 給 CNN 的常見 shape 順序是什麼？
  type: multiple_choice
  options:
  - batch, channels, height, width
  - height, width, batch, channels
  - channels, width, batch, height
  - width, text, label, batch
  correct_index: 0
  explanation: PyTorch CNN 預設使用 NCHW 格式，也就是 batch、channels、height、width。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-concepts
  usage: both
- id: 8055
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: CNN 的核心觀念
  text: CNN 中卷積層的主要作用是什麼？
  type: multiple_choice
  options:
  - 從局部區域學習影像特徵
  - 將文字還原為字典詞形
  - 將資料表進行 groupby
  - 管理 Python 虛擬環境
  correct_index: 0
  explanation: 卷積層利用 kernel 在局部區域滑動，學習邊緣、紋理與更高階視覺特徵。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-concepts
  usage: both
- id: 8056
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 實作簡單 CNN
  text: CNN 中 Flatten 層常見用途是什麼？
  type: multiple_choice
  options:
  - 將卷積特徵圖攤平成向量，交給線性分類層
  - 將文字分詞
  - 將模型儲存成 CSV
  - 將 BGR 轉成 HSV
  correct_index: 0
  explanation: Flatten 會保留 batch 維度，將其餘維度展平成一個向量供 classifier 使用。
  tags:
  - chap-m6-ch6
  - sec-pytorch-simple-cnn
  usage: both
- id: 8057
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 資料增強與正規化
  text: 影像資料增強的主要目的為何？
  type: multiple_choice
  options:
  - 增加訓練資料多樣性，降低過擬合
  - 讓驗證資料也必須隨機變動
  - 刪除所有標籤
  - 將模型改成 scikit-learn Pipeline
  correct_index: 0
  explanation: 隨機裁切、翻轉與顏色變化等資料增強能讓模型學到較穩健的特徵。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-augmentation
  usage: both
- id: 8058
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 評估 CNN 與常見錯誤
  text: 驗證或推論 CNN 時使用 torch.no_grad() 的主要目的為何？
  type: multiple_choice
  options:
  - 關閉梯度記錄，降低記憶體使用並加速推論
  - 刪除所有模型參數
  - 將影像轉成文字
  - 強制模型進入訓練模式
  correct_index: 0
  explanation: 評估階段不需要反向傳播，no_grad 可避免建立計算圖。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-eval
  usage: both
- id: 8121
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: MLP 的基本架構
  text: 若 MLP 中完全不使用 activation function，多層線性層本質上會發生什麼？
  type: multiple_choice
  options:
  - 多層線性轉換仍可合併為單一線性轉換
  - 模型會自動變成 CNN
  - 模型會自動產生 tokenizer
  - loss 一定會等於 0
  correct_index: 0
  explanation: 沒有非線性 activation 時，多層線性層無法增加非線性表達能力。
  tags:
  - chap-m6-ch6
  - sec-pytorch-mlp
  usage: both
- id: 8122
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 訓練 MLP
  text: 在 epoch 訓練迴圈中累加 total_loss 的常見用途是什麼？
  type: multiple_choice
  options:
  - 計算該 epoch 的平均訓練 loss，觀察訓練趨勢
  - 將所有模型參數設為 0
  - 自動切換 BGR 與 RGB
  - 建立 Pandas merge key
  correct_index: 0
  explanation: 追蹤每個 epoch 的平均 loss 有助於觀察模型是否正在學習。
  tags:
  - chap-m6-ch6
  - sec-pytorch-train-mlp
  usage: both
- id: 8123
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: CNN 的核心觀念
  text: MaxPool2d 常見作用是什麼？
  type: multiple_choice
  options:
  - 降低特徵圖空間尺寸，保留局部重要訊號
  - 將文字轉為 token id
  - 將 loss 轉成 optimizer
  - 讀取 CSV 欄位名稱
  correct_index: 0
  explanation: Pooling 可降低特徵圖大小與計算量，也增加對小幅位移的穩定性。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-concepts
  usage: both
- id: 8124
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: 實作簡單 CNN
  text: 若 CNN 輸入影像尺寸改變，最容易需要同步調整哪一個部分？
  type: multiple_choice
  options:
  - Flatten 後接到 Linear 層的輸入維度
  - Python 的 import 語法
  - optimizer.zero_grad 的名稱
  - YAML 的 usage 欄位
  correct_index: 0
  explanation: 卷積與 pooling 後的特徵圖尺寸會影響 Flatten 後大小，因此 Linear 輸入維度可能需要調整。
  tags:
  - chap-m6-ch6
  - sec-pytorch-simple-cnn
  usage: both
- id: 8125
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: MLP 適合與不適合的資料
  text: 為什麼不建議直接把原始影像攤平成向量交給 MLP 作為主要方法？
  type: multiple_choice
  options:
  - 會失去影像中的空間鄰近結構，CNN 通常更適合
  - MLP 完全不能處理任何數值
  - MLP 只能處理文字
  - 影像不能轉成 tensor
  correct_index: 0
  explanation: CNN 利用局部感受野與權重共享保留影像空間結構，通常比直接 flatten 給 MLP 更適合。
  tags:
  - chap-m6-ch6
  - sec-pytorch-mlp-use-cases
  usage: both
- id: 8126
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: Activation、Normalization 與 Dropout
  text: Dropout 在訓練與推論時的行為有何差異？
  type: multiple_choice
  options:
  - 訓練時隨機關閉部分神經元，推論時關閉這種隨機行為
  - 訓練時完全不作用，推論時隨機刪除標籤
  - 只會影響 Pandas DataFrame
  - 只會改變影像通道順序
  correct_index: 0
  explanation: Dropout 是正規化方法，依賴 model.train() 與 model.eval() 切換不同模式。
  tags:
  - chap-m6-ch6
  - sec-pytorch-network-components
  usage: both
- id: 8127
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: Transfer Learning 與預訓練模型
  text: 影像資料量不大時，使用預訓練 CNN 進行 transfer learning 的主要好處是什麼？
  type: multiple_choice
  options:
  - 利用模型已學到的通用視覺特徵，降低資料需求與訓練成本
  - 讓資料標註完全不需要檢查
  - 保證不需要驗證集
  - 讓所有模型只能輸出一個類別
  correct_index: 0
  explanation: 預訓練 backbone 已學到邊緣、紋理與形狀等特徵，常能提升小資料任務效果。
  tags:
  - chap-m6-ch6
  - sec-pytorch-transfer-learning
  usage: both
- id: 8128
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: CNN 專案的錯誤分析方法
  text: 混淆矩陣在 CNN 分類專案中主要幫助我們觀察什麼？
  type: multiple_choice
  options:
  - 哪些類別容易被模型互相混淆
  - optimizer 是否支援 GPU
  - Python 是否使用虛擬環境
  - OpenCV 是否以 BGR 讀圖
  correct_index: 0
  explanation: 混淆矩陣可顯示真實類別與預測類別的對應，幫助找出常見錯誤類別對。
  tags:
  - chap-m6-ch6
  - sec-pytorch-cnn-error-analysis
  usage: both
