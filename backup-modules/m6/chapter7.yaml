questions:
- id: 8061
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 中 self-attention 的核心作用是什麼？
  type: multiple_choice
  options:
  - 讓每個 token 能根據序列中其他 token 的資訊更新表示
  - 將所有影像轉成灰階
  - 將 DataFrame 依欄位分組
  - 自動建立 Python 虛擬環境
  correct_index: 0
  explanation: Self-attention 讓序列中不同位置能互相參考，捕捉上下文關係。
  tags:
  - chap-m6-ch7
  - sec-transformer-core-idea
  usage: both
- id: 8062
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 為何需要位置資訊？
  type: multiple_choice
  options:
  - Self-attention 本身不內建 token 順序概念
  - 因為 embedding 只能處理影像
  - 因為 optimizer 需要知道檔案路徑
  - 因為 CrossEntropyLoss 只能讀取日期
  correct_index: 0
  explanation: 如果沒有位置資訊，模型難以區分相同 token 在不同位置的序列意義。
  tags:
  - chap-m6-ch7
  - sec-transformer-core-idea
  usage: both
- id: 8063
  chapter_title: PyTorch Transformer 基礎
  section_title: Embedding 與位置資訊
  text: nn.Embedding 的主要功能是什麼？
  type: multiple_choice
  options:
  - 將 token id 映射成可訓練向量表示
  - 將 RGB 影像轉成 BGR
  - 執行 Pandas merge
  - 清空梯度
  correct_index: 0
  explanation: Embedding layer 會把離散 token id 轉成連續向量，供神經網路處理。
  tags:
  - chap-m6-ch7
  - sec-transformer-embedding-position
  usage: both
- id: 8064
  chapter_title: PyTorch Transformer 基礎
  section_title: MultiheadAttention 基礎
  text: 在 self-attention 中，query、key、value 通常來自哪裡？
  type: multiple_choice
  options:
  - 同一個輸入序列
  - 三個完全不相關的資料庫
  - OpenCV 的 BGR channel
  - Python 的虛擬環境名稱
  correct_index: 0
  explanation: Self-attention 的 Q、K、V 都由同一序列轉換而來，使序列內部位置互相注意。
  tags:
  - chap-m6-ch7
  - sec-transformer-attention
  usage: both
- id: 8065
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer Encoder 分類器
  text: 在簡化 Transformer 分類器中，pooling 的主要用途是什麼？
  type: multiple_choice
  options:
  - 將序列中多個 token 表示整合成單一向量供分類
  - 將 GPU 改成 CPU
  - 將 YAML 轉成 HTML
  - 將圖片進行邊緣偵測
  correct_index: 0
  explanation: 分類器通常需要整體序列表示，因此會使用 mean pooling、CLS token 或其他聚合方式。
  tags:
  - chap-m6-ch7
  - sec-transformer-classifier
  usage: both
- id: 8066
  chapter_title: PyTorch Transformer 基礎
  section_title: Mask 與序列長度
  text: padding mask 的主要作用是什麼？
  type: multiple_choice
  options:
  - 告訴模型哪些位置是補齊 token，不應當成真實內容
  - 將所有 token 隨機刪除
  - 將影像大小固定為 224x224
  - 將 optimizer learning rate 設為 0
  correct_index: 0
  explanation: padding mask 能避免模型把補齊用的 token 當作有效文字內容。
  tags:
  - chap-m6-ch7
  - sec-transformer-mask
  usage: both
- id: 8067
  chapter_title: PyTorch Transformer 基礎
  section_title: Mask 與序列長度
  text: 自回歸語言模型使用 causal mask 的主要原因是什麼？
  type: multiple_choice
  options:
  - 防止模型在訓練時偷看未來 token
  - 防止 OpenCV 讀取圖片
  - 防止 Pandas 進行 groupby
  - 防止 DataLoader 建立 batch
  correct_index: 0
  explanation: 自回歸生成需根據過去預測下一個 token，因此 causal mask 會遮住未來位置。
  tags:
  - chap-m6-ch7
  - sec-transformer-mask
  usage: both
- id: 8068
  chapter_title: PyTorch Transformer 基礎
  section_title: 從簡化模型到大型語言模型
  text: 從簡化 Transformer 到大型語言模型，哪些基礎元件仍然重要？
  type: multiple_choice
  options:
  - Embedding、attention、feed-forward、normalization 與 optimizer
  - 只有 OpenCV 的 Canny edge detector
  - 只有 Pandas 的 merge
  - 只有 Python 的 print 函式
  correct_index: 0
  explanation: LLM 雖然規模巨大，但仍建立在 Transformer 的核心元件與訓練流程上。
  tags:
  - chap-m6-ch7
  - sec-transformer-to-llm
  usage: both
- id: 8131
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Multi-head attention 中使用多個 head 的主要直覺是什麼？
  type: multiple_choice
  options:
  - 讓模型能在不同子空間學習不同關係
  - 讓模型不需要 embedding
  - 讓輸入 token 不需要位置資訊
  - 讓所有參數固定不訓練
  correct_index: 0
  explanation: 多個 attention head 可同時捕捉不同類型的關係，例如局部片語、語法或長距離依賴。
  tags:
  - chap-m6-ch7
  - sec-transformer-core-idea
  usage: both
- id: 8132
  chapter_title: PyTorch Transformer 基礎
  section_title: Embedding 與位置資訊
  text: 若 positional embedding 的最大長度小於輸入序列長度，最可能發生什麼？
  type: multiple_choice
  options:
  - 長文本位置 id 超出可表示範圍，造成錯誤或無法處理
  - 模型會自動變成 CNN
  - tokenizer 會改用 OpenCV
  - loss 會永遠等於 0
  correct_index: 0
  explanation: 可學習位置 embedding 有固定大小，輸入序列長度不可超過其可表示位置範圍。
  tags:
  - chap-m6-ch7
  - sec-transformer-embedding-position
  usage: both
- id: 8133
  chapter_title: PyTorch Transformer 基礎
  section_title: MultiheadAttention 基礎
  text: 當 nn.MultiheadAttention 設定 batch_first=True 時，輸入 shape 通常為何？
  type: multiple_choice
  options:
  - batch, seq_len, d_model
  - seq_len, d_model, batch
  - channels, height, width
  - rows, columns, labels
  correct_index: 0
  explanation: batch_first=True 時，PyTorch attention 接受 batch 在第一維的輸入格式。
  tags:
  - chap-m6-ch7
  - sec-transformer-attention
  usage: both
- id: 8134
  chapter_title: PyTorch Transformer 基礎
  section_title: Attention 的直覺與限制
  text: Attention 公式中除以 sqrt(d_k) 的主要目的為何？
  type: multiple_choice
  options:
  - 避免 dot product 隨維度變大而使 softmax 過度尖銳
  - 將所有 token id 轉成文字
  - 取代 optimizer
  - 讓模型不需要資料
  correct_index: 0
  explanation: scale dot-product attention 會除以 sqrt(d_k)，讓數值範圍較穩定。
  tags:
  - chap-m6-ch7
  - sec-transformer-attention-intuition
  usage: both
- id: 8135
  chapter_title: PyTorch Transformer 基礎
  section_title: Encoder、Decoder 與 Encoder-Decoder
  text: BERT 類模型通常屬於哪一種 Transformer 架構？
  type: multiple_choice
  options:
  - Encoder-only
  - Decoder-only
  - OpenCV-only
  - DataFrame-only
  correct_index: 0
  explanation: BERT 使用 encoder-only 架構，適合理解、分類、檢索與序列標註等任務。
  tags:
  - chap-m6-ch7
  - sec-transformer-architectures
  usage: both
- id: 8136
  chapter_title: PyTorch Transformer 基礎
  section_title: Tokenizer 與 Subword
  text: Subword tokenizer 的一個重要優點是什麼？
  type: multiple_choice
  options:
  - 能處理罕見詞與新詞，並控制詞彙表大小
  - 只能處理灰階影像
  - 會刪除所有位置資訊
  - 不需要 embedding layer
  correct_index: 0
  explanation: BPE、WordPiece、SentencePiece 等 subword 方法可把罕見詞拆成較小片段，降低 unknown token 問題。
  tags:
  - chap-m6-ch7
  - sec-transformer-tokenizer
  usage: both
- id: 8137
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 訓練時的 Loss
  text: 自回歸語言模型訓練中 shifted labels 的核心概念是什麼？
  type: multiple_choice
  options:
  - 每個位置學習預測下一個 token
  - 每個位置都預測前一張影像
  - 每個 token 都被轉成 DataFrame 欄位
  - 每個 batch 都不需要 loss
  correct_index: 0
  explanation: 自回歸模型以目前與過去 token 預測下一個 token，因此 target 通常相對 input 位移一格。
  tags:
  - chap-m6-ch7
  - sec-transformer-loss
  usage: both
- id: 8138
  chapter_title: PyTorch Transformer 基礎
  section_title: Fine-tuning、Feature Extraction 與 RAG
  text: 當知識內容經常更新時，RAG 相較於頻繁 fine-tuning 的常見優勢是什麼？
  type: multiple_choice
  options:
  - 可透過更新外部知識庫反映新資訊，不一定要重訓模型
  - 一定不需要檢索品質評估
  - 可完全避免幻覺
  - 會讓模型參數自動變小
  correct_index: 0
  explanation: RAG 將外部知識檢索後放入上下文，知識更新可集中在資料庫或索引，而不必每次重訓模型。
  tags:
  - chap-m6-ch7
  - sec-transformer-application-patterns
  usage: both
