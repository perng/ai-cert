- file: subjects/ai-foundation/chapter10.yaml
  id: 115-1-37
  text: 某紡織製造公司導入 AI 系統進行布料瑕疵檢測，每天需處理來自 30 條產線的影115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 第一科：人工智慧基礎概論
    考試日期：115 年 03 月 21 日 第 9 頁，共 12 頁  答案 題目 像資料，包括高解析度照片、感測器數值、生產參數記錄等多種格式。該公司收集的資料量從每日
    2GB 增長至 50GB，且需在布料離開產線前的 3 秒內完成瑕疵判定。近期團隊發現系統在尖峰時段容易出現判定延遲，影響製程節奏。若要優先改善此問題，下列哪一種做法最適合？    （115年第一梯次）
  options:
  - 擴充資料儲存容量，以因應長期資料累積需求
  - 強化即時資料處理與推論計算資源配置，以降低延遲風險
  - 調整資料格式標準，以降低跨來源整合複雜度
  - 增加資料驗證與清理機制，以提升資料品質穩定性
  correct_index: 1
  explanation: 本題測驗相關核心概念。正確解答為「強化即時資料處理與推論計算資源配置，以降低延遲風險」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11410_1'
  text: 根據《金融機構運用人工智慧技術作業規範》 ，金融機構須建立內部治 理架構，並指定專責單位或人員負責推動及管理人工智慧事務，下列何 者並非規範所明訂須落實的治理措施？
    (114年第四梯次)
  options:
  - 辦理人工智慧人才培育 (Conducting AI Talent Training)，培養 AI 專業人才。
  - 清楚了解生成式 AI 技術之運作模式 (Clearly Understanding Operation Mode of Generative AI Technology)，理解技術運作原理。
  - 每日公布人工智慧系統運作狀況 (Daily Publication of AI System Operation Status)，每日公開系統狀態。
  - 指派高階主管或委員會進行監督管理 (Assigning Senior Executives or Committee for Supervision and
    Management)，建立監督機制。
  correct_index: 2
  explanation: 金融機構運用 AI 需遵循嚴格的治理規範，包括建立專責單位、風險評估、模型監控與消費者權益保護。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11409_1'
  text: 根據 2025 年 9 月行政院通過之《人工智慧基本法》草案，政府推動人 工智慧之「創新實驗環境」制度，主要參考歐盟的何種制度？ (114年第四梯次)
  options:
  - Data Protection Impact Assessment (資料保護影響評估)，評估資料保護的影響。
  - Regulatory Sandbox (監理沙盒)，提供創新實驗環境的制度。
  - AI Trust Label (AI 信任標章)，AI 產品的認證標章。
  - AI Ethics Review Board (AI 倫理審查委員會)，倫理審查的組織。
  correct_index: 1
  explanation: 此題涉及 AI 法規與標準 的核心概念。正確答案為「Regulatory Sandbox」。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11425_2'
  text: 在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列  答案 題    目 哪種資料處理策略屬於常見的「資料去偏（Data Debiasing）
    」做法？ (114年第四梯次)
  options:
  - 讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差 (Randomly Replacing Outputs During Training to Offset
    Systematic Bias in Data)，隨機替換輸出。
  - 增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見 (Increasing Model Parameters, Relying on Larger Models
    to Automatically Eliminate Bias in Original Data)，擴大模型規模。
  - 調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避 免模型過度偏向出現頻率高的類別 (Adjusting or Expanding Training
    Corpus to Balance Proportions of Different Groups or Types, Avoiding Model Over-Biasing
    Toward High-Frequency Categories)
  - 對訓練資料施加額外正則化或噪音，使模型在學習過程中對偏見敏 感度降低 (Applying Additional Regularization or Noise
    to Training Data, Reducing Model Sensitivity to Bias During Learning)，加入正則化或噪音。
  correct_index: 2
  explanation: 演算法偏見通常源自訓練數據的偏差。若數據本身包含歷史歧視，模型便會學習並放大這些偏見。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11442_1'
  text: 一家跨國醫療研究機構希望利用各地醫院的病患資料，建立一個能夠 預測疾病早期風險的機器學習模型。由於各國法規限制，病患的原始資  答案 題    目
    料無法集中到單一伺服器。在此情境下，下列哪一種方法最能同時滿足 「各醫院保留資料不外流」與「模型仍能跨院學習」的需求？ (114年第四梯次)
  options:
  - 資料匿名化（Data Anonymization）(Data Anonymization)，移除個人識別資訊。
  - 差分隱私（Differential Privacy）(Differential Privacy)，加入雜訊保護隱私。
  - 聯邦學習（Federated Learning）(Federated Learning)，資料不離地的分散式學習。
  - 交叉驗證（Cross-validation）(Cross-Validation)，模型驗證的方法。
  correct_index: 2
  explanation: 此題涉及 AI 法規與標準 的核心概念。正確答案為「聯邦學習（Federated Learning）」。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11423_2'
  text: 下列何者不是我國數位發展部 AI 產品與系統評測中心對生成式 AI 的 評測項目? (114年第四梯次)
  options:
  - 當責性 (Accountability)，責任歸屬的明確性。
  - 可靠性 (Reliability)，系統的可靠程度。
  - 隱私及資安 (Privacy and Information Security)，隱私與資訊安全。
  - 互動性 (Interactivity)，使用者互動的能力。
  correct_index: 3
  explanation: 此題涉及 AI 產品評估標準 的核心概念。正確答案為「互動性」。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11405_1'
  text: 在機器學習中， 「偏差與變異權衡（Bias-Variance Tradeoff） 」主要用 來解決下列哪一類型的問題？ (114年第四梯次)
  options:
  - 因資料來源或收集方式限制，導致模型學習到的資訊不足 (Insufficient Information Learned Due to Data Source
    or Collection Method Limitations)，資料不足的問題。
  - 測試資料樣本與訓練資料高度重複，造成模型泛化能力評估失準 (High Overlap Between Test and Training Data, Causing
    Inaccurate Generalization Assessment)，資料重複的問題。
  - 訓練資料中類別分布不均，使模型在少數類別上表現不佳 (Uneven Class Distribution in Training Data, Causing
    Poor Performance on Minority Classes)，類別不平衡的問題。
  - 如何在模型偏差與變異之間取得平衡，以避免過度擬合或欠擬合 (How to Balance Model Bias and Variance to Avoid
    Overfitting or Underfitting)
  correct_index: 3
  explanation: 演算法偏見通常源自訓練數據的偏差。若數據本身包含歷史歧視，模型便會學習並放大這些偏見。
- file: subjects/ai-foundation/chapter11.yaml
  id: '11449_4'
  text: 下列何者並非我國數位發展部 AI 產品與評測中心在評估大型語言模 型安全性時，所指出的常見使用指標？ (114年第四梯次)
  options:
  - 資料複雜性 (Data Complexity)，資料本身的複雜程度。
  - 事實正確性 (Factual Correctness)，輸出內容的正確性。
  - 偏見與歧視 (Bias and Discrimination)，模型中的偏見問題。
  - 惡意與濫用可能性 (Malicious Use and Abuse Potential)，被惡意使用的風險。
  correct_index: 0
  explanation: 此題涉及 AI 產品評估標準 的核心概念。正確答案為「資料複雜性」。
- file: subjects/ai-foundation/chapter7.yaml
  id: '11416_2'
  text: 某團隊想採用循環神經網路（Recurrent Neural Network, RNN）建構 長期氣候數據的預測模型，以下哪一項敘述最符合使用 RNN
    可能會遇 到的挑戰？ (114年第四梯次)
  options:
  - RNN 無法處理可變長度的序列輸入，因此在實務上限制極大
  - RNN 在長序列訓練中可能出現梯度消失，影響模型效果
  - RNN 無法捕捉時間上的依賴關係，因此預測準確度低
  - RNN 只能用於分類任務，不能應用於時間序列預測
  correct_index: 1
  explanation: RNN 適合處理時間序列數據，但存在梯度消失問題。LSTM 透過門控機制（遺忘門、輸入門、輸出門）有效解決了此問題，能記憶長期資訊。
- file: subjects/ai-foundation/chapter7.yaml
  id: '11447_3'
  text: 在訓練神經網路時，為了提升模型收斂速度與穩定性，避免梯度消失或 梯度爆炸，下列哪一種做法最常被使用？ (114年第四梯次)
  options:
  - 對輸入資料進行隨機旋轉或水平翻轉，以增加資料多樣性
  - 選用 ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播
  - 減少樣本量提升訓練速度
  - 對目標變數或特徵進行標準化
  correct_index: 1
  explanation: 此題涉及 神經網路基礎 的核心概念。正確答案為「選用 ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播」。
- file: subjects/ai-foundation/chapter7.yaml
  id: '11424_2'
  text: 在保持 GPT-OSS 模型架構不變的前提下，如果將模型參數量從20 億提 升至 120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？ (114年第四梯次)
  options:
  - 模型參數增加會線性提升效能，且即使訓練資料不變也不會遇到瓶 頸
  - 參數越多模型推理越快，因為每層可以並行計算更多參數
  - 較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資 料支持
  - 增加參數量不影響記憶體使用，只會影響計算速度
  correct_index: 2
  explanation: 此題涉及 Transformer 與自注意力機制 的核心概念。正確答案為「較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資
    料支持」。
- file: subjects/ai-foundation/chapter7.yaml
  id: '11427_2'
  text: 在大型 Transformer 模型的效能優化過程中，常見的方法之一是「剪 枝（Pruning） 」 。下列哪一項最符合該方法的核心概念？ (114年第四梯次)
  options:
  - 將模型中所有權重按比例縮小，使其值更接近零，以降低計算量
  - 移除模型中影響較小或冗餘的部分權重參數，以減少模型大小並提 升推理效率
  - 在訓練時僅更新部分權重而將其他權重凍結，從而減少需要調整的 參數數量
  - 根據注意力分數動態跳過處理部分輸入 Token，以減少每次前向傳 播的計算
  correct_index: 1
  explanation: Transformer 架構的核心是 Self-Attention 機制，它能平行處理序列數據並捕捉長距離依賴，解決了 RNN 無法平行化且易遺忘的問題。
- file: subjects/ai-foundation/chapter7.yaml
  id: '11428_2'
  text: 對非常長的輸入序列進行推理（Inference），Transformer 模型推理的 主要計算瓶頸通常是什麼？ (114年第四梯次)
  options:
  - 模型輸出層產生文本的過程，因為每生成一個詞都必須重新訓練整 個模型一次
  - 詞嵌入 (Embedding) 查找操作，因為其時間複雜度隨詞彙表大小 指數級增長
  - Softmax 函數的計算，因為對每個 Token 都需要執行繁重的運算
  - 自注意力層的計算和其記憶體使用，因為注意力矩陣的大小隨序列 長度呈平方級增長  答案 題    目
  correct_index: 3
  explanation: Transformer 架構的核心是 Self-Attention 機制，它能平行處理序列數據並捕捉長距離依賴，解決了 RNN 無法平行化且易遺忘的問題。
- file: subjects/ai-foundation/chapter7.yaml
  id: 115-1-33
  text: 某公車系統想預測各站點的到站時間，需要考慮歷史班次資料、即時路況、天氣115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 第一科：人工智慧基礎概論
    考試日期：115 年 03 月 21 日 第 8 頁，共 12 頁  答案 題目 等因素。由於路況變化複雜，傳統循環神經網路（Recurrent Neural
    Network, RNN）在建模時可能難以保留較早期的重要資訊。下列哪種架構最能解決這個問題？ （115年第一梯次）
  options:
  - '卷積神經網路（Convolutional Neural Network, CNN） ，利用卷積層捕捉局部特

    徵'
  - 自編碼器（Autoencoder, AE） ，先進行資料壓縮再重建
  - 全連接神經網路（Fully Connected Neural Network, FCNN） ，增加隱藏層數量
  - '長短期記憶網路（Long Short-Term Memory, LSTM） ，改善RNN 的長期記憶問

