- file: subjects/gen-ai/chapter3.yaml
  id: '11421_3'
  text: 某公司開發的智慧車載語音助理，可透過語音辨識（ASR）辨識駕駛語 音，再由 LLM 生成回答並查詢車載 API。測試中發現：ASR 對汽車專 業術語辨識錯誤率高；LLM
    的回覆常不精確；系統回覆延遲雖存在但仍 可接受。若目標是「優先提升準確性與回答品質」 ，下列改進步驟的最 合理執行順序為何？ 1. 擴充並標註汽車領域語音資料，微調
    ASR 模型 2. 微調 LLM 並加入檢索增強（RAG） 3. 優化系統架構，引入批次推論降低延遲 4. 動態調整生成溫度，平衡準確度與多樣性 (114年第四梯次)
  options:
  - 1 → 2 → 4 → 3
  - 2 → 1→ 3 → 4
  - 1 → 3 → 2 → 4
  - 3 → 1 → 2 → 4
  correct_index: 0
  explanation: RAG (Retrieval-Augmented Generation) 結合檢索系統與生成模型，能引入外部即時資訊，有效減少幻覺並提升回答的準確性。
- file: subjects/gen-ai/chapter3.yaml
  id: '11442_3'
  text: 某金融機構導入檢索增強生成（ Retrieval-Augmented Generation, RAG）模型，用於客服文件查詢與自動回覆。由於大型模型運算成本過
    高，若考慮引入知識蒸餾（Knowledge Distillation, KD）技術，下列 何者為帶來的主要效益？ (114年第四梯次)
  options:
  - 讓小型模型學習大型模型的知識，在降低運算成本的同時維持檢索與生成品質
  - 只能應用於語音或影像辨識，無法提升文字檢索生成效能
  - 因為 RAG 已有檢索機制，因此無需額外蒸餾知識
  - 僅能依賴特定 API 供應商才能使用，無法在自建模型中實現
  correct_index: 0
  explanation: RAG (Retrieval-Augmented Generation) 結合檢索系統與生成模型，能引入外部即時資訊，有效減少幻覺並提升回答的準確性。
- file: subjects/gen-ai/chapter3.yaml
  id: '11447_6'
  text: 某顧問公司導入生成式 AI，協助團隊快速檢索並摘要長篇的法規文件。 為了改善檢索結果常出現不相關或過於分散內容的問題，下列何者為 團隊決定對文件進行文本切分（Chunking）的主要目的？
    (114年第四梯次)
  options:
  - 讓模型在回答時能加快推理速度
  - 提高檢索相關性與降低長上下文噪音
  - 降低系統記憶體和硬體資源的負擔
  - 使模型在生成回覆時更具創造性與多樣化
  correct_index: 0
  explanation: 此題涉及 某顧問公司導入生成式... 的核心概念。正確答案為「讓模型在回答時能加快推理速度；」。
- file: subjects/gen-ai/chapter3.yaml
  id: 115010
  text: 某企業建置檢索增強生成（Retrieval-augmented generation, RAG）系統支援內部知 識查詢。隨著使用量提升，團隊發現模型回覆品質穩定，但推論延遲與運算成本
    逐漸增加。專案規劃在維持回覆品質前提下進行效能優化。在此情境下，若採用 知識蒸餾（Knowledge Distillation） ，下列敘述何者最為合理？（115年第一梯次）
  options:
  - 將檢索資料轉換為結構化規則以取代模型；
  - 僅透過增加檢索文件數量改善效能；
  - 停用生成模型以避免延遲問題；
  - 使小型模型學習大型模型行為，以降低推論成本
  correct_index: 3
  explanation: 知識蒸餾（Knowledge Distillation）是將大型教師模型的能力轉移給較小的學生模型，從而在維持相近回覆品質的前提下降低運算成本與推論延遲。
- file: subjects/gen-ai/chapter3.yaml
  id: 115012
  text: 下列何者最能正確說明 Model Context Protocol（MCP）與檢索增強生成 （Retrieval-Augmented Generation,
    RAG）在功能定位上的主要差異？（115年第一梯次）
  options:
  - MCP 主要用於降低模型訓練成本；RAG 主要用於提升推論速度；
  - MCP 著重模型與外部工具或系統互動；RAG 著重補充模型知識來源；
  - RAG 必須依賴向量資料庫；MCP 不需任何外部整合；
  - RAG 屬標準化通訊協議；MCP 屬資料檢索技術
  correct_index: 1
  explanation: Model Context Protocol (MCP) 主要用於建立模型與外部工具/系統互動的標準化介面，而 RAG 的主要目的是檢索外部知識庫以補充模型的資訊。
- file: subjects/gen-ai/chapter3.yaml
  id: 115013
  text: 某企業建置文件型知識查詢系統，將大量長篇內部文件轉換為可供生成式 AI 使用 的知識來源。在測試過程中，團隊發現若直接以整份文件進行檢索，模型回覆常
    包含無關內容，且引用段落不夠精準。團隊評估後，決定導入 Chunking 機制的主 要目的為何？（115年第一梯次）
  options:
  - 透過縮短輸入長度，加速模型推理流程；
  - 提升檢索結果的語意對齊程度，並降低長文件帶來的干擾；
  - 減少模型執行時的記憶體使用量，以提升系統穩定性；
  - 讓模型在生成回覆時具備更高的創意發揮空間
  correct_index: 1
  explanation: 將長文件切塊（Chunking）能提升向量檢索的精準度，確保模型只取用最相關的段落，從而降低長文件無關內容的干擾。
- file: subjects/gen-ai/chapter3.yaml
  id: 115016
  text: 某企業建置 Agentic AI 系統處理跨部門複雜任務，團隊以解決方案圖譜（Solution Graph）作為規劃框架。下列何者為 Solution
    Graph 的主要功能？（115年第一梯次）
  options:
  - 取代語言模型推理機制，改以圖形搜尋完成決策；
  - 作為任務知識庫，用於儲存 AI 已完成案例以供檢索；
  - 限制代理（Agent）僅能依固定流程執行，以降低行為不確定性；
  - 定義代理（Agent）可參考的任務分解與決策路徑結構
  correct_index: 3
  explanation: Solution Graph 是一種結構化的任務規劃框架，用來定義 Agent 解決複雜問題時的任務分解邏輯與決策路徑。
- file: subjects/gen-ai/chapter3.yaml
  id: 115018
  text: 關於 ChatGPT、Anthropic Claude、GitHub Copilot 等 AI 程式碼輔助工具的運作原 理，下列敘述何者正確？（115年第一梯次）
  options:
  - 這些工具基於大型語言模型，經由大量程式碼與文本訓練，透過預測下一個符 號來生成程式碼，但不保證產生程式碼的正確性；
  - GitHub Copilot 會在提供程式碼建議前執行並驗證該程式碼，確保其執行結果 正確無誤；
  - Anthropic Claude 的程式碼建議並非即時生成，而是從事先整理的已知解答資料 庫中檢索而得；
  - ChatGPT 內建完整的編譯器，可在輸出程式碼前自動編譯並更正所有語法與邏 輯錯誤 第二科：生成式 AI 應用與規劃
  correct_index: 0
  explanation: 如 Copilot 這類的程式碼輔助工具是基於語言模型預測下一個 Token 來生成程式碼，雖然語法通常正確，但並無法保證邏輯絕對正確，仍需開發者審查。
- file: subjects/gen-ai/chapter3.yaml
  id: 115020
  text: 在規劃生成式 AI 解決方案時，下列何種應用場景最適合採用 GPT-Realtime 類型 模型？（115年第一梯次）
  options:
  - 需長時間批次處理的大規模報表生成任務；
  - 即時資料查詢與結構化資訊檢索系統；
  - 即時語音客服與互動式 AI 代理；
  - 以高一致性為優先的法規文件自動摘要
  correct_index: 2
  explanation: GPT-Realtime 類型的模型專注於極低延遲的語音與文字互動，最適合用於即時語音客服與互動式對話代理。
- file: subjects/gen-ai/chapter3.yaml
  id: 115026
  text: 某支付平台為了強化洗錢行為檢測，計劃導入生成式 AI 技術來輔助分析可疑交易 模式。該平台擁有大量歷史交易記錄和已知洗錢案例資料，希望 AI 能自動生成可
    疑交易的特徵描述報告。下列哪一種生成式 AI 技術最適合此需求？（115年第一梯次）
  options:
  - 使用 Midjourney 生成交易流程圖像；
  - 採用 Few-shot Learning 訓練圖像識別模型；
  - 運用 RAG 檢索增強生成技術結合歷史案例資料庫；
  - 直接使用 ChatGPT 的基礎模型進行分析
  correct_index: 2
  explanation: 洗錢特徵分析需要比對大量歷史案例，採用 RAG 檢索增強生成技術能讓模型在生成報告時動態參考最新的內部案例資料庫。
- file: subjects/gen-ai/chapter3.yaml
  id: 115035
  text: 在生成式 AI 文字生成模型設計中，Encoder–Decoder 與 Decoder-only 為常見架 構。下列何者最能正確說明兩者在資訊處理與生成機制上的核心差異？（115年第一梯次）
  options:
  - Encoder–Decoder 透過編碼與解碼階段處理序列，Decoder-only 則以單一模型完 成處理；
  - Encoder–Decoder 區分輸入理解與內容生成階段，Decoder-only 以單一模型同時 處理上下文與生成；
  - Decoder-only 架構主要依賴外部知識檢索，Encoder–Decoder 則不需要；
  - Encoder–Decoder 架構僅適用於翻譯任務，Decoder-only 架構較適合對話任務
  correct_index: 1
  explanation: Encoder-Decoder 架構（如 T5）會先將輸入編碼為內部表示再解碼生成，而 Decoder-only 架構（如 GPT）則以單一模型透過自迴歸方式同時處理上下文並生成後續內容。
- file: subjects/gen-ai/chapter3.yaml
  id: 115040
  text: 某企業導入大型語言模型（LLM）進行客服自動化，並已透過 Fine-Tuning 學習企 業標準問答範例，但在實務運作中仍出現回應策略未符合服務優先順序及語氣與
    品牌風格不一致的情況，因此技術團隊建議再導入 Reinforcement Fine-tuning （RFT）機制進行優化，其主要目的為何？（115年第一梯次）
  options:
  - 擴展模型的知識涵蓋範圍與資料記憶能力；
  - 透過 reward 訊號調整模型回應策略與行為偏好；
  - 提升模型推論速度與降低回應延遲；
  - 降低 prompt 設計複雜度並取代訓練流程
  correct_index: 1
  explanation: Reinforcement Fine-tuning (RFT) / RLHF 的主要目的是透過人類或獎勵模型的 Reward 訊號，引導模型的回應語氣、策略與品牌風格符合特定偏好。
- file: subjects/gen-ai/chapter2.yaml
  id: '11410_2'
  text: 某公司在導入生成式 AI協助撰寫內部報告時，測試人員刻意在輸入的 上下文中放入互相矛盾的資訊 （例如：同一位員工在不同段落被描述為 「入職三年」與「入職五年」
    ） 。在這種情況下，最常見的模型行為會是 什麼？ (114年第四梯次)
  options:
  - 永遠選擇第一段資訊作為答案依據 (Always First Info)
  - 可能生成幻覺或隨機採信其中一方的內容 (Hallucination or Random Selection)
  - 拒絕回答，並要求提供更一致的輸入 (Refuse to Answer)
  - 自動判斷並只選擇正確的資訊 (Auto Correct)
  correct_index: 0
  explanation: 此題涉及 某公司在導入生成式 ... 的核心概念。正確答案為「永遠選擇第一段資訊作為答案依據；」。
- file: subjects/gen-ai/chapter2.yaml
  id: '11440_4'
  text: 在生成式 AI 的提示工程中，Graph Prompting 在處理複雜關係資料時， 為何通常比 Chain-of-Thought（CoT）更有效？
    (114年第四梯次)
  options:
  - Graph Prompting 幾乎不需要推理，只依靠圖結構即可得出結論 (No Reasoning Needed)
  - Graph Prompting 僅需單次提示，即可避免多輪推理的誤差累積 (Single Prompt)
  - Graph Prompting 的生成速度通常更快，因此效率更高 (Faster Speed)
  - Graph Prompting 能捕捉非線性結構與上下文關聯，適合處理網絡化資訊 (Non-linear Structure & Context)
  correct_index: 0
  explanation: Chain-of-Thought (CoT) 透過引導模型逐步推理（Step-by-step），能顯著提升複雜邏輯與數學問題的解題能力。
- file: subjects/gen-ai/chapter2.yaml
  id: '11441_4'
  text: 在少樣本提示（Few-shot Prompting）僅能提供 1–2 個範例的情況 下，若遇到領域偏移（Domain Shift） ，下列何者為模型最可能面臨的
    核心挑戰？ (114年第四梯次)
  options:
  - 範例數量過少，無法涵蓋新領域的多樣性，導致模型泛化不足 (Insufficient Examples for Generalization)
  - 範例表徵有限，模型容易依賴單一樣本特性而降低適應力 (Overfitting to Few Examples)
  - 範例覆蓋不足，使模型難以抽取跨領域的穩定模式 (Insufficient Coverage)
  - 範例資訊過於稀缺，模型缺乏應對不同輸入情境的能力 (Scarcity of Info)
  correct_index: 0
  explanation: Few-shot Prompting 透過提供少量範例（Examples），讓模型快速學習任務模式與輸出格式，無需更新參數。
- file: subjects/gen-ai/chapter2.yaml
  id: '11404_1'
  text: 某社交平台嘗試結合自動提示工程（ Automatic Prompt Engineer, APE）與圖提示（Graph Prompting） ，讓AI
    協助分析使用者之間的互動 關係。在這個過程中，下列何者為最可能遇到的挑戰？ (114年第四梯次)
  options:
  - 圖結構轉換為文字提示時，可能導致部分關聯資訊遺失 (Loss of Info in Conversion)
  - APE 在圖資料上無法產生任何提示內容 (APE Fails on Graph)
  - 圖轉文字後能完整保留所有上下文，對推理不造成影響 (No Loss in Conversion)
  - Graph Prompting 僅能處理線性路徑，限制多分支探索 (Linear Path Only)
  correct_index: 0
  explanation: 此題涉及 某社交平台嘗試結合自... 的核心概念。正確答案為「圖結構轉換為文字提示時，可能導致部分關聯資訊遺失；」。
- file: subjects/gen-ai/chapter2.yaml
  id: '11416_3'
  text: 在建置多代理大型語言模型（Multi-agent LLMs）系統時，如果沒有清 楚定義每個代理的任務啟動條件和角色分工，最可能出現什麼問題？ (114年第四梯次)
  options:
  - 回覆內容前後不連貫，系統邏輯斷裂 (Inconsistent Response)
  - 不同代理的答案互相衝突，無法判斷最終決策 (Conflicting Answers)
  - 系統陷入無限對話循環，導致資源耗盡 (Infinite Loop)
  - 多個代理重複做同樣的任務，造成效率低落 (Redundant Tasks)
  correct_index: 0
  explanation: AI Agent 具備感知、規劃、記憶與工具使用能力，能自主拆解目標並執行一連串行動以完成複雜任務。
- file: subjects/gen-ai/chapter2.yaml
  id: '11407_2'
  text: 某團隊希望讓 AI 自動查詢 GitHub 上的程式碼庫，並生成摘要給使用 者參考。開發者決定透過Model Context Protocol（MCP）來實現，AI
    需先發出請求，再經由 MCP 架構逐步完成查詢與回傳。在此情境下， MCP 運作流程的正確順序為何？ (114年第四梯次)
  options:
  - MCP Server →AI Host →MCP Client →資料查詢→結果回傳 AI Host (Server -> Host -> Client)
  - MCP Client →AI Host →MCP Server →資料查詢→結果回傳 AI Host (Client -> Host -> Server)
  - AI Host →MCP Client → MCP Server →資料查詢→結果回傳 AI Host (Host -> Client -> Server)
  - AI Host→MCP Server→MCP Client→資料查詢→結果回傳 AI Host (Host -> Server -> Client)
  correct_index: 0
  explanation: Model Context Protocol (MCP) 是一種標準化協議，旨在簡化 AI 模型與外部數據、工具及資源的連接與互動。
- file: subjects/gen-ai/chapter2.yaml
  id: '11428_3'
  text: 某公司正在開發一個智慧客服系統，負責回覆顧客關於退換貨、優惠活 動與商品建議等問題。研發團隊嘗試使用不同的提示設計方式來提升 模型效能 。 下列哪一個提示最符合
    「少樣本提示 （Few-Shot Prompting）」 的設計原則？ (114年第四梯次)
  options:
  - 「請回答顧客詢問：如何申請退貨？」 (Direct Question)
  - 「以下是兩組客服對話範例，請依照相同風格回覆新的顧客問題」 (Few-shot Examples)
  - 「請逐步分析顧客投訴的原因，並依照推理過程生成合適回覆」 (Chain of Thought)
  - 「請以正式的語氣回覆顧客的提問」 (Tone Instruction)
  correct_index: 0
  explanation: Few-shot Prompting 透過提供少量範例（Examples），讓模型快速學習任務模式與輸出格式，無需更新參數。
- file: subjects/gen-ai/chapter2.yaml
  id: '11423_3'
  text: 在應用零樣本提示（Zero-Shot Prompting）時，下列哪一種情境最可 能因缺乏示範而失敗，出現語意錯誤或結構錯誤的輸出？ (114年第四梯次)
  options:
  - 要求模型判斷一段影評文字的情感傾向 (Sentiment Analysis)
  - 要求模型將一段新聞摘要濃縮為一句話 (Summarization)
  - 要求模型將一段繁體中文翻譯成英文 (Translation)
  - 要求模型從表格中擷取所有城市的最高氣溫 (Table Extraction)
  correct_index: 0
  explanation: Zero-shot Prompting 不提供任何範例，直接依靠模型預訓練的知識來解決任務，考驗模型的泛化能力。
- file: subjects/gen-ai/chapter2.yaml
  id: '11405_2'
  text: 在超長上下文任務中使用自動提示工程 （Automatic Prompt Engineer, 第二科：生成式 AI 應用與規劃 APE）時，可能面臨的最大限制是什麼？
    (114年第四梯次)
  options:
  - 迭代優化難以因應上下文的不斷變動，導致調整失效 (Dynamic Context Issue)
  - 模型的記憶容量有限，無法完整保留所有長篇資訊 (Memory Limit)
  - 提示內容難以有效分解，無法支援複雜任務拆解 (Decomposition Issue)
  - 回饋機制通常僅針對局部片段，難以全面評估最終輸出品質 (Partial Feedback)
  correct_index: 0
  explanation: 此題涉及 在超長上下文任務中使... 的核心概念。正確答案為「迭代優化難以因應上下文的不斷變動，導致調整失效；」。
- file: subjects/gen-ai/chapter2.yaml
  id: '11409_2'
  text: 在導入生成式 AI 的應用規劃中，上下文工程（Context Engineering） 的核心目的為何？ (114年第四梯次)
  options:
  - 縮短模型訓練時間 (Reduce Training Time)
  - 優化提示與上下文 (Optimize Prompt & Context)
  - 增加模型參數數量 (Increase Parameters)
  - 優化 Fine-tuning 正確率 (Optimize Fine-tuning Accuracy)
  correct_index: 0
  explanation: 此題涉及 在導入生成式 AI ... 的核心概念。正確答案為「縮短模型訓練時間；」。
- file: subjects/gen-ai/chapter2.yaml
  id: '11439_4'
  text: 在提示工程 （Prompt Engineering） 的應用中，Chain-of-Thought（CoT） 與 Tree of Thoughts（ToT）各適用於不同的推理情境，請問以下兩個
    情境，分別最適合採用哪一種方法？ 第二科：生成式 AI 應用與規劃 情境一：電商公司開發客服助理，用來協助客戶查詢退款流程與相關規 範 情境二：活動策劃團隊使用AI
    協助規劃多場跨部門行銷活動，需要同 時考量預算、場地、時程與人力資源，並比較不同方案的可行性。 (114年第四梯次)
  options:
  - '情境一採用 CoT，情境二採用ToT (Scenario 1: CoT, Scenario 2: ToT)'
  - '情境一採用 ToT，情境二採用CoT (Scenario 1: ToT, Scenario 2: CoT)'
  - 情境一與情境二都適合 CoT (Both CoT)
  - 情境一與情境二都適合 ToT (Both ToT)
  correct_index: 0
  explanation: Chain-of-Thought (CoT) 透過引導模型逐步推理（Step-by-step），能顯著提升複雜邏輯與數學問題的解題能力。
- file: subjects/gen-ai/chapter2.yaml
  id: 115002
  text: 在進行大型語言模型 (LLM) 企業專屬知識的 Fine-tuning 時，若內部 GPU 運算資 源與記憶體嚴重受限，下列哪一種參數高效微調（PEFT,
    Parameter Efficient Fine- Tuning）技術最能在維持模型效能的前提下，顯著降低需更新的參數數量？（115年第一梯次）
  options:
  - 知識蒸餾（Knowledge Distillation）；
  - 提示詞工程（Prompt Engineering）；
  - 梯度凍結（Gradient Freezing）；
  - 低秩適配（Low-Rank Adaptation）
  correct_index: 3
  explanation: 低秩適配（LoRA）是一種主流的 PEFT 技術，透過在模型中加入小型的低秩矩陣進行微調，能顯著降低所需的 GPU 記憶體與更新參數數量。
- file: subjects/gen-ai/chapter2.yaml
  id: 115009
  text: 某企業使用生成式 AI 進行文字分類，初期僅根據既有業務資料設計少量樣本提示 （Few-shot Prompting） 。當模型應用至新市場資料時，團隊發現分類結果明顯不穩
    定，且原先提供的範例並未涵蓋新市場常見的表達方式。依此情境判斷，下列何 者最可能為主要原因？（115年第一梯次）
  options:
  - 模型容易對單一範例產生過度記憶；
  - 少量範例難以涵蓋新情境的資料差異；
  - Prompt 設計無法引導模型擷取共通特徵；
  - 模型推理能力不足以完成分類任務 第二科：生成式 AI 應用與規劃
  correct_index: 1
  explanation: Few-shot Prompting 的效果高度依賴範例的代表性。當應用至新市場時，既有範例無法涵蓋新資料的差異性，導致模型分類結果不穩定。
- file: subjects/gen-ai/chapter2.yaml
  id: 115019
  text: 某新創公司採用 MVP（Minimum Viable Product）策略，導入 Vibe Coding 以加速 開發，雖然初期能快速產出可運作功能，但技術主管提醒，在正式上線前仍可能
    存在程式碼品質與安全風險。下列哪一項措施最合理，以降低品質與安全問題？（115年第一梯次）
  options:
  - 直接沿用 AI 生成程式碼至正式環境，以降低開發成本；
  - 持續優化提示詞，即可避免大部分品質問題；
  - 將生成程式碼納入審查、重構與安全測試流程；
  - 限制開發者修改 AI 生成之程式碼架構，以維持一致性
  correct_index: 2
  explanation: AI 生成的程式碼雖然能快速建置 MVP，但可能隱藏安全性漏洞或效能問題，因此在正式上線前必須經過人工審查、重構與安全測試。
- file: subjects/gen-ai/chapter2.yaml
  id: 115031
  text: 某有機農場累積了十年的病蟲害防治紀錄文件，包含不同作物的病害症狀描述、 防治方法和效果評估。農場主人希望建立一個 AI 助手，能根據農民描述的作物症
    狀，快速提供相關的防治建議和歷史案例。下列哪一種技術最適合解決這個需 求？（115年第一梯次）
  options:
  - 直接使用 ChatGPT 的預訓練知識回答農業問題；
  - 將所有文件內容加入 ChatGPT 的系統提示詞中；
  - 採用 RAG 技術，將農場文件建立向量資料庫，結合大語言模型生成回答；
  - 使用少樣本學習（Few-shot Learning） ，在提示詞中提供3-5 個病害案例
  correct_index: 2
  explanation: 將 10 年的專業歷史文件轉換為知識庫，最適合採用 RAG 技術。透過向量檢索，模型能針對農民描述的症狀精準提供相關防治建議。
- file: subjects/gen-ai/chapter2.yaml
  id: 115036
  text: 某連鎖零售企業使用生成式 AI 協助規劃門市補貨策略。決策時需同時考量多項彼 此相關的因素，例如：庫存水位、促銷活動、區域銷售差異與物流限制。專案團
    隊發現，AI 雖能逐步說明推論過程，但對於多條件之間的相互影響掌握不足，導 致建議結果偶有偏差。若希望透過提示工程（Prompt Engineering）改善此問題，
    下列哪一種策略最為適合？（115年第一梯次）
  options:
  - Chain of Thought，要求模型逐步展開推論；
  - Tree of Thoughts，增加多種推論路徑探索；
  - Graph Prompting，以結構化方式呈現條件與關聯；
  - Zero-shot Prompting，避免範例影響模型判斷
  correct_index: 2
  explanation: 當決策牽涉多個相互影響的複雜條件時，Graph Prompting 能以圖結構的方式清晰定義條件間的關聯，幫助模型進行更準確的推論。
- file: subjects/gen-ai/chapter2.yaml
  id: 115037
  text: 某電商平台導入生成式 AI 客服助理，用於自動回覆顧客詢問。營運需求包含：需 即時反映每日更新的促銷活動與商品資訊，同時維持品牌一致的回覆語氣，且企
    業希望避免因模型重新訓練所造成的成本增加與系統不穩定。在此情境下，下列 哪一種技術策略最合理？（115年第一梯次）
  options:
  - 僅進行 Fine-tuning，使模型同時學習品牌語氣與即時促銷內容； 第二科：生成式 AI 應用與規劃
  - 僅導入 RAG 更新促銷資訊，期望模型直接從檢索內容學習品牌語氣；
  - 透過 Prompt Engineering 控制回覆風格，並以 RAG 引入最新商品與活動資訊；
  - 持續進行增量 Fine-tuning，以確保活動資訊同步更新
  correct_index: 2
  explanation: Prompt Engineering 能有效控制品牌語氣與風格，而 RAG 則能動態提供每日更新的促銷與商品資訊，兩者結合能以最低成本達成需求。
- file: subjects/gen-ai/chapter2.yaml
  id: 115045
  text: 某企業導入生成式 AI 助理，協助內部人員撰寫專案建議與分析報告。團隊希望透 過思維鏈（Chain of Thought, CoT）提示設計提升模型輸出的邏輯性與推理透明
    度，下列何者最符合該提示策略？（115年第一梯次）
  options:
  - 「請直接給出最終建議，不需顯示分析過程。」；
  - 「以下提供兩份分析報告範例，請依相同格式產出新報告。」；
  - 「請將任務拆為三個步驟：資料整理 → 重點摘要 → 建議產出。」；
  - 「請逐步說明你的判斷依據與推理過程，最後再給出結論。」
  correct_index: 3
  explanation: 思維鏈（Chain of Thought）提示的核心在於要求模型「逐步說明判斷依據與推理過程」，這能大幅提升複雜任務的邏輯性與結果透明度。
- file: subjects/gen-ai/chapter1.yaml
  id: '11429_3'
  text: 某投資公司導入生成式 AI，用於即時分析股市波動並提供市場背景資 訊。若希望AI 能兼顧「即時性」與「可靠性」 。下列哪一項設計最能有 效提升 AI
    在即時股市分析上的表現？ (114年第四梯次)
  options:
  - 將 AI 系統連結至公司內部歷史交易資料庫，以便快速調用既有的案例參考 (Connect to Internal DB)
  - 調整模型的回應邏輯，讓 AI 優先輸出最新市場行情，而不是完整的背景分析 (Prioritize Latest Market Data)
  - 建立與外部即時行情來源同步的查詢模組，確保 AI 能即時擷取最新金融數據 (Real-time External Data Sync)
  - 增加訓練資料中模擬的金融危機與市場異常案例，以提升 AI 在特殊情境下的表現能力 (Simulate Market Anomalies)
  correct_index: 0
  explanation: 此題涉及 某投資公司導入生成式... 的核心概念。正確答案為「將 AI 系統連結至公司內部歷史交易資料庫，以便快速調用既有的 案例參考；」。
- file: subjects/gen-ai/chapter1.yaml
  id: '11426_3'
  text: 某電商平台希望生成的商品描述在風格與用詞上保持一致性，但不需 要新增專業知識。下列哪種方法最適合？ (114年第四梯次)
  options:
  - 擴充語料庫並微調模型，使風格統一 (Fine-tuning for Style)
  - 增加提示詞複雜度，引導模型風格一致 (Complex Prompting)
  - 降低生成溫度，以減少隨機性並提升風格一致性 (Lower Temperature)
  - 使用全連接神經網路對生成結果後期篩選 (Post-processing with NN)
  correct_index: 0
  explanation: 此題涉及 某電商平台希望生成的... 的核心概念。正確答案為「擴充語料庫並微調模型，使風格統一；」。
- file: subjects/gen-ai/chapter1.yaml
  id: 115015
  text: 在生成式 AI 應用設計中，情境感知代理（Context-aware Agent）的核心特性為 何？（115年第一梯次）
  options:
  - 能依任務需求即時重新訓練模型參數以優化結果；
  - 僅依使用者當前輸入指令執行任務，不保留歷程資訊；
  - 具備跨模態處理能力，可同時理解文字與影像內容；
  - 能利用對話歷史、任務狀態調整行為與決策
  correct_index: 3
  explanation: 情境感知代理（Context-aware Agent）不僅能理解單次指令，更重要的是具備記憶與狀態管理能力，能利用對話歷史與當前任務狀態來調整行為。
- file: subjects/gen-ai/chapter1.yaml
  id: 115021
  text: 關於 2025 年 OpenAI 提供的 AgentKit，下列何者最能描述其主要用途？（115年第一梯次）
  options:
  - 建立強化式學習（Reinforcement Learning）訓練所需的互動式模擬環境；
  - 提供代理（Agent）模型的大規模預訓練與權重優化機制；
  - 「Agent-to-Agent」的代理通訊協議；
  - 支援 Agents 的建構、工具整合與任務流程開發
  correct_index: 3
  explanation: AgentKit 的設計宗旨是作為一個開發框架，支援開發者快速建構 AI Agents、整合外部工具（Tools）以及編排複雜的任務流程。
- file: subjects/gen-ai/chapter1.yaml
  id: 115023
  text: 某保險公司想建立智慧理賠系統，包含兩個功能：(1)自動判斷理賠案件是否為詐 欺案件 (2)自動生成理賠調查報告。請問這兩個功能分別屬於哪種 AI 技術類型？（115年第一梯次）
  options:
  - (1)鑑別式 AI (2)生成式 AI；
  - (1)生成式 AI (2)鑑別式 AI；
  - 兩者都是鑑別式 AI；
  - 兩者都是生成式 AI
  correct_index: 0
  explanation: 自動判斷是否詐欺屬於分類問題，是鑑別式 AI（Discriminative AI）的應用；而自動生成調查報告則需要產生新內容，屬於生成式
    AI（Generative AI）。
- file: subjects/gen-ai/chapter1.yaml
  id: 115030
  text: 某市政府環保局想建立一個垃圾分類查詢系統，讓民眾輸入物品名稱後自動判斷 分類。由於垃圾種類繁多，但每種分類的訓練範例有限，工程師決定採用少樣本 學習（Few-shot
    Learning）技術。下列何者為少樣本學習（Few-shot Learning）的 主要特徵？（115年第一梯次）
  options:
  - 需重新蒐集大規模標註資料，以確保模型具備穩定表現；
  - 透過少量任務示例，引導模型適應新情境或新分類需求；
  - 不需任何範例輸入，即可完成新任務推論；
  - 僅適用於自然語言處理任務，對其他模態效果有限
  correct_index: 1
  explanation: 少樣本學習（Few-shot Learning）的特徵在於不需要大量訓練資料，只需在 Prompt 中提供少量的範例（如幾種垃圾的分類範例），即可引導模型適應新任務。
- file: subjects/gen-ai/chapter1.yaml
  id: 115042
  text: 某企業希望利用含敏感資訊的資料進行 AI 模型訓練，但政策要求原始資料不得外 洩，且資料可集中於安全環境中處理。同時，企業希望在資料使用過程中，即使
    資料處於加密狀態，仍能完成模型計算。在此需求下，下列哪一種技術最為適 第二科：生成式 AI 應用與規劃 合？（115年第一梯次）
  options:
  - 聯邦學習（Federated Learning）；
  - 同態加密（Homomorphic Encryption）；
  - 零知識證明（Zero-knowledge Proof）；
  - 資料匿名化（Data Anonymization）
  correct_index: 1
  explanation: 同態加密（Homomorphic Encryption）允許在密文（加密狀態）上直接進行數學運算，運算結果解密後與在明文上運算的結果相同，非常適合用於隱私保護模型計算。
- file: subjects/gen-ai/chapter1.yaml
  id: 115048
  text: 某企業將機器學習模型部署於線上推薦系統。模型在測試階段表現良好，但上線 數月後，點擊率與預測準確度逐漸下降。經分析發現，近期使用者行為模式與模 型訓練期間的資料特徵出現顯著變化。此現象最可能屬於下列何者？（115年第一梯次）
  options:
  - 模型過度擬合訓練資料，無法泛化至未知樣本；
  - 特徵工程設計不佳，導致輸入資訊不足；
  - 資料統計特徵隨時間改變，影響模型推論效果；
  - 系統資料結構調整，造成特徵欄位錯置
  correct_index: 2
  explanation: 當模型上線後準確度逐漸下降，通常是因為真實世界的使用者行為或數據特徵發生了改變，這種現象稱為資料漂移（Data Drift）或概念漂移（Concept
    Drift）。
- file: subjects/gen-ai/chapter7.yaml
  id: '11446_7'
  text: 某智慧工廠導入生成式 AI，協助產線工程師即時產生維修指引與操作 建議。下列哪一項並非團隊在系統設計中加入Guardrails（防護機制） 的主要目的？
    (114年第四梯次)
  options:
  - 檢查工程師輸入內容，避免觸發錯誤或危險需求；
  - 過濾與驗證 AI 輸出的維修指引，確保符合安全標準；
  - 確保生成的操作建議符合法規與產業安全規範；
  - 完整重建並追蹤 AI 模型的全部推理過程
  correct_index: 0
  explanation: 此題涉及 某智慧工廠導入生成式... 的核心概念。正確答案為「檢查工程師輸入內容，避免觸發錯誤或危險需求；」。
- file: subjects/gen-ai/chapter7.yaml
  id: '11402_2'
  text: 企業在導入生成式 AI 平台時，往往需要利用分散於不同部門或機構中 的大量敏感文本資料。若希望在確保隱私的前提下，仍能讓模型持續優 化並降低資料外洩風險，下列哪一種方法最適合？
    (114年第四梯次)
  options:
  - 同態加密（Homomorphic Encryption）；
  - 安全多方計算（Secure Multi-party Computation）；
  - 零知識證明（Zero-knowledge Proofs）；
  - 聯邦學習（Federated Learning）
  correct_index: 0
  explanation: 此題涉及 企業在導入生成式 A... 的核心概念。正確答案為「同態加密（Homomorphic Encryption）；」。
- file: subjects/gen-ai/chapter7.yaml
  id: '11431_4'
  text: 某跨國電商企業導入生成式 AI，協助處理顧客服務請求，並根據顧客 歷史訂單提供個人化建議。資安與法遵部門擔心AI 在回覆時可能洩漏 顧客個資，若要在導入初期優先避免觸法風險，下列哪一項措施最符合
    要求？ (114年第四梯次)
  options:
  - 在加密環境下導入完整的顧客訂單與行為資料，並透過嚴格存取控 管降低洩漏風險；
  - 實施資料最小化與去識別化，確保 AI 在訓練與生成過程中不直接 處理或暴露敏感個資； 第二科：生成式 AI 應用與規劃
  - 強化模型的回覆審查流程，透過自動過濾與人工抽查結合，降低個 資外洩的機率；
  - 設定 AI 的角色與回覆範圍，讓其專注於客服相關內容，避免回答 其他敏感議題
  correct_index: 0
  explanation: 此題涉及 某跨國電商企業導入生... 的核心概念。正確答案為「在加密環境下導入完整的顧客訂單與行為資料，並透過嚴格存取控 管降低洩漏風險；」。
- file: subjects/gen-ai/chapter7.yaml
  id: '11432_5'
  text: 某國際銀行導入生成式 AI，用於彙整不同國家金融監管機構的合規規 範，建立跨國合規知識庫。由於各國條文表述方式不同，且監管要求具 有高度專業性與隱含邏輯，若要確保知識庫在後續查詢與生成報告時
    能維持正確性與一致性，下列哪一項 AI 能力最為關鍵？ (114年第四梯次)
  options:
  - 具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國 家規範間的對應與差異；
  - 能自動最佳化文件檢索效率，縮短跨國法規查詢的延遲時間，提升 合規部門使用體驗；
  - 能將合規文件轉換為多種輸出形式（如簡報、摘要或法規清單） ，以 符合不同決策層級需求；
  - 具備根據歷史案例生成合規解釋的能力，協助新進員工快速理解法 規在實務上的應用
  correct_index: 0
  explanation: 此題涉及 某國際銀行導入生成式... 的核心概念。正確答案為「具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國 家規範間的對應與差異；」。
- file: subjects/gen-ai/chapter7.yaml
  id: '11436_4'
  text: 某航空公司導入生成式 AI 聲控客服，提供航班與票務查詢。有人員透 過惡意提示，試圖讓系統洩漏內部安檢流程。在此情境中，下列何者為 降低提示攻擊（Prompt
    Injection）風險的最佳策略？ (114年第四梯次)
  options:
  - 導入輸入檢測與回應審核流程，防止敏感指令被執行；
  - 限制 AI 可回應的主題範圍，使系統僅回答非敏感的航班與票務查 詢，避免處理內部或敏感流程資訊；
  - 隨機變化回覆內容，讓攻擊者難以預測回應行為以增加攻擊難度；
  - 擴充與更新航班與票務資料來源，以提升模型的知識正確性與覆蓋 率
  correct_index: 0
  explanation: Prompt Injection 是一種攻擊手法，透過惡意指令誤導模型忽略原有的安全限制或執行未授權的操作。
- file: subjects/gen-ai/chapter7.yaml
  id: '11438_5'
  text: 某銀行導入生成式 AI 放貸審核系統，用於分析申貸人條件並生成初步 審核意見。測試過程中發現，模型對不同族群的核准率存在顯著差異， 可能引發演算法偏見問題。為降低此風險，下列哪一項措施最合適？
    (114年第四梯次)
  options:
  - 提升模型運算速度與效能，以確保在大量申請中快速回應；
  - 全面移除與申貸人身份相關的敏感屬性，避免模型因變數影響而產 生偏差；
  - 導入資料與結果的公平性檢測流程，並依合規規範調整模型或決策 邏輯；
  - 減少訓練樣本數量，降低偏見被放大的可能性
  correct_index: 2
  explanation: AI 偏見通常源自訓練數據中的社會刻板印象。緩解策略包括數據平衡、去偏演算法以及人類回饋強化學習 (RLHF)。
- file: subjects/gen-ai/chapter7.yaml
  id: 115001
  text: 某零售企業導入生成式 AI 商品推薦系統。測試結果顯示，在購物行為、偏好設定 與價格區間相同的情況下，不同客戶族群收到的推薦商品類型仍出現明顯差異，
    且差異方向不易以既有行銷策略解釋。若在模型架構與推論設定皆未調整情形 下，專案目標是優先降低可能的模型偏差風險，下列何者最合理？（115年第一梯次）
  options:
  - 重新檢視訓練資料的樣本分布與代表性；
  - 限制推薦結果僅顯示高銷量商品；
  - 降低模型參數規模以簡化決策邏輯；
  - 提高推薦結果的隨機性以增加多樣性
  correct_index: 0
  explanation: 模型產生無法解釋的偏差，通常根源於訓練資料本身。因此優先重新檢視訓練資料的樣本分布是否對不同客群具有公平的代表性是最合理的做法。
- file: subjects/gen-ai/chapter7.yaml
  id: 115006
  text: OpenAI 已為 Sora 生成的影片提供多種出處證明機制，以降低誤導性或欺騙性內 容帶來的風險。下列何者不屬於目前 OpenAI 官方為 Sora
    內容提供的出處證明工 具？（115年第一梯次）
  options:
  - 所有資產上內嵌的 C2PA（Content Credentials）元數據；
  - 預設可見的動態浮水印；
  - 用於追蹤生成內容的內部反向影像與音訊搜尋工具；
  - 平台對外開放的實時來源驗證介面
  correct_index: 3
  explanation: OpenAI 的 Sora 目前已支援 C2PA 元數據與浮水印等證明，但並未提供平台對外開放的實時來源驗證介面作為官方標準工具。
- file: subjects/gen-ai/chapter7.yaml
  id: 115022
  text: 所有在 Gemini 應用程式透過 Veo 生成的影片，皆採用何種技術措施來協助企業用 戶應對 AI 生成內容可能帶來的不實資訊風險？（115年第一梯次）
  options:
  - 嚴格限制所有用戶每日的影片生成次數與使用時間；
  - 在所有生成影片的開頭與結尾處強制加入明顯的 AI 標示警語；
  - 要求所有影片輸出時必須附帶至少 10 秒的免責聲明片段；
  - 使用 SynthID 技術在每一幀（frame）影片中嵌入不可見的數位浮水印
  correct_index: 3
  explanation: Google 的 SynthID 技術能在 AI 生成的影片（如 Veo）的每一幀中嵌入不可見的數位浮水印，這有助於後續驗證影片是否為
    AI 生成，且不易被抹除。
- file: subjects/gen-ai/chapter7.yaml
  id: 115024
  text: 某大型製造工廠導入生成式 AI 系統來優化能源消耗，每日需處理約 10 萬筆設備 數據並生成能源優化建議。系統每月 API 調用成本約 15 萬元，內部維護人力成本
    8 萬元，基礎設施成本 5 萬元。該工廠評估導入效益時，下列哪一項總體擁有成本 （Total Cost of Ownership, TCO）分析最完整？ 第二科：生成式
    AI 應用與規劃（115年第一梯次）
  options:
  - 主要以 API 調用成本 15 萬元作為 TCO 評估基礎；
  - 以 API 調用成本 15 萬元及維護人力成本 8 萬元進行整體估算；
  - 綜合 API 調用、維護人力與基礎設施等直接成本進行評估，共約 28 萬元；
  - 除直接成本外，並考量訓練、系統整合與資安合規等相關支出
  correct_index: 3
  explanation: 總體擁有成本（TCO）不僅包含直接的 API 調用與硬體設施費用，還必須綜合考量隱性成本，如系統整合、員工訓練與資安合規等各項支出。
- file: subjects/gen-ai/chapter7.yaml
  id: 115038
  text: 某企業規劃導入生成式 AI 助理，在正式全面部署前進行概念驗證（PoC） ，下列 何者最不適合作為此階段的主要工作？（115年第一梯次）
  options:
  - 驗證模型在實際使用情境下的回覆品質與穩定性；
  - 測試 AI 功能與業務需求的匹配程度；
  - 制定跨部門使用規範，與長期治理框架；
  - 評估系統整合可行性與技術限制
  correct_index: 2
  explanation: 概念驗證（PoC）階段的重點在於快速驗證技術可行性與業務匹配度，制定長期跨部門治理框架與規範通常是在 PoC 成功後，準備規模化導入時才進行。
- file: subjects/gen-ai/chapter7.yaml
  id: 115039
  text: 某企業規劃導入生成式 AI 客服系統，需處理顧客查詢並引用歷史交易資料。法 遵部門在風險評估中指出，系統若不當處理顧客個人資料，可能引發合規與法律
    責任。若專案初期希望從資料層面降低敏感資訊暴露風險，下列敘述何者最為合 理？（115年第一梯次）
  options:
  - 強化模型輸出審查與遮罩機制，以過濾可能出現的敏感資訊；
  - 設定 AI 回覆範圍與角色權限，限制其存取特定類型資料；
  - 將資料集中於加密儲存環境，並加強系統存取控管；
  - 僅提供必要資料或數據欄位與去識別化策略，減少模型接觸可識別個資
  correct_index: 3
  explanation: 從資料源頭進行管控最為安全。在系統將資料送交給模型前，僅提供必要欄位並執行去識別化，能最大程度減少模型接觸敏感個資的風險。
- file: subjects/gen-ai/chapter7.yaml
  id: 115041
  text: 企業在評估 AI 決策模型是否存在資料分布偏差時，下列何者最屬於偏見檢測 （Bias Detection）而非偏見緩解（Bias Mitigation）措施？（115年第一梯次）
  options:
  - 比較不同資料分布的模型預測結果分布與錯誤率；
  - 重新加權訓練樣本以平衡資料分布代表性；
  - 在推論階段加入輸出過濾規則；
  - 調整模型決策閾值（Decision Threshold）以降低預測差異
  correct_index: 0
  explanation: 比較不同資料分布的模型預測結果與錯誤率，是為了「發現」是否存在偏見，屬於偏見檢測（Bias Detection）；其餘選項皆屬於修正偏見的緩解措施。
- file: subjects/gen-ai/chapter7.yaml
  id: 115043
  text: 某金融服務公司規劃導入生成式 AI，在評估模型部署方式時，基於內部控制與治 理要求，企業考慮將大型語言模型建置於公司可管理環境，而非直接採用外部雲
    端服務。下列何者最能合理說明此部署決策的潛在優勢？（115年第一梯次）
  options:
  - 有助提升模型回覆穩定性並降低隨機性影響；
  - 可降低敏感資料需傳輸至外部服務的風險；
  - 可直接減少模型訓練與維運所需資源投入；
  - 可避免模型輸出偏差與幻覺（Hallucination）問題
  correct_index: 1
  explanation: 對於金融機構而言，資料的隱私與安全至關重要。私有化部署大型語言模型確保敏感資料不需要傳輸至公有雲，能大幅降低合規與外洩風險。
- file: subjects/gen-ai/chapter7.yaml
  id: 115046
  text: 某金融監理機構規劃導入生成式 AI 以協助內部人員分析申報文件與監理報告，系 統需處理大量涉及企業敏感資料與未公開資訊。主管機關明確要求「資料安全與
    法規遵循必須優先於導入速度與成本考量」 。在此條件下，下列哪一種策略最為適 第二科：生成式 AI 應用與規劃 當？（115年第一梯次）
  options:
  - 採用雲端大型語言模型 API，並透過資料遮罩與加密機制降低外洩風險；
  - 導入開源模型進行私有化部署，以兼顧成本彈性與模型可控性；
  - 自行訓練並私有化部署模型，同時建立存取控管與稽核機制；
  - 先驗證模型效益，再逐步補強合規與資安架構
  correct_index: 2
  explanation: 在法規遵循與資料安全優先於成本考量的前提下，金融監理機構應選擇自行訓練並私有化部署模型，並落實嚴格的存取與稽核機制。
- file: subjects/gen-ai/chapter7.yaml
  id: 115050
  text: 某招聘公司使用生成式 AI 生成面試問題與候選人評估建議。團隊發現模型可能對 性別或年齡產生的資料分布偏差。下列哪一種策略最能有效降低生成偏差輸出的
    風險？（115年第一梯次）
  options:
  - 調整模型架構與參數，使生成更靈活與多樣化；
  - 大幅增加訓練資料量，但不清理或平衡資料中的性別與年齡分布；
  - 在生成後對模型輸出進行人工審查，並依偏差情況修正結果；
  - 僅允許高階主管操作系統，透過人員篩選控制生成結果
  correct_index: 2
  explanation: 由於 AI 面試評估涉及敏感的就業公平性問題，在目前技術難以完全根除偏差的情況下，透過「Human-in-the-loop」對輸出結果進行人工審查與修正最能防範風險。
- file: subjects/gen-ai/chapter6.yaml
  id: '11445_7'
  text: 下列哪一個資料集專門設計用於測試大型語言模型在多領域、多任務 語言理解中，涵蓋人文、科學與社會科學等領域，而非專門用於數學推 理或中文專業知識？ (114年第四梯次)
  options:
  - MMLU；
  - GSM8K；
  - MATH；
  - C-Eval
  correct_index: 0
  explanation: 此題涉及 下列哪一個資料集專門... 的核心概念。正確答案為「MMLU；」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11404_2'
  text: ' 動態調整生成溫度，平衡準確度與多樣性 (114年第四梯次)'
  options:
  - 1 → 2 → 4 → 3；
  - 2 → 1→ 3 → 4；
  - 1 → 3 → 2 → 4；
  - 3 → 1 → 2 → 4 C 22.  一家顧問公司使用生成式 AI 協助撰寫數據分析報告。雖然模型在測試 中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關
    鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何 者為造成這種現象的最合理解釋？
  correct_index: 0
  explanation: 溫度 (Temperature) 參數控制生成結果的隨機性。較高的溫度（如 0.8）使輸出更多樣且具創意；較低的溫度（如 0.2）使輸出更確定且聚焦。
- file: subjects/gen-ai/chapter6.yaml
  id: '11404_3'
  text: ' 評估並選擇合適的 AI 技術供應商或開源方案，確立技術方向與架 構 (114年第四梯次)'
  options:
  - 2 → 3 → 4 → 1；
  - 3 → 2 → 1 → 4；
  - 2 → 1 → 3 → 4；
  - 1 → 4 → 3 → 2 B 31.  某跨國電商企業導入生成式 AI，協助處理顧客服務請求，並根據顧客 歷史訂單提供個人化建議。資安與法遵部門擔心AI
    在回覆時可能洩漏 顧客個資，若要在導入初期優先避免觸法風險，下列哪一項措施最符合 要求？
  correct_index: 0
  explanation: 此題涉及  評估並選擇合適的 ... 的核心概念。正確答案為「2 → 3 → 4 → 1；」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11422_3'
  text: 一家顧問公司使用生成式 AI 協助撰寫數據分析報告。雖然模型在測試 中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關 鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何
    者為造成這種現象的最合理解釋？ (114年第四梯次)
  options:
  - 模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分 析邏輯；
  - 測試資料涵蓋過多統計圖表，導致模型無法專注於文字內容的多樣 化表達；
  - 模型過度依賴訓練語料中的常見報告範式，導致生成結果以樣板化 結構取代真正的推理；
  - 模型因無法正確辨識報告中的頁碼與標題層級，才出現樣板化的結 果
  correct_index: 0
  explanation: 此題涉及 一家顧問公司使用生成... 的核心概念。正確答案為「模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分 析邏輯；」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11443_5'
  text: 在評估大型語言模型，例如7B、13B、175B 參數規模時，模型規模對基 準測試（Benchmark）結果的影響，下列哪一種說法最為恰當？ (114年第四梯次)
  options:
  - 小模型在正確調整下能超越大模型，因此模型大小並不重要； 第二科：生成式 AI 應用與規劃
  - 大模型在多數情境下表現較好，但在特定任務上略遜於小模型；
  - 模型規模與基準測試結果完全無關，影響主要來自測試設計；
  - 模型越大，Benchmark 結果可能提升，但幅度取決於訓練數據品質 與資源配置
  correct_index: 0
  explanation: 此題涉及 在評估大型語言模型，... 的核心概念。正確答案為「小模型在正確調整下能超越大模型，因此模型大小並不重要； 第二科：生成式
    AI 應用與規劃」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11434_5'
  text: 某醫療機構計畫導入生成式 AI 協助撰寫病歷摘要。在技術測試階段， 為確保系統能安全應用於臨床，最應優先關注下列哪一項指標？ (114年第四梯次)
  options:
  - 資料儲存與存取架構的完整性，確保長期運作過程中的數據可追溯 性；
  - 生成內容的醫療準確性與臨床一致性，避免出現錯誤或誤導性資 訊；
  - 模型在不同病例語境下的泛化能力，確保不因個別樣本而偏差；
  - 系統回應時間的穩定性，以支援醫療場域中可能的即時需求
  correct_index: 0
  explanation: 此題涉及 某醫療機構計畫導入生... 的核心概念。正確答案為「資料儲存與存取架構的完整性，確保長期運作過程中的數據可追溯 性；」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11403_2'
  text: 某企業利用 No Code/Low Code平台開發內部營運系統。為確保系統在 跨部門流程與外部服務整合下仍具良好的可測試性 （Testability）
    ，下 列哪一項作法最為合適？ (114年第四梯次)
  options:
  - 依賴 No Code/Low Code平台提供的即時預覽與基本單元測試功能， 快速驗證常見流程；
  - 導入可重複執行的自動化測試流程，並透過 API 或服務虛擬化進 行模組化驗證；
  - 將測試聚焦於使用者介面互動與操作流程驗證，檢查系統表面功 能；
  - 依靠使用者回饋與正式上線後的監控資料，作為修正依據
  correct_index: 0
  explanation: Low/No Code 平台降低了 AI 開發門檻，讓非技術人員也能透過圖形化介面快速構建與部署 AI 應用。
- file: subjects/gen-ai/chapter6.yaml
  id: '11412_1'
  text: 某企業考慮將開源大型語言模型（GPT-OSS）自行部署在本地伺服器， 以取代雲端服務。下列何者最能代表本地部署對企業的實際好處？ (114年第四梯次)
  options:
  - 可以達到無運算成本，因為本地部署模型不會產生額外的資源消 耗；
  - 模型的預測能力會比在雲端運行時更精度，因為本地環境更加可 靠；
  - 可確保輸入模型的敏感資料不會傳輸給第三方，提升資料隱私和自 主控制；
  - 以上皆是
  correct_index: 0
  explanation: 此題涉及 某企業考慮將開源大型... 的核心概念。正確答案為「可以達到無運算成本，因為本地部署模型不會產生額外的資源消 耗；」。
- file: subjects/gen-ai/chapter6.yaml
  id: '11433_5'
  text: 在企業導入 MLOps（Machine Learning Operations）的過程中，除了 模型部署與維運挑戰外，仍可能面臨其他推動上的困難。下列何者為
    No Code 平台最能有效解決的挑戰？ (114年第四梯次)
  options:
  - 自動化大量資料的標註與前處理，以降低數據準備成本；
  - 提升運算基礎設施的可擴展性，以因應大規模服務需求；
  - 透過可視化建模介面，降低技術門檻並促進跨部門協作；
  - 提供進階特徵工程能力，優化高維度數據的處理效率
  correct_index: 0
  explanation: Low/No Code 平台降低了 AI 開發門檻，讓非技術人員也能透過圖形化介面快速構建與部署 AI 應用。
- file: subjects/gen-ai/chapter6.yaml
  id: 115004
  text: 某企業導入生成式 AI 客服系統後發現，系統整體運作穩定，且在單位時間內可處 理大量對話請求。部分使用者仍反映在互動過程中回覆出現卡頓感，經初步排除
    網路連線與前端介面效能問題後，若專案團隊希望針對此現象進行效能測試，下 列何者最符合測試重點？（115年第一梯次）
  options:
  - 評估系統長時間運作的穩定程度；
  - 測量系統單位時間的總處理量；
  - 比較不同回覆內容的語言品質；
  - 分析單次互動回覆的反應速度表現
  correct_index: 3
  explanation: 「回覆出現卡頓感」通常與首字延遲（Time to First Token, TTFT）或生成速度（Tokens per Second）有關，因此應聚焦於分析單次互動的反應速度表現。
- file: subjects/gen-ai/chapter6.yaml
  id: 115005
  text: 某企業導入生成式 AI 系統，希望自動產出客服回覆與內部文件摘要。系統需能理 解使用者輸入的完整語句內容，並在回覆中維持語意連貫，即使對話內容較長仍
    能保持上下文一致性。基於上述需求，下列何種模型架構最為適合？ 第二科：生成式 AI 應用與規劃（115年第一梯次）
  options:
  - 卷積神經網路（Convolutional Neural Network, CNN）；
  - 遞迴神經網路（Recurrent Neural Network, RNN）；
  - 基於 Transformer 架構的自迴歸模型（Autoregressive Model）；
  - 生成對抗網路（Generative Adversarial Network, GAN）
  correct_index: 2
  explanation: 生成式 AI (如 ChatGPT) 能處理長上下文並維持語意連貫，主要是依賴基於 Transformer 架構的自迴歸模型 (Autoregressive
    Model) 的注意力機制與生成特性。
- file: subjects/gen-ai/chapter6.yaml
  id: 115014
  text: 某企業導入大型語言模型（LLM）分析內部報表，使用者經常提供 Excel 匯出的 表格資料（如銷售數據與統計表） 。測試時發現，模型對原始表格解析效果不穩
    定。為提升模型理解與回應品質，下列哪一種上下文工程（Context Engineering） 作法較為適當？ 第二科：生成式 AI 應用與規劃（115年第一梯次）
  options:
  - 將表格內容轉換為結構化 JSON 或 Markdown table；
  - 在維持原始表格呈現方式下，補充欄位與數據說明；
  - 將表格資料隨機切割後分段輸入；
  - 直接提供原始表格內容以保留完整資訊
  correct_index: 0
  explanation: LLM 對於純文字的理解力遠勝於複雜的 Excel 檔案格式。將表格轉換為 JSON 或 Markdown table 等結構化文字格式，能大幅提升模型的解析與推理準確度。
- file: subjects/gen-ai/chapter6.yaml
  id: 115017
  text: 某企業提供大型語言模型（LLM）API 服務，需支援高併發請求與流量波動，同 時要求服務不中斷並具備故障容忍能力。若以高可用性與可擴展性為主要設計原
    則，下列哪一種部署方式較為適當？（115年第一梯次）
  options:
  - 採用單一高效能虛擬機（VM）集中部署，以提升資源使用效率；
  - 建立多個模型服務實例並透過負載分散機制提供服務；
  - 將推論任務改由用戶端設備分擔，以降低伺服器負載壓力；
  - 使用 FTP 協議傳輸請求與回應，以減少服務通訊負擔
  correct_index: 1
  explanation: 為了因應高併發流量並維持高可用性（HA），最佳實務是建立多個模型服務實例（Instances），並利用負載平衡器（Load Balancer）來分散請求流量。
- file: subjects/gen-ai/chapter6.yaml
  id: 115025
  text: 某機構計畫導入生成式 AI 旅遊資訊服務對話系統自動生成多語言對話。目前每月 需人工翻譯 600 則訊息，每則成本 50 元；若改用 ChatGPT
    API，每則訊息需 2000 Tokens，而 Token 成本 0.8 元/1000 Tokens，但需額外投入系統整合費用 20 萬元。 關於投資報酬率（Return
    on Investment, ROI）評估，下列何者最為正確？（115年第一梯次）
  options:
  - 每月節省成本 29,040 元，系統整合成本約 7 個月回收；
  - 每月節省成本 30,000 元，系統整合成本約 7 個月回收；
  - 每月節省成本 28,040 元，系統整合成本約 8 個月回收；
  - 每月節省成本 25,000 元，系統整合成本約 8 個月回收
  correct_index: 0
  explanation: 每月人工成本為 600 * 50 = 30,000 元。改用 API 每月成本為 600 * (2000/1000) * 0.8 =
    960 元。每月節省 29,040 元。20 萬系統整合成本 / 29040 ≈ 6.88，約 7 個月回收。
- file: subjects/gen-ai/chapter6.yaml
  id: 115027
  text: 某紡織公司希望建立自動化品質檢測流程，既有的 AI 系統檢測到布料瑕疵時，需 自動拍照存檔、發送通知給品管人員。該公司具有一定開發人力，希望快速建置
    此工作流程，並保有彈性調整空間，下列哪一種解決方案最適合？（115年第一梯次）
  options:
  - 使用 n8n 建立工作流（Workflow） ，整合AI 檢測 API、檔案系統、通訊軟體；
  - 委外開發客製化程式，完全符合公司需求規格；
  - 採購現成的品質管理軟體，直接導入使用；
  - 使用 Excel 巨集搭配人工作業處理檢測結果
  correct_index: 0
  explanation: n8n 是一個強大的自動化工作流工具，能以視覺化方式快速串接 AI API、檔案系統與通訊軟體，既節省開發時間又保留了日後調整流程的彈性。
- file: subjects/gen-ai/chapter6.yaml
  id: 115028
  text: 某市政府交通局計劃導入生成式 AI 技術來自動生成公車到站時間預測的文字報 告，每日需處理約 50 萬筆交通資料並生成 1000 份報告。在評估導入成本時，團
    隊希望進行 Token Economics 分析（指模型推理與生成過程中，Token 使用量及其 費用） 。下列何者不屬於Token Economics 的考量範圍？（115年第一梯次）
  options:
  - 每次 API 呼叫所需的輸入 Token 數量；
  - 生成報告內容所消耗的輸出 Token 費用；
  - AI 模型訓練階段使用 Token 數量所需的 GPU 記憶體成本；
  - 模型推理過程中的 Token 使用量統計 第二科：生成式 AI 應用與規劃
  correct_index: 2
  explanation: Token Economics 專注於評估模型在推論（Inference）時消耗的輸入與輸出 Token 費用。模型訓練階段的 GPU
    運算與記憶體成本屬於基礎設施投資，不包含在內。
- file: subjects/gen-ai/chapter6.yaml
  id: 115044
  text: 某智慧製造廠導入語音互動 AI 助理，作業人員可透過語音查詢設備狀態與操作指 引。系統流程包含語音轉文字、語言模型生成回覆，以及即時查詢內部系統資
    料。測試結果顯示：語音轉文字在專業設備術語上錯誤率偏高；語言模型回覆偶 有內容不夠精準；系統整體回應速度略慢但仍在可接受範圍。若專案目標為優先 確保正確執行指令，下列改進措施的執行順序何者最合理？（115年第一梯次）
  options:
  - 優化語言模型 → 強化語音模型 → 優化系統效能 → 調整生成參數；
  - 強化語音模型 → 優化語言模型與知識補充 → 調整生成參數 → 優化系統效 能；
  - 優化系統效能 → 強化語音模型 → 優化語言模型與知識補充 → 調整生成參 數；
  - 強化語音模型 → 優化系統效能 → 優化語言模型與知識補充 → 調整生成參 數
  correct_index: 1
  explanation: 語音轉文字的錯誤會直接導致語言模型獲得錯誤的輸入，因此必須先「強化語音模型」；接著才是「優化語言模型」，最後再處理生成參數與系統效能優化。
- file: subjects/gen-ai/chapter6.yaml
  id: 115047
  text: 某製造企業規劃導入生成式 AI 協助產線異常紀錄分析，系統將根據設備回報與維 修紀錄自動產出問題摘要與建議處置說明。在試行測試階段，為降低營運與決策
    風險，下列何者最應優先驗證？（115年第一梯次）
  options:
  - AI 生成建議與實際工程判斷的一致性與正確性；
  - 系統在高資料量輸入下的處理速度與延遲表現；
  - 模型對不同設備品牌資料格式的轉換能力；
  - 異常分析報告的視覺化呈現與介面易讀性
  correct_index: 0
  explanation: AI 在異常分析中若提供錯誤建議，可能導致產線停機或工安風險。因此在試行階段，最關鍵且最優先的任務是驗證 AI 建議與人類工程師專業判斷的正確性與一致性。
