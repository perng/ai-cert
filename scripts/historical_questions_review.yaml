- file: subjects/ai-foundation/chapter1.yaml
  id: 11401
  text: 在人工智慧系統的決策流程中，下列哪一種情境最符合「人在迴圈上 （Human-over-the-loop）」所強調的監督機制？ (114年第四梯次)
  options:
  - AI 系統只能提供建議，人類需主動下達命令才能進行決策 (AI Only Provides Suggestions, Human Must Actively
    Command)，AI 僅為輔助工具。
  - 人類對 AI 的運行進行日常監督，必要時可立即介入修正或干預 (Daily Supervision with Immediate Intervention
    Capability)
  - 人類平時不參與 AI 的運作，僅在發生異常或重大錯誤時才接手控制 (No Regular Participation, Only Intervening in
    Anomalies)，屬於被動監控模式。
  - AI 的所有判斷與行動在執行前，皆須經過人類逐一審核與批准 (All Decisions Require Human Review and Approval)，屬於嚴格審核模式。
  correct_index: 1
  explanation: Human-in-the-loop (HITL) 強調在 AI 系統中保留人類的監督與介入，特別是在高風險決策或模型信心不足時。
- file: subjects/ai-foundation/chapter1.yaml
  id: 115-1-1
  text: 下列何者不屬於資料整合（Data Integration）的主要目的？ （115年第一梯次）
  options:
  - 統一不同來源資料的格式與欄位定義，以確保分析一致性
  - 識別並處理重複資料，避免影響模型訓練結果
  - 整併多來源資料，以提升資料完整性與應用價值
  - 依資料保存政策延長原始資料留存期限，以利未來可能的分析需求
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「依資料保存政策延長原始資料留存期限，以利未來可能的分析需求」，因為這最符合題幹中描述的情境與技術特性。
