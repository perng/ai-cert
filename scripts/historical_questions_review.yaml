- file: subjects/gen-ai/chapter5.yaml
  id: 115029
  text: 某農業合作社希望建立一套自動化工作流程，當農民透過手機 APP 回報田間病蟲 害照片時，系統能自動通知相關專家、建立案件紀錄並排程現場訪查。該合作社
