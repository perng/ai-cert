- file: subjects/ai-foundation/chapter10.yaml
  id: '11430_2'
  text: 在醫療診斷決策支援系統等高風險領域中， 「可解釋人工智慧 （Explainable AI, XAI） 」的核心價值最主要呈現在哪個面向？ (114年第四梯次)
