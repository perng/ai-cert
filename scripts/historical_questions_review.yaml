- file: subjects/ai-foundation/chapter6.yaml
  id: '11432_3'
  text: 在統計推論中，若樣本來自母體但呈現明顯偏態分布，且樣本數有限， 下列哪一項策略最能減少推估母體參數的偏誤？ (114年第四梯次)
  options:
