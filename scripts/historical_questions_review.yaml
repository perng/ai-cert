- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-43
  text: 關於機器學習不同的學習模式，下列敘述何者錯誤？ 1. 監督式學習（Supervised Learning）透過已標註資料學習輸入與目標之間的對應關係，常見任務包含分類與數值預測。
    2. 非監督式學習（Unsupervised Learning）雖不需標註資料，但通常需預先定義每筆資料的正確輸出類別以利模型收斂。 3. 半監督式學習（Semi-supervised
    Learning）在訓練過程中僅利用未標註資料進行特徵學習，並不涉及標註資料。 4. 自監督式學習（Self-supervised Learning）的訓練方式與監督式學習相同，皆需人工逐筆提供標註資料。
    5. 強化式學習（Reinforcement Learning）透過與環境互動並依據回饋訊號調整策略，以優化決策行為。 6. 自監督式學習（Self-supervised
    Learning）通常利用資料本身產生訓練目標，以降低對人工標註資料的依賴。 （115年第一梯次）
  options:
  - 2、3、6
  - 2、4、5
  - 1、3、6
  - "2、3、4 \n115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 \n第一科：人工智慧基礎概論 \n考試日期：115 年 03 月 21 日\
    \ \n第 11 頁，共 12 頁 \n \n答案 題目"
  correct_index: 3
  explanation: "本題測驗相關核心概念。正確解答為「2、3、4 \n115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 \n第一科：人工智慧基礎概論\
    \ \n考試日期：115 年 03 月 21 日 \n第 11 頁，共 12 頁 \n \n答案 題目」，因為這最符合題幹中描述的情境與技術特性。"
