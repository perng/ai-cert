- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-47
  text: 某企業規劃導入 AI 技術支援多項資料分析任務中，下列何種屬於結構化預測（Structured Prediction）問題？ （115年第一梯次）
  options:
  - 判斷一封電子郵件是否為垃圾郵件
  - 預測未來一週的產品需求量
  - 預測客戶是否可能流失
  - 為語音內容轉換後的文字進行逐詞標註
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「為語音內容轉換後的文字進行逐詞標註」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter2.yaml
  id: 11413
  text: 下列哪一項應用情境與機器學習類型搭配正確？ (114年第四梯次)
  options:
  - 在醫療影像資料中，僅有少部分影像有專家標註診斷，其餘大多數 影像未標註，研究者結合已標註與未標註資料來建立模型  — 監督式 學習（Supervised Learning）
  - 在自駕車模擬環境中，模型透過試駕獲得「是否安全通過路口」的 獎勵或懲罰訊號，逐步調整決策策略 — 非監督式學習 （Unsupervised Learning）
  - 在顧客購買紀錄中，利用已知的「顧客是否流失」標籤，訓練模型 以預測新顧客未來是否會流失  — 強化式學習（ Reinforcement Learning）
  - 在股票市場資料中，輸入歷史股價序列，嘗試將未來可能走勢劃分 成若干「上升型、盤整型、下降型」群組，無需使用任何標籤 — 非監 督式學習（Unsupervised
    Learning）
  correct_index: 3
  explanation: 此題涉及 機器學習範式 的核心概念。正確答案為「在股票市場資料中，輸入歷史股價序列，嘗試將未來可能走勢劃分 成若干「上升型、盤整型、下降型」群組，無需使用任何標籤
    — 非監 督式學習（Unsupervised Learning）」。
