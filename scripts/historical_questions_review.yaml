- file: subjects/ai-foundation/chapter9.yaml
  id: 11439
  text: 某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院 日數集中在 3–7 天，但仍有少數重症患者因治療需求而住院日數明顯 偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測
    準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合 此需求？  答案 題    目 (114年第四梯次)
  options:
  - 在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標 (During Model Validation, Simultaneously Presenting
    MAE and Error Indicators for Critical Care Subgroup)
  - 僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差 (Only Performing Cross-Validation on General Patient
    Samples to Avoid Critical Cases Raising Error)
  - 將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影 響 (Standardizing All Patients' Length of Stay to
    Reduce Impact of Value Range Differences)
  - 只採用單一的整體決定係數 (R²) 作為模型優劣的判斷依據 (Only Using Single Overall R² as Model Quality Judgment
    Criterion)
  correct_index: 0
  explanation: 此題涉及 評估指標 的核心概念。正確答案為「在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標」。
- file: subjects/ai-foundation/chapter9.yaml
  id: 11406
  text: 在 Lasso 模型中，L1 正則化（Regularization）導致參數收斂為零的 原因為何？ (114年第四梯次)
  options:
  - L1 正則化忽略目標變數 (L1 Regularization Ignores Target Variable)，不考慮預測目標。
  - L1 對梯度有平滑作用 (L1 Has Smoothing Effect on Gradient)，使梯度變化平緩。
  - L1 對大係數懲罰較強，促使稀疏解 (L1 Penalizes Large Coefficients More Strongly, Promoting Sparse
    Solutions)
  - L1 會轉換損失函數為非凸形 (L1 Transforms Loss Function to Non-Convex)，改變函數形狀。
  correct_index: 2
  explanation: L1 正則化 (Lasso) 具有特徵選擇的功能，因為其幾何特性（菱形約束區域）傾向於讓不重要的特徵權重收斂為 0，從而產生稀疏模型。
- file: subjects/ai-foundation/chapter9.yaml
  id: 11443
  text: 某公司欲建立員工離職風險預測模型，資料集中包含 「年度績效分數」 、 「平均每月加班時數」 、 「年齡」等數值型特徵。由於各特徵的數值範圍 差異極大（例如績效分數1–5、加班時數0–80、年齡20–65）
    ，若直 接輸入至使用梯度下降的邏輯迴歸(Logistic Regression)模型，可能 導致模型收斂緩慢或權重偏斜。為提升模型訓練效率與準確度，下列哪
    一種特徵工程方法最適合應用於這些數值特徵？ (114年第四梯次)
  options:
  - 布林轉換（Boolean Conversion），將數值轉換為布林值。
  - 時間序列分解（Time Series Decomposition），將時間序列分解為趨勢與季節性。
  - One-hot 編碼（One-hot Encoding），將類別轉換為二元欄位。
  - 數值標準化（Numerical Standardization），統一數值範圍以提升訓練效率。
  correct_index: 3
  explanation: 此題涉及 評估指標 的核心概念。正確答案為「數值標準化（Numerical Standardization）」。
- file: subjects/ai-foundation/chapter9.yaml
  id: 11419
  text: 在訓練機器學習模型時，若任務為預測房價，應選用下列哪一種損失函 數（Loss Function）來衡量預測誤差？ (114年第四梯次)
  options:
  - 均方誤差（MSE）(Mean Squared Error)，用於迴歸任務的損失函數。
  - 交叉熵損失（Cross-Entropy Loss），用於分類任務的損失函數。
  - Hinge 損失（Hinge Loss），用於 SVM 的損失函數。
  - KL 散度（Kullback-Leibler Divergence），衡量兩個機率分佈差異的指標。
  correct_index: 0
  explanation: 此題涉及 誤差分析與優化 的核心概念。正確答案為「均方誤差（MSE）」。
- file: subjects/ai-foundation/chapter9.yaml
  id: 115-1-40
  text: 某製造業公司建置機器學習模型，用於預測產品是否為瑕疵品。實際生產資料中，瑕疵品比例極低，大多數樣本皆為正常品。模型測試時發現，即使模型多數預測為正常品，仍可獲得很高的整體準確率。在此情境下，若希望更有效衡量模型對瑕疵品的辨識能力，下列何者較適合作為主要評估指標？    （115年第一梯次）
  options:
  - F1-score
  - 均方誤差（Root Mean Squared Error, RMSE）
  - 準確率（Accuracy）
  - "判定係數（R², Coefficient of Determination） \n115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 \n第一科：人工智慧基礎概論\
    \ \n考試日期：115 年 03 月 21 日 \n第 10 頁，共 12 頁 \n \n答案 題目"
  correct_index: 0
  explanation: 本題測驗相關核心概念。正確解答為「F1-score」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter9.yaml
  id: 115-1-50
  text: 某醫院使用機器學習模型篩檢癌症患者。模型預測結果會決定哪些病人需要進一步檢查。院方非常重視盡量找出所有可能的癌症患者，即希望降低漏診（Missed
    Diagnosis）風險，即便這可能增加一些誤判。下列哪一個評估指標最能反映模型找出癌症患者的能力？ （115年第一梯次）
  options:
  - 精準率（Precision）
  - 召回率（Recall）
  - 假陽性率（False Positive Rate）
  - ROC-AUC 曲線
  correct_index: 1
  explanation: 本題測驗相關核心概念。正確解答為「召回率（Recall）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 11421
  text: 某金融科技公司正開發一套違約風險預測系統，需大量處理不同客戶 的財務特徵資料。考量到資料特徵數量眾多，且希望提升預測的穩定性 與泛化能力，下列哪一種鑑別式
    AI 模型最適合？ (114年第四梯次)
  options:
  - 邏輯迴歸（Logistic Regression）
  - 支援向量機（Support Vector Machine）
  - 決策樹（Decision Tree）
  - 隨機森林（Random Forest）
  correct_index: 3
  explanation: 此題涉及 分類演算法 的核心概念。正確答案為「隨機森林（Random Forest）」。
- file: subjects/ai-foundation/chapter5.yaml
  id: 11407
  text: 貝氏分類器（Naive Bayes Classifier）常被應用於文字分類、垃圾郵 件過濾等場景。依據模型特性，它最適合歸類於下列哪一類？ (114年第四梯次)
  options:
  - 透過直接學習輸入特徵與目標標籤之間的邊界或關係來進行分類 的模型
  - 透過建構資料的整體分布，並利用條件關係進行推斷和分類的模 型
  - 側重探索資料中樣本間的相似性，將資料自動分成不同群組的模 型
  - 透過試錯學習，根據行動結果的獎勵或懲罰來優化決策策略的模型
  correct_index: 1
  explanation: 此題涉及 分類演算法 的核心概念。正確答案為「透過建構資料的整體分布，並利用條件關係進行推斷和分類的模 型」。
- file: subjects/ai-foundation/chapter5.yaml
  id: 11420
  text: 某醫院希望開發一個系統，根據患者的年齡、血壓與BMI 等資訊，預測  答案 題    目 其罹患糖尿病的機率（0~1） ，並依據預測值是否超過0.5
    做出風險警 示。下列哪一種模型最適合用於此分類任務？ (114年第四梯次)
  options:
  - 邏輯迴歸（Logistic Regression）
  - 支援向量機（Support Vector Machine）
  - 決策樹（Decision Tree）
  - K 平均演算法（K-means）
  correct_index: 0
  explanation: 此題涉及 分類演算法 的核心概念。正確答案為「邏輯迴歸（Logistic Regression）」。
- file: subjects/ai-foundation/chapter5.yaml
  id: 11415
  text: 某模型使用 K-近鄰演算法（KNN）進行分類，K 設為 3。 一筆新的測 試資料輸入後，與其最接近的3 筆資料的類別如下：鄰近樣本1：類別 A；鄰近樣本
    2：類別B；鄰近樣本 3：類別A。請問模型會將這筆資料 預測為哪一類別？ (114年第四梯次)
  options:
  - 類別 A
  - 類別 B；  答案 題    目
  - 類別 A 與 B 各一半，無法分類
  - 類別 A 或 B，視距離遠近加權而定
  correct_index: 0
  explanation: 此題涉及 分類演算法 的核心概念。正確答案為「類別 A」。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-8
  text: 某零售企業在建置機器學習模型預測顧客購買機率時， 資料同時包含大量稀疏類別特徵與數值型特徵。 團隊希望模型既能學習過去已出現的特徵組合規律，也能對未出現的特徵組合做出合理預測。
    下列哪一種模型架構最適合此類需求？ （115年第一梯次）
  options:
  - 線性迴歸（Linear Regression）
  - 決策樹（Decision Tree）
  - 支援向量機（Support Vector Machine, SVM）
  - 寬深模型（Wide and Deep）
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「寬深模型（Wide and Deep）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-10
  text: 某設計公司導入生成式 AI（Generative AI）工具，用於自動產生產品概念圖與風格草圖。為了讓系統能依據既有圖像資料產生具有變化且風格一致的新圖像，模型必須具備學習資料特性並生成新樣本的能力。下列哪一種模型技術或方法最符合上述需求？    （115年第一梯次）
  options:
  - 隱變量自編碼器（Variational Autoencoder, V AE）
  - 隨機森林（Random Forest）
  - K-近鄰演算法（K-Nearest Neighbors, KNN）
  - 貝氏網路（Bayesian Network）
  correct_index: 0
  explanation: 本題測驗相關核心概念。正確解答為「隱變量自編碼器（Variational Autoencoder, V AE）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-20
  text: 某團隊訓練影像分類模型，發現模型在訓練資料上的準確率達 98%，但在測試資115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 第一科：人工智慧基礎概論
    考試日期：115 年 03 月 21 日 第 5 頁，共 12 頁  答案 題目 料上僅有 72%。若團隊希望提升模型對新資料的適應能力，並增加訓練資料的多樣性，下列何者最適合？    （115年第一梯次）
  options:
  - 增加模型的深度與參數量，使模型學習更多細節
  - 對訓練影像進行旋轉、翻轉等隨機變化
  - 提高訓練速度，使模型更快完成學習
  - 僅保留模型表現較好的訓練資料
  correct_index: 1
  explanation: 本題測驗相關核心概念。正確解答為「對訓練影像進行旋轉、翻轉等隨機變化」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-21
  text: 某時尚品牌導入生成式 AI（Generative AI）技術，建立服裝設計輔助系統。系統需根據設計師輸入的風格條件，自動產生具有高度視覺品質、細節穩定且風格變化自然的服裝草圖。團隊特別重視生成結果的穩定性與多樣性控制能力。在此需求下，下列哪一種模型技術或方法較為適合？    （115年第一梯次）
  options:
  - 支援向量機（Support Vector Machine, SVM）
  - 生成對抗網路（Generative Adversarial Network, GAN）
  - 決策樹（Decision Tree）
  - 擴散模型（Diffusion Model）
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「擴散模型（Diffusion Model）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-22
  text: 某製造業工廠規劃導入 AI 監控系統，持續分析設備感測數據（如溫度、震動與壓力） 。系統需能在缺乏完整異常標註資料的情況下，辨識與一般運作型態顯著不同的狀態，並發出預警。在此需求下，下列何種技術較為適合？    （115年第一梯次）
  options:
  - 使用支援向量機（Support Vector Machine, SVM）建立異常分類模型
  - 以決策樹（Decision Tree）學習異常類型的判斷規則
  - 採用變分自編碼器（Variational Autoencoder, V AE）學習正常資料分佈
  - 使用生成對抗網路（Generative Adversarial Network, GAN）直接預測異常標籤
  correct_index: 2
  explanation: 本題測驗相關核心概念。正確解答為「採用變分自編碼器（Variational Autoencoder, V AE）學習正常資料分佈」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-32
  text: 某環保局想建立 AI 系統監測空氣品質，透過分析監測站攝影機拍攝的影像來識別煙霧。系統需要在影像中找出煙霧區域並標示其位置和範圍。這個應用主要屬於電腦視覺的哪個技術領域？    （115年第一梯次）
  options:
  - 影像分類，判斷影像中是否有煙霧
  - 物件偵測，找出煙霧位置並用方框標示
  - 影像分割，精確標示出煙霧的像素區域
  - 人臉辨識，識別煙霧來源
  correct_index: 2
  explanation: 本題測驗相關核心概念。正確解答為「影像分割，精確標示出煙霧的像素區域」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter5.yaml
  id: 115-1-36
  text: 某電子製造公司建置 AI 視覺檢測系統，用於辨識 PCB 電路板製程缺陷。系統在影像判讀任務上表現穩定，但其模型設計與訓練目標皆侷限於特定應用範圍，無法直接遷移至其他營運決策任務。依人工智慧能力範疇分類，下列何者最符合該系統特性？    （115年第一梯次）
  options:
  - 弱 AI（Weak AI/Narrow AI）
  - 強 AI（Strong AI）
  - 通用人工智慧（Artificial General Intelligence, AGI）
  - 超級人工智慧（Artificial Superintelligence, ASI）
  correct_index: 0
  explanation: 本題測驗相關核心概念。正確解答為「弱 AI（Weak AI/Narrow AI）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter4.yaml
  id: 11402
  text: 下列哪一種特徵工程技巧，最適合將「星期幾」和「24 小時制時間」 這兩個欄位結合，以預測通勤時間？ (114年第四梯次)
  options:
  - One-hot 編碼（One-hot encoding）
  - 正規化（Normalization）
  - 特徵交叉（Feature Cross）
  - 寬深模型（Wide and Deep）
  correct_index: 2
  explanation: 此題涉及 進階特徵處理 的核心概念。正確答案為「特徵交叉（Feature Cross）」。
- file: subjects/ai-foundation/chapter4.yaml
  id: '11441_1'
  text: 一家旅遊平台希望建立模型，預測顧客下次是否會再次透過該平台訂 房。資料包含：顧客 ID、年齡、旅遊次數、平均花費金額、主要交通 方式（火車/飛機/自駕/公車）
    、會員等級（普通/進階/白金） 、是否為 海外旅遊等。下列哪一種特徵工程方法最適合處理「主要交通方式」欄 位？ (114年第四梯次)
  options:
  - 布林轉換（Boolean Conversion）
  - 序數編碼（Ordinal Encoding）
  - 數值標準化（Numerical Standardization）
  - One-hot 編碼（One-hot Encoding）
  correct_index: 3
  explanation: 此題涉及 類別特徵編碼 的核心概念。正確答案為「One-hot 編碼（One-hot Encoding）」。
- file: subjects/ai-foundation/chapter4.yaml
  id: '11434_1'
  text: 在零售業進行客戶行為分析時，資料倉儲中發現多個欄位儲存相同的 購買金額資訊 （例如：amount_usd、total_price、transaction_value），
    但其單位、命名慣例及格式不一致，進而導致特徵工程階段混淆模型輸 入。針對此種跨欄位語義重疊與結構冗餘問題，下列哪一種資料處理策 略最合適且具實務可行性？ (114年第四梯次)
  options:
  - 利用資料探勘技術自動選擇資料集中對目標變數最敏感的欄位，其 他欄位捨棄即可，避免過度清理干擾原始結構
  - 保留所有相似欄位，交由高階模型 （如Gradient Boosting或 Deep Learning）自動學習特徵關聯，無需手動處理
  - 建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義 合併，減少重複資訊影響特徵重要性估計
  - 將重複欄位視為類別欄位，進行One-hot編碼 （One-hot encoding） 後輸入模型，以避免數值誤導模型學習過程
  correct_index: 2
  explanation: 此題涉及 類別特徵編碼 的核心概念。正確答案為「建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義 合併，減少重複資訊影響特徵重要性估計」。
- file: subjects/ai-foundation/chapter4.yaml
  id: '11435_1'
  text: 某大型零售企業準備將商品推薦模型上線，專案團隊在檢視訓練資料 時，發現部分商品類別（例如高價商品）樣本數量極少，而多數樣本集 中於低價商品。若此不平衡問題未妥善處理，下列何種狀況最可能在實
    際推薦結果中發生？ (114年第四梯次)
  options:
  - 模型在預測時傾向輸出稀有類別，導致雖能捕捉到少數樣本，但精 確率（Precision）顯著下降
  - 模型由於類別分布不均，難以建立有效的線性分離邊界，進而無法 收斂
  - 模型過度聚焦於稀有類別樣本，導致對多數類別的預測能力下降， 整體效能受損；  答案 題    目
  - 模型學到的決策邊界主要由多數類別主導，忽視了稀有類別，造成 該類別的召回率（Recall）大幅降低
  correct_index: 3
  explanation: SMOTE 是一種過採樣技術，透過在少數類樣本間進行插值來合成新樣本，比單純複製樣本更能提升模型的泛化能力。
- file: subjects/ai-foundation/chapter4.yaml
  id: '11433_1'
  text: 在工業物聯網架構中 ， 進行設備預測性維護 （Predictive Maintenance） 時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料，
    下列哪一種方法最能兼顧模型穩定性與異常偵測效能？ (114年第四梯次)
  options:
  - 將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭 配全序列訓練模型（如 LSTM）
  - 對時間序列進行差分與標準化後，使用傳統監督式學習模型（如 SVM）進行分類訓練
  - 使用經過時間序列特化的 SMOTE 技術生成異常樣本，以平衡異常與 正常資料比例
  - 採用基於重建誤差的自編碼器模型（ Sequence-to-Sequence Autoencoder）進行異常偵測，並僅使用正常資料進行訓練
  correct_index: 3
  explanation: SMOTE 是一種過採樣技術，透過在少數類樣本間進行插值來合成新樣本，比單純複製樣本更能提升模型的泛化能力。
- file: subjects/ai-foundation/chapter4.yaml
  id: '11446_1'
  text: 某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬 性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提 升模型效能。下列哪一種描述最符合監督式特徵選擇（
    Supervised Feature Selection）的概念？ (114年第四梯次)
  options:
  - 根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目標變數
  - 評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵
  - 使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較大的欄位
  - 將特徵透過降維方法（如 PCA）轉換為新特徵，再用於模型訓練
  correct_index: 1
  explanation: 此題涉及 特徵選擇 的核心概念。正確答案為「評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵」。
- file: subjects/ai-foundation/chapter8.yaml
  id: '11422_1'
  text: 關於變分自編碼器（Variational Autoencoder, VAE）的運作流程，下 列何者敘述最為正確？ (114年第四梯次)
  options:
  - 解碼器的任務是將低維壓縮向量分類為不同類別 (Decoder's Task Is to Classify Low-Dimensional Compressed
    Vectors into Different Categories)，屬於分類任務。
  - 編碼器將輸入資料轉換為可視化圖像以利模型學習 (Encoder Converts Input Data to Visualizable Images for
    Model Learning)，用於視覺化。
  - 編碼器將資料轉換為潛在空間表示，解碼器再重建資料 (Encoder Converts Data to Latent Space Representation,
    Decoder Reconstructs Data)
  - 編碼器利用最大邊際機率對資料進行異常點偵測 (Encoder Uses Maximum Marginal Probability for Anomaly Detection)，屬於異常偵測。
  correct_index: 2
  explanation: 此題涉及 生成式 AI 原理 的核心概念。正確答案為「編碼器將資料轉換為潛在空間表示，解碼器再重建資料」。
- file: subjects/ai-foundation/chapter8.yaml
  id: '11426_1'
  text: 在深度學習模型的微調（Fine-tuning）過程中，可能出現所謂的「災 難性遺忘 （Catastrophic Forgetting） 」 。 此現象最可能造成哪種情況？
    (114年第四梯次)
  options:
  - 由於計算資源或訓練步驟不足，模型在微調過程中無法完整收斂， 導致學習效果受限
  - 微調後模型的表現變得隨機，無法有效記憶新學到的模式與知識
  - 微調後模型的部分權重產生偏移，導致模型無法針對較長的文字進 行回應
  - 模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛 知識，在原有任務或廣泛領域上表現變差
  correct_index: 3
  explanation: 此題涉及 LLM 技術與應用 的核心概念。正確答案為「模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛 知識，在原有任務或廣泛領域上表現變差」。
- file: subjects/ai-foundation/chapter8.yaml
  id: 11408
  text: 為提升生成式 AI 系統回應的語境一致性，常會結合哪類模型技術？ (114年第四梯次)
  options:
  - 決策樹分類器（Decision Tree Classifier），用於分類任務的樹狀模型。
  - 條件語言模型（Conditional Language Model），根據條件生成文本的模型。
  - 強化學習 Q-learning函數模型 (Reinforcement Learning Q-learning Function Model)，用於強化學習的價值函數。
  - 基因演算法（Genetic Algorithm），基於生物進化的優化演算法。
  correct_index: 1
  explanation: 此題涉及 生成式 AI 原理 的核心概念。正確答案為「條件語言模型（Conditional Language Model）」。
- file: subjects/ai-foundation/chapter8.yaml
  id: '11438_1'
  text: 某公司建置基於檢索增強生成（RAG）的知識查詢系統，需同時兼顧查 詢效能與資料的即時更新。近期發現回應內容偶爾過時，且每次更新文 件都需完整重建索引，導致系統在更新期間無法服務。若要解決此問題
    並提升整體穩健性，下列哪項做法最適合？ (114年第四梯次)
  options:
  - 調整生成模型的回應隨機性參數，以降低答案偏差並提升一致性
  - 提升檢索與索引的運算效能，以縮短查詢與更新所需時間
  - 採用索引的增量或分段更新方式，使新資料能即時納入而不需全部 重建
  - 建立常見問題的標準答案集，透過快速檢索回應以降低模型負擔
  correct_index: 2
  explanation: RAG (檢索增強生成) 結合了檢索系統與生成模型，能讓 LLM 參考外部知識庫回答問題，有效減少幻覺並確保資訊時效性。
- file: subjects/ai-foundation/chapter8.yaml
  id: '11450_2'
  text: 某雲端服務公司計畫將大型語言模型部署於線上系統，並以批次推論  答案 題    目 （Batch Inference）方式處理每日上百萬筆用戶請求。專案團隊在評
    估可能遇到的挑戰時，下列哪一項通常不會被視為批次推論階段的主 要難題？ (114年第四梯次)
  options:
  - 如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸 出
  - 當批次規模增大時，如何降低推論延遲並保持即時回應能力
  - 在推論過程中，有效管理與分配龐大的輸入資料量以避免資源壅 塞
  - 在叢集環境中精確安排推論任務，以提升GPU/TPU 等硬體資源的利 用率 《以下空白》
  correct_index: 0
  explanation: 此題涉及 LLM 技術與應用 的核心概念。正確答案為「如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸 出」。
- file: subjects/ai-foundation/chapter8.yaml
  id: 115-1-12
  text: ChatGPT、Gemini 等對話型生成式 AI 工具所依據的基礎模型技術，下列何者正確？ （115年第一梯次）
  options:
  - 決策樹（Decision Tree）
  - 大型語言模型（Large Language Model, LLM）
  - 生成對抗網路（Generative Adversarial Network, GAN）
  - 圖卷積網路（Graph Convolutional Network, GCN）
  correct_index: 1
  explanation: 本題測驗相關核心概念。正確解答為「大型語言模型（Large Language Model, LLM）」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter8.yaml
  id: 115-1-25
  text: 在大型語言模型（LLM）的推論服務中，常透過請求批次處理（Batching）來提升系統效能。關於批次處理（Batching）機制的影響，下列敘述何者最正確？    （115年第一梯次）
  options:
  - 'Batching 可提升加速器資源使用效率並增加整體吞吐量（Throughput） ，但在部

    分情境下可能對單筆請求延遲造成影響'
  - Batching 主要用於加快單筆請求回應時間
  - 'Batching 的效益主要來自降低記憶體使用量，對於吞吐量（Throughput）與延

    遲表現影響有限'
  - Batching 在低併發（Concurrency）請求下，仍能明顯提升系統效能
  correct_index: 0
  explanation: '本題測驗相關核心概念。正確解答為「Batching 可提升加速器資源使用效率並增加整體吞吐量（Throughput） ，但在部

    分情境下可能對單筆請求延遲造成影響」，因為這最符合題幹中描述的情境與技術特性。'
- file: subjects/ai-foundation/chapter8.yaml
  id: 115-1-41
  text: 在大型語言模型（LLM）的效能優化中，Flash Attention 常被用來改善 Transformer注意力機制的運算效率。關於 Flash Attention
    的主要效益，下列敘述何者最正確？ （115年第一梯次）
  options:
  - '透過忽略影響較小的注意力權重，減少模型需要計算的關聯數量，以降低運算

    成本'
  - '透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速

    度與資源使用效率'
  - 透過增加注意力計算的並行程度，使模型可同時處理更多注意力頭部
  - 透過將注意力結果暫存於高速快取記憶體，以避免重複計算造成延遲
  correct_index: 1
  explanation: '本題測驗相關核心概念。正確解答為「透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速

    度與資源使用效率」，因為這最符合題幹中描述的情境與技術特性。'
- file: subjects/ai-foundation/chapter3.yaml
  id: '11448_2'
  text: 若希望檢視某一連續型數據的分布情形 （如集中程度、偏態或是否呈現 多峰） ，下列哪一種應用情境最適合使用直方圖（Histogram） 來進行 分析？
    (114年第四梯次)
  options:
  - 探討顧客年齡資料的整體分布特徵，並檢視是否存在異常集中或分 散現象
  - 比較不同商品在各月份的銷售額變化趨勢，以觀察季節性波動
  - 追蹤公司近一年營收的時間序列變化，以了解整體成長趨勢
  - 檢視產品價格與月銷售量之間的關聯性，以評估是否具線性相關
  correct_index: 0
  explanation: 直方圖 (Histogram) 是觀察連續型數值資料分布（如年齡、收入）的最佳工具，能直觀呈現數據的集中趨勢、偏態與峰度。
- file: subjects/ai-foundation/chapter3.yaml
  id: '11437_1'
  text: 某金融科技公司在利用歷史交易資料建立風險控管模型時，嘗試推估 整體詐騙交易比例。近期發現，樣本間存在明顯的時間序列相關性，導 致模型在實際偵測新交易時誤判率升高。若希望同時改善詐騙比例推
    估的準確性並提升模型的穩健性，下列哪一種做法最為合適？ (114年第四梯次)
  options:
  - 擴充樣本數量，以涵蓋更多潛在的詐騙型態，但維持既有的隨機抽 樣方式不變
  - 採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層， 以保存原始的時間結構特性
  - 將資料完全隨機打散，以降低序列相關性對模型訓練造成的影響
  - 在模型評估時，針對相鄰時間區段進行誤差合併，以便用整體估計 方式修正詐騙比例
  correct_index: 1
  explanation: 此題涉及 探索式資料分析 (EDA) 的核心概念。正確答案為「採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層， 以保存原始的時間結構特性」。
- file: subjects/ai-foundation/chapter3.yaml
  id: 11403
  text: 下列哪一種圖表最適合用來呈現並分析「兩個數值型變數」之間的關 係，例如觀察身高與體重的相關性？ (114年第四梯次)
  options:
  - 散佈圖（Scatter Plot）
  - 折線圖（Line Chart）
  - 直方圖（Histogram）
  - 長條圖（Bar Chart）
  correct_index: 0
  explanation: 此題涉及 數據類型與儲存 的核心概念。正確答案為「散佈圖（Scatter Plot）」。
- file: subjects/ai-foundation/chapter3.yaml
  id: '11445_1'
  text: 某醫院研究團隊蒐集了大量病患的「收縮壓」數據，經檢驗後顯示此數 值大致呈現常態分布。在進行後續模型分析前，研究人員希望妥善處理 可能存在的極端血壓數值。下列哪一種做法最為合適？
    (114年第四梯次)
  options:
  - 將所有極端偏高或偏低的血壓數據直接刪除，以保留最具代表性的 病患樣本
  - 使用對數轉換（Log Transformation） ，將數據壓縮至更接近常態， 以降低極端值的影響
  - 透過 Z 分數（Z-score）或標準差範圍檢測異常值，並依研究需求決 定是否調整或移除；  答案 題    目
  - 將檢測到的離群值以 Label Encoding 編碼，轉換為序號標籤以避 免影響原始分布
  correct_index: 2
  explanation: 此題涉及 探索式資料分析 (EDA) 的核心概念。正確答案為「透過 Z 分數（Z-score）或標準差範圍檢測異常值，並依研究需求決
    定是否調整或移除；  答案 題    目」。
- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-3
  text: 下列何者不符合非監督式學習（Unsupervised Learning）的典型特徵？ （115年第一梯次）
  options:
  - 模型可依據資料中的特徵相似性進行自動分群
  - 訓練過程中不需仰賴事先定義的標籤資料
  - 常用於探索資料的潛在結構或隱含模式
  - 模型主要學習輸入特徵與既定目標標記之間的對應關係
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「模型主要學習輸入特徵與既定目標標記之間的對應關係」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-4
  text: 某保險公司建立 AI 理賠金額預測模型。歷史理賠資料經檢定後呈近似常態分佈，但仍存在少數極端高額案件。資料科學團隊在不破壞整體分佈特性的前提下，規劃進行離群值處理。下列何者最不適當？    （115年第一梯次）
  options:
  - 依統計準則（如 Z-score 或 IQR）評估後，再決定是否調整或處理極端值
  - 採用截尾（Trimming）處理極端值，以提升模型穩定性
  - '使用 One-hot 編碼（One-hot Encoding）將離群值轉換為類別特徵以改善數值穩

    定性'
  - 結合領域知識評估其合理性，再決定保留或修正
  correct_index: 2
  explanation: '本題測驗相關核心概念。正確解答為「使用 One-hot 編碼（One-hot Encoding）將離群值轉換為類別特徵以改善數值穩

    定性」，因為這最符合題幹中描述的情境與技術特性。'
- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-5
  text: 某銀行建立 AI 詐欺交易偵測模型。歷史交易資料中，詐欺樣本比例極低，導致模型訓練時偏向預測為「正常交易」 。資料科學團隊評估採用SMOTE（Synthetic
    Minority Over-sampling Technique）改善訓練資料分佈。下列何者最符合 SMOTE技術的主要功能？ （115年第一梯次）
  options:
  - 透過隨機刪除部分正常交易資料，以降低類別失衡程度
  - 依據少數類別樣本的特徵空間，合成產生新的少數類別樣本
  - 調整模型的損失函數（Loss Function）權重，使誤判少數類別時的懲罰提高
  - "以交叉驗證（Cross-validation）方式重新分割資料集，使各折資料類別比例一\n115 年第一次 AI 應用規劃師-初級能力鑑定【公告試題】 \n\
    第一科：人工智慧基礎概論 \n考試日期：115 年 03 月 21 日 \n第 2 頁，共 12 頁 \n \n答案 題目 \n致"
  correct_index: 1
  explanation: 本題測驗相關核心概念。正確解答為「依據少數類別樣本的特徵空間，合成產生新的少數類別樣本」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter3.yaml
  id: 115-1-6
  text: 資料科學團隊在模型訓練前，需對數值特徵進行正規化（Normalization）或標準化（Standardization） 。為確保模型評估結果具真實性並避免資料洩漏（Data
    Leakage） ，下列何者為最適當的作法？ （115年第一梯次）
  options:
  - 於資料分割前，先對完整資料集計算統計量並進行標準化處理
  - '先分割訓練資料（Training  Data ）和測試資料（Test Data） ，並各自獨立計算

    統計量後進行標準化'
  - '先分割訓練資料（Training Data）和測試資料（Test Data） ，僅以訓練資料計算

    統計量，再套用至測試資料'
  - '僅對訓練資料（Training Data）進行標準化處理，測試資料（Test Data）保持原

    始數值'
  correct_index: 2
  explanation: '本題測驗相關核心概念。正確解答為「先分割訓練資料（Training Data）和測試資料（Test Data） ，僅以訓練資料計算

    統計量，再套用至測試資料」，因為這最符合題幹中描述的情境與技術特性。'
