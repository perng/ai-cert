  - 增加訓練樣本數量，以提升模型學習能力
  - 調整模型中的啟動函數設定，以改善訓練過程的穩定性
  - 簡化模型結構，以降低模型過度擬合的可能性
  correct_index: 2
  explanation: 本題測驗相關核心概念。正確解答為「調整模型中的啟動函數設定，以改善訓練過程的穩定性」，因為這最符合題幹中描述的情境與技術特性。
