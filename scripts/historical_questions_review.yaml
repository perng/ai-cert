    碼資料庫提供建議； 第二科：生成式 AI 應用與規劃」。
- file: subjects/gen-ai/chapter5.yaml
  id: '11437_3'
  text: 在機器學習模型的實務應用中，常會出現數據漂移（Data Drift）的情 況。此現象主要是指下列哪一種情況？ (114年第四梯次)
  options:
  - 訓練時使用的資料分佈，與部署後實際輸入資料的統計特徵隨時間逐漸出現差異，導致模型表現衰退
  - 在資料前處理過程中，因特徵刪減或缺失補值不當，造成樣本資訊量下降
  - 模型對訓練數據擬合過度，在未知數據上泛化能力不足
  - 後端資料庫因欄位定義或結構調整，導致特徵提取流程與原始設計不一致
  correct_index: 0
  explanation: 此題涉及 在機器學習模型的實務... 的核心概念。正確答案為「訓練時使用的資料分佈，與部署後實際輸入資料的統計特徵隨時間 逐漸出現差異，導致模型表現衰退；」。
