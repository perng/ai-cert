  correct_index: 3
  explanation: '本題測驗相關核心概念。正確解答為「長短期記憶網路（Long Short-Term Memory, LSTM） ，改善RNN 的長期記憶問

    題」，因為這最符合題幹中描述的情境與技術特性。'
- file: subjects/ai-foundation/chapter7.yaml
  id: 115-1-45
  text: 某團隊訓練深層神經網路模型時，發現訓練誤差長時間幾乎未下降，模型參數更新幅度極小，呈現學習停滯現象。若研判問題與梯度傳遞效率有關，下列何者最適合的改善策略？    （115年第一梯次）
  options:
