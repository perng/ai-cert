- file: subjects/gen-ai/chapter5.yaml
  id: 115008
  text: 某製造企業規劃於設備端建置邊緣運算（Edge Computing）架構，並以 No- Code/Low-Code 平台開發即時監控應用。測試顯示，系統在雲端環境執行順暢，
