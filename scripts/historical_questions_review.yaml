- file: subjects/ai-foundation/chapter2.yaml
  id: 11411
  text: 下列哪一類問題最適合使用非監督式學習（Unsupervised Learning） 來處理？ (114年第四梯次)
  options:
  - 根據已標記的醫療影像訓練模型診斷疾病
