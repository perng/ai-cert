  options:
  - 建立隨機森林模型，預測使用者是否會完成購買
  - 使用 K-means 對使用者群進行分群並立即制定對應促銷策略
  - 繪製各類流量來源對轉換率的關聯圖，尋找潛在關係
  - 對不同購物路徑設定統計假設並進行雙樣本 t 檢定
  correct_index: 2
  explanation: 此題涉及 強化學習 的核心概念。正確答案為「繪製各類流量來源對轉換率的關聯圖，尋找潛在關係」。
- file: subjects/ai-foundation/chapter6.yaml
  id: '11440_2'
  text: 關 於 監 督 式 學 習 （Supervised Learning ） 與 非 監 督 式 學 習 （Unsupervised Learning）的目標，下列敘述何者錯誤？
    1.非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與 降維，而不依賴外部標籤。 2.監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測
    任務。 3.非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。 4.監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間 的差距，學習輸入與目標之間的對應函數。
    5.所有監督式學習任務都必須要有大量完整標註資料，否則無法進行 任何有效的模型訓練。 6.非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進 行模式學習。
    (114年第四梯次)
  options:
  - 3、5、6
  - 1、4、6
  - 2、4、6
  - 2、3、5
  correct_index: 3
  explanation: 此題涉及 關聯規則 的核心概念。正確答案為「2、3、5」。
- file: subjects/ai-foundation/chapter6.yaml
  id: '11417_2'
  text: 一間金融科技公司設計一款智慧投資系統，該系統會根據市場變化自 動決定「買進」 、 「持有」或「賣出」的行動，並根據每次交易後的盈虧 結果，逐步優化下一次的投資策略。整個過程中，系統不依賴事先標記
    的資料，而是根據歷次行動獲得的獎勵進行調整。請問此系統最可能採 用哪一種學習方法？ (114年第四梯次)
  options:
  - 強化式學習（Reinforcement Learning）
  - 監督式學習（Supervised Learning）
  - 非監督式學習（Unsupervised Learning）
  - 遷移學習（Transfer Learning）
  correct_index: 0
  explanation: 此題涉及 強化學習 的核心概念。正確答案為「強化式學習（Reinforcement Learning）」。
- file: subjects/ai-foundation/chapter6.yaml
  id: '11444_2'
  text: 在機器學習中， 「叢集（Clustering） 」方法最典型的應用情境是下列何 者？ (114年第四梯次)
  options:
  - 根據歷史交易紀錄與已標註的詐欺案例，訓練模型來偵測未來的詐 欺交易
  - 使用醫療數據與病患的診斷標籤，建立模型以預測病人是否罹患特 定疾病
  - 根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進 行差異化行銷
  - 透過大量已標註影像，訓練深度學習模型來辨識照片中的物件種類
  correct_index: 2
  explanation: 此題涉及 分群演算法 的核心概念。正確答案為「根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進 行差異化行銷」。
- file: subjects/ai-foundation/chapter6.yaml
  id: '11418_2'
  text: 關於 Q-Learning 與 Deep Q-Learning，下列敘述何者最正確？ (114年第四梯次)
  options:
  - Q-Learning 與 Deep Q-Learning 的差異在於是否使用標記資料作 為學習基礎
  - Q-Learning 可處理任意維度的狀態空間，因此比 Deep Q-Learning 更靈活
  - Deep Q-Learning 透過深度神經網路近似 Q 值，避免了 Q 表在高維 空間中難以擴展的問題
  - Deep Q-Learning 無法搭配經驗回放（Experience Replay） ，因為 會導致樣本順序被打亂
  correct_index: 2
  explanation: 此題涉及 強化學習 的核心概念。正確答案為「Deep Q-Learning 透過深度神經網路近似 Q 值，避免了 Q 表在高維 空間中難以擴展的問題」。
- file: subjects/ai-foundation/chapter6.yaml
  id: 115-1-19
  text: 某物流公司導入強化式學習（Reinforcement Learning）優化車隊調度。模型在系統運行過程中，會依據不同配送狀態動態調整行動選擇方式，使決策結果逐步朝較佳績效收斂。上述模型在學習過程中的調整行為，最符合下列哪一項強化式學習核心機制？    （115年第一梯次）
  options:
  - 調整策略函數以改變行動選擇機率
  - 更新訓練資料分布以降低模型偏差
  - 重新分群狀態資料以識別決策類型
  - 建立正確決策標籤進行誤差修正
  correct_index: 0
  explanation: 本題測驗相關核心概念。正確解答為「調整策略函數以改變行動選擇機率」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter6.yaml
  id: 115-1-24
  text: 某企業導入大型語言模型作為客服助理。模型已具備穩定語言能力，但在回覆偏好一致性與組織規範遵循方面仍需優化，團隊因此規劃導入人類反饋強化學習（RLHF）流程，下列何者最不屬於
