- file: subjects/ai-foundation/chapter1.yaml
  id: 115-1-42
  text: 某企業建置基於檢索增強生成（RAG）的法遵知識輔助系統，用於整合法規條文、內控制度與歷史函釋文件。系統運行後發現，每當法規更新或新增解釋文件時，需重新建立完整索引，導致更新期間系統暫停服務，且部分回應偶有引用舊版內容的情形。若希望在兼顧查詢效率的同時提升知識更新彈性與系統穩定性，下列何者最適合？    （115年第一梯次）
  options:
  - 提升模型推論資源配置，以維持高流量查詢時的回應效能
  - 調整語言模型的輸出限制機制，以降低生成內容與法規不一致的風險
  - 建立固定法規問答對照表，以規則化方式優先回應常見問題
  - 導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter1.yaml
  id: 115-1-49
  text: 某 AI 科技公司在工業缺陷檢測領域已有成熟的辨識產品經驗。現欲與新客戶合作開發一項類似產品的表面瑕疵檢測系統，但因新產品量產不久，標註樣本極為稀少且專家標註成本高昂。在不大幅增加標註預算的前提下，下列哪一種做法最能利用該公司既有的技術優勢來提升模型表現？（115年第一梯次）
  options:
  - 增加模型參數規模，使模型具備更強表達能力
  - 透過資料增強（Data Augmentation）擴展影像變化，以提升模型穩定性
  - 重新蒐集大量影像並進行完整人工標註
  - 採用遷移學習（Transfer Learning） ，利用既有預訓練模型進行調整
  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「採用遷移學習（Transfer Learning） ，利用既有預訓練模型進行調整」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter10.yaml
  id: '11429_2'
  text: 在「可解釋人工智慧（Explainable AI, XAI） 」領域中，LIME（Local Interpretable Model-agnostic
    Explanations）方法最核心的應用目 的是什麼？ (114年第四梯次)
  options:
  - 解釋單一樣本（局部預測）的黑箱模型決策過程
  - 全面提升黑箱模型整體的預測準確度
  - 將黑箱模型轉換成完全可解釋的模型作為替代
