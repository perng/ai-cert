  correct_index: 3
  explanation: 本題測驗相關核心概念。正確解答為「以未標註語料為主進行長週期表示學習訓練，以提升模型基礎語言建模能力」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/ai-foundation/chapter6.yaml
  id: 115-1-30
  text: 某商業銀行想建立洗錢行為檢測系統，擁有過去 5 年的交易記錄，其中包含已確認的洗錢案例（標記為「異常」 ）和正常交易（標記為「正常」 ） 。銀行希望系統能自動識別新交易是否為洗錢行為，請問使用下列哪一種機器學習方法最為適合？    （115年第一梯次）
  options:
  - 監督式學習的分類問題
  - 非監督式學習的分群問題
  - 強化式學習
  - 非監督式學習的關聯規則挖掘
  correct_index: 0
  explanation: 本題測驗相關核心概念。正確解答為「監督式學習的分類問題」，因為這最符合題幹中描述的情境與技術特性。
- file: subjects/gen-ai/chapter5.yaml
  id: '11425_3'
  text: 某新創公司開發一套圖像描述生成系統，能根據輸入的照片自動產生 說明文字。為了讓產生的描述文字能與圖片資訊精準對應，下列哪一種 設計思路最關鍵？ (114年第四梯次)
  options:
  - 強化語言模型的句法與流暢性，確保生成文字更自然易讀 (Enhancing Syntax and Fluency)
  - 在生成過程中結合圖片特徵與語言建模，讓模型同時利用影像內容與文字資訊 (Combining Image Features and Language Modeling)
  - 調整生成策略（如 Beam Search 或溫度參數） ，以提升輸出文字的合理性 (Adjusting Generation Strategy)
  - 專注於文字序列上下文的建模，只提升文字間的連貫性 (Focusing on Text Context Modeling)
  correct_index: 1
  explanation: 圖像描述生成 (Image Captioning) 的核心在於將影像特徵與文字生成模型結合，使生成的文字能準確反映影像內容，而非僅是通順的句子。
- file: subjects/gen-ai/chapter5.yaml
  id: '11415_3'
  text: 某客服自動回應系統希望根據不同客戶群體調整回覆風格。在兼顧即 時性與效果的前提下，下列哪一種方案最適合？ (114年第四梯次)
  options:
