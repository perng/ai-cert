  - 增加樣本數並考慮使用分位數或中位數作為中心趨勢估計
  - 將樣本隨機重新排列後，多次計算平均值以消除偏態影響
  - 完全依賴樣本標準差來估計母體參數，忽略分布形態  答案 題    目
  correct_index: 1
  explanation: 此題涉及 強化學習 的核心概念。正確答案為「增加樣本數並考慮使用分位數或中位數作為中心趨勢估計」。
- file: subjects/ai-foundation/chapter6.yaml
  id: '11436_2'
  text: 某電商資料團隊要協助行銷部門規劃再行銷策略。目前取得資料包含 使用者點擊、購買紀錄、流量來源與轉換率。若資料團隊希望先進行探 索性資料分析（EDA）
