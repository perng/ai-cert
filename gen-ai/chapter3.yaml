      - "錯誤的知識"
      - "加密的知識"
    correct_index: 1
    explanation: "暗知識隱藏在 Soft Label 中，揭示了類別間的細微關係，對 Student 的學習很有幫助。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

