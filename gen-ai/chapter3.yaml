questions:
  - id: 3001
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "在 RAG 與 Fine-tuning 的比較中，若企業需要 AI 具備「即時更新的知識」，應選擇？"
    type: multiple_choice
    options:
      - "Fine-tuning (微調)"
      - "RAG (檢索增強生成)"
      - "兩者皆可"
      - "兩者皆不可"
    correct_index: 1
    explanation: "RAG 透過檢索外部資料庫，只要資料庫更新，AI 就能立即獲取新知識，無需重新訓練。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3002
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "RAG 被比喻為哪種考試方式？"
    type: multiple_choice
    options:
      - "默寫"
      - "開書考 (Open Book Exam)"
      - "口試"
      - "體育測驗"
    correct_index: 1
    explanation: "RAG 允許模型在回答問題時翻閱參考資料（向量資料庫），就像開書考一樣。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3003
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "Fine-tuning 被比喻為哪種學習方式？"
    type: multiple_choice
    options:
      - "開書考"
      - "考前衝刺班 (內化知識)"
      - "小組討論"
      - "校外教學"
    correct_index: 1
    explanation: "Fine-tuning 透過大量訓練將知識內化到模型的權重中，就像考前死背硬記。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3004
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "若要降低 AI 的「幻覺 (Hallucination)」風險，RAG 與 Fine-tuning 何者較佳？"
    type: multiple_choice
    options:
      - "Fine-tuning"
      - "RAG"
      - "兩者一樣差"
      - "無法比較"
    correct_index: 1
    explanation: "RAG 要求模型根據檢索到的事實回答，並可附上引用來源，顯著降低胡說八道的機率。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3005
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "在資料隱私控管方面，RAG 的優勢在於？"
    type: multiple_choice
    options:
      - "資料完全公開"
      - "可透過權限控管 (ACL) 決定誰能檢索到什麼文件"
      - "資料被加密在模型權重中"
      - "不需要資料庫"
    correct_index: 1
    explanation: "RAG 的檢索階段可以整合現有的企業權限系統，確保使用者只能看到自己有權限的資料。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3006
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "Fine-tuning 最適合的應用場景是？"
    type: multiple_choice
    options:
      - "查詢即時股價"
      - "學習特定的語氣、風格或專有名詞理解"
      - "查詢公司內部規章"
      - "避免幻覺"
    correct_index: 1
    explanation: "Fine-tuning 能有效調整模型的行為模式，使其模仿特定的說話風格或理解特定領域的術語。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3007
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "知識蒸餾 (Knowledge Distillation) 的核心概念是？"
    type: multiple_choice
    options:
      - "讓小模型 (Student) 模仿大模型 (Teacher) 的行為"
      - "讓大模型模仿小模型"
      - "刪除模型參數"
      - "增加模型層數"
    correct_index: 0
    explanation: "知識蒸餾旨在將大模型的智慧轉移到輕量化的小模型上，以利在邊緣裝置運行。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3008
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "在知識蒸餾中，Student 模型除了學習正確答案 (Hard Label)，還要學習什麼？"
    type: multiple_choice
    options:
      - "錯誤答案"
      - "Teacher 的機率分佈 (Soft Label / Dark Knowledge)"
      - "訓練資料的雜訊"
      - "使用者的個資"
    correct_index: 1
    explanation: "Teacher 輸出的機率分佈包含了類別間的相似性資訊（如狗有點像貓），這對 Student 的學習至關重要。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3009
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP (Model Context Protocol) 的主要目的是？"
    type: multiple_choice
    options:
      - "加密 AI 模型"
      - "標準化 AI 模型與外部數據/工具之間的連接方式"
      - "取代 HTTP 協定"
      - "加速 GPU 運算"
    correct_index: 1
    explanation: "MCP 旨在解決 AI 連接外部工具時的碎片化問題，提供統一的介面標準。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3010
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP 架構中，負責提供數據或功能的是？"
    type: multiple_choice
    options:
      - "MCP Client"
      - "MCP Server"
      - "MCP Host"
      - "MCP User"
    correct_index: 1
    explanation: "MCP Server 扮演服務提供者的角色，如 Google Drive Server 提供檔案存取功能。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3011
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP 與 RAG 的主要差異在於？"
    type: multiple_choice
    options:
      - "RAG 比較快"
      - "MCP 只關注靜態知識"
      - "MCP 更關注動態工具的使用與雙向互動 (讀寫/執行)"
      - "兩者完全相同"
    correct_index: 2
    explanation: "RAG 側重於資訊檢索，而 MCP 則賦予 AI 執行操作（如發送訊息、寫入資料庫）的能力。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3012
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "企業導入 AI 的最佳實務通常建議？"
    type: multiple_choice
    options:
      - "直接 Fine-tuning"
      - "先 RAG，後 Fine-tuning"
      - "只用 Prompt Engineering"
      - "自己從頭訓練大模型"
    correct_index: 1
    explanation: "先用 RAG 解決知識問題成本較低且見效快，若效果不足再考慮成本較高的 Fine-tuning。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3013
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "Fine-tuning 的主要缺點是？"
    type: multiple_choice
    options:
      - "模型會變笨"
      - "知識更新慢且成本高 (需重新訓練)"
      - "無法理解中文"
      - "只能在手機上跑"
    correct_index: 1
    explanation: "每次知識更新都需要重新準備資料並進行訓練，維護成本高且缺乏時效性。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3014
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "RAG 的運作依賴於哪種資料庫技術？"
    type: multiple_choice
    options:
      - "關聯式資料庫 (SQL)"
      - "向量資料庫 (Vector Database)"
      - "圖資料庫"
      - "區塊鏈"
    correct_index: 1
    explanation: "向量資料庫用於儲存與檢索文本的語意向量，是 RAG 的核心組件。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3015
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP Client (如 Claude Desktop) 的角色是？"
    type: multiple_choice
    options:
      - "儲存資料"
      - "發起請求的主體 (AI Host)"
      - "執行 SQL 查詢"
      - "提供 API"
    correct_index: 1
    explanation: "MCP Client 是 AI 運行的前端，負責理解使用者需求並向 Server 發送請求。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3016
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "知識蒸餾可以降低模型的？"
    type: multiple_choice
    options:
      - "準確率"
      - "推論成本與延遲"
      - "創造力"
      - "安全性"
    correct_index: 1
    explanation: "小模型運算量小，能顯著降低硬體需求與回應時間。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3017
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "Fine-tuning 在資料隱私方面的風險是？"
    type: multiple_choice
    options:
      - "資料容易被駭客竊取"
      - "一旦知識寫入權重，很難限制特定人存取 (難以實作 ACL)"
      - "資料會自動刪除"
      - "模型會拒絕回答"
    correct_index: 1
    explanation: "模型權重是黑箱，無法像資料庫那樣針對不同使用者設定精細的存取權限。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3018
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP 被比喻為電腦界的什麼標準？"
    type: multiple_choice
    options:
      - "HDMI"
      - "USB"
      - "Bluetooth"
      - "Wi-Fi"
    correct_index: 1
    explanation: "就像 USB 讓各種周邊設備能隨插即用於電腦，MCP 讓各種資料源能標準化地連接 AI。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3019
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "若要讓 AI 學習輸出特定的 JSON 格式，最有效的方法是？"
    type: multiple_choice
    options:
      - "RAG"
      - "Fine-tuning"
      - "知識蒸餾"
      - "增加溫度"
    correct_index: 1
    explanation: "Fine-tuning 非常適合讓模型學習固定的輸出格式或語法結構。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3020
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP 是否可以包含 RAG 的功能？"
    type: multiple_choice
    options:
      - "不行，兩者互斥"
      - "可以，MCP 可以連接向量資料庫來實現 RAG"
      - "不一定"
      - "RAG 包含 MCP"
    correct_index: 1
    explanation: "MCP 是一個連接協議，可以將向量資料庫視為一個 Server 來連接，從而實現 RAG 功能。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3021
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "RAG 的「Grounded」特性是指？"
    type: multiple_choice
    options:
      - "模型接地氣"
      - "回答有憑有據，基於檢索到的事實"
      - "模型在本地運行"
      - "模型被禁足"
    correct_index: 1
    explanation: "Groundedness 指的是生成的內容有明確的來源依據，而非模型憑空捏造。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3022
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "知識蒸餾中的 Teacher 模型通常是？"
    type: multiple_choice
    options:
      - "參數少的小模型"
      - "參數多、效能強的大模型"
      - "隨機初始化的模型"
      - "線性迴歸模型"
    correct_index: 1
    explanation: "Teacher 必須是能力強的專家，才能指導 Student。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3023
    chapter_title: "進階 RAG 與系統架構"
    section_title: "Model Context Protocol (MCP)"
    text: "MCP 解決了 AI 開發中的什麼痛點？"
    type: multiple_choice
    options:
      - "模型訓練太慢"
      - "連接器 (Connector) 的碎片化問題"
      - "資料不足"
      - "硬體太貴"
    correct_index: 1
    explanation: "開發者不再需要為每個模型-資料源組合重複開發連接器，只需遵循 MCP 標準即可。"
    tags: ["sec-gen-chapter3", "sec-advanced-rag"]

  - id: 3024
    chapter_title: "進階 RAG 與系統架構"
    section_title: "模型微調與優化"
    text: "下列何者不是 RAG 的優點？"
    type: multiple_choice
    options:
