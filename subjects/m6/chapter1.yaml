- id: m6-ch1-code-006
  chapter_title: Basic Python Language
  section_title: 程式閱讀理解
  text: 閱讀 generator 程式，第一次迭代印出的 list 是什麼？
  content:
  - type: text
    text: 閱讀 generator 程式，第一次迭代印出的 list 是什麼？
  - type: code
    language: python
    code: "def batch_ids(total, batch_size):\n    for start in range(0, total, batch_size):\n        yield range(start, min(start + batch_size, total))\n\nfor batch in batch_ids(10, 4):\n    print(list(batch))\n    break"
  type: multiple_choice
  options:
  - - 4
    - 5
    - 6
    - 7
  - - 1
    - 2
    - 3
    - 4
  - - 0
    - 1
    - 2
    - 3
  - - 0
    - 4
    - 8
  correct_index: 2
  explanation: 第一次 start 是 0，range(0, 4) 轉成 list 後是 [0, 1, 2, 3]。
  tags:
  - chap-m6-ch1
  - sec-code-reading
  - code-reading
  usage: quiz
