  chapter_title: Natural Language Processing：NLTK 與文字特徵
  section_title: NLP 錯誤案例分析
  text: 關於「NLP 錯誤案例分析」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 只看整體 accuracy 就能知道模型是否理解否定句與諷刺。
  - 少數類別 recall 很低時，不需要檢查樣本數與標註品質。
  - 文字模型錯誤常出現在否定句、專有名詞與少數類別。
  - 模型把資料來源模板當捷徑時，代表泛化能力一定更好。
  correct_index: 2
  explanation: 文字錯誤分析要閱讀實際錯分案例，找出否定句、少數類別、模板捷徑或標註不一致。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項忽略了評估資料、錯誤案例或資料品質檢查，容易導致過度樂觀的結論。
