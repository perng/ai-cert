  section_title: 中文 NLP 的額外挑戰
  text: 關於「中文 NLP 的額外挑戰」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 中文句子天然以空白分隔詞，因此不需要斷詞工具。
