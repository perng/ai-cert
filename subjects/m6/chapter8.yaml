- id: 8067
  chapter_title: PyTorch Transformer 基礎
  section_title: Mask 與序列長度
  text: 自回歸語言模型使用 causal mask 的主要原因是什麼？
  type: multiple_choice
  options:
  - 防止 DataLoader 建立 batch
  - 防止 Pandas 進行 groupby
  - 防止模型在訓練時偷看未來 token
