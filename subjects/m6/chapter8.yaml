  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer Encoder 分類器
  text: 在簡化 Transformer 分類器中，pooling 的主要用途是什麼？
  type: multiple_choice
  options:
  - 將 YAML 轉成 HTML
  - 將 GPU 改成 CPU
