questions:
- id: 8061
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 中 self-attention 的核心作用是什麼？
  type: multiple_choice
  options:
  - 讓每個 token 能根據序列中其他 token 的資訊更新表示
  - 將 DataFrame 依欄位分組
  - 自動建立 Python 虛擬環境
  - 將所有影像轉成灰階
  correct_index: 0
  explanation: Self-attention 讓序列中不同位置能互相參考，捕捉上下文關係。
  tags:
  - chap-m6-ch8
  - sec-transformer-core-idea
  usage: both
- id: 8062
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 為何需要位置資訊？
  type: multiple_choice
  options:
  - 因為 embedding 只能處理影像
  - 因為 CrossEntropyLoss 只能讀取日期
  - Self-attention 本身不內建 token 順序概念
  - 因為 optimizer 需要知道檔案路徑
  correct_index: 2
  explanation: 如果沒有位置資訊，模型難以區分相同 token 在不同位置的序列意義。
  tags:
  - chap-m6-ch8
  - sec-transformer-core-idea
  usage: both
- id: 8063
  chapter_title: PyTorch Transformer 基礎
  section_title: Embedding 與位置資訊
  text: nn.Embedding 的主要功能是什麼？
  type: multiple_choice
  options:
  - 執行 Pandas merge
  - 將 token id 映射成可訓練向量表示
  - 將 RGB 影像轉成 BGR
  - 清空梯度
  correct_index: 1
  explanation: Embedding layer 會把離散 token id 轉成連續向量，供神經網路處理。
  tags:
  - chap-m6-ch8
  - sec-transformer-embedding-position
  usage: both
- id: 8064
  chapter_title: PyTorch Transformer 基礎
  section_title: MultiheadAttention 基礎
  text: 在 self-attention 中，query、key、value 通常來自哪裡？
  type: multiple_choice
  options:
  - Python 的虛擬環境名稱
  - OpenCV 的 BGR channel
  - 同一個輸入序列
  - 三個完全不相關的資料庫
  correct_index: 2
