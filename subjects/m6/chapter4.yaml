  section_title: 傳統電腦視覺與深度學習的分工
  text: 關於「傳統電腦視覺與深度學習的分工」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 傳統特徵在所有情境都已失效，不需考慮。
  - 深度學習不需要資料量，也不需要標註品質。
  - 規則式 OpenCV 方法無法用於任何工業檢測流程。
  - 固定場景下，閾值、邊緣與輪廓方法可能更便宜且可解釋。
  correct_index: 3
  explanation: 傳統 CV 與深度學習各有適用條件，規則明確或資料少時不一定要直接使用大型模型。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項把工具用途、資料條件或實務限制混在一起，因此不符合本節概念。
