- id: m6-hc-076
  chapter_title: Computer Vision：OpenCV、Matplotlib 與 torchvision
  section_title: Computer Vision 錯誤案例分析
  text: 關於「Computer Vision 錯誤案例分析」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 只看整體 accuracy 就能知道模型錯在哪些影像條件。
  - 低光、遮擋與類別相似問題通常不需要分開分析。
  - 錯誤案例不應回饋到資料收集或標註流程。
  - 影像錯誤分析應檢查低光、遮擋、模糊與相似類別。
  correct_index: 3
  explanation: CV 錯誤分析要回到影像內容與資料來源，找出標籤、光線、遮擋、類別相似或 domain shift 問題。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項忽略了評估資料、錯誤案例或資料品質檢查，容易導致過度樂觀的結論。
  tags:
  - chap-m6-ch4
  - sec-cv-error-analysis
  usage: both
