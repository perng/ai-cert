questions:
- id: 8021
  chapter_title: SciPy 與 scikit-learn
  section_title: SciPy 的角色
  text: SciPy 主要建立在哪個 Python 數值運算套件之上？
  type: multiple_choice
  options:
  - NumPy
  - Flask
  - NLTK
  - OpenCV
  correct_index: 0
  explanation: SciPy 建立在 NumPy 之上，提供統計、最佳化、稀疏矩陣與訊號處理等高階科學運算功能。
  tags:
  - chap-m6-ch3
  - sec-scipy-role
  usage: both
- id: 8022
  chapter_title: SciPy 與 scikit-learn
  section_title: SciPy 的角色
  text: 若需要使用統計分布、假設檢定與相關係數，SciPy 中最相關的模組是哪一個？
  type: multiple_choice
  options:
  - scipy.stats
  - scipy.camera
  - scipy.router
  - scipy.tokenizer
  correct_index: 0
  explanation: scipy.stats 提供統計分布、檢定與相關統計工具。
  tags:
  - chap-m6-ch3
  - sec-scipy-role
  usage: both
- id: 8023
  chapter_title: SciPy 與 scikit-learn
  section_title: 最佳化與曲線擬合
  text: 機器學習訓練常被視為最佳化問題，主要是在尋找什麼？
  type: multiple_choice
  options:
  - 讓損失函數盡可能小的模型參數
  - 讓檔案名稱最短的資料集
  - 讓程式碼行數最多的實作方式
  - 讓所有特徵都變成字串的轉換方式
  correct_index: 0
  explanation: 模型訓練通常是調整參數以最小化 loss，使預測更接近目標。
  tags:
  - chap-m6-ch3
  - sec-scipy-optimize
  usage: both
- id: 8024
  chapter_title: SciPy 與 scikit-learn
  section_title: scikit-learn 的標準流程
  text: scikit-learn estimator 的常見使用流程為何？
  type: multiple_choice
  options:
  - 建立模型、fit 訓練、predict 或 transform 使用
  - 先刪除資料、再隨機輸出答案
  - 只呼叫 print 即可完成模型訓練
  - 先部署到雲端才允許訓練
  correct_index: 0
  explanation: scikit-learn API 通常遵循 fit、predict、transform 等一致介面。
  tags:
  - chap-m6-ch3
  - sec-sklearn-workflow
  usage: both
- id: 8025
  chapter_title: SciPy 與 scikit-learn
  section_title: 前處理與 Pipeline
  text: scikit-learn Pipeline 的重要優點是什麼？
  type: multiple_choice
  options:
  - 將前處理與模型訓練串成一致流程，降低資料洩漏風險
  - 讓模型完全不需要資料
  - 將所有模型轉成影像檔
  - 強制模型只能做分群
  correct_index: 0
  explanation: Pipeline 可把 scaler、encoder、classifier 等步驟一起 fit，避免測試資料資訊滲入訓練流程。
  tags:
  - chap-m6-ch3
  - sec-sklearn-preprocessing-pipeline
  usage: both
- id: 8026
  chapter_title: SciPy 與 scikit-learn
  section_title: 分類、迴歸與分群
  text: 下列哪一類任務的目標是預測連續數值？
  type: multiple_choice
  options:
  - 分類
  - 迴歸
  - 分群
  - Tokenization
  correct_index: 1
  explanation: 迴歸任務預測連續數值，例如價格、溫度或需求量。
  tags:
  - chap-m6-ch3
  - sec-sklearn-model-types
  usage: both
- id: 8027
  chapter_title: SciPy 與 scikit-learn
  section_title: 評估、交叉驗證與超參數搜尋
  text: 使用交叉驗證的主要目的為何？
  type: multiple_choice
  options:
  - 讓模型不用評估
  - 降低單一次資料切分造成的評估偶然性
  - 將所有資料永久刪除
  - 把影像轉成灰階
  correct_index: 1
  explanation: 交叉驗證會使用多個切分進行訓練與驗證，使評估結果較穩定。
  tags:
  - chap-m6-ch3
  - sec-sklearn-evaluation
  usage: both
- id: 8028
  chapter_title: SciPy 與 scikit-learn
  section_title: 評估、交叉驗證與超參數搜尋
  text: 在分類不平衡問題中，只看 accuracy 可能有什麼風險？
  type: multiple_choice
  options:
  - 可能掩蓋少數類別預測很差的事實
  - 一定會讓模型無法執行
  - 會自動造成 GPU 記憶體不足
  - 會讓訓練資料變成非結構化資料
  correct_index: 0
  explanation: 多數類別比例很高時，模型只預測多數類別也可能有高 accuracy，因此還需觀察 precision、recall、F1 等指標。
  tags:
  - chap-m6-ch3
  - sec-sklearn-evaluation
  usage: both
