questions:
- id: 8011
  chapter_title: NumPy 與 Pandas
  section_title: NumPy 陣列與向量化
  text: NumPy 陣列相較於 Python list，在數值運算上通常較有效率的主要原因是什麼？
  type: multiple_choice
  options:
  - NumPy 陣列通常儲存同質資料並使用底層最佳化運算
  - NumPy 陣列只能儲存字串
  - NumPy 陣列完全不需要記憶體
  - NumPy 會自動替所有模型調整超參數
  correct_index: 0
  explanation: NumPy ndarray 通常以同質型別與連續記憶體表示資料，並透過底層最佳化提升數值運算效率。
  tags:
  - chap-m6-ch2
  - sec-numpy-array-vectorization
  usage: both
- id: 8012
  chapter_title: NumPy 與 Pandas
  section_title: NumPy 陣列與向量化
  text: 向量化 (Vectorization) 的核心精神是什麼？
  type: multiple_choice
  options:
  - 儘量使用 Python 層逐筆 for 迴圈完成數值計算
  - 把所有資料都轉成文字
  - 只使用 GPU 而不使用 CPU
  - 用陣列層級的批次運算取代逐筆迴圈
  correct_index: 3
  explanation: 向量化透過陣列運算一次處理多筆資料，通常比 Python 逐筆迴圈更快。
  tags:
  - chap-m6-ch2
  - sec-numpy-array-vectorization
  usage: both
- id: 8013
  chapter_title: NumPy 與 Pandas
  section_title: Shape、Broadcasting 與矩陣運算
  text: 在 NumPy 與深度學習中，理解 shape 最主要是為了避免什麼問題？
  type: multiple_choice
  options:
  - 避免 Python 程式使用函式
  - 避免資料集需要標籤
  - 避免模型產生任何 loss
  - 避免矩陣或張量維度不相容造成運算錯誤
  correct_index: 3
  explanation: 大量資料與模型運算都依賴維度對齊，shape 不相容會造成矩陣乘法或 broadcasting 錯誤。
  tags:
  - chap-m6-ch2
  - sec-numpy-shape-broadcast
  usage: both
