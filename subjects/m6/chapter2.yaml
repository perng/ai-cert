  chapter_title: NumPy 與 Pandas
  section_title: 缺失值、類別資料與特徵整理
  text: 處理缺失值時，下列哪一項做法較合理？
  type: multiple_choice
  options:
  - 將所有缺失值固定改成文字 "GPU"
  - 把整個資料集隨機打亂後忽略欄位名稱
  - 根據欄位語意使用填補、刪除或建立 Unknown 類別等策略
  - 不檢查缺失值，直接假設模型會自動理解
  correct_index: 2
  explanation: 缺失值處理應依據資料語意與模型需求選擇策略，不能盲目套用同一規則。
