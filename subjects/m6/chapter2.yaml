  explanation: 特徵工程要把原始欄位轉成可學習訊號，同時避免把答案或未來資訊混入 X。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項把工具用途、資料條件或實務限制混在一起，因此不符合本節概念。
