  text: 關於「NumPy 陣列與向量化」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 向量化代表把所有運算改成 Python for loop 逐筆處理。
  - NumPy 向量化可減少 Python 層逐筆迴圈，提升數值計算效率。
  - NumPy array 可以混合任意型別且不影響數值計算效率。
