- id: m6-hc-130
  chapter_title: PyTorch 實作簡單神經網路與 CNN
  section_title: CNN 中尺寸如何變化
  text: 下列何者是「CNN 中尺寸如何變化」最重要的操作原則？
  type: multiple_choice
  options:
  - MaxPool2d(2) 通常會讓高寬加倍。
  - padding、stride 與 kernel size 不會影響輸出尺寸。
  - Flatten 前不需要知道 feature map shape，Linear 會自動調整輸入維度。
  - padding=1 且 kernel_size=3 的卷積可保持空間尺寸。
  correct_index: 3
  explanation: CNN 的輸出尺寸由 kernel、stride、padding 與 pooling 決定，接 Linear 前必須確認 flatten 維度。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項忽略 shape、dtype、mask 或輸出目標的限制，實作時會造成錯誤或語意不符。
