questions:
- id: 8061
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 中 self-attention 的核心作用是什麼？
  type: multiple_choice
  options:
  - 讓每個 token 能根據序列中其他 token 的資訊更新表示
  - 將所有影像轉成灰階
  - 將 DataFrame 依欄位分組
  - 自動建立 Python 虛擬環境
  correct_index: 0
  explanation: Self-attention 讓序列中不同位置能互相參考，捕捉上下文關係。
  tags:
  - chap-m6-ch7
  - sec-transformer-core-idea
  usage: both
- id: 8062
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer 的核心想法
  text: Transformer 為何需要位置資訊？
  type: multiple_choice
  options:
  - Self-attention 本身不內建 token 順序概念
  - 因為 embedding 只能處理影像
  - 因為 optimizer 需要知道檔案路徑
  - 因為 CrossEntropyLoss 只能讀取日期
  correct_index: 0
  explanation: 如果沒有位置資訊，模型難以區分相同 token 在不同位置的序列意義。
  tags:
  - chap-m6-ch7
  - sec-transformer-core-idea
  usage: both
- id: 8063
  chapter_title: PyTorch Transformer 基礎
  section_title: Embedding 與位置資訊
  text: nn.Embedding 的主要功能是什麼？
  type: multiple_choice
  options:
  - 將 token id 映射成可訓練向量表示
  - 將 RGB 影像轉成 BGR
  - 執行 Pandas merge
  - 清空梯度
  correct_index: 0
  explanation: Embedding layer 會把離散 token id 轉成連續向量，供神經網路處理。
  tags:
  - chap-m6-ch7
  - sec-transformer-embedding-position
  usage: both
- id: 8064
  chapter_title: PyTorch Transformer 基礎
  section_title: MultiheadAttention 基礎
  text: 在 self-attention 中，query、key、value 通常來自哪裡？
  type: multiple_choice
  options:
  - 同一個輸入序列
  - 三個完全不相關的資料庫
  - OpenCV 的 BGR channel
  - Python 的虛擬環境名稱
  correct_index: 0
  explanation: Self-attention 的 Q、K、V 都由同一序列轉換而來，使序列內部位置互相注意。
  tags:
  - chap-m6-ch7
  - sec-transformer-attention
  usage: both
- id: 8065
  chapter_title: PyTorch Transformer 基礎
  section_title: Transformer Encoder 分類器
  text: 在簡化 Transformer 分類器中，pooling 的主要用途是什麼？
  type: multiple_choice
  options:
  - 將序列中多個 token 表示整合成單一向量供分類
  - 將 GPU 改成 CPU
  - 將 YAML 轉成 HTML
  - 將圖片進行邊緣偵測
  correct_index: 0
  explanation: 分類器通常需要整體序列表示，因此會使用 mean pooling、CLS token 或其他聚合方式。
  tags:
  - chap-m6-ch7
  - sec-transformer-classifier
  usage: both
- id: 8066
  chapter_title: PyTorch Transformer 基礎
  section_title: Mask 與序列長度
  text: padding mask 的主要作用是什麼？
  type: multiple_choice
  options:
  - 告訴模型哪些位置是補齊 token，不應當成真實內容
  - 將所有 token 隨機刪除
  - 將影像大小固定為 224x224
  - 將 optimizer learning rate 設為 0
  correct_index: 0
  explanation: padding mask 能避免模型把補齊用的 token 當作有效文字內容。
  tags:
  - chap-m6-ch7
  - sec-transformer-mask
  usage: both
- id: 8067
  chapter_title: PyTorch Transformer 基礎
  section_title: Mask 與序列長度
  text: 自回歸語言模型使用 causal mask 的主要原因是什麼？
  type: multiple_choice
  options:
  - 防止模型在訓練時偷看未來 token
  - 防止 OpenCV 讀取圖片
  - 防止 Pandas 進行 groupby
  - 防止 DataLoader 建立 batch
  correct_index: 0
  explanation: 自回歸生成需根據過去預測下一個 token，因此 causal mask 會遮住未來位置。
  tags:
  - chap-m6-ch7
  - sec-transformer-mask
  usage: both
- id: 8068
  chapter_title: PyTorch Transformer 基礎
  section_title: 從簡化模型到大型語言模型
  text: 從簡化 Transformer 到大型語言模型，哪些基礎元件仍然重要？
  type: multiple_choice
  options:
  - Embedding、attention、feed-forward、normalization 與 optimizer
  - 只有 OpenCV 的 Canny edge detector
  - 只有 Pandas 的 merge
  - 只有 Python 的 print 函式
  correct_index: 0
  explanation: LLM 雖然規模巨大，但仍建立在 Transformer 的核心元件與訓練流程上。
  tags:
  - chap-m6-ch7
  - sec-transformer-to-llm
  usage: both
