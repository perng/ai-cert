- id: m6-hc-112
  chapter_title: PyTorch 基礎
  section_title: Reproducibility 與實驗紀錄
  text: 關於「Reproducibility 與實驗紀錄」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - 只設定一次 random seed 就能保證所有硬體完全相同。
  - 實驗紀錄不需要保存資料版本與超參數。
  - 可重現性只適用於傳統統計，不適用於深度學習。
  - 固定 random seed 有助於實驗重現。
  correct_index: 3
  explanation: 可重現性依賴 seed、資料版本、程式版本與實驗設定紀錄，但硬體與底層演算法仍可能造成差異。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項把工具用途、資料條件或實務限制混在一起，因此不符合本節概念。
