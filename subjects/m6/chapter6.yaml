  explanation: shape 決定矩陣乘法、broadcasting 與模型輸入是否相容，維度不符通常會導致錯誤或語意錯置。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項忽略 shape、dtype、mask 或輸出目標的限制，實作時會造成錯誤或語意不符。
