  section_title: Keras：高階深度學習 API 的定位
  text: 關於「Keras：高階深度學習 API 的定位」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - Keras 必須手寫完整 backward 與 optimizer step。
  - model.fit 只能用於 scikit-learn 模型，不能訓練神經網路。
  - Keras 完全不能建立 CNN、RNN 或多層感知器。
  - Keras 強調用較少程式碼快速建立標準深度學習模型。
  correct_index: 3
  explanation: Keras 提供高階 API 快速建立、compile 與 fit 標準深度學習模型，適合原型與常見架構。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項把深度學習訓練步驟或框架責任混淆，無法正確描述模型如何學習。
