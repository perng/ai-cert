  section_title: PyTorch 常見錯誤排查
  text: 關於「PyTorch 常見錯誤排查」，下列哪一項敘述最正確？
  type: multiple_choice
  options:
  - device mismatch 常發生在模型與 tensor 不在同一裝置。
  - device mismatch 可透過刪除 loss function 解決。
  - loss 不下降時不需要檢查 label、shape 或 learning rate。
  - RuntimeError 的 shape 訊息通常與模型輸入輸出無關。
  correct_index: 0
  explanation: 除錯時先檢查 traceback、shape、dtype、欄位名稱與執行順序，通常比盲目修改模型更有效。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項忽略了評估資料、錯誤案例或資料品質檢查，容易導致過度樂觀的結論。
