  - batch 資料不需要搬到與模型相同的 device。
  - 訓練用 model.train()，驗證與推論用 model.eval()。
  correct_index: 3
  explanation: 完整 PyTorch 訓練需要同時管理模式、device、batch、loss、梯度與評估流程。 正確選項符合這個原則，因為它指出了本節概念在資料或模型流程中的正確作用；其他選項把深度學習訓練步驟或框架責任混淆，無法正確描述模型如何學習。
