  - sec-advanced-rag
  usage: both
- id: 3032
  chapter_title: 進階 RAG 與系統架構
  section_title: 模型微調與優化
  text: 知識蒸餾的 Student 模型通常比 Teacher 模型？
  type: multiple_choice
