  - chap-gen-chapter3
  - sec-advanced-rag
  usage: both
- id: 3020
  chapter_title: 進階 RAG 與系統架構
  section_title: Model Context Protocol (MCP)
  text: MCP 是否可以包含 RAG 的功能？
  type: multiple_choice
  options:
  - 不行，兩者互斥 (Mutually Exclusive)
  - 可以，MCP 可以連接向量資料庫來實現 RAG (MCP Connects Vector DB)
  - RAG 包含 MCP (RAG Includes MCP)
  - 不一定 (Not Sure)
  correct_index: 1
  explanation: MCP 是一個連接協議，可以將向量資料庫視為一個 Server 來連接，從而實現 RAG 功能。
