  chapter_title: 進階 RAG 與系統架構
  section_title: 模型微調與優化
  text: Dark Knowledge (暗知識) 在知識蒸餾中指的是？
  type: multiple_choice
  options:
  - 加密的知識
  - 錯誤的知識
  - Teacher 模型輸出的非最高機率類別資訊
  - 黑市交易的知識
  correct_index: 2
  explanation: 暗知識隱藏在 Soft Label 中，揭示了類別間的細微關係，對 Student 的學習很有幫助。
