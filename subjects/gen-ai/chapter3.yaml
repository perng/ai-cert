  - chap-gen-chapter3
  - sec-advanced-rag
  usage: both
- id: 3025
  chapter_title: 進階 RAG 與系統架構
  section_title: 模型微調與優化
  text: Dark Knowledge (暗知識) 在知識蒸餾中指的是？
  type: multiple_choice
  options:
  - 加密的知識 (Encrypted Knowledge)
  - 錯誤的知識 (Wrong Knowledge)
  - Teacher 模型輸出的非最高機率類別資訊 (Non-top Probability Info)
  - 黑市交易的知識 (Black Market Knowledge)
  correct_index: 2
