questions:
- id: '4001_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent (代理人) 與傳統 Chatbot 最大的區別在於？
  type: multiple_choice
  options:
  - Agent 只能說英文 (Agent Only Speaks English) – limited multilingual support.
  - Agent 比較貴 (Agent Is More Expensive) – higher compute and infrastructure costs.
  - Agent 具備感知環境、決策並執行行動 (Action) 的能力，而不僅是說話 (Agent Has Perception, Decision-Making, and Action Capabilities Beyond Conversation) – core distinction from chatbots.
  - Chatbot 比較聰明 (Chatbot Is Smarter) – may excel in language fluency but lacks actionable abilities.
  correct_index: 2
  explanation: Chatbot 僅限於對話，而 Agent 擁有「手腳」，能透過工具與外部世界互動並執行任務。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4002_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的「大腦 (Brain)」通常由什麼擔任？
  type: multiple_choice
  options:
  - 網路卡 (Network Card) – hardware for connectivity, not cognition.
  - CPU (Central Processing Unit) – general-purpose processor, insufficient alone for reasoning.
  - 大型語言模型 (LLM) (Large Language Model) – provides the brain for understanding and planning.
  - 硬碟 (Hard Disk) – storage component, not computational brain.
  correct_index: 2
  explanation: LLM 負責理解指令、邏輯推理與規劃，是 Agent 的智慧核心。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4003_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的「規劃 (Planning)」模組負責什麼？
  type: multiple_choice
  options:
  - 任務拆解與自我反思 (Task Decomposition & Self-Reflection) – breaks goals into steps and evaluates progress.
  - 儲存資料 (Data Storage) – passive record keeping, not planning.
  - 顯示畫面 (Display UI) – presentation layer, not core planning.
  - 執行 API (Execute API Calls) – action execution, separate from planning logic.
  correct_index: 0
  explanation: 規劃模組將複雜目標拆解為可執行的步驟，並在執行過程中反思修正。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4004_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的「長期記憶」通常儲存在哪裡？
  type: multiple_choice
  options:
  - RAM (Random Access Memory) – volatile memory, unsuitable for long-term storage.
  - CPU 快取 (CPU Cache) – very short-term, limited capacity.
  - 紙本筆記 (Paper Notebook) – impractical for digital agents.
  - 向量資料庫 (Vector DB) (Vector Database) – scalable, searchable long-term memory for agents.
  correct_index: 3
  explanation: 向量資料庫能高效儲存與檢索大量非結構化資料，作為 Agent 的長期知識庫。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4005_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 使用工具 (Tool Use) 的例子包括？
  type: multiple_choice
  options:
  - 調用 API (如搜尋 Google、發送 Email) (API Calls such as Google Search or Email) – concrete tool use for tasks.
  - 睡覺 (Sleep) – irrelevant biological function.
  - 思考人生 (Contemplate Life) – abstract, not actionable.
  - 做夢 (Dream) – not a functional capability for agents.
  correct_index: 0
  explanation: 透過 API 調用，Agent 能夠執行實際操作，如獲取資訊或控制軟體。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4006_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: 解決方案圖譜 (Solution Graph) 將解決問題的過程建模為？
  type: multiple_choice
  options:
  - 一個點 (A Single Node) – overly simplistic representation.
  - 一個圓圈 (A Circle) – does not capture relationships.
  - 一條直線 (A Straight Line) – insufficient for complex decision paths.
  - 一個圖 (Graph) 包含節點與邊 (A Graph with Nodes and Edges) – captures complex problem-solving structures.
  correct_index: 3
  explanation: 圖結構能表達非線性的決策路徑與狀態轉換，比線性思考更靈活。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4007_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: 在 Solution Graph 中，廣度優先搜尋 (BFS) 適合？
  type: multiple_choice
  options:
  - 什麼都不做 (Do Nothing) – no exploration.
  - 深入挖掘單一路徑 (Deep Dive Single Path) – may miss broader solutions.
  - 尋找最短路徑或探索所有可能的下一步 (Find Shortest Path or Explore All Next Steps) – BFS appropriate for breadth-first search.
  - 隨機亂走 (Random Walk) – inefficient and non-deterministic.
  correct_index: 2
  explanation: BFS 層層推進，能確保找到步數最少的解，適合路徑搜尋。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4008_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: 在 Solution Graph 中，深度優先搜尋 (DFS) 適合？
  type: multiple_choice
  options:
  - 廣泛探索 (Broad Exploration) – akin to BFS, covers many branches.
  - 快速瀏覽 (Quick Scan) – shallow, may miss depth.
  - 需要深入挖掘的任務 (Task Requiring Deep Exploration) – aligns with DFS.
  - 尋找最短路徑 (Find Shortest Path) – more BFS-oriented.
  correct_index: 2
  explanation: DFS 優先探索深層節點，適合需要連續推理或鑽研到底的場景。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4009_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 多代理系統 (Multi-Agent Systems) 的主要優勢是？
  type: multiple_choice
  options:
  - 省電 (Energy Saving) – not a primary advantage.
  - 減少程式碼量 (Reduced Code Size) – minor benefit.
  - 透過角色分工協作，解決單一 Agent 無法處理的複雜任務 (Collaborative Role Division to Solve Complex Tasks) – core advantage.
  - 不需要 LLM (No Need for LLM) – inaccurate.
  correct_index: 2
  explanation: 透過專業分工（如 PM、工程師、測試員），多個 Agent 能協作完成大型專案。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4010_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 在多代理協作中，負責拆解需求並分派任務的角色通常是？
  type: multiple_choice
  options:
  - 工程師 Agent (Engineer Agent) – typically handles implementation.
  - 實習生 Agent (Intern Agent) – unlikely to lead task allocation.
  - 產品經理 (PM) Agent – responsible for task decomposition and assignment.
  - 測試 Agent (Tester Agent) – focuses on validation.
  correct_index: 2
  explanation: PM Agent 負責統籌規劃，將大目標轉化為可執行的子任務並指派給專責 Agent。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: quiz
- id: '4011_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 多代理系統常見的挑戰「無限循環 (Infinite Loops)」是指？
  type: multiple_choice
  options:
  - Agent 當機 (Agent Crash)，系統完全停止運作。
  - 'Agent 之間互相踢皮球，任務無法推進 (Infinite Loops: Agents Passing Tasks Back and Forth Without Progress)'
  - Agent 跑得太快 (Agent Running Too Fast)，導致資源耗盡。
  - Agent 拒絕工作 (Agent Refusing Work)，因權限不足而停止。
  correct_index: 1
  explanation: 當 Agent A 等待 Agent B，而 Agent B 又等待 Agent A 時，就會陷入死結或無窮迴圈。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4012_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 解決多代理系統「無限循環」的常見方法是？
  type: multiple_choice
  options:
  - 拔掉電源 (Unplugging Power)，強制重啟系統。
  - 刪除記憶 (Deleting Memory)，清除所有歷史紀錄。
  - 增加更多 Agent (Adding More Agents)，試圖透過更多人手解決問題。
  - 設定最大對話輪數 (Max Turns) 或引入監督者 Agent (Setting Max Turns or Introducing Supervisor Agent)
  correct_index: 3
  explanation: 強制限制互動次數或由上層監督者介入中斷，能有效防止系統空轉。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4013_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 若多個 Agent 對同一問題有不同答案（答案衝突），該如何解決？
  type: multiple_choice
  options:
  - 全部捨棄 (Discard All)，重新開始任務。
  - 讓它們吵架 (Let Them Argue)，直到一方勝出。
  - 引入「決策者 Agent」或投票機制 (Introducing Decision Maker Agent or Voting Mechanism)
  - 隨機選一個 (Random Selection)，任選一個答案作為最終結果。
  correct_index: 2
  explanation: 透過仲裁機制或多數決，可以從衝突的意見中整合出最終決策。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4014_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的「自我反思 (Self-Reflection)」功能是指？
  type: multiple_choice
  options:
  - 自我刪除 (Self-Deletion)，任務完成後自動移除程式碼。
  - '執行後檢查結果是否符合預期，並進行修正 (Self-Reflection: Checking Results Against Expectations and Correcting)'
  - 自我備份 (Self-Backup)，定期儲存當前狀態。
  - 自我複製 (Self-Replication)，產生新的 Agent 實例。
  correct_index: 1
  explanation: 反思能力讓 Agent 能從錯誤中學習並調整策略，而非盲目執行錯誤的計畫。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4015_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: 最佳優先搜尋 (Best-First Search) 的策略是？
  type: multiple_choice
  options:
  - 隨機選擇 (Random Selection)，不考慮任何路徑成本。
  - 先走最長的路 (Longest Path First)，優先探索最深的路徑。
  - '評估哪條路看起來最有希望 (Heuristic)，優先走那條 (Best-First Search: Prioritizing Most Promising Path via Heuristic)'
  - 先走最難的路 (Hardest Path First)，優先解決最困難的部分。
  correct_index: 2
  explanation: 利用啟發式函數評估節點價值，優先探索最可能通往目標的路徑，效率通常比盲目搜尋高。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4016_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 在 A2A 協作中，Client Agent 的角色是？
  type: multiple_choice
  options:
  - 執行任務 (Executing Tasks)，負責實際的工作執行。
  - 資料庫 (Database)，負責儲存數據。
  - '發起者，接收人類指令並轉發給執行者 (Initiator: Receiving Human Instructions and Forwarding to Executors)'
  - 測試軟體 (Testing Software)，負責驗證結果。
  correct_index: 2
  explanation: Client Agent 作為人類與 Agent 系統的介面，負責接收需求與回報結果。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4017_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 為了解決「角色定義不清」的問題，應該？
  type: multiple_choice
  options:
  - 隨機指派任務 (Randomly Assigning Tasks)，不考慮 Agent 能力。
  - 在 System Prompt 中極度明確地定義每個 Agent 的職責邊界 (Defining Clear Role Boundaries in System Prompt)
  - 不給任何指令 (Giving No Instructions)，讓 Agent 自由發揮。
  - 讓 Agent 自己猜 (Letting Agent Guess)，不提供明確指引。
  correct_index: 1
  explanation: 明確的職責定義能避免責任重疊或推卸，確保協作順暢。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4018_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的短期記憶通常是指？
  type: multiple_choice
  options:
  - 當下的對話上下文 (Context) (Current Dialogue Context)
  - 訓練資料 (Training Data)，用於模型預訓練的數據。
  - 硬碟檔案 (Hard Drive Files)，長期儲存的資料。
  - 網路搜尋結果 (Web Search Results)，外部檢索的資訊。
  correct_index: 0
  explanation: 短期記憶維持對當前對話狀態的認知，受限於 Context Window 大小。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4019_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Solution Graph 中的「邊 (Edge)」代表？
  type: multiple_choice
  options:
  - 採取的行動或轉換 (Action or Transition Taken)
  - 錯誤 (Error)，執行過程中的異常。
  - 終點 (Endpoint)，任務的結束狀態。
  - 狀態 (State)，系統當前的狀況。
  correct_index: 0
  explanation: 邊連接了不同的狀態節點，代表導致狀態改變的動作或決策。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4020_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: Remote Agent 在 A2A 架構中負責？
  type: multiple_choice
  options:
  - 發號施令 (Giving Orders)，負責指揮其他 Agent。
  - 付錢 (Paying)，負責支付費用。
  - 休息 (Resting)，不進行任何操作。
  - 執行被指派的任務 (Executing Assigned Tasks)
  correct_index: 3
  explanation: Remote Agent 是實際的執行者，負責完成 Client Agent 指派的具體工作。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4021_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 能夠「感知環境」意味著？
  type: multiple_choice
  options:
  - 它能預知未來 (Predicting Future)，預測尚未發生的事件。
  - 它有眼睛 (Having Eyes)，具備生物視覺器官。
  - 它有感覺 (Having Feelings)，具備情感感知能力。
  - '它能透過輸入（如文字、API 回傳值）獲取外部狀態資訊 (Perceiving Environment: Acquiring External State Info via Inputs like Text or API)'
  correct_index: 3
  explanation: 感知是指接收並理解外部資訊的能力，這是做出正確決策的前提。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4022_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: 下列何者屬於 Agent 的「工具」？
  type: multiple_choice
  options:
  - 搜尋引擎 API (Search Engine API)，用於檢索網路資訊。
  - 計算機 (Calculator)，用於執行數學運算。
  - Python 直譯器 (Python Interpreter)，用於執行程式碼。
  - 以上皆是 (All of the Above)，皆為擴展 Agent 能力的工具。
  correct_index: 3
  explanation: 任何能擴展 Agent 能力、與外部互動的介面或軟體都可視為工具。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4023_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 軟體開發團隊的 Agent 協作模式是模仿？
  type: multiple_choice
  options:
  - 人類公司的組織分工 (Human Organizational Division of Labor)，模仿企業架構。
  - 物理定律 (Laws of Physics)，模仿自然界的物理規則。
  - 隨機漫步 (Random Walk)，無目的的隨機移動。
  - 動物行為 (Animal Behavior)，模仿生物本能。
  correct_index: 0
  explanation: MAS 常借鑑人類社會的組織架構，透過專業分工提升效率。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4024_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Solution Graph 的功能是作為 Agent 的？
  type: multiple_choice
  options:
  - 燃料 (Fuel)，提供運作能量。
  - 導航地圖 (Navigation Map)，指引從起點到目標的路徑。
  - 外觀 (Appearance)，定義視覺形象。
  - 聲音 (Voice)，定義語音輸出。
  correct_index: 1
  explanation: 它提供了決策空間的結構化視圖，指引 Agent 如何從起點到達目標狀態。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4025_1'
  chapter_title: AI 代理人與自動化
  section_title: 多代理系統 (MAS)
  text: 監督者 Agent (Supervisor) 的主要職責是？
  type: multiple_choice
  options:
  - 掃地 (Sweeping)，負責清潔工作。
  - 發送 Email (Sending Emails)，負責通訊工作。
  - 監控流程、協調衝突並防止無限循環 (Monitoring Process, Coordinating Conflicts, and Preventing Infinite Loops)
  - 寫程式 (Writing Code)，負責開發工作。
  correct_index: 2
  explanation: 監督者負責維持系統秩序，確保各 Agent 依循規則協作，並在異常時介入。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4026_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: Agent 的「任務拆解」能力為何重要？
  type: multiple_choice
  options:
  - 因為複雜目標通常無法一步登天，需分解為可執行的小步驟 (Complex Goals Require Decomposition into Executable Steps)
  - 為了拖延時間 (To Delay Time)，故意放慢執行速度。
  - 因為 LLM 只能處理短句 (Because LLM Can Only Handle Short Sentences)，受限於模型能力。
  - 為了增加成本 (To Increase Cost)，故意增加資源消耗。
  correct_index: 0
  explanation: 將大目標（如旅遊規劃）拆解為小步驟（如訂票），能降低單一步驟的難度與出錯率。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4027_1'
  chapter_title: AI 代理人與自動化
  section_title: Agent 架構與組件
  text: BFS 與 DFS 都是在哪種結構上進行的搜尋策略？
  type: multiple_choice
  options:
  - 圖 (Graph) 或樹 (Tree) (Graph or Tree)，非線性資料結構。
  - 佇列 (Queue)，先進先出的線性結構。
  - 堆疊 (Stack)，後進先出的線性結構。
  - 列表 (List)，有序的線性結構。
  correct_index: 0
  explanation: 這兩者是圖論與演算法中遍歷圖形結構的經典方法。
  tags:
  - chap-gen-chapter4
  - sec-agentic-ai
  usage: both
- id: '4028_1'
