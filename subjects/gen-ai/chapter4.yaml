  chapter_title: AI Agent 與多代理系統
  section_title: 多代理系統 (MAS)
  text: 當多個 Agent 意見不合時（例如 Developer 寫的程式被 Tester 認為有 Bug，但 Developer 認為是 Feature），MAS 通常如何解決？
  type: multiple_choice
  options:
  - 隨機選擇一個 Agent 的意見作為最終結果 (Random Selection)，缺乏理性決策。
  - '透過多輪對話與反饋循環 (Feedback Loop)，讓 Agent 互相辯論並修正，直到達成共識或滿足終止條件 (Multi-turn Dialogue and Feedback Loop: Debate and Correction until Consensus)'
  - 直接刪除兩個 Agent，重新建立新的 (Deleting Agents)，無法解決問題。
  - 停止系統運作，等待人類工程師手動修改程式碼 (Halting System for Human Intervention)，降低自動化程度。
  correct_index: 1
  explanation: MAS 的強大之處在於 Agent 間的自主協商與修正，這模擬了人類團隊的 Code Review 流程。
  tags:
