  text: 某保險公司計畫導入生成式 AI 的內部合約查詢系統，協助業務員與法 務部門快速解讀保單條款與理賠規範。高層特別強調客戶資料隱私與 合規風險控管，即使需要投入較多資源，也必須確保資料不會外洩。在 第二科：生成式 AI 應用與規劃 此情況下，下列哪一種策略最符合公司的資料安全與合規優先考量？ (114年第四梯次)
  type: multiple_choice
  options:
  - 導入開源模型並由 IT 團隊自建，後續再逐步補強隱私與合規控管；
  - 在需求確認階段即納入法遵與稽核單位，設定準確率 KPI，並透過 MVP 驗證成效；
  - 優先使用雲端大型 API 模型快速部署，並根據使用數據持續調整；
