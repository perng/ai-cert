- id: 11438
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 風險管理框架
  text: 某銀行導入生成式 AI 放貸審核系統，用於分析申貸人條件並生成初步 審核意見。測試過程中發現，模型對不同族群的核准率存在顯著差異， 可能引發演算法偏見問題。為降低此風險，下列哪一項措施最合適？ (114年第四梯次)
  type: multiple_choice
  options:
  - 提升模型運算速度與效能，以確保在大量申請中快速回應；
  - 全面移除與申貸人身份相關的敏感屬性，避免模型因變數影響而產 生偏差；
  - 導入資料與結果的公平性檢測流程，並依合規規範調整模型或決策 邏輯；
  - 減少訓練樣本數量，降低偏見被放大的可能性
  correct_index: 0
  explanation: AI 偏見通常源自訓練數據中的社會刻板印象。緩解策略包括數據平衡、去偏演算法以及人類回饋強化學習 (RLHF)。 
