questions:
- id: '7001_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 生成式 AI 特有資安威脅
  text: 提示注入 (Prompt Injection) 的核心原理是？
  type: multiple_choice
  options:
  - 攻擊者將惡意指令偽裝成資料，混淆模型的指令與資料邊界
  - 駭客入侵伺服器
  - 模型參數錯誤
  - 網路斷線
  correct_index: 0
  explanation: Prompt Injection 利用 LLM 難以區分「系統指令」與「使用者輸入」的特性，誘導模型執行未經授權的操作。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7002_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 生成式 AI 特有資安威脅
  text: 間接注入 (Indirect Injection) 是指攻擊者將惡意指令藏在哪裡？
  type: multiple_choice
  options:
  - 模型的權重
  - 網頁、郵件或文件等外部資源中
  - 電源線
  - 使用者的鍵盤
  correct_index: 1
  explanation: 當具備瀏覽或讀取能力的 AI 處理這些受汙染的外部資源時，就會觸發隱藏的惡意指令。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7003_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 生成式 AI 特有資安威脅
  text: Zero-Retention (零留存) 政策的主要目的是？
  type: multiple_choice
  options:
  - 節省硬碟空間
  - 防止資料外洩，確保 API 供應商不保留或使用客戶資料進行訓練
  - 降低成本
  - 加快運算速度
  correct_index: 1
  explanation: 這是企業採用雲端 AI 服務時的重要資安保障，確保機密資料不會成為模型的一部分。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7004_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 隱私強化技術 (PETs)
  text: 同態加密 (Homomorphic Encryption) 的最大特點是？
  type: multiple_choice
  options:
  - 不需要金鑰
  - 允許在加密狀態下直接對數據進行運算
  - 運算速度極快
  - 只能加密圖片
  correct_index: 1
  explanation: 同態加密打破了「運算必須先解密」的限制，實現了資料可用但不可見的理想狀態。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7005_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 隱私強化技術 (PETs)
  text: 同態加密目前難以大規模商用的主要原因是？
  type: multiple_choice
  options:
  - 沒人知道怎麼用
  - 不安全
  - 運算速度極慢 (比明文慢數千倍)
  - 專利限制
  correct_index: 2
  explanation: 極高的計算成本使得同態加密目前僅適用於極高機密且資料量較小的場景。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7006_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 隱私強化技術 (PETs)
  text: 安全多方計算 (SMPC) 解決了什麼問題？
  type: multiple_choice
  options:
  - 多方共同計算結果，但無需公開各自的私密輸入
  - 資料儲存不足
  - 計算速度慢
  - 網路延遲
  correct_index: 0
  explanation: SMPC 讓互不信任的多方能合作進行數據分析，同時保護各自的數據隱私（如百萬富翁問題）。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7007_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 合規與治理
  text: 幻覺 (Hallucination) 的定義是？
  type: multiple_choice
  options:
  - 模型當機
  - 模型看到鬼
  - AI 生成看似合理但與事實不符的內容
  - 模型拒絕回答
  correct_index: 2
  explanation: 生成式 AI 的機率特性導致它有時會一本正經地胡說八道，這就是幻覺。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
- id: '7008_1'
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 合規與治理
  text: 解決幻覺問題最有效的方法之一是？
  type: multiple_choice
  options:
  - 減少訓練資料
  - 關閉模型
  - RAG (檢索增強生成) 與 Grounding
  - 增加溫度
  correct_index: 2
  explanation: 透過檢索外部可靠知識庫並要求模型基於事實回答，能顯著降低幻覺。
  tags:
  - chap-gen-chapter7
  - sec-security-ethics
  usage: quiz
