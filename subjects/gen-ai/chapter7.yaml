  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 合規與治理
  text: 某國際銀行導入生成式 AI，用於彙整不同國家金融監管機構的合規規 範，建立跨國合規知識庫。由於各國條文表述方式不同，且監管要求具 有高度專業性與隱含邏輯，若要確保知識庫在後續查詢與生成報告時 能維持正確性與一致性，下列哪一項 AI 能力最為關鍵？ (114年第四梯次)
  type: multiple_choice
  options:
  - 具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國 家規範間的對應與差異；
  - 能自動最佳化文件檢索效率，縮短跨國法規查詢的延遲時間，提升 合規部門使用體驗；
  - 能將合規文件轉換為多種輸出形式（如簡報、摘要或法規清單） ，以 符合不同決策層級需求；
  - 具備根據歷史案例生成合規解釋的能力，協助新進員工快速理解法 規在實務上的應用
