- id: 11436
  chapter_title: 生成式 AI 的資安、合規與倫理
  section_title: 生成式 AI 特有資安威脅
  text: 某航空公司導入生成式 AI 聲控客服，提供航班與票務查詢。有人員透 過惡意提示，試圖讓系統洩漏內部安檢流程。在此情境中，下列何者為 降低提示攻擊（Prompt Injection）風險的最佳策略？ (114年第四梯次)
  type: multiple_choice
  options:
  - 導入輸入檢測與回應審核流程，防止敏感指令被執行；
  - 限制 AI 可回應的主題範圍，使系統僅回答非敏感的航班與票務查 詢，避免處理內部或敏感流程資訊；
  - 隨機變化回覆內容，讓攻擊者難以預測回應行為以增加攻擊難度；
  - 擴充與更新航班與票務資料來源，以提升模型的知識正確性與覆蓋 率
  correct_index: 0
  explanation: Prompt Injection 是一種攻擊手法，透過惡意指令誤導模型忽略原有的安全限制或執行未授權的操作。 
