questions:
- id: 2001
  chapter_title: 進階提示工程
  section_title: 進階提示策略
  text: 角色扮演 (Persona Prompting) 的主要功能是？
  type: multiple_choice
  options:
  - 讓模型學會演戲
  - 透過賦予 AI 特定身分，改變其輸出的語氣、專業度與視角
  - 減少 Token 使用量
  - 增加模型的運算速度
  correct_index: 1
  explanation: 設定角色（如「你是資深工程師」）能引導模型調用特定領域的知識與詞彙，使回答更符合預期情境。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2002
  chapter_title: 進階提示工程
  section_title: 進階提示策略
  text: 如果希望 AI 用簡單易懂的方式解釋複雜概念，最好的提示策略是？
  type: multiple_choice
  options:
  - Graph Prompting
  - Zero-shot Prompting
  - APE
  - Persona Prompting (設定為幼兒園老師或科普作家)
  correct_index: 3
  explanation: 透過設定「幼兒園老師」等角色，模型會自動調整語言複雜度，使用譬喻法來解釋概念。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2003
  chapter_title: 進階提示工程
  section_title: 進階提示策略
  text: 圖提示 (Graph Prompting) 與思維鏈 (CoT) 的主要區別在於？
  type: multiple_choice
  options:
  - 兩者完全相同
  - CoT 不需要範例
  - CoT 是線性的，Graph Prompting 適合處理非線性結構與複雜關係
  - Graph Prompting 只能處理圖片
  correct_index: 2
  explanation: CoT 適合逐步推理，而 Graph Prompting 將問題建模為節點與邊，適合分析網狀關係或路徑搜尋。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2004
  chapter_title: 進階提示工程
  section_title: 自動化與優化技術
  text: 自動提示工程 (APE) 的核心概念是？
  type: multiple_choice
  options:
  - 人工手寫 Prompt
  - 禁止使用 Prompt
  - 隨機生成文字
  - 利用 LLM 自動生成並評估多個 Prompt，找出效果最好的指令
  correct_index: 3
  explanation: APE 利用 AI 來優化 AI 的指令，透過生成與評估循環，找出人類可能想不到的高效 Prompt。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2005
  chapter_title: 進階提示工程
  section_title: 自動化與優化技術
  text: 「迷失在中間 (Lost in the Middle)」現象指出 LLM 對哪部分的資訊記憶最差？
  type: multiple_choice
  options:
  - 中間
  - 全部
  - 結尾
  - 開頭
  correct_index: 0
  explanation: 研究顯示 LLM 的注意力呈現 U 型分佈，對長文本中間的資訊容易忽略或遺忘。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2006
  chapter_title: 進階提示工程
  section_title: 自動化與優化技術
  text: 為了避免「迷失在中間」，重要的指令應該放在 Prompt 的哪裡？
  type: multiple_choice
  options:
  - 隱藏起來
  - 中間
  - 隨機位置
  - 最前面或最後面 (置頂或置底)
  correct_index: 3
  explanation: 將關鍵指令置於 Context 的首尾，能最大程度確保模型注意到並遵循該指令。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2007
  chapter_title: 進階提示工程
  section_title: 提示攻擊與防禦
  text: Prompt Injection (提示注入攻擊) 的目的是？
  type: multiple_choice
  options:
  - 幫助模型學習
  - 繞過模型的安全限制或改變其預設行為
  - 增加模型速度
  - 測試模型準確度
  correct_index: 1
  explanation: 攻擊者透過輸入惡意指令（如「忽略之前的指令」），試圖操控模型執行未經授權的動作。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
- id: 2008
  chapter_title: 進階提示工程
  section_title: 提示攻擊與防禦
  text: 使用分隔符號 (Delimiters) 如 `###` 的主要防禦作用是？
  type: multiple_choice
  options:
  - 明確區隔系統指令與使用者輸入，防止模型混淆
  - 加速運算
  - 增加 Token 數
  - 美化輸出
  correct_index: 0
  explanation: 分隔符號幫助模型分辨哪部分是不可變更的指令，哪部分是可能包含惡意內容的資料。
  tags:
  - chap-gen-chapter2
  - sec-advanced-prompt
  usage: quiz
