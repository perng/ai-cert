  text: 隨著企業加速導入 AI，No-Code/Low-Code 平台逐漸成為模型開發與產品化的常 見工具。相較於傳統自行撰寫程式的建模流程，下列何者最能正確描述此類平台 在模型訓練機制上的典型特性？（115年第一梯次）
