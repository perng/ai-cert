  chapter_title: No Code / Low Code 平台與 AI 開發工具
  section_title: 整合策略與風險
  text: 使用 AI 生成程式碼時，最重要的安全守則是？
  type: multiple_choice
  options:
  - 完全信任 AI (Fully Trusting AI)，盲目接受。
  - '人類必須進行 Code Review，檢查 Bug 與漏洞 (Human Code Review Required: Checking for Bugs and Vulnerabilities)'
  - 不看程式碼 (Not Reviewing Code)，忽略潛在風險。
  - 直接部署到正式環境 (Deploying Directly to Production)，高風險操作。
  correct_index: 1
  explanation: AI 生成的程式碼可能包含錯誤或安全隱患，人工審查是不可或缺的防線。
