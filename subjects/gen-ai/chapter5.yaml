  chapter_title: No Code / Low Code 平台與 AI 開發工具
  section_title: 歷屆考題
  text: 某零售企業規劃提升門市數據應用能力，目標包括：門市主管可自行調整分析畫 面與檢視指標呈現，以及由行銷部門建立銷售預測模型，以支援補貨與促銷規 劃。企業在選型時以工具的主要功能定位與典型用途作為評估依據。依此需求判 斷，下列哪一項 AI 工具使用規劃最合理？（115年第一梯次）
