- id: 115003
  chapter_title: No Code / Low Code 平台與 AI 開發工具
  section_title: 歷屆考題
  text: 某企業規劃透過 Low-Code 平台建置可視化儀表板，以支援營運數據的即時監控 與分析判讀。若企業特別關注儀表板顯示結果的穩定性與分析可信度，下列何者 最應優先確認？（115年第一梯次）
  options:
  - 是否具備穩定的資料串接能力與即時更新機制；
  - 是否提供自動化決策建議與預測分析模組；
  - 是否支援彈性介面設計與多角色權限管理；
  - 是否整合流程觸發與跨系統通知功能
  correct_index: 0
  explanation: 儀表板的可信度建立在資料源的正確性上，因此必須優先確認平台是否具備穩定的資料串接能力與即時更新機制。
  type: multiple_choice
  tags:
  - chap-gen-chapter5
  - sec-past-exam
  usage: both
- id: 115007
  chapter_title: No Code / Low Code 平台與 AI 開發工具
  section_title: 歷屆考題
  text: 某企業導入 No-Code/Low-Code 平台，讓各部門能自行建立資料分析與流程應用。 隨著使用範圍擴大，管理層開始關注資料權限、存取紀錄與合規要求。依資料治 理觀點，下列何者最合理描述此類平台對企業治理機制的典型影響？（115年第一梯次）
  options:
  - 平台內建角色權限與資料存取控管機制，有助治理制度落實；
  - 平台強化部門自主性，通常使既有治理流程難以延續；
  - 平台主要支援應用快速開發，資料治理仍需完全仰賴外部系統；
  - 平台透過自動化設定機制，可顯著降低治理與合規管理需求
  correct_index: 0
  explanation: 在企業級的 No-Code/Low-Code 平台中，通常內建角色權限與資料存取控管機制，這有助於集中管理並落實企業的資料治理制度。
  type: multiple_choice
  tags:
  - chap-gen-chapter5
  - sec-past-exam
  usage: both
- id: 115008
  chapter_title: No Code / Low Code 平台與 AI 開發工具
  section_title: 歷屆考題
  text: 某製造企業規劃於設備端建置邊緣運算（Edge Computing）架構，並以 No- Code/Low-Code 平台開發即時監控應用。測試顯示，系統在雲端環境執行順暢， 但部署至邊緣裝置後出現回應延遲與效能下降。依此情境判斷，下列何者最合理 解釋該現象？（115年第一梯次）
  options:
  - 邊緣運算架構可降低系統對效能的需求；
  - No-Code/Low-Code 平台僅能在雲端環境執行；
  - 雲端部署通常比邊緣部署更容易出現延遲；
  - 邊緣裝置通常受限於運算能力與可用資源
  correct_index: 3
  explanation: 邊緣裝置（Edge Devices）相較於雲端伺服器，通常受限於運算能力與可用資源，因此在執行複雜的 AI 模型或大量數據處理時容易出現延遲。
  type: multiple_choice
  tags:
  - chap-gen-chapter5
  - sec-past-exam
  usage: both
