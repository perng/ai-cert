  section_title: 熱門 AI 開發與 No/Low Code 工具 (實務趨勢)
  text: Google Antigravity 的「可驗證性 (Verifiability)」是指？
  type: multiple_choice
  options:
  - 可以驗證密碼 (Password Verification)，安全功能。
