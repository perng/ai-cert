  section_title: 歷屆考題
  text: 某農業合作社希望建立一套自動化工作流程，當農民透過手機 APP 回報田間病蟲 害照片時，系統能自動通知相關專家、建立案件紀錄並排程現場訪查。該合作社 IT 資訊人力有限，僅有一位具備基礎程式概念的人員。下列哪一種開發方式最適 合此需求？（115年第一梯次）
  options:
