  section_title: 歷屆考題
  text: 某醫療院所希望改善行政效率，規劃讓各科室人員可自行建立行政回報與內部申 請表單，並導入 AI 功能以自動判讀與分類填寫內容（如問題類型或需求性質） ， 同時需兼顧流程調整彈性與降低系統開發維運負擔。下列哪一種技術組合最適 第二科：生成式 AI 應用與規劃 合？（115年第一梯次）
