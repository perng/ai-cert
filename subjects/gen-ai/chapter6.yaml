  chapter_title: 生成式 AI 專案管理與評估
  section_title: 導入流程與策略
  text: 目標設定 (Goal Setting) 階段應該？
  type: multiple_choice
  options:
  - 忽略使用者需求
  - 直接開始寫程式
  - 明確定義問題與 KPI (如減少 30% 工作量)
  - 購買最貴的 GPU
  correct_index: 2
  explanation: 明確的目標與量化指標是專案成功的導航燈，避免迷失方向。
