  explanation: 生成式 AI 導入應先連結明確的業務問題與衡量指標，再評估資料、模型、流程與風險。若只從模型規模或硬體採購出發，容易無法證明實際價值。
  tags:
  - chap-gen-chapter6
  usage: both
- id: 900017
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 官方學習指引補充：生成式 AI 導入評估規劃
  text: 某公司要讓生成式 AI 讀取內部合約並產出摘要。下列哪一項最能降低錯誤引用與法務風險？
  type: multiple_choice
  options:
  - 建立文件權限控管、來源引用與人工覆核流程
  - 將溫度參數調到最高，讓摘要更有創意
  - 只使用公開網頁資料，不匯入公司合約
  - 將所有合約一次貼入提示詞，不需資料治理
  correct_index: 0
  explanation: 合約摘要屬於高風險知識工作，應確保模型只能存取授權文件，輸出可追溯到來源，並在正式使用前經專業人員覆核。
  tags:
  - chap-gen-chapter6
  usage: both
- id: 900018
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 官方學習指引補充：生成式 AI 導入評估規劃
  text: 在生成式 AI 導入的試行階段，哪一種做法最符合漸進式風險控管？
  type: multiple_choice
  options:
  - 從低風險、可量測、可人工覆核的流程開始試點
  - 直接讓模型自動批准所有高金額交易
  - 只看模型展示效果，不收集使用者回饋
  - 將試行環境與正式生產系統完全混用
  correct_index: 0
  explanation: 試行階段應選擇範圍可控的流程，建立成功指標、使用者回饋、失敗案例與人工介入機制，再逐步擴大部署。
  tags:
