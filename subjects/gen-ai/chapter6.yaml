  - 全英文題目
  correct_index: 2
  explanation: TTQA 填補了通用基準測試在在地化知識方面的空白，確保模型懂台灣。
  tags:
  - chap-gen-chapter6
  - sec-project-planning
  usage: both
- id: '6016_1'
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 導入流程與策略
  text: 雲端 API 的優點不包括？
  type: multiple_choice
  options:
  - 建置快
  - 模型能力強
  - 資料隱私最高
  - 無需維護硬體
  correct_index: 2
  explanation: 資料需上傳至雲端供應商，隱私性通常不如本地部署。
