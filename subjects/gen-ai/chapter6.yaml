- id: 115005
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某企業導入生成式 AI 系統，希望自動產出客服回覆與內部文件摘要。系統需能理解使用者輸入的完整語句內容，並在回覆中維持語意連貫，即使對話內容較長仍能保持上下文一致性。基於上述需求，下列何種模型架構最為適合？（115年第一梯次）
  options:
  - 卷積神經網路（Convolutional Neural Network, CNN）；
  - 遞迴神經網路（Recurrent Neural Network, RNN）；
  - 基於 Transformer 架構的自迴歸模型（Autoregressive Model）；
  - 生成對抗網路（Generative Adversarial Network, GAN）
  correct_index: 2
  explanation: 生成式 AI (如 ChatGPT) 能處理長上下文並維持語意連貫，主要是依賴基於 Transformer 架構的自迴歸模型 (Autoregressive Model) 的注意力機制與生成特性。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115014
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某企業導入大型語言模型（LLM）分析內部報表，使用者經常提供 Excel 匯出的表格資料（如銷售數據與統計表） 。測試時發現，模型對原始表格解析效果不穩定。為提升模型理解與回應品質，下列哪一種上下文工程（Context Engineering） 作法較為適當？（115年第一梯次）
  options:
  - 將表格內容轉換為結構化 JSON 或 Markdown table；
  - 在維持原始表格呈現方式下，補充欄位與數據說明；
  - 將表格資料隨機切割後分段輸入；
  - 直接提供原始表格內容以保留完整資訊
  correct_index: 0
  explanation: LLM 對於純文字的理解力遠勝於複雜的 Excel 檔案格式。將表格轉換為 JSON 或 Markdown table 等結構化文字格式，能大幅提升模型的解析與推理準確度。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115017
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某企業提供大型語言模型（LLM）API 服務，需支援高併發請求與流量波動，同時要求服務不中斷並具備故障容忍能力。若以高可用性與可擴展性為主要設計原則，下列哪一種部署方式較為適當？（115年第一梯次）
  options:
  - 採用單一高效能虛擬機（VM）集中部署，以提升資源使用效率；
  - 建立多個模型服務實例並透過負載分散機制提供服務；
  - 將推論任務改由用戶端設備分擔，以降低伺服器負載壓力；
  - 使用 FTP 協議傳輸請求與回應，以減少服務通訊負擔
  correct_index: 1
  explanation: 為了因應高併發流量並維持高可用性（HA），最佳實務是建立多個模型服務實例（Instances），並利用負載平衡器（Load Balancer）來分散請求流量。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115025
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某機構計畫導入生成式 AI 旅遊資訊服務對話系統自動生成多語言對話。目前每月需人工翻譯 600 則訊息，每則成本 50 元；若改用 ChatGPT API，每則訊息需 2000 Tokens，而 Token 成本 0.8 元/1000 Tokens，但需額外投入系統整合費用 20 萬元。 關於投資報酬率（Return on Investment, ROI）評估，下列何者最為正確？（115年第一梯次）
  options:
  - 每月節省成本 29,040 元，系統整合成本約 7 個月回收；
  - 每月節省成本 30,000 元，系統整合成本約 7 個月回收；
  - 每月節省成本 28,040 元，系統整合成本約 8 個月回收；
  - 每月節省成本 25,000 元，系統整合成本約 8 個月回收
  correct_index: 0
  explanation: 每月人工成本為 600 * 50 = 30,000 元。改用 API 每月成本為 600 * (2000/1000) * 0.8 = 960 元。每月節省 29,040 元。20 萬系統整合成本 / 29040 ≈ 6.88，約 7 個月回收。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115027
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某紡織公司希望建立自動化品質檢測流程，既有的 AI 系統檢測到布料瑕疵時，需自動拍照存檔、發送通知給品管人員。該公司具有一定開發人力，希望快速建置此工作流程，並保有彈性調整空間，下列哪一種解決方案最適合？（115年第一梯次）
  options:
  - 使用 n8n 建立工作流（Workflow） ，整合AI 檢測 API、檔案系統、通訊軟體；
  - 委外開發客製化程式，完全符合公司需求規格；
  - 採購現成的品質管理軟體，直接導入使用；
  - 使用 Excel 巨集搭配人工作業處理檢測結果
  correct_index: 0
  explanation: n8n 是一個強大的自動化工作流工具，能以視覺化方式快速串接 AI API、檔案系統與通訊軟體，既節省開發時間又保留了日後調整流程的彈性。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115028
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某市政府交通局計劃導入生成式 AI 技術來自動生成公車到站時間預測的文字報告，每日需處理約 50 萬筆交通資料並生成 1000 份報告。在評估導入成本時，團隊希望進行 Token Economics 分析（指模型推理與生成過程中，Token 使用量及其費用） 。下列何者不屬於Token Economics 的考量範圍？（115年第一梯次）
  options:
  - 每次 API 呼叫所需的輸入 Token 數量；
  - 生成報告內容所消耗的輸出 Token 費用；
  - AI 模型訓練階段使用 Token 數量所需的 GPU 記憶體成本；
  - 模型推理過程中的 Token 使用量統計
  correct_index: 2
  explanation: Token Economics 專注於評估模型在推論（Inference）時消耗的輸入與輸出 Token 費用。模型訓練階段的 GPU 運算與記憶體成本屬於基礎設施投資，不包含在內。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115044
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某智慧製造廠導入語音互動 AI 助理，作業人員可透過語音查詢設備狀態與操作指引。系統流程包含語音轉文字、語言模型生成回覆，以及即時查詢內部系統資料。測試結果顯示：語音轉文字在專業設備術語上錯誤率偏高；語言模型回覆偶有內容不夠精準；系統整體回應速度略慢但仍在可接受範圍。若專案目標為優先確保正確執行指令，下列改進措施的執行順序何者最合理？（115年第一梯次）
  options:
  - 優化語言模型 → 強化語音模型 → 優化系統效能 → 調整生成參數；
  - 強化語音模型 → 優化語言模型與知識補充 → 調整生成參數 → 優化系統效能；
  - 優化系統效能 → 強化語音模型 → 優化語言模型與知識補充 → 調整生成參數；
  - 強化語音模型 → 優化系統效能 → 優化語言模型與知識補充 → 調整生成參數
  correct_index: 1
  explanation: 語音轉文字的錯誤會直接導致語言模型獲得錯誤的輸入，因此必須先「強化語音模型」；接著才是「優化語言模型」，最後再處理生成參數與系統效能優化。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
- id: 115047
  chapter_title: 生成式 AI 專案管理與評估
  section_title: 歷屆考題
  text: 某製造企業規劃導入生成式 AI 協助產線異常紀錄分析，系統將根據設備回報與維修紀錄自動產出問題摘要與建議處置說明。在試行測試階段，為降低營運與決策風險，下列何者最應優先驗證？（115年第一梯次）
  options:
  - AI 生成建議與實際工程判斷的一致性與正確性；
  - 系統在高資料量輸入下的處理速度與延遲表現；
  - 模型對不同設備品牌資料格式的轉換能力；
  - 異常分析報告的視覺化呈現與介面易讀性
  correct_index: 0
  explanation: AI 在異常分析中若提供錯誤建議，可能導致產線停機或工安風險。因此在試行階段，最關鍵且最優先的任務是驗證 AI 建議與人類工程師專業判斷的正確性與一致性。
  type: multiple_choice
  tags:
  - chap-gen-chapter6
  - sec-past-exam
  usage: both
