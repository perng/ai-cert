  chapter_title: 生成式 AI 的專案規劃與評估
  section_title: 生成式 AI 專案管理與評估
  text: 一家顧問公司使用生成式 AI 協助撰寫數據分析報告。雖然模型在測試 中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關 鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何 者為造成這種現象的最合理解釋？ (114年第四梯次)
  type: multiple_choice
  options:
  - 模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分 析邏輯；
  - 測試資料涵蓋過多統計圖表，導致模型無法專注於文字內容的多樣 化表達；
  - 模型過度依賴訓練語料中的常見報告範式，導致生成結果以樣板化 結構取代真正的推理；
