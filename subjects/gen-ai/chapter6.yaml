  chapter_title: 生成式 AI 專案管理與評估
  section_title: 效能評估指標
  text: Throughput (吞吐量) 是指？
  type: multiple_choice
  options:
  - 硬碟容量
  - 網路頻寬
  - 系統單位時間內能處理的請求數量或 Token 數量
  - 電力消耗
  correct_index: 2
  explanation: 吞吐量衡量系統的負載能力，是評估伺服器效能的關鍵指標。
