  section_title: 模型參數與控制
  text: 情境：Frequency Penalty 的主要用途是？
  type: multiple_choice
  options:
  - 增加生成長度
  - 減少模型重複同一句話或跳針的情況
  - 提高準確率
  - 加快生成速度
  correct_index: 1
  explanation: 透過懲罰已出現過的詞彙（依次數加重），強迫模型選擇新詞，避免鬼打牆。
