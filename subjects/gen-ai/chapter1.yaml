      - "降低 Temperature"
      - "提高 Presence Penalty"
      - "提高 Frequency Penalty"
      - "降低 Top-P"
    correct_index: 1
    explanation: "提高 Presence Penalty 會懲罰已經出現過的話題詞彙，鼓勵模型使用未出現過的詞，從而轉向新話題。"
    tags: ["sec-gen-chapter1", "sec-gen-ai-models"]

  - id: 1030
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "Transformer 架構變體"
    text: "Claude 模型屬於哪一類架構？"
