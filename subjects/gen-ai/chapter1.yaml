  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: LLM 訓練生命週期
  text: 情境：預訓練 (Pre-training) 階段的主要目標是？
  type: multiple_choice
  options:
  - 讓模型學會聽從指令
  - 讓模型學會語言結構與廣泛的世界知識
  - 讓模型符合人類價值觀
  - 讓模型學會寫程式
  correct_index: 1
  explanation: 預訓練透過海量文本讓模型建立對語言與世界的基礎認知，產出 Base Model。
  tags:
  - chap-gen-chapter1
  - sec-llm-lifecycle
  id: 11436
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 情境：Top-P (Nucleus Sampling) 參數設為 0.9 的意思是？
  type: multiple_choice
  options:
  - 只從機率最高的 90 個詞中選擇
  - 只從累積機率達到 90% 的前幾個候選詞中選擇
  - 有 90% 的機率選擇機率最高的詞
  - 隨機選擇
  correct_index: 1
  explanation: Top-P 採樣動態截斷機率分佈的尾端，保留累積機率達 P 的核心詞彙，確保生成品質。
  tags:
  - chap-gen-chapter1
  - sec-model-params
  id: 11437
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 核心機制
  text: 情境：位置編碼 (Positional Encoding) 的作用是？
  type: multiple_choice
  options:
  - 加密輸入資料
  - 告訴模型每個字在句子中的順序
  - 壓縮資料
  - 標註詞性
  correct_index: 1
  explanation: 由於 Self-Attention 是平行處理，缺乏序列資訊，需透過位置編碼注入位置訊號。
  tags:
  - chap-gen-chapter1
  - sec-transformer-core
  id: 11438
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: 情境：T5 (Text-to-Text Transfer Transformer) 模型最擅長哪類任務？
  type: multiple_choice
  options:
  - 僅分類
  - 僅生成
  - 序列到序列 (Seq2Seq) 的轉換，如翻譯或摘要
  - 圖像辨識
  correct_index: 2
  explanation: T5 採用 Encoder-Decoder 架構，將所有 NLP 任務都視為 Text-to-Text 轉換，特別適合翻譯與摘要。
  tags:
  - chap-gen-chapter1
