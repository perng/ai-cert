  - 兩者都是鑑別式 AI；
  - 兩者都是生成式 AI
  correct_index: 0
  explanation: 自動判斷是否詐欺屬於分類問題，是鑑別式 AI（Discriminative AI）的應用；而自動生成調查報告則需要產生新內容，屬於生成式 AI（Generative AI）。
  type: multiple_choice
  tags:
  - chap-gen-chapter1
  - sec-past-exam
  usage: both
- id: 115030
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 歷屆考題
  text: 某市政府環保局想建立一個垃圾分類查詢系統，讓民眾輸入物品名稱後自動判斷 分類。由於垃圾種類繁多，但每種分類的訓練範例有限，工程師決定採用少樣本 學習（Few-shot Learning）技術。下列何者為少樣本學習（Few-shot Learning）的 主要特徵？（115年第一梯次）
  options:
  - 需重新蒐集大規模標註資料，以確保模型具備穩定表現；
  - 透過少量任務示例，引導模型適應新情境或新分類需求；
  - 不需任何範例輸入，即可完成新任務推論；
  - 僅適用於自然語言處理任務，對其他模態效果有限
  correct_index: 1
  explanation: 少樣本學習（Few-shot Learning）的特徵在於不需要大量訓練資料，只需在 Prompt 中提供少量的範例（如幾種垃圾的分類範例），即可引導模型適應新任務。
  type: multiple_choice
  tags:
  - chap-gen-chapter1
  - sec-past-exam
  usage: both
- id: 115042
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 歷屆考題
  text: 某企業希望利用含敏感資訊的資料進行 AI 模型訓練，但政策要求原始資料不得外 洩，且資料可集中於安全環境中處理。同時，企業希望在資料使用過程中，即使 資料處於加密狀態，仍能完成模型計算。在此需求下，下列哪一種技術最為適 第二科：生成式 AI 應用與規劃 合？（115年第一梯次）
  options:
  - 聯邦學習（Federated Learning）；
  - 同態加密（Homomorphic Encryption）；
  - 零知識證明（Zero-knowledge Proof）；
  - 資料匿名化（Data Anonymization）
  correct_index: 1
  explanation: 同態加密（Homomorphic Encryption）允許在密文（加密狀態）上直接進行數學運算，運算結果解密後與在明文上運算的結果相同，非常適合用於隱私保護模型計算。
  type: multiple_choice
  tags:
  - chap-gen-chapter1
  - sec-past-exam
  usage: both
- id: 115048
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 歷屆考題
  text: 某企業將機器學習模型部署於線上推薦系統。模型在測試階段表現良好，但上線 數月後，點擊率與預測準確度逐漸下降。經分析發現，近期使用者行為模式與模 型訓練期間的資料特徵出現顯著變化。此現象最可能屬於下列何者？（115年第一梯次）
  options:
  - 模型過度擬合訓練資料，無法泛化至未知樣本；
  - 特徵工程設計不佳，導致輸入資訊不足；
  - 資料統計特徵隨時間改變，影響模型推論效果；
  - 系統資料結構調整，造成特徵欄位錯置
  correct_index: 2
  explanation: 當模型上線後準確度逐漸下降，通常是因為真實世界的使用者行為或數據特徵發生了改變，這種現象稱為資料漂移（Data Drift）或概念漂移（Concept Drift）。
  type: multiple_choice
  tags:
  - chap-gen-chapter1
  - sec-past-exam
  usage: both
- id: 900005
  chapter_title: 生成式 AI 模型架構與機制 (Generative Models & Mechanisms)
  section_title: 官方學習指引補充：生成式 AI 應用領域與工具使用
  text: 某行銷團隊希望快速產出社群貼文、廣告文案與多版本標題，最適合優先評估哪類生成式 AI 工具？
  type: multiple_choice
  options:
  - 文字生成與文案輔助工具，並搭配品牌語氣與審核流程
  - 只支援資料庫交易回滾的工具
  - 僅能執行 K-means 分群的工具
  - 只能進行硬體溫度監控的工具
  correct_index: 0
  explanation: 文案與貼文屬於自然語言生成任務，應選擇文字生成工具並建立品牌一致性、事實查核與人工審核流程。
  tags:
  - chap-gen-ai-chapter1
  usage: both
- id: 900006
  chapter_title: 生成式 AI 模型架構與機制 (Generative Models & Mechanisms)
  section_title: 官方學習指引補充：生成式 AI 應用領域與工具使用
  text: 企業使用文字轉圖像工具產生產品概念圖時，下列哪一項風險控管最必要？
  type: multiple_choice
  options:
  - 檢查輸出是否符合品牌規範、授權要求與不實或侵權風險
  - 完全不需要人工審核，因為生成圖一定可商用
