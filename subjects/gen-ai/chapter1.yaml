  - id: 1032
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "Transformer 架構變體"
    text: "Encoder-only 模型被比喻為？"
    type: multiple_choice
    options:
      - "小說家"
      - "閱讀測驗高手"
      - "翻譯官"
      - "詩人"
    correct_index: 1
    explanation: "因為它擅長理解文章內容並回答相關問題（分類、標註），但不擅長自己創作長文。"
    tags: ["sec-gen-chapter1", "sec-gen-ai-models"]

  - id: 1033
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "模型參數與控制"
    text: "Top-P 設為 0.9 意味著？"
    type: multiple_choice
