  - chap-gen-chapter1
  - sec-transformer-variants
  usage: both
- id: 1064
  chapter_title: 生成式 AI 模型與核心機制
  section_title: Transformer 架構變體
  text: 為何 BERT (Encoder-only) 模型不適合用於「寫小說」這類生成任務？
  type: multiple_choice
  options:
  - 因為 BERT 的訓練目標是填空 (Masked LM)，而非預測下一個字，導致生成能力較弱 (Masked LM Objective)
  - 因為 BERT 只能處理英文，無法生成其他語言的小說 (English Only)
  - 因為 BERT 的參數量通常太小，無法記住小說的情節 (Small Parameters)
  - 因為 BERT 的注意力機制是單向的，無法參考上文資訊 (Unidirectional Attention)
  correct_index: 0
  explanation: BERT 的雙向注意力機制是為了「理解」上下文，而非像 GPT 的單向注意力機制那樣專注於「生成」未來。
  tags:
  - chap-gen-chapter1
  - sec-transformer-variants
  usage: both
