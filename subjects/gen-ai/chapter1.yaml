  usage: both
- id: 900007
  chapter_title: 生成式 AI 模型架構與機制 (Generative Models & Mechanisms)
  section_title: 官方學習指引補充：生成式 AI 應用領域與工具使用
  text: 若客服知識庫經常更新，為降低生成式 AI 回答過時或幻覺的風險，較合適的做法是什麼？
  type: multiple_choice
  options:
  - 建立 RAG 流程，回答前先檢索最新且有權限的知識來源
  - 永遠只依賴模型預訓練記憶
  - 降低螢幕亮度以減少幻覺
  - 將所有問題改成圖片格式
  correct_index: 0
  explanation: RAG 可把外部最新資料帶入生成流程，並透過來源引用與權限控管降低知識過時和幻覺風險。
  tags:
  - chap-gen-ai-chapter1
  usage: both
- id: 900008
  chapter_title: 生成式 AI 模型架構與機制 (Generative Models & Mechanisms)
  section_title: 生成式 AI 模型原理
  text: 擴散模型產生影像的核心機制最接近下列哪一項？
  type: multiple_choice
  options:
  - 從雜訊開始逐步去噪，並在條件提示引導下生成符合描述的影像
  - 只用決策樹逐層分裂像素
  - 直接查詢資料庫並複製完全相同圖片
  - 將所有輸入文字轉成固定整數標籤後停止運算
  correct_index: 0
  explanation: 擴散模型先學習加噪與去噪過程，生成時從雜訊逐步反推，常結合文字條件控制輸出內容。
