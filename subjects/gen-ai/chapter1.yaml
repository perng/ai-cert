- id: '1011_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 頻率懲罰 (Frequency Penalty) 的主要用途是？
  type: multiple_choice
  options:
  - 增加生成速度 (Increase Speed)
  - 減少模型重複同一句話或跳針的情況 (Reduce Repetition)
  - 限制輸出長度 (Limit Length)
  - 讓模型使用更難的單字 (Use Harder Words)
  correct_index: 1
  explanation: 透過懲罰已經出現多次的 Token，降低其再次被選中的機率，從而減少重複。
  tags:
  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: both
