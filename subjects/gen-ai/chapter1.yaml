  - id: 1028
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "Transformer 架構變體"
    text: "Encoder-Decoder 架構被比喻為？"
    type: multiple_choice
    options:
      - "小說家"
      - "閱讀測驗高手"
      - "翻譯官"
      - "畫家"
    correct_index: 2
    explanation: "因為它先理解輸入（聽懂）再生成輸出（表達），就像翻譯官的工作流程。"
    tags: ["sec-gen-chapter1", "sec-gen-ai-models"]

  - id: 1029
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "模型參數與控制"
    text: "如果希望模型在對話中不斷開啟新話題，應該調整哪個參數？"
    type: multiple_choice
