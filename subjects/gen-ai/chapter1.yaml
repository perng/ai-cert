  - sec-gen-ai-models
  usage: quiz
- id: '1005_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: Decoder-only 架構的核心機制是？
  type: multiple_choice
  options:
  - 卷積運算 (Convolution)
  - 遮罩注意力 (Masked Self-Attention) (Masked Self-Attention)
  - 雙向注意力 (Bidirectional Attention)
  - 池化運算 (Pooling)
  correct_index: 1
  explanation: 為了防止模型在預測下一個字時「偷看」後面的答案，Decoder-only 使用遮罩機制確保只能看到過去的資訊。
  tags:
  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: quiz
- id: '1006_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 在生成式 AI 中，溫度 (Temperature) 參數主要控制什麼？
  type: multiple_choice
  options:
  - 模型的運算速度 (Computation Speed)
  - 輸出的字數 (Output Length)
  - 輸出內容的隨機性與創造力 (Randomness & Creativity)
  - 模型的記憶長度 (Memory Length)
  correct_index: 2
  explanation: 溫度調整了下一個 Token 的機率分佈，低溫讓輸出更確定，高溫讓輸出更多樣化。
  tags:
  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: quiz
- id: '1007_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 如果希望模型回答事實性問題（如「台灣首都在哪」），應將溫度設為？
  type: multiple_choice
  options:
  - 低溫 (如 0.1) (Low Temperature)
  - 中溫 (如 0.5) (Medium Temperature)
  - 高溫 (如 0.9) (High Temperature)
  - 隨機 (Random)
  correct_index: 0
  explanation: 事實性問題需要精確且穩定的答案，低溫能減少隨機性，確保模型輸出機率最高的正確答案。
  tags:
  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: quiz
- id: '1008_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: Top-P (Nucleus Sampling) 的運作原理是？
  type: multiple_choice
  options:
  - 從累積機率達到 P 的前幾個候選字中抽樣 (Sample from Cumulative Probability P)
  - 刪除機率低於 P 的字 (Remove Low Probability)
  - 只選機率最高的前 P 個字 (Top P Words)
  - 隨機選擇 P 個字 (Random P Words)
  correct_index: 0
  explanation: Top-P 動態選擇一組候選字，其機率總和剛好超過 P，這樣既保留了多樣性，又排除了極低機率的離譜選項。
  tags:
  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: quiz
