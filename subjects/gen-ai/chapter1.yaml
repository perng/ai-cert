  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 情境：你正在開發一個「創意寫詩」的應用，希望 AI 每次生成的詩句都充滿驚喜且不重複。你應該如何調整 Temperature 參數？
  type: multiple_choice
  options:
  - 調低 (接近 0)
  - 調高 (接近 1 或更高)
  - 保持預設
  - Temperature 與創意無關
  correct_index: 1
  explanation: 高 Temperature 會增加隨機性，讓模型有機會選擇機率較低但具創意的詞彙，適合創作型任務。
  tags:
  - chap-gen-chapter1
  - sec-model-params
  id: 11433
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 核心機制
  text: 情境：Transformer 模型之所以能進行平行運算，大幅提升訓練速度，是因為它摒棄了哪種傳統架構的依序處理方式？
  type: multiple_choice
  options:
  - CNN
  - RNN (循環神經網路)
  - MLP
  - GAN
  correct_index: 1
  explanation: RNN 必須等待前一個時間步計算完成才能處理下一個，而 Transformer 可以同時處理整個序列。
  tags:
  - chap-gen-chapter1
  - sec-transformer-core
  id: 11434
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: 情境：GPT-4 主要屬於哪種 Transformer 架構？
  type: multiple_choice
  options:
  - Encoder-only
  - Decoder-only
  - Encoder-Decoder
  - Hybrid
  correct_index: 1
  explanation: GPT 系列是典型的 Decoder-only 架構，專注於預測下一個 Token (Next Token Prediction) 以生成文本。
