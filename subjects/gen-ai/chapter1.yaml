  explanation: Self-Attention 機制會計算句子中每個字與其他字的關聯性，在此例中 "it" 與 "animal" 的 Attention
    Score 最高。
  tags:
  - chap-gen-chapter1
  - sec-transformer-core
  id: 11430
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: 情境：若你需要開發一個「情感分析」系統，判斷客戶評論是正面還是負面，最適合選用哪種架構的模型？
  type: multiple_choice
  options:
  - Decoder-only (如 GPT)
  - Encoder-only (如 BERT)
  - Encoder-Decoder (如 T5)
  - RNN
  correct_index: 1
  explanation: Encoder-only 模型（如 BERT）透過雙向注意力機制深入理解上下文語意，非常擅長分類與理解任務。
  tags:
  - chap-gen-chapter1
  - sec-transformer-variants
  id: 11431
  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: LLM 訓練生命週期
  text: 情境：ChatGPT 能夠拒絕回答「如何製造炸彈」這類有害問題，主要是因為經過了哪個訓練階段？
  type: multiple_choice
  options:
  - 預訓練 (Pre-training)
  - 監督式微調 (SFT)
  - 人類回饋強化學習 (RLHF)
  - 資料清洗
  correct_index: 2
  explanation: RLHF 階段透過獎勵模型與 PPO 演算法，將人類的價值觀（如無害性）注入模型，使其學會拒絕有害指令。
  tags:
  - chap-gen-chapter1
