  usage: both
- id: 1020
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: RAG (檢索增強生成) 技術常用來解決什麼問題？
  type: multiple_choice
  options:
  - 溫度設定困難
  - 模型訓練太慢
  - Token 太貴
  - Context Window 限制與知識時效性問題
  correct_index: 3
  explanation: RAG 透過檢索外部知識庫，讓模型能處理超過 Context Window 的大量資訊，並獲取最新知識。
