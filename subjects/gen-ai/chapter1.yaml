  - id: 1034
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "Transformer 架構變體"
    text: "Decoder-only 模型被比喻為？"
    type: multiple_choice
    options:
      - "小說家 / 即興演講者"
      - "閱讀測驗高手"
      - "翻譯官"
      - "評論家"
    correct_index: 0
    explanation: "因為它擅長根據前文不斷續寫內容，就像即興創作一樣。"
    tags: ["sec-gen-chapter1", "sec-gen-ai-models"]

  - id: 1035
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "模型參數與控制"
    text: "如果模型一直重複同一句話，最有效的解決方法是？"
    type: multiple_choice
    options:
