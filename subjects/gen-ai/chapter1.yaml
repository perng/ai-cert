- id: '1004_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: Encoder-only 架構最擅長處理哪類任務？
  type: multiple_choice
  options:
  - 圖像生成 (Image Generation)
  - 創意寫作 (Creative Writing)
  - 機器翻譯 (Machine Translation)
  - 理解與分類 (如情感分析、NER) (Understanding & Classification)
  correct_index: 3
  explanation: 由於具備雙向注意力，Encoder-only 模型能最好地捕捉整句的語意，適合分類與標註任務。
