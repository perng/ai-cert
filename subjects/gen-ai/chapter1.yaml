  section_title: 模型參數與控制
  text: 情境：Context Window (上下文窗口) 的大小限制會直接影響？
  type: multiple_choice
  options:
  - 模型的訓練速度
  - 模型能記住的對話長度或處理的文件大小
  - 模型的知識量
  - 模型的創造力
  correct_index: 1
  explanation: Context Window 決定了模型一次能處理的 Token 總量，超過此限制的資訊會被截斷或遺忘。
