  usage: both
- id: 1066
  chapter_title: 生成式 AI 模型與核心機制
  section_title: LLM 訓練生命週期 (The Lifecycle of LLM Training)
  text: 為何在指令微調 (SFT) 之後，還需要進行 RLHF (Reinforcement Learning from Human Feedback)？
  type: multiple_choice
  options:
  - 因為 RLHF 不需要任何人類參與，可以自動化提升模型智力 (Automated Intelligence)
  - 因為 RLHF 可以大幅減少模型的參數量，提升推論速度 (Reduce Parameters)
  - 因為 SFT 只能讓模型學會說話，RLHF 才能讓模型學會寫程式 (Learn to Code)
  - 因為 SFT 的數據可能包含有害內容，RLHF 能進一步對齊人類價值觀 (如誠實、無害) (Align with Human Values)
  correct_index: 3
  explanation: RLHF 的核心目的是「對齊 (Alignment)」，確保模型的回答符合人類的偏好與道德標準。
  tags:
  - chap-gen-chapter1
  - sec-llm-lifecycle
  usage: both
