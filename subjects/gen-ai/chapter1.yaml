    options:
      - "Encoder-only"
      - "Decoder-only"
      - "Encoder-Decoder"
      - "VAE"
    correct_index: 1
    explanation: "Anthropic 的 Claude 模型也是基於 Decoder-only 架構的大型語言模型。"
    tags: ["sec-gen-chapter1", "sec-gen-ai-models"]

  - id: 1031
    chapter_title: "生成式 AI 模型架構與機制"
    section_title: "模型參數與控制"
    text: "Context Window 的大小通常包含？"
    type: multiple_choice
