- id: 1061
  chapter_title: 生成式 AI 模型與核心機制
  section_title: Transformer 核心機制
  text: 在處理長篇法律合約時，為何 Transformer 架構通常比傳統的 RNN (Recurrent Neural Networks) 更具優勢？
  type: multiple_choice
  options:
  - 因為 RNN 無法處理英文以外的語言，而 Transformer 支援多國語言 (Language Support)
  - 因為 Transformer 不需要任何訓練資料即可直接理解法律術語 (Zero-shot Learning)
  - 因為 Transformer 的參數數量總是比 RNN 少，計算速度更快 (Fewer Parameters)
  - 因為 Transformer 透過自注意力機制能平行處理整份文件，且捕捉長距離的依賴關係 (Parallel Processing & Long-term Dependency)
  correct_index: 3
  explanation: RNN 需依序處理文字，難以平行化且易遺忘長距離資訊；Transformer 的 Self-Attention 機制解決了這兩個問題。
  tags:
  - chap-gen-chapter1
  - sec-transformer-core
  usage: both
- id: 1062
  chapter_title: 生成式 AI 模型與核心機制
  section_title: Transformer 核心機制
  text: 若移除了 Transformer 中的「位置編碼 (Positional Encoding)」，模型會面臨什麼問題？
  type: multiple_choice
  options:
  - 模型會將「貓咬狗」與「狗咬貓」視為相同的輸入 (Loss of Sequence Order)
  - 模型將無法進行平行運算，導致訓練時間大幅增加 (No Parallel Computing)
  - 模型會自動轉變為卷積神經網路 (CNN) 來處理圖像 (Transform to CNN)
  - 模型將無法識別詞彙的語意，導致翻譯結果完全錯誤 (Semantic Error)
  correct_index: 0
  explanation: Self-Attention 機制本身不具備順序感，必須依賴位置編碼來告訴模型哪個字在前、哪個字在後。
  tags:
  - chap-gen-chapter1
  - sec-transformer-core
  usage: both
- id: 1063
  chapter_title: 生成式 AI 模型與核心機制
  section_title: Transformer 架構變體
  text: 某公司想開發一個「程式碼自動補全助手」，應優先選擇哪種 Transformer 架構？
  type: multiple_choice
  options:
  - Encoder-only (如 BERT)，因為它擅長理解程式碼的語法結構 (Encoder-only)
