  usage: both
- chapter_title: 生成式 AI 模型架構與機制
  section_title: 模型參數與控制
  text: 情境：Greedy Search (貪婪搜尋) 策略的特點是？
  type: multiple_choice
  options:
  - 每次都選機率最高的字，速度快但可能缺乏創意
  - 考慮多條路徑
  - 隨機選擇
  - 逆向生成
  correct_index: 0
  explanation: Greedy Search 每次只取局部最佳解，計算簡單但容易陷入局部最優，導致生成內容單調。
