  - sec-genai-principles
  usage: both
- id: 900039
  chapter_title: 生成式 AI 模型架構與機制
  section_title: 生成式 AI 模型原理
  text: 自回歸語言模型產生文字時，最核心的運作方式是什麼？
  type: multiple_choice
  options:
  - 根據前文脈絡逐步預測下一個 token
  - 一次查表取出整篇固定答案
  - 只依照字母順序排列所有詞彙
  - 先將所有輸入刪除再隨機輸出
  correct_index: 0
  explanation: 自回歸模型會根據已出現的 token 分布預測下一個 token，並反覆進行直到完成回覆，因此上下文品質會直接影響輸出。
