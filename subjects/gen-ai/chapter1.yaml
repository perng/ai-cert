  - chap-gen-chapter1
  - sec-gen-ai-models
  usage: both
- id: 1021
  chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: BART 模型屬於哪一類架構？
  type: multiple_choice
  options:
  - Decoder-only
  - Encoder-only
  - RNN
  - Encoder-Decoder
  correct_index: 3
  explanation: BART (Bidirectional and Auto-Regressive Transformers) 結合了雙向編碼器和自回歸解碼器，屬於
    Encoder-Decoder 架構。
