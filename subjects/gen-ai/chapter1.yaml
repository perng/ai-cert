questions:
- id: '1001_1'
  chapter_title: 生成式 AI 模型架構與機制
  section_title: Transformer 架構變體
  text: BERT 模型屬於 Transformer 的哪一種架構變體？
  type: multiple_choice
  options:
  - Encoder-Decoder (編碼器-解碼器模型) (Encoder-Decoder)
  - Decoder-only (解碼器模型) (Decoder-only)
  - Encoder-only (編碼器模型) (Encoder-only)
  - RNN 模型 (RNN Model)
  correct_index: 2
  explanation: BERT 僅使用 Transformer 的編碼器部分，利用雙向注意力機制來深入理解上下文語意。
