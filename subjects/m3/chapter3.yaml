  - 應該用 Prophet。
  - 電腦壞了。
  correct_index: 0
  explanation: 如果原始序列有趨勢但未進行差分 (d=0)，ARIMA 可能無法捕捉趨勢。或者模型退化成了簡單的平均值模型。
  tags:
  - chap-m3-ch3
  - sec-scenario
  usage: mock
