  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某金融科技公司以 Z 分數（Z-Score）監控交易金額異常狀況。若交易金額平均為新台幣 2,000 元，標準差為 400 元，某筆交易金額為 3,200 元，且公司以 |Z| ≥ 3 判定為異常值（Outlier），下列判斷何者最為正確？


