- id: 114-2-029
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某團隊在開發風險評估模型時，使用主成分分析（Principal Component Analysis, PCA）進行降維。輸入資料包含三個數值欄位：「交易金額（單位：新台幣）」、「交易次數（次／月）」與「年齡（歲）」，其數值量級分別約為 10⁵、10¹ 與 10²。分析人員直接將原始數據帶入 PCA，結果第一主成分（PC1）幾乎完全由「交易金額」主導。下列哪一項作法或判斷最合理？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 這是正常現象，金額本身變異較大，應主導主要成分
  - 若改用特徵選擇法，可自動解決變數量級問題
  - 可刪除「交易金額」欄位以平衡各主成分的影響
  - 在進行 PCA 前應先進行標準化（Standardization），以避免因數值尺度差異造成特徵偏誤
  correct_index: 3
  explanation: PCA 對特徵尺度敏感；交易金額量級遠大於其他欄位時會主導變異，因此應先標準化，讓各欄位在相近尺度上共同影響主成分。
  tags:
