  - 共變異數（Covariance）
  - 皮爾森相關係數（Pearson Correlation Coefficient）
  - 平均絕對誤差（Mean Absolute Error, MAE）
  correct_index: 2
  explanation: 兩個連續變數呈明顯線性趨勢且無明顯離群值時，皮爾森相關係數最適合衡量線性關係的方向與強度。
