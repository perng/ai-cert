- id: 114-2-031
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某電商團隊觀察到，每位顧客對廣告推播的點擊行為可視為一次伯努利試驗（Bernoulli Trial），單次點擊成功機率為 p = 0.4。當推播對象擴增至 5,000 位顧客時，團隊想快速預估「成功點擊總數」的分佈情形，以進行模型效能模擬與預測。若希望以常態分佈（Normal Distribution）近似原始分佈，下列哪一項判斷最為合理？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 因樣本數極大，可直接以常態分佈近似二項分佈（Binomial Distribution）
  - 只有當 np 與 n(1-p) 皆大於 5 時，才能以常態分佈作近似
  - 常態近似只適用於 p = 0.5 的情況
  - 無論樣本數多大，二項分佈都不能以常態分佈近似
  correct_index: 1
  explanation: 二項分佈可用常態近似的常見條件是 np 與 n(1-p) 都足夠大，通常至少大於 5；本題 n=5000、p=0.4，兩者都遠大於 5。
