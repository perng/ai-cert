- chapter_title: 進階分析方法
  section_title: 統計檢定與推論
  text: 情境：型二錯誤 (Type II Error) 是指？
  type: multiple_choice
  options:
  - 偽陽性 (False Positive)
  - 偽陰性 (False Negative)，即虛無假設為假卻未被拒絕 (有病判沒病)
  - 計算過程中的數值錯誤
  - 操作過程中的人為錯誤
  correct_index: 1
  explanation: 例如有病誤診為沒病。
  tags:
  - chap-m3-ch3
  - sec-statistical-tests
  id: 5357
  usage: both
- chapter_title: 進階分析方法
  section_title: 網路分析與圖演算法
  text: 情境：Louvain 演算法用於？
  type: multiple_choice
  options:
  - 網路中的路徑規劃 (Path Planning)
  - 社群偵測 (Community Detection)，找出緊密連接的群體
  - 對網頁進行重要性排序 (Ranking)
  - 對數據進行加密 (Encryption)
  correct_index: 1
  explanation: Louvain 能快速找出網路中緊密連結的群體。
  tags:
  - chap-m3-ch3
  - sec-network-analysis
  id: 5358
  usage: both
- chapter_title: 進階分析方法
  section_title: 統計檢定與推論
  text: 情境：當數據不符合常態分佈時，應使用？
  type: multiple_choice
  options:
  - 獨立樣本 t 檢定 (Independent t-test)
  - 非參數檢定 (Non-parametric Tests)，如 Mann-Whitney U 檢定
  - 變異數分析 (ANOVA)
  - 線性迴歸分析 (Linear Regression)
  correct_index: 1
  explanation: 非參數檢定不依賴母體分佈假設，適用性更廣。
  tags:
  - chap-m3-ch3
  - sec-statistical-tests
  id: 5359
  usage: both
- chapter_title: 進階分析方法
  section_title: 地理空間資料分析
  text: 情境：Buffer 操作的作用是？
  type: multiple_choice
  options:
  - 直接刪除選定的數據
  - 在幾何圖形周圍建立指定距離的緩衝區域 (Buffer Zone)，如距離某點 500m 內的區域
  - 使用壓縮演算法減少數據大小
  - 對地圖進行旋轉操作
  correct_index: 1
  explanation: 常用於鄰近分析。
  tags:
  - chap-m3-ch3
  - sec-geospatial
  id: 5360
  usage: both
- chapter_title: 進階分析方法
  section_title: 統計檢定與推論
  text: 情境：檢定力 (Statistical Power) 是指？
  type: multiple_choice
  options:
  - 檢定過程的計算速度
  - 正確拒絕錯誤虛無假設 (H0) 的機率 (1 - β)，即偵測真實效應的能力
  - 犯型一錯誤 (Type I Error) 的機率
  - 犯型二錯誤 (Type II Error) 的機率
  correct_index: 1
  explanation: 檢定力越高，越能偵測到真實存在的效應。
  tags:
  - chap-m3-ch3
  - sec-statistical-tests
  id: 5361
  usage: both
- chapter_title: 進階分析方法
  section_title: 時間序列分析
  text: 情境：ADF 檢定用於檢驗時間序列的？
  type: multiple_choice
  options:
  - 時間序列的長度
  - 時間序列的平穩性 (Stationarity)，即是否存在單位根
  - 時間序列的季節性週期
  - 時間序列中的缺失值數量
  correct_index: 1
  explanation: ADF 檢定是否存在單位根，若拒絕 H0 則為平穩。
  tags:
  - chap-m3-ch3
  - sec-time-series
  id: 5362
  usage: both
- chapter_title: 進階分析方法
  section_title: 網路分析與圖演算法
  text: 情境：度中心性 (Degree Centrality) 衡量的是？
  type: multiple_choice
  options:
  - 節點擁有的直接連接數量 (Degree)，代表其活躍程度
  - 節點在網路中的重要性排名
  - 節點在幾何空間中的位置座標
  - 節點在視覺化圖形中的顏色深淺
  correct_index: 0
  explanation: 連接數越多，度中心性越高，通常代表該節點越活躍。
  tags:
  - chap-m3-ch3
  - sec-network-analysis
  id: 5363
  usage: both
- chapter_title: 進階分析方法
  section_title: 統計檢定與推論
  text: 情境：斯皮爾曼等級相關 (Spearman rho) 適用於？
  type: multiple_choice
  options:
  - 僅限於呈現線性關係的變數
  - 非線性單調關係 (Non-linear Monotonic Relationship) 或順序資料 (Ordinal Data)
  - 僅限於類別資料 (Categorical Data)
  - 僅限於時間序列數據 (Time Series Data)
  correct_index: 1
  explanation: Spearman 基於等級而非數值，對異常值較不敏感且能捕捉非線性關係。
  tags:
  - chap-m3-ch3
  - sec-statistical-tests
  id: 5364
  usage: both
- chapter_title: 進階分析方法
  section_title: 時間序列分析
  text: 情境：時間序列分解通常將序列分為哪三部分？
  type: multiple_choice
  options:
  - 過去 (Past)、現在 (Present)、未來 (Future)
  - 趨勢 (Trend)、季節性 (Seasonality)、殘差 (Residual)
  - 輸入 (Input)、輸出 (Output)、雜訊 (Noise)
  - 訓練集 (Training)、驗證集 (Validation)、測試集 (Test)
  correct_index: 1
  explanation: 這有助於理解數據的組成成分。
  tags:
  - chap-m3-ch3
  - sec-time-series
  id: 5365
  usage: both
