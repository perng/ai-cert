- id: 114-2-033
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某金融機構的量化分析師在建立資產風險評估模型時，發現報酬率資料分佈明顯非對稱，且出現多次極端損失事件，使得傳統假設常態分佈的模型無法準確反映真實風險。若希望在不依賴常態分佈假設的前提下，採取更能捕捉資料極端情況的建模策略，下列哪一種方法最為合適？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 採用線性迴歸模型（Linear Regression Model），以常態分佈殘差（Residuals）為基礎進行推估
  - 使用平均數（Mean）與標準差（Standard Deviation）估計波動範圍
  - 將資料裁剪至 ±3σ 範圍內以排除異常值影響
  - 採用分位數回歸模型（Quantile Regression Model），聚焦於尾部分位（Tail Quantiles）以評估極端風險
  correct_index: 3
  explanation: 報酬分佈非對稱且有極端損失時，平均與常態假設容易低估尾部風險；分位數回歸能直接建模尾部分位，更適合捕捉極端風險。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch3
  usage: mock
- id: 114-2-034
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '在圖形資料庫（Graph Database）中建模社群平台資料時，若每筆「按讚」行為都包含時間戳記（Timestamp）與裝置類型（Device Type）等資訊。若希望同時保留使用者與貼文之間的互動關係，並能有效查詢「按讚」的行為屬性，下列哪一種設計方式最為合適？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 將「按讚」視為節點（Node），與使用者建立邊（Edge）
  - 將「按讚」資訊作為邊的屬性（Property）儲存，連結使用者與被按讚的貼文節點
  - 把「按讚」資訊直接寫入使用者節點中作為屬性
  - 建立「按讚紀錄表」並將資料存入關聯式資料庫
  correct_index: 1
  explanation: 按讚是使用者與貼文之間的關係，時間戳記與裝置類型是這個關係的屬性；把它們存在邊的 property 上，可以保留互動關係並查詢行為細節。
