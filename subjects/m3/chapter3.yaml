- id: 114-2-028
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '若在高維度（>500 維）的資料上應用 DBSCAN（Density-Based Spatial Clustering of Applications with Noise）演算法，卻發現所有資料點皆被判定為雜訊（Noise），下列何者為最有可能的原因？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 高維下距離變化趨同，導致 ε（Epsilon）閾值選擇失效
  - 使用錯誤的距離函數（Distance Function）
  - MinPts 參數設得太小
  - 資料過度標準化導致特徵消失
  correct_index: 0
  explanation: 高維空間會出現距離集中現象，點與點之間距離差異變小，使 DBSCAN 的 epsilon 鄰域難以區分核心點與雜訊，因此可能全部被判為雜訊。
  tags:
