  - 使用分層交叉驗證（Stratified K-Fold Cross-Validation），以確保每折類別比例一致
  correct_index: 3
  explanation: 資料類別比例不平衡時，普通 K-fold 可能讓某些折的類別比例偏離整體分佈；Stratified K-Fold 可維持各折類別比例，讓評估較穩定。
