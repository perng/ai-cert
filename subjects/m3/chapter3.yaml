- id: 114-2-023
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某研究團隊以單樣本 t 檢定（one-sample t-test）檢驗「新行銷策略後的平均月銷售額是否與原本的 100 萬元不同」，顯著水準設定為 α = 0.05。檢定結果顯示：p 值 = 0.08，且 95% 信賴區間為 [95 萬元, 108 萬元]。根據上述結果，下列敘述何者正確？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 因 p 值 < 0.05，可拒絕虛無假設
  - 若顯著水準改為 0.10，仍不顯著
  - 因 100 萬元落在信賴區間內，無法拒絕虛無假設
  - 信賴區間寬度僅與顯著水準有關
  correct_index: 2
  explanation: p = 0.08 大於 0.05，且假設值 100 萬元落在 95% 信賴區間 [95, 108] 內，因此在 5% 顯著水準下無法拒絕平均值等於 100 萬元的虛無假設。
