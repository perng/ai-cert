  - sec-past-exam
  - past-exam
  - chap-m3-ch3
  usage: mock
- id: 114-2-026
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某串流影音平台運用關聯規則學習（Association Rule Learning）分析用戶的觀影行為，發現若使用者觀看了科幻影集，則有較高機率接著觀看超級英雄電影。分析顯示，同時觀看這兩種類型的使用者約佔全部觀影紀錄的 12%，而觀看科幻影集的使用者中，有 50% 也觀看了超級英雄電影，該規則的提升度（Lift）為 1.8。根據上述資訊，下列哪一項推論最為正確？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 支持度（Support）過低，代表此規則不具任何商業價值
  - 提升度（Lift）大於 1 表示兩種類型內容無關，僅屬於隨機重疊
  - 信賴度（Confidence）為 50%，代表觀看科幻影集者有明顯傾向觀看超級英雄電影
  - 同時觀看比例僅 12%，代表兩種類型互相排斥
  correct_index: 2
  explanation: Confidence = P(超級英雄電影 | 科幻影集) = 50%，表示看過科幻影集的人有一半也看超級英雄電影；Lift > 1 也代表正向關聯，不是隨機無關。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch3
  usage: mock
- id: 114-2-027
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某金融科技公司分析每日上億筆交易資料，以監控客戶轉帳金額分佈與異常波動。由於資料量極大，為兼顧效率與準確度，團隊決定採用「近似分位數（Approximate Quantile）」方法進行資料摘要統計。下列何者最能正確反映該技術的核心目的？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 確保每個分位值的結果完全精確，即使計算時間較長
  - 利用機器學習模型預測分位數位置，以減少統計計算量
  - 僅能對結構化資料進行批次處理，無法應用於即時資料流
  - 在可容忍誤差範圍內，快速估算分位值以支援即時分析
  correct_index: 3
  explanation: 近似分位數的目的不是追求完全精確，而是在可接受誤差內快速估算分位值，特別適合上億筆資料或即時監控情境。
