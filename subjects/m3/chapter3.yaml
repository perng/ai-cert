- id: 114-2-014
  chapter_title: 進階分析方法
  section_title: 歷屆考題
  text: '某組資料共 10 項標籤如下：


    ```text

    A, A, A, A, A, B, B, B, B, B

    ```


    若該標籤僅有 A、B 兩種，請問這組資料的「正規化吉尼不純度（Normalized Gini impurity）」為何？


    (114年第二梯次)'
  content:
  - type: text
    text: 某組資料共 10 項標籤如下：
  - type: code
    code: 'A, A, A, A, A, B, B, B, B, B

      '
    language: text
  - type: text
    text: '若該標籤僅有 A、B 兩種，請問這組資料的「正規化吉尼不純度（Normalized Gini impurity）」為何？


      (114年第二梯次)'
  type: multiple_choice
  options:
  - '0'
  - '0.42'
  - '0.84'
  - '1'
  correct_index: 3
  explanation: A 與 B 各占 50% 時，二元 Gini impurity 為 1 - (0.5^2 + 0.5^2) = 0.5；若題目採正規化吉尼不純度，二元情況最大值 0.5 會被正規化為 1。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch3
  usage: mock
