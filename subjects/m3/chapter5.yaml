  - type: code
    language: python
    code: "import hashlib\n\ndef hash_email(email):\n    return hashlib.sha256(email.lower().encode()).hexdigest()\n\ndf[\"email_hash\"] = df[\"email\"].apply(hash_email)\ndf = df.drop(columns=[\"email\"])"
  type: multiple_choice
  options:
