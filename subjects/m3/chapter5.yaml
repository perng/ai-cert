  - 把 email 加密後仍可直接還原
  - 讓模型一定更準確
  - 刪除所有重複顧客
  correct_index: 0
  explanation: 雜湊後移除原始 email 可降低直接識別風險，但若無 salt 仍可能受字典攻擊，需視情境補強。
  tags:
  - chap-m3-ch5
  - sec-code-reading
  - code-reading
  usage: quiz
