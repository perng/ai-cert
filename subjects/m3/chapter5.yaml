questions:
- id: 5501
  chapter_title: 大數據治理
  section_title: 資料品質管理
  text: 資料品質維度中的「唯一性 (Uniqueness)」是指？
  type: multiple_choice
  options:
  - 數據中沒有重複的記錄 (Duplicate Records)
  - 數據的格式完全正確且一致
  - 數據是即時更新的 (Real-time)
  - 數據中沒有任何缺失值 (Missing Values)
  correct_index: 0
  explanation: 唯一性確保資料庫中沒有重複的實體（如同一位客戶出現兩次），避免統計錯誤。
  tags:
  - chap-m3-ch5
  - sec-data-quality
  usage: quiz
- id: 5502
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: k-匿名 (k-anonymity) 的主要目標是？
  type: multiple_choice
  options:
  - 透過數據增強 (Data Augmentation) 增加數據量
  - 對所有敏感數據進行高強度加密
  - 永久刪除所有敏感數據
  - 確保每個記錄至少與 k-1 個其他記錄在準標識符 (Quasi-identifiers) 上無法區分
  correct_index: 3
  explanation: 透過泛化（如將年齡改為區間）或隱藏，使得攻擊者無法從一群人中精確指認出特定個體。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: quiz
- id: 5503
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 差分隱私 (Differential Privacy) 中的隱私預算 ε (Epsilon) 越小，代表？
  type: multiple_choice
  options:
  - 隱私計算的速度越快
  - 需要的數據樣本量越大
  - 隱私保護越弱，數據可用性 (Utility) 越高
  - 隱私保護越強，但數據可用性 (Utility) 越低
  correct_index: 3
  explanation: ε 控制了允許洩漏的隱私量。ε 越小，加入的雜訊越大，隱私越安全，但數據分析的精確度也會下降。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: quiz
- id: 5504
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 同態加密 (Homomorphic Encryption) 的核心特性是？
  type: multiple_choice
  options:
  - 不需要使用任何金鑰即可加密
  - 允許在加密數據上直接進行運算，且解密後的結果與在明文上運算的結果一致
  - 加密與解密的速度最快
  - 僅支援文字數據的加密
  correct_index: 1
  explanation: 這被視為隱私計算的聖杯，因為雲端服務商可以在完全「看不懂」數據的情況下幫你算完模型。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: quiz
- id: 5505
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: GDPR 中的「資料最小化 (Data Minimization)」原則是指？
  type: multiple_choice
  options:
  - 使用壓縮演算法以節省儲存空間
  - 完全不蒐集任何個人數據
  - 僅蒐集完成特定目的所需的最少數據 (Minimum Necessary Data)
  - 盡可能蒐集越多數據越好，以備不時之需
  correct_index: 2
  explanation: 企業不應抱著「先存再說」的心態。只拿該拿的，能降低資安風險並符合隱私倫理。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: quiz
- id: 5506
  chapter_title: 大數據治理
  section_title: 資料與 AI 治理架構 (Data & AI Governance Framework)
  text: 「模型卡片 (Model Card)」的主要用途是？
  type: multiple_choice
  options:
  - 儲存模型的權重參數 (Weights)
  - 將模型結構進行視覺化展示
  - 使用專用硬體加速模型訓練
  - 作為模型的「說明書」，記錄訓練數據、適用範圍、限制與偏誤測試結果
  correct_index: 3
  explanation: 這是 AI 透明化的重要實踐，讓使用者清楚知道這個模型的能與不能，以及潛在的偏見。
  tags:
  - chap-m3-ch5
  - sec-governance-framework
  usage: quiz
- id: 5507
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 聯邦學習 (Federated Learning) 如何保護隱私？
  type: multiple_choice
  options:
  - 訓練完成後刪除所有原始數據
  - 使用區塊鏈技術記錄數據交易
  - 數據不出本地 (如手機)，僅上傳加密的模型參數更新 (Model Updates)
  - 將所有原始數據上傳到雲端進行加密儲存
  correct_index: 2
  explanation: 數據保留在用戶設備上，只有數學參數在網路上跑，從物理上隔離了隱私風險。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: quiz
- id: 5508
  chapter_title: 大數據治理
  section_title: 資料品質管理
  text: 資料剖析 (Data Profiling) 的作用是？
  type: multiple_choice
  options:
  - 定期備份所有數據
  - 永久刪除有問題的數據
  - 繪製數據分佈的圖表
  - 自動分析數據的統計特徵 (如分佈、空值率)，以發現潛在的品質問題
  correct_index: 3
  explanation: 在開始分析前，先對數據做「健康檢查」，了解數據的樣貌與缺陷。
  tags:
  - chap-m3-ch5
  - sec-data-quality
  usage: quiz
- id: 5509
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: 靜態數據加密 (Encryption at Rest) 保護的是？
  type: multiple_choice
  options:
  - 正在記憶體中進行運算的數據 (Data in Use)
  - 存儲在磁碟、資料庫或備份媒體中的靜態數據 (Data at Rest)
  - 正在網路上傳輸的數據 (Data in Transit)
  - 顯示在螢幕上的數據 (Data on Screen)
  correct_index: 1
  explanation: 防止硬碟被竊取或資料庫文件被非法複製時導致的數據外洩。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: quiz
- id: 5510
  chapter_title: 大數據治理
  section_title: 資料與 AI 治理架構 (Data & AI Governance Framework)
  text: 資料目錄 (Data Catalog) 的功能是？
  type: multiple_choice
  options:
  - 用於訓練機器學習模型
  - 自動清洗髒數據
  - 用於銷售企業數據資產
  - 盤點數據資產，記錄來源、用途與敏感度，幫助使用者發現與理解數據
  correct_index: 3
  explanation: 就像圖書館的目錄系統，讓企業內部的數據資產可被搜尋、理解與管理。
  tags:
  - chap-m3-ch5
  - sec-governance-framework
  usage: quiz
- id: 5511
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: l-多樣性 (l-diversity) 是為了改進 k-匿名的什麼缺點？
  type: multiple_choice
  options:
  - 無法處理非結構化的文字數據
  - 容易受到同質性攻擊 (Homogeneity Attack)，即同一組內的敏感屬性值都相同
  - k-匿名演算法的計算速度太慢
  - 處理的數據量太大導致記憶體不足
  correct_index: 1
  explanation: 如果一個 k-匿名組裡的 3 個人都患有「癌症」，那攻擊者只要知道目標在這一組，就能確定他有癌症。l-多樣性要求組內敏感屬性必須多樣化。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5512
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: TLS 1.3 協議主要用於？
  type: multiple_choice
  options:
  - 傳輸中加密 (Encryption in Transit)，保護網路通訊過程中的數據安全
  - 對傳輸的檔案進行壓縮以節省頻寬
  - 對儲存在硬碟中的靜態數據進行加密
  - 對資料庫中的特定欄位進行加密
  correct_index: 0
  explanation: 這是 HTTPS 背後的安全協定，防止數據在網路上傳輸時被竊聽或篡改。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: both
- id: 5513
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 全同態加密 (FHE) 目前面臨的主要挑戰是？
  type: multiple_choice
  options:
  - 加密演算法的安全性不足
  - 計算成本極高，運算速度極慢 (High Computational Overhead)
  - 只能在本地端運行，無法支援雲端環境
  - 無法對數字類型的數據進行加密
  correct_index: 1
  explanation: 雖然理論完美，但 FHE 的運算速度比明文慢數千倍甚至百萬倍，限制了其在大規模 AI 訓練中的應用。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5514
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: 「目的限制 (Purpose Limitation)」原則要求？
  type: multiple_choice
  options:
  - 數據必須被永久保存以備查核
  - 所有蒐集到的數據必須對外公開
  - 數據僅能用於蒐集時告知的特定目的，不得隨意進行二次利用 (Secondary Use)
  - 蒐集到的數據可以用於任何商業目的
  correct_index: 2
  explanation: 你為了「送貨」蒐集的地址，不能拿去「寄廣告信」，除非重新取得用戶同意。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: both
- id: 5515
  chapter_title: 大數據治理
  section_title: 資料品質管理
  text: 資料一致性 (Consistency) 檢查是為了？
  type: multiple_choice
  options:
  - 確保不同系統或資料表中的數據邏輯一致，沒有矛盾 (No Contradictions)
  - 確保每筆數據在資料庫中都是唯一的
  - 確保數據中沒有任何缺失值
  - 確保數據的儲存格式正確無誤
  correct_index: 0
  explanation: 避免出現「A 系統說庫存剩 10 個，B 系統說剩 0 個」的情況。
  tags:
  - chap-m3-ch5
  - sec-data-quality
  usage: both
- id: 5516
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 差分隱私透過什麼機制來保護隱私？
  type: multiple_choice
  options:
  - 在查詢結果中加入隨機雜訊 (如拉普拉斯雜訊)，以模糊化個體貢獻
  - 隱藏使用者的 IP 位址
  - 永久刪除所有原始數據
  - 使用高強度的加密演算法加密數據
  correct_index: 0
  explanation: 加入雜訊讓查詢結果變得模糊，使得攻擊者無法區分結果的變化是由於某個特定個體的存在還是隨機波動。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5517
  chapter_title: 大數據治理
  section_title: 資料與 AI 治理架構 (Data & AI Governance Framework)
  text: 資料治理委員會通常由哪些成員組成？
  type: multiple_choice
  options:
  - 僅由法務部門的律師組成
  - 僅由 IT 部門的技術人員組成
  - 跨部門成員，包括法務、資安、IT 與業務主管 (Cross-functional Team)
  - 僅由外部聘請的顧問組成
  correct_index: 2
  explanation: 資料治理涉及法律、技術與業務等多個層面，必須跨部門協作才能制定有效的政策。
  tags:
  - chap-m3-ch5
  - sec-governance-framework
  usage: both
- id: 5518
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: 「被遺忘權 (Right to be Forgotten)」賦予使用者什麼權利？
  type: multiple_choice
  options:
  - 要求企業完整備份其所有個人數據
  - 要求企業修改其錯誤的個人數據
  - 要求企業公開其所有個人數據
  - 要求企業刪除其不再需要的個人數據 (Right to Erasure)
  correct_index: 3
  explanation: 當數據不再需要或使用者撤回同意時，使用者有權要求企業徹底刪除其個資。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: both
- id: 5519
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 部分同態加密 (PHE) 通常支持哪種運算？
  type: multiple_choice
  options:
  - 僅支援數值比較運算
  - 僅支援邏輯運算 (如 AND, OR)
  - 支援任意類型的數學運算
  - 僅支援單一類型的運算 (如僅加法或僅乘法)
  correct_index: 3
  explanation: 例如 Paillier 算法支持加法同態，雖然功能有限，但效率比全同態加密高很多，適合特定場景（如電子投票計票）。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5520
  chapter_title: 大數據治理
  section_title: 資料品質管理
  text: 資料及時性 (Timeliness) 是指？
  type: multiple_choice
  options:
  - 數據是否即時更新，能夠反映當前最新的狀態 (Up-to-date)
  - 數據的儲存量非常大
  - 數據的格式是否正確無誤
  - 數據中是否完全沒有錯誤
  correct_index: 0
  explanation: 過期的數據（如昨天的股價）對於即時決策（如高頻交易）是沒有價值的。
  tags:
  - chap-m3-ch5
  - sec-data-quality
  usage: both
- id: 5521
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: t-接近性 (t-closeness) 要求？
  type: multiple_choice
  options:
  - 對數據進行 t 次加密運算
  - 數據必須保留至少 t 年
  - 每個等價類中敏感屬性的分佈與整體數據集的分佈之間的距離小於閾值 t
  - 每個匿名組內必須包含至少 t 個記錄
  correct_index: 2
  explanation: 這是比 l-多樣性更嚴格的標準，防止攻擊者透過分佈差異（如某組人患病率高達 90%，遠高於平均）推斷隱私。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5522
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: AI 訓練資料的合法取得依據不包括？
  type: multiple_choice
  options:
  - 網路上隨意抓取且未經授權的個人資料
  - 取得使用者的明確同意 (Consent)
  - 符合公共利益且經去識別化的學術研究
  - 履行契約所必要 (Contractual Necessity)
  correct_index: 0
  explanation: 網路公開不代表可以隨意使用。未經同意抓取個資用於商業模型訓練可能違反個資法。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: both
- id: 5523
  chapter_title: 大數據治理
  section_title: 資料與 AI 治理架構 (Data & AI Governance Framework)
  text: 敏感資料偵測工具的主要功能是？
  type: multiple_choice
  options:
  - 自動掃描並標記 PII (個人識別資訊)，如身分證號、信用卡號
  - 對所有數據進行加密處理
  - 永久刪除所有敏感數據
  - 使用壓縮演算法壓縮數據
  correct_index: 0
  explanation: 防止敏感數據（如身分證號、信用卡號）意外洩漏或未經加密存儲。
  tags:
  - chap-m3-ch5
  - sec-governance-framework
  usage: both
- id: 5524
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 差分隱私中的「相鄰資料集」是指？
  type: multiple_choice
  options:
  - 兩個來源完全相同的資料集
  - 兩個資料集之間只差一筆資料 (One Record Difference)
  - 兩個大小完全相同的資料集
  - 兩個完全不相關的資料集
  correct_index: 1
  explanation: 差分隱私的定義基礎：即使你的資料被加入（或移除），查詢結果的機率分佈幾乎不變。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5525
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: 資料血緣 (Data Lineage) 在合規中的作用是？
  type: multiple_choice
  options:
  - 追蹤數據來源與流向，確保可追溯性與合規性 (Traceability)
  - 自動提高數據的品質
  - 節省資料庫的儲存空間
  - 加速資料庫的查詢速度
  correct_index: 0
  explanation: 當監管機構查核時，能證明數據是從合法來源取得，並經過了正確的處理流程。
  tags:
  - chap-m3-ch5
  - sec-compliance
  usage: both
- id: 5526
  chapter_title: 大數據治理
  section_title: 資料品質管理
  text: 資料清洗 (Data Cleansing) 通常不包括？
  type: multiple_choice
  options:
  - 填補缺失值 (Missing Values)
  - 隨意修改數據以符合預期結果
  - 刪除重複的記錄 (Duplicate Records)
  - 修正錯誤的數據格式或數值
  correct_index: 1
  explanation: 清洗是為了還原真實，而不是造假。隨意修改會破壞數據的真實性。
  tags:
  - chap-m3-ch5
  - sec-data-quality
  usage: both
- id: 5527
  chapter_title: 大數據治理
  section_title: 隱私保護
  text: 安全多方計算 (MPC) 允許？
  type: multiple_choice
  options:
  - 將所有數據公開共享給所有人
  - 多個機構聯合分析數據，而不洩露各自的原始數據 (Privacy-Preserving Computation)
  - 停止進行任何數據計算
  - 將所有數據集中存儲在單一伺服器
  correct_index: 1
  explanation: MPC 讓多方（如多家銀行）能共同計算一個結果（如聯防詐欺黑名單），但誰也看不到對方的具體客戶資料。
  tags:
  - chap-m3-ch5
  - sec-privacy
  usage: both
- id: 5528
  chapter_title: 大數據治理
  section_title: 合規與安全 (Compliance & Security)
  text: AES-256 是一種？
  type: multiple_choice
  options:
  - 對稱加密演算法 (Symmetric Encryption)，常用於靜態數據加密
  - 非對稱加密演算法 (Asymmetric Encryption)
  - 數據壓縮演算法 (Compression Algorithm)
  - 雜湊演算法 (Hashing Algorithm)
  correct_index: 0
