- id: 5541
  chapter_title: 大數據治理
  section_title: 深度思考情境題
  text: 情境：你是一家醫院的資料科學家，想與另一家醫院合作訓練疾病預測模型，但雙方都受限於法規不能交換病歷資料。你應該建議採用什麼技術？
  type: multiple_choice
  options:
  - 放棄合作計畫
  - k-匿名 (k-anonymity)
  - 聯邦學習 (Federated Learning)，讓數據留在本地訓練
  - 差分隱私 (Differential Privacy)
  correct_index: 2
  explanation: 這是聯邦學習最經典的應用場景。資料不動模型動，雙方既能合作提升模型準確度，又能確保病歷不出自家大門。
  tags:
  - chap-m3-ch5
  - sec-scenario
  usage: mock
- id: 5542
  chapter_title: 大數據治理
  section_title: 深度思考情境題
  text: 情境：公司決定發布一份匿名的用戶行為數據集供學術研究。你使用了 k-匿名技術，但發現某個分組裡的所有用戶都購買了同一種敏感商品。這存在什麼風險？應如何改進？
  type: multiple_choice
  options:
  - 重識別風險；應增加 k 值
  - 同質性攻擊風險 (Homogeneity Attack)；應進一步採用 l-多樣性 (l-diversity) 或 t-接近性 (t-closeness)
  - 沒有任何風險，數據是安全的
  - 背景知識攻擊風險；應立即刪除數據
  correct_index: 1
  explanation: k-匿名無法防止屬性洩漏。如果某個 k=3 的組裡三個人都買了「威而鋼」，那攻擊者只要知道目標在這一組，就知道他買了什麼。l-多樣性強制組內敏感屬性必須多樣化。
  tags:
  - chap-m3-ch5
  - sec-scenario
  usage: mock
- id: 5543
  chapter_title: 大數據治理
  section_title: 深度思考情境題
  text: 情境：行銷部門要求你提供客戶名單進行精準行銷，但該名單當初蒐集時的使用條款僅註明「用於改善服務品質」。你應該如何處理？
  type: multiple_choice
  options:
  - 將名單匿名發布到網路上
  - 將名單加密後提供
  - 直接提供名單給行銷部門
  - 拒絕提供，因為違反「目的限制 (Purpose Limitation)」原則。需重新取得用戶同意或進行去識別化處理
  correct_index: 3
  explanation: 目的不符是常見的合規地雷。當初說做 A，現在拿去做 B，必須重新獲得授權，否則就是違法。
  tags:
  - chap-m3-ch5
  - sec-scenario
  usage: mock
- id: 5544
  chapter_title: 大數據治理
  section_title: 深度思考情境題
  text: 情境：你正在設計一個需要高隱私保護的統計查詢系統。為了防止差分攻擊，你決定引入差分隱私。當你將隱私預算 (epsilon) 設定得非常小時，會發生什麼事？
  type: multiple_choice
  options:
  - 系統崩潰無法運作
  - 計算速度顯著變快
  - 查詢結果充滿雜訊，可用性 (Utility) 大幅降低，但隱私保護極強
  - 查詢結果非常精確，但隱私保護較弱
  correct_index: 2
  explanation: 隱私與可用性是蹺蹺板。epsilon 小意味著雜訊大，雖然保護了隱私，但統計結果可能歪到無法使用（例如統計人數是負的）。需要尋找平衡點。
  tags:
  - chap-m3-ch5
  - sec-scenario
  usage: mock
- id: 5545
  chapter_title: 大數據治理
  section_title: 深度思考情境題
  text: 情境：公司計畫將核心業務數據上傳至公有雲進行 AI 分析，但資安長擔心雲端供應商會偷看數據。哪種技術能從根本上消除這個疑慮？
  type: multiple_choice
  options:
  - 簽署保密協定 (NDA)
  - 全同態加密 (FHE)，允許在密文上直接運算
  - 靜態數據加密 (AES)
  - 傳輸中加密 (TLS/SSL)
  correct_index: 1
  explanation: 傳統加密在運算時必須解密（明文暴露在記憶體中）。全同態加密允許雲端直接對密文進行運算，雲端供應商從頭到尾都看不到明文，實現了「可用不可見」。
  tags:
  - chap-m3-ch5
  - sec-scenario
  usage: mock
- chapter_title: 大數據治理
