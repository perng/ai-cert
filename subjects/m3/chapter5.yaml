- id: 5534
  chapter_title: 大數據治理
  section_title: 合規與安全
  text: 雜湊 (Hashing) 與加密的主要區別是？
  type: multiple_choice
  options:
  - 雜湊是可逆的，加密是不可逆的
  - 兩者的功能與原理完全相同
  - 雜湊的運算速度比加密慢很多
