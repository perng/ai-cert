  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：Redis 常被用於購物車或 Session 管理，是因為它具備什麼特性？
  type: multiple_choice
  options:
  - 因為它的儲存成本是所有資料庫中最低的
  - 因為它支援複雜的 SQL 查詢語法
  - 因為它完整支援 ACID 事務特性
  - 因為它是基於記憶體的鍵值對存儲，讀寫速度極快 (Microseconds Latency)
  correct_index: 3
  explanation: Redis 將數據存在記憶體中，提供微秒級的讀寫速度，非常適合需要高頻存取的臨時性數據（如 Session）。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
