  section_title: 分散式運算框架
  text: 情境：Spark SQL 的 Catalyst 優化器的作用是？
  type: multiple_choice
  options:
  - 自動生成複雜的 SQL 查詢語句
  - 優化查詢計畫 (Query Plan) 以提升執行效率，如謂詞下推 (Predicate Pushdown)
  - 自動管理記憶體分配與回收
  - 自動壓縮數據以節省儲存空間
  correct_index: 1
  explanation: Catalyst 會自動分析 SQL 語句，生成最佳化的邏輯與物理執行計畫，例如謂詞下推 (Predicate Pushdown) 等。
