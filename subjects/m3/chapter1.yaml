- id: 114-2-007
  chapter_title: 大數據生態系統
  section_title: 歷屆考題
  text: '在資料庫的 ACID 特性中，下列何者為「原子性（Atomicity）」的正確定義？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 所有資料欄位必須為相同型別
  - 每次交易需以批次方式執行
  - 交易不可分割，需完全成功或完全失敗
  - 系統會自動同步交易資料至所有節點
  correct_index: 2
  explanation: ACID 的 Atomicity 指交易是不可分割的單位，所有操作必須全部成功或全部失敗；若只完成部分操作，系統應回復到交易前狀態。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch1
  usage: mock
- id: 114-2-018
  chapter_title: 大數據生態系統
  section_title: 歷屆考題
  text: '某人工智慧團隊使用分散式資料庫（Distributed Database）儲存模型訓練資料，並在更新訓練樣本時啟用多節點交易。若其中一個節點在交易過程中發生錯誤，但系統仍確保整體資料不會出現部分更新、最終狀態維持一致，下列何者最能說明此現象？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 系統透過原子性（Atomicity）確保交易必須全部成功或全部回復（Rollback）
  - 系統透過一致性（Consistency）確保交易完成後資料符合完整性規則
  - 系統透過隔離性（Isolation）避免多筆交易同時存取或修改相同資料
  - 系統透過持久性（Durability）確保交易一旦提交，其結果將永久保留於資料庫中
  correct_index: 0
  explanation: 節點出錯時仍保證多節點交易不是部分更新，而是全部成功或回復，這正是 Atomicity 的 all-or-nothing 行為。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch1
  usage: mock
- id: 114-2-024
  chapter_title: 大數據生態系統
  section_title: 歷屆考題
  text: '某企業建置生成式 AI 系統，利用大量客服紀錄與產品評論資料訓練語言模型，以自動生成客服回覆與知識摘要。由於資料來源多樣，且包含非結構化文字、影像與表格資訊，團隊希望在不降低模型效能的前提下，提升資料處理效率與一致性，下列哪一種資料處理策略最適合？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 建立資料湖（Data Lake）結構，並以 Apache Spark 或 Ray 進行分散式資料預處理與特徵抽取，再串接至模型訓練管線（Pipeline）
  - 採用單節點高效能伺服器搭配批次處理模式，集中執行資料清理與格式轉換
  - 將所有文字資料轉換為向量，並以資料庫索引方式直接餵入語言模型訓練
  - 使用生成式模型先行自動清理資料內容，再將結果輸入至下游訓練流程
  correct_index: 0
  explanation: 多來源且含文字、影像、表格的資料適合先進資料湖保存原始多型態資料，再用 Spark 或 Ray 做分散式預處理與特徵抽取，最後接入訓練管線以維持效率與一致性。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch1
  usage: mock
