- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：HDFS 中的 NameNode 突然故障，導致整個叢集無法讀寫文件。這顯示了 HDFS 架構的什麼弱點？
  type: multiple_choice
  options:
  - 單點故障 (Single Point of Failure)，缺乏高可用性設計
  - 存儲空間不足，無法寫入新數據
  - 計算速度太慢，無法滿足即時需求
  - 數據冗餘過多，導致儲存空間浪費
  correct_index: 0
  explanation: NameNode 是 HDFS 的大腦，管理所有元數據。若無高可用 (HA) 配置，NameNode 宕機將導致整個文件系統癱瘓。
