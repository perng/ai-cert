  section_title: 分散式運算框架
  text: 情境：Spark 程式執行時，發現某個 Transformation 操作（如 map）遲遲沒有執行。這可能是因為？
  type: multiple_choice
  options:
  - 這是 Spark 的惰性求值 (Lazy Evaluation) 機制，等待 Action 觸發
  - 可能是程式邏輯寫錯，導致無限迴圈
  - 可能是系統當機，導致無法回應
  - 可能是記憶體不足，導致無法執行
  correct_index: 0
  explanation: Spark 的 Transformation 是惰性的，只有遇到 Action 操作（如 count, collect）時才會真正觸發計算。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  id: 5151
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：為了優化大數據查詢效能，你決定將 CSV 格式的數據轉換為 Parquet。Parquet 的主要優勢在於？
  type: multiple_choice
  options:
  - 完全不支援 Schema 定義
  - 採用行式儲存 (Row-based)，寫入速度快但查詢較慢
  - 採用純文字格式，人類可直接閱讀
  - 採用列式儲存 (Columnar)，支援高效壓縮與只讀取需要的欄位 (Column Pruning)
  correct_index: 3
  explanation: Parquet 是列式儲存格式，對於 OLAP 查詢（通常只查特定幾欄）能大幅減少 I/O，且壓縮率高。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  id: 5152
  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：YARN 在 Hadoop 生態系中的角色類似於作業系統的什麼功能？
  type: multiple_choice
  options:
  - 類似於作業系統中的檔案系統 (File System)
  - 類似於作業系統中的網頁瀏覽器 (Browser)
  - 類似於作業系統核心 (Kernel) 的資源調度器，管理 CPU 與記憶體
  - 類似於作業系統的圖形使用者介面 (GUI)
  correct_index: 2
  explanation: YARN (Yet Another Resource Negotiator) 負責管理叢集的 CPU 與記憶體資源，並將其分配給不同的應用程式，就像 OS 的資源調度。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  id: 5153
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：銀行轉帳系統要求絕對的數據準確性，A 轉帳給 B，A 扣款與 B 入帳必須同時成功或同時失敗。這依賴於資料庫的什麼特性？
  type: multiple_choice
  options:
  - 依賴 NoSQL 資料庫的高擴展性
  - 依賴 CAP 定理的可用性優先
  - 依賴 ACID 事務原則，特別是原子性 (Atomicity)
  - 依賴 BASE 模型的最終一致性
  correct_index: 2
  explanation: ACID 中的 Atomicity (原子性) 確保交易是不可分割的最小單位，保障了金融交易的安全性。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  id: 5154
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：你需要構建一個社交網絡應用，功能包含「查詢某人的朋友的朋友」。哪種資料庫最能高效處理這種查詢？
  type: multiple_choice
  options:
  - 簡單的鍵值對資料庫 (Key-Value Store)
  - 傳統的關聯式資料庫 (RDBMS)，使用 Join 查詢
  - 專門處理關係網絡的圖形資料庫 (Graph Database)，如 Neo4j
  - 儲存 JSON 的文件型資料庫 (Document Store)
  correct_index: 2
  explanation: 圖形資料庫（如 Neo4j）專為處理節點間的複雜關係而設計，查詢多層次關係（朋友的朋友）的效率遠高於關聯式資料庫的 Join 操作。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  id: 5155
  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：MapReduce 任務執行緩慢，經分析發現是因為大量的磁碟 I/O 讀寫。若要改善此問題，應遷移到哪個框架？
  type: multiple_choice
  options:
  - 遷移到 MySQL，利用關聯式資料庫的穩定性
  - 遷移到 Apache HBase，利用隨機讀寫能力
  - 遷移到 Apache Spark，利用記憶體內運算減少 I/O
  - 遷移到 Apache Hive，利用 SQL 簡化開發
  correct_index: 2
  explanation: Spark 利用記憶體內運算 (In-Memory Computing) 減少了中間結果寫入磁碟的次數，從而大幅提升效能。
