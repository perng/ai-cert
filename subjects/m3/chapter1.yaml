- id: 5141
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你的公司需要建立一個即時戰情室，顯示全台 1000 家門市的即時銷售額。數據源是 Kafka 串流。你會選擇哪種儲存與查詢方案？
  type: multiple_choice
  options:
  - 將數據寫入 HDFS，用 Hive 查詢。
  - 將數據寫入 Redis 或 HBase，並結合 Spark Streaming 進行即時聚合。
  - 將數據寫入 MySQL。
  - 將數據寫入 CSV 文件。
  correct_index: 1
  explanation: HDFS/Hive 延遲太高，不適合即時戰情室。MySQL 難以承受高併發寫入。Redis/HBase 具備高吞吐與低延遲特性，配合 Spark Streaming 可實現秒級的即時分析與展示。
  tags:
  - chap-m3-ch1
  - sec-scenario
- id: 5142
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你需要分析過去 10 年的銷售數據（約 100TB），主要進行依據地區和產品類別的聚合查詢 (Group By)。你會選擇哪種檔案格式存儲這些數據？
  type: multiple_choice
  options:
  - CSV；因為通用。
  - JSON；因為靈活。
  - Parquet；因為它是列式儲存，非常適合 OLAP 聚合查詢，且壓縮率高。
  - Avro；因為寫入快。
  correct_index: 2
  explanation: 對於分析型查詢（讀取少數欄位，掃描大量行），列式儲存 (Parquet) 遠優於行式儲存 (CSV, JSON, Avro)。它能跳過不相關的欄位，大幅減少 I/O。
  tags:
  - chap-m3-ch1
  - sec-scenario
- id: 5143
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你的銀行核心交易系統需要升級資料庫。業務要求絕對的數據一致性，不能有任何差錯。你應該選擇？
  type: multiple_choice
  options:
  - MongoDB (NoSQL)。
  - Cassandra (AP 系統)。
  - 支援 ACID 的關聯式資料庫 (RDBMS) 或 CP 型的分散式資料庫。
  - Redis。
  correct_index: 2
  explanation: 金融交易對一致性要求極高（錢不能憑空消失）。必須選擇支援 ACID 事務的資料庫，AP 系統的最終一致性在此場景下是不可接受的。
  tags:
  - chap-m3-ch1
  - sec-scenario
- id: 5144
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：資料科學團隊抱怨從資料倉儲取數據太慢且格式受限，無法進行探索性分析。作為資料架構師，你建議引入什麼架構？
  type: multiple_choice
  options:
  - 刪除資料倉儲。
  - 建立資料湖 (Data Lake)，讓他們能直接存取原始數據 (Raw Data)，並使用 Spark 等工具進行靈活分析。
  - 限制他們的使用權限。
  - 叫他們用 Excel。
  correct_index: 1
  explanation: 資料湖補足了資料倉儲的靈活性不足。它保留了數據的原始細節，適合資料科學家進行特徵工程、機器學習等探索性工作。
  tags:
  - chap-m3-ch1
  - sec-scenario
- id: 5145
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你的 Spark 任務執行非常慢，檢查後發現大量時間花在 Shuffle 階段。這通常意味著什麼？
  type: multiple_choice
  options:
  - 數據量太小。
  - 寬依賴 (Wide Dependency) 操作 (如 groupByKey, reduceByKey) 導致了大量的跨節點數據傳輸。應嘗試優化算法或增加分區。
  - CPU 太快。
  - 記憶體太大。
  correct_index: 1
  explanation: Shuffle 是分散式運算的效能瓶頸，涉及網路傳輸與磁碟 I/O。優化 Spark 任務的關鍵往往在於減少 Shuffle 的數據量（例如使用 map-side combine）。
  tags:
  - chap-m3-ch1
  - sec-scenario
