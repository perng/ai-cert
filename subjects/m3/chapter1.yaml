  - 圖形 (Graph) 資料庫
  - 列式 (Column-family) 資料庫
  - 鍵值對 (Key-Value) 資料庫
  correct_index: 0
  explanation: MongoDB 儲存 BSON (Binary JSON) 格式的文件，結構靈活，適合內容管理等欄位變動頻繁的應用。
