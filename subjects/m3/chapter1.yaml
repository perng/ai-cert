  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：根據 CAP 定理，分散式系統在發生網路分區 (Partition) 時，必須在哪兩者之間做取捨？
  type: multiple_choice
  options:
  - 必須在數據的一致性 (Consistency) 與系統的可用性 (Availability) 之間做出取捨
  - 必須在系統的運算速度 (Speed) 與建置成本 (Cost) 之間做出取捨
  - 必須在硬體設備 (Hardware) 與軟體授權 (Software) 之間做出取捨
  - 必須在資訊安全性 (Security) 與用戶隱私 (Privacy) 之間做出取捨
  correct_index: 0
  explanation: 當 P 發生時，系統無法同時保證所有節點數據即時一致 (C) 且所有請求都能成功回應 (A)。
