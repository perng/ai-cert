- id: 5141
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你的公司需要建立一個即時戰情室，顯示全台 1000 家門市的即時銷售額。數據源是 Kafka 串流。你會選擇哪種儲存與查詢方案？
  type: multiple_choice
  options:
  - 將數據寫入 CSV 文字文件，並使用 Excel 進行分析
  - 將數據寫入 Redis 或 HBase，並結合 Spark Streaming 進行即時聚合與展示
  - 將數據寫入 MySQL 關聯式資料庫，並使用 SQL 進行查詢
  - 將數據寫入 HDFS 分散式檔案系統，並使用 Hive 進行離線查詢分析
  correct_index: 1
  explanation: HDFS/Hive 延遲太高，不適合即時戰情室。MySQL 難以承受高併發寫入。Redis/HBase 具備高吞吐與低延遲特性，配合 Spark Streaming 可實現秒級的即時分析與展示。
  tags:
  - chap-m3-ch1
  - sec-scenario
  usage: mock
- id: 5142
  chapter_title: 大數據生態系統
  section_title: 深度思考情境題
  text: 情境：你需要分析過去 10 年的銷售數據（約 100TB），主要進行依據地區和產品類別的聚合查詢 (Group By)。你會選擇哪種檔案格式存儲這些數據？
  type: multiple_choice
  options:
  - 選擇 Avro 格式；因為它寫入速度快且支援 Schema Evolution
  - 選擇 CSV 格式；因為它最通用且易於閱讀
  - 選擇 Parquet 格式；因為它是列式儲存，非常適合 OLAP 聚合查詢，且壓縮率高
  - 選擇 JSON 格式；因為它結構靈活且易於解析
  correct_index: 2
  explanation: 對於分析型查詢（讀取少數欄位，掃描大量行），列式儲存 (Parquet) 遠優於行式儲存 (CSV, JSON, Avro)。它能跳過不相關的欄位，大幅減少 I/O。
