- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：你需要設計一個全球分散式資料庫系統，要求在任何網路分區故障時，系統仍能回應客戶請求（高可用性），但允許短暫的數據不一致。根據 CAP 定理，你應選擇哪類資料庫？
  type: multiple_choice
  options:
  - 選擇 ACID 事務系統，保證嚴格的交易特性
  - 選擇 AP 系統，優先保證可用性與分區容錯性，接受最終一致性
  - 選擇 CP 系統，優先保證一致性與分區容錯性
  - 選擇 CA 系統，優先保證一致性與可用性，但不容忍分區
  correct_index: 1
  explanation: AP 系統（如 Cassandra）優先保證可用性與分區容錯性，接受最終一致性 (Eventual Consistency)，適合對即時性要求高但對一致性要求稍低的場景。
