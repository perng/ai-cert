  text: 某電信公司導入生成式AI客服系統,利用過去對話紀錄與用戶行為資料訓練語言模型,在資料治理與合規審查過程中,團隊發現模型可能會在回答中生成包含真實姓名、電話或交易資訊的內容。為確保系統符合個資法及生成式AI的安全與隱私要求,下列哪一項作法最符合實務可行及法規原則? (114年第二梯次)
  type: multiple_choice
  options:
  - 在訓練資料前進行資料匿名化(Anonymization)或偽匿名化(Pseudonymization)處理,並建立輸出內容稽核機制
  - 改以強化學習(Reinforcement Learning)微調模型,使模型學習避免產出真實資訊
  - 採用同態加密(Homomorphic Encryption)以加密所有文字輸入,確保模型無法辨識任何個資
  - 僅設定模型回覆時不顯示用戶姓名,即可視為隱私防護完成
  correct_index: 0
  explanation: 資料匿名化 (Anonymization) 是保護個資的常見合規手段，確保輸出內容不含可識別個人資訊。
  tags:
  - sec-past-exam
  - chap-m3-ch1
  usage: mock
- id: '5217_1'
  chapter_title: 大數據生態系統
  text: 某金融機構的量化分析師在建立資產風險評估模型時,發現報酬率資料分佈明顯非對稱,且出現多次極端損失事件,使得傳統假設常態分佈的模型無法準確反映真實風險。若希望在不依賴常態分佈假設的前提下,採取更能捕捉資料極端情況的建模策略,下列哪一種方法最為合適? (114年第二梯次)
  type: multiple_choice
  options:
  - 採用線性迴歸模型(Linear Regression Model),以常態分佈殘差(Residuals)為基礎進行推估
  - 使用平均數(Mean)與標準差(Standard Deviation)估計波動範圍
  - 將資料裁剪至±3σ 範圍內以排除異常值影響
  - 採用分位數回歸模型(Quantile Regression Model),聚焦於尾部分位(Tail Quantiles)以評估極端風險
  correct_index: 3
  explanation: 分位數回歸 (Quantile Regression) 能針對分佈的尾端 (如 95% 或 99% 分位數) 進行建模，適合評估極端風險。
