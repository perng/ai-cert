- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：在分散式系統中，若要保證強一致性 (CP)，當網路分區發生時，系統必須？
  type: multiple_choice
  options:
  - 暫停部分服務 (犧牲可用性) 以避免數據不一致，確保強一致性
  - 自動刪除所有不一致的數據
  - 隨機回應客戶端的請求
  - 繼續服務所有讀寫請求，即使數據可能不一致
  correct_index: 0
  explanation: 為了保證一致性，當無法同步數據時，系統必須拒絕寫入請求（犧牲可用性），直到網路恢復。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  id: 5163
  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：RDD 的「彈性 (Resilient)」是指？
  type: multiple_choice
  options:
  - 支援多種程式語言開發
  - 透過 Lineage (血統) 機制，在節點故障時能自動重新計算丟失的分區，實現容錯
  - 支援雲端彈性付費模式
  - RDD 的大小可以隨意動態伸縮
  correct_index: 1
  explanation: RDD 記錄了數據是如何轉換而來的 (Lineage)。若某部分數據丟失，Spark 可根據 Lineage 重新計算該部分，而無需從頭開始。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  id: 5164
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：企業希望整合結構化報表數據與非結構化日誌數據，並提供統一的查詢介面。這種架構趨勢稱為？
  type: multiple_choice
  options:
  - 傳統的關聯式資料庫 (Database)
  - 結合資料湖與資料倉儲優點的資料湖倉 (Data Lakehouse)
  - 分散式檔案系統 (File System)
  - 去中心化的區塊鏈技術 (Blockchain)
  correct_index: 1
  explanation: Data Lakehouse 結合了資料湖的靈活性（存儲原始數據）與資料倉儲的管理性（ACID、Schema），是新一代的數據架構。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  id: 5165
  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：Spark 相比於 Hadoop MapReduce 的最大優勢在於？
  type: multiple_choice
  options:
  - 提供了圖形化介面，使用者完全不需要撰寫任何程式碼
  - 採用記憶體內運算 (In-Memory Computing) 架構，運算速度可比 MapReduce 快上百倍
  - 因為它是完全免費的開源軟體，沒有任何商業支援成本
  - 只能處理 GB 等級的小數據，不適合 PB 級大數據
  correct_index: 1
  explanation: Spark 減少了中間結果寫入磁碟的 I/O 開銷，大幅提升迭代運算效率。
