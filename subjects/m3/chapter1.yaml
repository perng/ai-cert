  section_title: 儲存解決方案
  text: 情境：資料湖 (Data Lake) 與資料倉儲 (Data Warehouse) 的主要區別在於？
  type: multiple_choice
  options:
  - 資料倉儲儲存原始數據，資料湖儲存結構化數據
