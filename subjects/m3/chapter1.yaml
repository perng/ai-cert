  - chap-m3-ch1
  - sec-distributed-computing
  id: 5156
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：Avro 格式通常用於 Kafka 消息傳輸，主要原因是？
  type: multiple_choice
  options:
  - 因為它是純文字格式，易於除錯
  - 因為它是列式儲存，適合分析查詢
  - 因為它是行式儲存且 Schema 隨數據發送，支援 Schema Evolution (模式演化)
  - 因為它不支援壓縮，傳輸速度快
  correct_index: 2
  explanation: Avro 是行式二進位格式，且支援 Schema Evolution（模式演化），這對於長期運行的數據流系統（如 Kafka）至關重要，允許生產者和消費者獨立升級。
  tags:
  - chap-m3-ch1
