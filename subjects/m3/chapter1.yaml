- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：資料倉儲 (Data Warehouse) 與資料湖 (Data Lake) 的核心區別之一是 Schema 的定義時機。資料倉儲是？
  type: multiple_choice
  options:
  - Schema-on-Read (讀取時定義)
  - Dynamic Schema
  - No Schema
  - Schema-on-Write (寫入時定義)
  correct_index: 3
  explanation: 資料倉儲要求數據在寫入前必須經過清洗和轉換以符合預定義的 Schema (ETL)，確保數據品質與一致性。
