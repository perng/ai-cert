  id: 5153
  usage: both
- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：銀行轉帳系統要求絕對的數據準確性，A 轉帳給 B，A 扣款與 B 入帳必須同時成功或同時失敗。這依賴於資料庫的什麼特性？
  type: multiple_choice
  options:
  - 依賴 NoSQL 資料庫的高擴展性
  - 依賴 CAP 定理的可用性優先
  - 依賴 ACID 事務原則，特別是原子性 (Atomicity)
  - 依賴 BASE 模型的最終一致性
  correct_index: 2
  explanation: ACID 中的 Atomicity (原子性) 確保交易是不可分割的最小單位，保障了金融交易的安全性。
