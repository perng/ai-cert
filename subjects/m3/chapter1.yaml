  - 因為它完整支援 ACID 事務特性
  - 因為它是基於記憶體的鍵值對存儲，讀寫速度極快 (Microseconds Latency)
  correct_index: 3
  explanation: Redis 將數據存在記憶體中，提供微秒級的讀寫速度，非常適合需要高頻存取的臨時性數據（如 Session）。
