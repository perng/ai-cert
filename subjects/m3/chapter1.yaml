- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：HDFS 將檔案切分為 Block 並複製 3 份，這主要是為了？
  type: multiple_choice
  options:
  - 為了節省硬碟儲存空間
  - 為了提高並行運算的速度
  - 為了提供容錯 (Fault Tolerance) 與數據可靠性，防止節點故障導致數據丟失
  - 為了方便進行數據加密與解密
  correct_index: 2
  explanation: 複製機制確保即使某個節點硬體損壞，數據仍可從其他節點讀取，保證了系統的高可靠性。
