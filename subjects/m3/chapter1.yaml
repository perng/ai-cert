  - 限制他們的使用權限，禁止進行探索性分析
  - 建議刪除現有的資料倉儲，改用手動報表
  correct_index: 1
  explanation: 資料湖補足了資料倉儲的靈活性不足。它保留了數據的原始細節，適合資料科學家進行特徵工程、機器學習等探索性工作。
  tags:
  - chap-m3-ch1
  - sec-scenario
  usage: both
- id: 5145
  chapter_title: 大數據生態系統
  section_title: 情境題
  text: 情境：你的 Spark 任務執行非常慢，檢查後發現大量時間花在 Shuffle 階段。這通常意味著什麼？
  type: multiple_choice
  options:
  - 可能是因為 CPU 運算速度太快，導致 I/O 跟不上
  - 寬依賴 (Wide Dependency) 操作 (如 groupByKey) 導致大量跨節點數據傳輸 (Shuffle)，應優化算法
  - 可能是因為分配的記憶體太大，導致 GC 頻繁
  - 可能是因為數據量太小，導致系統空轉
  correct_index: 1
  explanation: Shuffle 是分散式運算的效能瓶頸，涉及網路傳輸與磁碟 I/O。優化 Spark 任務的關鍵往往在於減少 Shuffle 的數據量（例如使用 map-side combine）。
  tags:
  - chap-m3-ch1
  - sec-scenario
  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：某電商平台需要在「雙11」期間即時分析每秒數百萬筆的交易數據，以動態調整促銷策略。應優先選擇哪個運算框架？
