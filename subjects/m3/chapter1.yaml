questions:
- id: 5101
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Hadoop 的核心組件中，負責資源管理和調度的是？
  type: multiple_choice
  options:
  - MapReduce，主要負責分散式平行運算處理
  - YARN (Yet Another Resource Negotiator)，負責叢集資源管理與任務調度
  - Apache Spark，新一代記憶體內運算框架，非 Hadoop 核心組件
  - HDFS (Hadoop Distributed File System)，主要負責分散式檔案儲存
  correct_index: 1
  explanation: YARN 是 Hadoop 2.0 引入的資源管理層，負責將叢集資源（CPU, Memory）分配給各種應用程式。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: quiz
- id: 5102
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: HDFS (Hadoop Distributed File System) 如何保證數據的可靠性？
  type: multiple_choice
  options:
  - 使用硬體級別的 RAID 磁碟陣列技術來防止單顆硬碟損壞
  - 將數據塊 (Blocks) 複製多份 (預設 3 份) 並存儲在不同的節點上，以容忍節點故障
  - 使用高強度的 AES-256 加密技術來保護數據不被竊取
  - 定期將所有數據備份到外部磁帶庫 (Tape Library) 進行冷儲存
  correct_index: 1
  explanation: HDFS 的設計初衷是在廉價硬體上運行，因此透過軟體層面的多副本機制來容忍硬體故障。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: quiz
- id: 5103
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Spark 相比於 Hadoop MapReduce 的主要優勢是？
  type: multiple_choice
  options:
  - 原生支援超過 50 種以上的程式語言進行開發
  - 建置與維護成本比 Hadoop MapReduce 更低廉且開源免費
  - 擁有比 Hadoop HDFS 更大的單一叢集儲存容量上限
  - 採用記憶體內運算 (In-Memory Computing) 架構，運算速度可比 MapReduce 快 100 倍
  correct_index: 3
  explanation: MapReduce 每次運算都要讀寫磁碟，而 Spark 將中間結果存在記憶體中，大幅減少了 I/O 開銷。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: quiz
- id: 5104
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Spark 中的 RDD (Resilient Distributed Dataset) 特性不包括？
  type: multiple_choice
  options:
  - 具備分散式 (Distributed) 特性，數據被分割並散佈在叢集節點上
  - 具備彈性 (Resilient)，可透過 Lineage 機制從節點錯誤中自動恢復
  - 數據總是強制儲存在硬碟 (Disk) 上以確保持久性，無法使用記憶體
  - 具備不可變性 (Immutable)，一旦創建就不能被修改，只能轉換
  correct_index: 2
  explanation: RDD 優先儲存在記憶體中，只有在記憶體不足時才會溢寫到磁碟。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: quiz
- id: 5105
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: ACID 原則中的 "A" 代表？
  type: multiple_choice
  options:
  - Atomicity (原子性)，保證交易是不可分割的最小單位
  - Authentication (認證)，保證使用者身分合法
  - Availability (可用性)，保證系統隨時可用
  - Accuracy (準確性)，保證數據計算無誤
  correct_index: 0
  explanation: 原子性保證交易是不可分割的最小單位，要麼全部成功，要麼全部失敗回滾。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5106
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 根據 CAP 定理，分散式系統不可能同時滿足哪三個特性？
  type: multiple_choice
  options:
  - 交易原子性 (Atomicity)、數據一致性 (Consistency)、交易隔離性 (Isolation)
  - 資訊安全性 (Security)、用戶隱私性 (Privacy)、使用便利性 (Convenience)
  - 一致性 (Consistency)、可用性 (Availability)、分區容錯性 (Partition Tolerance)
  - 系統運算速度 (Speed)、建置維護成本 (Cost)、服務品質 (Quality)
  correct_index: 2
  explanation: CAP 定理是分散式系統設計的基石，指出在網路分區 (P) 發生時，必須在一致性 (C) 和可用性 (A) 之間做出選擇。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5107
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: MongoDB 屬於哪種類型的 NoSQL 資料庫？
  type: multiple_choice
  options:
  - 鍵值對 (Key-Value) 資料庫，如 Redis
  - 列式 (Column-family) 資料庫，如 HBase
  - 文件型 (Document) 資料庫，儲存 JSON/BSON 格式
  - 圖形 (Graph) 資料庫，如 Neo4j
  correct_index: 2
  explanation: MongoDB 儲存 BSON (Binary JSON) 格式的文件，結構靈活，適合內容管理與快速開發。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5108
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: Redis 最適合的應用場景是？
  type: multiple_choice
  options:
  - 高速快取 (Caching) 與使用者 Session 狀態管理
  - 社交網絡關係鏈的深度圖形分析 (Graph Analysis)
  - 涉及多張資料表 Join 的複雜關聯查詢 (Complex Relational Queries)
  - 長期儲存 PB 等級的海量系統日誌 (Massive Log Storage)
  correct_index: 0
  explanation: Redis 是基於記憶體的 Key-Value 資料庫，讀寫速度極快，是快取系統的首選。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5109
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 資料湖 (Data Lake) 的 "Schema-on-Read" 特性意味著？
  type: multiple_choice
  options:
  - 數據寫入後即被鎖定，只能進行讀取操作，不允許任何寫入或修改
  - 存入的數據必須是經過清洗的結構化數據 (Structured Data)
  - 寫入時不限制格式，讀取時再根據分析需求定義 Schema (Schema-on-Read)
  - 在寫入數據之前，必須先嚴格定義好資料表結構 (Schema-on-Write)
  correct_index: 2
  explanation: 這賦予了資料湖極大的靈活性，可以先存下所有原始數據 (Raw Data)，日後再決定如何分析。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5110
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: Parquet 檔案格式的主要優點是？
  type: multiple_choice
  options:
  - 採用純文字格式，易於人類直接閱讀與編輯 (Human-Readable)
  - 擁有所有檔案格式中最快的寫入速度 (Fastest Write Speed)
  - 採用列式儲存 (Columnar)，支援高效壓縮與查詢優化 (只讀取需要的列)
  - 原生支援完整的資料庫事務處理 (ACID Transactions)
  correct_index: 2
  explanation: 對於 OLAP 分析查詢（通常只查少數幾個欄位但涉及大量行），列式儲存能大幅減少 I/O，提升效能。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: quiz
- id: 5111
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Spark 的「惰性求值 (Lazy Evaluation)」是指？
  type: multiple_choice
  options:
  - 為了節省資源，系統只會執行程式碼的一半步驟
  - Transformation 操作不會立即執行，直到遇到 Action 操作才觸發計算
  - 系統運算效能低落，導致程式執行速度非常緩慢
  - 系統會隨機選擇部分程式碼進行執行，不保證順序
  correct_index: 1
  explanation: 這種機制允許 Spark 優化整個執行計畫（例如合併多個 map 操作），減少不必要的數據傳輸與計算。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: both
- id: 5112
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: ACID 中的 "I" 代表？
  type: multiple_choice
  options:
  - Isolation (隔離性)，確保並發交易互不干擾
  - Identity (身份)，確保交易發起人的身分正確
  - Intelligence (智慧)，確保系統具備自動修復能力
  - Integrity (完整性)，確保數據符合所有約束條件
  correct_index: 0
  explanation: 隔離性確保並發執行的交易互不干擾，防止髒讀 (Dirty Read) 等問題。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5113
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 圖形資料庫 (Graph Database) 如 Neo4j 最擅長處理？
  type: multiple_choice
  options:
  - 複雜的關係網絡分析 (Complex Relationship Analysis)，如社交網絡
  - 簡單快速的鍵值對 (Key-Value) 存取操作
  - 按時間順序排列的感測器數據或股市行情 (Time-Series Data)
  - 儲存大量的 JSON 或 XML 格式文件 (Document Storage)
  correct_index: 0
  explanation: 圖形資料庫直接儲存節點與邊的關係，查詢深度關聯（朋友的朋友的朋友）時效率遠高於關聯式資料庫。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5114
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 資料倉儲 (Data Warehouse) 通常採用什麼 Schema 策略？
  type: multiple_choice
  options:
  - 無模式 (No Schema)，完全不限制數據結構
  - 讀取時定義模式 (Schema-on-Read)，靈活適應各種數據
  - 動態模式 (Dynamic Schema)，隨數據內容自動調整
  - 寫入時定義模式 (Schema-on-Write)，確保數據品質與一致性
  correct_index: 3
  explanation: 資料倉儲要求數據在寫入前必須經過清洗與轉換 (ETL)，符合預定義的嚴格 Schema，以確保報表品質。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5115
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Hadoop MapReduce 的兩個主要階段是？
  type: multiple_choice
  options:
  - 映射 (Map) 處理與歸約 (Reduce) 匯總階段
  - 資料輸入 (Input) 與結果輸出 (Output) 階段
  - 磁碟讀取 (Read) 與磁碟寫入 (Write) 階段
  - 數據洗牌 (Shuffle) 與數據排序 (Sort) 階段
  correct_index: 0
  explanation: Map 階段並行處理數據片段，Reduce 階段匯總 Map 的結果。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: both
- id: 5116
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: BASE 模型中的 "Soft state" 意味著？
  type: multiple_choice
  options:
  - 系統狀態是永久固定不變的 (Hard State)
  - 指的是伺服器層面的硬體狀態 (Hardware State)
  - 指的是應用程式層面的軟體狀態 (Software State)
  - 系統狀態可能會隨時間改變，即使沒有輸入（因為數據正在同步中）
  correct_index: 3
  explanation: 這是最終一致性過程中的中間狀態，允許不同節點的數據在短時間內不一致。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5117
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: Cassandra 屬於哪種類型的 NoSQL 資料庫？
  type: multiple_choice
  options:
  - 圖形 (Graph) 資料庫
  - 列式 (Column-family) 資料庫
  - 鍵值對 (Key-Value) 資料庫
  - 文件型 (Document) 資料庫
  correct_index: 1
  explanation: Cassandra 採用寬列儲存 (Wide Column Store)，具有極高的寫入吞吐量，適合儲存大量日誌或物聯網數據。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5118
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: Avro 格式通常適用於？
  type: multiple_choice
  options:
  - 前端網頁的直接顯示與排版 (Web Display)
  - 高解析度圖片與多媒體檔案的儲存 (Image Storage)
  - 大量寫入操作與數據序列化 (Data Serialization)，如 Kafka 消息
  - 需要頻繁進行複雜查詢與分析的 OLAP 場景
  correct_index: 2
  explanation: Avro 是行式儲存，寫入效率高，且 Schema 隨數據一起存儲，支援 Schema Evolution，非常適合串流數據。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5119
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Spark SQL 的主要功能是？
  type: multiple_choice
  options:
  - 訓練與部署複雜的機器學習模型 (Machine Learning)
  - 產生各種統計圖表與資料視覺化 (Data Visualization)
  - 使用標準 SQL 語法來查詢與操作結構化數據 (Structured Data)
  - 處理即時的數據串流 (Real-time Streaming)
  correct_index: 2
  explanation: Spark SQL 讓熟悉 SQL 的分析師能輕鬆操作大數據，並透過 DataFrame API 與 Spark 其他組件整合。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: both
- id: 5120
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 在 CAP 定理中，CP 系統選擇犧牲什麼？
  type: multiple_choice
  options:
  - 犧牲系統的安全性 (Security)，降低防護等級
  - 犧牲數據的一致性 (Consistency)，允許讀到舊數據
  - 犧牲分區容錯性 (Partition Tolerance)，不允許網路分區
  - 犧牲系統的可用性 (Availability)，暫停服務以確保數據正確
  correct_index: 3
  explanation: 當網路分區發生時，為了保證數據絕對一致，CP 系統會拒絕部分請求（犧牲可用性），直到數據同步完成。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5121
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: HDFS 中的 NameNode 負責管理？
  type: multiple_choice
  options:
  - 儲存實際的檔案數據塊 (Data Blocks)
  - 管理文件系統的元數據 (Metadata)，如檔名與目錄結構
  - 負責叢集資源的分配與調度 (Resource Scheduling)
  - 執行具體的 MapReduce 計算任務 (Computation Tasks)
  correct_index: 1
  explanation: NameNode 是 HDFS 的大腦，記錄文件名稱、目錄結構以及每個文件對應的數據塊位置。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: both
- id: 5122
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 關聯式資料庫 (RDBMS) 最適合處理？
  type: multiple_choice
  options:
  - 數 PB 等級的海量伺服器日誌 (Massive Server Logs)
  - 影片、音訊等非結構化數據 (Unstructured Data)
  - 高度結構化且需要嚴格一致性的交易數據 (Transactional Data)
  - 複雜的社群網絡關係圖 (Social Network Graphs)
  correct_index: 2
  explanation: RDBMS 的強項在於 ACID 事務保證與複雜的 SQL 關聯查詢，是核心業務系統的基石。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5123
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 最終一致性 (Eventual Consistency) 是指？
  type: multiple_choice
  options:
  - 經過一段時間後，所有節點的數據最終會達到一致狀態
  - 系統中的數據永遠無法達到一致狀態
  - 只有主節點 (Master Node) 保持一致，從節點不保證
  - 數據在寫入的瞬間，所有節點立即達到一致 (Strong Consistency)
  correct_index: 0
  explanation: 這是 AP 系統常見的特性。允許短暫的不一致以換取高可用性，系統會透過背景同步機制最終讓數據同步。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5124
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: Spark Streaming 用於？
  type: multiple_choice
  options:
  - 處理大規模的離線批次數據 (Batch Processing)
  - 訓練人工智慧機器學習模型 (Machine Learning)
  - 處理即時進入的數據流 (Real-time Data Streaming)
  - 進行複雜的圖形結構計算 (Graph Computing)
  correct_index: 2
  explanation: 處理來自 Kafka, Flume 等來源的即時數據流。
  tags:
  - chap-m3-ch1
  - sec-distributed-computing
  usage: both
- id: 5125
  chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 資料湖通常基於哪種儲存技術？
  type: multiple_choice
  options:
  - 高速的隨機存取記憶體 (RAM)
  - 傳統的關聯式資料庫系統 (RDBMS)
  - 傳統的磁帶備份系統 (Tape Backup System)
  - 可擴展的物件儲存技術 (Object Storage)，如 AWS S3
  correct_index: 3
  explanation: 物件儲存具有極高的擴展性與低廉的成本，非常適合存放海量的非結構化數據。
  tags:
  - chap-m3-ch1
  - sec-storage-solutions
  usage: both
- id: 5126
  chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: YARN 中的 ResourceManager 負責？
  type: multiple_choice
  options:
  - 負責單個工作節點 (Node) 的資源監控與管理
  - 負責將數據持久化儲存到硬碟中
  - 負責整個叢集的全局資源管理與任務調度 (Global Scheduling)
