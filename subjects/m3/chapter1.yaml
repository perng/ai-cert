  options:
  - 適合儲存 JSON 文件資料的文件型資料庫 (如 MongoDB)
  - 專門處理複雜關係網絡的圖形資料庫 (如 Neo4j)
  - 適合海量數據寫入的列式資料庫 (如 HBase)
  - 適合高速快取的鍵值對資料庫 (如 Redis)
  correct_index: 1
  explanation: 圖形資料庫專為處理節點與邊的複雜關係而設計，查詢效率遠高於關聯式資料庫。
