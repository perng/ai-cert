- chapter_title: 大數據生態系統
  section_title: 儲存解決方案
  text: 情境：Redis 常被用於購物車或 Session 管理，是因為它具備什麼特性？
  type: multiple_choice
  options:
  - 因為它的儲存成本是所有資料庫中最低的
