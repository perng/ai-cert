  usage: both
- chapter_title: 大數據生態系統
  section_title: 分散式運算框架
  text: 情境：Hadoop 的 HDFS 透過什麼機制來確保資料可靠性？
  type: multiple_choice
  options:
  - 使用高效能的壓縮演算法來減少儲存空間
