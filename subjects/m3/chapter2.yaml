- id: m3-code-062
  chapter_title: 資料處理與特徵工程
  section_title: 程式閱讀理解
  text: 閱讀下列離群值處理，哪一項正確？
  content:
  - type: text
    text: 閱讀下列離群值處理，哪一項正確？
  - type: code
    language: python
    code: 'q1 = df["amount"].quantile(0.25)

      q3 = df["amount"].quantile(0.75)

      iqr = q3 - q1

      filtered = df[(df["amount"] >= q1 - 1.5 * iqr) & (df["amount"] <= q3 + 1.5 * iqr)]'
  type: multiple_choice
  options:
  - 使用 IQR 規則過濾 amount 離群值
  - 把 amount 標準化成平均 0
  - 計算 amount 的 one-hot 編碼
  - 只保留缺值列
  correct_index: 0
  explanation: IQR 方法用 Q1-1.5IQR 與 Q3+1.5IQR 作為常見離群值範圍門檻。
