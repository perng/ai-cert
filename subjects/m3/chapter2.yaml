  - type: text
    text: "分析師在載入資料後，檢視 `Year` 欄位的資料型態，發現它是 `float64`，而非一般年份常用的整數。他想了解這樣的情形為什麼會發生。請問下列哪些原因可能導致這種狀況？\n\n原因 A：CSV 檔中 `Year` 欄位有缺失值（NaN），導致 Pandas 自動將整欄轉為浮點數。  \n原因 B：CSV 檔中的年份資料原本是字串（如 `\"2006\"`），Pandas 轉換時出錯而變成浮點數。  \n原因 C：Pandas 預設會將所有數值型態讀取為 `float64`，不論資料是否為整數。  \n原因 D：CSV 檔中的年份資料可能包含小數點（例如 `2006.0`），因此被視為浮點數。\n\n(114年第二梯次)"
  type: multiple_choice
  options:
