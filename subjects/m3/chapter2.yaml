- id: 114-2-012
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '在處理分類問題時，若某一類樣本數明顯少於其他類別，研究人員可能採用隨機過採樣（Random Oversampling）以平衡資料比例，此方法最常造成下列哪一種問題？


