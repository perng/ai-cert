  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-017
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '某電商公司欲利用顧客行為資料建立消費預測模型，其中「會員等級」欄位包含「一般、白金、黑卡」三種類別。若模型採用梯度提升樹（Gradient Boosting Tree）演算法，資料科學家在進行特徵編碼時應特別注意下列何種情況？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 應優先採用獨熱編碼（One-Hot Encoding），以減少類別之間的相依性與記憶體使用量
  - 直接使用標籤編碼（Label Encoding）可能使模型誤判類別間存在順序關係，導致特徵重要性偏誤
  - 使用目標編碼（Target Encoding）會自動消除過擬合（Overfitting）風險
  - 若類別數量較少，建議先使用主成分分析（Principal Component Analysis, PCA）進行降維
  correct_index: 1
  explanation: 會員等級雖然以文字呈現，但直接 Label Encoding 會把類別轉成數字序列，梯度提升樹可能利用這個人為順序切分，造成特徵重要性或模型判斷偏誤。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-019
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '某製造企業導入上萬台物聯網（IoT）感測器以進行設備健康監測。系統需在毫秒級回應異常事件，並同時將完整資料保留於雲端供後續 AI 模型訓練與分析。若企業希望兼顧即時性、資料完整性與可擴展性，下列哪一種資料流程設計最符合此目標？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 感測器 → 雲端 API Gateway → 分散式資料庫 → 批次特徵工程 → 模型推論
  - 感測器 → MQTT Broker → 雲端資料倉儲 → 即時儀表板 → 模型再訓練
  - 感測器 → 邊緣運算節點 → 流式資料處理框架（Stream Processing Framework）→ 雲端資料湖 → 模型推論
  - 感測器 → 本地快取層 → RESTful API → 雲端報表系統 → 模型批次更新
  correct_index: 2
  explanation: 毫秒級異常回應需要邊緣端先處理或推論，流式處理框架負責即時資料流，雲端資料湖保留完整資料供後續訓練與分析，三者能兼顧即時性、完整性與擴展性。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-037
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '若開發一個用於罕見疾病自動診斷的分類模型，目前資料集中確診樣本僅佔不到 1%，且因為標註成本高，短期內無法取得更多資料。在此情況下，若希望提升模型對少數類的偵測能力，同時避免過擬合，下列哪一種策略最為合理？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 對少數類進行隨機過採樣（Random Oversampling）
  - 對多數類進行欠採樣（Random Undersampling）
  - 使用 SMOTE（Synthetic Minority Over-sampling Technique）生成合成少數類樣本後再訓練分類模型
  - 僅使用現有資料調整模型決策閾值（Decision Threshold）以提升召回率
  correct_index: 2
  explanation: 少數類不到 1% 且資料取得困難時，SMOTE 透過插值產生合成少數類樣本，比單純重複樣本的隨機過採樣更能降低過擬合風險。
  tags:
