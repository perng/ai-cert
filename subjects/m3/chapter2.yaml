questions:
- id: 5201
  chapter_title: 進階資料處理
  section_title: 資料品質與清理 (Data Quality & Cleaning)
  text: 資料品質維度中的「一致性 (Consistency)」是指？
  type: multiple_choice
  options:
  - 數據中沒有任何缺失值 (Missing Values)
  - 數據是即時更新的 (Timeliness)
  - 數據的格式符合預定義的標準 (Format Validity)
  - 數據在不同來源或系統中不矛盾，保持邏輯上的一致 (Consistency)
  correct_index: 3
  explanation: 一致性確保同一實體在不同資料庫中的資訊是吻合的，避免出現「張三在 A 系統住台北，在 B 系統住高雄」的矛盾。
  tags:
  - chap-m3-ch2
  - sec-data-quality
  usage: quiz
- id: 5202
  chapter_title: 進階資料處理
  section_title: 資料品質與清理 (Data Quality & Cleaning)
  text: 處理缺失值 (Missing Values) 的「填補 (Imputation)」方法不包括？
  type: multiple_choice
  options:
  - 使用 K-近鄰演算法 (KNN) 預測缺失值進行填補
  - 使用該欄位的眾數 (Mode) 進行填補
  - 直接刪除包含缺失值的整行數據 (Deletion)
  - 使用該欄位的平均值 (Mean) 進行填補
  correct_index: 2
  explanation: 直接刪除是「刪除法」，不是「填補法」。填補旨在保留數據行，用估計值替代缺失部分。
  tags:
  - chap-m3-ch2
  - sec-data-quality
  usage: quiz
- id: 5203
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: One-hot Encoding 的主要缺點是？
  type: multiple_choice
  options:
  - 完全無法處理任何形式的文字數據
  - 容易導致模型在訓練集上過擬合 (Overfitting)
  - 當類別數量很多時，會導致特徵空間過大，引發維度災難 (Curse of Dimensionality)
  - 編碼過程的計算速度非常緩慢
  correct_index: 2
  explanation: 如果一個特徵有 1000 個類別，One-hot 會產生 1000 個新欄位，導致資料變得極度稀疏且維度過高。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: quiz
- id: 5204
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: Min-Max Normalization 將數據縮放到哪個區間？
  type: multiple_choice
  options:
  - 將數據縮放到 0 到 100 之間
  - 將數據縮放到 -1 到 1 之間
  - 將數據線性縮放到 0 到 1 的區間內
  - 將數據擴展到負無限大到正無限大
  correct_index: 2
  explanation: 公式 (X - min) / (max - min) 保證了結果必定落在 0 到 1 之間。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: quiz
- id: 5205
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: Kafka 在串流處理架構中的角色是？
  type: multiple_choice
  options:
  - 用於託管網站的網頁伺服器
  - 作為緩衝區與解耦生產者/消費者的高吞吐量分散式消息系統 (Message Queue)
  - 傳統的關聯式資料庫管理系統
  - 用於進行預測的機器學習模型
  correct_index: 1
  explanation: Kafka 作為中間件，能暫存海量數據，讓生產者（如 Log 收集器）與消費者（如 Spark）不必同步等待，實現解耦。
  tags:
  - chap-m3-ch2
  - sec-data-ingestion
  usage: quiz
- id: 5206
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: 滾動視窗 (Tumbling Window) 的特點是？
  type: multiple_choice
  options:
  - 視窗大小固定且時間區間互不重疊 (Non-overlapping)
  - 視窗一旦開啟就永不結束
  - 視窗大小固定但時間區間允許重疊 (Overlapping)
  - 視窗大小會隨數據量動態變化
  correct_index: 0
  explanation: 滾動視窗像翻頁一樣，每 5 分鐘一頁，頁與頁之間沒有交集。
  tags:
  - chap-m3-ch2
  - sec-data-ingestion
  usage: quiz
- id: 5207
  chapter_title: 進階資料處理
  section_title: ETL 流程與工作流自動化
  text: Apache Airflow 使用什麼來定義工作流？
  type: multiple_choice
  options:
  - 使用 SQL 查詢語言
  - 使用 Python 程式碼定義 DAG (有向無環圖) 來描述任務依賴
  - 使用 Excel 試算表
  - 使用 XML 標記語言
  correct_index: 1
  explanation: Airflow 的核心理念是 "Workflow as Code"，開發者用 Python 編寫 DAG 來描述任務間的依賴關係。
  tags:
  - chap-m3-ch2
  - sec-etl-workflow
  usage: quiz
- id: 5208
  chapter_title: 進階資料處理
  section_title: 資料治理與安全 (Data Governance & Security)
  text: Data Lineage (血緣分析) 的主要用途是？
  type: multiple_choice
  options:
  - 追蹤數據從源頭到最終報表的完整流向 (Data Flow)，協助問題排查與影響分析
  - 使用壓縮演算法減少數據儲存空間
  - 對敏感數據進行加密保護
  - 定期將數據備份到異地
  correct_index: 0
  explanation: 當報表數據出錯時，血緣分析能幫我們往回追溯，找出是哪個上游環節（如 ETL 任務）出了問題。
  tags:
  - chap-m3-ch2
  - sec-data-governance
  usage: quiz
- id: 5209
  chapter_title: 進階資料處理
  section_title: 資料治理與安全 (Data Governance & Security)
  text: 零信任架構 (Zero Trust) 的核心原則是？
  type: multiple_choice
  options:
  - Never Trust, Always Verify (從不信任，總是驗證)，對所有請求進行嚴格驗證
  - 為了方便，不強制使用密碼驗證
  - 預設信任內部網路中的所有設備與使用者
  - 只需要在登入時驗證一次即可
  correct_index: 0
  explanation: 零信任假設內網也不安全，因此對任何資源的存取請求（無論來自內部或外部）都必須經過嚴格的身份驗證。
  tags:
  - chap-m3-ch2
  - sec-data-governance
  usage: quiz
- id: 5210
  chapter_title: 進階資料處理
  section_title: 大數據在人工智慧之應用 (Big Data Applications in AI)
  text: 在分散式訓練中，資料平行 (Data Parallelism) 是指？
  type: multiple_choice
  options:
  - 將模型的不同層切分到不同節點上訓練 (Model Parallelism)
  - 訓練過程中完全不使用 GPU 加速
  - 將數據切分到多個節點，每個節點擁有完整的模型副本並同步梯度 (Gradient Synchronization)
  - 限制只使用單一個節點進行訓練
  correct_index: 2
  explanation: 這是最常見的分散式訓練方式。每個 GPU 算一部分數據的梯度，然後大家平均一下梯度來更新模型。
  tags:
  - chap-m3-ch2
  - sec-bigdata-ai-apps
  usage: quiz
- id: 5211
  chapter_title: 進階資料處理
  section_title: 資料品質與清理 (Data Quality & Cleaning)
  text: 識別異常值 (Outliers) 的常用統計方法是？
  type: multiple_choice
  options:
  - 顯示變數間關係的散佈圖 (Scatter Plot)
  - 顯示頻率分佈的長條圖 (Bar Chart)
  - 利用四分位距 (IQR) 的箱形圖 (Box Plot) 或 Z-score 方法
  - 顯示各類別比例的圓餅圖 (Pie Chart)
  correct_index: 2
  explanation: 箱形圖利用四分位距 (IQR) 定義上下界，超出範圍的點即視為異常值。
  tags:
  - chap-m3-ch2
  - sec-data-quality
  usage: both
- id: 5212
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: Label Encoding 適合用於哪種變數？
  type: multiple_choice
  options:
  - 無序的類別變數 (Nominal Variables)，如顏色：紅、藍、綠
  - 有序的類別變數 (Ordinal Variables)，如尺寸：S, M, L
  - 連續的數值變數 (Continuous Variables)
  - 非結構化的圖片數據 (Image Data)
  correct_index: 1
  explanation: Label Encoding 將類別轉為 0, 1, 2...，這隱含了大小關係 (0 < 1 < 2)，因此適合有序類別。若用於無序類別會誤導模型。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: both
- id: 5213
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: Sqoop 的主要功能是？
  type: multiple_choice
  options:
  - 在 Hadoop 生態系與關聯式資料庫 (RDBMS) 之間進行高效的數據傳輸
  - 訓練機器學習模型 (Machine Learning)
  - 繪製數據視覺化圖表 (Data Visualization)
  - 處理即時數據流 (Streaming Processing)
  correct_index: 0
  explanation: Sqoop 是 "SQL to Hadoop" 的縮寫，專門用於將傳統資料庫的數據匯入大數據平台，或反向匯出。
  tags:
  - chap-m3-ch2
  - sec-data-ingestion
  usage: both
- id: 5214
  chapter_title: 進階資料處理
  section_title: ETL 流程與工作流自動化
  text: ELT (Extract, Load, Transform) 相比於 ETL 的優勢在於？
  type: multiple_choice
  options:
  - 能夠節省大量的硬碟儲存空間
  - 數據處理速度通常較慢
  - 只能處理小規模的數據集
  - 利用現代雲端資料倉儲的強大算力進行轉換，且完整保留了原始數據 (Raw Data)
  correct_index: 3
  explanation: 先把數據 Load 進 BigQuery/Snowflake，再用 SQL 進行 Transform，比在外部 ETL Server 處理更高效且靈活。
  tags:
  - chap-m3-ch2
  - sec-etl-workflow
  usage: both
- id: 5215
  chapter_title: 進階資料處理
  section_title: 資料治理與安全 (Data Governance & Security)
  text: RBAC (Role-Based Access Control) 是基於什麼來分配權限？
  type: multiple_choice
  options:
  - 根據用戶的 IP 位址
  - 根據用戶的角色 (Role-Based)，如管理員、分析師
  - 根據用戶的密碼強度
  - 根據用戶的屬性 (Attribute-Based)，如部門、時間
  correct_index: 1
  explanation: RBAC 將權限綁定在「角色」上，再將角色分配給用戶，簡化了權限管理。
  tags:
  - chap-m3-ch2
  - sec-data-governance
  usage: both
- id: 5216
  chapter_title: 進階資料處理
  section_title: 大數據在人工智慧之應用 (Big Data Applications in AI)
  text: 主動式學習 (Active Learning) 的核心思想是？
  type: multiple_choice
  options:
  - 模型主動挑選「最不確定 (Most Uncertain)」的樣本交由專家標註，以節省標註成本
  - 完全不進行任何數據標註
  - 隨機挑選樣本進行標註
  - 標註所有的訓練數據
  correct_index: 0
  explanation: 既然標註很貴，就只標註那些模型「看不懂」的難題，這樣能用最少的數據達到最好的訓練效果。
  tags:
  - chap-m3-ch2
  - sec-bigdata-ai-apps
  usage: both
- id: 5217
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: SMOTE 技術主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 數據中的缺失值 (Missing Values)
  - 數據集中的類別不平衡 (Imbalanced Data) 問題
  - 數據特徵維度過高 (High Dimensionality)
  - 數據中的異常值 (Outliers)
  correct_index: 1
  explanation: SMOTE 透過插值合成少數類別的新樣本，讓數據集變得平衡，避免模型偏向多數類別。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: both
- id: 5218
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: 滑動視窗 (Sliding Window) 與滾動視窗的主要區別是？
  type: multiple_choice
  options:
  - 滑動視窗的大小可以隨意變化
  - 滑動視窗不使用時間作為基準
  - 滑動視窗允許時間區間重疊 (Overlapping)，而滾動視窗不重疊
  - 滑動視窗只處理過去的歷史數據
  correct_index: 2
  explanation: 滑動視窗（如每 1 分鐘統計過去 5 分鐘）會有重疊部分，能提供更平滑的趨勢分析。
  tags:
  - chap-m3-ch2
  - sec-data-ingestion
  usage: both
- id: 5219
  chapter_title: 進階資料處理
  section_title: 資料治理與安全 (Data Governance & Security)
  text: 差分隱私 (Differential Privacy) 如何保護隱私？
  type: multiple_choice
  options:
  - 刪除所有的敏感數據
  - 限制特定 IP 位址的存取
  - 在數據中加入統計雜訊 (Statistical Noise)，使得單一特定樣本的存在與否不影響整體統計結果
  - 對硬碟進行全碟加密
  correct_index: 2
  explanation: 這是目前最強的隱私保護數學定義，保證攻擊者無法從查詢結果反推特定個人的資訊。
  tags:
  - chap-m3-ch2
  - sec-data-governance
  usage: both
- id: 5220
  chapter_title: 進階資料處理
  section_title: 大數據在人工智慧之應用 (Big Data Applications in AI)
  text: 聯邦學習 (Federated Learning) 的特點是？
  type: multiple_choice
  options:
  - 訓練過程中不使用任何模型
  - 只在中央伺服器上進行訓練
  - 數據不出本地 (如手機端)，僅上傳加密後的模型參數更新 (Model Updates)
  - 將所有數據集中到雲端伺服器進行訓練
  correct_index: 2
  explanation: 這種去中心化的訓練方式徹底解決了數據隱私問題，適合醫療、金融等敏感領域。
  tags:
  - chap-m3-ch2
  - sec-bigdata-ai-apps
  usage: both
- id: 5221
  chapter_title: 進階資料處理
  section_title: 資料品質與清理 (Data Quality & Cleaning)
  text: 資料完整性 (Completeness) 關注的是？
  type: multiple_choice
  options:
  - 數據是否有重複記錄
  - 數據是否準確無誤
  - 數據是否即時更新
  - 數據是否有缺失值 (Missing Values)，如必填欄位是否為空
  correct_index: 3
  explanation: 完整性檢查欄位是否為空 (Null)，例如客戶資料是否都有填寫電話號碼。
  tags:
  - chap-m3-ch2
  - sec-data-quality
  usage: both
- id: 5222
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: Z-score Standardization 後的數據分佈特徵是？
  type: multiple_choice
  options:
  - 最小值為 0，最大值為 1
  - 均值固定為 100
  - 均值為 1，標準差為 0
  - 均值為 0，標準差為 1 (Standard Normal Distribution)
  correct_index: 3
  explanation: Z-score 將數據轉換為標準常態分佈，消除了不同量綱的影響。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: both
- id: 5223
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: Flume 主要用於收集哪種類型的數據？
  type: multiple_choice
  options:
  - 大量分散式伺服器的日誌數據 (Logs)
  - 非結構化的圖片數據
  - 串流影片數據
  - 結構化的交易數據 (Structured Transaction Data)
  correct_index: 0
  explanation: Flume 專為高效收集分散式伺服器上的 Log 文件而設計。
  tags:
  - chap-m3-ch2
  - sec-data-ingestion
  usage: both
- id: 5224
  chapter_title: 進階資料處理
  section_title: ETL 流程與工作流自動化
  text: Airflow 中的 Operator 代表？
  type: multiple_choice
  options:
  - 代表一個全域變數 (Variable)
  - 代表一個完整的工作流 (Workflow)
  - 代表一個具體的任務單元 (Task)，如執行 Python 函數或 SQL 查詢
  - 代表一個負責排程的排程器 (Scheduler)
  correct_index: 2
  explanation: Operator 是 DAG 中的節點，定義了實際要執行的動作。
  tags:
  - chap-m3-ch2
  - sec-etl-workflow
  usage: both
- id: 5225
  chapter_title: 進階資料處理
  section_title: 大數據在人工智慧之應用 (Big Data Applications in AI)
  text: 弱監督 (Weak Supervision) 標註通常使用什麼方法？
  type: multiple_choice
  options:
  - 完全隨機生成標籤
  - 利用啟發式規則、關鍵字或外部知識庫自動生成標籤 (Programmatic Labeling)
  - 由領域專家逐一進行人工標註
  - 不進行任何標註
  correct_index: 1
  explanation: 雖然準確率不如人工，但能快速生成海量標註數據，適合大數據場景。
  tags:
  - chap-m3-ch2
  - sec-bigdata-ai-apps
  usage: both
- id: 5226
  chapter_title: 進階資料處理
  section_title: 資料轉換與特徵工程 (Data Transformation & Feature Engineering)
  text: 特徵選擇 (Feature Selection) 中的 Filter 方法是基於什麼來篩選特徵？
  type: multiple_choice
  options:
  - 根據人工的主觀判斷
  - 完全隨機選擇特徵
  - 根據特徵與目標變數之間的統計關聯性 (如相關係數、卡方檢定)
  - 根據模型的預測結果準確度
  correct_index: 2
  explanation: Filter 方法不依賴特定模型，而是根據特徵與目標變數之間的統計關聯性進行初步篩選。
  tags:
  - chap-m3-ch2
  - sec-feature-engineering
  usage: both
- id: 5227
  chapter_title: 進階資料處理
  section_title: 資料攝取
  text: 會話視窗 (Session Window) 的結束條件通常是？
  type: multiple_choice
  options:
  - 當數據量達到預設的上限時
  - 當固定的時間間隔到達時
  - 必須由人工手動結束視窗
  - 當超過一段時間沒有新的數據進入時 (Inactivity Gap)
  correct_index: 3
