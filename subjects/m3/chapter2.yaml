- id: 114-2-043
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: "一間遊戲市場研究公司正在分析全球電子遊戲銷售情況，並準備建立一份「熱銷遊戲銷售報告」。分析師取得了一份名為 `vgsales.csv` 的資料集，內容包含了全球銷量超過 10 萬份的電子遊戲清單。研究團隊希望透過這份資料，了解不同年份、平台與地區的銷售趨勢。資料集的欄位說明如下，請根據下述資料情境回答 43–47 題。\n\n- `Name`：遊戲名稱\n- `Platform`：遊戲平台（如 PS4、X360、Wii 等）\n- `Year`：發售年份\n- `Genre`：遊戲類型（如 Action、Sports、Role-Playing 等）\n- `Publisher`：發行商名稱\n- `NA_Sales` / `EU_Sales` / `JP_Sales` / `Other_Sales`：各地區銷售量（單位：百萬份）\n- `Global_Sales`：全球總銷售量（單位：百萬份）\n\n資料的欄位概觀如下：\n\n![VGSales dataset overview](assets/images/q43_47_vgsales_head.png)\n\n第 43 題\n\n![Q43 Year column dtype output](assets/images/q43_year_dtype.png)\n\n分析師在載入資料後，檢視 `Year` 欄位的資料型態，發現它是 `float64`，而非一般年份常用的整數。他想了解這樣的情形為什麼會發生。請問下列哪些原因可能導致這種狀況？\n\n原因 A：CSV 檔中 `Year` 欄位有缺失值（NaN），導致 Pandas 自動將整欄轉為浮點數。  \n原因 B：CSV 檔中的年份資料原本是字串（如 `\"2006\"`），Pandas 轉換時出錯而變成浮點數。  \n原因 C：Pandas 預設會將所有數值型態讀取為 `float64`，不論資料是否為整數。  \n原因 D：CSV 檔中的年份資料可能包含小數點（例如 `2006.0`），因此被視為浮點數。\n\n(114年第二梯次)"
  content:
  - type: text
    text: '一間遊戲市場研究公司正在分析全球電子遊戲銷售情況，並準備建立一份「熱銷遊戲銷售報告」。分析師取得了一份名為 `vgsales.csv` 的資料集，內容包含了全球銷量超過 10 萬份的電子遊戲清單。研究團隊希望透過這份資料，了解不同年份、平台與地區的銷售趨勢。資料集的欄位說明如下，請根據下述資料情境回答 43–47 題。


      - `Name`：遊戲名稱

      - `Platform`：遊戲平台（如 PS4、X360、Wii 等）

      - `Year`：發售年份

      - `Genre`：遊戲類型（如 Action、Sports、Role-Playing 等）

      - `Publisher`：發行商名稱

      - `NA_Sales` / `EU_Sales` / `JP_Sales` / `Other_Sales`：各地區銷售量（單位：百萬份）

      - `Global_Sales`：全球總銷售量（單位：百萬份）


      資料的欄位概觀如下：'
