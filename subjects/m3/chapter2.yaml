- id: 114-2-005
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '在進行資料前處理時，若使用 Label Encoding 將類別變數轉換為數字型態，下列何者為最常見的潛在風險？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 無法處理缺值
  - 會引入類別之間的虛假順序關係
  - 無法擴展至新資料
  - 記憶體佔用過高
  correct_index: 1
  explanation: Label Encoding 會把類別映射成 0、1、2 等數字。若類別本身無序，模型可能誤以為數字大小代表類別順序或距離，因此最常見風險是引入虛假的順序關係。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-006
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '在進行資料分析時，會遇到類別型（Categorical）與數值型（Numerical）資料格式。關於這兩種資料格式的處理，下列敘述何者不正確？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - One-Hot 編碼（One-Hot Encoding）會將類別變數轉換為多維二元向量，適用於無序（Nominal）類別資料，但在高基數（High Cardinality）特徵下可能造成維度爆炸問題
  - 標籤編碼（Label Encoding）會以整數表示不同類別，若應用於無序（Nominal）資料，可能導致模型誤將編碼值解讀為具數值大小關係的特徵
  - 標準化（Standardization）透過將資料平移與縮放，使其平均值為 0、標準差為 1，可在多數距離型演算法中改善收斂速度，並同時將數值範圍壓縮至 0 至 1 之間
  - 對連續變數進行分箱（Binning）可提升模型可解釋性，但若分段方式未依據資料分佈特性設計，可能導致資訊損失或邊界偏誤
  correct_index: 2
  explanation: 標準化會讓資料平均值為 0、標準差為 1，但不會保證數值落在 0 到 1；把範圍壓到 0 到 1 是 Min-Max normalization 的特性，所以選項 C 的敘述不正確。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-008
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '資料科學家為分析顧客行為，利用現有欄位「銷售金額」與「瀏覽次數」，計算出新變數「銷售金額/瀏覽次數」。此動作屬於下列哪一類特徵工程方法？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - 特徵選擇（Feature Selection）
  - 特徵衍生（Feature Derivation）
  - 特徵轉換（Feature Transformation）
  - 分箱處理（Binning）
  correct_index: 1
  explanation: 用既有欄位計算新欄位，例如「銷售金額 / 瀏覽次數」，是在創造衍生特徵，因此屬於 Feature Derivation，而不是刪除欄位的特徵選擇。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-009
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '在進行數值特徵的標準化（Normalization）時，若資料中存在極端值（Outliers），下列哪一種方法最適合使用？


    (114年第二梯次)'
  type: multiple_choice
  options:
  - Min-Max 正規化（Min-Max Scaling）
  - Z-score 標準化（Z-score Normalization）
  - 穩健縮放（Robust Scaling）
  - 標準分箱（Standard Binning）
  correct_index: 2
  explanation: Robust Scaling 通常使用中位數與四分位距縮放，對極端值較不敏感；Min-Max 與一般 Z-score 容易被 outlier 拉動尺度。
  tags:
  - sec-past-exam
  - past-exam
  - chap-m3-ch2
  usage: mock
- id: 114-2-010
  chapter_title: 進階資料處理
  section_title: 歷屆考題
  text: '下列哪一種情境最適合應用異常偵測（Anomaly Detection）技術？


