  text: 情境：Chart Junk (圖表垃圾) 是指？
  type: multiple_choice
  options:
  - 報告中包含太少的圖表
  - 數據中的錯誤數值
  - 不必要的裝飾 (如 3D 效果、過多網格線)，會干擾閱讀
  - 報告中包含太多的圖表
  correct_index: 2
  explanation: 應移除干擾閱讀的視覺元素，保持簡潔。
  tags:
