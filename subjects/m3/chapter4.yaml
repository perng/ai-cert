  id: 5462
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：相關係數矩陣 (Correlation Matrix) 通常搭配哪種圖表來視覺化，以便快速識別高相關性的變數對？
  type: multiple_choice
  options:
  - 折線圖
  - 熱力圖 (Heatmap)
  - 圓餅圖
  - 雷達圖
  correct_index: 1
  explanation: 熱力圖利用顏色深淺表示相關係數的大小（如深紅代表高度正相關），讓分析師能快速從矩陣中識別出關鍵變數。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5463
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：根據完形心理學 (Gestalt Principles) 的「鄰近性」原則，在設計儀表板時應該？
  type: multiple_choice
  options:
  - 將相關的圖表或指標靠在一起擺放，形成群組感
  - 將所有圖表隨機打散
  - 使用五顏六色的背景
  - 把字體縮小
  correct_index: 0
  explanation: 鄰近性原則指出，人類傾向將距離相近的物體視為一組。利用此原則可以有效地組織資訊區塊。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  id: 5464
  usage: both
