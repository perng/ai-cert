- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：你需要比較 5 個不同產品線在過去 12 個月的銷售趨勢。最清晰的圖表選擇是？
  type: multiple_choice
  options:
  - 多條線的折線圖 (Line Chart)，可同時比較不同產品的趨勢
  - 5 個獨立的圓餅圖 (Pie Charts)
  - 堆疊面積圖 (Stacked Area Chart)
  - 雷達圖 (Radar Chart)
  correct_index: 0
  explanation: 折線圖最適合展示隨時間變化的趨勢。多條線可以同時比較不同類別的趨勢差異。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5454
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：Seaborn 函式庫相比於 Matplotlib 的主要優勢在於？
  type: multiple_choice
  options:
  - 程式碼執行速度比 Matplotlib 更快
  - 預設樣式更美觀且語法更簡潔，特別適合繪製統計圖表 (Statistical Graphics)
  - 支援 3D 遊戲開發引擎
  - 完全不需寫程式，提供拖拉式介面
  correct_index: 1
  explanation: Seaborn 建立在 Matplotlib 之上，提供了更高級的 API 和更現代的預設配色，大幅簡化了統計圖表（如箱型圖、熱力圖）的繪製。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5455
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 情境：在金融詐欺偵測中，分析師使用散點圖觀察交易金額與頻次，發現遠離主要群聚點的孤立點。這些點通常代表？
  type: multiple_choice
  options:
  - 正常的合法交易行為
  - 異常值 (Outliers) 或潛在的詐欺交易行為
  - 系統數據傳輸錯誤
  - 高價值的 VIP 客戶交易
  correct_index: 1
  explanation: 在散點圖中，離群點往往代表行為模式與大眾顯著不同的異常案例，是詐欺偵測的重點關注對象。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  id: 5456
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：BAN (Big Angry Number) 在儀表板設計中通常用於展示什麼？
  type: multiple_choice
  options:
  - 詳細的文字說明與背景介紹
  - 核心 KPI 數字 (如總銷售額)，以大字體醒目顯示
  - 複雜的數學公式推導過程
  - 公司的 Logo 與品牌形象圖片
  correct_index: 1
  explanation: BAN 強調用大字體直接展示最關鍵的單一數字，讓使用者在 3 秒內掌握核心績效。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  id: 5457
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：Grafana 最常被用於哪種場景？
  type: multiple_choice
  options:
  - 繪製靜態的宣傳海報
  - IT 基礎設施與時序數據 (Time-series Data) 的即時監控與儀表板
  - 編輯與修飾數位相片
  - 進行一般的文書處理工作
  correct_index: 1
  explanation: Grafana 是監控領域的標準工具，特別擅長連接 Prometheus、InfluxDB 等時序資料庫，展示伺服器負載、IoT 數據等即時變化。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5458
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：若要展示某個變數的機率密度分佈，且希望比直方圖更平滑、更易於觀察分佈形狀（如雙峰）。應使用？
  type: multiple_choice
  options:
  - 長條圖 (Bar Chart)
  - 核密度估計圖 (KDE)，提供平滑的機率密度曲線
  - 圓餅圖 (Pie Chart)
  - 樹狀圖 (Treemap)
  correct_index: 1
  explanation: KDE (Kernel Density Estimation) 透過平滑化技術估計機率密度函數，能比受限於 bin 寬度的直方圖更精確地描述數據分佈。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5459
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：在展示 KPI 時，單純顯示「營收 100 萬」是不夠的。為了提供情境 (Context)，你應該加上？
  type: multiple_choice
  options:
  - 增加驚嘆號以示強調
  - 提供比較基準 (Context)，如與上月比較 (MoM)、與去年同期比較 (YoY) 或目標達成率
  - 播放背景音樂以吸引注意力
  - 使用更多樣化的顏色裝飾
  correct_index: 1
  explanation: 沒有比較的數字沒有意義。加上與上月 (MoM) 或去年同期 (YoY) 的比較，才能判斷 100 萬是好是壞。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  id: 5460
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：Tableau 與 Python (Matplotlib) 的主要區別在於？
  type: multiple_choice
  options:
  - Tableau 是完全免費的軟體
  - Tableau 是拖拉式 BI 工具，適合快速探索與互動；Python 是程式語言，適合高度客製化與自動化
  - Python 完全無法用於繪製圖表
  - Tableau 的功能僅限於繪製圓餅圖
  correct_index: 1
  explanation: Tableau 強調無程式碼 (No-code) 的互動式分析，適合商業分析師；Python 則提供程式碼級別的控制，適合資料科學家整合分析流程。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5461
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 情境：智慧城市專案需要展示市區交通擁堵的即時狀況。最直觀的圖表是？
  type: multiple_choice
  options:
  - 長條圖 (Bar Chart)
  - 疊加在地圖上的地理熱力圖 (Geo Heatmap)，顯示擁堵密度
  - 箱型圖 (Box Plot)
  - 純文字的數據列表
  correct_index: 1
  explanation: 地理空間數據（交通擁堵）必須結合地圖展示才具意義，熱力圖能清楚顯示擁堵路段（紅區）。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  id: 5462
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：相關係數矩陣 (Correlation Matrix) 通常搭配哪種圖表來視覺化，以便快速識別高相關性的變數對？
  type: multiple_choice
  options:
  - 折線圖 (Line Chart)
  - 熱力圖 (Heatmap)，利用顏色深淺表示相關係數的大小
  - 圓餅圖 (Pie Chart)
  - 雷達圖 (Radar Chart)
  correct_index: 1
  explanation: 熱力圖利用顏色深淺表示相關係數的大小（如深紅代表高度正相關），讓分析師能快速從矩陣中識別出關鍵變數。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5463
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：根據完形心理學 (Gestalt Principles) 的「鄰近性」原則，在設計儀表板時應該？
  type: multiple_choice
  options:
  - 將相關的圖表或指標靠在一起擺放，形成群組感 (Grouping)
  - 將所有圖表隨機打散在版面上
  - 使用五顏六色的背景來區分
  - 把字體縮小以節省空間
  correct_index: 0
  explanation: 鄰近性原則指出，人類傾向將距離相近的物體視為一組。利用此原則可以有效地組織資訊區塊。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  id: 5464
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：Kibana 是專門為了配合哪個資料庫而設計的視覺化工具？
  type: multiple_choice
  options:
  - MySQL 關聯式資料庫
  - Elasticsearch 搜尋引擎與資料庫
  - MongoDB 文件資料庫
  - Redis 記憶體快取資料庫
  correct_index: 1
  explanation: Kibana 是 ELK Stack (Elasticsearch, Logstash, Kibana) 的一部分，專門用於搜尋、檢視與分析存儲在
    Elasticsearch 中的數據。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5465
  usage: both
