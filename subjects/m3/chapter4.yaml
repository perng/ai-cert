- chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 情境：工廠經理需要即時監控數百台設備的健康狀態，並希望能快速識別出故障風險高的區域。最適合的視覺化方式是？
  type: multiple_choice
  options:
  - 閱讀包含數千行數據的 Excel 表格
  - 設備狀態熱力圖 (Heatmap)，利用顏色深淺表示健康度或故障風險
  - 使用圓餅圖展示設備類別比例
  - 閱讀詳細的文字維修報告
  correct_index: 1
  explanation: 熱力圖能利用顏色深淺直觀地呈現大量設備的狀態分佈，讓管理者一眼識別出「紅區」（高風險區）。
  tags:
