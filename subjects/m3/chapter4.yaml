  id: 5451
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：為了避免「圖表垃圾 (Chart Junk)」干擾閱讀，你應該移除下列何者？
  type: multiple_choice
  options:
  - 必要的座標軸標籤 (Axis Labels)
  - 幫助理解數據的圖例 (Legend)
  - 過多的裝飾性 3D 效果、陰影與網格線 (Chart Junk)
  - 圖表的標題 (Title)
  correct_index: 2
  explanation: 簡潔原則強調去除不增加資訊量的裝飾。3D 效果常導致透視扭曲，影響數值判讀，應盡量避免。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  id: 5452
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：使用者抱怨儀表板資訊太多，找不到重點。為了改善體驗，你引入了「鑽取 (Drill-down)」功能。這意味著？
  type: multiple_choice
  options:
  - 隨機刪除一半的數據以簡化顯示
  - 提供從總覽層級 (Overview) 點擊進入細節層級 (Details) 的互動能力
  - 單純把字體放大以利閱讀
  - 無限制地增加更多圖表到頁面上
  correct_index: 1
  explanation: 鑽取功能允許使用者先看宏觀總覽，有需要時再點擊深入查看微觀細節，有效解決資訊過載問題。
