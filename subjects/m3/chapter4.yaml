questions:
- id: 5401
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 在視覺化設計中，完形心理學 (Gestalt Principles) 的「鄰近性 (Proximity)」原則是指？
  type: multiple_choice
  options:
  - 顏色相似的物體被視為一組
  - 距離近的物體會被大腦自動歸類為同一組
  - 形狀相同的物體被視為一組
  - 最大的物體最重要
  correct_index: 1
  explanation: 利用鄰近性，我們可以透過調整元素間的空白，不需加框線就能讓讀者感知到哪些圖表或數據是相關的。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5402
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 箱型圖 (Box Plot) 中的「箱子」上下緣分別代表？
  type: multiple_choice
  options:
  - 最大值與最小值
  - 第一四分位數 (Q1) 與第三四分位數 (Q3)
  - 平均值與標準差
  - 中位數與眾數
  correct_index: 1
  explanation: 箱子包含了數據中間 50% 的部分 (IQR)，箱子的高度反映了數據的分散程度。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5403
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 核密度估計圖 (KDE) 相比於直方圖 (Histogram) 的優點是？
  type: multiple_choice
  options:
  - 更容易繪製
  - 提供平滑的機率密度曲線，能更直觀地觀察分佈形狀 (如雙峰)
  - 能顯示更多數據點
  - 適合離散變數
  correct_index: 1
  explanation: 直方圖受分箱 (Bin) 數量影響大，KDE 則提供連續的曲線，更容易看出數據潛在的分佈模式。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5404
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 熱力圖 (Heatmap) 最適合用於展示什麼類型的數據？
  type: multiple_choice
  options:
  - 單一變數的趨勢
  - 二維矩陣數據 (如相關係數矩陣、時間-類別數據) 的模式或聚類
  - 地理位置
  - 文字內容
  correct_index: 1
  explanation: 透過顏色的深淺，熱力圖能讓矩陣中的高值（熱區）與低值（冷區）一目了然。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5405
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 哪種色彩方案適合用於展示正負值或偏差 (如盈虧、溫度偏差)？
  type: multiple_choice
  options:
  - 順序色 (Sequential)
  - 發散色 (Diverging)
  - 分類色 (Categorical)
  - 單色
  correct_index: 1
  explanation: 發散色通常由兩種對比色組成（如紅-藍），中間為白色或中性色，非常適合強調兩極化的數值。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5406
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Plotly 相比於 Matplotlib 的主要優勢是？
  type: multiple_choice
  options:
  - 語法更簡單
  - 支援互動性 (Interactivity)，如縮放、懸停提示、平移
  - 運算速度更快
  - 支援 3D 繪圖
  correct_index: 1
  explanation: Plotly 生成的是網頁元素 (HTML/JS)，使用者可以直接在圖表上操作，非常適合網頁展示與儀表板。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: quiz
- id: 5407
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 根據 F 型瀏覽模式 (F-Pattern)，儀表板中最重要的 KPI 應放置在？
  type: multiple_choice
  options:
  - 右下角
  - 左上角或頂部
  - 正中間
  - 隨機位置
  correct_index: 1
  explanation: 這是使用者的視覺起點，放置核心指標能確保它們第一時間被看到。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: quiz
- id: 5408
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: BAN (Big Angry Number) 在儀表板設計中指的是？
  type: multiple_choice
  options:
  - 生氣的表情符號
  - 以大字體、醒目顏色顯示的關鍵績效指標 (KPI) 數字
  - 錯誤訊息
  - 頁碼
  correct_index: 1
  explanation: BAN 強調「數字本身」就是視覺主體，讓決策者一眼就能掌握當前的核心狀況（如總營收）。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: quiz
- id: 5409
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 「鑽取 (Drill-down)」功能允許使用者？
  type: multiple_choice
  options:
  - 刪除數據
  - 從總覽層級深入查看更細節的數據 (如從「年」點擊進入「月」)
  - 修改數據
  - 匯出圖片
  correct_index: 1
  explanation: 鑽取是互動式儀表板的核心，滿足了「先看全貌，再查細節」的分析需求。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: quiz
- id: 5410
  chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 在製造業中，儀表圖 (Gauge) 通常用於顯示？
  type: multiple_choice
  options:
  - 銷售趨勢
  - 設備健康度或產能達成率 (類似汽車儀表板)
  - 員工出勤
  - 庫存量
  correct_index: 1
  explanation: 儀表圖直觀地顯示當前數值是否在安全範圍（綠區）或危險範圍（紅區）。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  usage: quiz
- id: 5411
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Tableau 的主要優勢在於？
  type: multiple_choice
  options:
  - 免費開源
  - 強大的拖拉式介面與跨資料源整合能力，適合快速建立互動式儀表板
  - 專注於程式碼繪圖
  - 只能處理 Excel
  correct_index: 1
  explanation: Tableau 降低了視覺化門檻，讓非技術人員也能透過拖拉 (Drag-and-Drop) 輕鬆探索數據。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5412
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 相關係數矩陣 (Correlation Matrix) 通常搭配哪種圖表呈現最直觀？
  type: multiple_choice
  options:
  - 長條圖
  - 熱力圖 (Heatmap)
  - 圓餅圖
  - 散佈圖
  correct_index: 1
  explanation: 熱力圖用顏色深淺代表相關係數大小（如深紅代表強正相關），能快速識別變數間的關係模式。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5413
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Grafana 最常搭配哪個資料庫使用？
  type: multiple_choice
  options:
  - MySQL
  - Prometheus 或 InfluxDB (時序資料庫)
  - MongoDB
  - Redis
  correct_index: 1
  explanation: Grafana 專精於時序監控，Prometheus 是其在雲原生監控領域的最佳拍檔。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5414
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 為了讓 KPI 數字更有意義，通常需要提供？
  type: multiple_choice
  options:
  - 更多顏色
  - 情境 (Context)，如與目標比較或與歷史同期比較 (YoY, MoM)
  - 更大的字體
  - 背景音樂
  correct_index: 1
  explanation: 孤立的數字（如 "100萬"）沒有意義。知道 "比去年成長 20%" 或 "達成率 50%" 才能判斷好壞。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: both
- id: 5415
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 散佈圖 (Scatter Plot) 主要用於展示？
  type: multiple_choice
  options:
  - 數據分佈
  - 兩個連續變數之間的關係 (如相關性、聚類)
  - 時間趨勢
  - 組成比例
  correct_index: 1
  explanation: 散佈圖是觀察變數關聯性（如身高 vs 體重）最直接的工具。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5416
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Seaborn 是一個基於什麼的 Python 繪圖庫？
  type: multiple_choice
  options:
  - D3.js
  - Matplotlib
  - Plotly
  - Bokeh
  correct_index: 1
  explanation: Seaborn 封裝了 Matplotlib，提供了更美觀的預設樣式和更高級的統計繪圖 API。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5417
  chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 在金融詐欺偵測中，散佈圖常用於？
  type: multiple_choice
  options:
  - 顯示總交易額
  - 識別離群點 (Outliers)，即潛在的異常交易
  - 顯示客戶分佈
  - 顯示股價趨勢
  correct_index: 1
  explanation: 詐欺交易通常在金額或頻率上與正常交易顯著不同，在散佈圖上會表現為遠離群體的孤立點。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  usage: both
- id: 5418
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 「前注意屬性 (Preattentive Attributes)」是指？
  type: multiple_choice
  options:
  - 需要仔細思考才能理解的屬性
  - 人腦能在此意識下瞬間處理的視覺特徵 (如顏色、大小、位置)，可用於引導注意力
  - 文字屬性
  - 聲音屬性
  correct_index: 1
  explanation: 利用紅色標註異常值，讀者不需閱讀數值就能瞬間注意到，這就是前注意屬性的應用。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: both
- id: 5419
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 圓餅圖 (Pie Chart) 在視覺化中通常被建議？
  type: multiple_choice
  options:
  - 大量使用
  - 謹慎使用，因為人類對面積和角度的比較能力不如長度 (長條圖)
  - 用於展示趨勢
  - 用於展示關係
  correct_index: 1
  explanation: 除非類別很少且差異明顯，否則長條圖通常比圓餅圖更能精確傳達比例差異。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5420
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: GeoPandas 主要用於處理？
  type: multiple_choice
  options:
  - 3D 模型
  - 地理空間數據 (Geospatial Data)
  - 時間序列
  - 文字數據
  correct_index: 1
  explanation: GeoPandas 擴展了 Pandas，增加了對幾何圖形 (Geometry) 的支援，是 Python 空間分析的標準工具。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5421
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 簡潔原則 (Simplicity) 建議去除圖表中的 "Chart Junk"，例如？
  type: multiple_choice
  options:
  - 標題
  - 座標軸標籤
  - 不必要的 3D 效果、過多的網格線或裝飾性圖片
  - 數據點
  correct_index: 2
  explanation: 任何不增加資訊量但增加認知負擔的元素都應移除，讓數據本身說話。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5422
  chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 智慧城市中，地理熱力圖常用於展示？
  type: multiple_choice
  options:
  - 建築高度
  - 交通擁堵或空氣污染的空間分佈密度
  - 地下管線
  - 人口年齡
  correct_index: 1
  explanation: 熱力圖能直觀呈現「哪裡最塞」或「哪裡最髒」，輔助城市治理決策。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  usage: both
- id: 5423
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 順序色 (Sequential Colors) 適合用於？
  type: multiple_choice
  options:
  - 區分不同類別 (如蘋果、香蕉)
  - 表示數值的大小或密度 (如人口密度)
  - 表示正負偏差
  - 隨機裝飾
  correct_index: 1
  explanation: 單一色相的深淺變化（如淺藍到深藍）自然地對應數值的小到大。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5424
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Kibana 是專為哪個資料庫設計的視覺化工具？
  type: multiple_choice
  options:
  - MySQL
  - Elasticsearch
  - MongoDB
  - PostgreSQL
  correct_index: 1
  explanation: ELK Stack (Elasticsearch, Logstash, Kibana) 是日誌分析的黃金組合，Kibana 負責前端展示。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5425
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 懸停提示 (Tooltips) 的作用是？
  type: multiple_choice
  options:
  - 隱藏數據
  - 當滑鼠移過數據點時，顯示精確的數值或額外資訊
  - 播放音效
  - 放大圖表
  correct_index: 1
  explanation: Tooltips 解決了「圖表看趨勢，滑鼠看細節」的需求，保持介面整潔的同時提供詳細資訊。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: both
- id: 5426
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 堆疊長條圖 (Stacked Bar Chart) 適合用於？
  type: multiple_choice
  options:
  - 比較總量以及各組成的比例
  - 觀察數據分佈
  - 分析相關性
  - 監控即時趨勢
  correct_index: 0
  explanation: 例如展示各分店的總銷售額，同時在柱子內區分不同產品線的貢獻。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5427
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Power BI 最適合的應用環境是？
  type: multiple_choice
  options:
  - Linux 伺服器
  - 深度整合 Microsoft 生態系 (Excel, Azure) 的企業環境
  - 純開源專案
  - Mac 用戶
  correct_index: 1
  explanation: Power BI 與 Office 365 無縫整合，是許多使用 Windows 的企業首選 BI 工具。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5428
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 分類色 (Categorical Colors) 應具備什麼特性？
  type: multiple_choice
  options:
  - 顏色要有明顯的深淺順序
  - 顏色之間應有明顯區別，且不隱含順序關係
  - 只能用黑白
  - 必須是漸層色
  correct_index: 1
  explanation: 用於區分「男/女」或「北/中/南」等類別，顏色應容易辨識且地位平等。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5429
  chapter_title: 資料視覺化與報告
  section_title: 產業應用案例
  text: 在零售業中，折線圖常用於分析？
  type: multiple_choice
  options:
  - 產品庫存
  - 銷售額隨時間的趨勢與週期性 (如週末效應)
  - 顧客性別比例
  - 員工滿意度
  correct_index: 1
  explanation: 時間序列分析是零售業預測需求、安排庫存的基礎。
  tags:
  - chap-m3-ch4
  - sec-industry-apps
  usage: both
- id: 5430
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: Apache Superset 的特點是？
  type: multiple_choice
  options:
  - 只能畫簡單圖表
  - 支援 SQL 查詢，適合處理大規模數據，且為開源軟體
  - 收費昂貴
  - 不支援儀表板
  correct_index: 1
  explanation: Superset 是 Airbnb 開源的企業級 BI 工具，對 SQL 支援極佳，適合數據工程師與分析師。
  tags:
  - chap-m3-ch4
  - sec-viz-principles
  usage: both
- id: 5431
  chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 「用數據說故事 (Storytelling with Data)」強調？
  type: multiple_choice
  options:
  - 編造假數據
  - 結合情境 (Context)、視覺引導與行動建議，讓數據產生影響力
  - 只展示數據，不給解釋
  - 使用大量文字
  correct_index: 1
  explanation: 好的分析報告不僅呈現 "What"（數據），更要解釋 "So What"（意義）和 "Now What"（行動）。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  usage: both
- id: 5432
  chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
