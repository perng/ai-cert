  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
- id: 5445
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你想展示兩個變數之間的相關性，但數據點高達一千萬個，直接畫散佈圖會變成一團黑（Overplotting）。你該怎麼辦？
  type: multiple_choice
  options:
  - 使用熱力圖 (Heatmap) 或六角形分箱圖 (Hexbin Plot) 來展示數據密度，或者進行降採樣 (Downsampling)
  - 只隨機抽取前 100 個點進行繪製
  - 放棄繪製圖表，直接展示原始數據表格
  - 堅持畫散佈圖，忽略重疊問題
  correct_index: 0
  explanation: 當數據量過大時，點會重疊在一起無法辨識。將空間劃分為網格（熱力圖/Hexbin）並用顏色表示每個網格內的點數量，能有效解決 Overplotting 問題並展示密度分佈。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
