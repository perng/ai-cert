  - 疊加在地圖上的地理熱力圖 (Geo Heatmap)
  - 箱型圖
  - 文字列表
  correct_index: 1
  explanation: 地理空間數據（交通擁堵）必須結合地圖展示才具意義，熱力圖能清楚顯示擁堵路段（紅區）。
