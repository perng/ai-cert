  section_title: 視覺化原則與工具
  text: 情境：若要展示某個變數的機率密度分佈，且希望比直方圖更平滑、更易於觀察分佈形狀（如雙峰）。應使用？
  type: multiple_choice
  options:
  - 長條圖
  - 核密度估計圖 (KDE)
  - 圓餅圖
  - 樹狀圖
  correct_index: 1
  explanation: KDE (Kernel Density Estimation) 透過平滑化技術估計機率密度函數，能比受限於 bin 寬度的直方圖更精確地描述數據分佈。
