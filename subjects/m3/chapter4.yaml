- id: 5441
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你製作了一張展示全公司 50 個部門業績的圓餅圖，結果被老闆批評「看不懂」。為什麼？你應該改用什麼圖表？
  type: multiple_choice
  options:
  - 顏色不夠鮮豔；應加強配色以吸引注意力
  - 類別過多導致圓餅圖切片太細，難以比較大小。應改用長條圖 (Bar Chart) 並排序
  - 應該改用 3D 圓餅圖以增加立體感
  - 應該改用散佈圖來展示數據分佈
  correct_index: 1
  explanation: 圓餅圖不適合展示超過 5-7 個類別的數據。當類別眾多時，長條圖能提供更清晰的線性比較與排序，閱讀效率遠高於圓餅圖。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
- id: 5442
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你需要設計一個戰情室儀表板，供 CEO 每天早上花 30 秒快速掌握公司營運狀況。你應該採用哪種佈局策略？
  type: multiple_choice
  options:
  - 將所有詳細報表塞進去，確保資訊完整
  - 採用 F 型佈局，將最關鍵的 KPI (如營收、利潤) 以 BAN (大數字卡片) 形式放在頂部或左上角，並加上趨勢指標
  - 將最重要的資訊放在右下角，因為那是視線的終點
  - 使用大量裝飾性圖片以美化版面
  correct_index: 1
  explanation: 高階主管時間寶貴。F 型佈局符合人類視覺動線，BAN 能瞬間傳遞核心訊息，趨勢指標則提供必要的上下文（變好還是變壞）。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
- id: 5443
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你發現某個異常值在箱型圖中被標示出來，但在直方圖中卻看不清楚。這是為什麼？
  type: multiple_choice
  options:
  - 直方圖的分箱 (Bin) 可能太寬，將異常值與正常值合併了；而箱型圖明確定義了離群點 (1.5 * IQR)
  - 箱型圖的繪製演算法可能有誤
  - 直方圖根本不適合用於展示數據分佈
  - 數據量太少導致圖表顯示異常
  correct_index: 0
  explanation: 箱型圖對異常值非常敏感且有明確定義。直方圖的形狀高度依賴於分箱寬度，不當的分箱可能會掩蓋細節或異常。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
- id: 5444
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你的團隊需要一個能即時監控數千台伺服器 CPU 溫度的儀表板，且需要設定警報。你會推薦哪個工具組合？
  type: multiple_choice
  options:
  - 使用 Excel 記錄數據並用 PowerPoint 製作報告
  - Prometheus (收集指標) + Grafana (視覺化與警報)
  - 使用 Tableau 進行視覺化分析
  - 使用 Python 的 Matplotlib 庫繪製靜態圖表
  correct_index: 1
  explanation: 對於 IT 基礎設施監控，Prometheus + Grafana 是業界標準。Grafana 專為時序數據設計，更新頻率高，且內建強大的警報系統。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
- id: 5445
  chapter_title: 資料視覺化與報告
  section_title: 深度思考情境題
  text: 情境：你想展示兩個變數之間的相關性，但數據點高達一千萬個，直接畫散佈圖會變成一團黑（Overplotting）。你該怎麼辦？
  type: multiple_choice
  options:
  - 只隨機抽取前 100 個點進行繪製
  - 使用熱力圖 (Heatmap) 或六角形分箱圖 (Hexbin Plot) 來展示數據密度，或者進行降採樣 (Downsampling)
  - 堅持畫散佈圖，忽略重疊問題
  - 放棄繪製圖表，直接展示原始數據表格
  correct_index: 1
  explanation: 當數據量過大時，點會重疊在一起無法辨識。將空間劃分為網格（熱力圖/Hexbin）並用顏色表示每個網格內的點數量，能有效解決 Overplotting
    問題並展示密度分佈。
  tags:
  - chap-m3-ch4
  - sec-scenario
  usage: mock
