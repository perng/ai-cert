- chapter_title: 資料視覺化與報告
  section_title: 建立有效的儀表板
  text: 情境：在展示 KPI 時，單純顯示「營收 100 萬」是不夠的。為了提供情境 (Context)，你應該加上？
  type: multiple_choice
  options:
  - 驚嘆號
  - 比較基準 (如 MoM, YoY 或目標達成率)
  - 背景音樂
  - 更多顏色
  correct_index: 1
  explanation: 沒有比較的數字沒有意義。加上與上月 (MoM) 或去年同期 (YoY) 的比較，才能判斷 100 萬是好是壞。
  tags:
  - chap-m3-ch4
  - sec-dashboards
  id: 5460
  usage: both
- chapter_title: 資料視覺化與報告
  section_title: 視覺化原則與工具
  text: 情境：Tableau 與 Python (Matplotlib) 的主要區別在於？
  type: multiple_choice
  options:
  - Tableau 是免費的
  - Tableau 是拖拉式 BI 工具，適合快速探索與互動；Python 是程式語言，適合高度客製化與自動化
  - Python 不能畫圖
  - Tableau 只能畫圓餅圖
  correct_index: 1
  explanation: Tableau 強調無程式碼 (No-code) 的互動式分析，適合商業分析師；Python 則提供程式碼級別的控制，適合資料科學家整合分析流程。
  tags:
