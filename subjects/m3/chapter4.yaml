      資料的欄位概觀如下：'
  - type: image
    src: assets/images/q43_47_vgsales_head.png
    alt: VGSales dataset overview
  - type: text
    text: 第 45 題
  - type: text
    text: '為了觀察各遊戲平台的市場表現，分析師想要統計每個平台的全球銷售總額，並以長條圖呈現。請選出最能正確實現此分析的程式碼。


      (114年第二梯次)'
  type: multiple_choice
  options:
  - '`data.groupby("Platform")["Global_Sales"].sum().plot(kind="bar")`'
  - '`data.groupby("Platform")["Global_Sales"].count().plot(kind="bar")`'
  - '`data["Platform"].value_counts().plot(kind="bar")`'
  - '`data.groupby("Platform")["Global_Sales"].mean().plot(kind="bar")`'
  correct_index: 0
  explanation: 要統計每個平台的全球銷售總額，應先 groupby Platform，再對 Global_Sales 做 sum，最後用 bar plot 呈現；count 或 mean 不是總額。
