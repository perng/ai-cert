  text: 情境：懸停提示 (Tooltips) 的作用是？
  type: multiple_choice
  options:
  - 永久刪除圖表
  - 當滑鼠移過數據點時，顯示詳細的數值或資訊
  - 放大整個圖表區域
  - 隱藏敏感數據以保護隱私
  correct_index: 1
  explanation: 在不佔用版面的情況下提供細節資訊。
