questions:
- id: 4501
  chapter_title: 系統部署與 MLOps
  section_title: MLOps 核心概念
  text: MLOps 的主要目標是？
  type: multiple_choice
  options:
  - 減少數據量 (Reduce Data Volume)
  - 降低硬體成本 (Reduce Hardware Cost)
  - 增加模型複雜度 (Increase Model Complexity)
  - 整合開發 (Development) 與營運 (Operations) (Integrate Dev & Ops)
  correct_index: 3
  explanation: MLOps 借鑑 DevOps 理念，旨在解決 AI 模型從實驗室到生產環境的「最後一哩路」問題，確保高效、穩定的交付。
  tags:
  - chap-m2-ch5
  - sec-mlops-core
  usage: quiz
- id: 4502
  chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 邊緣運算 (Edge Computing) 的主要優勢是？
  type: multiple_choice
  options:
  - 運算能力最強 (Highest Compute Power)
  - 維護最簡單 (Simplest Maintenance)
  - 低延遲、保護隱私 (數據不出設備)、節省頻寬 (Low Latency, Privacy, Bandwidth Saving)
  - 儲存空間無限 (Infinite Storage)
  correct_index: 2
  explanation: 將計算移至數據源頭（如手機、IoT），避免了將數據傳回雲端的延遲與隱私風險。
  tags:
  - chap-m2-ch5
  - sec-deployment-strategies
  usage: quiz
- id: 4503
  chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 哪種部署策略最適合對資料隱私高度敏感的金融或醫療機構？
  type: multiple_choice
  options:
  - 混合部署 (Hybrid Deployment)
  - 公有雲部署 (Public Cloud) (Public Cloud)
  - 私有雲部署 (Private Cloud) (Private Cloud)
  - 邊緣部署 (Edge Deployment)
  correct_index: 2
  explanation: 私有雲提供專屬的基礎設施，企業能完全掌控資料流向與安全政策，符合嚴格的合規要求。
  tags:
  - chap-m2-ch5
  - sec-deployment-strategies
  usage: quiz
- id: 4504
  chapter_title: 系統部署與 MLOps
  section_title: 微服務架構 (Microservices Architecture)
  text: 微服務架構 (Microservices) 的核心特點是？
  type: multiple_choice
  options:
  - 不使用 API (No API)
  - 只能使用 Python 開發 (Python Only)
  - 所有功能打包在一個巨大程式中 (Monolithic) (Monolithic Architecture)
  - 將應用程式拆解為一組小型、獨立部署且單一職責的服務 (Decoupled Microservices)
  correct_index: 3
  explanation: 微服務強調解耦，每個服務獨立運行、獨立擴展，提升了系統的靈活性與容錯能力。
  tags:
  - chap-m2-ch5
  - sec-microservices
  usage: quiz
- id: 4505
  chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: API Gateway 在 AI 系統中的作用是？
  type: multiple_choice
  options:
  - 統一管理外部請求，負責流量控管、身份驗證與日誌記錄 (Traffic Control, Auth, Logging)
  - 訓練模型 (Train Model)
  - 儲存數據 (Store Data)
  - 清洗數據 (Clean Data)
  correct_index: 0
  explanation: API Gateway 是系統的大門，保護後端微服務不直接暴露，並提供統一的接入點與安全管理。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  usage: quiz
- id: 4506
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 持續整合 (CI) 中的「自動化測試」通常不包括？
  type: multiple_choice
  options:
  - 人工手動測試 (Manual Testing)
  - 模型評估 (Model Evaluation) (Model Evaluation)
  - 數據驗證 (Data Validation) (Data Validation)
  - 單元測試 (Unit Test) (Unit Test)
  correct_index: 0
  explanation: CI 強調「自動化」。凡是需要人工介入的測試都不屬於自動化測試範疇，會拖慢整合速度。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: quiz
- id: 4507
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 藍綠部署 (Blue-Green Deployment) 的運作方式是？
  type: multiple_choice
  options:
  - 同時運行新舊兩個版本，確認新版無誤後瞬間切換流量 (Parallel Versions & Switch)
  - 直接覆蓋舊版本 (Overwrite Old Version)
  - 只讓 5% 用戶使用新版 (Canary Deployment)
  - 隨機部署 (Random Deployment)
  correct_index: 0
  explanation: 藍綠部署透過並行環境實現零停機 (Zero Downtime) 更新，且若新版有問題可隨時切回舊版。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: quiz
- id: 4508
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 概念漂移 (Concept Drift) 是指？
  type: multiple_choice
  options:
  - 模型參數改變 (Parameter Change)
  - 硬體老化 (Hardware Aging)
  - 輸入與輸出之間的映射關係發生根本性變化 (Concept Drift)
  - 輸入數據的分佈改變 (Data Drift)
  correct_index: 2
  explanation: 例如，「垃圾郵件」的定義隨時間改變（駭客換手法），即使輸入數據特徵沒變，舊模型的判斷邏輯也失效了。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: quiz
- id: 4509
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 常用的開源監控與視覺化工具組合是？
  type: multiple_choice
  options:
  - Word + Excel (Office Tools)
  - Prometheus + Grafana (Monitoring & Visualization)
  - Notepad + Paint (Basic Tools)
  - Photoshop + Illustrator (Design Tools)
  correct_index: 1
  explanation: Prometheus 負責收集時間序列數據（指標），Grafana 負責將這些數據繪製成漂亮的儀表板。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: quiz
- id: 4510
  chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: 系統層級的關鍵效能指標 (KPI) 包括？
  type: multiple_choice
  options:
  - 召回率 (Recall) (Recall)
  - 準確率 (Accuracy) (Accuracy)
  - 推論延遲 (Latency) 與吞吐量 (Throughput) (Latency & Throughput)
  - 投資報酬率 (ROI) (ROI)
  correct_index: 2
  explanation: 系統層級關注「跑得快不快、穩不穩」，而非模型「準不準」（那是應用層級）。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  usage: quiz
- id: 4511
  chapter_title: 系統部署與 MLOps
  section_title: 微服務架構 (Microservices Architecture)
  text: Docker 容器化技術在微服務中的主要好處是？
  type: multiple_choice
  options:
  - 提高運算速度 (Increase Speed)
  - 確保環境一致性，實現「一次構建，到處運行」 (Environment Consistency)
  - 減少硬碟空間 (Reduce Disk Space)
  - 自動寫程式 (Auto Coding)
  correct_index: 1
  explanation: Docker 將程式碼與依賴環境打包，解決了依賴衝突問題，是微服務部署的標準載體。
  tags:
  - chap-m2-ch5
  - sec-microservices
  usage: both
- id: 4512
  chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: RESTful API 通常使用哪種格式傳輸數據？
  type: multiple_choice
  options:
  - Binary (Binary Format)
  - CSV (Comma-Separated Values)
  - JSON (JavaScript Object Notation)
  - XML (Extensible Markup Language)
  correct_index: 2
  explanation: JSON (JavaScript Object Notation) 輕量且易讀，是現代 Web API 最通用的資料交換格式。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  usage: both
- id: 4513
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 金絲雀部署 (Canary Deployment) 的名稱由來是？
  type: multiple_choice
  options:
  - 金絲雀飛得快 (Fast Bird)
  - 金絲雀喜歡唱歌 (Singing Bird)
  - 礦工帶金絲雀下礦坑偵測瓦斯 (Canary in Coal Mine)
  - 金絲雀很漂亮 (Pretty Bird)
  correct_index: 2
  explanation: 就像礦工用金絲雀偵測危險，軟體部署先讓小部分用戶試用新版（當白老鼠），若無問題才全面開放。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: both
- id: 4514
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 自動重新訓練 (Auto-retraining) 通常在什麼情況下觸發？
  type: multiple_choice
  options:
  - 手動觸發 (Manual Trigger)
  - 每天固定時間 (Scheduled Time)
  - 偵測到顯著的模型漂移或數據漂移時 (Drift Detection)
  - 隨機觸發 (Random Trigger)
  correct_index: 2
  explanation: 這是 MLOps 的閉環關鍵。當監控指標顯示模型「過期」了，系統自動啟動再訓練以維持效能。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: both
- id: 4515
  chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: 回饋迴圈 (Feedback Loop) 的作用是？
  type: multiple_choice
  options:
  - 減少數據量 (Reduce Data)
  - 增加系統負載 (Increase Load)
  - 收集實際運行數據與錯誤樣本，作為下一次模型迭代的養分 (Data Collection for Iteration)
  - 讓用戶投訴 (User Complaints)
  correct_index: 2
  explanation: AI 系統不是靜態的。透過收集真實世界的反饋（特別是模型做錯的案例），持續訓練，模型才會越來越聰明。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  usage: both
- id: 4516
  chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: JWT (JSON Web Token) 主要用於？
  type: multiple_choice
  options:
  - 模型訓練 (Model Training)
  - 身份驗證與授權 (Authentication & Authorization) (Auth & Auth)
  - 數據壓縮 (Data Compression)
  - 數據加密 (Data Encryption)
  correct_index: 1
  explanation: JWT 是一種無狀態的認證機制，廣泛用於 API 的身份驗證，確保只有合法用戶能存取服務。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  usage: both
- id: 4517
  chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 混合部署 (Hybrid Deployment) 通常結合了？
  type: multiple_choice
  options:
  - 公有雲、私有雲或邊緣架構 (Cloud & Edge Mix)
  - 手機和電腦 (Device Mix)
  - 軟體和硬體 (Soft & Hard Mix)
  - Windows 和 Linux (OS Mix)
  correct_index: 0
  explanation: 混合架構能靈活運用各方優勢，例如在雲端訓練（算力強），在邊緣推論（速度快）。
  tags:
  - chap-m2-ch5
  - sec-deployment-strategies
  usage: both
- id: 4518
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 持續交付 (Continuous Delivery) 與持續部署 (Continuous Deployment) 的主要差異在於？
  type: multiple_choice
  options:
  - 是否自動化測試 (Automated Testing)
  - 部署到生產環境前是否需要「人工審核」 (Manual Approval)
  - 使用的工具不同 (Different Tools)
  - 針對的語言不同 (Different Languages)
  correct_index: 1
  explanation: 持續交付在部署到 Production 前會停下來等人工按鈕確認；持續部署則是全自動，測試過了就直接上線。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: both
- id: 4519
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 數據漂移 (Data Drift) 的一個例子是？
  type: multiple_choice
  options:
  - 訓練數據是夏天的銷量，預測時卻是冬天 (Seasonal Drift)
  - 硬碟壞軌 (Disk Failure)
  - 程式碼 Bug (Code Bug)
  - 網路斷線 (Network Disconnect)
  correct_index: 0
  explanation: 季節變化導致數據分佈改變（夏天賣冰，冬天賣火鍋），模型若沒更新就會預測失準。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: both
- id: 4520
  chapter_title: 系統部署與 MLOps
  section_title: 微服務架構 (Microservices Architecture)
  text: Kubernetes (K8s) 的主要功能是？
  type: multiple_choice
  options:
  - 編輯圖片 (Editing Images)
  - 寫程式 (Writing Code)
  - 訓練模型 (Train Model)
  - 容器編排與管理 (Orchestration)，負責自動部署、擴展與管理容器化應用 (Container Orchestration)
  correct_index: 3
  explanation: K8s 是管理大規模 Docker 容器叢集的標準工具，確保服務的高可用性與自動擴展。
  tags:
  - chap-m2-ch5
  - sec-microservices
  usage: both
- id: 4521
  chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: Service Mesh 的作用是？
  type: multiple_choice
  options:
  - 作為微服務間的通訊基礎設施，管理服務發現、負載均衡與安全 (Service Communication Infrastructure)
  - 訓練神經網路 (Train Neural Network)
  - 清洗數據 (Clean Data)
  - 繪製 3D 網格 (3D Mesh)
  correct_index: 0
  explanation: 在複雜的微服務架構中，Service Mesh（如 Istio）接管了服務間的通訊邏輯，讓開發者專注於業務邏輯。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  usage: both
- id: 4522
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: DVC (Data Version Control) 用於管理？
  type: multiple_choice
  options:
  - 作業系統版本 (OS Version)
  - 文件版本 (Doc Version)
  - 程式碼版本 (Code Version)
  - 數據與模型的版本 (Data & Model Version)
  correct_index: 3
  explanation: Git 不適合管理大檔案。DVC 專為機器學習設計，能追蹤數據集與模型檔案的變更歷史。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: both
- id: 4523
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 為了檢測模型是否過時，我們主要監控？
  type: multiple_choice
  options:
  - 模型效能指標 (如準確率、F1-Score) 的變化趨勢 (Performance Metrics Trend)
  - 硬碟剩餘空間 (Disk Space)
  - CPU 溫度 (CPU Temperature)
  - 記憶體使用量 (Memory Usage)
  correct_index: 0
  explanation: 當準確率隨時間顯著下降，就是模型漂移的警訊，提示需要重新訓練。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: both
- id: 4524
  chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: A/B 測試在模型部署中的目的是？
  type: multiple_choice
  options:
  - 隨機選擇 (Random Choice)
  - 測試 A 和 B 兩個工程師的能力 (Test Engineers)
  - 比較兩個模型版本在真實環境中的業務表現，以決定哪個更好 (Compare Business Performance)
  - 節省流量 (Save Bandwidth)
  correct_index: 2
  explanation: A/B 測試是驗證模型商業價值的黃金標準，讓數據說話。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  usage: both
- id: 4525
  chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: gRPC 相比於 RESTful API 的優勢是？
  type: multiple_choice
  options:
  - 更容易閱讀 (Easier to Read)
  - 支援瀏覽器 (Browser Support)
  - 基於 HTTP/2 和 Protobuf，傳輸效率更高，延遲更低 (High Efficiency & Low Latency)
  - 不需要定義介面 (No Interface Definition)
  correct_index: 2
  explanation: gRPC 使用二進位傳輸，效率遠高於文字格式的 JSON，適合內部微服務間的高頻通訊。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  usage: both
- id: 4526
  chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 雲端部署的一個潛在缺點是？
  type: multiple_choice
  options:
  - 算力不足 (Insufficient Compute)
  - 無法擴展 (Not Scalable)
  - 長期營運成本可能較高，且存在資料傳輸延遲 (High Cost & Latency)
  - 維護困難 (Hard to Maintain)
  correct_index: 2
  explanation: 雖然雲端彈性好，但持續的租賃費用與頻寬費用可能很驚人，且受限於網路速度。
  tags:
  - chap-m2-ch5
  - sec-deployment-strategies
  usage: both
- id: 4527
  chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: GitHub Actions 的設定檔通常使用什麼格式？
  type: multiple_choice
  options:
  - INI (INI)
  - JSON (JSON)
  - XML (XML)
  - YAML (YAML)
  correct_index: 3
  explanation: YAML 格式簡潔易讀，是現代 CI/CD 工具（如 GitHub Actions, GitLab CI）設定檔的主流格式。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  usage: both
- id: 4528
  chapter_title: 系統部署與 MLOps
  section_title: 微服務架構 (Microservices Architecture)
  text: 微服務架構的一個缺點是？
  type: multiple_choice
  options:
  - 只能用一種語言 (Single Language)
  - 系統太簡單 (Too Simple)
  - 無法擴展 (Not Scalable)
  - 分散式系統的複雜性增加 (如網路延遲、數據一致性問題) (Increased Complexity)
  correct_index: 3
  explanation: 服務拆分後，服務間的通訊、除錯、交易管理都變得比單體架構更複雜。
  tags:
  - chap-m2-ch5
  - sec-microservices
  usage: both
- id: 4529
  chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 持續訓練 (Continuous Training, CT) 是指？
  type: multiple_choice
  options:
  - 建立自動化機制，當數據更新或模型效能下降時，自動觸發重新訓練流程 (Automated Retraining)
  - 只訓練一次 (Train Once)
  - 模型 24 小時不停訓練 (Non-stop Training)
  - 人工手動訓練 (Manual Training)
  correct_index: 0
  explanation: CT 確保模型能適應環境變化，保持「新鮮」。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  usage: both
- id: 4530
  chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
