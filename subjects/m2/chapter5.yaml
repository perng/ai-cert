  section_title: 監控與維護
  text: 情境：運維團隊每天收到上百封「模型準確率微幅下降」的警報郵件，久而久之便不再理會，直到某天發生嚴重故障才發現。這現象稱為？
  type: multiple_choice
  options:
  - 自動化運維 (Automated Ops)
  - 系統優化 (System Optimization)
  - 警報疲勞 (Alert Fatigue) (Alert Fatigue)
  - 容錯機制 (Fault Tolerance)
  correct_index: 2
  explanation: 警報閾值設定不當或缺乏分級，會導致「狼來了」效應，使運維人員對警報麻痺，錯失真正重要的訊息。
