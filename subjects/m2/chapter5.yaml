- chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 情境：某跨國銀行需在多個國家部署 AI 信用評分系統，但各國法規要求資料不得出境。最合適的架構是？
  type: multiple_choice
  options:
  - 不做 AI (No AI)
  - 分散式私有雲或混合雲，資料在地化處理 (Distributed Private/Hybrid Cloud)
  - 全球單一公有雲 (Single Public Cloud)
  - 將資料全部傳回總部 (Send Data to HQ)
  correct_index: 1
  explanation: 針對資料主權 (Data Sovereignty) 要求，必須採用分散式架構，讓資料在當地運算，僅將模型參數或聚合結果傳輸。
