- chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: 情境：A/B 測試結果顯示，新模型 B 的點擊率比舊模型 A 高 5%，但伺服器 CPU 使用率卻高出 200%，導致回應變慢。作為 PM，你應如何決策？
  type: multiple_choice
  options:
  - 忽略 CPU 問題 (Ignore CPU)
  - 拒絕模型 B，或要求團隊優化其效能 (Latency/Throughput) 後再測試 (Reject & Optimize)
  - 購買更多伺服器 (Buy Servers)
  - 直接上線模型 B (Deploy B)
  correct_index: 1
  explanation: 模型上線不能只看業務指標（點擊率），必須同時考量系統指標（成本、延遲）。若成本暴增遠大於收益，則不是成功的優化。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  id: 4551
  usage: both
