- id: m2-114-2-042
  chapter_title: 系統部署與 MLOps
  section_title: 歷屆考題
  text: 若部署一個深度學習模型至金融風控系統，該模型採用鑑別式架構（如Transformer Classifier）。然而上線後，模型對新樣本的分類錯誤率顯著上升，經檢查發現，輸入資料分佈已與原訓練集明顯不同。針對此情形，下列哪一種應對策略最為適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 改用生成對抗網路（GAN）生成新樣本並混入訓練集
  - 改用邏輯迴歸模型（Logistic Regression）以提升穩定性
  - 增加模型容量（Model Capacity），以學習更多樣本差異
  - 使用變分自編碼器（VAE）監控潛在空間分佈，偵測輸入資料偏移
  correct_index: 3
  explanation: 線上資料分佈明顯偏移時，應建立漂移偵測；VAE 可學習訓練資料的潛在分佈，監控新資料在潛在空間中的偏離程度。
  tags:
  - chap-m2-ch5
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-046
  chapter_title: 系統部署與 MLOps
  section_title: 歷屆考題
  text: 某企業的AI 模型已部署於線上服務環境中，用於即時預測顧客流失機率。近期團隊注意到模型預測準確率逐漸下降，但系統運作正常且未出現錯誤訊息。經分析發現，近期輸入資料的分布與模型訓練資料相比出現顯著偏移。若要在MLOps 流程中主動偵測並預警此類問題，最應採用下列哪項措施？ (114年第二梯次)
  type: multiple_choice
  options:
  - 建立即時的資料漂移（Data Drift）與概念漂移（Concept Drift）監測機制
  - 將模型轉換為量化版本以降低延遲
  - 增加模型超參數調整次數以強化適應性
  - 使用固定隨機種子（Random Seed）確保訓練穩定
  correct_index: 0
  explanation: 模型準確率下降且輸入分佈偏移時，MLOps 應監控資料漂移與概念漂移，搭配告警與再訓練流程，而不是只調整系統效能。
  tags:
