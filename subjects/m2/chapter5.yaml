- id: 4541
  chapter_title: 系統部署與 MLOps
  section_title: 情境題
  text: 情境：你的團隊開發了一個推薦系統，線下測試準確率很高，但上線後用戶點擊率卻沒有提升。這可能是什麼原因？應如何調查？
  type: multiple_choice
  options:
  - 訓練數據與線上真實數據分佈不一致 (Training-Serving Skew) (Training-Serving Skew)
