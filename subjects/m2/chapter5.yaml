  section_title: AI 系統整合
  text: 情境：為了讓外部合作夥伴能呼叫公司的 AI 模型，但又不希望暴露內部網路結構。應配置哪個元件？
  type: multiple_choice
  options:
  - API Gateway (API Gateway)
  - 交換器 (Switch)
  - 負載平衡器 (Load Balancer)
  - 資料庫 (Database)
  correct_index: 0
  explanation: API Gateway 作為對外統一窗口，能隱藏後端微服務架構，並提供身份驗證、流量限制等安全保護。
