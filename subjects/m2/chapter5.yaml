- chapter_title: 系統部署與 MLOps
  section_title: 監控與維護
  text: 情境：一個房價預測模型在 2020 年訓練，2023 年預測準確率大跌。經查發現是因為通膨導致整體房價上漲。這屬於？
  type: multiple_choice
  options:
  - 概念漂移 (Concept Drift) (Concept Drift)
  - 過擬合 (Overfitting)
  - 資料遺失 (Data Loss)
  - 程式錯誤 (Bug)
  correct_index: 0
  explanation: 輸入（房屋特徵）與輸出（價格）之間的關係因經濟環境改變而發生了根本變化，這就是概念漂移。
  tags:
  - chap-m2-ch5
  - sec-monitoring
  id: 4555
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: MLOps 核心概念
  text: 情境：公司有強大的 DevOps 團隊，但在接手 AI 專案時卻頻頻受挫，主要原因是忽略了 AI 專案的哪個特殊性？
  type: multiple_choice
  options:
  - 程式碼版本控制 (Code Version Control)
  - 伺服器管理 (Server Management)
  - 網路設定 (Network Config)
  - 數據與模型的版本控制及實驗追蹤 (Data & Model Versioning)
  correct_index: 3
  explanation: 傳統 DevOps 關注程式碼 (Code)，而 MLOps 必須同時關注程式碼、數據 (Data) 與模型 (Model)。數據的變動性是 MLOps 最大的挑戰。
  tags:
  - chap-m2-ch5
  - sec-mlops-core
  id: 4556
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: 微服務架構 (Microservices Architecture)
  text: 情境：Kubernetes 叢集中的某個推論服務 Pod 因為記憶體洩漏而掛掉。K8s 會如何處理？
  type: multiple_choice
  options:
  - 發送 Email 給執行長 (Email CEO)
  - 整個系統停機 (System Shutdown)
  - 刪除該服務 (Delete Service)
  - 自動重啟該 Pod (Self-healing) (Self-healing)
  correct_index: 3
  explanation: K8s 的自我修復 (Self-healing) 機制會監控 Pod 狀態，一旦發現異常終止，會自動重啟新的 Pod 以維持服務可用性。
  tags:
  - chap-m2-ch5
  - sec-microservices
  id: 4557
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: 情境：內部微服務之間需要進行每秒數萬次的高頻通訊，目前使用 RESTful API 發現 CPU 消耗過高。建議改用？
  type: multiple_choice
  options:
  - Email (Email)
  - FTP (FTP)
  - gRPC (gRPC)
  - SOAP (SOAP)
  correct_index: 2
  explanation: gRPC 基於 Protobuf (二進位格式) 與 HTTP/2，序列化與傳輸效率遠高於文字格式的 REST/JSON，適合高頻內部通訊。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  id: 4558
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: AI 系統整合
  text: 情境：需要儲存大量的非結構化資料（如客戶客服錄音、產品圖片）供未來訓練模型使用。最具成本效益的儲存方案是？
  type: multiple_choice
  options:
  - 關聯式資料庫 (RDBMS) (RDBMS)
  - 資料湖 (Data Lake) (Data Lake)
  - 記憶體快取 (Redis) (Redis)
  - 資料倉儲 (Data Warehouse) (Data Warehouse)
  correct_index: 1
  explanation: 資料湖 (如 AWS S3) 專為低成本儲存海量異質資料而設計，適合 AI 專案的原始資料積累。
  tags:
  - chap-m2-ch5
  - sec-system-integration
  id: 4559
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 情境：為了在不影響用戶的情況下測試新模型的效能，決定將線上流量複製一份給新模型跑，但不採用其結果。這稱為？
  type: multiple_choice
  options:
  - 金絲雀部署 (Canary Deployment)
  - 藍綠部署 (Blue-Green Deployment)
  - 影子模式 (Shadow Mode) (Shadow Mode)
  - A/B 測試 (A/B Testing)
  correct_index: 2
  explanation: 影子模式是風險最低的測試方式，因為新模型的任何錯誤都不會傳遞給用戶，純粹用於後台驗證。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  id: 4560
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 情境：希望逐步將流量從舊模型切換到新模型（如 10% -> 50% -> 100%），以便在出現問題時能控制影響範圍。應採用？
  type: multiple_choice
  options:
  - 影子模式 (Shadow Mode)
  - 直接部署 (Direct Deployment)
  - 金絲雀部署 (Canary Deployment) (Canary Deployment)
  - 藍綠部署 (Blue-Green Deployment)
  correct_index: 2
  explanation: 金絲雀部署的核心就是「漸進式流量切換」，能有效控制風險。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  id: 4561
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: 情境：在資源有限的邊緣設備上，模型推論速度太慢。為了提升吞吐量 (Throughput)，可以犧牲一點點準確率來換取速度。應採用哪種技術？
  type: multiple_choice
  options:
  - 增加輸入圖片解析度 (Higher Resolution)
  - 使用更高精度的浮點數 (Higher Precision)
  - 增加層數 (Add Layers)
  - 模型量化 (Quantization) (Quantization)
  correct_index: 3
  explanation: 量化將模型參數從 32-bit 浮點數轉為 8-bit 整數，雖然會損失微小精度，但能大幅提升運算速度並減少記憶體佔用。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  id: 4562
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 情境：團隊發現無法重現上個月發布的模型的訓練結果，因為當時的數據集已經被覆蓋了。這顯示缺乏？
  type: multiple_choice
  options:
  - Docker (Docker)
  - Jenkins (Jenkins)
  - Git (Git)
  - DVC (Data Version Control) (DVC)
  correct_index: 3
  explanation: 數據版本控制是 MLOps 的基石。DVC 允許我們像管理程式碼一樣管理數據集，確保任何歷史版本的模型都能被精確重現。
  tags:
  - chap-m2-ch5
  - sec-cicd4ai
  id: 4563
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: 部署後優化與績效指標
  text: 情境：模型上線後，團隊定期收集用戶修正後的錯誤預測結果，並將其加入訓練集。這個機制的目的是？
  type: multiple_choice
  options:
  - 證明模型很爛 (Prove Model Bad)
  - 增加資料庫負擔 (Burden Database)
  - 浪費時間 (Waste Time)
  - 建立回饋迴圈 (Feedback Loop) 以持續優化模型 (Feedback Loop)
  correct_index: 3
  explanation: 這是「數據飛輪 (Data Flywheel)」效應。利用錯誤樣本進行針對性訓練，是提升模型效能最有效的方法。
  tags:
  - chap-m2-ch5
  - sec-post-deployment
  id: 4564
  usage: both
- chapter_title: 系統部署與 MLOps
  section_title: 模型部署策略
  text: 情境：某 App 的人臉辨識功能原本在雲端執行，但用戶抱怨在地下室無訊號時無法解鎖。解決方案是？
  type: multiple_choice
  options:
  - 要求用戶去有訊號的地方 (Move User)
  - 改為邊緣運算 (Edge Computing)，在手機端執行模型 (Edge Computing)
  - 使用 5G (Use 5G)
  - 加強雲端伺服器 (Enhance Cloud Server)
  correct_index: 1
  explanation: 將模型部署到邊緣（手機），不僅消除了網路延遲，更實現了離線可用性，提升用戶體驗。
  tags:
  - chap-m2-ch5
  - sec-deployment-strategies
  id: 4565
  usage: both
