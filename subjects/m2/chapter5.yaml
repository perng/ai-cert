  section_title: AI 的持續整合/持續部署 (CI/CD)
  text: 情境：新模型上線後發現嚴重 Bug，導致所有預測失效。最快速的恢復手段是？
  type: multiple_choice
  options:
  - 發公告道歉 (Apologize)
  - 執行版本回滾 (Rollback)，切換回上一個穩定版本 (Rollback)
  - 立即重新訓練模型 (Retrain Immediately)
  - 修復 Bug 後重新打包上線 (Fix & Redeploy)
  correct_index: 1
  explanation: 在生產環境事故中，止血是第一要務。回滾到舊版能立即恢復服務，爭取時間讓團隊在線下修復問題。
