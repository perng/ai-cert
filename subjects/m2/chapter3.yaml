- id: m2-114-2-007
  chapter_title: 電腦視覺 (CV)
  section_title: 歷屆考題
  text: 在企業導入的智慧監控系統中，模型以物件偵測（Object Detection）方式自動辨識影像中的人物與車輛。若評估指標採用平均精確率（Mean Average Precision, mAP），其中 IoU（Intersection over Union）閾值設定較高時，代表下列哪一項意義？ (114年第二梯次)
  type: multiple_choice
  options:
  - 預測邊界框與真實邊界框的重疊程度越高，模型偵測結果越精準
  - 預測邊界框與真實邊界框的誤差越大，導致mAP 數值上升
  - 模型整體精確率（Precision）降低，但召回率（Recall）上升
  - 預測邊界框的評估結果不受真實框大小影響
  correct_index: 0
  explanation: IoU 閾值越高，代表預測框必須與真實框有更高重疊才算正確偵測，因此評估標準更嚴格，也更重視定位精準度。
  tags:
  - chap-m2-ch3
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-008
  chapter_title: 電腦視覺 (CV)
  section_title: 歷屆考題
  text: 關於Softmax 與Max-Pooling，下列敘述何者正確？ (114年第二梯次)
  type: multiple_choice
  options:
  - Softmax 與Max-Pooling 都會將特徵張量壓縮為單一最大值
  - Max-Pooling 會對輸入進行機率分佈的轉換
  - Softmax 會保留所有輸入資訊，但以比例表示；Max-Pooling 只保留區域最大值
  - Softmax 主要用於特徵降維，而Max-Pooling 用於分類輸出
  correct_index: 2
  explanation: Softmax 將所有輸入轉成總和為 1 的比例分布；Max-Pooling 則在局部區域只保留最大值，用於降低特徵圖尺寸與保留顯著特徵。
  tags:
  - chap-m2-ch3
  - sec-past-exam
  - past-exam
  usage: mock
