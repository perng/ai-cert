  chapter_title: 電腦視覺 (CV)
  section_title: 歷屆考題
  text: 在自駕車影像辨識系統中，開發團隊希望模型能同時辨識每個像素所屬的物件類別（例如道路、建築、行人），又能區分出同類物件的不同個體（例如多位行人）。此時最適合採用下列哪一項電腦視覺技術？ (114年第二梯次)
