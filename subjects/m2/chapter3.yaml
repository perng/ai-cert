  - 購買更貴的手機 (Buy Expensive Phone)
  - 將模型更換為輕量化架構 (如 MobileNet, YOLO-Nano) 並進行模型量化 (Quantization) (Lightweight Model & Quantization)
  correct_index: 3
  explanation: 在邊緣裝置上，速度與資源是瓶頸。輕量化模型與量化技術能在犧牲極小準確率的前提下，大幅提升推論速度與降低能耗。
