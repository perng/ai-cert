  usage: mock
- id: m2-114-2-045
  chapter_title: 電腦視覺 (CV)
  section_title: 歷屆考題
  text: 進行影像分類任務時，研究團隊嘗試利用主成分分析（Principal Component Analysis, PCA）將輸入特徵從1024 維降至100 維，並將降維後的資料輸入支持向量機（Support Vector Machine, SVM）模型進行訓練。關於此作法，下列哪一項描述最為合理？ (114年第二梯次)
  type: multiple_choice
  options:
  - PCA 保留的主成分必然能提升SVM 的分類準確率
  - 使用原始高維資料通常更能保留資訊，因此PCA 沒有實際意義
  - PCA 可讓SVM 自動適用於非線性（Nonlinear）資料集
  - 降維後可降低訓練時間並減少過擬合（Overfitting）風險
  correct_index: 3
  explanation: PCA 降維可減少輸入維度與計算量，並降低高維特徵造成的過擬合風險，但不保證一定提升準確率或處理所有非線性問題。
  tags:
  - chap-m2-ch3
  - sec-past-exam
  - past-exam
  usage: mock
