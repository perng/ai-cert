- id: 4341
  chapter_title: 電腦視覺 (CV)
  section_title: 情境題
  text: 情境：你訓練了一個安全帽偵測模型，在測試集上 IoU 高達 0.9。但部署到工地現場後，發現工人只要「側著頭」或「低頭」，模型就偵測不到安全帽。這顯示訓練資料缺乏什麼？應如何改善？
  type: multiple_choice
  options:
  - 解析度不足 (Insufficient Resolution)
  - IoU 閾值設太高 (IoU Threshold too High)
  - 缺乏多樣性 (Diversity) 與資料增強 (Data Augmentation) (Lack of Diversity)
  - 模型層數不夠 (Insufficient Layers)
  correct_index: 2
  explanation: 模型在特定視角失效，通常是因為訓練資料的視角太單一。透過資料增強（模擬不同角度）或收集更多樣化的現場數據是標準解法。
  tags:
  - chap-m2-ch3
  - sec-scenario
  usage: both
- id: 4342
  chapter_title: 電腦視覺 (CV)
  section_title: 情境題
  text: 情境：你的自駕車模型在白天表現完美，但在下雨的夜晚經常誤判路況。這屬於什麼現象？在不重新收集大量夜間數據的情況下，可以嘗試什麼技術來緩解？
  type: multiple_choice
  options:
  - 過擬合；使用 Dropout (Overfitting)
  - 梯度消失；使用 ResNet (Vanishing Gradient)
  - 欠擬合；增加模型寬度 (Underfitting)
  - 資料漂移 (Data Drift)；使用領域適應 (Domain Adaptation) 或生成對抗網路 (GAN) (Domain Adaptation/GAN)
  correct_index: 3
  explanation: 這是典型的 Domain Shift 問題。GAN 可以用來進行風格遷移 (Style Transfer)，生成逼真的夜間/雨天數據來擴充訓練集，提升模型對惡劣環境的適應力。
  tags:
  - chap-m2-ch3
  - sec-scenario
  usage: both
- id: 4343
  chapter_title: 電腦視覺 (CV)
  section_title: 情境題
  text: 情境：你正在開發一個手機端的即時手勢識別 App。你發現使用 ResNet-50 雖然準確，但每秒只能跑 5 幀 (5 FPS)，導致體驗卡頓。你應該優先考慮什麼優化策略？
