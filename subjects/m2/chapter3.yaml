questions:
- id: 4301
  chapter_title: 電腦視覺 (CV)
  section_title: 影像處理基礎
  text: 在電腦中，一張 RGB 彩色影像通常如何表示？
  type: multiple_choice
  options:
  - 二維矩陣 (高度 x 寬度) (2D Matrix)
  - 三維矩陣 (高度 x 寬度 x 3) (3D Matrix - HxWx3)
  - 一維陣列 (1D Array)
  - 四維張量 (4D Tensor)
  correct_index: 1
  explanation: 彩色影像由紅、綠、藍 (RGB) 三個顏色通道組成，因此每個像素點有 3 個數值，形成三維結構。
  tags:
  - chap-m2-ch3
  - sec-image-processing
  usage: quiz
- id: 4302
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 卷積神經網路 (CNN) 中的「卷積層 (Convolutional Layer)」主要功能是？
  type: multiple_choice
  options:
  - 降低影像維度 (Reduce Dimension)
  - 增加影像亮度 (Increase Brightness)
  - 進行分類 (Classification)
  - 提取影像的局部特徵 (如邊緣、紋理) (Extract Local Features)
  correct_index: 3
  explanation: 卷積層利用濾鏡 (Filter/Kernel) 在影像上滑動，捕捉影像中的局部模式，這是 CNN 識別物體的基礎。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4303
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 池化層 (Pooling Layer) 的主要作用不包括？
  type: multiple_choice
  options:
  - 降低特徵圖的維度 (Downsampling)
  - 減少參數量與計算量 (Reduce Parameters & Computation)
  - 增加模型的平移不變性 (Translation Invariance)
  - 增加特徵圖的解析度 (Increase Resolution)
  correct_index: 3
  explanation: 池化層透過選取區域最大值 (Max Pooling) 或平均值，會縮小特徵圖的尺寸（解析度），而非增加。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4304
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: VGG 模型的一個顯著特點是？
  type: multiple_choice
  options:
  - 引入殘差連接 (Residual Connections)
  - 使用 7x7 大卷積核 (Large Kernels)
  - 參數量極少 (Few Parameters)
  - 全面使用 3x3 小卷積核來堆疊深層網路 (Stacking Small 3x3 Kernels)
  correct_index: 3
  explanation: VGG 證明了堆疊多個小尺寸 (3x3) 卷積層可以達到與大尺寸卷積層相同的感受野，但參數更少且非線性更強。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4305
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: ResNet (殘差網路) 解決了深層神經網路訓練中的什麼關鍵問題？
  type: multiple_choice
  options:
  - 資料不足 (Insufficient Data)
  - 梯度消失 (Vanishing Gradient)
  - 過擬合 (Overfitting)
  - 計算速度慢 (Slow Computation)
  correct_index: 1
  explanation: 透過「捷徑 (Shortcut)」連接，梯度可以直接傳回前面的層，使得訓練上百層甚至上千層的網路成為可能。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4306
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 物件偵測 (Object Detection) 與影像分類的主要區別在於？
  type: multiple_choice
  options:
  - 物件偵測不僅要分類，還要定位出物體的位置 (Classify & Localize)
  - 物件偵測不需要分類 (No Classification)
  - 影像分類比較難 (Classification is Harder)
  - 物件偵測只能處理黑白影像 (Grayscale Only)
  correct_index: 0
  explanation: 分類回答「是什麼」，偵測回答「是什麼」以及「在哪裡」。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4307
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: YOLO (You Only Look Once) 演算法的核心優勢是？
  type: multiple_choice
  options:
  - 不需要訓練 (No Training Needed)
  - 參數量最少 (Fewest Parameters)
  - 速度極快，能實現即時偵測 (Real-time Detection)
  - 準確率最高 (Highest Accuracy)
  correct_index: 2
  explanation: YOLO 將偵測視為單一回歸問題，一次掃描即可完成定位與分類，速度遠快於兩階段的 R-CNN 系列。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4308
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 評估物件偵測模型準確度的指標 IoU (Intersection over Union) 是指？
  type: multiple_choice
  options:
  - 真實框面積 / 預測框面積 (GT / Pred)
  - 重疊面積 x 聯集面積 (Intersection x Union)
  - 預測框面積 / 真實框面積 (Pred / GT)
  - 預測框與真實框的重疊面積 / 聯集面積 (Intersection / Union)
  correct_index: 3
  explanation: IoU 衡量預測位置與真實位置的吻合程度，值越接近 1 代表定位越精準。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4309
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 語義分割 (Semantic Segmentation) 與實例分割 (Instance Segmentation) 的區別是？
  type: multiple_choice
  options:
  - 兩者完全相同 (Identical)
  - 語義分割用於影片，實例分割用於圖片 (Video vs Image)
  - 實例分割區分同一類別中的不同個體，語義分割只區分不同類別 (Instance Distinguishes Individuals)
  - 語義分割區分個體，實例分割不區分 (Semantic Distinguishes Instances)
  correct_index: 2
  explanation: 語義分割將所有「人」視為同一類（紅色）；實例分割則會區分出「這個人」和「那個人」（不同顏色）。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4310
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: U-Net 模型最常應用於哪個領域？
  type: multiple_choice
  options:
  - 醫療影像分割 (Medical Image Segmentation)
  - 人臉辨識 (Face Recognition)
  - 自駕車 (Autonomous Driving)
  - 風景分類 (Scene Classification)
  correct_index: 0
  explanation: U-Net 的跳躍連接結構能精準還原邊緣細節，非常適合需要高精度的醫療影像（如細胞、腫瘤）分割任務。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: quiz
- id: 4311
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 為了保護隱私，在儲存監控影像前應採取的措施是？
  type: multiple_choice
  options:
  - 公開上網 (Publish Online)
  - 去識別化 (如人臉模糊化、遮罩) (De-identification)
  - 備份多份 (Multiple Backups)
  - 提高解析度 (Increase Resolution)
  correct_index: 1
  explanation: 去識別化能移除或模糊化可識別個人身分的特徵 (PII)，降低隱私洩漏風險。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4312
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 模型量化 (Quantization) 的主要目的是？
  type: multiple_choice
  options:
  - 增加訓練時間 (Increase Training Time)
  - 將參數從浮點數轉為整數，減少模型大小與運算需求 (Reduce Size & Compute)
  - 提高模型準確率 (Increase Accuracy)
  - 增加模型層數 (Increase Layers)
  correct_index: 1
  explanation: 量化是模型壓縮的關鍵技術，讓龐大的 CV 模型能跑在手機或 IoT 設備上。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4313
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 在 CNN 中，全連接層 (Dense Layer) 通常位於？
  type: multiple_choice
  options:
  - 最後端，用於整合特徵並輸出分類結果 (End - Classification)
  - 最前端，用於提取特徵 (Front - Feature Extraction)
  - 中間，用於降維 (Middle - Dim Reduction)
  - 不使用全連接層 (No Dense Layer)
  correct_index: 0
  explanation: 卷積層負責提取特徵，全連接層負責根據這些特徵進行最終的邏輯判斷（分類）。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4314
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 非極大值抑制 (NMS) 在物件偵測中的作用是？
  type: multiple_choice
  options:
  - 去除重疊度高且信心分數較低的冗餘預測框 (Remove Redundant Boxes)
  - 計算 IoU (Calculate IoU)
  - 增加預測框的數量 (Increase Boxes)
  - 調整圖片亮度 (Adjust Brightness)
  correct_index: 0
  explanation: 模型可能會對同一個物體預測出多個框，NMS 用於過濾掉多餘的框，確保每個物體只被偵測一次。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4315
  chapter_title: 電腦視覺 (CV)
  section_title: 產業應用情境
  text: 工業瑕疵偵測 (AOI) 取代人工目檢的主要好處是？
  type: multiple_choice
  options:
  - 增加就業機會 (Increase Jobs)
  - 提升檢測速度、一致性與良率，避免人眼疲勞 (Improve Speed, Consistency & Yield)
  - 速度慢但準確 (Slow but Accurate)
  - 成本更高 (Higher Cost)
  correct_index: 1
  explanation: 機器視覺不知疲倦，標準一致，能大幅提升生產線的品管效率。
  tags:
  - chap-m2-ch3
  - sec-cv-applications
  usage: both
- id: 4316
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 資料漂移 (Data Drift) 在 CV 領域的常見例子是？
  type: multiple_choice
  options:
  - 硬碟損壞 (Disk Failure)
  - 網路斷線 (Network Disconnect)
  - 訓練時用白天的圖片，實際應用時遇到晚上的圖片 (Day vs Night)
  - 電壓不穩 (Unstable Voltage)
  correct_index: 2
  explanation: 光照、天氣、角度等環境因素的變化都會導致輸入資料分佈改變，使模型失效。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4317
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: FCN (全卷積網路) 的主要創新在於？
  type: multiple_choice
  options:
  - 使用了 RNN (Used RNN)
  - 移除了所有卷積層 (Removed Conv Layers)
  - 只能處理固定尺寸圖片 (Fixed Size Only)
  - 將全連接層替換為卷積層，使其能處理任意尺寸的輸入 (Fully Convolutional)
  correct_index: 3
  explanation: 這項改變讓神經網路能進行像素級的預測（分割），保留了空間資訊。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4318
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: ResNet 中的 $F(x) = H(x) - x$ 代表模型實際上是在學習？
  type: multiple_choice
  options:
  - 殘差 (Residual)，即輸入與理想輸出之間的差異 (Difference between Input & Output)
  - 雜訊 (Noise)
  - 輸入本身 (Input Itself)
  - 權重 (Weights)
  correct_index: 0
  explanation: 學習「差異」（修補草圖）比從頭學習完整映射（畫新圖）更容易，這是 ResNet 成功的關鍵直覺。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4319
  chapter_title: 電腦視覺 (CV)
  section_title: 產業應用情境
  text: 自駕車中的多模態融合 (Sensor Fusion) 通常結合哪些感測器？
  type: multiple_choice
  options:
  - 只有攝影機 (Camera Only)
  - 溫度計與濕度計 (Thermometer & Hygrometer)
  - 攝影機、LiDAR (光達)、雷達 (Camera, LiDAR, Radar)
  - 麥克風與喇叭 (Mic & Speaker)
  correct_index: 2
  explanation: 攝影機提供視覺色彩，LiDAR 提供精確 3D 深度，雷達提供速度資訊。融合三者能提供最可靠的環境感知。
  tags:
  - chap-m2-ch3
  - sec-cv-applications
  usage: both
- id: 4320
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 邊緣運算 (Edge Computing) 如何幫助保護隱私？
  type: multiple_choice
  options:
  - 刪除所有數據 (Delete All Data)
  - 加密所有數據 (Encrypt All Data)
  - 數據在本地端處理完畢，只上傳統計結果 (Process Locally)
  - 將數據傳送到國外 (Send Abroad)
  correct_index: 2
  explanation: 「資料不動程式動」。不在雲端處理敏感影像，從源頭阻斷了外洩風險。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4321
  chapter_title: 電腦視覺 (CV)
  section_title: 影像處理基礎
  text: Canny 演算法主要用於？
  type: multiple_choice
  options:
  - 色彩校正 (Color Correction)
  - 影像縮放 (Resizing)
  - 影像模糊化 (Blurring)
  - 邊緣檢測 (Edge Detection) (Detect Edges)
  correct_index: 3
  explanation: Canny 是一種經典且強大的邊緣檢測演算法，能找出影像中物體的輪廓。
  tags:
  - chap-m2-ch3
  - sec-image-processing
  usage: both
- id: 4322
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: 在 CNN 中，ReLU 活化函數的作用是？
  type: multiple_choice
  options:
  - 引入非線性，增強模型特徵學習能力 (Introduce Non-linearity)
  - 降維 (Dimensionality Reduction)
  - 分類 (Classification)
  - 歸一化 (Normalization)
  correct_index: 0
  explanation: 線性疊加只是線性變換。ReLU 引入非線性，讓 CNN 能擬合複雜的圖像特徵。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4323
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: Mask R-CNN 在 Faster R-CNN 的基礎上增加了什麼？
  type: multiple_choice
  options:
  - 一個預測二值遮罩 (Mask) 的全卷積分支 (Mask Branch)
  - 聲音識別功能 (Voice Recognition)
  - 文字生成功能 (Text Generation)
  - 另一個分類分支 (Another Classification Branch)
  correct_index: 0
  explanation: 這使得 Mask R-CNN 不僅能框出物體（偵測），還能精確描繪出物體的形狀（分割）。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4324
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: U-Net 中的「跳躍連接 (Skip Connections)」連接了哪兩個部分？
  type: multiple_choice
  options:
  - 編碼器 (Encoder) 的特徵圖與解碼器 (Decoder) 對應層的特徵圖 (Encoder-Decoder Features)
  - 輸入層與輸出層 (Input & Output)
  - 卷積層與池化層 (Conv & Pooling)
  - 兩個不同的模型 (Two Models)
  correct_index: 0
  explanation: 這種連接將淺層的高解析度特徵直接傳遞給深層，幫助解碼器更好地還原影像細節。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4325
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 為了避免人臉辨識系統對特定族群產生偏見，應採取什麼策略？
  type: multiple_choice
  options:
  - 只使用白人男性的照片訓練 (White Males Only)
  - 降低準確率要求 (Lower Accuracy)
  - 多樣性採樣 (Diverse Sampling) (Sample Diversity)
  - 停止使用人臉辨識 (Stop Using Face ID)
  correct_index: 2
  explanation: 數據的多樣性決定了模型的公平性。必須主動收集各類群體的數據以消除偏差。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4326
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
  text: MobileNet 是一種什麼樣的模型架構？
  type: multiple_choice
  options:
  - 專為行動裝置設計的輕量化模型 (Lightweight Model for Mobile)
  - 專用於醫療影像 (Medical Imaging)
  - 參數量巨大的大型模型 (Large Model)
  - 只能處理文字 (Text Only)
  correct_index: 0
  explanation: MobileNet 使用深度可分離卷積 (Depthwise Separable Convolution) 大幅減少運算量，適合在手機端運行。
  tags:
  - chap-m2-ch3
  - sec-cv-models
  usage: both
- id: 4327
  chapter_title: 電腦視覺 (CV)
  section_title: 產業應用情境
  text: 車牌辨識 (ANPR) 系統通常包含哪三個步驟？
  type: multiple_choice
  options:
  - 分類、回歸、分群 (Classification, Regression, Clustering)
  - 偵測、追蹤、預測 (Detection, Tracking, Prediction)
  - 定位、分割、OCR 識別 (Detection, Segmentation, OCR)
  - 拍照、上傳、下載 (Photo, Upload, Download)
  correct_index: 2
  explanation: 先找到車牌位置，將字符切開，最後用光學字符識別 (OCR) 讀出文字。
  tags:
  - chap-m2-ch3
  - sec-cv-applications
  usage: both
- id: 4328
  chapter_title: 電腦視覺 (CV)
  section_title: 風險與挑戰
  text: 剪枝 (Pruning) 技術是指？
  type: multiple_choice
  options:
  - 縮短訓練時間 (Shorten Training Time)
  - 減少圖片解析度 (Reduce Resolution)
  - 刪除訓練資料 (Delete Training Data)
  - 移除神經網路中不重要的連接或神經元 (Remove Unimportant Connections/Neurons)
  correct_index: 3
  explanation: 許多神經元的貢獻微乎其微。剪枝就像修剪樹木，去除冗餘部分，讓模型更精簡高效。
  tags:
  - chap-m2-ch3
  - sec-cv-risks
  usage: both
- id: 4329
  chapter_title: 電腦視覺 (CV)
  section_title: 核心任務與模型
