questions:
- id: 4401
  chapter_title: 生成式 AI 與多模態 AI
  section_title: AI 發展演進
  text: 根據 NVIDIA 的觀點，AI 發展的第二階段「生成式 AI」的主要特徵是？
  type: multiple_choice
  options:
  - 只能辨識圖像 (Image Recognition Only)
  - 能夠主動創造文本、圖像、影片等多模態內容 (Create Multimodal Content)
  - 具備物理互動能力 (Physical Interaction)
  - 只能進行邏輯推理 (Logical Reasoning Only)
  correct_index: 1
  explanation: 生成式 AI 超越了單純的感知與分類，具備了「創造」新內容的能力，如 ChatGPT 和 Midjourney。
  tags:
  - chap-m2-ch4
  - sec-ai-evolution
  usage: quiz
- id: 4402
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 生成式 AI (Generative AI) 與鑑別式 AI (Discriminative AI) 的主要區別在於？
  type: multiple_choice
  options:
  - 生成式 AI 學習決策邊界，鑑別式 AI 學習數據分佈 (Gen learns Boundary, Disc learns Dist)
  - 生成式 AI 學習數據分佈以生成新樣本，鑑別式 AI 學習決策邊界以進行分類 (Gen learns Dist, Disc learns Boundary)
  - 兩者沒有區別 (No Difference)
  - 鑑別式 AI 比較先進 (Discriminative is More Advanced)
  correct_index: 1
  explanation: 鑑別式 AI 專注於區分 A 和 B（找邊界），生成式 AI 專注於理解 A 長什麼樣子（學分佈）以便畫出新的 A。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4403
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: GAN (生成對抗網路) 中的「生成器 (Generator)」的目標是？
  type: multiple_choice
  options:
  - 區分真假數據 (Distinguish Real/Fake)
  - 生成逼真的假數據來欺騙判別器 (Generate Fake Data to Fool Discriminator)
  - 最小化訓練時間 (Minimize Training Time)
  - 壓縮數據 (Compress Data)
  correct_index: 1
  explanation: 生成器扮演「偽鈔製造者」的角色，不斷精進技術以騙過扮演「警察」的判別器。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4404
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 在 GAN 的訓練過程中，當達到「納什均衡 (Nash Equilibrium)」時，判別器的輸出機率通常接近？
  type: multiple_choice
  options:
  - 0 (完全認為是假的) (Fake)
  - 1 (完全認為是真的) (Real)
  - 0.5 (無法區分真假，像猜硬幣一樣) (Indistinguishable)
  - 0.9 (High Probability)
  correct_index: 2
  explanation: 當生成器完美擬合真實數據分佈時，判別器已無法分辨輸入是來自真實數據還是生成器，因此判斷為真的機率為 50%。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4405
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: VAE (變分自動編碼器) 的損失函數包含哪兩部分？
  type: multiple_choice
  options:
  - 生成損失與判別損失 (Gen & Disc Loss)
  - 重建誤差 (Reconstruction Loss) 與 KL 散度 (KL Divergence) (Recon Loss & KL Div)
  - 均方誤差與交叉熵 (MSE & Cross Entropy)
  - L1 與 L2 正則化 (L1 & L2 Regularization)
  correct_index: 1
  explanation: 重建誤差確保生成圖像像原圖，KL 散度確保潛在空間的分佈符合標準常態分佈，便於採樣生成。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4406
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型 (Diffusion Models) 的「前向過程 (Forward Process)」是指？
  type: multiple_choice
  options:
  - 從雜訊生成圖像 (Generate from Noise)
  - 逐步向真實圖像添加高斯雜訊，直到變成純雜訊 (Add Gaussian Noise Step-by-Step)
  - 訓練神經網路 (Train Neural Network)
  - 壓縮圖像 (Compress Image)
  correct_index: 1
  explanation: 前向過程是一個固定的「破壞」過程，將清晰圖像一步步變成無法辨識的隨機雜訊。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4407
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型中的「反向過程 (Reverse Process)」通常使用什麼模型來預測雜訊？
  type: multiple_choice
  options:
  - CNN (Convolutional Neural Network)
  - U-Net (U-Net Architecture)
  - RNN (Recurrent Neural Network)
  - LSTM (Long Short-Term Memory)
  correct_index: 1
  explanation: U-Net 因其強大的特徵提取與還原能力，被廣泛用於預測每一步需要減去的雜訊。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4408
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: CLIP 模型的核心訓練目標是？
  type: multiple_choice
  options:
  - 生成圖像 (Generate Image)
  - 將圖像和文本映射到同一個向量空間，最大化配對圖文的相似度 (Maximize Image-Text Similarity)
  - 翻譯文本 (Translate Text)
  - 語音識別 (Speech Recognition)
  correct_index: 1
  explanation: CLIP 透過對比學習 (Contrastive Learning)，學會了圖像與文字之間的語意對應關係，是多模態 AI 的基石。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: quiz
- id: 4409
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: 在文字轉圖像 (Text-to-Image) 生成中，CLIP 的作用通常是？
  type: multiple_choice
  options:
  - 生成最終圖像 (Generate Final Image)
  - 將用戶輸入的 Prompt 轉換為語意向量，引導擴散模型生成 (Convert Prompt to Vector)
  - 壓縮圖像 (Compress Image)
  - 增加雜訊 (Add Noise)
  correct_index: 1
  explanation: CLIP 充當「翻譯官」，將人類的文字指令翻譯成擴散模型能理解的數學向量，指引生成方向。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: quiz
- id: 4410
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 相比於 GAN，擴散模型 (Diffusion Models) 的主要優勢是？
  type: multiple_choice
  options:
  - 訓練速度極快 (Fast Training)
  - 生成多樣性高且訓練過程穩定，不易發生模式崩潰 (High Diversity & Stable Training)
  - 參數量極少 (Few Parameters)
  - 不需要數據 (No Data Needed)
  correct_index: 1
  explanation: GAN 訓練不穩定且容易只生成單一類型的樣本（模式崩潰）。擴散模型雖然生成慢，但生成品質與多樣性通常更優。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: quiz
- id: 4411
  chapter_title: 生成式 AI 與多模態 AI
  section_title: AI 發展演進
  text: 代理式 AI (Agentic AI) 的核心能力是？
  type: multiple_choice
  options:
  - 畫圖 (Drawing)
  - 推理 (Reasoning) 與計畫 (Planning)，能自動拆解並完成複雜任務 (Reasoning & Planning)
  - 語音合成 (Speech Synthesis)
  - 玩遊戲 (Playing Games)
  correct_index: 1
  explanation: Agentic AI 不僅是被動回答問題，還能主動思考如何達成目標，例如「幫我訂機票並安排行程」。
  tags:
  - chap-m2-ch4
  - sec-ai-evolution
  usage: both
- id: 4412
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: VAE 中的「重參數化技巧 (Reparameterization Trick)」是為了解決什麼問題？
  type: multiple_choice
  options:
  - 梯度消失 (Vanishing Gradient)
  - 取樣操作 (Sampling) 不可微分，無法進行反向傳播 (Non-differentiable Sampling)
  - 計算速度慢 (Slow Computation)
  - 記憶體不足 (Insufficient Memory)
  correct_index: 1
  explanation: 直接從分佈採樣會切斷梯度流。重參數化將隨機性轉移到外部變數 $\epsilon$，使得模型參數 $\mu, \sigma$ 可被微分訓練。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4413
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: GAN 的損失函數通常被描述為一種什麼博弈？
  type: multiple_choice
  options:
  - 合作博弈 (Cooperative Game)
  - 極小極大博弈 (Min-Max Game) (Minimax Game)
  - 零和博弈 (Zero-sum Game)
  - 順序博弈 (Sequential Game)
  correct_index: 1
  explanation: 生成器試圖最小化判別器的成功率，判別器試圖最大化自己的成功率，兩者目標相反。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4414
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: CLIP 的圖像編碼器通常使用哪種架構？
  type: multiple_choice
  options:
  - RNN (Recurrent Neural Network)
  - ResNet 或 Vision Transformer (ViT) (ResNet or ViT)
  - GAN (Generative Adversarial Network)
  - LSTM (Long Short-Term Memory)
  correct_index: 1
  explanation: 為了提取高品質的圖像特徵，CLIP 使用了強大的視覺模型架構如 ResNet 或 ViT。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: both
- id: 4415
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型的生成過程可以被視為？
  type: multiple_choice
  options:
  - 加噪過程 (Adding Noise)
  - 去噪過程 (Denoising) (Reverse Process)
  - 分類過程 (Classification)
  - 壓縮過程 (Compression)
  correct_index: 1
  explanation: 生成就是從純雜訊中，一步步去除雜訊，還原出有意義的圖像結構。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4416
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 在 GAN 中，若判別器太強，會導致什麼問題？
  type: multiple_choice
  options:
  - 生成器學得更快 (Generator Learns Faster)
  - 梯度消失，生成器無法獲得有效的梯度回饋來改進 (Vanishing Gradient)
  - 判別器崩潰 (Discriminator Collapse)
  - 模型過擬合 (Overfitting)
  correct_index: 1
  explanation: 如果警察太厲害，一眼識破所有假鈔且給出極低分數，偽鈔製造者會感到絕望（梯度趨近 0），不知道該往哪個方向改進。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4417
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: 多模態 AI (Multimodal AI) 的定義是？
  type: multiple_choice
  options:
  - 只能處理文字 (Text Only)
  - 能夠同時處理並結合多種數據類型（如文本、圖像、音頻） (Process Multiple Data Types)
  - 有多個模型 (Multiple Models)
  - 速度很快 (Fast Speed)
  correct_index: 1
  explanation: 多模態 AI 打破了單一感官的限制，能像人類一樣綜合視覺、聽覺和語言資訊來理解世界。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: both
- id: 4418
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: VAE 的解碼器 (Decoder) 負責？
  type: multiple_choice
  options:
  - 將輸入壓縮為潛在變量 (Compress to Latent)
  - 從潛在變量 (Latent Variable) 重建原始數據 (Reconstruct from Latent)
  - 判別真假 (Distinguish Real/Fake)
  - 加入雜訊 (Add Noise)
  correct_index: 1
  explanation: Decoder 的任務是將抽象的潛在特徵還原回具體的圖像或數據。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4419
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型中的「雜訊調度參數 (Noise Schedule)」控制什麼？
  type: multiple_choice
  options:
  - 模型的學習率 (Learning Rate)
  - 每一步添加或去除雜訊的量 (Noise Amount per Step)
  - 圖像的大小 (Image Size)
  - 訓練的時間 (Training Time)
  correct_index: 1
  explanation: Noise Schedule 決定了加噪過程的快慢節奏，對生成品質有重要影響。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4420
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: CLIP 的訓練數據來源主要是？
  type: multiple_choice
  options:
  - 人工標註的 ImageNet (Labeled ImageNet)
  - 網路上爬取的海量「圖像-文本對」 (Web-scraped Image-Text Pairs)
  - 醫療影像 (Medical Images)
  - 監視器畫面 (Surveillance Footage)
  correct_index: 1
  explanation: CLIP 利用了網路上現成的圖文配對數據（如圖片與其 Alt 文字），無需昂貴的人工標註，實現了大規模預訓練。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: both
- id: 4421
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 模式崩潰 (Mode Collapse) 是 GAN 常見的問題，指的是？
  type: multiple_choice
  options:
  - 模型無法收斂 (Convergence Failure)
  - 生成器只能生成極少數種類的樣本，缺乏多樣性 (Lack of Diversity)
  - 判別器失效 (Discriminator Failure)
  - 訓練速度太慢 (Slow Training)
  correct_index: 1
  explanation: 生成器發現某種特定的假數據能輕易騙過判別器，於是就一直重複生成該數據，放棄了探索其他可能性。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4422
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: VAE 中的 KL 散度項作為正則化，強制潛在分佈接近？
  type: multiple_choice
  options:
  - 均勻分佈 (Uniform Distribution)
  - 標準常態分佈 (Standard Normal Distribution) (Standard Normal)
  - 泊松分佈 (Poisson Distribution)
  - 二項分佈 (Binomial Distribution)
  correct_index: 1
  explanation: 強制潛在空間符合常態分佈，保證了空間的連續性與完備性，讓我們能透過隨機採樣生成有意義的新數據。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4423
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型通常需要多少步才能生成一張高品質圖像？
  type: multiple_choice
  options:
  - 1 步 (1 Step)
  - 10 步左右 (Around 10 Steps)
  - 數百到上千步 (Hundreds to Thousands of Steps)
  - 無限步 (Infinite Steps)
  correct_index: 2
  explanation: 擴散模型是一個漸進式的去噪過程，步數越多效果通常越好，但也越慢。現代技術（如 DDIM）試圖減少步數。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4424
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: Prompt Engineering 在文字轉圖像生成中的作用是？
  type: multiple_choice
  options:
  - 寫程式碼 (Writing Code)
  - 設計精確的文字描述，引導模型生成符合預期的圖像風格與內容 (Crafting Text Prompts)
  - 調整模型參數 (Tuning Parameters)
  - 標註數據 (Labeling Data)
  correct_index: 1
  explanation: 好的 Prompt（如加入 "cyberpunk style", "8k"）能激發模型潛力，產出高品質結果。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: both
- id: 4425
  chapter_title: 生成式 AI 與多模態 AI
  section_title: AI 發展演進
  text: 物理 AI (Physical AI) 的典型例子是？
  type: multiple_choice
  options:
  - ChatGPT (Chatbot)
  - Midjourney (Image Generator)
  - 人形機器人 (Humanoid Robot)
  - 推薦系統 (Recommender System)
  correct_index: 2
  explanation: 物理 AI 走出螢幕，擁有實體軀幹，能在真實世界中移動和操作物體。
  tags:
  - chap-m2-ch4
  - sec-ai-evolution
  usage: both
- id: 4426
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: GAN 中的判別器 (Discriminator) 本質上是一個？
  type: multiple_choice
  options:
  - 生成模型 (Generative Model)
  - 二元分類器 (Binary Classifier) (True/False Classifier)
  - 回歸模型 (Regression Model)
  - 分群模型 (Clustering Model)
  correct_index: 1
  explanation: 判別器的任務很單純：判斷輸入圖片是「真 (1)」還是「假 (0)」。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4427
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: VAE 的編碼器 (Encoder) 輸出的是？
  type: multiple_choice
  options:
  - 一個固定的向量 (Fixed Vector)
  - 潛在分佈的參數 (均值 Mean 和變異數 Variance) (Distribution Parameters)
  - 重建的圖像 (Reconstructed Image)
  - 類別標籤 (Class Label)
  correct_index: 1
  explanation: VAE 不直接輸出編碼，而是輸出一個機率分佈的參數，這使得它具有生成能力（可以從分佈中採樣）。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4428
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 生成模型
  text: 擴散模型的前向過程是否需要訓練？
  type: multiple_choice
  options:
  - 需要 (Yes)
  - 不需要，是固定的加噪規則 (No, Fixed Rule)
  - 視情況而定 (Depends)
  - 只有第一步需要 (Only First Step)
  correct_index: 1
  explanation: 前向過程是預先定義好的數學過程（逐步加高斯雜訊），沒有參數需要學習。
  tags:
  - chap-m2-ch4
  - sec-generative-models
  usage: both
- id: 4429
  chapter_title: 生成式 AI 與多模態 AI
  section_title: 多模態應用
  text: CLIP 的「雙塔架構」指的是？
  type: multiple_choice
  options:
  - 兩個生成器 (Two Generators)
  - 兩個判別器 (Two Discriminators)
  - 獨立的圖像編碼器與文本編碼器 (Image & Text Encoders)
  - 兩個擴散模型 (Two Diffusion Models)
  correct_index: 2
  explanation: 圖像和文本分別通過各自的「塔」（編碼器）處理，最後在頂端進行向量對齊。
  tags:
  - chap-m2-ch4
  - sec-multimodal
  usage: both
- id: 4430
  chapter_title: 生成式 AI 與多模態 AI
