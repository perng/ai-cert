- chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 情境：RNN (循環神經網路) 在處理長文本時容易遇到的主要問題是？
  type: multiple_choice
  options:
  - 無法處理中文 (Cannot Process Chinese)
  - 記憶力太好 (Too Good Memory)
  - 梯度消失 (Vanishing Gradient)，導致遺忘前面的資訊 (Forget Early Info)
  - 計算太快 (Too Fast)
  correct_index: 2
  explanation: 隨著序列長度增加，RNN 的梯度在反向傳播時會指數級衰減，難以捕捉長距離依賴。
