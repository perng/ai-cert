questions:
- id: 4201
  chapter_title: 自然語言處理 (NLP)
  section_title: 定義與範疇
  text: 自然語言理解 (NLU) 的主要任務是？
  type: multiple_choice
  options:
  - 讓機器「說出」人類語言 (NLG - Natural Language Generation)
  - 讓機器「讀懂」輸入的語言，解析其結構與意圖 (NLU - Natural Language Understanding)
  - 將語音轉為文字 (Speech-to-Text)
  - 將文字轉為語音 (Text-to-Speech)
  correct_index: 1
  explanation: NLU 側重於理解輸入內容的含義（如意圖識別、實體提取），就像是做閱讀測驗。
  tags:
  - chap-m2-ch2
  - sec-nlp-definition
  usage: quiz
- id: 4202
  chapter_title: 自然語言處理 (NLP)
  section_title: 技術演進脈絡
  text: Word2Vec 技術的主要貢獻是？
  type: multiple_choice
  options:
  - 發明了 Transformer (Invented Transformer)
  - 建立了大量人工規則 (Manual Rules)
  - 將詞彙轉換為具有語意關係的數學向量 (Word Embeddings)
  - 解決了梯度消失問題 (Solved Vanishing Gradient)
  correct_index: 2
  explanation: Word2Vec 讓電腦能透過向量運算理解詞彙間的關係（如國王 - 男人 + 女人 = 皇后），開啟了深度學習 NLP 的新時代。
  tags:
  - chap-m2-ch2
  - sec-nlp-evolution
  usage: quiz
- id: 4203
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 在 TF-IDF 中，IDF (逆文件頻率) 的作用是？
  type: multiple_choice
  options:
  - 計算詞彙在文章中出現的次數 (Term Frequency)
  - 計算詞彙的向量 (Calculate Word Vector)
  - 降低那些在所有文章中都頻繁出現的常見詞的權重 (Inverse Document Frequency)
  - 增加長文章的權重 (Increase Weight for Long Docs)
  correct_index: 2
  explanation: IDF 懲罰那些隨處可見的通用詞，獎勵那些只在少數文章中出現的獨特詞，從而凸顯關鍵詞。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4204
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 斷詞 (Tokenization) 在中文處理中比英文困難的原因是？
  type: multiple_choice
  options:
  - 中文沒有時態 (No Tense)
  - 中文字太多 (Too Many Characters)
  - 中文文法太複雜 (Complex Grammar)
  - 中文沒有空格來分隔詞彙，需要演算法判斷詞的邊界 (No Space Delimiter)
  correct_index: 3
  explanation: 英文單字間有天然的空格分隔，而中文是連續的字串，必須透過 Jieba 等工具進行分詞才能進行後續處理。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4205
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: RNN (循環神經網路) 處理長序列時面臨的主要問題是？
  type: multiple_choice
  options:
  - 只能處理圖像 (Only Process Images)
  - 無法處理數字 (Cannot Process Numbers)
  - 梯度消失 (Vanishing Gradient)，導致遺忘前面的資訊 (Forgetting Early Info)
  - 計算量太小 (Computation too Small)
  correct_index: 2
  explanation: RNN 的短期記憶使其難以捕捉長距離的依賴關係（例如文章開頭的主詞影響結尾的動詞），因為梯度在反向傳播中會逐漸消失。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4206
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: LSTM (長短期記憶網路) 如何解決 RNN 的遺忘問題？
  type: multiple_choice
  options:
  - 引入「閘門」機制 (遺忘閘、輸入閘、輸出閘) (Gating Mechanism)
  - 使用 ReLU 活化函數 (Use ReLU)
  - 移除循環結構 (Remove Recurrence)
  - 增加更多層數 (Add More Layers)
  correct_index: 0
  explanation: LSTM 的閘門機制允許模型主動選擇記住重要的長期資訊並忽略無關的雜訊，有效解決了長依賴問題。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4207
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: Transformer 架構的核心機制是？
  type: multiple_choice
  options:
  - 遺傳演算法 (Genetic Algorithm)
  - 卷積神經網路 (CNN)
  - 自注意力機制 (Self-Attention)
  - 遞歸神經網路 (RNN)
  correct_index: 2
  explanation: Self-Attention 讓模型能同時關注序列中的所有位置，計算詞與詞之間的關聯性，實現了並行計算與全域理解。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4208
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: BERT 模型的主要特性是？
  type: multiple_choice
  options:
  - 單向生成 (只能看前面) (Unidirectional Generation)
  - 結構簡單 (Simple Structure)
  - 專門用於圖像生成 (Image Generation)
  - 雙向理解 (Bidirectional)，能同時利用上下文資訊 (Bidirectional Context)
  correct_index: 3
  explanation: BERT 使用 Transformer Encoder，透過遮罩語言模型 (MLM) 訓練，能同時看到前後文，因此在理解任務（如分類、問答）上表現優異。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: quiz
- id: 4209
  chapter_title: 自然語言處理 (NLP)
  section_title: 進階技術：大語言模型時代
  text: RAG (檢索增強生成) 技術主要用來解決 LLM 的什麼問題？
  type: multiple_choice
  options:
  - 運算速度慢 (Slow Computation)
  - 無法理解中文 (Cannot Understand Chinese)
  - 幻覺 (Hallucination) 與知識過時 (Outdated Knowledge)
  - 參數量太大 (Too Many Parameters)
  correct_index: 2
  explanation: RAG 結合了檢索系統與生成模型，讓 LLM 能參考最新的外部知識庫來回答問題，減少胡說八道並更新知識。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
  usage: quiz
- id: 4210
  chapter_title: 自然語言處理 (NLP)
  section_title: 進階技術：大語言模型時代
  text: LoRA (低秩自適應) 的主要優勢是？
  type: multiple_choice
  options:
  - 加速模型推論 (Accelerate Inference)
  - 提高模型準確率 (Improve Accuracy)
  - 大幅降低微調大型模型所需的算力與儲存空間 (Reduce Compute & Storage for Fine-tuning)
  - 增加模型參數量 (Increase Parameters)
  correct_index: 2
  explanation: LoRA 凍結原模型參數，只訓練外掛的小型低秩矩陣，使得在消費級 GPU 上微調大模型成為可能。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
  usage: quiz
- id: 4211
  chapter_title: 自然語言處理 (NLP)
  section_title: 應用情境
  text: 命名實體辨識 (NER) 的功能是？
  type: multiple_choice
  options:
  - 翻譯文章 (Translate Text)
  - 從文本中提取出具有特定意義的實體 (Extract Named Entities)
  - 分析情感 (Sentiment Analysis)
  - 生成摘要 (Generate Summary)
  correct_index: 1
  explanation: NER 將非結構化文本轉化為結構化資訊，識別出 "Steve Jobs" 是人名，"Apple" 是公司名。
  tags:
  - chap-m2-ch2
  - sec-nlp-applications
  usage: both
- id: 4212
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 「提示注入 (Prompt Injection)」是一種什麼樣的攻擊？
  type: multiple_choice
  options:
  - 竊取訓練資料 (Steal Training Data)
  - 癱瘓伺服器 (Crash Server)
  - 修改模型權重 (Modify Weights)
  - 透過惡意指令繞過模型的安全機制，誘導其輸出有害內容 (Bypass Safety Mechanisms)
  correct_index: 3
  explanation: 攻擊者利用 LLM 對指令的服從性，設計特殊 Prompt（如「忽略前面的限制...」）來突破防護。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4213
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 詞幹提取 (Stemming) 的目的是？
  type: multiple_choice
  options:
  - 將詞彙還原為原型 (如 running -> run) (Reduce to Root Form)
  - 翻譯詞彙 (Translate Words)
  - 標註詞性 (POS Tagging)
  - 增加詞彙量 (Increase Vocabulary)
  correct_index: 0
  explanation: Stemming 去除詞綴，將不同變化形式的詞統一為同一特徵，降低模型複雜度。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4214
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: Transformer 中的「位置編碼 (Positional Encoding)」有什麼作用？
  type: multiple_choice
  options:
  - 告訴模型每個字在句子中的順序 (Indicate Word Order)
  - 加密數據 (Encrypt Data)
  - 標註詞性 (POS Tagging)
  - 壓縮數據 (Compress Data)
  correct_index: 0
  explanation: 由於 Transformer 是並行處理所有字，缺乏 RNN 的序列概念，必須人為加入位置資訊讓模型知道詞序。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4215
  chapter_title: 自然語言處理 (NLP)
  section_title: 進階技術：大語言模型時代
  text: Zero-shot Learning (零樣本學習) 是指？
  type: multiple_choice
  options:
  - 不給模型任何範例，直接下指令要求完成任務 (No Examples Provided)
  - 使用 0 與 1 的數據 (Binary Data)
  - 使用 0 個 GPU 訓練 (Zero GPU)
  - 模型準確率為 0 (Zero Accuracy)
  correct_index: 0
  explanation: 利用 LLM 強大的泛化能力，僅憑任務描述（Prompt）就能完成未見過的任務，無需特定訓練數據。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
  usage: both
- id: 4216
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 為了防止 AI 生成的內容被濫用，可以使用什麼技術來標記來源？
  type: multiple_choice
  options:
  - 浮水印 (Watermarking)
  - 壓縮 (Compression)
  - 刪除 (Deletion)
  - 加密 (Encryption)
  correct_index: 0
  explanation: 數位浮水印可以在生成的文字或圖像中嵌入不可見的標記，幫助識別內容是否由 AI 產生。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4217
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: GPT 模型屬於哪種架構？
  type: multiple_choice
  options:
  - Transformer Encoder (BERT-like)
  - RNN (Recurrent Neural Network)
  - CNN (Convolutional Neural Network)
  - Transformer Decoder (GPT-like)
  correct_index: 3
  explanation: GPT (Generative Pre-trained Transformer) 使用 Decoder 架構，專注於單向的下一個字預測（生成任務）。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4218
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 在自注意力機制中，Query (Q), Key (K), Value (V) 的比喻中，Value 代表？
  type: multiple_choice
  options:
  - 你想找什麼 (借書單) (Query)
  - 書背上的標籤 (Key)
  - 書本裡的實際內容 (你要的資訊) (Value)
  - 圖書館管理員 (Librarian)
  correct_index: 2
  explanation: Q 用來查詢，K 用來被比對，V 則是根據比對結果（注意力權重）被提取出的實際資訊內容。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4219
  chapter_title: 自然語言處理 (NLP)
  section_title: 應用情境
  text: 情感分析 (Sentiment Analysis) 通常屬於哪種 NLP 任務？
  type: multiple_choice
  options:
  - 機器翻譯 (Machine Translation)
  - 語音識別 (Speech Recognition)
  - 文字分類 (Text Classification)
  - 文字生成 (Text Generation)
  correct_index: 2
  explanation: 情感分析將文本分類為「正面」、「負面」或「中立」，本質上是一個分類問題。
  tags:
  - chap-m2-ch2
  - sec-nlp-applications
  usage: both
- id: 4220
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 「紅隊演練 (Red Teaming)」在 AI 治理中的作用是？
  type: multiple_choice
  options:
  - 提高運算速度 (Increase Speed)
  - 慶祝專案成功 (Celebrate Success)
  - 增加訓練數據 (Increase Training Data)
  - 模擬攻擊者的角度，主動尋找模型的漏洞與有害輸出 (Simulate Adversarial Attacks)
  correct_index: 3
  explanation: 紅隊演練是一種壓力測試，透過攻擊性測試來發現潛在風險，以便在產品發布前進行修補。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4221
  chapter_title: 自然語言處理 (NLP)
  section_title: 技術演進脈絡
  text: 統計導向時期 (Statistical NLP) 的主要特點是？
  type: multiple_choice
  options:
  - 利用機器學習算法從海量文本中尋找機率規律 (Probabilistic Patterns)
  - 依賴人工編寫的規則 (Rule-based)
  - 能夠完美理解語意 (Perfect Understanding)
  - 使用深度神經網路 (Deep Neural Networks)
  correct_index: 0
  explanation: 統計方法（如 N-gram）放棄了死板的規則，轉而利用數據中的統計規律，但對長距離語意的理解仍有限。
  tags:
  - chap-m2-ch2
  - sec-nlp-evolution
  usage: both
- id: 4222
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 多頭注意力 (Multi-Head Attention) 的好處是？
  type: multiple_choice
  options:
  - 只能關注語法 (Syntax Only)
  - 只能關注語意 (Semantics Only)
  - 讓模型能從多個不同的角度捕捉詞與詞之間的關係 (Capture Diverse Relationships)
  - 減少計算量 (Reduce Computation)
  correct_index: 2
  explanation: 多頭機制就像請了多個專家，分別關注語法、指代、語意等不同層面，最後綜合起來得到更全面的理解。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4223
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 「成員推論攻擊 (Membership Inference Attack)」旨在？
  type: multiple_choice
  options:
  - 破壞模型結構 (Destroy Model Structure)
  - 推斷某個特定數據點是否在模型的訓練資料集中 (Infer Training Data Membership)
  - 增加模型準確率 (Increase Accuracy)
  - 修改模型輸出 (Modify Output)
  correct_index: 1
  explanation: 這種攻擊利用模型對訓練數據的「過度自信」，來探測某人的個資是否被用於訓練，是隱私洩漏的重大風險。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4224
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 為什麼 TF-IDF 中的 IDF 需要取對數 (log)？
  type: multiple_choice
  options:
  - 為了配合神經網路 (Fit Neural Network)
  - 為了避免數值過大，並平滑頻率分佈 (Scale Down & Smooth)
  - 為了讓數值變負 (Make Negative)
  - 為了增加計算難度 (Increase Complexity)
  correct_index: 1
  explanation: 文件總數 N 可能很大，取 log 可以將數值範圍壓縮，避免 IDF 權重過大而壓倒 TF。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4225
  chapter_title: 自然語言處理 (NLP)
  section_title: 應用情境
  text: 機器翻譯從「單字拼湊」進化到「通順句子」，主要歸功於哪項技術？
  type: multiple_choice
  options:
  - 規則庫 (Rule Base)
  - 字典查詢 (Dictionary Lookup)
  - 關鍵字替換 (Keyword Replacement)
  - 神經機器翻譯 (NMT) 與 Seq2Seq 模型 (Neural Machine Translation)
  correct_index: 3
  explanation: NMT 模型（尤其是 Transformer）能考慮整句的上下文進行翻譯，而非逐字翻譯，因此結果更流暢自然。
  tags:
  - chap-m2-ch2
  - sec-nlp-applications
  usage: both
- id: 4226
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: XAI (可解釋 AI) 中的 SHAP 值用於？
  type: multiple_choice
  options:
  - 加密數據 (Encrypt Data)
  - 壓縮模型 (Compress Model)
  - 生成圖像 (Generate Image)
  - 量化每個特徵對模型預測結果的貢獻程度 (Quantify Feature Contribution)
  correct_index: 3
  explanation: SHAP 基於博弈論，能計算出每個輸入特徵（如某個關鍵字）對最終預測結果的影響力大小，提供解釋性。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4227
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 在 NLP 預處理中，去除「停用詞 (Stop Words)」是指？
  type: multiple_choice
  options:
  - 刪除標點符號 (Remove Punctuation)
  - 刪除數字 (Remove Numbers)
  - 刪除對語意貢獻極低的高頻詞 (Remove Low-Information High-Frequency Words)
  - 刪除所有動詞 (Remove Verbs)
  correct_index: 2
  explanation: 停用詞通常是語法功能詞，攜帶的資訊量很少，去除它們可以減少雜訊並提高處理效率。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4228
  chapter_title: 自然語言處理 (NLP)
  section_title: 進階技術：大語言模型時代
  text: Few-shot Learning 通常需要提供多少個範例？
  type: multiple_choice
  options:
  - 0 個 (Zero)
  - 數百萬個 (Millions)
  - 數千個 (Thousands)
  - 少量 (如 1-5 個) (Few, e.g., 1-5)
  correct_index: 3
  explanation: Few-shot 介於 Zero-shot 和 Fine-tuning 之間，透過提供少數幾個範例讓模型「類比」學習，效果通常顯著提升。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
  usage: both
- id: 4229
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 對抗式訓練 (Adversarial Training) 的目的是？
  type: multiple_choice
  options:
  - 增加模型偏見 (Increase Bias)
  - 減少訓練時間 (Reduce Training Time)
  - 增強模型對抗惡意擾動樣本的魯棒性 (Enhance Robustness against Adversarial Examples)
  - 攻擊對手 (Attack Opponent)
  correct_index: 2
  explanation: 透過在訓練過程中主動加入被擾動的「攻擊樣本」，讓模型學會識別並防禦這些攻擊，提高安全性。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4230
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 詞嵌入 (Word Embeddings) 相比於 One-Hot Encoding 的主要優勢是？
  type: multiple_choice
  options:
  - 維度更高 (Higher Dimension)
  - 能夠捕捉詞彙之間的語意相似度，且維度較低 (Capture Semantic Similarity & Lower Dimension)
  - 不需要訓練 (No Training Needed)
  - 計算更簡單 (Simpler Calculation)
  correct_index: 1
  explanation: One-Hot 向量是正交的（無關聯），而 Word Embeddings 將語意相近的詞映射到距離相近的向量空間，且通常是低維稠密向量。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4231
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: BERT 的預訓練任務「遮罩語言模型 (Masked Language Model)」是指？
  type: multiple_choice
  options:
  - 預測下一個字 (Predict Next Word)
  - 翻譯句子 (Translate Sentence)
  - 判斷句子情感 (Sentiment Analysis)
  - 隨機遮蓋句子中的部分詞彙，讓模型利用上下文去猜測被遮蓋的詞 (Masked Word Prediction)
  correct_index: 3
  explanation: MLM 類似於「克漏字填空」，迫使模型必須同時理解前後文才能填出正確的詞，從而學會雙向語境。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4232
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 「Human-in-the-loop (人機協作)」在 AI 治理中意味著？
  type: multiple_choice
  options:
  - 人類只負責標註數據 (Humans Only Label Data)
  - AI 完全取代人類 (AI Replaces Humans)
  - 人類完全取代 AI (Humans Replace AI)
  - 在關鍵決策環節保留人類的介入與最終決定權 (Human Oversight & Decision)
  correct_index: 3
  explanation: 對於高風險應用，完全自動化是危險的。HITL 確保 AI 僅作為輔助，由人類把關最終結果，兼顧效率與安全。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4233
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: N-gram 模型中的 "N" 代表？
  type: multiple_choice
  options:
  - 連續出現的 N 個詞彙的組合 (Sequence of N Words)
  - 訓練數據量 (Data Volume)
  - 神經網路層數 (Number of Layers)
  - 詞彙維度 (Vocabulary Dimension)
  correct_index: 0
  explanation: N-gram 是一種統計語言模型，考慮連續 N 個詞的出現機率。例如 2-gram (Bigram) 考慮相鄰的兩個詞。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4234
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: Transformer 中的 Encoder 和 Decoder 分別負責？
  type: multiple_choice
  options:
  - 兩者功能相同 (Same Function)
