- id: 4240
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 資料偏見 (Data Bias) 會導致模型產生什麼後果？
  type: multiple_choice
  options:
  - 模型無法訓練 (Training Failure)
  - 模型內化並放大社會既有的刻板印象與歧視 (Amplify Stereotypes & Discrimination)
  - 模型運算變慢 (Slower Computation)
  - 模型準確率變高 (Higher Accuracy)
  correct_index: 1
  explanation: 如果訓練數據本身有偏見（如性別歧視），模型不僅會學到，甚至會因為統計規律而放大這種偏見。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4241
  chapter_title: 自然語言處理 (NLP)
  section_title: 深度思考情境題
  text: 情境：你正在開發一個法律諮詢 AI，使用 RAG 技術。然而，使用者回報 AI 引用了已經廢除的舊法條。這最可能是 RAG 系統的哪個環節出了問題？應如何改善？
  type: multiple_choice
  options:
  - 使用者問錯問題 (Wrong Question)
  - 檢索資料庫 (Knowledge Base) 未及時更新或缺乏版本控制 (Outdated Knowledge Base)
  - Prompt 寫得不好 (Poor Prompt)
  - 生成模型 (LLM) 太笨 (LLM Incompetence)
  correct_index: 1
  explanation: RAG 的準確性高度依賴於檢索到的文件品質。如果知識庫本身包含過時資訊且未被標記或過濾，LLM 就會基於錯誤資訊生成回答。資料庫的維護與更新是 RAG 成功的關鍵。
  tags:
  - chap-m2-ch2
  - sec-scenario
  usage: mock
- id: 4242
  chapter_title: 自然語言處理 (NLP)
  section_title: 深度思考情境題
  text: 情境：你的公司想微調一個 LLM 來撰寫專業的醫療報告，但只有 100 份高品質的醫生手寫報告範例。直接進行全參數微調 (Full Fine-tuning) 容易導致什麼問題？應改用什麼策略？
  type: multiple_choice
  options:
  - 模型變笨；應從頭訓練 (Model Degradation)
  - 欠擬合；應增加模型層數 (Underfitting)
  - 計算資源不足；應購買更多 GPU (Insufficient Compute)
  - 過擬合 (Overfitting) 或災難性遺忘 (Catastrophic Forgetting)；應採用 Parameter-Efficient Fine-Tuning (PEFT) 技術 (Use PEFT)
  correct_index: 3
  explanation: 在極少數據下對巨大模型進行全量微調，極易導致模型死記硬背這 100 份報告（過擬合），並忘記原本通用的語言能力。LoRA 等技術凍結大部分參數，只微調少量參數，能有效避免此問題。
  tags:
  - chap-m2-ch2
  - sec-scenario
  usage: mock
- id: 4243
  chapter_title: 自然語言處理 (NLP)
  section_title: 深度思考情境題
  text: 情境：在情感分析任務中，你發現模型對於「這部電影不算太差」這句話判斷錯誤，認為是負面評價（因為看到「差」字）。這顯示模型可能過度依賴什麼？應如何改進？
  type: multiple_choice
  options:
  - 數據量太少 (Insufficient Data)
  - 斷詞錯誤 (Tokenization Error)
  - 過度依賴語法 (Syntax Reliance)
  - 過度依賴關鍵字 (Keyword-based) 而非語意理解 (Keyword Reliance)
  correct_index: 2
  explanation: 傳統詞袋模型或簡單模型容易忽略「不」、「太」等修飾詞對語氣的反轉。BERT 等模型透過 Self-Attention 能理解「不...差」的雙重否定結構，從而正確判斷語意。
  tags:
  - chap-m2-ch2
  - sec-scenario
  usage: mock
- id: 4244
  chapter_title: 自然語言處理 (NLP)
  section_title: 深度思考情境題
  text: 情境：攻擊者發現你的公開聊天機器人會洩漏訓練數據中的個資。他最可能使用了什麼攻擊手法？你該如何防禦？
  type: multiple_choice
  options:
  - Prompt Injection 或成員推論攻擊；應加強輸入過濾、實施差分隱私訓練 (Prompt Injection / Membership Inference)
  - DDoS 攻擊；應增加頻寬 (DDoS)
  - SQL Injection；應修補資料庫漏洞 (SQL Injection)
  - 暴力破解；應加強密碼 (Brute Force)
  correct_index: 0
  explanation: 針對 LLM 的攻擊通常針對其生成特性。透過誘導式 Prompt 讓模型「吐真言」是常見手法。防禦需從訓練端（差分隱私）和應用端（輸入輸出過濾）雙管齊下。
  tags:
  - chap-m2-ch2
  - sec-scenario
  usage: mock
- id: 4245
  chapter_title: 自然語言處理 (NLP)
  section_title: 深度思考情境題
  text: 情境：你使用 Word2Vec 訓練詞向量，發現 "Doctor" - "Man" + "Woman" 的結果竟然接近 "Nurse" 而非 "Doctor"。這揭示了什麼問題？
  type: multiple_choice
  options:
  - 模型訓練失敗 (Training Failed)
  - 訓練數據中存在性別刻板印象 (Gender Bias)，模型忠實地學到了這些偏見 (Learned Bias)
  - 向量維度不足 (Insufficient Dimension)
  - Word2Vec 演算法有 Bug (Algorithm Bug)
  correct_index: 1
  explanation: 這是 NLP 領域著名的偏見案例。因為歷史文本中女性常與護士連結，男性與醫生連結，模型學到了這種相關性。這提醒我們必須對詞向量進行去偏見 (Debiasing) 處理，例如將性別方向從職業詞彙中移除。
  tags:
  - chap-m2-ch2
  - sec-scenario
  usage: mock
