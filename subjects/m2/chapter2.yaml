- id: 4235
  chapter_title: 自然語言處理 (NLP)
  section_title: 應用情境
  text: 聊天機器人從關鍵字匹配進化到生成式 AI，主要提升了？
  type: multiple_choice
  options:
  - 系統穩定性 (System Stability)
  - 硬體需求 (Hardware Requirements)
  - 對話的流暢度、邏輯性與上下文理解能力 (Fluency, Logic & Context)
  - 回應速度 (Response Speed)
  correct_index: 2
  explanation: 舊式機器人只能針對特定關鍵字給出死板回覆；生成式 AI 能理解複雜語意並生成像人類一樣自然的回應。
  tags:
  - chap-m2-ch2
  - sec-nlp-applications
  usage: both
- id: 4236
  chapter_title: 自然語言處理 (NLP)
  section_title: 風險與治理
  text: 差分隱私 (Differential Privacy) 技術如何在訓練中保護隱私？
  type: multiple_choice
  options:
  - 加密模型權重 (Encrypt Weights)
  - 限制存取權限 (Restrict Access)
  - 在數據或梯度中加入精心設計的雜訊 (Add Noise to Data/Gradients)
  - 刪除所有數據 (Delete All Data)
  correct_index: 2
  explanation: 差分隱私從數學上保證了攻擊者無法從模型輸出反推特定個體的資訊，是目前最強的隱私保護技術之一。
  tags:
  - chap-m2-ch2
  - sec-nlp-risks
  usage: both
- id: 4237
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: Bag of Words (詞袋模型) 的主要缺點是？
  type: multiple_choice
  options:
  - 無法處理英文 (Cannot Process English)
  - 忽略了詞彙的順序與語法結構 (Ignore Word Order & Syntax)
  - 計算太慢 (Too Slow)
  - 詞彙量太少 (Vocabulary too Small)
  correct_index: 1
  explanation: BoW 只統計詞頻，將句子視為一袋散亂的詞，丟失了「貓咬狗」與「狗咬貓」之間的語意差異。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  usage: both
- id: 4238
  chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 為什麼 LSTM 需要「遺忘閘 (Forget Gate)」？
  type: multiple_choice
  options:
  - 為了隨機遺忘 (Random Forgetting)
  - 為了主動丟棄不再重要的舊資訊，騰出空間給新資訊 (Discard Irrelevant Info)
  - 為了節省記憶體 (Save Memory)
  - 為了加速計算 (Accelerate Calculation)
  correct_index: 1
  explanation: 在處理長序列時，並非所有歷史資訊都有用。遺忘閘讓模型能動態更新記憶狀態，適應上下文的轉換。
