  text: 某企業嘗試以N-gram 語言模型（N-gram Language Model）建立客服自動回覆系統，但發現模型生成的句子雖在片段上合理，卻缺乏整體語意連貫性。此問題最可能源自N-gram 模型的哪一項限制？ (114年第二梯次)
