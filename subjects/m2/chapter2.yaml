- chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 情境：Transformer 模型中的「自注意力機制 (Self-Attention)」主要解決了什麼問題？
  type: multiple_choice
  options:
  - 壓縮模型 (Model Compression)
  - 讓模型能同時關注句子中不同位置的詞，捕捉長距離關聯 (Capture Long-range Dependencies)
  - 語音辨識 (Speech Recognition)
  - 圖片分類 (Image Classification)
  correct_index: 1
  explanation: Self-Attention 允許模型直接計算句子中任意兩個詞的關聯強度，突破了 RNN 的序列限制。
  tags:
  - chap-m2-ch2
  - sec-nlp-core-tech
  id: 4249
  usage: both
- chapter_title: 自然語言處理 (NLP)
  section_title: 進階技術：大語言模型時代
  text: 情境：Zero-shot Learning (零樣本學習) 是指？
  type: multiple_choice
  options:
  - 給模型看很多範例 (Many Examples)
  - 不給任何範例，直接下指令要求模型完成任務 (No Examples)
  - 模型壞了 (Model Broken)
  - 訓練時間為零 (Zero Training Time)
  correct_index: 1
  explanation: 利用 LLM 強大的泛化能力，在未見過特定任務範例的情況下直接進行推理。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
  id: 4250
  usage: both
- chapter_title: 自然語言處理 (NLP)
  section_title: 核心技術與模型
  text: 情境：BERT 模型的主要架構是？
  type: multiple_choice
  options:
  - CNN (Convolutional Neural Network)
  - Transformer Encoder (BERT-like)
  - Transformer Decoder (GPT-like)
  - RNN (Recurrent Neural Network)
  correct_index: 1
  explanation: BERT 使用雙向 Encoder 架構，擅長理解上下文語意，適合分類與問答任務。
