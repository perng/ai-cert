  text: 情境：RAG (檢索增強生成) 的主要優勢是？
  type: multiple_choice
  options:
  - 模型最小 (Smallest Model)
  - 減少幻覺並能利用最新的外部知識 (Reduce Hallucination & Use External Knowledge)
  - 不需要資料庫 (No Database Needed)
  - 生成速度最快 (Fastest Generation)
  correct_index: 1
  explanation: RAG 結合了檢索系統的準確性與生成模型的流暢性，解決了知識過時與瞎掰問題。
  tags:
  - chap-m2-ch2
  - sec-nlp-advanced
