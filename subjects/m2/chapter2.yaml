- id: m2-114-2-018
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 當Transformer 模型發生「注意力分布過於平均（Attention Collapse）」的情形時，導致模型無法有效聚焦於關鍵資訊，下列哪一項策略可有效改善此問題？ (114年第二梯次)
  type: multiple_choice
  options:
  - 提高Query-Key 點積（Dot Product）的縮放常數
  - 在Softmax 前加入高斯雜訊（Gaussian Noise）
  - 使用 ReLU 函數取代 Softmax
  - 對注意力權重施加稀疏化約束（Sparsity Constraint）
  correct_index: 3
  explanation: 注意力過於平均時模型無法聚焦重點，對權重施加稀疏化約束可鼓勵模型將注意力集中在少數關鍵 token 上。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-019
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 某研究團隊正在訓練一個針對低資源語言（如少數民族語言）的語言模型，但該語言僅有約1 萬筆語料可用。在訓練過程中出現明顯的過擬合現象，若希望在不新增真實語料的前提下提升模型的泛化能力，採用下列哪一種方法最為適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 將Transformer 的隱藏層維度擴增至1024，以提升表徵能力
  - 採用反向翻譯（Back-Translation）技術，以生成額外目標語句的偽平行語料（Pseudo‑Parallel Corpus）
  - 對詞嵌入矩陣（Embedding Matrix），施加L1 正則化以壓縮模型參數
  - 將多語言BERT（mBERT）中所有Transformer 層全部凍結以保留預訓練知識
  correct_index: 1
  explanation: 反向翻譯可用其他語言資料生成偽平行語料，在不新增真實人工標註語料的情況下擴充低資源語言訓練資料並改善泛化。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-033
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 企業團隊在使用Word2Vec 模型訓練客服文本語料時，若訓練資料量龐大且希望模型能更有效捕捉罕見詞的語意關聯，下列哪一種訓練策略最為適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 採用Skip-gram 模型，但以隨機初始化權重加快高頻詞的訓練收斂
  - 採用CBOW 模型（Continuous Bag of Words Model）並結合TF-IDF 權重以強化低頻詞表示
  - 採用Skip-gram 模型，利用中心詞預測周圍詞語，能更有效學習低頻詞關係
  - 採用CBOW 模型（Continuous Bag of Words Model），利用周圍詞預測中心詞，能提升罕見詞的語意穩定度
  correct_index: 2
  explanation: Skip-gram 以中心詞預測上下文，對低頻詞通常比 CBOW 更敏感，適合在大型語料中學習罕見詞的語意關聯。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-043
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 某金融科技公司欲導入AI 模型協助客服郵件自動分類（投訴、詢問、表揚）。團隊同時考慮兩種模型設計：方案 A（生成式路徑）：採用VAE 建構潛在語意空間，再結合下游分類器進行標籤預測；方案 B（鑑別式路徑）：採用BERT Classifier 直接根據輸入文本進行監督式分類。現有標註資料約 2,000 筆，資料分佈均勻但擴充成本高。若團隊希望公平比較兩種模型的資料利用效率與泛化能力，下列哪一種實驗設計最能突顯兩者的本質差異？ (114年第二梯次)
  type: multiple_choice
  options:
  - 在完整資料集上分別訓練兩者，並比較其分類準確率（Accuracy）與推論時間
  - 在低資源情境（Low-resource Setting）下，逐步減少標註比例（100%、50%、10%），比較其F1-score
  - 使用GAN 自動生成文本樣本補足資料，觀察兩模型在資料增強後的精確率（Precision）差異
  - 在相同訓練資料上固定輸入維度，僅調整模型參數量，比較其對過擬合的敏感度
  correct_index: 1
  explanation: 要比較生成式與鑑別式路徑的資料利用效率，應在不同標註比例下觀察 F1 等指標變化，低資源設定最能突顯泛化差異。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-047
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 某金融科技公司導入多任務學習架構，讓單一 Transformer 模型同時執行OCR（Optical Character Recognition）後的文檔分類以及命名實體辨識（Named Entity Recognition, NER）任務，以協助自動歸檔與抽取關鍵金融資訊。在部署初期，團隊發現當模型的NER 準確率（Accuracy）提升時，文檔分類準確率反而下降。若模型架構正確且資料品質良好，下列哪一項最可能是造成此現象的原因？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型架構無法同時支援文字分類與序列標註任務（Sequence Labeling）
  - 文檔分類任務不需要語意化表徵（Contextualized Representation）
  - 損失函數（Loss Function）未進行權重平衡，導致任務間競爭
  - 所使用的BERT 模型無法支援多任務輸出頭（Multi-Head Outputs）
  correct_index: 2
  explanation: 多任務模型共用表徵時，不同任務的損失若權重失衡，某一任務的梯度可能主導更新，造成另一任務表現下降。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
- id: m2-114-2-049
  chapter_title: 自然語言處理 (NLP)
  section_title: 歷屆考題
  text: 某電商平台導入AI 情感分析模型，用以自動偵測顧客評論中的負面情緒並觸發客服機制。然而，上線後發現模型在面對不同語言或族群書寫風格的評論時表現不一致，例如部分語氣強烈的正面評論被誤判為負面，而禮貌但含批評意圖的評論卻被判為中性。若從技術與資料治理的角度分析，下列哪一項描述不正確？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型未啟用詞嵌入正規化（Embedding Normalization）可能造成語意距離不穩定，導致預測誤差
  - 訓練語料若偏向特定文化或語氣特徵，可能使模型產生內隱偏誤（Implicit Bias）
  - 模型若訓練資料來源不平衡，容易導致對不同語言或族群風格的情緒判斷不準確
  - Transformer 架構能捕捉上下文語意，但若訓練資料偏差仍存在，模型仍可能學習到偏誤判斷
  correct_index: 0
  explanation: 跨語言與族群風格表現不一致多半來自訓練資料偏差與治理不足；僅以未啟用 embedding normalization 解釋情緒判斷偏差過於片面，因此是不正確敘述。
  tags:
  - chap-m2-ch2
  - sec-past-exam
  - past-exam
  usage: mock
