- chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 情境：公司全面依賴某一家新創公司的 SaaS AI 服務，某天該新創公司突然倒閉，導致公司業務停擺。這屬於什麼風險？如何預防？
  type: multiple_choice
  options:
  - 技術風險；應自建機房 (Technical Risk)
  - 市場風險；應降價促銷 (Market Risk)
  - 供應商風險 (Vendor Lock-in)；應制定備援計畫或選擇標準化介面 (Vendor Risk)
  - 法規風險；應控告對方 (Legal Risk)
  correct_index: 2
  explanation: 過度依賴單一供應商會產生鎖定風險。應評估供應商穩定性，並預留遷移或替代方案（如多雲策略）。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  id: 4163
  usage: both
- chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 情境：POC 結果顯示 AI 能將瑕疵檢測準確率從 95% 提升到 95.5%，但需投入數百萬硬體成本。專案經理應做出什麼建議？
  type: multiple_choice
  options:
  - 終止或重新評估，因為 ROI 過低 (Terminate or Re-evaluate)
  - 解雇檢測員 (Fire Inspectors)
  - 更換所有硬體 (Replace Hardware)
  - 立即導入，因為準確率提升了 (Deploy Immediately)
  correct_index: 0
  explanation: 雖然技術指標提升，但若提升幅度微小且成本極高（邊際效益遞減），導致 ROI 不佳，則不具備商業可行性。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  id: 4164
  usage: both
