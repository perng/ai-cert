  id: 4154
  usage: both
- chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 情境：某招聘 AI 模型被發現對特定大學畢業的應徵者評分特別低，經查這些大學多為歷史上的少數族裔學校。這屬於哪種偏見來源？
  type: multiple_choice
  options:
  - 演算法錯誤 (Algorithm Error)
