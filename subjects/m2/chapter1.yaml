  text: 某銀行計劃將AI詐欺偵測模組整合至核心交易系統，主管機關要求全流程必須符合金融監管對「不可否認性(Non-repudiation)」的資訊安全規範，以確保日後能進行法務追蹤與稽核。下列哪一項措施最能確保此要求的落實？ (114年第二梯次)
  type: multiple_choice
  options:
  - 為每筆AI模型推論記錄其輸入與輸出結果的加密雜湊值(Hash)，並簽署數位簽章以確保不可竄改性
  - 優化模型效能以降低平均推論延遲至100ms以下，提升使用者體驗
  - 增加主機備援數量，以確保系統在故障時持續可用
  - 將模型推論請求導入負載平衡器，避免單點壅塞導致服務延遲
  correct_index: 0
  explanation: 記錄輸入輸出的加密雜湊值 (Hash) 並加上數位簽章，能確保資料未被竄改，符合不可否認性要求。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4196
  chapter_title: AI 專案生命週期
  text: 某AI服務系統每次推論請求需約1秒完成，且必須支撐高達10,000次請求每秒(RPS)的流量。為確保系統具備高可用性且能穩定應付流量峰值，下列哪一種架構方案最為合適？ (114年第二梯次)
  type: multiple_choice
  options:
  - 依賴單台超高效能伺服器進行垂直擴展，提升硬體規格
  - 採用容器化部署並水平擴展服務實例，結合自動彈性伸縮機制(Auto Scaling)
  - 限制最大併發連線數，以避免系統過載
  - 增加批次處理大小，一次同時處理上千筆請求
  correct_index: 1
  explanation: 容器化搭配自動彈性伸縮 (Auto Scaling) 能根據流量動態調整資源，是應對高併發流量峰值的最佳架構。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4197
  chapter_title: AI 專案生命週期
  text: 某企業已將AI模型部署於生產環境，為確保系統持續穩定運作，並能提前偵測模型效能可能衰退，技術團隊希望透過監控指標進行預警。下列哪一項監控指標最具預測效力，能提早發現模型效能下滑風險？ (114年第二梯次)
  type: multiple_choice
  options:
  - 系統CPU與記憶體使用率波動幅度
  - 模型推論結果的置信度(Confidence)分佈變化趨勢
  - API平均回應時間與延遲百分位數變化
  - 輸入特徵與訓練資料分布差異的PSI (Population Stability Index)指數
  correct_index: 3
  explanation: PSI (Population Stability Index) 專門用於衡量預期分佈 (訓練集) 與實際分佈 (上線後) 的差異，是偵測資料漂移的有效指標。
