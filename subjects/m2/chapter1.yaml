questions:
- id: 4101
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 在 AI 專案啟動前，進行可行性研究的主要目的是？
  type: multiple_choice
  options:
  - 為了趕上科技潮流 (Follow Trends)
  - 為了消耗預算 (Spend Budget)
  - 確保專案能解決實際問題並具備技術與經濟可行性 (Ensure Feasibility & Problem Solving)
  - 為了招聘更多員工 (Hire More Staff)
  correct_index: 2
  explanation: 盲目導入 AI 往往導致失敗。可行性研究能確認需求、技術能力與成本效益，是「謀定而後動」的關鍵。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: quiz
- id: 4102
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 在需求分析中，「痛點 (Pain Points)」通常指什麼？
  type: multiple_choice
  options:
  - 組織流程中的瓶頸、重複性工作或決策困難 (Process Bottlenecks & Repetitive Work)
  - 硬體設備的故障 (Hardware Failure)
  - 軟體的 Bug (Software Bugs)
  - 員工的身體疼痛 (Physical Pain)
  correct_index: 0
  explanation: 痛點是指組織運作中效率低落、成本高昂或無法滿足客戶需求的地方，正是 AI 可以發揮價值之處。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: quiz
- id: 4103
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 評估「技術可行性」時，關於資料品質的考量不包括？
  type: multiple_choice
  options:
  - 資料的儲存成本 (Storage Cost)
  - 資料的代表性 (Representativeness)
  - 資料的標註品質 (Labeling Quality)
  - 資料的完整性 (Completeness)
  correct_index: 0
  explanation: 儲存成本屬於「成本效益評估」，而非資料本身的品質或技術可行性問題。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: quiz
- id: 4104
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 投資報酬率 (ROI) 的計算公式是？
  type: multiple_choice
  options:
  - 投資回報 / 投資成本 (Return / Cost)
  - 投資成本 / 投資回報 (Cost / Return)
  - (投資回報 - 投資成本) / 投資成本 (Net Return / Cost)
  - (投資回報 + 投資成本) / 投資成本 (Total Return / Cost)
  correct_index: 2
  explanation: ROI 衡量每單位投資帶來的淨利潤，公式為 (淨回報 / 成本) * 100%。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: quiz
- id: 4105
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 概念驗證 (POC) 的主要目的是？
  type: multiple_choice
  options:
  - 訓練所有員工 (Train All Staff)
  - 在最小風險下驗證技術可行性與商業價值 (Validate Feasibility & Value with Min Risk)
  - 完成最終產品開發 (Complete Product Development)
  - 進行大規模推廣 (Large-scale Rollout)
  correct_index: 1
  explanation: POC 是小規模的實驗，旨在快速驗證想法是否可行，以決定是否值得投入更多資源進行全面開發。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: quiz
- id: 4106
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 在 AI 專案中，哪種硬體資源最適合用於大規模深度學習模型的訓練？
  type: multiple_choice
  options:
  - 硬碟 (Hard Disk Drive)
  - CPU (Central Processing Unit)
  - GPU (如 NVIDIA A100) (Graphics Processing Unit)
  - 記憶體 (Memory / RAM)
  correct_index: 2
  explanation: GPU 具有強大的並行計算能力，能顯著加速深度學習中大量的矩陣運算。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: quiz
- id: 4107
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 敏捷開發 (Agile) 中的 Sprint (短衝) 通常持續多久？
  type: multiple_choice
  options:
  - 1 年 (1 Year)
  - 1-4 週 (1-4 Weeks)
  - 1 天 (1 Day)
  - 3-6 個月 (3-6 Months)
  correct_index: 1
  explanation: Sprint 是敏捷開發的基本週期，通常為期 1 到 4 週，旨在快速迭代並產出可交付的成果。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: quiz
- id: 4108
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 負責建置資料管道 (Pipeline) 與 ETL 流程的角色是？
  type: multiple_choice
  options:
  - UI 設計師 (UI Designer)，負責介面設計
  - 專案經理 (PM)，負責進度管理
  - 資料科學家 (Data Scientist)，負責模型分析
  - 資料工程師 (Data Engineer)，負責資料管道與架構
  correct_index: 3
  explanation: 資料工程師專注於資料的基礎建設，確保資料能穩定、乾淨地流向分析端。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: quiz
- id: 4109
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 哪種開發模式適合「核心業務、需高度客製化且資料隱私要求高」的專案？
  type: multiple_choice
  options:
  - 完全委外開發 (Outsourcing)
  - 購買現成 SaaS 服務 (Buy SaaS)
  - 使用開源軟體不修改 (Use Open Source As-Is)
  - 內部團隊開發 (In-house Development)
  correct_index: 3
  explanation: 內部開發能完全掌控技術與資料，雖成本高但最適合核心競爭力相關且敏感的專案。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: quiz
- id: 4110
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 「垃圾進，垃圾出 (Garbage In, Garbage Out)」是指哪種風險？
  type: multiple_choice
  options:
  - 運算資源不足 (Insufficient Compute Power)
  - 法規風險 (Regulatory Risk)
  - 模型過擬合 (Overfitting)
  - 資料品質不足 (Poor Data Quality)
  correct_index: 3
  explanation: 若輸入模型的訓練資料品質差（含錯誤、雜訊），無論模型多先進，輸出的結果必然也是無效的。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: quiz
- id: 4111
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 針對高風險項目採取「暫緩執行」的策略，屬於哪種風險控管手段？
  type: multiple_choice
  options:
  - 接受 (Acceptance)，承擔風險後果
  - 轉移 (Transfer)，如購買保險
  - 迴避 (Avoidance)，不執行高風險項目
  - 緩解 (Mitigation)，降低發生機率或衝擊
  correct_index: 2
  explanation: 迴避策略是指主動避開會引發風險的活動，例如因無法承擔法律風險而決定不做某個專案。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4112
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: AI 倫理中的「公平性 (Fairness)」原則旨在避免什麼？
  type: multiple_choice
  options:
  - 模型運算太慢 (Slow Computation)
  - 模型過擬合 (Overfitting)
  - 資料洩漏 (Data Leakage)
  - 模型對特定群體產生歧視性結果 (Discriminatory Results)
  correct_index: 3
  explanation: 公平性要求 AI 系統在決策時不應因受保護特徵（如種族、性別）而產生系統性的偏差或歧視。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4113
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 歐盟 GDPR 賦予使用者的權利不包括？
  type: multiple_choice
  options:
  - 反對自動化決策權 (Right to Object to Automated Decision-making)
  - 無限索賠權 (Unlimited Compensation)
  - 資料可攜權 (Right to Data Portability)
  - 被遺忘權 (Right to be Forgotten)
  correct_index: 1
  explanation: GDPR 雖有罰則，但並未賦予使用者「無限索賠權」。其他三項均為 GDPR 核心權利。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4114
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: MLOps 中的「持續監控」主要在偵測什麼？
  type: multiple_choice
  options:
  - 模型漂移 (Model Drift) 與資料漂移 (Data Drift)
  - 員工出勤 (Employee Attendance)
  - 硬體溫度 (Hardware Temperature)
  - 程式碼行數 (Lines of Code)
  correct_index: 0
  explanation: AI 模型上線後，環境與資料分佈可能隨時間改變，導致模型失效。持續監控漂移是維護模型效能的關鍵。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4115
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 在 Scrum 團隊中，負責「移除開發障礙，確保流程順暢」的角色是？
  type: multiple_choice
  options:
  - Stakeholder (利害關係人)，提供回饋
  - Product Owner (產品負責人)，定義需求
  - Dev Team (開發團隊)，執行開發
  - Scrum Master (敏捷教練)，移除障礙
  correct_index: 3
  explanation: Scrum Master 是流程的守護者，負責排除干擾、促進溝通，讓開發團隊能專注於工作。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4116
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 淨現值 (NPV) 為正代表什麼？
  type: multiple_choice
  options:
  - 專案不需要資金 (No Funding Needed)
  - 專案風險很高 (High Risk)
  - 專案會虧損 (Project Loss)
  - 專案具投資價值，預期回報高於成本 (Positive Investment Value)
  correct_index: 3
  explanation: NPV 將未來現金流折現回當前價值。NPV > 0 表示考慮時間價值後，專案仍能獲利。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: both
- id: 4117
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 哪種雲端服務模式提供「彈性擴展的運算與儲存」，適合初期投入？
  type: multiple_choice
  options:
  - 公有雲 (Public Cloud)
  - 邊緣運算 (Edge Computing)
  - 大型主機 (Mainframe)
  - 地端部署 (On-premise Deployment)
  correct_index: 0
  explanation: 公有雲提供按需付費 (Pay-as-you-go) 和彈性伸縮 (Scalability)，降低了初期硬體購置成本。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4118
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: XAI (Explainable AI) 技術的主要目的是提升 AI 的？
  type: multiple_choice
  options:
  - 運算速度 (Computation Speed)
  - 準確率 (Accuracy)
  - 資料量 (Data Volume)
  - 可解釋性與透明度 (Explainability & Transparency)
  correct_index: 3
  explanation: XAI 試圖打開 AI 的「黑盒子」，讓人類理解模型做出特定決策的原因，從而建立信任。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4119
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 領域專家 (Domain Expert) 在 AI 專案中的主要貢獻是？
  type: multiple_choice
  options:
  - 設計 UI (Design UI)
  - 寫程式碼 (Coding)
  - 維護伺服器 (Maintain Servers)
  - 提供業務知識，協助定義問題與驗收成果 (Provide Domain Knowledge)
  correct_index: 3
  explanation: 領域專家（如醫生、金融分析師）懂業務不懂 AI，但他們的知識對於定義正確的問題和評估模型是否實用至關重要。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4120
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 透過購買保險來處理風險，屬於哪種策略？
  type: multiple_choice
  options:
  - 緩解 (Mitigation)
  - 迴避 (Avoidance)
  - 接受 (Acceptance)
  - 轉移 (Transfer)，如購買保險
  correct_index: 3
  explanation: 風險轉移是指將風險造成的財務後果轉嫁給第三方（如保險公司）。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4121
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 「回收期 (Payback Period)」越短，通常代表？
  type: multiple_choice
  options:
  - 專案越複雜 (More Complex Project)
  - 資金流動性越好，投資回收越快 (Better Liquidity & Faster Return)
  - 投資風險越高 (Higher Investment Risk)
  - 效益越低 (Lower Benefit)
  correct_index: 1
  explanation: 回收期短意味著企業能更快拿回本金，降低了資金被長期佔用的風險。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: both
- id: 4122
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: Git 主要用於什麼管理？
  type: multiple_choice
  options:
  - 資料庫備份 (Database Backup)
  - 伺服器監控 (Server Monitoring)
  - 專案時程 (Project Schedule)
  - 程式碼版本控制 (Version Control)
  correct_index: 3
  explanation: Git 是目前最流行的分散式版本控制系統，用於追蹤程式碼的變更歷史。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4123
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 哪項法規主要規範美國醫療產業的資料隱私？
  type: multiple_choice
  options:
  - GDPR (General Data Protection Regulation)
  - PDPA (Personal Data Protection Act)
  - HIPAA (Health Insurance Portability and Accountability Act)
  - PCI-DSS (Payment Card Industry Data Security Standard)
  correct_index: 2
  explanation: HIPAA (Health Insurance Portability and Accountability Act) 是美國保護病患健康資訊隱私的聯邦法律。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4124
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 工作分解結構 (WBS) 的作用是？
  type: multiple_choice
  options:
  - 評估風險 (Assess Risk)
  - 計算成本 (Calculate Cost)
  - 將複雜的大專案拆解為可管理的小任務 (Break Down Project into Tasks)
  - 增加工作量 (Increase Workload)
  correct_index: 2
  explanation: WBS 將專案層層拆解，直到變成可分配、可監控的具體工作包 (Work Packages)。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4125
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 模型漂移 (Model Drift) 通常是由什麼引起的？
  type: multiple_choice
  options:
  - 程式碼錯誤 (Code Error)
  - 真實世界的資料分佈隨時間發生變化 (Data Distribution Shift)
  - 硬體故障 (Hardware Failure)
  - 學習率設定錯誤 (Wrong Learning Rate)
  correct_index: 1
  explanation: 模型是基於歷史數據訓練的。當現實環境改變（如消費者喜好改變），舊模型就不再適用，這就是漂移。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4126
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 下列何者屬於「結構化資料預測」的應用場景？
  type: multiple_choice
  options:
  - 人臉辨識 (Face Recognition)
  - 銷售量預測 (基於歷史報表) (Sales Prediction)
  - 文章摘要生成 (Text Summarization)
  - 語音轉文字 (Speech to Text)
  correct_index: 1
  explanation: 銷售報表是典型的表格數據（結構化數據），適合用機器學習模型進行回歸預測。其他選項多為非結構化數據。
  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: both
- id: 4127
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: Docker 的主要功能是？
  type: multiple_choice
  options:
  - 資料清洗 (Data Cleaning)
  - 環境容器化，確保開發與生產環境一致 (Containerization)
  - 模型訓練 (Model Training)
  - 版本控制 (Version Control)
  correct_index: 1
  explanation: Docker 將應用程式及其依賴打包成容器，解決了「在我的機器上可以跑，在伺服器上不行」的環境不一致問題。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4128
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 台灣個資法 (PDPA) 要求收集個資時必須履行什麼義務？
  type: multiple_choice
  options:
  - 告知義務 (告知目的、類別、利用期間等) (Notification Obligation)
  - 付費義務 (Payment Obligation)
  - 沉默義務 (Confidentiality Obligation)
  - 賠償義務 (Compensation Obligation)
  correct_index: 0
  explanation: 根據個資法，收集個資前必須明確告知當事人收集目的、利用範圍等資訊，並取得同意。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4129
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 在甘特圖中，橫軸通常代表？
  type: multiple_choice
  options:
  - 成本 (Cost)
  - 時間 (Time)
  - 人力 (Manpower)
  - 任務 (Task)
  correct_index: 1
  explanation: 甘特圖以條狀圖顯示專案進度，橫軸表示時間軸，縱軸表示任務。
  tags:
  - chap-m2-ch1
  - sec-project-planning
  usage: both
- id: 4130
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 為了降低「員工抗拒變革」的組織風險，應採取什麼措施？
  type: multiple_choice
  options:
  - 強制裁員 (Forced Layoffs)
  - 隱瞞 AI 導入計畫 (Hide Plans)
  - 進行 AI 轉型培訓與溝通，強調 AI 是輔助而非取代 (Training & Communication)
  - 忽視員工意見 (Ignore Feedback)
  correct_index: 2
  explanation: 變革管理 (Change Management) 是關鍵。透過溝通與賦能 (Upskilling)，讓員工看到 AI 對工作的幫助，能降低抵觸情緒。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
