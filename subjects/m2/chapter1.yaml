- chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 情境：在 Sprint 進行到一半時，業務部門突然要求增加一個全新的功能。Product Owner (PO) 應如何處理？
  type: multiple_choice
  options:
  - 取消目前的 Sprint (Cancel Sprint)
  - 責怪團隊動作太慢 (Blame Team)
  - 放入 Product Backlog，在下個 Sprint 規劃 (Add to Backlog)
  - 要求團隊立刻加班做完 (Overtime)
  correct_index: 2
  explanation: 為了保障團隊專注與開發節奏，Sprint 期間不應隨意插入新需求。新需求應加入待辦清單 (Backlog)，經優先級排序後在後續 Sprint
    執行。
