- id: 4212
  chapter_title: AI 專案生命週期
  text: 某金融科技公司導入多任務學習架構，讓單一Transformer模型同時執行OCR (Optical Character Recognition)後的文檔分類以及命名實體辨識(Named Entity Recognition, NER)任務，以協助自動歸檔與抽取關鍵金融資訊。在部署初期，團隊發現當模型的NER準確率(Accuracy)提升時，文檔分類準確率反而下降。若模型架構正確且資料品質良好，下列哪一項最可能是造成此現象的原因？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型架構無法同時支援文字分類與序列標註任務(Sequence Labeling)
  - 文檔分類任務不需要語意化表徵(Contextualized Representation)
  - 損失函數(Loss Function)未進行權重平衡，導致任務間競爭
  - 所使用的BERT模型無法支援多任務輸出頭(Multi-Head Outputs)
  correct_index: 2
  explanation: 多任務學習中，若損失函數權重未平衡，模型可能會偏向簡單或主導的任務，導致其他任務效能下降。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4213
  chapter_title: AI 專案生命週期
  text: 某數據工程師使用DBSCAN演算法對一份數百萬筆的高維顧客資料進行聚類分析，但發現程式執行速度極慢，甚至出現記憶體不足的情況。若要在不改變演算法核心邏輯的前提下，最有效提升其運算效率的作法為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - 改用以平均連結(Average Linkage)為基礎的階層式群集法(Hierarchical Clustering)
  - 採用高效率的距離索引結構(Distance Index Structure)，例如KD-Tree或Ball Tree
  - 將鄰域半徑(Epsilon)參數調得極小，以減少鄰近點的數量
  - 在資料前處理時增加標準化後的特徵維度數
  correct_index: 1
  explanation: 使用 KD-Tree 或 Ball Tree 等空間索引結構，可以加速最近鄰搜索，顯著提升 DBSCAN 的分群效率。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4214
  chapter_title: AI 專案生命週期
  text: 某電商平台導入AI情感分析模型，用以自動偵測顧客評論中的負面情緒並觸發客服機制。然而，上線後發現模型在面對不同語言或族群書寫風格的評論時表現不一致，例如部分語氣強烈的正面評論被誤判為負面，而禮貌但含批評意圖的評論卻被判為中性。若從技術與資料治理的角度分析，下列哪一項描述不正確？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型未啟用詞嵌入正規化(Embedding Normalization)可能造成語意距離不穩定，導致預測誤差
  - 訓練語料若偏向特定文化或語氣特徵，可能使模型產生內隱偏誤(Implicit Bias)
  - 模型若訓練資料來源不平衡，容易導致對不同語言或族群風格的情緒判斷不準確
  - Transformer架構能捕捉上下文語意，但若訓練資料偏差仍存在，模型仍可能學習到偏誤判斷
  correct_index: 0
  explanation: 詞嵌入正規化有助於穩定模型訓練，但「未啟用正規化導致預測誤差」並非造成不同族群判斷不一致的主要原因，主因通常是訓練資料偏差。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4215
  chapter_title: AI 專案生命週期
  text: 某設計師使用公司內部建置的生成式AI工具製作行銷素材，並輸入提示語(Prompt)：「請生成一張模特兒手持品牌飲料、背景為海邊夕陽的照片」。系統能正確生成主要主題與場景，但輸出的圖像中，品牌標誌顏色常有誤差，或人物手部姿勢顯得不自然。若從多模態生成模型的技術機制分析，此現象最可能是下列哪一項原因所造成？ (114年第二梯次)
  type: multiple_choice
  options:
  - 擴散式生成模型的去雜訊過程出現隨機梯度漂移，導致影像像素錯誤
  - 提示語過長造成Transformer的位置編碼超出上下文限制，導致生成混亂
  - CLIP模型中的文字編碼器與影像編碼器在語意嵌入空間未充分對齊，導致跨模態理解偏差
  - 模型未採用對比學習(Contrastive Learning)損失函數，無法建立多模態語意關聯
  correct_index: 2
  explanation: CLIP 模型若文字與影像編碼器在語意空間未充分對齊，會導致模型無法正確理解複雜的圖文關聯，如顏色與物件的對應。
  tags:
  - chap-m2-ch1
  usage: mock
