- id: 4198
  chapter_title: AI 專案生命週期
  text: 企業團隊在使用Word2Vec模型訓練客服文本語料時，若訓練資料量龐大且希望模型能更有效捕捉罕見詞的語意關聯，下列哪一種訓練策略最為適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 採用Skip-gram模型，但以隨機初始化權重加快高頻詞的訓練收斂
  - 採用CBOW模型(Continuous Bag of Words Model)並結合TF-IDF權重以強化低頻詞表示
  - 採用Skip-gram模型，利用中心詞預測周圍詞語，能更有效學習低頻詞關係
  - 採用CBOW模型(Continuous Bag of Words Model)，利用周圍詞預測中心詞，能提升罕見詞的語意穩定度
  correct_index: 2
  explanation: Skip-gram 模型利用中心詞預測上下文，對於低頻詞 (Rare Words) 的學習效果通常優於 CBOW。
