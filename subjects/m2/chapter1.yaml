  usage: mock
- id: 4167
  chapter_title: AI 專案生命週期
  text: 某跨國金融科技公司導入Transformer架構開發多語客服系統，以提升長篇金融文件的自動翻譯品質。下列何者為該模型能顯著改善翻譯準確度的主要原因？ (114年第二梯次)
  type: multiple_choice
  options:
  - 透過自注意力機制(Self-Attention Mechanism)捕捉長距離語境依賴關係
  - 透過卷積運算(Convolution Operation)加速訓練過程
  - 透過強化學習(Reinforcement Learning)自動調整語句生成策略
  - 透過資料增強(Data Augmentation)平衡多語語料比例
  correct_index: 0
  explanation: Transformer 的自注意力機制 (Self-Attention) 能有效捕捉長距離的語境依賴關係，這對於翻譯長篇文件特別重要。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4168
  chapter_title: AI 專案生命週期
  text: 某企業計畫應用BERT (Bidirectional Encoder Representations from Transformers)模型分析大量顧客意見，以強化客服自動回覆系統。在BERT的預訓練過程中，「遮罩語言模型(Masked Language Model, MLM)」的主要訓練策略為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - 依序遮罩句尾詞語，讓模型從左到右逐步生成完整句子
  - 隨機遮罩部分詞語，並讓模型根據雙向上下文(Bidirectional Context)預測被遮罩的詞
  - 透過對抗訓練(Adversarial Training)生成語意相似的擾動樣本以提升泛化性
  - 以未遮罩的詞為條件，使用解碼器(Decoder)結構重建整句內容
  correct_index: 1
  explanation: MLM (Masked Language Model) 的策略是隨機遮罩部分詞語，並讓模型根據雙向上下文預測被遮罩的詞。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4169
  chapter_title: AI 專案生命週期
  text: 在詞向量(Word Embedding)訓練方法中，GloVe (Global Vectors for Word Representation)與Word2Vec的主要差異為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - Word2Vec以詞頻權重訓練詞向量，而GloVe以隨機初始化向量進行學習
  - Word2Vec以全局統計矩陣為基礎，而GloVe採用神經網路進行上下文預測
  - Word2Vec為基於預測的模型，而GloVe為基於共現統計的模型
  - Word2Vec僅能用於靜態文本語料，而GloVe可應用於即時語料更新
  correct_index: 2
  explanation: Word2Vec 是基於預測的模型 (Predictive Model)，而 GloVe 是基於共現矩陣的統計模型 (Count-based Model)。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4170
  chapter_title: AI 專案生命週期
  text: 某企業以詞頻-逆文件頻率(Term Frequency Inverse Document Frequency, TF-IDF)方法分析顧客意見內容，但發現模型在處理篇幅較長的回饋文本時，無法準確反映關鍵詞的重要性。下列何者為造成此現象的主要原因？ (114年第二梯次)
  type: multiple_choice
  options:
  - 長文本中的詞頻偏高，導致常見詞權重被過度放大
  - 長文本中缺乏明確句子邊界，造成TF-IDF無法計算詞頻
  - TF-IDF無法同時處理多份文件
  - 長文本會改變IDF(Inverse Document Frequency)的計算，使所有詞權重趨於相近
  correct_index: 0
  explanation: TF-IDF 傾向於給予長文本中頻繁出現的詞較高的權重，但長文本本身詞頻就高，可能導致常見詞權重被過度放大，無法突顯關鍵詞。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4171
  chapter_title: AI 專案生命週期
  text: 某企業嘗試以N-gram語言模型(N-gram Language Model)建立客服自動回覆系統，但發現模型生成的句子雖在片段上合理，卻缺乏整體語意連貫性。此問題最可能源自N-gram模型的哪一項限制？ (114年第二梯次)
  type: multiple_choice
  options:
  - N-gram模型在訓練過程中需要龐大計算量，導致長句無法收斂
  - N-gram模型僅根據固定長度的前序詞建立機率估計，難以捕捉長距離依賴關係(Long-range Dependencies)
  - N-gram模型缺乏語意嵌入(Semantic Embedding)層，因此無法表徵詞語間的語意相似度
  - N-gram模型假設詞與詞之間相互獨立，導致無法建構上下文語意關聯
  correct_index: 1
  explanation: N-gram 模型僅考慮前 N-1 個詞的歷史，難以捕捉長距離的依賴關係，導致生成的句子整體語意連貫性不足。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4172
  chapter_title: AI 專案生命週期
  text: 在企業導入的智慧監控系統中，模型以物件偵測(Object Detection)方式自動辨識影像中的人物與車輛。若評估指標採用平均精確率(Mean Average Precision, mAP)，其中IoU (Intersection over Union)值設定較高時，代表下列哪一項意義？ (114年第二梯次)
  type: multiple_choice
  options:
  - 預測邊界框與真實邊界框的重疊程度越高，模型偵測結果越精準
  - 預測邊界框與真實邊界框的誤差越大，導致mAP數值上升
  - 模型整體精確率(Precision)降低，但召回率(Recall)上升
  - 預測邊界框的評估結果不受真實框大小影響
  correct_index: 0
  explanation: IoU (Intersection over Union) 衡量預測框與真實框的重疊程度。IoU 越高，代表預測框與真實框越接近，偵測結果越精準。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4173
  chapter_title: AI 專案生命週期
  text: 關於Softmax與Max-Pooling，下列敘述何者正確？ (114年第二梯次)
  type: multiple_choice
  options:
  - Softmax與Max-Pooling都會將特徵張量壓縮為單一最大值
  - Max-Pooling會對輸入進行機率分佈的轉換
  - Softmax會保留所有輸入資訊，但以比例表示；Max-Pooling只保留區域最大值
  - Softmax主要用於特徵降維，而Max-Pooling用於分類輸出
  correct_index: 2
  explanation: Softmax 將輸出轉換為機率分佈（總和為1），保留所有資訊；Max-Pooling 則只保留區域內的最大值，丟棄其他資訊。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4174
  chapter_title: AI 專案生命週期
  text: 某企業在訓練生成式AI模型時，導入資料增強(Data Augmentation)技術以擴充訓練資料，但觀察到模型效能反而下降。下列哪一項最可能的原因與對應改善策略最為正確？ (114年第二梯次)
  type: multiple_choice
  options:
  - 增強樣本未經隨機初始化，導致模型梯度更新不穩定，應重新設計訓練啟動流程
  - 增強後資料的特徵分佈與原始資料不一致，影響模型的泛化能力，應檢查並調整增強策略以維持語意一致性
  - 增強樣本的比例過高，造成模型對特定資料產生偏好，應適度提高增強比例並調整學習率
  - 增強後資料的標註可信度下降，導致訓練訊號偏差，應以半監督學習方式重新校正資料
  correct_index: 1
  explanation: 資料增強若改變了資料的語意（例如過度扭曲影像或替換關鍵詞），會導致特徵分佈與原始資料不一致，影響模型泛化能力。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4175
  chapter_title: AI 專案生命週期
  text: 如果希望同時兼顧「精確率(Precision)」和「召回率(Recall)」，下列哪一個指標可以作為綜合評估的標準？ (114年第二梯次)
  type: multiple_choice
  options:
  - 準確率(Accuracy)
