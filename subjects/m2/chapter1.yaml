- id: 4200
  chapter_title: AI 專案生命週期
  text: 某媒體公司計畫導入CLIP (Contrastive Language - Image Pre-training)模型，以協助大量影像自動標註與搜尋，並希望在無需新增標訓資料的情況下，僅透過文字提示(Text Prompt)即可識別影像內容。請問此應用情境中，CLIP能夠達成的關鍵技術特性為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - 透過圖文對比式學習(Contrastive Learning)將影像與文字映射至共同嵌入空間(Shared Embedding Space)，可直接以語意相似度進行零樣本分類
  - 透過影像增強與特徵擴散降低標訓資料需求
  - 以監督式學習結合多層感知器(Multilayer Perceptron, MLP)進行影像特徵分類
  - 以自迴歸生成模型(Autoregressive Model)逐步生成文字標籤描述影像內容
  correct_index: 0
  explanation: CLIP 透過對比學習將影像與文字映射到同一嵌入空間，使得模型能理解圖像與文字的語意關聯，實現 Zero-shot 分類。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4201
  chapter_title: AI 專案生命週期
  text: 某資料科學團隊在開發預測模型時，針對多種模型設定(如學習率、樹深度、正則化係數等)進行系統化測試，希望找出在驗證資料上表現最穩定的組合。此過程最可能採用下列哪一種方法？ (114年第二梯次)
  type: multiple_choice
  options:
  - 使用交叉驗證(Cross Validation)反覆評估模型以降低過擬合風險
  - 透過網格搜尋(Grid Search)在多組超參數設定中進行系統化搜尋與評估
  - 以隨機搜尋(Random Search)快速探索部分參數空間以提升搜尋效率
  - 採用貝葉斯優化(Bayesian Optimization)根據歷次結果動態調整搜尋方向
  correct_index: 1
  explanation: 網格搜尋 (Grid Search) 是一種系統化的超參數最佳化方法，會遍歷所有定義的參數組合。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4202
  chapter_title: AI 專案生命週期
  text: 某公司正在訓練一個大型語音合成模型，開發團隊使用多台GPU進行訓練，但經常出現GPU記憶體不足問題。由於模型架構已固定且無法更換硬體，團隊希望在維持模型效能與收斂品質的前提下，下列哪一種方法最有效降低單張GPU的記憶體壓力？ (114年第二梯次)
  type: multiple_choice
  options:
  - 減少訓練資料量以降低記憶體使用
  - 採用較小的批次大小(Batch Size)並搭配資料分片(Data Sharding)分散訓練負載
  - 增加學習率(Learning Rate)以加快收斂速度
  - 改用測試資料集(Test Set)進行部分訓練以節省空間
  correct_index: 1
  explanation: 減小 Batch Size 並搭配 Data Sharding (資料平行) 可以有效降低單張 GPU 的記憶體負載。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4203
  chapter_title: AI 專案生命週期
  text: 某影像設計團隊在使用Stable Diffusion生成4K級產品圖時，發現影像邊緣與細節存在顆粒化與模糊現象。若僅能在生成階段進行調整，希望提升畫面清晰度與紋理層次，同時避免過度平滑，下列哪一項作法最適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 降低取樣步數，以縮短生成時間
  - 增加取樣步數並選擇高品質取樣器，以強化細節還原度
  - 提高CFG (Classifier-Free Guidance)值，使生成結果更具創意與多樣性
  - 改用低解析度輸入以降低計算成本
  correct_index: 1
  explanation: 增加取樣步數並選擇高品質取樣器 (Sampler) 有助於生成更精細的細節，改善模糊問題。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4204
  chapter_title: AI 專案生命週期
  text: 某企業的資料科學團隊利用ARIMA模型(AutoRegressive Integrated Moving Average Model)預測每週產品銷售量。模型建立完成後，分析人員發現預測誤差隨時間呈現週期性波動，且自相關函數(ACF)顯示殘差在多個時滯(Lag)上仍顯著不為零。根據上述現象，最合理的模型診斷結論為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型殘差符合白噪音(White Noise)假設，預測表現穩定
  - 模型殘差雖有輕微異常，但可視為隨機誤差忽略不計
  - 模型存在配適不足(Underfitting)問題，需重新調整p或q參數以捕捉時間依賴性
  - 殘差特性不影響預測結果，無須進一步修正
  correct_index: 2
  explanation: 若殘差存在顯著的自相關性 (ACF 不為零)，代表模型未能完全捕捉時間序列中的依賴關係，屬於配適不足 (Underfitting)。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4205
  chapter_title: AI 專案生命週期
  text: 下列哪一項最正確地描述了VAE (Variational Autoencoder)、GAN (Generative Adversarial Network)與擴散模型(Diffusion Model)在多模態潛在空間對齊(Latent Alignment)與生成策略上的根本差異？ (114年第二梯次)
  type: multiple_choice
  options:
  - VAE透過顯式潛在變數建模實現跨模態對齊，適合捕捉整體語意結構但生成解析度有限；GAN透過對抗損失(Adversarial Loss)在不同模態間學習分佈映射，生成品質高但穩定性差；擴散模型則以條件化噪聲反推(Conditional Denoising)方式實現高保真跨模態生成，兼具穩定性與多樣性
  - VAE與Diffusion Model均屬隱式生成架構，主要依賴對抗式訓練實現跨模態對齊；GAN則以顯式後驗估計方式提升樣本一致性
  - VAE與GAN均使用馬爾可夫鏈(Markov Chain)進行跨模態轉換；Diffusion Model則透過KL散度最小化學習語意對應
  - 三者在多模態應用中皆依賴同一潛在表徵空間(Shared Latent Space)，僅在解碼器結構不同而已
  correct_index: 0
  explanation: VAE 基於機率圖模型與顯式潛在變數；GAN 基於賽局理論與對抗損失；Diffusion Model 基於熱力學擴散過程與條件化去噪。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4206
  chapter_title: AI 專案生命週期
  text: 在進行超參數調校(Hyperparameter Tuning)時，若直接在K-Fold交叉驗證(Cross-Validation)的資料上同時調整模型參數並評估效能，最可能導致下列哪一種問題？ (114年第二梯次)
  type: multiple_choice
  options:
  - 模型的交叉驗證結果出現過度樂觀偏差(Over-optimistic Bias)，因測試摺資料間接參與參數選擇，造成資料洩漏(Data Leakage)
  - 模型會在每一摺(Fold)內反覆調整參數，導致訓練不穩與過度正則化
  - 因交叉驗證資料被重複使用，造成效能方差增大，無法獲得穩定估計
  - K-Fold交叉驗證的假設與超參數搜尋相衝突，導致驗證過程失效
  correct_index: 0
  explanation: 若在交叉驗證的過程中同時進行參數選擇與效能評估，會導致測試資料洩漏 (Data Leakage)，使評估結果過度樂觀。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4207
  chapter_title: AI 專案生命週期
  text: 若部署一個深度學習模型至金融風控系統，該模型採用鑑別式架構(如Transformer Classifier)。然而上線後，模型對新樣本的分類錯誤率顯著上升，經檢查發現，輸入資料分佈已與原訓練集明顯不同。針對此情形，下列哪一種應對策略最為適合？ (114年第二梯次)
  type: multiple_choice
  options:
  - 改用生成對抗網路(GAN)生成新樣本並混入訓練集
  - 改用邏輯迴歸模型(Logistic Regression)以提升穩定性
  - 增加模型容量(Model Capacity)，以學習更多樣本差異
  - 使用變分自編碼器(VAE)監控潛在空間分佈，偵測輸入資料偏移
  correct_index: 3
  explanation: VAE 可以學習訓練資料的潛在分佈，用來偵測新樣本是否偏離該分佈 (Out-of-Distribution Detection)。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4208
  chapter_title: AI 專案生命週期
  text: 某金融科技公司欲導入AI模型協助客服郵件自動分類(投訴、詢問、表揚)。團隊同時考慮兩種模型設計： 方案A(生成式路徑)：採用VAE建構潛在語意空間，再結合下游分類器進行標籤預測； 方案B(鑑別式路徑)：採用BERT Classifier直接根據輸入文本進行監督式分類。 現有標註資料約2,000筆，資料分佈均勻但擴充成本高。若團隊希望公平比較兩種模型的資料利用效率與泛化能力，下列哪一種實驗設計最能突顯兩者的本質差異？ (114年第二梯次)
  type: multiple_choice
  options:
  - 在完整資料集上分別訓練兩者，並比較其分類準確率(Accuracy)與推論時間
  - 在低資源情境(Low-resource Setting)下，逐步減少標註比例(100%、50%、10%)，比較其F1-score
  - 使用GAN自動生成文本樣本補足資料，觀察兩模型在資料增強後的精確率(Precision)差異
  - 在相同訓練資料上固定輸入維度，僅調整模型參數量，比較其對過擬合的敏感度
  correct_index: 1
  explanation: 在低資源情境下比較 F1-score，能觀察模型在資料稀缺時的泛化能力與學習效率，突顯預訓練模型的優勢。
  tags:
  - chap-m2-ch1
  usage: mock
- id: 4209
  chapter_title: AI 專案生命週期
  text: 某電信公司希望建立一個模型來預測顧客是否即將流失，並進一步模擬不同促銷或服務策略下顧客的行為變化，以生成多樣化的虛擬樣本資料進行A/B測試與行銷策略評估。若要同時兼顧預測與資料生成的需求，最適合採用下列哪一種方法？ (114年第二梯次)
