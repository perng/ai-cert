  tags:
  - chap-m2-ch1
  - sec-feasibility
  usage: both
- id: 4137
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 哪種開發模式的「客製化彈性」最低？
  type: multiple_choice
  options:
  - 內部團隊開發 (In-house Development)
  - 混合模式 (Hybrid Model)
  - 現有商業服務 (SaaS)
  - 委外開發 (Outsourcing)
  correct_index: 2
  explanation: SaaS 產品通常是標準化的，雖然好用但難以針對特定企業的特殊需求進行深度修改。
  tags:
