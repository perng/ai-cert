  text: 情境：團隊計畫訓練一個千億參數的大型語言模型 (LLM)，預計訓練時間需數個月。應優先採購哪種硬體？
  type: multiple_choice
  options:
  - 高時脈 CPU (High Clock CPU)
  - 大容量 SSD (Large SSD)
  - 高階 GPU (如 NVIDIA H100/A100) 叢集 (High-end GPU Cluster)
  - 大容量 RAM (Large RAM)
  correct_index: 2
  explanation: 大型深度學習模型的訓練極度依賴 GPU 的並行運算能力與高頻寬記憶體 (HBM)，這是縮短訓練時間的關鍵。
