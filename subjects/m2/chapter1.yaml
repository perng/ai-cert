  section_title: 風險管理
  text: 情境：行銷部門希望收集使用者在 App 內的點擊行為來訓練推薦模型。根據個資法 (PDPA)，首要步驟是？
  type: multiple_choice
  options:
  - 購買防火牆 (Buy Firewall)
  - 先收集再說 (Collect First)
