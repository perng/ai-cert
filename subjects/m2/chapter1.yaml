- id: 4166
  chapter_title: AI 專案生命週期
  text: 某電商企業希望利用自然語言處理(NLP)技術，分析顧客在社群平台與商品評論中的文字內容，以即時掌握顧客對產品的滿意度變化。若採用情感分析(Sentiment Analysis)模型，其主要目的為何？ (114年第二梯次)
  type: multiple_choice
  options:
  - 預測顧客使用的語言風格與語氣
  - 判斷文本中所表達的情感傾向
  - 將顧客留言自動翻譯成企業內部指定語言
  - 產生顧客評論的自動化摘要內容
  correct_index: 1
  explanation: 情感分析的主要目的是判斷文本中表達的情緒傾向（如正面、負面、中性），以了解顧客滿意度。
