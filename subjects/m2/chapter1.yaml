  - 標註者疲勞 (Labeler Fatigue)
  - 歷史偏見 (Historical Bias)
  correct_index: 3
  explanation: 歷史數據反映了過去社會結構的不平等。AI 若直接學習這些數據，就會繼承並複製歷史上的偏見。
