- chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 情境：某公司想做「客戶流失預測」，但檢查資料庫發現 60% 的客戶資料缺乏「最後一次登入時間」欄位。這屬於哪種可行性問題？
  type: multiple_choice
  options:
  - 資料標註錯誤 (Labeling Error)
  - 資料隱私問題 (Privacy Issue)
