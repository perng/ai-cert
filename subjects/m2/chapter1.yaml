- id: 4140
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 為了防止「侵權」風險，在使用網路爬蟲收集資料時應注意？
  type: multiple_choice
  options:
  - 隱藏 IP 位址 (Hide IP)
  - 爬取速度越快越好 (Faster is Better)
  - 只爬取文字不爬圖片 (Text Only)
  - 遵守 robots.txt 協議與著作權法，確認資料授權條款 (Compliance with Robots.txt & Copyright)
  correct_index: 3
  explanation: 網路公開資料不代表可以隨意商用。必須尊重網站的爬蟲協議與資料的智慧財產權。
