- chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 情境：某影音串流平台需要訓練一個推薦模型，流量在週末會暴增 10 倍。最符合成本效益的基礎設施選擇是？
  type: multiple_choice
  options:
  - 使用邊緣運算 (Edge Computing)
