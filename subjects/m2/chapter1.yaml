- id: 4135
  chapter_title: AI 專案生命週期
  section_title: 風險管理
  text: 自動重新訓練 (Automated Retraining) 機制通常在什麼時候被觸發？
  type: multiple_choice
  options:
  - 每天固定時間 (Daily Schedule)
  - 隨機觸發 (Random Trigger)
  - 當監控系統偵測到模型漂移或效能低於閾值時 (Drift or Performance Drop Detected)
  - 專案結束時 (End of Project)
  correct_index: 2
  explanation: MLOps 的核心就是自動化。當監控指標顯示模型「過期」了，系統應自動啟動再訓練流程以維持效能。
  tags:
  - chap-m2-ch1
  - sec-risk-management
  usage: both
- id: 4136
  chapter_title: AI 專案生命週期
  section_title: AI 導入評估與可行性研究
  text: 評估資料「代表性 (Representativeness)」是為了避免？
  type: multiple_choice
  options:
  - 儲存空間不足 (Insufficient Storage)
