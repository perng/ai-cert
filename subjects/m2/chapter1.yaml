- id: 4134
  chapter_title: AI 專案生命週期
  section_title: 專案規劃
  text: 資料科學家 (Data Scientist) 與資料工程師 (Data Engineer) 的主要分工差異在於？
  type: multiple_choice
  options:
  - 工程師只負責修電腦 (Fixing Computers)
  - 兩者工作完全相同 (Same Role)
  - 科學家負責硬體，工程師負責軟體 (Hardware vs Software)
  - 科學家負責模型分析與優化，工程師負責資料管道與架構 (Analysis vs Pipeline)
  correct_index: 3
  explanation: 工程師負責「把水管接好」（資料流），科學家負責「分析水質」（數據價值）。兩者相輔相成。
  tags:
