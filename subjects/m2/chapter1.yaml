  chapter_title: AI 專案生命週期
  text: 進行影像分類任務時，研究團隊嘗試利用主成分分析(Principal Component Analysis, PCA)將輸入特徵從1024維降至100維，並將降維後的資料輸入支持向量機(Support Vector Machine, SVM)模型進行訓練。關於此作法，下列哪一項描述最為合理？ (114年第二梯次)
  type: multiple_choice
  options:
  - PCA保留的主成分必然能提升SVM的分類準確率
  - 使用原始高維資料通常更能保留資訊，因此PCA沒有實際意義
  - PCA可讓SVM自動適用於非線性(Nonlinear)資料集
  - 降維後可降低訓練時間並減少過擬合(Overfitting)風險
  correct_index: 3
  explanation: 降維 (PCA) 可以減少特徵數量，降低運算複雜度，並減少過擬合風險，特別是在特徵數遠大於樣本數時。
