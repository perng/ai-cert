  usage: both
- id: 7522
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 為了落實最小權限原則 (Least Privilege)，系統設計時應該怎麼做？
  type: multiple_choice
  options:
  - 要求使用者在每次對話前都重新輸入一次登入密碼
  - 給予代理人作業系統的最高管理員權限以防出錯
  - 僅提供代理人完成當前任務所絕對需要的最低權限
  - 將所有的系統密碼直接寫死在代理人的提示詞之中
  correct_index: 2
  explanation: 最小權限原則可降低代理人遭挾持時對系統造成的損害範圍。
  tags:
  - chap-m5-ch5
  usage: both
- id: 7523
  chapter_title: 多代理系統與未來發展
  section_title: 多代理系統概述
  text: 當任務需要高度專業化的知識時，為什麼多代理系統會比單一代理表現更好？
  type: multiple_choice
  options:
  - 因為可以配置具有不同領域專業與工具的專屬代理
  - 因為多代理系統必定擁有比單一代理更快的網路連線
  - 因為多代理系統可以自動上網搜尋最新的專業論文
  - 因為多代理系統可以完全不受到任何硬體效能的限制
  correct_index: 0
  explanation: 分工可以讓特定代理專精於單一領域，提升整體的決策品質。
