questions:
- id: 7501
  chapter_title: 多代理系統與未來發展
  section_title: 多代理系統概述
  text: 多代理系統（MAS）能「超越上下文視窗限制」的原理是？
  type: multiple_choice
  options:
  - 透過先進的資料壓縮技術大幅縮小上下文佔用的空間
  - 使用參數規模更大的 LLM 模型來強制增加上下文長度
  - 任務分割給多個代理，各自擁有完整的獨立上下文視窗
  - 讓所有參與協作的代理輪流使用同一個上下文記憶視窗
  correct_index: 2
  explanation: 每個代理都有自己完整的上下文視窗。透過任務分割，多個代理可以並行處理不同部分，整體系統處理的資訊量遠超任何單一代理的上下文限制。
  tags:
  - chap-m5-ch5
  - sec-mas-overview
  usage: both
- id: 7502
  chapter_title: 多代理系統與未來發展
  section_title: 多代理協作模式
  text: 「協調者-執行者模式 (Orchestrator-Worker)」中，協調者代理的主要職責是？
  type: multiple_choice
  options:
  - 主要功能是為執行者代理提供各類底層工具呼叫的能力
  - 負責嚴格監控所有執行者代理的 API 使用量與花費
  - 負責整體任務規劃、分配子任務，並負責整合最終結果
  - 專門負責執行系統中最困難且最消耗資源的子任務
  correct_index: 2
  explanation: 協調者負責「管理」而非「執行」，它拆解主任務、分配給專業執行者，並在所有子任務完成後整合成最終輸出，是多代理系統的核心指揮角色。
  tags:
  - chap-m5-ch5
  - sec-mas-patterns
  usage: both
- id: 7503
  chapter_title: 多代理系統與未來發展
  section_title: 多代理協作模式
  text: 「辯論模式 (Debate)」的多代理架構主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 確保代理之間在傳遞訊息時不會遺失任何重要的參數
  - 大幅加速整個多代理系統在處理複雜任務時的執行速度
  - 透過不同立場的相互審視來提高答案品質、減少偏見與錯誤
  - 顯著降低多代理系統在頻繁互動時所產生的 API 呼叫成本
  correct_index: 2
  explanation: 辯論模式讓代理從正反兩方批判性地審視問題，這種對抗性設計能有效揭露單一代理可能忽略的盲點，由裁判代理綜合後得出更平衡的結論。
  tags:
  - chap-m5-ch5
  - sec-mas-patterns
  usage: both
- id: 7504
  chapter_title: 多代理系統與未來發展
  section_title: 代理通訊協議
  text: A2A (Agent-to-Agent) 協議中的「代理名片 (Agent Card)」的用途是？
  type: multiple_choice
  options:
  - 一種專門用來詳細記錄代理所有執行歷史的標準日誌格式
  - 代理以 JSON 格式發布能力描述，供其他代理協作前了解
  - 作為不同代理之間在傳遞複雜任務時所使用的標準格式
  - 作為代理之間用於驗證彼此身份與權限的數位安全憑證
  correct_index: 1
  explanation: 代理名片類似微服務的 API 文件，讓其他代理或協調者能在運行時動態發現代理的能力，是實現跨廠商代理互操作性的基礎機制。
  tags:
  - chap-m5-ch5
  - sec-agent-communication
  usage: both
- id: 7505
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 「提示注入攻擊 (Prompt Injection)」在多代理系統中的主要風險是？
  type: multiple_choice
  options:
  - 代理在執行任務時不受控制地過度消耗大量的 API 配額
  - 惡意內容透過工具回傳資料誘使代理執行了非預期的操作
  - 惡意使用者直接取得權限並修改代理系統內部的系統提示
  - 代理底層程式碼中存在著嚴重的 SQL 注入等資訊安全漏洞
  correct_index: 1
  explanation: 提示注入的特殊危險在於攻擊可以隱藏在看似正常的資料中（如網頁內容、文件、資料庫記錄），當代理讀取這些資料時，惡意指令混入上下文並被 LLM 執行。
  tags:
  - chap-m5-ch5
  - sec-agent-safety
  usage: both
- id: 7506
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 在代理安全設計中，「執行預算 (Execution Budget)」的主要目的是？
  type: multiple_choice
  options:
  - 強制控制代理每一次回覆使用者的文字長度與格式
  - 限制代理在讀取本地或外部文件時能夠處理的最大檔案大小
  - 設定最大步驟與費用上限，防止代理陷入迴圈或過度消耗
  - 嚴格限制每個代理在執行任務時可以使用的外部工具數量
  correct_index: 2
  explanation: 執行預算是代理安全的重要防護機制，透過設定步驟數和費用上限，確保即使代理進入異常狀態也不會無限消耗資源，保護系統穩定性和成本控制。
  tags:
  - chap-m5-ch5
  - sec-agent-safety
  usage: both
- id: 7507
  chapter_title: 多代理系統與未來發展
  section_title: AI 代理技術的未來趨勢
  text: 「電腦使用代理 (Computer Use Agent)」的特殊能力是什麼？
  type: multiple_choice
  options:
  - 能夠在運算資源不足時，自動且獨立地購買雲端運算資源
  - 擁有最高權限，能夠自行修改作業系統的底層核心設定
  - 能夠直接控制 GUI 應用程式，如同人類使用滑鼠和鍵盤操作
  - 能夠跨越網路限制，與其他電腦上的代理程式直接進行通訊
  correct_index: 2
  explanation: 電腦使用代理（如 Anthropic 的 Computer Use）能夠感知螢幕畫面並控制滑鼠鍵盤，讓 AI 代理可以操作任何現有的桌面應用程式，無需特別的 API 整合。
  tags:
  - chap-m5-ch5
  - sec-future-trends
  usage: both
- id: 7508
  chapter_title: 多代理系統與未來發展
  section_title: 代理通訊協議
  text: 在 A2A (Agent-to-Agent) 協議中，負責將使用者的對話上下文傳遞給遠端代理人的元件是？
  type: multiple_choice
  options:
  - 代理名片 (Agent Card)
  - 工作產物 (Artifact)
  - 事件佇列 (Event Queue)
  - 代理執行器 (Agent Executor)
  correct_index: 3
  explanation: 代理執行器負責解析傳入的請求，並將對話的上下文傳遞給遠端代理人以利任務執行。
  tags:
  - chap-m5-ch5
  - sec-agent-communication
  usage: both
- id: 7509
  chapter_title: 多代理系統與未來發展
  section_title: 自然語言網路 (NLWeb)
  text: 「自然語言網路 (NLWeb)」為網站帶來的主要變革是什麼？
  type: multiple_choice
  options:
  - 完全取代傳統的 HTML 與 CSS 架構，改由神經網路直接渲染
  - 將所有靜態網站的前端介面全自動轉換成語音控制介面
  - 有效阻止未經授權的外部 AI 模型爬取與分析網站上的資料
  - 為網站提供自然語言介面與 MCP，讓 AI 代理人直接互動
  correct_index: 3
  explanation: NLWeb 讓網站能透過 MCP 伺服器端點與 AI 代理人互動，並利用向量資料庫提供自然語言介面，擴大代理人的操作範圍。
  tags:
  - chap-m5-ch5
  - sec-nlweb
  usage: both
