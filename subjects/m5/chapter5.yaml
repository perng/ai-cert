- id: 7511
  chapter_title: 多代理系統與未來發展
  section_title: 代理通訊協議
  text: A2A 協議的「事件佇列 (Event Queue)」設計是為了解決什麼問題？
  type: multiple_choice
  options:
  - 加速大型語言模型在生成文字時的速度
  - 強制代理人只能按照順序逐一執行任務
