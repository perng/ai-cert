- id: 7521
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 在「人機協同 (Human-in-the-loop)」機制中，人類扮演什麼角色？
  type: multiple_choice
  options:
  - 負責手動替代理人撰寫每一行底層的程式碼
  - 只負責提供運算資源與繳交系統維護費用
  - 在代理人執行關鍵或具破壞性操作前進行授權
