  section_title: 代理通訊協議
  text: A2A 協議解決了多代理系統中的什麼根本問題？
  type: multiple_choice
  options:
  - 單一代理人無法處理超過十萬字的超長上下文內容
  - 不同廠商開發的代理人之間無法互相溝通與協作
  - 大型語言模型在進行複雜數學運算時的精準度太低
