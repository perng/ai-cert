questions:
- id: 7501
  chapter_title: 多代理系統與未來發展
  section_title: 多代理系統概述
  text: 多代理系統（MAS）能「超越上下文視窗限制」的原理是？
  type: multiple_choice
  options:
  - 使用更大的 LLM 模型來增加上下文長度
  - 將大型任務分割給多個代理，每個代理獨立處理自己的子任務，各自擁有完整的上下文視窗
  - 透過資料壓縮技術縮小上下文佔用空間
  - 讓代理輪流使用同一個上下文視窗
  correct_index: 1
  explanation: 每個代理都有自己完整的上下文視窗。透過任務分割，多個代理可以並行處理不同部分，整體系統處理的資訊量遠超任何單一代理的上下文限制。
  tags:
  - chap-m5-ch5
  - sec-mas-overview
  usage: quiz
- id: 7502
  chapter_title: 多代理系統與未來發展
  section_title: 多代理協作模式
  text: 「協調者-執行者模式 (Orchestrator-Worker)」中，協調者代理的主要職責是？
  type: multiple_choice
  options:
  - 執行最困難的子任務
  - 負責規劃任務、分配子任務給執行者代理，並整合最終結果
  - 監控執行者代理的 API 使用量
  - 為執行者代理提供工具呼叫的能力
  correct_index: 1
  explanation: 協調者負責「管理」而非「執行」，它拆解主任務、分配給專業執行者，並在所有子任務完成後整合成最終輸出，是多代理系統的核心指揮角色。
  tags:
  - chap-m5-ch5
  - sec-mas-patterns
  usage: quiz
- id: 7503
  chapter_title: 多代理系統與未來發展
  section_title: 多代理協作模式
  text: 「辯論模式 (Debate)」的多代理架構主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 加速任務執行速度
  - 降低多代理系統的 API 成本
  - 透過不同立場的相互審視來提高答案品質、減少偏見和錯誤
  - 確保代理之間的訊息不會遺失
  correct_index: 2
  explanation: 辯論模式讓代理從正反兩方批判性地審視問題，這種對抗性設計能有效揭露單一代理可能忽略的盲點，由裁判代理綜合後得出更平衡的結論。
  tags:
  - chap-m5-ch5
  - sec-mas-patterns
  usage: quiz
- id: 7504
  chapter_title: 多代理系統與未來發展
  section_title: 代理通訊協議
  text: A2A (Agent-to-Agent) 協議中的「代理名片 (Agent Card)」的用途是？
  type: multiple_choice
  options:
  - 代理用於驗證使用者身份的憑證
  - 代理以標準 JSON 格式對外發布自身能力描述，供其他代理在協作前了解其功能
  - 代理之間傳遞任務的標準格式
  - 記錄代理執行歷史的日誌格式
  correct_index: 1
  explanation: 代理名片類似微服務的 API 文件，讓其他代理或協調者能在運行時動態發現代理的能力，是實現跨廠商代理互操作性的基礎機制。
  tags:
  - chap-m5-ch5
  - sec-agent-communication
  usage: quiz
- id: 7505
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 「提示注入攻擊 (Prompt Injection)」在多代理系統中的主要風險是？
  type: multiple_choice
  options:
  - 惡意使用者直接修改代理的系統提示
  - 惡意內容透過工具回傳的資料或代理間的訊息滲入指令流，誘使代理執行非預期操作
  - 代理過度消耗 API 配額
  - 代理程式碼中的 SQL 注入漏洞
  correct_index: 1
  explanation: 提示注入的特殊危險在於攻擊可以隱藏在看似正常的資料中（如網頁內容、文件、資料庫記錄），當代理讀取這些資料時，惡意指令混入上下文並被 LLM 執行。
  tags:
  - chap-m5-ch5
  - sec-agent-safety
  usage: quiz
- id: 7506
  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 在代理安全設計中，「執行預算 (Execution Budget)」的主要目的是？
  type: multiple_choice
  options:
  - 限制代理使用的工具數量
  - 設定最大步驟數和費用上限，防止代理陷入無限迴圈或過度消耗資源
  - 控制代理的回應長度
  - 限制代理可以讀取的文件大小
  correct_index: 1
  explanation: 執行預算是代理安全的重要防護機制，透過設定步驟數和費用上限，確保即使代理進入異常狀態也不會無限消耗資源，保護系統穩定性和成本控制。
  tags:
  - chap-m5-ch5
  - sec-agent-safety
  usage: quiz
- id: 7507
  chapter_title: 多代理系統與未來發展
  section_title: AI 代理技術的未來趨勢
  text: 「電腦使用代理 (Computer Use Agent)」的特殊能力是什麼？
  type: multiple_choice
  options:
  - 能夠自行購買雲端運算資源
  - 能夠直接控制 GUI 應用程式，如同人類使用滑鼠和鍵盤操作電腦
  - 能夠修改作業系統的核心設定
  - 能夠與其他電腦上的代理直接通訊
  correct_index: 1
  explanation: 電腦使用代理（如 Anthropic 的 Computer Use）能夠感知螢幕畫面並控制滑鼠鍵盤，讓 AI 代理可以操作任何現有的桌面應用程式，無需特別的 API 整合。
  tags:
  - chap-m5-ch5
  - sec-future-trends
  usage: quiz
