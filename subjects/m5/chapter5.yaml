  - 定義代理人可使用的最大記憶體容量
  - 記錄系統中所有發生過的錯誤訊息
  - 封裝遠端代理人完成任務後的回傳結果
  - 作為代理人之間的身份驗證金鑰
  correct_index: 2
  explanation: Artifact 包含了代理人的工作結果與相關描述，便於協調者整合。
