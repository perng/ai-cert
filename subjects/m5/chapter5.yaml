  chapter_title: 多代理系統與未來發展
  section_title: 代理安全與信任
  text: 設立「執行預算 (Execution Budget)」是為了解決什麼潛在風險？
  type: multiple_choice
  options:
  - 限制代理人存取網路上的某些受版權保護的內容
  - 強制代理人只能在上班時間進行運算與資料處理
  - 確保代理人每次回應的字數都能維持在一定範圍
  - 防止代理人因為陷入無限迴圈而過度消耗資源
  correct_index: 3
  explanation: 預算機制能確保系統在失控時及時止損，控制成本與運算資源。
