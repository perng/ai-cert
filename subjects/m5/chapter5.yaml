- id: 7516
  chapter_title: 多代理系統與未來發展
  section_title: 多代理系統概述
  text: 為何多代理系統能夠完成單一大型模型難以做到的複雜工作？
  type: multiple_choice
  options:
  - 因為多代理系統必定使用最昂貴的付費模型 API
  - 多個代理人共同分攤了上下文，突破單一視窗限制
  - 多代理系統能自動幫人類寫出完美無瑕的程式碼
  - 因為多代理系統可以完全不受到物理硬體的限制
  correct_index: 1
  explanation: 每個代理有自己獨立的上下文，整體系統能處理更龐大的資訊。
  tags:
  - chap-m5-ch5
  usage: both
