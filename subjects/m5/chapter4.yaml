- id: 900034
  chapter_title: 主流 AI 代理框架總覽
  section_title: 技術與專業框架
  text: 專業領域代理框架與通用代理框架的主要差異通常是什麼？
  type: multiple_choice
  options:
  - 會內建特定領域流程、資料格式、合規要求或工具連接器
  - 完全不使用語言模型
  - 只能在沒有資料的情況下運作
  - 永遠不需要人類專家參與
  correct_index: 0
  explanation: 專業框架常針對醫療、法務、金融或軟體開發等場景加入領域流程與控管，但仍需配合專家驗證。
