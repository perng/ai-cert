- id: m5-ch4-scenario-001
  chapter_title: 主流 AI 代理框架總覽
  section_title: 情境題
  text: 情境：大型跨國電商要在購物節前升級客服系統，需求包含高併發、嚴格 SOP、可隨時轉真人客服，以及低不可控風險。哪一組代理框架搭配最合理？
  type: multiple_choice
  options:
  - AutoGen 與 CrewAI：讓客服代理人和品管代理人自由群聊，邊服務客戶邊討論最佳答案。
  - AgentScope 與 LangGraph：用 AgentScope 支援高併發訊息驅動架構，再用 LangGraph 的有向圖控管 SOP 與人工轉接節點。
  - CrewAI 與 OpenClaw：為每筆客訴建立長線專家團隊，並在本機自動執行退款腳本。
  - Hermes 與 AutoGen：讓客服系統透過自我學習迴圈持續改變應對方式，並與使用者自由交談。
  correct_index: 1
  explanation: 電商前線客服重視高併發、穩定流程與可控轉接。AgentScope 適合大規模訊息處理，LangGraph 適合以狀態機定義 SOP 與人工介入點。
  tags:
  - chap-m5-ch4
  - sec-scenario
  usage: both
- id: m5-ch4-scenario-002
  chapter_title: 主流 AI 代理框架總覽
  section_title: 情境題
  text: 情境：金融公司要打造信貸風控與審批系統，每一步都必須合規、可追溯，且高風險案件與最終放款都要暫停交給真人審核。哪個框架理念最符合？
  type: multiple_choice
  options:
  - CAMEL：設定 AI 風控長與 AI 稽核員角色扮演，自主討論出貸款額度。
  - LangGraph：把審批流程建模為有向圖與狀態機，將審查步驟、條件分支與人工審核節點明確定義。
  - AutoGen：建立多個代理人的群組聊天室，讓它們自由對話完成貸款審批。
  - AgentScope：讓單一代理人靠自我反思取代狀態機，以提高決策彈性。
  correct_index: 1
  explanation: 金融風控最需要確定性、可追溯與人工介入。LangGraph 的狀態機與中斷節點能明確控管流程，不適合交給自由對話或角色扮演自行決定。
  tags:
  - chap-m5-ch4
  - sec-scenario
  usage: both
- id: m5-ch4-scenario-003
  chapter_title: 主流 AI 代理框架總覽
  section_title: 情境題
  text: 情境：研究機構想開發科研論文寫作輔助平台，希望系統能協助文獻回顧、實驗設計與寫作，並讓不同專家角色進行多輪討論。為何 CAMEL 會是合適選擇？
  type: multiple_choice
  options:
  - 因為 CAMEL 以有向圖將流程建模為狀態機，最適合嚴格控管每一步審批。
  - 因為 CAMEL 強調角色扮演與起始提示，可設定研究員、寫作者等角色進行深度協作與多輪討論。
  - 因為 CAMEL 採用訊息驅動架構，專門處理每秒數千個客服請求。
  - 因為 CAMEL 只使用單一全能代理人，刻意消除所有角色分工與討論成本。
  correct_index: 1
  explanation: CAMEL 的核心是透過角色扮演與起始提示促成多代理協作，適合需要創意、推理與專家對話的科研寫作場景。
  tags:
  - chap-m5-ch4
  - sec-scenario
  usage: both
