- id: 7111
  chapter_title: AI 代理人基礎概念
  section_title: 代理推理迴圈
  text: Plan-and-Execute 模式在處理任務時的主要優勢是什麼？
  type: multiple_choice
  options:
  - 系統的反應速度快且幾乎沒有任何延遲
  - 非常適合處理步驟已經明確的固定任務
  - 整個過程中不需依賴任何外部工具的輔助
  - 能夠完全避免模型產生幻覺的錯誤情況
  correct_index: 1
  explanation: 該模式將任務一次性拆解為多個步驟，非常適合邏輯清晰且明確的工作。
