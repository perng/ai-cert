  usage: quiz
- id: 7112
  chapter_title: AI 代理人基礎概念
  section_title: 代理推理迴圈
  text: Plan-and-Execute 模式在面對何種情況時最容易發生失敗？
  type: multiple_choice
  options:
  - 當任務的內容本身過於簡單且缺乏挑戰時
  - 執行過程中環境發生非預期的突發變化時
  - 系統需要進行多次的工具函數呼叫步驟時
  - 本地電腦的可用記憶體空間不足夠使用時
  correct_index: 1
  explanation: 由於一開始就制定好所有計畫，一旦執行環境有變，系統往往無法彈性調整。
