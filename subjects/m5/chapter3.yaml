questions:
- id: 7301
  chapter_title: Agentic Skills 設計
  section_title: 什麼是 Agentic Skills
  text: 下列哪個選項最能描述「技能 (Skill)」與「工具 (Tool)」的差異？
  type: multiple_choice
  options:
  - 工具可以有內部狀態，技能則是無狀態的底層函數
  - 技能是較高層的能力封裝，可含多步驟邏輯；工具是底層的單一操作函數呼叫
  - 技能只能用於文字處理，工具可處理任何類型的資料
  - 兩者完全相同，只是不同框架的命名習慣
  correct_index: 1
  explanation: 技能是對能力的高層封裝，可包含複雜邏輯與多個步驟；工具則更接近底層的單一函數呼叫。不過在許多現代框架中兩者常被混用。
  tags:
  - chap-m5-ch3
  - sec-skills-intro
  usage: quiz
- id: 7302
  chapter_title: Agentic Skills 設計
  section_title: 工具呼叫機制
  text: 在 Claude API 的工具呼叫流程中，當模型決定使用工具時，它實際上做了什麼？
  type: multiple_choice
  options:
  - 模型直接在內部執行工具函數並回傳結果
  - 模型輸出包含工具名稱和參數的結構化 JSON，由應用程式解析後執行
  - 模型透過網路請求直接呼叫工具的 API 端點
  - 模型等待使用者手動執行工具後再繼續
  correct_index: 1
  explanation: LLM 本身無法直接執行外部函數。它輸出格式化的工具呼叫請求（tool_use block），由外部應用程式解析、執行對應函數，再將結果透過
    tool_result 回傳給模型。
  tags:
  - chap-m5-ch3
  - sec-tool-calling
  usage: quiz
- id: 7303
  chapter_title: Agentic Skills 設計
  section_title: 工具呼叫機制
  text: 「並行工具呼叫 (Parallel Tool Calling)」的主要優點是什麼？
  type: multiple_choice
  options:
  - 減少模型產生錯誤的機率
  - 在單次回應中同時請求多個工具，減少來回次數並提升執行效率
  - 確保工具按照特定順序執行
  - 降低 API 呼叫的成本
  correct_index: 1
  explanation: 並行工具呼叫允許模型在一次回應中請求多個獨立工具，應用程式可並行執行這些工具，避免不必要的序列等待，顯著縮短多工具任務的執行時間。
  tags:
  - chap-m5-ch3
  - sec-tool-calling
  usage: quiz
- id: 7304
  chapter_title: Agentic Skills 設計
  section_title: 記憶管理設計
  text: 在處理長期對話的記憶管理中，「摘要壓縮 (Summarization)」策略的主要目的是什麼？
  type: multiple_choice
  options:
  - 加密對話內容以保護隱私
  - 週期性將舊對話歷史壓縮為摘要，以在有限的上下文視窗內保留更多有效資訊
  - 刪除所有非關鍵的對話紀錄
  - 將對話轉換為向量形式儲存
  correct_index: 1
  explanation: 上下文視窗大小有限，摘要壓縮策略透過將舊對話歷史濃縮為精簡摘要，保留關鍵資訊的同時騰出空間給近期的對話內容。
  tags:
  - chap-m5-ch3
  - sec-memory-management
  usage: quiz
- id: 7305
  chapter_title: Agentic Skills 設計
  section_title: 規劃策略設計
  text: 「動態重規劃 (Dynamic Replanning)」在代理人設計中解決了什麼問題？
  type: multiple_choice
  options:
  - 讓代理人能在任務執行中途遇到意外情況時調整計劃，而不是強制執行可能已失效的原始計劃
  - 確保代理人永遠按照最短路徑完成任務
  - 防止代理人重複執行相同的步驟
  - 自動優化工具選擇策略
  correct_index: 0
  explanation: 現實任務往往充滿不確定性。動態重規劃讓代理人在步驟失敗或環境變化時，能根據已執行步驟和失敗原因重新生成後續計劃，而非固執地繼續執行已過時的計劃。
  tags:
  - chap-m5-ch3
  - sec-planning-strategies
  usage: quiz
- id: 7306
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 撰寫高品質技能描述時，下列哪個原則「最不重要」？
  type: multiple_choice
  options:
  - 說明技能的用途而非實作細節
  - 包含使用時機的說明
  - 詳細描述技能的內部演算法邏輯
  - 列舉技能的限制條件（如格式限制、數量上限）
  correct_index: 2
  explanation: 技能描述的目的是幫助 LLM 決定何時以及如何使用技能，因此應著重描述「能做什麼」和「何時使用」，而非內部實作細節，後者對 LLM 的使用決策沒有幫助。
  tags:
  - chap-m5-ch3
  - sec-skill-best-practices
  usage: quiz
- id: 7307
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 技能實作中採用「指數退避 (Exponential Backoff)」重試策略的主要原因是什麼？
  type: multiple_choice
  options:
  - 提高技能的執行速度
  - 避免在服務不穩定時頻繁重試導致雪崩效應，逐漸增加等待時間讓服務有恢復機會
  - 降低技能的程式碼複雜度
  - 確保每次重試都使用不同的工具
  correct_index: 1
  explanation: 指數退避（每次重試等待時間倍增）是避免對不穩定服務造成過多壓力的標準做法，能在給服務足夠恢復時間的同時，仍然在最終嘗試成功。
  tags:
  - chap-m5-ch3
  - sec-skill-best-practices
  usage: quiz
- id: 7308
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 「上下文工程 (Context Engineering)」與「提示詞工程 (Prompt Engineering)」最大的差異是什麼？
  type: multiple_choice
  options:
  - 提示詞工程專注於單一靜態指令集，而上下文工程負責管理動態資訊集以確保代理人擁有正確資訊
  - 上下文工程只適用於 RAG 系統，提示詞工程則適用於所有 LLM
  - 提示詞工程用於降低 API 成本，上下文工程用於增加模型參數
  - 兩者完全相同，只是不同課程的說法
  correct_index: 0
  explanation: 上下文工程是管理一段動態資訊集（包含初始提示詞）的實踐，讓代理人能隨時取得完成下一步任務的適當資訊。
  tags:
  - chap-m5-ch3
  - sec-context-engineering
  usage: quiz
- id: 7309
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 當一次提供數十種工具給模型，導致模型不知所措而呼叫無關工具時，這屬於哪一種上下文失效模式？
  type: multiple_choice
  options:
  - 上下文中毒 (Context Poisoning)
  - 上下文衝突 (Context Clash)
  - 上下文分心 (Context Distraction)
  - 上下文混淆 (Context Confusion)
  correct_index: 3
  explanation: 上下文混淆是指過多不必要的上下文（如過多工具）讓模型無法判斷最佳選擇。解法是實施工具掛載管理，僅提供最相關的幾個工具。
  tags:
  - chap-m5-ch3
  - sec-context-engineering
  usage: quiz
- id: 7310
  chapter_title: Agentic Skills 設計
  section_title: 光靠提示詞，為什麼不夠？
  text: 相較於上下文工程，單純依賴提示詞工程在代理人場景中最大的限制是什麼？
  type: multiple_choice
  options:
  - 開發者無法精確控制模型最終生成回應的字數長度與格式
  - 靜態指令難以應對動態變化且不可預測的外部系統環境
  - 進階提示詞的撰寫語法對於多數開發者而言過於困難且複雜
  - 大型語言模型在解析超過一百個字的提示詞時容易發生崩潰
  correct_index: 1
  explanation: 代理人面對的任務環境隨時在變，靜態的提示詞無法涵蓋所有可能的突發狀況。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7311
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 代理人運作時遇到的「上下文中毒 (Context Poisoning)」是指什麼現象？
  type: multiple_choice
  options:
  - 使用者輸入的文字長度大幅超越了系統設定的上下文視窗限制
  - 錯誤的幻覺資訊進入記憶中並被反覆引用，導致模型陷入邏輯死胡同
  - 系統遭受到惡意使用者的直接網路攻擊，導致伺服器完全停止運作
  - 代理人因為安全機制過於嚴格而拒絕讀取任何上下文中的敏感內容
  correct_index: 1
  explanation: 當錯誤資訊成為後續推理的基礎時，代理人就會不斷做出荒謬或無效的決策。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7312
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 要有效防範「上下文中毒」，系統架構上應該採取哪一種策略最為合適？
  type: multiple_choice
  options:
  - 直接將系統容許的上下文總字數限制增加到原來的一百倍以上
  - 實施嚴格的上下文即時驗證，確保寫入記憶前的資訊是正確的
  - 為了絕對的資料安全，完全停用代理人的所有長期記憶保存功能
  - 將所有可能導致衝突的上下文自動翻譯成模型不熟悉的罕見語言
  correct_index: 1
  explanation: 在資訊被當作事實存入記憶前，透過外部工具進行交叉驗證是防止中毒的關鍵。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7313
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 代理人運作時遇到的「上下文分心 (Context Distraction)」是指什麼現象？
  type: multiple_choice
  options:
  - 模型因為過度關注龐大的歷史紀錄而忽略了當前任務的真實指令
  - 代理人在多個子系統之間頻繁切換導致伺服器網路連線不穩定
  - 系統的安全過濾機制拒絕執行任何包含潛在風險的工具呼叫請求
  - 代理人因為無法獲取任何足夠的上下文資訊而無法生成有效回應
  correct_index: 0
  explanation: 當雜訊過多時，模型的注意力機制會被稀釋，忘記現在最重要應該做什麼事。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7314
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 開發者可以透過什麼技術手段來有效減緩「上下文分心」的問題？
  type: multiple_choice
  options:
  - 在每次對話前，都將過去一年的所有歷史對話紀錄完整地提供給模型
  - 定期使用大語言模型摘要技術，將過長的歷史資訊壓縮成精簡的重點
  - 為了確保指令清晰，嚴格禁止終端使用者輸入超過十個英文字母的指令
  - 強制設定系統，讓模型在任何情況下都只能用「是」或「否」來回答問題
  correct_index: 1
  explanation: 摘要技術能去除冗餘對話，保留核心意義，幫助模型在有限視窗內維持專注。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7315
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 若系統一次性提供 50 個不相關的工具給代理人，導致其呼叫錯誤，這屬於何種失效模式？
  type: multiple_choice
  options:
  - 上下文衝突 (Context Clash)
  - 上下文中毒 (Context Poisoning)
  - 上下文混淆 (Context Confusion)
  - 上下文分心 (Context Distraction)
  correct_index: 2
  explanation: 過多選擇會干擾模型的判斷能力，造成上下文混淆，進而選錯工具。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7316
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 實施「工具掛載管理 (Tool Loadout Management)」的主要目的是什麼？
  type: multiple_choice
  options:
  - 讓系統能在背景自動下載並更新所有工具的最新底層程式碼
  - 透過動態檢索，僅提供給代理人當下任務最相關的少量工具集合
  - 詳細記錄每個工具在過去一個月內的平均執行時間與效能瓶頸
  - 嚴格限制普通使用者每天可以呼叫系統中特定工具的總次數上限
  correct_index: 1
  explanation: 減少不必要的工具干擾，能顯著提升代理人選擇正確工具的準確率。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7317
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 在代理人的推理過程中，「上下文衝突 (Context Clash)」通常是如何發生的？
  type: multiple_choice
  options:
  - 系統內剛好存在兩個不同開發者所撰寫且名稱完全一模一樣的工具
  - 代理人的記憶中同時存在著前後矛盾或邏輯完全相反的使用者指示
  - 兩個不同功能的代理人為了完成任務，同時搶奪同一個網路連接埠
  - 系統傳遞的上下文資料格式不符合底層 API 所規定的嚴格 JSON 標準
  correct_index: 1
  explanation: 矛盾的資訊會讓模型無法判斷哪一個才是真實意圖，導致推理不一致。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7318
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 當面對「上下文衝突」時，下列哪一種做法是有效的解決方案之一？
  type: multiple_choice
  options:
  - 提供獨立的暫存區 (Scratchpad) 讓模型有空間先協調與統整衝突資訊
  - 寫一個程式將所有看起來發生衝突的歷史資訊隨機挑選一個並直接刪除
  - 不做任何修改，直接把底層模型替換成參數規模大十倍的最新商用版本
  - 遇到衝突時立即暫停系統所有運作，並發送電子郵件等待人工介入處理
  correct_index: 0
  explanation: 暫存區賦予代理人額外的運算空間來分析矛盾，最終得出一致的行動方針。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7319
  chapter_title: Agentic Skills 設計
  section_title: 記憶管理設計
  text: 在記憶管理的設計中，實施「衰減機制 (Fading)」的主要用意為何？
  type: multiple_choice
  options:
  - 使距離現在較久遠的歷史記憶在檢索時的權重或重要性自然降低
  - 將純文字的對話內容自動轉換為多維度的向量格式以利快速比較
  - 透過加密手段防止未經授權的第三方用戶讀取代理人的敏感資料
  - 藉由刪除特定字元來加快整體工具執行的伺服器網路反應時間
  correct_index: 0
  explanation: 衰減機制確保代理人會優先參考使用者近期的狀態或偏好，而非陳舊過時的資訊。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7320
  chapter_title: Agentic Skills 設計
  section_title: 規劃策略設計
  text: 代理人運用「任務分解 (Task Decomposition)」策略能夠帶來什麼具體好處？
  type: multiple_choice
  options:
  - 讓大語言模型在生成文字時的速度與流暢度獲得飛躍性的提升
  - 將過於複雜且難以一次解決的目標，拆解為數個可受控且單純的小步驟
  - 大幅減少代理人為了完成任務而呼叫各種外部 API 的總計費用
  - 從根本上徹底避免模型在撰寫程式碼時產生任何的語法或邏輯錯誤
  correct_index: 1
  explanation: 拆解任務能降低每一步的認知負擔，讓代理人更容易成功達成最終目標。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7321
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 在設計 Agentic Skills 的時候，為什麼要盡量確保工具操作具備「冪等性 (Idempotency)」？
  type: multiple_choice
  options:
  - 因為這樣可以讓後端工程師在撰寫程式碼的時候看起來更加簡潔優雅
  - 確保代理人在出錯時多次重複執行相同的操作，也不會產生非預期的副作用
  - 為了在伺服器端大幅度提升工具底層演算法的整體執行效率與運算速度
  - 為了讓系統能夠自動偵測並修復使用者在輸入對話時所產生的錯別字
  correct_index: 1
  explanation: 代理人經常會重試失敗的步驟，冪等性可保證重試過程是安全的。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7322
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 一個設計優良的技能應該回傳清晰完整的錯誤處理訊息，其最主要的目的為何？
  type: multiple_choice
  options:
  - 為了滿足大型企業在軟體開發流程中對於程式碼行數的標準合規性規定
  - 讓大型語言模型能讀懂失敗的原因，並據此動態調整參數或嘗試其他策略
  - 刻意隱藏系統底層的實際網路架構，避免遭到外部駭客針對性的惡意攻擊
  - 讓終端使用者在看到錯誤畫面時，覺得系統非常有禮貌且富有同理心
  correct_index: 1
  explanation: 錯誤訊息是代理人自我反省的關鍵輸入，沒有清晰的錯誤訊息就無法修正路線。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7323
  chapter_title: Agentic Skills 設計
  section_title: 工具呼叫機制
  text: 有關於「並行工具呼叫 (Parallel Tool Calling)」的敘述，下列何者是正確的？
  type: multiple_choice
  options:
  - 系統會強迫所有的工具都必須嚴格按照英文字母順序依次排隊執行
  - 代理人能夠在一次的推論回應中，同時觸發並執行多個彼此獨立的工具任務
  - 這個機制僅適用於那些彼此之間具有高度且嚴格順序依賴的複雜連鎖步驟
  - 啟用這個機制通常會導致系統處理任務的整體花費時間大幅度地往上增加
  correct_index: 1
  explanation: 並行工具呼叫省去了多次網路往返的延遲，對於互相獨立的任務能顯著提升效率。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7324
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 在定義提供給代理人的技能時，為什麼在提示詞中提供明確的參數邊界限制（例如設定字數上限）非常重要？
  type: multiple_choice
  options:
  - 主要是為了幫助資料庫管理員節省伺服器硬碟中日益枯竭的儲存空間
  - 能有效避免語言模型給出過於龐大或不切實際的參數，導致後端程式執行崩潰
  - 為了讓開發出來的技能在名稱與說明文件上看起來更加符合專業的工業標準
  - 因為這是多數知名雲端平台在提供 API 服務時所要求的強制性資訊安全規定
  correct_index: 1
  explanation: 明確的限制能防止代理人因為過度發散的想像力而產生導致系統錯誤的極端輸入。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7325
  chapter_title: Agentic Skills 設計
  section_title: 記憶管理設計
  text: 在建立代理人的長期記憶管理系統時，導入向量資料庫最主要是為了解決什麼核心問題？
  type: multiple_choice
  options:
  - 確保使用者在登入系統時輸入的密碼與權限能夠被最精確無誤地比對驗證
  - 透過將文字轉化為數學向量，實現語意層級的搜尋，快速召回最相關的歷史經驗
  - 用來穩定且大量地儲存使用者上傳的高解析度圖片、音訊檔案與高畫質影片資料
  - 為了完全取代電腦傳統的主記憶體 (RAM) 架構，從而大幅度降低系統建置的硬體成本
  correct_index: 1
  explanation: 向量搜尋超越了傳統的關鍵字比對，讓代理人能理解概念上的相似性並找到對應記憶。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7326
  chapter_title: Agentic Skills 設計
  section_title: 規劃策略設計
  text: 當具備「動態重規劃」能力的代理人在執行步驟中途遇到 API 呼叫失敗時，它通常會怎麼應對？
  type: multiple_choice
  options:
  - 會立刻判定任務失敗，直接中斷所有背景程式並回報嚴重錯誤給終端使用者
  - 吸收失敗的錯誤訊息作為新上下文，重新思考並生成一條可能成功的全新解決路徑
  - 不考慮任何其他可能性，持續以極高的頻率不斷重複呼叫同一個 API 直到成功為止
  - 假裝沒看到錯誤，直接忽略這個失敗的關鍵步驟，並強行跳到計畫中的最後一個步驟
  correct_index: 1
  explanation: 動態重規劃的精髓在於保持目標不變，但通往目標的路徑可以根據現實狀況靈活調整。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7327
  chapter_title: Agentic Skills 設計
  section_title: Skill 設計最佳實踐
  text: 開發者在替代理人撰寫工具的自然語言描述 (Description) 時，最應當遵守的指導原則是什麼？
  type: multiple_choice
  options:
  - 必須鉅細靡遺地詳列出該工具在後端伺服器中的所有程式碼實作邏輯與細節
  - 應該清楚且精確地說明這個工具「能達成什麼目的」以及「在什麼情境下該被使用」
  - 為了顯示開發團隊的技術實力，盡量在說明中塞滿各種深奧且難懂的業界專有名詞
  - 為了節省語言模型處理的 token 數量，務必將所有描述的總字數嚴格控制在十個字以內
  correct_index: 1
  explanation: 模型不需要知道底層怎麼實作，只需要知道什麼時候用它、用了會有什麼效果。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7328
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 「上下文修剪 (Context Pruning)」技術通常被應用於解決代理人的哪一種內部問題？
  type: multiple_choice
  options:
  - 當代理人需要產生極度冗長的文章時，用來限制其最大輸出字數的控制機制
  - 當新獲得的資訊與舊有記憶產生嚴重矛盾時，主動移除或覆寫已過時的歷史資訊
  - 當代理人發現自己的程式碼架構過於老舊時，自動向版本控制系統發送的更新請求
  - 當系統的硬碟儲存空間即將耗盡時，自動對所有的多媒體檔案進行深度破壞性壓縮
  correct_index: 1
  explanation: 修剪過時與矛盾的資訊能確保模型在推理時有一個乾淨、邏輯一致的上下文基礎。
  tags:
  - chap-m5-ch3
  usage: quiz
- id: 7329
  chapter_title: Agentic Skills 設計
  section_title: 上下文工程 (Context Engineering)
  text: 在處理極度複雜的任務時，提供給模型一個「暫存區 (Scratchpad)」可以帶來什麼顯著的好處？
  type: multiple_choice
  options:
  - 確保每一次的對話記錄都會被永久保存到不可竄改的去中心化區塊鏈網路上
  - 賦予模型一段不被使用者直接看見的「思考空間」，以利其整理邏輯、拆解步驟與協調衝突
  - 能夠自動將模型思考過程中所產生的任何有趣見解，直接發布更新到外部的社群媒體平台上
  - 透過跳過所有複雜的推理步驟直接輸出預設答案，來大幅降低大型語言模型的整體運算成本
  correct_index: 1
  explanation: 暫存區如同人類的計算紙，先寫下推理過程再給出最終答案，能大幅提升準確率。
  tags:
  - chap-m5-ch3
  usage: quiz
