- id: m5-ch3-scenario-001
  chapter_title: Agentic Skills 設計
  section_title: 情境題
  text: 情境：客服 AI 代理人收到使用者訊息：「我昨天買的鍵盤怎麼還沒到？」依 ReAct 原則，第一步最適合產生哪種內部輸出？
  type: multiple_choice
  options:
  - 直接呼叫 Execute_Refund_And_Email 工具，先寄退款通知安撫使用者。
  - 在 Thought 中判斷：使用者在詢問物流進度，我需要先取得訂單編號或使用者 ID，再呼叫物流查詢工具。
  - 啟動 Reflection 模組，反思自己是否具備查詢物流的能力。
  - 直接回覆：「您的包裹正在配送中，請耐心等候。」
  correct_index: 1
  explanation: ReAct 的第一步是先思考任務意圖與資訊缺口。此情境需要先辨識「查物流」需求，再決定要取得訂單資訊並呼叫查詢工具。
  tags:
  - chap-m5-ch3
  - sec-scenario
  usage: both
- id: m5-ch3-scenario-002
  chapter_title: Agentic Skills 設計
  section_title: 情境題
  text: 情境：客服 AI 檢索到「生鮮食品原則上不退換」，但使用者表示收到的蘋果全爛了且有照片。系統初步判斷退款信心分數只有 40%。最合理的處理方式是什麼？
  type: multiple_choice
  options:
  - 啟動 Reflection 或爭議處理流程，判斷此案需要真人客服審慎確認。
  - 忽略信心分數，直接退款，因為顧客體驗永遠優先於公司規範。
  - 無限重複檢索退款政策，直到找到支持退款的條款。
  - 直接拒絕退款，因為「生鮮不退」的文字規則已經足夠。
  correct_index: 0
  explanation: 低信心分數且涉及例外情境時，不應讓代理人自行做高風險決策。Reflection 或轉人工可降低誤判與客訴風險。
  tags:
  - chap-m5-ch3
  - sec-scenario
  usage: both
