  section_title: 情境題
  text: 情境：AI 代理人發現使用者過去一個月已高頻申請退款 5 次。下列哪種輸出格式最符合「內部思考」與「外部溝通」隔離原則？
  type: multiple_choice
  options:
  - "<Email_Draft> 這個使用者是騙子，拒絕退款。 </Email_Draft>"
