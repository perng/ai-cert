questions:
- id: 7201
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 簡介與設計動機
  text: MCP (Model Context Protocol) 主要解決什麼問題？
  type: multiple_choice
  options:
  - 降低 AI 模型的幻覺（Hallucination）問題
  - 改善 LLM 的訓練效率
  - 解決 AI 模型與外部工具整合的碎片化問題，提供標準化協議
  - 提升大型語言模型的推理速度
  correct_index: 2
  explanation: MCP 提供統一標準，讓 AI 系統與工具的整合從 M×N 個客製化整合簡化為 M+N 個標準實作，解決碎片化問題。
  tags:
  - chap-m5-ch2
  - sec-mcp-intro
  usage: both
- id: 7202
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 系統架構
  text: 在 MCP 架構中，「主機 (Host)」的主要職責是什麼？
  type: multiple_choice
  options:
  - 管理 MCP 客戶端生命週期、協調 LLM 與伺服器通訊，並執行授權決策
  - 充當 LLM 和使用者之間的翻譯層
  - 只負責將使用者輸入轉換為 JSON 格式
  - 直接儲存和管理工具的程式碼邏輯
  correct_index: 0
  explanation: 主機是整個 MCP 系統的協調中心，負責管理客戶端、執行安全策略，以及在 LLM 和 MCP 伺服器之間傳遞訊息。
  tags:
  - chap-m5-ch2
  - sec-mcp-architecture
  usage: both
- id: 7203
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 系統架構
  text: 在 MCP 架構中，一個「客戶端 (Client)」維護的連線關係是？
  type: multiple_choice
  options:
  - 每個客戶端維護與單一 MCP 伺服器的一對一連線
  - 多個客戶端共享同一個 MCP 伺服器連線
  - 客戶端直接與使用者連線，不與伺服器通訊
  - 一個客戶端可同時連線多個 MCP 伺服器
  correct_index: 0
  explanation: MCP 架構設計為每個客戶端維護與單一 MCP 伺服器的連線，主機可以建立多個客戶端以同時連線不同的伺服器。
  tags:
  - chap-m5-ch2
  - sec-mcp-architecture
  usage: both
- id: 7204
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 核心元件
  text: MCP 中的「資源 (Resources)」與「工具 (Tools)」的主要差異是什麼？
  type: multiple_choice
  options:
  - 資源是 LLM 可讀取的資料，工具是 LLM 可執行的操作
  - 資源比工具更安全，不需要使用者授權
  - 資源和工具功能完全相同，只是命名不同
  - 工具只能回傳文字，資源可回傳二進位資料
  correct_index: 0
  explanation: 資源（Resources）代表可讀取的資料（如檔案、資料庫記錄），透過 URI 定位；工具（Tools）代表可執行的操作（如搜尋、計算），由 LLM 主動呼叫。
  tags:
  - chap-m5-ch2
  - sec-mcp-components
  usage: both
- id: 7205
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 傳輸機制
  text: MCP 的「stdio 傳輸」與「HTTP + SSE 傳輸」最主要的適用場景差異是什麼？
  type: multiple_choice
  options:
  - stdio 速度更快但不安全，HTTP + SSE 較慢但安全
  - stdio 適合本地部署（透過子程序），HTTP + SSE 適合遠端/雲端部署
  - 兩者完全相同，只是語法不同
  - stdio 適合遠端伺服器，HTTP + SSE 適合本地程式
  correct_index: 1
  explanation: stdio 傳輸透過標準輸入/輸出管道與本地子程序通訊，適合本地安全部署；HTTP + SSE 支援跨網路存取，適合雲端或遠端 MCP 伺服器。
  tags:
  - chap-m5-ch2
  - sec-mcp-transport
  usage: both
- id: 7206
  chapter_title: 模型上下文協議 (MCP)
  section_title: 開發 MCP 伺服器
  text: 使用 Python MCP SDK (FastMCP) 定義工具時，工具的「description」欄位最重要的用途是什麼？
  type: multiple_choice
  options:
  - 用於顯示給最終使用者看的說明文字
  - 用於產生 API 文件
  - 定義工具的輸入參數類型
  - LLM 根據此描述決定何時以及如何呼叫此工具
  correct_index: 3
  explanation: 工具的描述 (description) 是 LLM 判斷在什麼情況下應呼叫此工具的關鍵依據，清晰的描述能顯著提升工具被正確選用的機率。
  tags:
  - chap-m5-ch2
  - sec-mcp-server-dev
  usage: both
- id: 7207
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 安全考量
  text: 依照 MCP 安全設計，什麼是防範「提示注入攻擊 (Prompt Injection)」的最佳實踐？
  type: multiple_choice
  options:
  - MCP 伺服器應對所有來自 LLM 的輸入進行驗證，不信任任何未經驗證的內容
  - 將所有工具呼叫結果加密後再回傳
  - 禁止 LLM 呼叫任何外部工具
  - 只使用官方提供的 MCP 伺服器
  correct_index: 0
  explanation: 提示注入攻擊可能透過惡意資料偽裝成合法指令。MCP 伺服器應對輸入進行嚴格驗證，避免將未受信任的資料直接用於執行系統命令或資料庫查詢。
  tags:
  - chap-m5-ch2
  - sec-mcp-security
  usage: both
- id: 7208
  chapter_title: 模型上下文協議 (MCP)
  section_title: AI 代理人基礎概念
  text: 在 AI 代理人的運作中，「思考-行動-觀察循環 (Thought-Action-Observation Cycle)」又被稱為什麼？
  type: multiple_choice
  options:
  - ReAct 模式
  - Reflexion 模式
  - MCP 模式
  - RAG 模式
  correct_index: 0
  explanation: 思考-行動-觀察循環也被稱為 ReAct (Reason + Act) 模式，是代理人進行內部推理並透過工具與環境互動的核心運作方式。
  tags:
  - chap-m5-ch2
  - sec-agent-fundamentals
  usage: both
- id: 7209
  chapter_title: 模型上下文協議 (MCP)
  section_title: 代理人可觀測性與評估
  text: 在監控 AI 代理人的可觀測性時，通常會透過何種技術來捕獲運作時的追蹤 (Traces)、日誌與指標？
  type: multiple_choice
  options:
  - 向量資料庫檢索
  - 提示詞工程 (Prompt Engineering)
  - 儀器化 (Instrumentation)
  - 記憶壓縮 (Memory Compression)
  correct_index: 2
  explanation: 儀器化 (Instrumentation) 是使用系統（例如 OpenTelemetry）來捕獲代理人運作時的追蹤、日誌與指標，藉此擺脫「黑箱」行為。
  tags:
  - chap-m5-ch2
  - sec-agent-observability
  usage: both
- id: 7210
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 簡介與設計動機
  text: MCP (Model Context Protocol) 旨在解決 AI 生態系統中的哪一個痛點？
  type: multiple_choice
  options:
  - 訓練最新大型語言模型的整體運算成本過於高昂
  - 開發者在設計提示詞工程時面臨的語法難度過於複雜
  - 本地端執行伺服器時的記憶體管理與分配效率太低
  - AI 系統與各種外部資料源整合時的嚴重碎片化問題
  correct_index: 3
  explanation: 隨著工具與資料源激增，MCP 提供標準化協議來消弭 M×N 的客製化整合噩夢。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7211
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 系統架構
  text: 在 MCP 架構中，主要負責管理安全策略與使用者授權決策的元件是？
  type: multiple_choice
  options:
  - 負責執行所有推論工作的大型語言模型本身
  - 直接與伺服器溝通的 MCP 客戶端應用程式
  - 提供具體工具與資源的外部 MCP 伺服器
  - 統籌管理與協調的 MCP 主機 (Host) 系統
  correct_index: 3
  explanation: MCP 主機 (Host) 控制整個系統的生命週期，並確保使用者在呼叫高風險工具時能進行審核。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7212
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 核心元件
  text: 一個標準的 MCP 伺服器可以同時對外提供哪些核心功能元件？
  type: multiple_choice
  options:
  - 模型本身的神經網路權重與大量的歷史訓練資料
  - 底層運作所需的網路伺服器與高效能關聯式資料庫
  - 提供模型動態上下文的工具、資源與提示範本
  - 針對終端使用者設計的圖形介面與豐富的前端佈景
  correct_index: 2
  explanation: MCP 伺服器主要透過暴露工具、資源和提示範本來為代理人擴展能力。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7213
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 核心元件
  text: MCP 中的「Prompts (提示範本)」所扮演的主要角色是什麼？
  type: multiple_choice
  options:
  - 在使用者輸入過慢時自動幫忙補齊尚未打完的文字
  - 自動記錄使用者過去所輸入過的所有指令與日誌
  - 提供標準化的任務起始上下文與可重用的對話模板
  - 強制模型遵守所有內建的安全規範與禁止事項
  correct_index: 2
  explanation: 提示範本允許伺服器提供預先定義好的工作流程起點，幫助代理人快速進入狀況。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7214
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 傳輸機制
  text: 當我們在本地電腦開發與部署 MCP 伺服器時，最常使用的傳輸機制是？
  type: multiple_choice
  options:
  - 用於即時通訊服務的 WebSockets 雙向資料傳輸協定
  - 透過本地子程序建立的 stdio (標準輸入輸出) 管道
  - 專為微服務架構設計的 gRPC 遠端程序高速呼叫協定
  - 適合跨網路存取的 HTTP + SSE 遠端連線傳輸機制
  correct_index: 1
  explanation: stdio 傳輸方式安全性高且非常適合本地環境，因為它依賴本機程序的執行權限。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7215
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 簡介與設計動機
  text: MCP 架構如何顯著提升 AI 代理人的「工具發現」能力？
  type: multiple_choice
  options:
  - 讓伺服器能動態提供可用工具清單與詳細的使用參數說明
  - 預先將全球所有的工具特徵寫死在大型語言模型的權重中
  - 強迫使用者在使用前手動輸入所有工具的底層實作原始碼
  - 讓代理人透過自動爬蟲不斷搜尋網路上的可用 API 工具
  correct_index: 0
  explanation: MCP 客戶端能直接向伺服器查詢可用清單，代理人因此能動態發掘並使用新工具。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7216
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 系統架構
  text: 為什麼開發者在設計 MCP 伺服器時，應該盡可能保持「輕量級」？
  type: multiple_choice
  options:
  - 為了節省使用者電腦上寶貴的硬碟與記憶體儲存空間
  - 為了避免被作業系統內建的防毒軟體誤判為惡意程式
  - 為了專注暴露特定領域的能力並遵循單一職責原則
  - 為了讓大型語言模型可以直接下載並分析其內部架構
  correct_index: 2
  explanation: 輕量級的伺服器專注於做好一件事情，能提升系統整體的穩定度與易維護性。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7217
  chapter_title: 模型上下文協議 (MCP)
  section_title: 代理人可觀測性與評估
  text: 在系統可觀測性 (Observability) 領域中，「Span」代表什麼意義？
  type: multiple_choice
  options:
  - 系統內單一操作或函數執行的具體起始與結束時間區間
  - 大型語言模型在一次生成過程中所輸出的總字數統計
  - 系統伺服器在執行複雜推論時記憶體使用的最高峰值
  - 代理人處理完整個使用者對話任務的總計花費時間
  correct_index: 0
  explanation: Span 用來標記與測量特定操作的持續時間，幫助開發者定位效能瓶頸。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7218
  chapter_title: 模型上下文協議 (MCP)
  section_title: 代理人可觀測性與評估
  text: 為 AI 代理人實施儀器化 (Instrumentation) 的最主要好處是什麼？
  type: multiple_choice
  options:
  - 讓代理人的內部決策過程與工具呼叫狀況變得完全透明化
  - 能大幅度降低呼叫各大雲端模型 API 的整體使用成本
  - 能夠自動偵測並完全修正大型語言模型產生的所有錯誤
  - 直接取代傳統的軟體單元測試與人工驗收測試標準流程
  correct_index: 0
  explanation: 透過追蹤系統運作，開發者能洞察代理人的思考邏輯，使「黑箱」模型具備可解釋性。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7219
  chapter_title: 模型上下文協議 (MCP)
  section_title: 代理人可觀測性與評估
  text: 在處理多個工具呼叫時，系統日誌常常變得難以閱讀，引入可觀測性工具可以如何解決？
  type: multiple_choice
  options:
  - 強迫模型在每次操作後都必須用語音播報執行結果
  - 透過結構化的追蹤 (Traces) 將日誌與特定的操作上下文綁定
  - 將所有的系統日誌全數刪除以節省開發人員的閱讀時間
  - 自動把所有日誌翻譯成更易讀的另一種人類自然語言
  correct_index: 1
  explanation: 結構化追蹤可以將錯綜複雜的系統日誌關聯到特定的請求上，大幅簡化除錯難度。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7220
  chapter_title: 模型上下文協議 (MCP)
  section_title: 代理人可觀測性與評估
  text: 當代理人發生非預期行為時，哪一種觀測工具最能有效幫助開發者除錯？
  type: multiple_choice
  options:
  - 監控伺服器作業系統的 CPU 佔用率與網路頻寬使用情況
  - 透過代理人的追蹤日誌 (Traces) 還原當時的決策與環境上下文
  - 直接匯出並分析大型語言模型的內部神經網路權重分佈圖
  - 檢查使用者的瀏覽器搜尋記錄以推測其真實的問題意圖
  correct_index: 1
  explanation: 追蹤日誌能清晰重現代理人收到的提示詞、工具回傳結果與其當時的決策過程。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7221
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 系統架構
  text: 在標準的 MCP 系統架構設計中，Client 和 Server 之間的連線關係是？
  type: multiple_choice
  options:
  - 多個客戶端共享同一個伺服器狀態的多對多無狀態連線
  - 多個伺服器輪流服務一個客戶端的多對一輪詢連線模式
  - 客戶端將訊息向所有伺服器廣播的一對多廣播模式
  - 每個客戶端應用程式維護與單一伺服器的一對一綁定連線
  correct_index: 3
  explanation: 一對一的連線設計簡化了狀態管理，讓客戶端與伺服器間的溝通更加清晰可靠。
