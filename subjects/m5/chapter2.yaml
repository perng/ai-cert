  - chap-m5-ch2
  usage: quiz
- id: 7224
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 核心元件
  text: 資源 (Resources) 與工具 (Tools) 最大的本質差異在於？
  type: multiple_choice
  options:
  - 資源具備改變外部環境副作用的能力，工具僅能用於靜態讀取
  - 資源是被動讀取的靜態資料，工具則是由模型主動呼叫的動態操作
  - 資源需要複雜的非對稱加密傳輸，工具則可以直接使用明文傳輸
  - 資源只能在本地端電腦上運作，工具則只能部署於雲端伺服器上
  correct_index: 1
  explanation: 資源是被動讀取的上下文資料，而工具是模型主動決定執行的動態操作。
