  - chap-m5-ch2
  usage: both
- id: 7222
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 安全考量
  text: 面對來自大型語言模型 (LLM) 的工具呼叫請求，MCP 伺服器應當採取什麼安全態度？
  type: multiple_choice
  options:
  - 伺服器端必須對所有傳入的參數進行嚴格的驗證與邊界檢查
  - 百分之百信任所有來自知名 LLM 提供商的工具呼叫參數
  - 為了節省運算效能，盡量停用伺服器端所有的日誌記錄功能
  - 將所有可能被呼叫的工具設為公開存取以確保最高相容性
  correct_index: 0
  explanation: 為了防止提示詞注入與幻覺帶來的危害，伺服器絕不可盲目信任 LLM 傳來的資料。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7223
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 簡介與設計動機
  text: MCP 架構本身是如何促進各種不同的 AI 模型之間的互操作性 (Interoperability) 的？
  type: multiple_choice
  options:
  - 透過強制要求世界上所有的模型都必須使用完全相同的內部權重
  - 透過設計一個專屬的私有通訊協定讓模型之間可以直接互相通訊
  - 透過提供一套標準化的通用介面來描述與呼叫外部工具與資源
  - 透過將所有競爭對手的模型統一部署在同一台巨大的實體伺服器
  correct_index: 2
  explanation: 標準化的介面讓開發者不需修改整合程式碼，就能無痛切換底層使用的語言模型。
  tags:
  - chap-m5-ch2
  usage: both
- id: 7224
  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 核心元件
  text: 資源 (Resources) 與工具 (Tools) 最大的本質差異在於？
  type: multiple_choice
  options:
  - 資源具備改變外部環境副作用的能力，工具僅能用於靜態讀取
  - 資源是被動讀取的靜態資料，工具則是由模型主動呼叫的動態操作
