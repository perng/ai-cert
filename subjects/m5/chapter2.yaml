  chapter_title: 模型上下文協議 (MCP)
  section_title: MCP 安全考量
  text: 提示注入攻擊（Prompt Injection）如何影響 MCP 系統的安全性？
  type: multiple_choice
  options:
  - 攻擊者透過修改 MCP 協議的原始碼入侵系統
  - 攻擊者直接刪除伺服器上的工具定義檔
  - 攻擊者透過阻塞網路連線來阻止 MCP 通訊
