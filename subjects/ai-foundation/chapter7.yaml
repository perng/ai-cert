  - 池化操作
  correct_index: 1
  explanation: Self-Attention 計算單詞間的關聯強度，"it" 與 "animal" 的語意關聯度最高，因此獲得最高的 Attention Score。
  tags:
  - chap-ai-foundation-chapter7
  - sec-self-attention
  id: '11453_4'
  usage: both
