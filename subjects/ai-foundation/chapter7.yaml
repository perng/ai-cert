  chapter_title: 神經網路與深度學習
  section_title: 神經網路基礎
  text: 為何在深層神經網路中，ReLU (Rectified Linear Unit) 激活函數通常比 Sigmoid 更受歡迎？
  type: multiple_choice
  options:
  - 因為 ReLU 的輸出範圍是 0 到 1
  - 因為 ReLU 可以處理負數輸入
  - 因為 ReLU 在正區間的梯度恆為 1，能有效緩解梯度消失 (Vanishing Gradient) 問題，且計算速度快
  - 因為 ReLU 是連續可微的
  correct_index: 2
  explanation: Sigmoid 在輸入值很大或很小時梯度趨近於 0，導致深層網路無法訓練；ReLU 簡單粗暴地解決了這個問題。
