  section_title: Transformer 與自注意力機制
  text: 在保持 GPT-OSS 模型架構不變的前提下，如果將模型參數量從20 億提 升至 120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？ (114年第四梯次)
