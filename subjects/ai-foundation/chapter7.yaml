- chapter_title: 神經網路架構演進
  section_title: 啟動函數 (Activation Functions)
  text: 情境：ReLU (Rectified Linear Unit) 啟動函數的主要優點是？
  type: multiple_choice
  options:
  - 輸出範圍在 0 到 1 之間
  - 計算簡單且有效緩解梯度消失問題
