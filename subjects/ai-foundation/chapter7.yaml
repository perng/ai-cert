- chapter_title: 神經網路架構演進
  section_title: 自注意力機制 (Self-Attention)
  text: 情境：在句子 "The animal didn't cross the street because it was too tired." 中，Self-Attention 機制能幫助模型理解 "it" 指的是 "animal" 而不是 "street"。這是透過計算什麼得出的？
  type: multiple_choice
  options:
  - 卷積核
  - 注意力分數 (Attention Score)，即 Q 與 K 的相似度
