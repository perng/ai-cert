  chapter_title: 神經網路與深度學習
  section_title: 經典深度學習架構
  text: 某團隊想採用循環神經網路（Recurrent Neural Network, RNN）建構 長期氣候數據的預測模型，以下哪一項敘述最符合使用 RNN 可能會遇 到的挑戰？ (114年第四梯次)
  type: multiple_choice
  options:
  - RNN 無法處理可變長度的序列輸入，因此在實務上限制極大
  - RNN 在長序列訓練中可能出現梯度消失，影響模型效果
  - RNN 無法捕捉時間上的依賴關係，因此預測準確度低
  - RNN 只能用於分類任務，不能應用於時間序列預測
  correct_index: 1
  explanation: RNN 適合處理時間序列數據，但存在梯度消失問題。LSTM 透過門控機制（遺忘門、輸入門、輸出門）有效解決了此問題，能記憶長期資訊。 
