  text: 情境：在訓練深層神經網路時，發現隨著層數增加，前面幾層的參數幾乎沒有更新，導致模型無法收斂。這最可能是什麼問題？
  type: multiple_choice
  options:
  - 過度擬合
  - 梯度消失 (Vanishing Gradient)
  - 學習率太大
  - 資料不足
  correct_index: 1
  explanation: 使用 Sigmoid 等啟動函數時，導數小於 1，連乘多次後梯度趨近於 0，導致前層參數無法有效更新。
  tags:
  - chap-ai-foundation-chapter7
  - sec-activation-functions
  id: '11448_4'
  usage: both
- chapter_title: 神經網路架構演進
  section_title: 卷積神經網路 (CNN, Convolutional Neural Networks)
  text: 情境：卷積神經網路 (CNN) 中的「池化層 (Pooling Layer)」主要功能是什麼？
  type: multiple_choice
  options:
  - 增加特徵數量
  - 降低維度並保留重要特徵 (降維與抗雜訊)
  - 進行分類
  - 反向傳播
  correct_index: 1
  explanation: 池化層透過取最大值或平均值來縮小特徵圖尺寸，減少運算量並提高對平移的容忍度。
  tags:
  - chap-ai-foundation-chapter7
  - sec-cnn
  id: '11449_5'
  usage: both
