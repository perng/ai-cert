questions:
- id: 4001
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵工程概述
  text: 吳恩達 (Andrew Ng) 將特徵工程比喻為什麼過程？
  type: multiple_choice
  options:
  - 建造工廠 (Building Factories)，建立生產設施的過程。
  - 煉油的過程 (Oil Refining Process)，將原油提煉為有價值產品的過程。
  - 銷售產品 (Selling Products)，將產品推向市場的過程。
  - 開採原油 (Extracting Crude Oil)，從地下提取原始資源的過程。
  correct_index: 1
  explanation: 吳恩達曾說：「數據就像原油，而特徵工程就是煉油的過程。」意指將原始數據提煉為有價值的特徵。
  tags:
  - chap-ai-foundation-chapter4
  - chap-ai-foundation-chapter4-summary
  usage: quiz
- id: 4002
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 為什麼在使用 KNN 或 K-Means 等演算法時，必須進行特徵縮放 (Feature Scaling)？
  type: multiple_choice
  options:
  - 為了將類別轉為數值 (Converting Categories to Numeric Values)，將文字轉換為數字。
  - 為了節省記憶體 (Saving Memory)，減少資料儲存空間。
  - 為了處理缺失值 (Handling Missing Values)，填補或移除缺失資料。
  - 為了避免數值大的特徵主導距離計算 (Avoiding Large-Value Features Dominating Distance Calculations)
  correct_index: 3
  explanation: 這些演算法依賴距離計算，若特徵單位差異過大（如年薪 vs. 年齡），數值大的特徵會完全主導結果，導致模型偏差。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  usage: quiz
- id: 4003
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 標準化 (Standardization / Z-score) 的轉換公式為何？
  type: multiple_choice
  options:
  - (x - min) / (max - min)，正規化 (Normalization) 的轉換公式。
  - (x - mean) / standard_deviation，標準化 (Standardization) 的轉換公式。
  - log(x)，對數轉換 (Log Transformation) 的轉換公式。
  - x * 2，線性縮放的轉換公式。
  correct_index: 1
  explanation: 標準化是將數值減去平均數後，再除以標準差，使資料呈現平均為 0、標準差為 1 的分佈。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  usage: quiz
- id: 4004
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 正規化 (Normalization / Min-Max Scaling) 通常將資料壓縮到哪個範圍？
  type: multiple_choice
  options:
  - '[0, 100]'，將資料壓縮到 0 到 100 的範圍。
  - '[0, 1]'，正規化 (Min-Max Scaling) 的標準範圍。
  - '[-1, 1]'，將資料壓縮到 -1 到 1 的範圍。
  - '[-infinity, infinity]'，無限制的數值範圍。
  correct_index: 1
  explanation: Min-Max Scaling 將資料線性轉換到 [0, 1] 之間，適用於對範圍敏感的演算法或影像處理。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  usage: quiz
- id: 4005
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 對數轉換 (Log Transformation) 主要用於處理哪種分佈的資料？
  type: multiple_choice
  options:
  - 均勻分佈 (Uniform Distribution)，所有數值出現機率相等的分佈。
  - 長尾分佈或右偏分佈 (Long-Tailed or Right-Skewed Distribution)，少數極大值拉長分佈。
  - 常態分佈 (Normal Distribution)，對稱的鐘形分佈。
  - 左偏分佈 (Left-Skewed Distribution)，少數極小值拉長分佈。
  correct_index: 1
  explanation: 對數轉換能壓縮極大值並拉開較小數值，使右偏（長尾）分佈更接近常態分佈，利於模型學習。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-transformation
  usage: quiz
- id: 4006
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 將「年齡」轉換為「年齡層（青年、中年、老年）」的技術稱為什麼？
  type: multiple_choice
  options:
  - 特徵分箱 (Binning)，將連續數值切分為區間類別。
  - 特徵縮放 (Feature Scaling)，調整數值範圍以統一尺度。
  - 特徵交叉 (Feature Cross)，組合多個特徵創造新特徵。
  - 獨熱編碼 (One-Hot Encoding)，將類別轉換為二元欄位。
  correct_index: 0
  explanation: 特徵分箱將連續數值切分為區間類別，有助於過濾微小雜訊並增加模型魯棒性。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-transformation
  usage: quiz
- id: 4007
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 對於「衣服尺寸 (S, M, L, XL)」這種有順序關係的類別，應使用哪種編碼？
  type: multiple_choice
  options:
  - 獨熱編碼 (One-Hot Encoding)，將每個類別轉為獨立欄位，不保留順序。
  - 序數編碼 (Ordinal Encoding)，保留類別間的大小順序關係。
  - 頻率編碼 (Frequency Encoding)，使用類別出現頻率進行編碼。
  - 雜湊編碼 (Hash Encoding)，使用雜湊函數將類別映射為數值。
  correct_index: 1
  explanation: 序數編碼能保留類別間的大小順序關係（如 S < M < L），適合有序類別。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  usage: quiz
- id: 4008
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 對於「顏色 (紅, 綠, 藍)」這種沒有順序關係的類別，應使用哪種編碼？
  type: multiple_choice
  options:
  - 序數編碼 (Ordinal Encoding)，會讓模型誤以為類別有大小順序。
  - 獨熱編碼 (One-Hot Encoding)，將每個類別轉為獨立欄位，避免順序誤解。
  - 對數轉換 (Log Transformation)，用於處理數值特徵的轉換方法。
  - 標準化 (Standardization)，用於調整數值範圍的縮放方法。
  correct_index: 1
  explanation: 獨熱編碼將每個類別轉為獨立欄位，避免模型誤以為顏色之間有大小順序關係。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  usage: quiz
- id: 4009
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 當類別數量極多（如上萬個路名）時，使用獨熱編碼會導致什麼問題？
  type: multiple_choice
  options:
  - 維度災難 (Curse of Dimensionality)，產生大量稀疏欄位導致計算困難。
  - 梯度消失 (Gradient Vanishing)，神經網路訓練中的梯度問題。
  - 模型欠擬合 (Model Underfitting)，模型過於簡單無法學習複雜模式。
  - 資料外洩 (Data Leakage)，訓練資料包含未來資訊的問題。
  correct_index: 0
  explanation: 過多的類別會產生大量稀疏欄位，導致計算量爆炸且模型難以學習，稱為維度災難。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  usage: quiz
- id: 4010
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 特徵嵌入 (Feature Embedding) 的主要優勢是什麼？
  type: multiple_choice
  options:
  - 將類別轉為高維度稀疏向量 (Converting Categories to High-Dimensional Sparse Vectors)，會產生維度災難。
  - 只能處理數值資料 (Only Processing Numeric Data)，無法處理類別特徵。
  - 完全不需要訓練 (No Training Required)，可以直接使用無需學習。
  - 將類別映射到低維度向量空間，並保留語意關係 (Mapping Categories to Low-Dimensional Vector Space While Preserving Semantic Relationships)
  correct_index: 3
  explanation: Embedding 能將高基數類別壓縮到低維空間，且讓意義相近的類別在空間中距離較近。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  usage: quiz
- id: 4011
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 特徵交叉 (Feature Cross) 的目的是什麼？
  type: multiple_choice
  options:
  - 處理缺失值 (Handling Missing Values)，填補或移除缺失資料。
  - 減少特徵數量 (Reducing Feature Count)，降低模型複雜度。
  - 將數值轉為類別 (Converting Numeric to Categories)，使用分箱技術。
  - 組合多個特徵以捕捉非線性的交互作用 (Combining Multiple Features to Capture Non-Linear Interactions)
  correct_index: 3
  explanation: 特徵交叉透過組合特徵（如經度 x 緯度），讓線性模型也能學習到非線性的複雜關係。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  usage: both
- id: 4012
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵選擇
  text: 下列何者不是特徵過多帶來的負面影響？
  type: multiple_choice
  options:
  - 計算成本增加 (Increased Computational Cost)，需要更多運算資源。
  - 模型準確率必定提升 (Model Accuracy Will Definitely Improve)，特徵過多可能導致過度擬合反而降低準確率。
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化。
  - 維度災難 (Curse of Dimensionality)，高維度空間導致計算困難。
  correct_index: 1
  explanation: 特徵過多包含雜訊，反而可能導致過度擬合，使模型在未知資料上表現變差，準確率不一定提升。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  usage: both
- id: 4013
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵選擇
  text: 使用「相關係數」來篩選特徵，屬於哪種特徵選擇方法？
  type: multiple_choice
  options:
  - 過濾法 (Filter)，使用統計指標在模型訓練前篩選特徵。
  - 隨機法 (Random Method)，隨機選擇特徵的方法。
  - 嵌入法 (Embedded)，特徵選擇融合在模型訓練過程中。
  - 包裝法 (Wrapper)，使用模型效能評估特徵重要性。
  correct_index: 0
  explanation: 過濾法在進入模型前，利用統計指標（如相關係數）先篩除不相關特徵。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  usage: both
- id: 4014
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵選擇
  text: Lasso 回歸 (L1 Regularization) 自動將不重要特徵係數變為 0，屬於哪種方法？
  type: multiple_choice
  options:
  - 嵌入法 (Embedded)，特徵選擇融合在模型訓練過程中。
  - 人工挑選 (Manual Selection)，由專家手動選擇特徵。
  - 包裝法 (Wrapper)，使用模型效能評估特徵重要性。
  - 過濾法 (Filter)，使用統計指標在模型訓練前篩選特徵。
  correct_index: 0
  explanation: 嵌入法是指特徵選擇過程融合在模型訓練過程中，Lasso 就是典型例子。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  usage: both
- id: 4015
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 在詐欺偵測中，如果詐欺樣本只有 1%，模型全部猜「正常」會有什麼結果？
  type: multiple_choice
  options:
  - 準確率很高 (99%)，但毫無實用價值 (High Accuracy But No Practical Value)，無法偵測詐欺案例。
  - 召回率 (Recall) 很高 (High Recall)，能有效找出所有詐欺案例。
  - 模型會崩潰 (Model Will Crash)，系統無法正常運作。
  - 準確率很低 (Low Accuracy)，模型預測錯誤率極高。
  correct_index: 0
  explanation: 這就是準確率悖論 (Accuracy Paradox)，高準確率不代表模型能有效抓出少數類別。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4016
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: SMOTE (Synthetic Minority Over-sampling Technique) 的核心原理是？
  type: multiple_choice
  options:
  - 調整類別權重 (Adjusting Class Weights)，增加少數類別的懲罰分數。
  - 隨機刪除多數類別樣本 (Randomly Deleting Majority Class Samples)，屬於欠採樣方法。
  - 在少數樣本及其鄰居連線上生成新樣本 (Generating New Samples on Lines Between Minority Samples and Neighbors)
  - 直接複製少數類別樣本 (Directly Copying Minority Class Samples)，簡單的過採樣方法。
  correct_index: 2
  explanation: SMOTE 透過插值方式「無中生有」創造新樣本，而非單純複製，能增加樣本多樣性。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4017
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: ADASYN 與 SMOTE 的主要差異在於？
  type: multiple_choice
  options:
  - 兩者完全相同 (Completely Identical)，ADASYN 與 SMOTE 沒有差異。
  - ADASYN 根據學習難度（邊界樣本）生成更多數據 (ADASYN Generates More Data Based on Learning Difficulty/Boundary Samples)
  - ADASYN 只能處理影像 (ADASYN Only Processes Images)，僅限於影像資料處理。
  - ADASYN 只刪除樣本 (ADASYN Only Deletes Samples)，屬於欠採樣方法。
  correct_index: 1
  explanation: ADASYN 會在難以分類的邊界區域生成更多樣本，強迫模型學習這些困難案例。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4018
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: Tomek Links 主要用於哪種採樣策略？
  type: multiple_choice
  options:
  - 特徵選擇 (Feature Selection)，選擇重要特徵的方法。
  - 過採樣 (Oversampling)，增加少數類別樣本數量的方法。
  - 欠採樣 (Undersampling)，減少多數類別樣本數量的方法。
  - 特徵縮放 (Feature Scaling)，調整特徵數值範圍的方法。
  correct_index: 2
  explanation: Tomek Links 用於找出邊界模糊的樣本對，並刪除其中的多數類別樣本，屬於欠採樣的一種。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4019
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 類別權重調整 (Class Weights) 是如何運作的？
  type: multiple_choice
  options:
  - 增加少數類別的樣本數 (Increasing Minority Class Sample Count)，屬於過採樣方法。
  - 減少多數類別的樣本數 (Reducing Majority Class Sample Count)，屬於欠採樣方法。
  - 忽略少數類別 (Ignoring Minority Class)，完全不處理不平衡問題。
  - 提高模型答錯少數類別時的懲罰分數 (Increasing Penalty Score When Model Misclassifies Minority Class)
  correct_index: 3
  explanation: 透過給予少數類別更高的權重（懲罰），強迫模型重視這些樣本，而不需改變資料本身。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4020
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 若資料包含類別型特徵，能否直接使用標準的 SMOTE？
  type: multiple_choice
  options:
  - 視情況而定 (Depends on the Situation)，根據資料特性決定是否適用。
  - 可以，沒問題 (Yes, No Problem)，標準 SMOTE 可以直接處理類別特徵。
  - 可以，但效果很差 (Yes, But Poor Performance)，可以使用但效果不佳。
  - 不行，因為無法計算類別間的歐氏距離 (No, Because Cannot Calculate Euclidean Distance Between Categories)
  correct_index: 3
  explanation: 標準 SMOTE 基於數值距離計算，無法處理類別（如無法計算紅色和藍色的平均），需改用 SMOTE-NC。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  usage: both
- id: 4021
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 在進行特徵縮放時，若資料包含極端值 (Outliers)，哪種方法較不適合？
  type: multiple_choice
  options:
  - 標準化 (Standardization)，使用平均數與標準差，對極端值較敏感。
  - Robust Scaling，使用中位數與四分位距，對極端值較穩健。
  - Log Transformation，對數轉換可壓縮極端值。
  - 正規化 (Min-Max Scaling)，使用最大值與最小值，極端值會影響轉換範圍。
  correct_index: 3
  explanation: Min-Max Scaling 使用最大值和最小值進行計算，極端值會導致大部分數據被壓縮到極小的範圍內。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  usage: both
- id: 4022
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵選擇
  text: 遞迴特徵消除 (RFE) 屬於哪種特徵選擇方法？
  type: multiple_choice
  options:
  - 隨機法
  - 過濾法 (Filter)
  - 嵌入法 (Embedded)
  - 包裝法 (Wrapper)
  correct_index: 3
  explanation: RFE 反覆訓練模型並剔除最不重要的特徵，屬於包裝法。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  usage: both
- id: 4023
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 目標編碼 (Target Encoding) 的原理是？
  type: multiple_choice
  options:
  - 用 0 和 1 取代
  - 用該類別在目標變數的平均值取代
  - 用雜湊值取代
  - 用類別的序號取代
  correct_index: 1
  explanation: Target Encoding 直接利用目標變數的統計資訊（如平均房價）來代表該類別（如城市），能有效處理高基數特徵。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  usage: both
- id: 4024
  chapter_title: 特徵工程 (Feature Engineering)
  section_title: 特徵工程概述
  text: 下列哪種演算法不需要進行特徵縮放？
  type: multiple_choice
  options:
  - KNN (K-近鄰)
  - 類神經網路
  - SVM (支援向量機)
  - 決策樹 (Decision Tree)
  correct_index: 3
