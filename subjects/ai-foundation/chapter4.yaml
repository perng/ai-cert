- id: 11433
  chapter_title: 特徵工程
  section_title: 不平衡數據處理
  text: 在工業物聯網架構中 ， 進行設備預測性維護 （Predictive Maintenance） 時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料，
    下列哪一種方法最能兼顧模型穩定性與異常偵測效能？ (114年第四梯次)
  type: multiple_choice
  options:
  - 將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭 配全序列訓練模型（如 LSTM）
  - 對時間序列進行差分與標準化後，使用傳統監督式學習模型（如 SVM）進行分類訓練
  - 使用經過時間序列特化的 SMOTE 技術生成異常樣本，以平衡異常與 正常資料比例
  - 採用基於重建誤差的自編碼器模型（ Sequence-to-Sequence Autoencoder）進行異常偵測，並僅使用正常資料進行訓練
  correct_index: 3
  explanation: SMOTE 是一種過採樣技術，透過在少數類樣本間進行插值來合成新樣本，比單純複製樣本更能提升模型的泛化能力。
  tags:
  - past-exam
  - 114-4
  - sec-ai-chapter4
  - sec-imbalanced-data
  usage: both
- id: 11446
  chapter_title: 特徵工程
  section_title: 特徵選擇
  text: 某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬 性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提 升模型效能。下列哪一種描述最符合監督式特徵選擇（
    Supervised Feature Selection）的概念？ (114年第四梯次)
  type: multiple_choice
  options:
  - 根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目標變數
  - 評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵
  - 使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較大的欄位
  - 將特徵透過降維方法（如 PCA）轉換為新特徵，再用於模型訓練
  correct_index: 1
  explanation: 此題涉及 特徵選擇 的核心概念。正確答案為「評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大的特徵」。
  tags:
  - past-exam
  - 114-4
  - sec-ai-chapter4
  - chap-ai-foundation-chapter4
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：你正在訓練一個 KNN 模型來預測房價。特徵包含「房間數 (1-10)」與「總價 (100萬-1億)」。若不進行特徵縮放，會發生什麼事？
  type: multiple_choice
  options:
  - 模型會認為「房間數」比較重要
  - 模型會被「總價」主導，忽略「房間數」的影響
  - 模型準確率會提高
  - 沒影響
  correct_index: 1
  explanation: KNN 是基於距離的演算法。數值範圍大的特徵（總價）在計算歐氏距離時會佔據主導地位，導致數值小的特徵（房間數）失效。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  id: 11447
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：分析網頁點擊數時，發現數據呈現嚴重的「長尾分佈」（大部分網頁點擊很少，少數網頁點擊極高）。為了讓線性模型更好學習，應進行哪種轉換？
  type: multiple_choice
  options:
  - 對數轉換 (Log Transformation)
  - 平方轉換
  - 不處理
  - 乘以 100
  correct_index: 0
  explanation: 對數轉換能有效壓縮長尾分佈的極端值，拉開小數值的間距，使資料分佈更接近常態分佈。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-transformation
  id: 11448
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 情境：處理「衣服尺寸」特徵 (XS, S, M, L, XL) 時，最佳的編碼方式是？
  type: multiple_choice
  options:
  - 獨熱編碼 (One-Hot Encoding)
  - 序數編碼 (Ordinal Encoding)
  - 雜湊編碼
  - 刪除該欄位
  correct_index: 1
  explanation: 衣服尺寸具有明確的順序關係 (XS < S < M...)，序數編碼能保留這種大小資訊供模型學習。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  id: 11449
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 情境：若對「居住城市」進行獨熱編碼 (One-Hot Encoding)，但城市有 5000 個，這會導致什麼問題？
  type: multiple_choice
  options:
  - 維度災難 (Curse of Dimensionality) 與資料稀疏
  - 模型訓練變快
  - 準確率必定提升
  - 資料變小
  correct_index: 0
  explanation: 類別過多會產生大量的新欄位（維度爆炸），導致資料變得極度稀疏，增加運算負擔且易過度擬合。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  id: 11450
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 情境：在預測房價時，單看「經度」或「緯度」效果不佳。但若將地圖切成網格，將「經度 x 緯度」組合成一個新特徵，效果顯著提升。這使用了？
  type: multiple_choice
  options:
  - 特徵縮放
  - 特徵交叉 (Feature Cross)
  - 特徵選擇
  - 特徵雜湊
  correct_index: 1
  explanation: 特徵交叉透過組合兩個或多個特徵，能捕捉非線性的交互作用（如特定經緯度區塊的房價效應）。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  id: 11451
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 情境：在信用卡詐欺偵測中，詐欺交易僅佔 0.1%。若直接訓練模型，模型傾向預測所有交易都是「正常」，準確率雖高但無用。這時應採用？
  type: multiple_choice
  options:
  - 刪除所有正常交易
  - SMOTE (合成少數類別過採樣技術)
  - 只用準確率評估
  - 放棄訓練
  correct_index: 1
  explanation: SMOTE 透過合成新的少數類別樣本來平衡資料集，避免模型忽略少數類別（詐欺）。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  id: 11452
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 情境：使用 Lasso 回歸 (L1 Regularization) 訓練模型後，發現許多特徵的係數變成了 0。這表示 Lasso 具有什麼功能？
  type: multiple_choice
  options:
  - 特徵選擇 (Feature Selection)
  - 特徵縮放
  - 特徵交叉
  - 資料擴增
  correct_index: 0
  explanation: L1 正則化傾向產生稀疏解，自動將不重要的特徵權重降為 0，達到特徵篩選的效果。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  id: 11453
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：將「年齡」欄位轉換為「少年、青年、中年、老年」區間，這種技術稱為？
  type: multiple_choice
  options:
  - 特徵分箱 (Binning)
  - 特徵縮放
  - 獨熱編碼
  - 對數轉換
  correct_index: 0
  explanation: 分箱將連續數值離散化，有助於平滑雜訊並增加模型的魯棒性。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-transformation
  id: 11454
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 情境：Tomek Links 是一種欠採樣 (Undersampling) 技術，它的主要作用是？
  type: multiple_choice
  options:
  - 隨機刪除資料
  - 清除類別邊界模糊的樣本，讓邊界更清晰
  - 增加少數類別樣本
  - 複製資料
  correct_index: 1
  explanation: Tomek Links 找出距離最近但類別不同的樣本對，並刪除其中的多數類別樣本，以釐清分類邊界。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  id: 11455
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 情境：Word2Vec 將每個單詞映射為一個向量，使得「國王 - 男人 + 女人」的向量接近「皇后」。這屬於？
  type: multiple_choice
  options:
  - 特徵嵌入 (Feature Embedding)
  - 獨熱編碼
  - 序數編碼
  - 特徵雜湊
  correct_index: 0
  explanation: Embedding 將高維稀疏類別映射到低維稠密向量空間，並能捕捉語意關係。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  id: 11456
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 情境：為什麼特徵不是越多越好？加入過多無關特徵會導致？
  type: multiple_choice
  options:
  - 模型變聰明
  - 過度擬合 (Overfitting) 與計算量大增
  - 欠擬合
  - 資料變少
  correct_index: 1
  explanation: 過多雜訊特徵會讓模型學到錯誤的規律（過擬合），且大幅增加訓練成本。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  id: 11457
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：標準化 (Standardization) 的公式是？
  type: multiple_choice
  options:
  - (x - min) / (max - min)
  - (x - mean) / std
  - log(x)
  - x * 2
  correct_index: 1
  explanation: 標準化將資料轉換為平均值為 0，標準差為 1 的分佈。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  id: 11458
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 情境：除了重採樣，還可以用什麼方法處理不平衡資料？
  type: multiple_choice
  options:
  - 調整類別權重 (Class Weights)，加大少數類別的懲罰
  - 刪除所有特徵
  - 使用線性迴歸
  - 不做任何處理
  correct_index: 0
  explanation: 透過給予少數類別更高的錯誤懲罰權重，強迫模型重視該類別。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  id: 11459
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 情境：遞迴特徵消除 (RFE) 屬於哪種特徵選擇方法？
  type: multiple_choice
  options:
  - 過濾法 (Filter)
  - 包裝法 (Wrapper)
  - 嵌入法 (Embedded)
  - 隨機法
  correct_index: 1
  explanation: RFE 反覆訓練模型並剔除最弱特徵，是典型的包裝法。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  id: 11460
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：正規化 (Normalization / Min-Max Scaling) 將資料壓縮到什麼範圍？
  type: multiple_choice
  options:
  - '[0, 1]'
  - '[-1, 1]'
  - '[0, 100]'
  - 無限制
  correct_index: 0
  explanation: Min-Max Scaling 的公式確保轉換後的數值落在 0 到 1 之間。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  id: 11461
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 類別特徵編碼
  text: 情境：特徵雜湊 (Feature Hashing) 主要用於解決？
  type: multiple_choice
  options:
  - 數值過大
  - 高基數類別導致的維度災難
  - 缺失值
  - 異常值
  correct_index: 1
  explanation: Hashing 將任意數量的類別映射到固定數量的桶中，有效控制維度。
  tags:
  - chap-ai-foundation-chapter4
  - sec-categorical-encoding
  id: 11462
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 情境：隨機過採樣 (Random Oversampling) 的主要缺點是？
  type: multiple_choice
  options:
  - 容易導致過度擬合
  - 遺失資訊
  - 計算太慢
  - 無法實作
  correct_index: 0
  explanation: 單純複製樣本會讓模型反覆看到完全相同的資料，容易死記硬背（過擬合）。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  id: 11463
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 進階特徵技巧
  text: 情境：過濾法 (Filter Method) 進行特徵選擇的依據通常是？
  type: multiple_choice
  options:
  - 模型準確率
  - 特徵與目標變數的統計相關性 (Correlation)
  - 訓練時間
  - 特徵長度
  correct_index: 1
  explanation: 過濾法在進模型前先計算統計指標（如相關係數）來篩選特徵。
  tags:
  - chap-ai-foundation-chapter4
  - sec-advanced-features
  id: 11464
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 數值特徵處理
  text: 情境：決策樹演算法是否需要進行特徵縮放？
  type: multiple_choice
  options:
  - 需要
  - 不需要
  - 看情況
  - 一定要
  correct_index: 1
  explanation: 決策樹是基於規則切割空間，不涉及距離計算，因此不受特徵尺度影響。
  tags:
  - chap-ai-foundation-chapter4
  - sec-feature-scaling
  id: 11465
  usage: both
- chapter_title: 特徵工程 (Feature Engineering)
  section_title: 不平衡資料處理
  text: 情境：ADASYN 與 SMOTE 的主要區別在於？
  type: multiple_choice
  options:
  - ADASYN 會在學習難度高（邊界模糊）的區域生成更多樣本
  - ADASYN 比較慢
  - SMOTE 不能處理數值
  - 兩者一樣
  correct_index: 0
  explanation: ADASYN 自適應地根據樣本周圍的密度分布，在較難分類的區域生成更多合成樣本。
  tags:
  - chap-ai-foundation-chapter4
  - sec-imbalanced-data
  id: 11466
  usage: both
