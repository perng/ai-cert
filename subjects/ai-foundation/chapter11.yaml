  - chap-ai-foundation-chapter11
  - sec-eu-ai-act
  usage: both
- id: 11024
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 金融業 AI 規範中，「系統安全性」要求防止什麼？
  type: multiple_choice
  options:
  - 防止員工偷懶 (Preventing Employee Laziness)，避免員工怠工。
  - 防止對抗式攻擊與駭客入侵 (Preventing Adversarial Attacks and Hacker Intrusions)
  - 防止斷電 (Preventing Power Outages)，避免電力中斷。
  - 防止客戶投訴 (Preventing Customer Complaints)，避免客戶不滿。
  correct_index: 1
  explanation: 金融系統必須具備強健性，能抵禦惡意攻擊並確保服務不中斷。
