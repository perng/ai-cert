  - sec-financial-ai
  usage: both
- id: 11025
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: AI 產品評測中的「彈性 (Resilience)」是指？
  type: multiple_choice
  options:
  - 遇到異常輸入或攻擊時，系統仍能維持運作的能力 (System's Ability to Maintain Operation When Facing Abnormal Inputs or Attacks)
  - 模型可以隨意變形 (Model Can Deform Randomly)，模型結構可以任意改變。
  - 回應速度 (Response Speed)，系統回應的快速程度。
  - 價格彈性 (Price Elasticity)，價格變動的敏感程度。
  correct_index: 0
  explanation: 彈性測試系統在面對壓力或惡意輸入時的穩定性與恢復能力。
  tags:
  - chap-ai-foundation-chapter11
  - sec-moda-eval
  usage: both
- id: 11026
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣 AI 基本法草案的定位是？
  type: multiple_choice
  options:
  - 技術手冊 (Technical Manual)，技術操作指南。
  - 上位法，確立基本原則 (Upper-Level Law, Establishing Basic Principles)
  - 僅適用於公部門 (Only Applicable to Public Sector)，僅限政府機關。
  - 處罰條例 (Penalty Regulations)，處罰相關法規。
  correct_index: 1
  explanation: 基本法作為指導性法律，為 AI 發展與監管提供大方向與原則。
