- id: 11051
  chapter_title: AI 治理、法規與倫理
  section_title: AI 倫理議題
  text: 演算法偏見 (Algorithmic Bias) 最常見的來源是？
  type: multiple_choice
  options:
  - 電腦硬體故障
  - 駭客攻擊
  - 訓練數據本身就反映了人類社會既有的偏見與不平等（如性別、種族歧視）
  - 程式碼寫錯了
  correct_index: 2
  explanation: Garbage In, Garbage Out。如果歷史招聘數據都偏好男性，AI 就會學會「男性比較適合工作」這個偏見。
  tags:
  - sec-ai-chapter11
  - sec-ai-ethics
- id: 11052
  chapter_title: AI 治理、法規與倫理
  section_title: AI 法規與標準
  text: 歐盟《人工智慧法案》(EU AI Act) 採用「基於風險 (Risk-based)」的分級管理，其中「社會信用評分 (Social Scoring)」屬於哪一級？
  type: multiple_choice
  options:
  - 高風險 (High Risk)
  - 最小風險 (Minimal Risk)
  - 有限風險 (Limited Risk)
  - 不可接受的風險 (Unacceptable Risk)，完全禁止使用
  correct_index: 3
  explanation: 歐盟認為利用 AI 進行大規模社會監控與評分嚴重侵犯人權，因此將其列為禁區。
  tags:
  - sec-ai-chapter11
  - sec-ai-regulations
- id: 11053
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評估標準
  text: 在評估 AI 系統的「強健性 (Robustness)」時，我們主要關注什麼？
  type: multiple_choice
  options:
  - 系統介面是否美觀
  - 系統的價格是否便宜
  - 系統在面對雜訊、惡意攻擊或異常輸入時，能否維持穩定的表現而不崩潰或輸出離譜結果
  - 系統是否支援多國語言
  correct_index: 2
  explanation: 強健性是 AI 安全的基石。一個稍微改個像素就認錯圖的模型，是不具備強健性的。
  tags:
  - sec-ai-chapter11
  - sec-eval-standards
- id: 11054
  chapter_title: AI 治理、法規與倫理
  section_title: AI 倫理議題
  text: 「問責制 (Accountability)」在 AI 治理中意味著？
  type: multiple_choice
  options:
  - 必須有明確的人類主體（開發者、部署者或使用者）對 AI 的決策與後果負責
  - 不需要任何人負責，因為是電腦做的
  - 發生事故時，大家互相指責
  - AI 做錯事要自己坐牢
  correct_index: 0
  explanation: AI 只是工具，不具備法律人格。確保「有人負責」是避免 AI 濫用與推卸責任的關鍵。
  tags:
  - sec-ai-chapter11
  - sec-ai-ethics
- id: 11055
  chapter_title: AI 治理、法規與倫理
  section_title: AI 法規與標準
  text: GDPR 第 22 條規定使用者有權「不受制於完全自動化的決策」，這意味著？
  type: multiple_choice
  options:
  - 對於產生重大法律效力或類似影響的決策（如拒絕貸款），使用者有權要求人工介入審查 (Human Intervention)
  - 所有決策都必須由人工完成
  - 使用者可以隨意更改決策結果
  - 禁止使用電腦進行計算
  correct_index: 0
  explanation: 這是為了防止「演算法獨裁」，確保在關鍵時刻，人類仍保有最終的申訴與審查權利。
  tags:
  - sec-ai-chapter11
  - sec-ai-regulations
- id: 11056
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評估標準
  text: 「公平性 (Fairness)」指標通常用來檢測模型是否存在什麼問題？
  type: multiple_choice
  options:
  - 模型是否過擬合
  - 運算速度太慢
  - 模型是否使用了盜版軟體
  - 對不同群體（如性別、種族）的預測表現是否存在顯著差異（例如對女性的貸款核准率異常低）
  correct_index: 3
  explanation: 公平性測試旨在揭露模型潛藏的歧視，確保 AI 不會加劇社會的不平等。
  tags:
