  chapter_title: AI 治理、法規與倫理
  section_title: AI 倫理議題
  text: 「問責制 (Accountability)」在 AI 治理中意味著？
  type: multiple_choice
  options:
  - 必須有明確的人類主體（開發者、部署者或使用者）對 AI 的決策與後果負責 (Must Have Clear Human Subject (Developer, Deployer, or User) Responsible for AI Decisions and Consequences)
