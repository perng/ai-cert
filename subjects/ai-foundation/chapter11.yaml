  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 金融業 AI 規範中，「保護隱私」強調什麼原則？
  type: multiple_choice
  options:
  - 公開所有資料
  - 最小化蒐集 (Data Minimization)
  - 最大化蒐集
  - 隨意分享
  correct_index: 1
  explanation: 只蒐集業務所需的必要資料，避免過度蒐集個資，降低隱私風險。
  tags:
  - sec-chapter11
  - sec-financial-ai
- id: 11030
  chapter_title: AI 治理、法規與倫理
  section_title: AI 治理、法規與倫理
  text: AI 治理 (AI Governance) 的核心目標是？
  type: multiple_choice
  options:
  - 取代人類政府
  - 提高 AI 價格
  - 確保 AI 向善 (AI for Good)，降低風險並符合法規
  - 限制 AI 發展
  correct_index: 2
  explanation: AI 治理旨在平衡創新與風險，確保技術發展造福人類而非造成傷害。
  tags:
  - sec-chapter11
  - sec-chapter11-summary
