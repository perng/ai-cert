  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 下列哪項技術可以在不洩漏個資的情況下進行數據統計？
  type: multiple_choice
  options:
  - 差分隱私
  - 公開數據
  - 備份數據
  - 數據清洗
  correct_index: 0
  explanation: 差分隱私專為此目的設計，能在保護個體的同時提供準確的群體統計。
