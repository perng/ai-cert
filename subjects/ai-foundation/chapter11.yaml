  - 測試資料樣本與訓練資料高度重複，造成模型泛化能力評估失準 (High Overlap Between Test and Training Data, Causing Inaccurate Generalization Assessment)，資料重複的問題。
  - 訓練資料中類別分布不均，使模型在少數類別上表現不佳 (Uneven Class Distribution in Training Data, Causing Poor Performance on Minority Classes)，類別不平衡的問題。
