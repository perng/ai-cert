  - sec-financial-ai
- id: 11025
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: AI 產品評測中的「彈性 (Resilience)」是指？
  type: multiple_choice
  options:
  - 遇到異常輸入或攻擊時，系統仍能維持運作的能力
  - 模型可以隨意變形
  - 回應速度
  - 價格彈性
  correct_index: 0
  explanation: 彈性測試系統在面對壓力或惡意輸入時的穩定性與恢復能力。
