  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: EU AI Act 中，公共場所的即時遠端生物辨識原則上是？
  type: multiple_choice
  options:
  - 僅限商業使用
  - 完全開放
  - 鼓勵使用
  - 禁止 (除特定執法例外)
  correct_index: 3
  explanation: 為了保障隱私與自由，原則上禁止，除非是為了追捕重犯等重大公共利益。
