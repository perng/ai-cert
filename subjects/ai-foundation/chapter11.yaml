  section_title: AI 倫理議題
  text: 在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列  答案 題    目 哪種資料處理策略屬於常見的「資料去偏（Data Debiasing）
    」做法？ (114年第四梯次)
  type: multiple_choice
  options:
  - 讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差 (Randomly Replacing Outputs During Training to Offset Systematic Bias in Data)，隨機替換輸出。
  - 增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見 (Increasing Model Parameters, Relying on Larger Models to Automatically Eliminate Bias in Original Data)，擴大模型規模。
  - 調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避 免模型過度偏向出現頻率高的類別 (Adjusting or Expanding Training Corpus to Balance Proportions of Different Groups or Types, Avoiding Model Over-Biasing Toward High-Frequency Categories)
  - 對訓練資料施加額外正則化或噪音，使模型在學習過程中對偏見敏 感度降低 (Applying Additional Regularization or Noise to Training Data, Reducing Model Sensitivity to Bias During Learning)，加入正則化或噪音。
  correct_index: 2
  explanation: 演算法偏見通常源自訓練數據的偏差。若數據本身包含歷史歧視，模型便會學習並放大這些偏見。
