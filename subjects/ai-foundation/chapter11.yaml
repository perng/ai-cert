questions:
- id: 11001
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: AI 模型產生偏見 (Bias) 的主要原因通常是？
  type: multiple_choice
  options:
  - 演算法本身的數學錯誤 (Mathematical Errors in Algorithm Itself)，計算公式有誤。
  - 電腦硬體故障 (Computer Hardware Malfunction)，硬體設備損壞。
  - 訓練資料反映了歷史上的社會偏見或抽樣不均 (Training Data Reflects Historical Social Bias or Sampling Imbalance)
  - 程式碼寫太長 (Code Written Too Long)，程式碼長度過長。
  correct_index: 2
  explanation: AI 模型是從歷史數據中學習，若數據本身包含人類社會的偏見（如性別歧視），模型就會學到並放大這些偏見。
  tags:
  - chap-ai-foundation-chapter11
  - sec-bias-fairness
  usage: quiz
- id: 11002
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: Amazon 的 AI 招聘系統曾發生什麼倫理問題？
  type: multiple_choice
  options:
  - 歧視女性求職者（對包含女性詞彙的履歷扣分）(Discriminating Against Female Job Applicants: Deducting Points from Resumes Containing Female Terms)
  - 洩漏個資 (Leaking Personal Data)，個人資料外洩。
  - 錄取太多人 (Hiring Too Many People)，錄取人數過多。
  - 系統當機 (System Crash)，系統無法運作。
  correct_index: 0
  explanation: 因為過去科技業多為男性，AI 學習歷史數據後誤以為「男性」是好員工的特徵，導致歧視女性。
  tags:
  - chap-ai-foundation-chapter11
  - sec-bias-fairness
  usage: quiz
- id: 11003
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 差分隱私 (Differential Privacy) 的核心技術是？
  type: multiple_choice
  options:
  - 資料加密 (Data Encryption)，將資料轉換為密文。
  - 使用區塊鏈 (Using Blockchain)，採用分散式帳本技術。
  - 刪除資料 (Deleting Data)，移除所有資料。
  - 在資料中加入適量的數學雜訊 (Noise) (Adding Appropriate Amount of Mathematical Noise to Data)
  correct_index: 3
  explanation: 差分隱私透過加入雜訊，使得攻擊者無法分辨特定個人的資訊，但仍能保持整體統計數據的準確性。
  tags:
  - chap-ai-foundation-chapter11
  - sec-privacy
  usage: quiz
- id: 11004
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 聯邦學習 (Federated Learning) 的最大特色是？
  type: multiple_choice
  options:
  - 不需要模型 (No Model Required)，完全不需要模型。
  - 數據不離地 (Data stays local)，只交換模型參數 (Data Stays Local, Only Exchanging Model Parameters)
  - 只能由政府使用 (Can Only Be Used by Government)，僅限政府機構。
  - 所有資料都上傳到雲端 (All Data Uploaded to Cloud)，資料集中儲存。
  correct_index: 1
  explanation: 聯邦學習讓模型在本地裝置訓練，只回傳參數更新給伺服器，原始私密資料保留在用戶端。
  tags:
  - chap-ai-foundation-chapter11
  - sec-privacy
  usage: quiz
- id: 11005
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 在 AI 輔助決策（如醫療診斷）中，「人機協作 (Human-in-the-loop)」意味著？
  type: multiple_choice
  options:
  - 最終決策權與責任仍在人類專家身上 (Final Decision-Making Authority and Responsibility Remain with Human Experts)
  - AI 全權負責 (AI Fully Responsible)，完全由 AI 決定。
  - 人類完全不介入 (Humans Do Not Intervene at All)，無人為參與。
  - AI 取代人類 (AI Replaces Humans)，AI 完全取代人類角色。
  correct_index: 0
  explanation: 高風險決策不能全交給 AI，必須有人類專家審核 AI 的建議並做出最終決定。
  tags:
  - chap-ai-foundation-chapter11
  - sec-accountability
  usage: quiz
- id: 11006
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣《人工智慧基本法》草案中提到的「監理沙盒 (Regulatory Sandbox)」目的是？
  type: multiple_choice
  options:
  - 允許企業在風險可控範圍內測試創新技術，暫時豁免部分法規 (Allowing Enterprises to Test Innovative Technologies Within Controllable Risk Range, Temporarily Exempting Some Regulations)
  - 建立兒童遊樂場 (Building Children's Playground)，設置遊樂設施。
  - 禁止 AI 發展 (Prohibiting AI Development)，完全禁止 AI 技術。
  - 處罰違規企業 (Penalizing Non-Compliant Enterprises)，對違規者進行處罰。
  correct_index: 0
  explanation: 監理沙盒提供一個實驗場域，讓創新技術能在法規尚未完備前先行測試，促進產業發展。
  tags:
  - chap-ai-foundation-chapter11
  - sec-taiwan-ai-law
  usage: quiz
- id: 11007
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣金融業運用 AI 的核心原則中，關於「治理 (Governance)」的重點是？
  type: multiple_choice
  options:
  - 外包給廠商負責 (Outsourcing to Vendors)，委外處理。
  - 董事會與高層管理階層應負起監督責任 (Board of Directors and Senior Management Should Bear Supervisory Responsibility)
  - 由 IT 部門全權負責 (Fully Handled by IT Department)，僅由技術部門處理。
  - 不需要治理 (No Governance Required)，完全不需要管理。
  correct_index: 1
  explanation: 金管會強調 AI 治理是董事會層級的責任，不能僅視為技術操作層面的問題。
  tags:
  - chap-ai-foundation-chapter11
  - sec-financial-ai
  usage: quiz
- id: 11008
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 歐盟《人工智慧法案》(EU AI Act) 採取什麼樣的監管模式？
  type: multiple_choice
  options:
  - 技術導向 (Technology-Oriented)，以技術為核心考量。
  - 全面禁止 (Complete Prohibition)，完全禁止所有 AI 應用。
  - 完全放任 (Complete Laissez-Faire)，完全不進行監管。
  - 風險導向 (Risk-based approach)，根據風險等級進行分級管理。
  correct_index: 3
  explanation: EU AI Act 根據 AI 應用的風險等級（不可接受、高、有限、最小）實施不同強度的監管。
  tags:
  - chap-ai-foundation-chapter11
  - sec-eu-ai-act
  usage: quiz
- id: 11009
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 根據 EU AI Act，「社會信用評分 (Social Scoring)」屬於哪一級風險？
  type: multiple_choice
  options:
  - 有限風險 (Limited Risk)，風險程度有限。
  - 高風險 (High Risk)，風險程度較高。
  - 最小風險 (Minimal Risk)，風險程度極低。
  - 不可接受風險 (Unacceptable Risk) - 禁止 (Unacceptable Risk: Prohibited)
  correct_index: 3
  explanation: 社會信用評分被認為嚴重侵犯人權，在歐盟是完全禁止的。
  tags:
  - chap-ai-foundation-chapter11
  - sec-eu-ai-act
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: 數位發展部 AI 產品評測中心的評測指標不包含下列何者？
  type: multiple_choice
  options:
  - 可解釋性 (Explainability)，模型決策過程的可理解程度。
  - 安全性 (Safety)，系統的安全性與穩定性。
  - 公平性 (Fairness)，模型對不同群體的公平程度。
  - 資料複雜性 (Data Complexity)，資料本身的複雜程度。
  correct_index: 3
  explanation: 評測中心主要評估模型本身的性能與安全，資料品質通常被視為廠商的責任，不在直接評測範圍內。
  tags:
  - chap-ai-foundation-chapter11
  - sec-moda-eval
  usage: both
- id: 11013
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 「資料去偏 (Data Debiasing)」的主要目的是？
  type: multiple_choice
  options:
  - 消除訓練資料中的不公平偏見，確保模型公平性 (Eliminating Unfair Bias in Training Data, Ensuring Model Fairness)
  - 加密資料 (Encrypting Data)，將資料轉換為密文。
  - 減少資料量 (Reducing Data Volume)，降低資料集大小。
  - 加快訓練速度 (Accelerating Training Speed)，提升訓練效率。
  correct_index: 0
  explanation: 透過調整資料分佈或演算法約束，減少模型因歷史數據而產生的歧視行為。
  tags:
  - chap-ai-foundation-chapter11
  - sec-bias-fairness
  usage: both
- id: 11014
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 聯邦學習適合應用於哪個場景？
  type: multiple_choice
  options:
  - 多家醫院聯合研究，但病歷個資不能出院 (Multiple Hospitals Joint Research, But Medical Records Cannot Leave Hospital)
  - 單機遊戲 (Single-Player Games)，不需要資料共享的應用。
  - 天氣預報 (Weather Forecasting)，公開資料的應用場景。
  - 公開數據集的訓練 (Training on Public Datasets)，使用公開資料集。
  correct_index: 0
  explanation: 聯邦學習是解決跨機構資料隱私共享問題的最佳方案。
  tags:
  - chap-ai-foundation-chapter11
  - sec-privacy
  usage: both
- id: 11015
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 金融業 AI 規範中的「透明度與可解釋性」要求什麼？
  type: multiple_choice
  options:
  - 當 AI 做出重大決策（如拒貸）時，必須能解釋原因 (When AI Makes Major Decisions (Such as Loan Rejection), Must Be Able to Explain Reasons)
  - 使用透明的機殼 (Using Transparent Casing)，硬體外觀透明。
  - 完全不使用 AI (Completely Not Using AI)，禁止使用 AI 技術。
  - 公開所有程式碼 (Open Sourcing All Code)，完全公開原始碼。
  correct_index: 0
  explanation: 客戶有權知道為何被拒絕，金融機構不能以「黑箱」為由拒絕解釋。
  tags:
  - chap-ai-foundation-chapter11
  - sec-financial-ai
  usage: both
- id: 11016
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: EU AI Act 對於 Deepfake 的規範是？
  type: multiple_choice
  options:
  - 不需管制 (No Regulation Required)，完全不需要監管。
  - 必須標示為生成內容（透明度義務）(Must Label as Generated Content: Transparency Obligation)
  - 完全禁止 (Completely Prohibited)，禁止所有使用。
  - 只能用於娛樂 (Can Only Be Used for Entertainment)，僅限娛樂用途。
  correct_index: 1
  explanation: Deepfake 屬於有限風險，必須明確標示以避免誤導大眾。
  tags:
  - chap-ai-foundation-chapter11
  - sec-eu-ai-act
  usage: both
- id: 11017
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: Prompt Injection 攻擊是針對 AI 的哪項指標進行測試？
  type: multiple_choice
  options:
  - 準確性 (Accuracy)，預測結果的正確程度。
  - 效率 (Efficiency)，系統的運算效率。
  - 安全性 (Safety)，系統的安全性防護能力。
  - 公平性 (Fairness)，對不同群體的公平程度。
  correct_index: 2
  explanation: Prompt Injection 試圖誘導模型輸出有害內容，測試其安全性防護是否足夠。
