  - chap-ai-foundation-chapter11
  - sec-moda-eval
  usage: both
- id: 11018
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 當責性 (Accountability) 強調的是？
  type: multiple_choice
  options:
  - AI 必須有自我意識 (AI Must Have Self-Consciousness)，AI 需要具備自我認知。
  - 使用者要負責修好 AI (Users Must Be Responsible for Fixing AI)，使用者需負責修復。
  - AI 永遠不會犯錯 (AI Never Makes Mistakes)，AI 完全不會出錯。
  - AI 犯錯時，必須有人類負責 (When AI Makes Mistakes, Humans Must Be Responsible)
  correct_index: 3
  explanation: 無論技術如何發展，法律與道德責任最終必須歸屬於人類（開發者或使用者）。
  tags:
  - chap-ai-foundation-chapter11
  - sec-accountability
  usage: both
- id: 11019
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 下列何者屬於 EU AI Act 定義的「最小風險」？
  type: multiple_choice
  options:
  - 邊境管制系統 (Border Control Systems)，屬於高風險應用。
  - 垃圾郵件過濾器 (Spam Email Filters)，對人權影響極微的應用。
  - 自駕車 (Autonomous Vehicles)，屬於高風險應用。
  - 招聘系統 (Recruitment Systems)，屬於高風險應用。
  correct_index: 1
  explanation: 垃圾郵件過濾器對人權影響極微，屬於最小風險，幾乎不需監管。
  tags:
  - chap-ai-foundation-chapter11
  - sec-eu-ai-act
  usage: both
- id: 11020
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣金融業 AI 規範的口訣「治平隱安透責」中，「透」代表？
  type: multiple_choice
  options:
  - 透露個資 (Disclosing Personal Data)，洩漏個人資料。
  - 透視 (Perspective)，視覺上的透視效果。
  - 透支 (Overdraft)，財務上的透支行為。
  - 透明度與可解釋性 (Transparency and Explainability)，決策過程的透明與可理解。
  correct_index: 3
  explanation: 透代表透明度與可解釋性，要求決策過程需對客戶透明。
  tags:
  - chap-ai-foundation-chapter11
  - sec-financial-ai
  usage: both
- id: 11021
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 抽樣偏見 (Sampling Bias) 是指？
  type: multiple_choice
  options:
  - 模型參數錯誤 (Model Parameter Errors)，參數設定不正確。
  - 隨機抽樣 (Random Sampling)，隨機選擇樣本的方法。
  - 訓練資料太少 (Insufficient Training Data)，資料量不足。
  - 訓練資料中某些族群的樣本數過少，導致模型對該族群表現不佳 (Some Groups Have Too Few Samples in Training Data, Causing Poor Model Performance on Those Groups)
  correct_index: 3
  explanation: 若訓練資料集中缺乏某特定族群（如深色人種）的數據，模型在該族群上的準確率就會偏低。
  tags:
  - chap-ai-foundation-chapter11
  - sec-bias-fairness
  usage: both
- id: 11022
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: Google Gboard 使用什麼技術來保護用戶輸入隱私？
  type: multiple_choice
  options:
  - 防火牆 (Firewall)，網路安全防護機制。
  - 區塊鏈 (Blockchain)，分散式帳本技術。
  - 聯邦學習 (Federated Learning)，在本地端訓練的隱私保護技術。
  - 生物辨識 (Biometric Identification)，使用生物特徵進行身份識別。
  correct_index: 2
  explanation: Gboard 利用聯邦學習在手機端改進預測模型，無需上傳用戶的打字內容。
  tags:
  - chap-ai-foundation-chapter11
  - sec-privacy
  usage: both
- id: 11023
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: EU AI Act 對於「潛意識操縱」的規範是？
  type: multiple_choice
  options:
  - 高風險 (High Risk)，需要嚴格監管的風險等級。
  - 禁止 (不可接受風險) (Prohibited: Unacceptable Risk)，完全禁止的應用。
  - 有限風險 (Limited Risk)，風險程度有限。
  - 最小風險 (Minimal Risk)，風險程度極低。
  correct_index: 1
  explanation: 利用 AI 操控人類潛意識被視為嚴重侵犯自主權，屬於絕對禁止的項目。
