questions:
- id: 11001
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: AI 模型產生偏見 (Bias) 的主要原因通常是？
  type: multiple_choice
  options:
  - 演算法本身的數學錯誤
  - 電腦硬體故障
  - 訓練資料反映了歷史上的社會偏見或抽樣不均
  - 程式碼寫太長
  correct_index: 2
  explanation: AI 模型是從歷史數據中學習，若數據本身包含人類社會的偏見（如性別歧視），模型就會學到並放大這些偏見。
  tags:
  - sec-chapter11
  - sec-bias-fairness
- id: 11002
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: Amazon 的 AI 招聘系統曾發生什麼倫理問題？
  type: multiple_choice
  options:
  - 歧視女性求職者（對包含女性詞彙的履歷扣分）
  - 洩漏個資
  - 錄取太多人
  - 系統當機
  correct_index: 0
  explanation: 因為過去科技業多為男性，AI 學習歷史數據後誤以為「男性」是好員工的特徵，導致歧視女性。
  tags:
  - sec-chapter11
  - sec-bias-fairness
- id: 11003
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 差分隱私 (Differential Privacy) 的核心技術是？
  type: multiple_choice
  options:
  - 資料加密
  - 使用區塊鏈
  - 刪除資料
  - 在資料中加入適量的數學雜訊 (Noise)
  correct_index: 3
  explanation: 差分隱私透過加入雜訊，使得攻擊者無法分辨特定個人的資訊，但仍能保持整體統計數據的準確性。
  tags:
  - sec-chapter11
  - sec-privacy
- id: 11004
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 聯邦學習 (Federated Learning) 的最大特色是？
  type: multiple_choice
  options:
  - 不需要模型
  - 數據不離地 (Data stays local)，只交換模型參數
  - 只能由政府使用
  - 所有資料都上傳到雲端
  correct_index: 1
  explanation: 聯邦學習讓模型在本地裝置訓練，只回傳參數更新給伺服器，原始私密資料保留在用戶端。
  tags:
  - sec-chapter11
  - sec-privacy
- id: 11005
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 在 AI 輔助決策（如醫療診斷）中，「人機協作 (Human-in-the-loop)」意味著？
  type: multiple_choice
  options:
  - 最終決策權與責任仍在人類專家身上
  - AI 全權負責
  - 人類完全不介入
  - AI 取代人類
  correct_index: 0
  explanation: 高風險決策不能全交給 AI，必須有人類專家審核 AI 的建議並做出最終決定。
  tags:
  - sec-chapter11
  - sec-accountability
- id: 11006
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣《人工智慧基本法》草案中提到的「監理沙盒 (Regulatory Sandbox)」目的是？
  type: multiple_choice
  options:
  - 允許企業在風險可控範圍內測試創新技術，暫時豁免部分法規
  - 建立兒童遊樂場
  - 禁止 AI 發展
  - 處罰違規企業
  correct_index: 0
  explanation: 監理沙盒提供一個實驗場域，讓創新技術能在法規尚未完備前先行測試，促進產業發展。
  tags:
  - sec-chapter11
  - sec-taiwan-ai-law
- id: 11007
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣金融業運用 AI 的核心原則中，關於「治理 (Governance)」的重點是？
  type: multiple_choice
  options:
  - 外包給廠商負責
  - 董事會與高層管理階層應負起監督責任
  - 由 IT 部門全權負責
  - 不需要治理
  correct_index: 1
  explanation: 金管會強調 AI 治理是董事會層級的責任，不能僅視為技術操作層面的問題。
  tags:
  - sec-chapter11
  - sec-financial-ai
- id: 11008
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 歐盟《人工智慧法案》(EU AI Act) 採取什麼樣的監管模式？
  type: multiple_choice
  options:
  - 技術導向
  - 全面禁止
  - 完全放任
  - 風險導向 (Risk-based approach)
  correct_index: 3
  explanation: EU AI Act 根據 AI 應用的風險等級（不可接受、高、有限、最小）實施不同強度的監管。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11009
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 根據 EU AI Act，「社會信用評分 (Social Scoring)」屬於哪一級風險？
  type: multiple_choice
  options:
  - 有限風險
  - 高風險
  - 最小風險
  - 不可接受風險 (Unacceptable Risk) - 禁止
  correct_index: 3
  explanation: 社會信用評分被認為嚴重侵犯人權，在歐盟是完全禁止的。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11010
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 根據 EU AI Act，招聘系統或醫療器材 AI 屬於哪一級風險？
  type: multiple_choice
  options:
  - 有限風險
  - 最小風險
  - 不可接受風險
  - 高風險 (High Risk) - 嚴格監管
  correct_index: 3
  explanation: 這些應用直接影響人們的生計與健康，被列為高風險，需通過嚴格的合規評估。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11011
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 根據 EU AI Act，聊天機器人 (Chatbot) 屬於哪一級風險，需履行什麼義務？
  type: multiple_choice
  options:
  - 有限風險 (Limited Risk)，需履行透明度義務（告知是 AI）
  - 不可接受風險，需禁止
  - 高風險，需審查
  - 最小風險，不需監管
  correct_index: 0
  explanation: 使用者有權知道自己正在與機器互動，因此必須揭露 AI 身分。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11012
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: 數位發展部 AI 產品評測中心的評測指標不包含下列何者？
  type: multiple_choice
  options:
  - 可解釋性 (Explainability)
  - 安全性 (Safety)
  - 公平性 (Fairness)
  - 資料複雜性 (Data Complexity)
  correct_index: 3
  explanation: 評測中心主要評估模型本身的性能與安全，資料品質通常被視為廠商的責任，不在直接評測範圍內。
  tags:
  - sec-chapter11
  - sec-moda-eval
- id: 11013
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 「資料去偏 (Data Debiasing)」的主要目的是？
  type: multiple_choice
  options:
  - 消除訓練資料中的不公平偏見，確保模型公平性
  - 加密資料
  - 減少資料量
  - 加快訓練速度
  correct_index: 0
  explanation: 透過調整資料分佈或演算法約束，減少模型因歷史數據而產生的歧視行為。
  tags:
  - sec-chapter11
  - sec-bias-fairness
- id: 11014
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 聯邦學習適合應用於哪個場景？
  type: multiple_choice
  options:
  - 多家醫院聯合研究，但病歷個資不能出院
  - 單機遊戲
  - 天氣預報
  - 公開數據集的訓練
  correct_index: 0
  explanation: 聯邦學習是解決跨機構資料隱私共享問題的最佳方案。
  tags:
  - sec-chapter11
  - sec-privacy
- id: 11015
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 金融業 AI 規範中的「透明度與可解釋性」要求什麼？
  type: multiple_choice
  options:
  - 當 AI 做出重大決策（如拒貸）時，必須能解釋原因
  - 使用透明的機殼
  - 完全不使用 AI
  - 公開所有程式碼
  correct_index: 0
  explanation: 客戶有權知道為何被拒絕，金融機構不能以「黑箱」為由拒絕解釋。
  tags:
  - sec-chapter11
  - sec-financial-ai
- id: 11016
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: EU AI Act 對於 Deepfake 的規範是？
  type: multiple_choice
  options:
  - 不需管制
  - 必須標示為生成內容（透明度義務）
  - 完全禁止
  - 只能用於娛樂
  correct_index: 1
  explanation: Deepfake 屬於有限風險，必須明確標示以避免誤導大眾。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11017
  chapter_title: AI 治理、法規與倫理
  section_title: AI 產品評測標準
  text: Prompt Injection 攻擊是針對 AI 的哪項指標進行測試？
  type: multiple_choice
  options:
  - 準確性
  - 效率
  - 安全性 (Safety)
  - 公平性
  correct_index: 2
  explanation: Prompt Injection 試圖誘導模型輸出有害內容，測試其安全性防護是否足夠。
  tags:
  - sec-chapter11
  - sec-moda-eval
- id: 11018
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 當責性 (Accountability) 強調的是？
  type: multiple_choice
  options:
  - AI 必須有自我意識
  - 使用者要負責修好 AI
  - AI 永遠不會犯錯
  - AI 犯錯時，必須有人類負責
  correct_index: 3
  explanation: 無論技術如何發展，法律與道德責任最終必須歸屬於人類（開發者或使用者）。
  tags:
  - sec-chapter11
  - sec-accountability
- id: 11019
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 下列何者屬於 EU AI Act 定義的「最小風險」？
  type: multiple_choice
  options:
  - 邊境管制系統
  - 垃圾郵件過濾器
  - 自駕車
  - 招聘系統
  correct_index: 1
  explanation: 垃圾郵件過濾器對人權影響極微，屬於最小風險，幾乎不需監管。
  tags:
  - sec-chapter11
  - sec-eu-ai-act
- id: 11020
  chapter_title: AI 治理、法規與倫理
  section_title: 台灣與國際法規架構
  text: 台灣金融業 AI 規範的口訣「治平隱安透責」中，「透」代表？
  type: multiple_choice
  options:
  - 透露個資
  - 透視
  - 透支
  - 透明度與可解釋性
  correct_index: 3
  explanation: 透代表透明度與可解釋性，要求決策過程需對客戶透明。
  tags:
  - sec-chapter11
  - sec-financial-ai
- id: 11021
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: 抽樣偏見 (Sampling Bias) 是指？
  type: multiple_choice
  options:
  - 模型參數錯誤
  - 隨機抽樣
  - 訓練資料太少
  - 訓練資料中某些族群的樣本數過少，導致模型對該族群表現不佳
  correct_index: 3
  explanation: 若訓練資料集中缺乏某特定族群（如深色人種）的數據，模型在該族群上的準確率就會偏低。
  tags:
  - sec-chapter11
  - sec-bias-fairness
- id: 11022
  chapter_title: AI 治理、法規與倫理
  section_title: 倫理原則與風險管理
  text: Google Gboard 使用什麼技術來保護用戶輸入隱私？
  type: multiple_choice
  options:
  - 防火牆
  - 區塊鏈
  - 聯邦學習 (Federated Learning)
  - 生物辨識
  correct_index: 2
  explanation: Gboard 利用聯邦學習在手機端改進預測模型，無需上傳用戶的打字內容。
  tags:
  - sec-chapter11
  - sec-privacy
