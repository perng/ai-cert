questions:
- id: 8001
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式 AI 概述
  text: 生成式 AI (Generative AI) 與鑑別式 AI (Discriminative AI) 最大的區別在於？
  type: multiple_choice
  options:
  - 生成式 AI 只能處理文字 (Generative AI Can Only Process Text)，僅限於文字生成。
  - 鑑別式 AI 負責分類，生成式 AI 負責創造新資料 (Discriminative AI Classifies, Generative AI Creates New Data)
  - 生成式 AI 不需要訓練 (Generative AI Does Not Require Training)，可以直接使用。
  - 鑑別式 AI 比較聰明 (Discriminative AI Is Smarter)，智能程度更高。
  correct_index: 1
  explanation: 鑑別式 AI 學習資料的邊界（分類），而生成式 AI 學習資料的分佈以創造全新的內容。
  tags:
  - chap-ai-foundation-chapter8
  - chap-ai-foundation-chapter8-summary
  usage: quiz
- id: 8002
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 變分自編碼器 (VAE) 的核心運作機制是？
  type: multiple_choice
  options:
  - 逐步加噪與去噪 (Gradually Adding and Removing Noise)，屬於擴散模型的過程。
  - 預測下一個字 (Predicting Next Token)，屬於語言模型的任務。
  - 對抗訓練 (Adversarial Training)，屬於 GAN 的訓練方式。
  - 將資料壓縮到潛在空間的機率分佈，再進行採樣與解碼 (Compressing Data to Latent Space Probability Distribution, Then Sampling and Decoding)
  correct_index: 3
  explanation: VAE 透過 Encoder 將資料編碼為常態分佈參數，再從中採樣並透過 Decoder 還原。
  tags:
  - chap-ai-foundation-chapter8
  - sec-vae
  usage: quiz
- id: 8003
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 生成對抗網路 (GAN) 由哪兩個部分組成？
  type: multiple_choice
  options:
  - Encoder 與 Decoder (Encoder and Decoder)，屬於自編碼器的架構。
  - Query 與 Key (Query and Key)，屬於注意力機制的組件。
  - Actor 與 Critic (Actor and Critic)，屬於強化學習的組件。
  - Generator (生成器) 與 Discriminator (判別器) (Generator and Discriminator)
  correct_index: 3
  explanation: GAN 由負責偽造的生成器和負責鑑識的判別器組成，兩者進行零和賽局的對抗訓練。
  tags:
  - chap-ai-foundation-chapter8
  - sec-gan
  usage: quiz
- id: 8004
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: GAN 訓練過程中常見的問題「模式崩潰 (Mode Collapse)」是指？
  type: multiple_choice
  options:
  - 生成圖片模糊 (Generated Images Are Blurry)，影像品質不佳。
  - 模型無法收斂 (Model Cannot Converge)，訓練過程不穩定。
  - 生成器只生成單一或極少數種類的樣本，失去多樣性 (Generator Only Generates Single or Very Few Types of Samples, Losing Diversity)
  - 判別器太強 (Discriminator Too Strong)，判別器過於強大導致訓練困難。
  correct_index: 2
  explanation: 當生成器發現某種特定的騙術（樣本）特別有效時，就會一直重複生成該樣本，導致輸出缺乏變化。
  tags:
  - chap-ai-foundation-chapter8
  - sec-gan
  usage: quiz
- id: 8005
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 擴散模型 (Diffusion Models) 的生成過程可以比喻為？
  type: multiple_choice
  options:
  - 從雜訊中一步步去噪還原出清晰影像 (Gradually Denoising from Noise to Restore Clear Images)
  - 壓縮再解壓縮 (Compress Then Decompress)，屬於自編碼器的過程。
  - 左右互搏 (Left-Right Mutual Combat)，屬於對抗訓練的比喻。
  - 直接拼貼圖片 (Directly Pasting Images)，簡單的影像合成方法。
  correct_index: 0
  explanation: Diffusion Model 學習逆向擴散過程，從純雜訊開始，逐步去除雜訊直到生成清晰圖像。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  usage: quiz
- id: 8006
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: Stable Diffusion 和 Midjourney 是基於哪種技術？
  type: multiple_choice
  options:
  - GAN (Generative Adversarial Network)，基於對抗訓練的生成模型。
  - VAE (Variational Autoencoder)，基於變分推論的自編碼器。
  - RNN (Recurrent Neural Network)，用於處理序列資料的架構。
  - 擴散模型 (Diffusion Models)，基於逐步去噪的生成技術。
  correct_index: 3
  explanation: 這些現代圖像生成工具都是基於擴散模型技術，能生成高品質且多樣化的圖像。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  usage: quiz
- id: 8007
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 大型語言模型 (LLM) 的預訓練任務通常是？
  type: multiple_choice
  options:
  - 分類垃圾郵件 (Classifying Spam Emails)，屬於監督式分類任務。
  - 辨識圖片 (Recognizing Images)，屬於電腦視覺任務。
  - 預測下一個字 (Next Token Prediction)，大型語言模型的預訓練任務。
  - 下圍棋 (Playing Go)，屬於強化學習任務。
  correct_index: 2
  explanation: LLM 透過閱讀海量文本，學習預測句子中的下一個字，藉此學會語言結構與知識。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: quiz
- id: 8008
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: RLHF (Reinforcement Learning from Human Feedback) 的主要目的是？
  type: multiple_choice
  options:
  - 加快訓練速度 (Accelerating Training Speed)，提升訓練效率。
  - 讓模型學會寫程式 (Teaching Model to Write Code)，提升程式生成能力。
  - '讓模型的回答符合人類價值觀（有用、誠實、無害）(Making Model Responses Align with Human Values: Helpful, Honest, Harmless)'
  - 增加模型的參數量 (Increasing Model Parameter Count)，擴大模型規模。
  correct_index: 2
  explanation: RLHF 引入人類回饋來微調模型，使其產出更符合人類偏好與道德標準的內容。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: quiz
- id: 8009
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: Scaling Laws (擴展定律) 指出，LLM 的性能與哪三個因素呈冪律關係？
  type: multiple_choice
  options:
  - 演算法複雜度、層數、節點數 (Algorithm Complexity, Layers, Node Count)，模型架構的複雜度指標。
  - 工程師人數、薪水、加班時間 (Engineer Count, Salary, Overtime Hours)，人力資源相關指標。
  - 電量、網速、硬碟大小 (Power Consumption, Network Speed, Hard Disk Size)，硬體資源指標。
  - 參數量、資料量、計算量 (Parameter Count, Data Volume, Computation Amount)
  correct_index: 3
  explanation: OpenAI 研究發現，只要增加參數量、訓練資料量和計算量，模型的 Loss 就會可預測地下降。
  tags:
  - chap-ai-foundation-chapter8
  - sec-scaling-laws
  usage: quiz
- id: 8010
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 「能力湧現 (Emergent Abilities)」是指 LLM 在什麼情況下會突然獲得新能力？
  type: multiple_choice
  options:
  - 訓練時間夠久 (Sufficient Training Time)，延長訓練週期。
  - 使用特定的程式語言 (Using Specific Programming Language)，選擇特定開發語言。
  - 工程師手動加入 (Engineers Manually Add)，人工編寫程式碼。
  - 模型規模超過某個臨界點 (Model Scale Exceeds Certain Threshold)
  correct_index: 3
  explanation: 當模型規模（參數或運算量）達到一定程度時，會突然展現出小模型所沒有的能力（如推理、寫程式）。
  tags:
  - chap-ai-foundation-chapter8
  - sec-scaling-laws
  usage: quiz
- id: 8011
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Zero-shot Prompting (零樣本提示) 是指？
  type: multiple_choice
  options:
  - 給模型很多範例 (Giving Model Many Examples)，提供大量範例進行學習。
  - 給模型 0 分 (Giving Model Zero Score)，完全不給予獎勵。
  - 直接問模型問題，不提供任何範例 (Directly Asking Model Questions Without Providing Any Examples)
  - 不給模型任何輸入 (Not Giving Model Any Input)，完全沒有輸入資料。
  correct_index: 2
  explanation: Zero-shot 測試模型在沒有看過任何範例的情況下，直接完成任務的能力。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8012
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Chain-of-Thought (CoT, 思維鏈) 提示技巧能顯著提升模型哪方面的能力？
  type: multiple_choice
  options:
  - 數學運算與邏輯推理能力 (Mathematical Computation and Logical Reasoning Abilities)
  - 連線速度 (Connection Speed)，網路傳輸速度。
  - 繪圖能力 (Drawing Ability)，圖像生成能力。
  - 語音辨識能力 (Speech Recognition Ability)，語音處理能力。
  correct_index: 0
  explanation: 透過要求模型「一步步思考」，能引導模型分解複雜問題，大幅提升推理正確率。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8013
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: 「迷失在中間 (Lost in the Middle)」現象是指 LLM 容易忽略哪裡的資訊？
  type: multiple_choice
  options:
  - 長文本中間的資訊 (Information in the Middle of Long Text)，中間部分的內容。
  - 開頭的資訊 (Information at the Beginning)，文本起始部分。
  - 結尾的資訊 (Information at the End)，文本結尾部分。
  - 所有的資訊 (All Information)，完整文本的所有內容。
  correct_index: 0
  explanation: 研究顯示 LLM 對 Context Window 開頭和結尾的資訊關注度較高，中間的資訊容易被忽略。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8014
  chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用
  text: 檢索增強生成 (RAG) 主要解決了 LLM 的什麼問題？
  type: multiple_choice
  options:
  - 幻覺 (Hallucination) 與知識時效性問題 (Hallucination and Knowledge Timeliness Issues)
  - 運算速度太慢 (Computation Speed Too Slow)，處理效率低。
  - 無法理解中文 (Cannot Understand Chinese)，語言支援不足。
  - 無法生成圖片 (Cannot Generate Images)，僅限於文字生成。
  correct_index: 0
  explanation: RAG 允許模型檢索外部知識庫，能提供有憑有據的回答，並解決模型訓練後知識無法更新的問題。
  tags:
  - chap-ai-foundation-chapter8
  - sec-rag
  usage: both
- id: 8015
  chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用
  text: RAG 技術的核心元件通常包含？
  type: multiple_choice
  options:
  - 決策樹 (Decision Tree)，用於分類與迴歸的樹狀模型。
  - GAN (Generative Adversarial Network)，用於生成對抗訓練的模型。
  - 卷積神經網路 (Convolutional Neural Network)，用於處理影像的架構。
  - 向量資料庫 (Vector Database)，用於儲存與檢索語意向量的資料庫。
  correct_index: 3
  explanation: 向量資料庫用於儲存與檢索文本的語意向量，是 RAG 系統檢索知識的關鍵。
  tags:
  - chap-ai-foundation-chapter8
  - sec-rag
  usage: both
- id: 8016
  chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用
  text: 模型量化 (Quantization) 的主要好處是？
  type: multiple_choice
  options:
  - 延長訓練時間 (Extending Training Time)，增加訓練週期。
  - 降低模型大小與記憶體需求，加速推論 (Reducing Model Size and Memory Requirements, Accelerating Inference)
  - 提高模型準確度 (Improving Model Accuracy)，提升預測正確率。
  - 增加模型參數量 (Increasing Model Parameter Count)，擴大模型規模。
  correct_index: 1
  explanation: 量化透過降低數值精度（如 FP32 轉 INT8），大幅減少模型體積，使其能在資源受限的設備上運行。
  tags:
  - chap-ai-foundation-chapter8
  - sec-model-compression
  usage: both
- id: 8017
  chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用
  text: 知識蒸餾 (Knowledge Distillation) 是指？
  type: multiple_choice
  options:
  - 刪除模型中的雜訊 (Removing Noise from Model)，清理模型中的干擾。
  - 壓縮訓練資料 (Compressing Training Data)，減少資料儲存空間。
  - 用大模型 (Teacher) 教導小模型 (Student) (Using Large Model (Teacher) to Teach Small Model (Student))
  - 用水冷系統冷卻 GPU (Using Water Cooling System to Cool GPU)，硬體散熱方法。
  correct_index: 2
  explanation: 知識蒸餾讓小模型學習大模型的輸出機率分佈（暗知識），使其在較小規模下也能達到不錯的效能。
  tags:
  - chap-ai-foundation-chapter8
  - sec-model-compression
  usage: both
- id: 8018
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: VAE 生成的圖像通常具有什麼特徵？
  type: multiple_choice
  options:
  - 完全是雜訊 (Completely Noise)，純隨機的雜訊影像。
  - 邊緣較模糊 (Edges Are Blurrier)，影像邊界不夠銳利。
  - 只有黑白色 (Only Black and White)，缺乏色彩資訊。
  - 極度清晰 (Extremely Clear)，影像品質極佳。
  correct_index: 1
  explanation: 由於 VAE 的損失函數特性，它傾向於生成平均化的結果，導致圖像邊緣較模糊。
  tags:
  - chap-ai-foundation-chapter8
  - sec-vae
  usage: both
- id: 8019
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: GAN 的訓練過程是一種？
  type: multiple_choice
  options:
  - 合作遊戲 (Cooperative Game)，參與者共同合作的遊戲。
  - 零和賽局 (Zero-Sum Game)，一方獲利等於另一方損失的對抗關係。
  - 單人遊戲 (Single-Player Game)，僅有單一參與者的遊戲。
  - 回合制遊戲 (Turn-Based Game)，輪流進行行動的遊戲。
  correct_index: 1
  explanation: 生成器和判別器的利益是衝突的（一方贏另一方就輸），屬於零和賽局。
  tags:
  - chap-ai-foundation-chapter8
  - sec-gan
  usage: both
- id: 8020
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 指令微調 (Instruction Tuning) 的目的是？
  type: multiple_choice
  options:
  - 讓模型變小 (Making Model Smaller)，減少模型參數量。
  - 讓模型學會聽懂並遵循人類的指令 (Teaching Model to Understand and Follow Human Instructions)
  - 讓模型學會畫圖 (Teaching Model to Draw)，提升圖像生成能力。
  - 讓模型學會更多知識 (Teaching Model More Knowledge)，擴充知識庫。
  correct_index: 1
  explanation: 預訓練後的模型只會接龍，指令微調透過問答對資料，教導模型如何正確回應使用者的請求。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: both
- id: 8021
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Few-shot Prompting 的做法是？
  type: multiple_choice
  options:
  - 只給關鍵字 (Only Giving Keywords)，提供簡短的關鍵詞提示。
  - 給予幾百萬個範例 (Giving Millions of Examples)，提供大量訓練資料。
  - 不給範例 (Not Giving Examples)，完全沒有範例引導。
  - 給予少量範例讓模型模仿 (Giving Few Examples for Model to Imitate)
  correct_index: 3
  explanation: Few-shot 提供 1 到多個範例 (Examples)，幫助模型理解任務格式與邏輯。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8022
  chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用
  text: 為什麼 RAG 比 Fine-tuning 更適合企業內部知識應用？
  type: multiple_choice
  options:
  - Fine-tuning 無法處理文字 (Fine-tuning Cannot Process Text)，僅限於特定資料類型。
  - Fine-tuning 會讓模型變笨 (Fine-tuning Makes Model Dumber)，降低模型能力。
  - RAG 不需要電腦 (RAG Does Not Require Computer)，無需運算設備。
  - RAG 比較便宜且資料更新即時 (RAG Is Cheaper and Data Updates Are Real-Time)
  correct_index: 3
  explanation: Fine-tuning 成本高且資料更新慢，RAG 只要更新資料庫就能讓模型知道最新資訊，且能避免災難性遺忘。
  tags:
  - chap-ai-foundation-chapter8
  - sec-rag
  usage: both
- id: 8023
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: Diffusion Model 的缺點是？
  type: multiple_choice
  options:
  - 無法生成彩色圖 (Cannot Generate Color Images)，僅能產生黑白影像。
  - '生成速度慢 (需要多步去噪) (Slow Generation Speed: Requires Multiple Denoising Steps)'
  - 生成品質差 (Poor Generation Quality)，影像品質不佳。
  - 容易模式崩潰 (Prone to Mode Collapse)，生成樣本缺乏多樣性。
  correct_index: 1
  explanation: 由於需要執行數十到數百步的逆向擴散過程，Diffusion Model 的生成速度通常比 GAN 慢。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  usage: both
- id: 8024
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 基底模型 (Base Model) 通常不具備什麼能力？
  type: multiple_choice
  options:
  - 世界知識 (World Knowledge)，關於現實世界的常識。
  - 文法能力 (Grammar Ability)，語言結構的理解。
  - 遵循指令對話的能力 (Ability to Follow Instructions in Dialogue)
  - 文字接龍能力 (Text Continuation Ability)，預測下一個字的能力。
  correct_index: 2
  explanation: Base Model 雖然博學，但尚未經過指令微調，傾向於續寫文本而非回答問題。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: both
- id: 8025
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Tree of Thoughts (ToT) 提示法類似於？
  type: multiple_choice
  options:
