- chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 情境：GAN 訓練中常見的「模式崩潰 (Mode Collapse)」是指？
  type: multiple_choice
  options:
  - 模型訓練失敗 (Model Training Failed)，訓練過程無法完成。
  - 生成器只產生單一或極少數種類的樣本，缺乏多樣性 (Generator Only Produces Single or Very Few Types of Samples, Lacking Diversity)
  - 判別器太弱 (Discriminator Too Weak)，判別能力不足。
  - 生成器太弱 (Generator Too Weak)，生成能力不足。
  correct_index: 1
  explanation: 生成器發現某種特定輸出能輕易騙過判別器，於是開始只產出該種輸出，導致多樣性喪失。
