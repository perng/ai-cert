  text: 情境：VAE (變分自編碼器) 生成的圖片通常有什麼特徵？
  type: multiple_choice
  options:
  - 極度清晰
  - 邊緣較模糊
  - 完全雜訊
  - 黑白
  correct_index: 1
  explanation: VAE 的損失函數包含 MSE，傾向於生成平均化的結果，導致細節較模糊。
  tags:
  - chap-ai-foundation-chapter8
  - sec-vae
  id: 11460
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：Zero-shot Prompting 是指？
  type: multiple_choice
  options:
  - 給模型 0 分
  - 不給任何範例，直接問模型問題
  - 給模型很多範例
  - 模型無法回答
  correct_index: 1
  explanation: Zero-shot 測試模型在沒有看過任何範例的情況下，直接處理新任務的能力。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  id: 11461
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用架構
  text: 情境：知識蒸餾 (Knowledge Distillation) 的目的是？
  type: multiple_choice
  options:
  - 讓大模型學得更好
  - 讓小模型模仿大模型的行為，以獲得接近大模型的效能
  - 增加資料量
  - 減少訓練時間
  correct_index: 1
  explanation: 透過 Teacher-Student 架構，將大模型的知識（包含 Soft Targets）轉移給小模型。
  tags:
  - chap-ai-foundation-chapter8
  - sec-model-compression
  id: 11462
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：預訓練 (Pre-training) 階段，LLM 主要進行什麼任務？
  type: multiple_choice
  options:
  - 分類任務
  - 下一個詞預測 (Next Token Prediction)
  - 翻譯任務
  - 問答任務
  correct_index: 1
  explanation: 透過海量文本進行自我監督學習，預測下一個字，讓模型學會語言結構與知識。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  id: 11463
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 情境：鑑別式 AI 與生成式 AI 的主要區別在於？
  type: multiple_choice
  options:
  - 鑑別式 AI 創造新資料，生成式 AI 進行分類
  - 鑑別式 AI 學習邊界 (判斷)，生成式 AI 學習分佈 (創造)
  - 兩者一樣
  - 生成式 AI 比較便宜
  correct_index: 1
  explanation: 鑑別式 AI 專注於區分不同類別（決策邊界），生成式 AI 專注於學習資料分佈以產生新樣本。
  tags:
  - chap-ai-foundation-chapter8
  - sec-generative-models
  id: 11464
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用架構
  text: 情境：RAG 系統中，向量資料庫的作用是？
  type: multiple_choice
  options:
  - 儲存模型權重
  - 儲存知識庫的語意向量，供快速檢索
  - 儲存使用者密碼
  - 生成圖片
  correct_index: 1
  explanation: 向量資料庫儲存文本 Embedding，允許透過語意相似度快速找出相關文件。
  tags:
  - chap-ai-foundation-chapter8
  - sec-rag
  id: 11465
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：Few-shot Prompting 的做法是？
  type: multiple_choice
  options:
  - 不給範例
  - 給予少量範例 (Example) 讓模型模仿
  - 給予錯誤範例
  - 重新訓練模型
  correct_index: 1
  explanation: 提供幾個 Input-Output 範例，幫助模型理解任務格式與邏輯。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  id: 11466
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 情境：Stable Diffusion 屬於哪一類生成模型？
  type: multiple_choice
  options:
  - GAN
  - VAE
  - 擴散模型 (Diffusion Model)
  - Transformer
  correct_index: 2
  explanation: Stable Diffusion 是目前最流行的擴散模型應用之一。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  id: 11467
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：RLHF 中的 Reward Model 是由誰訓練的？
  type: multiple_choice
  options:
  - 模型自己
  - 人類標註者對模型回答的排序/評分
  - 隨機生成
  - 規則引擎
  correct_index: 1
  explanation: 人類對模型的回答進行優劣排序，訓練出 Reward Model，再用它來指導 LLM。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  id: 11468
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 優化與應用架構
  text: 情境：LLM 的「幻覺 (Hallucination)」是指？
  type: multiple_choice
  options:
  - 模型當機
  - 模型生成看似合理但完全錯誤的內容
  - 模型拒絕回答
  - 模型回答太慢
  correct_index: 1
  explanation: 模型基於機率生成文字，有時會編造出不存在的事實，稱為幻覺。
  tags:
  - chap-ai-foundation-chapter8
  - sec-rag
  id: 11469
  usage: both
- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：Lost in the Middle 現象是指 LLM 容易忽略哪裡的資訊？
  type: multiple_choice
  options:
  - 開頭
  - 結尾
  - 長文本中間的部分
  - 所有部分
  correct_index: 2
  explanation: 研究顯示 LLM 對 Context Window 頭尾的資訊關注度較高，中間容易被忽略。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  id: 11470
  usage: both
