- chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 情境：鑑別式 AI 與生成式 AI 的主要區別在於？
  type: multiple_choice
  options:
  - 鑑別式 AI 創造新資料，生成式 AI 進行分類 (Discriminative AI Creates New Data, Generative AI Classifies)，功能定義相反。
  - 鑑別式 AI 學習邊界 (判斷)，生成式 AI 學習分佈 (創造) (Discriminative AI Learns Boundaries (Judgment), Generative AI Learns Distributions (Creation))
  - 兩者一樣 (Both Are the Same)，功能完全相同。
  - 生成式 AI 比較便宜 (Generative AI Is Cheaper)，成本較低。
  correct_index: 1
  explanation: 鑑別式 AI 專注於區分不同類別（決策邊界），生成式 AI 專注於學習資料分佈以產生新樣本。
