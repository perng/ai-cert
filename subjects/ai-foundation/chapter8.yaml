- id: 11422
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式 AI 原理
  text: 關於變分自編碼器（Variational Autoencoder, VAE）的運作流程，下 列何者敘述最為正確？ (114年第四梯次)
  type: multiple_choice
  options:
  - 解碼器的任務是將低維壓縮向量分類為不同類別 (Decoder's Task Is to Classify Low-Dimensional Compressed Vectors into Different Categories)，屬於分類任務。
  - 編碼器將輸入資料轉換為可視化圖像以利模型學習 (Encoder Converts Input Data to Visualizable Images for Model Learning)，用於視覺化。
  - 編碼器將資料轉換為潛在空間表示，解碼器再重建資料 (Encoder Converts Data to Latent Space Representation, Decoder Reconstructs Data)
  - 編碼器利用最大邊際機率對資料進行異常點偵測 (Encoder Uses Maximum Marginal Probability for Anomaly Detection)，屬於異常偵測。
  correct_index: 2
  explanation: 此題涉及 生成式 AI 原理 的核心概念。正確答案為「編碼器將資料轉換為潛在空間表示，解碼器再重建資料」。
