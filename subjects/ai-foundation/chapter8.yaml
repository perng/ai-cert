- chapter_title: 生成式 AI 與大型語言模型
  section_title: LLM 技術
  text: 情境：Scaling Laws 指出，要提升 LLM 的效能，應該？
  type: multiple_choice
  options:
  - 減少參數量 (Reducing Parameter Count)，縮小模型規模。
  - 同時增加參數量、資料量與計算量 (Simultaneously Increasing Parameter Count, Data Volume, and Computation Amount)
  - 只增加層數 (Only Increasing Layers)，僅擴充網路深度。
  - 使用更小的模型 (Using Smaller Models)，採用較小規模的模型。
  correct_index: 1
  explanation: Scaling Laws 表明模型效能與參數、資料、算力呈冪律關係，規模越大效能越好。
