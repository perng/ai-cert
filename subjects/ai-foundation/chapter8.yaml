  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Few-shot Prompting 的做法是？
  type: multiple_choice
  options:
  - 只給關鍵字
  - 給予幾百萬個範例
  - 不給範例
  - 給予少量範例讓模型模仿
  correct_index: 3
