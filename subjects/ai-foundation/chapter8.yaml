questions:
- id: 8001
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式 AI 概述
  text: 生成式 AI (Generative AI) 與鑑別式 AI (Discriminative AI) 最大的區別在於？
  type: multiple_choice
  options:
  - 生成式 AI 只能處理文字
  - 鑑別式 AI 負責分類，生成式 AI 負責創造新資料
  - 生成式 AI 不需要訓練
  - 鑑別式 AI 比較聰明
  correct_index: 1
  explanation: 鑑別式 AI 學習資料的邊界（分類），而生成式 AI 學習資料的分佈以創造全新的內容。
  tags:
  - chap-ai-foundation-chapter8
  - chap-ai-foundation-chapter8-summary
  usage: quiz
- id: 8002
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 變分自編碼器 (VAE) 的核心運作機制是？
  type: multiple_choice
  options:
  - 逐步加噪與去噪
  - 預測下一個字
  - 對抗訓練
  - 將資料壓縮到潛在空間的機率分佈，再進行採樣與解碼
  correct_index: 3
  explanation: VAE 透過 Encoder 將資料編碼為常態分佈參數，再從中採樣並透過 Decoder 還原。
  tags:
  - chap-ai-foundation-chapter8
  - sec-vae
  usage: quiz
- id: 8003
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 生成對抗網路 (GAN) 由哪兩個部分組成？
  type: multiple_choice
  options:
  - Encoder 與 Decoder
  - Query 與 Key
  - Actor 與 Critic
  - Generator (生成器) 與 Discriminator (判別器)
  correct_index: 3
  explanation: GAN 由負責偽造的生成器和負責鑑識的判別器組成，兩者進行零和賽局的對抗訓練。
  tags:
  - chap-ai-foundation-chapter8
  - sec-gan
  usage: quiz
- id: 8004
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: GAN 訓練過程中常見的問題「模式崩潰 (Mode Collapse)」是指？
  type: multiple_choice
  options:
  - 生成圖片模糊
  - 模型無法收斂
  - 生成器只生成單一或極少數種類的樣本，失去多樣性
  - 判別器太強
  correct_index: 2
  explanation: 當生成器發現某種特定的騙術（樣本）特別有效時，就會一直重複生成該樣本，導致輸出缺乏變化。
  tags:
  - chap-ai-foundation-chapter8
  - sec-gan
  usage: quiz
- id: 8005
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: 擴散模型 (Diffusion Models) 的生成過程可以比喻為？
  type: multiple_choice
  options:
  - 從雜訊中一步步去噪還原出清晰影像
  - 壓縮再解壓縮
  - 左右互搏
  - 直接拼貼圖片
  correct_index: 0
  explanation: Diffusion Model 學習逆向擴散過程，從純雜訊開始，逐步去除雜訊直到生成清晰圖像。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  usage: quiz
- id: 8006
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 生成式模型原理
  text: Stable Diffusion 和 Midjourney 是基於哪種技術？
  type: multiple_choice
  options:
  - GAN
  - VAE
  - RNN
  - 擴散模型 (Diffusion Models)
  correct_index: 3
  explanation: 這些現代圖像生成工具都是基於擴散模型技術，能生成高品質且多樣化的圖像。
  tags:
  - chap-ai-foundation-chapter8
  - sec-diffusion
  usage: quiz
- id: 8007
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 大型語言模型 (LLM) 的預訓練任務通常是？
  type: multiple_choice
  options:
  - 分類垃圾郵件
  - 辨識圖片
  - 預測下一個字 (Next Token Prediction)
  - 下圍棋
  correct_index: 2
  explanation: LLM 透過閱讀海量文本，學習預測句子中的下一個字，藉此學會語言結構與知識。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: quiz
- id: 8008
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: RLHF (Reinforcement Learning from Human Feedback) 的主要目的是？
  type: multiple_choice
  options:
  - 加快訓練速度
  - 讓模型學會寫程式
  - 讓模型的回答符合人類價值觀（有用、誠實、無害）
  - 增加模型的參數量
  correct_index: 2
  explanation: RLHF 引入人類回饋來微調模型，使其產出更符合人類偏好與道德標準的內容。
  tags:
  - chap-ai-foundation-chapter8
  - sec-pretrain-finetune
  usage: quiz
- id: 8009
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: Scaling Laws (擴展定律) 指出，LLM 的性能與哪三個因素呈冪律關係？
  type: multiple_choice
  options:
  - 演算法複雜度、層數、節點數
  - 工程師人數、薪水、加班時間
  - 電量、網速、硬碟大小
  - 參數量、資料量、計算量
  correct_index: 3
  explanation: OpenAI 研究發現，只要增加參數量、訓練資料量和計算量，模型的 Loss 就會可預測地下降。
  tags:
  - chap-ai-foundation-chapter8
  - sec-scaling-laws
  usage: quiz
- id: 8010
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 大型語言模型技術
  text: 「能力湧現 (Emergent Abilities)」是指 LLM 在什麼情況下會突然獲得新能力？
  type: multiple_choice
  options:
  - 訓練時間夠久
  - 使用特定的程式語言
  - 工程師手動加入
  - 模型規模超過某個臨界點
  correct_index: 3
  explanation: 當模型規模（參數或運算量）達到一定程度時，會突然展現出小模型所沒有的能力（如推理、寫程式）。
  tags:
  - chap-ai-foundation-chapter8
  - sec-scaling-laws
  usage: quiz
- id: 8011
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Zero-shot Prompting (零樣本提示) 是指？
  type: multiple_choice
  options:
  - 給模型很多範例
  - 給模型 0 分
  - 直接問模型問題，不提供任何範例
  - 不給模型任何輸入
  correct_index: 2
  explanation: Zero-shot 測試模型在沒有看過任何範例的情況下，直接完成任務的能力。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8012
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: Chain-of-Thought (CoT, 思維鏈) 提示技巧能顯著提升模型哪方面的能力？
  type: multiple_choice
  options:
  - 數學運算與邏輯推理能力
  - 連線速度
  - 繪圖能力
  - 語音辨識能力
  correct_index: 0
  explanation: 透過要求模型「一步步思考」，能引導模型分解複雜問題，大幅提升推理正確率。
  tags:
  - chap-ai-foundation-chapter8
  - sec-prompt-engineering
  usage: both
- id: 8013
  chapter_title: 生成式 AI 與大型語言模型
  section_title: 提示工程
  text: 「迷失在中間 (Lost in the Middle)」現象是指 LLM 容易忽略哪裡的資訊？
  type: multiple_choice
  options:
  - 長文本中間的資訊
  - 開頭的資訊
  - 結尾的資訊
  - 所有的資訊
  correct_index: 0
  explanation: 研究顯示 LLM 對 Context Window 開頭和結尾的資訊關注度較高，中間的資訊容易被忽略。
