  - sec-ai-chapter10
  - sec-explanation-tools
- id: 11431
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 在金融科技公司的信貸決策系統中，導入反事實解釋 （Counterfactual Explanation）時，實際部署往往伴隨技術與監管挑戰。下列哪一項最 符合該情境下的核心挑戰？ (114年第四梯次)
  type: multiple_choice
  options:
  - 需要建立完整的客戶行為預測模型來估算建議改變的實施成本，並 整合到現有的風險管理系統架構中
  - 必須使用聯邦學習技術保護客戶隱私，同時在分散式環境中計算跨 機構的反事實解釋結果
  - 需要建構時間序列因果圖來處理客戶信用狀況的動態變化，並預測 未來可能的信用評分軌跡
  - 生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同 時確保建議的改變在現實中具有可操作性且符合公平放貸法規
  correct_index: 3
  explanation: 此題涉及 解釋技術與工具 的核心概念。正確答案為「生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同 時確保建議的改變在現實中具有可操作性且符合公平放貸法規」。 
  tags:
  - past-exam
  - 114-4
  - sec-ai-chapter10
  - sec-explanation-tools
