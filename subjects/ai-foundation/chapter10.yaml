  - 可操作性 (Actionability)，建議的改變必須是使用者能夠執行的。
  - 稀疏性 (Sparsity)，建議改變的特徵數量應盡量少。
  - 一致性 (Consistency)，解釋結果應保持一致。
  correct_index: 1
  explanation: 性別通常被視為不可變特徵（在貸款審核情境下），建議改變它不具備可操作性。
