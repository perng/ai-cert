- id: 10032
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP 值滿足的「可加性 (Additivity)」是指？
  type: multiple_choice
  options:
  - 所有特徵的 SHAP 值相加等於 0 (Sum of All Features' SHAP Values Equals Zero)，總和為零。
  - 所有特徵的 SHAP 值相加等於預測值與基準值的差 (Sum of All Features' SHAP Values Equals Difference Between Prediction and Baseline Value)
  - 所有特徵的 SHAP 值相加等於 1 (Sum of All Features' SHAP Values Equals One)，總和為一。
  - 所有特徵的 SHAP 值相加等於無限大 (Sum of All Features' SHAP Values Equals Infinity)，總和為無限。
  correct_index: 1
  explanation: 這是 SHAP 的核心性質：預測值 = 基準值 + sum(各特徵 SHAP 值)。
