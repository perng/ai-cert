- id: 10025
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 決策樹雖然是白箱，但在什麼情況下可解釋性會下降？
  type: multiple_choice
  options:
  - 只有兩個特徵的時候 (When There Are Only Two Features)，特徵數量極少。
  - 資料量很少的時候 (When Data Volume Is Very Small)，訓練資料不足。
  - 樹很淺的時候 (When Tree Is Very Shallow)，決策樹層數很少。
