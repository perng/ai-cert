  text: LIME (Local Interpretable Model-agnostic Explanations) 的主要特點是？
  type: multiple_choice
  options:
  - "它能解釋整個模型的運作邏輯 (Global Explanation) (It Can Explain Overall Model Operation Logic: Global Explanation)"
  - "它透過擾動單一樣本的特徵，觀察預測變化，來解釋「為什麼模型對這個特定樣本做出這種判斷」 (Local Explanation) (It Perturbs Single Sample's Features, Observes Prediction Changes to Explain Why Model Made This Judgment for This Specific Sample: Local Explanation)"
  - 它只能用於線性模型 (It Can Only Be Used for Linear Models)，僅限於特定模型類型。
  - 它需要重新訓練模型 (It Requires Retraining Model)，必須重新訓練。
