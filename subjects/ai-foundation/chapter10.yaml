- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：反事實解釋是「展望未來」的，這句話的意思是？
  type: multiple_choice
  options:
  - 它預測未來股價
  - 它提供具體的行動建議，告訴使用者如何改變現狀以獲得期望的結果
  - 它分析歷史數據
  - 它使用時間序列模型
  correct_index: 1
  explanation: 不同於歸因分析（找過去的原因），反事實解釋聚焦於改變條件以達成未來目標。
