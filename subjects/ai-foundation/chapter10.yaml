- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：LIME 在解釋圖像分類模型時，通常會怎麼做？
  type: multiple_choice
  options:
  - 將圖片轉為文字
  - 將圖片分割成多個超像素 (Superpixels)，並隨機遮蔽部分區域來觀察預測變化
  - 直接讀取神經網路權重
  - 只看像素顏色
  correct_index: 1
  explanation: LIME 透過遮蔽圖片的不同區域（擾動），觀察模型信心分數的變化，找出對分類最關鍵的區域。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  id: 11446
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：反事實解釋的「有效性 (Validity)」是指？
  type: multiple_choice
  options:
  - 建議的改變必須真的能讓預測結果翻盤
  - 建議必須很便宜
  - 建議必須很快
  - 建議必須是假的
  correct_index: 0
  explanation: 如果使用者照著建議做了（如還清債務），結果卻沒變（還是被拒絕），那這個解釋就是無效的。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  id: 11447
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 情境：線性迴歸模型的可解釋性來自於？
  type: multiple_choice
  options:
  - 它的準確率很高
  - 它的係數 (Weights) 直接反映了特徵對結果的影響方向與大小
  - 它使用神經網路
  - 它沒有參數
  correct_index: 1
  explanation: 線性方程式 y = wx + b 中，w 的正負與大小直接對應特徵的影響力，直觀易懂。
