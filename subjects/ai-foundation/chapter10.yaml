- id: 10040
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 如果一個模型完全不可解釋，我們稱之為？
  type: multiple_choice
  options:
  - 黑箱 (Black Box)
  - 透明箱
  - 灰箱
  - 白箱
  correct_index: 0
  explanation: 黑箱模型是指輸入與輸出之間的運作機制對人類來說是不透明的。
