  section_title: XAI 的層次
  text: 情境：為什麼深度學習模型通常被稱為黑箱？
  type: multiple_choice
  options:
  - 因為它是黑色的
  - 因為它有數百萬個參數與非線性轉換，人類難以理解其內部邏輯
  - 因為它不準確
  - 因為它只能在晚上運作
  correct_index: 1
