- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：SHAP 的一致性 (Consistency) 特性是指？
  type: multiple_choice
  options:
  - 每次計算結果都不同
  - 如果一個模型更依賴某特徵，該特徵的 SHAP 值不會無故減少
  - 只能用於分類
  - 計算速度很快
  correct_index: 1
  explanation: SHAP 保證了特徵貢獻分配的公平性與邏輯一致性，是其數學理論紮實的體現。
