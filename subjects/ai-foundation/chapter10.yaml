questions:
- id: 10001
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 在 AI 領域中，「黑箱 (Black Box)」通常指的是什麼？
  type: multiple_choice
  options:
  - 模型沒有輸出 (Model Has No Output)，模型無法產生預測結果。
  - 模型結構複雜，人類無法直觀理解其決策過程 (Model Structure Complex, Humans Cannot Intuitively Understand Decision Process)
  - 模型的顏色是黑色的 (Model Color Is Black)，模型外觀為黑色。
  - 模型只能在晚上運作 (Model Can Only Operate at Night)，僅限於特定時段使用。
  correct_index: 1
  explanation: 黑箱模型（如深度神經網路）內部運作複雜，雖然能給出準確結果，但難以解釋其推論邏輯。
  tags:
  - chap-ai-foundation-chapter10
  - sec-black-white-box
  usage: quiz
- id: 10002
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 下列哪種模型通常被視為「白箱 (White Box)」模型？
  type: multiple_choice
  options:
  - 深度卷積神經網路 (CNN) (Deep Convolutional Neural Network)，複雜的黑箱模型。
  - 隨機森林 (Random Forest)，由多棵決策樹組成的黑箱集成模型。
  - 決策樹 (Decision Tree)，決策過程完全透明的白箱模型。
  - 大型語言模型 (LLM) (Large Language Model)，複雜的黑箱深度學習模型。
  correct_index: 2
  explanation: 決策樹的規則（如 If A > 5 Then B）清晰易懂，人類可以直接理解其決策路徑。
  tags:
  - chap-ai-foundation-chapter10
  - sec-black-white-box
  usage: quiz
- id: 10003
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 「全局解釋 (Global Explanation)」旨在回答什麼問題？
  type: multiple_choice
  options:
  - 模型的訓練時間多長？(How Long Is Model Training Time?)，詢問訓練週期。
  - 為什麼這一筆貸款被拒絕？(Why Was This Loan Rejected?)，屬於局部解釋的問題。
  - 模型的準確率是多少？(What Is Model Accuracy?)，詢問模型效能。
  - 模型整體而言最看重哪些特徵？(Which Features Does Model Value Most Overall?)
  correct_index: 3
  explanation: 全局解釋關注模型整體的行為模式，例如哪些特徵對預測結果普遍具有最大的影響力。
  tags:
  - chap-ai-foundation-chapter10
  - sec-global-local
  usage: quiz
- id: 10004
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 「局部解釋 (Local Explanation)」旨在回答什麼問題？
  type: multiple_choice
  options:
  - 模型的架構是什麼？(What Is Model Architecture?)，詢問模型結構。
  - 模型整體的運作邏輯 (Model's Overall Operation Logic)，屬於全局解釋的問題。
  - 資料集的分布情況 (Dataset Distribution)，資料的統計特性。
  - 為什麼針對這一個特定案例做出這樣的預測？(Why Did Model Make This Prediction for This Specific Case?)
  correct_index: 3
  explanation: 局部解釋聚焦於單一預測實例，解釋為何模型對該特定輸入給出該輸出。
  tags:
  - chap-ai-foundation-chapter10
  - sec-global-local
  usage: quiz
- id: 10005
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: LIME (Local Interpretable Model-agnostic Explanations) 的核心思想是？
  type: multiple_choice
  options:
  - 在局部範圍內，用簡單的線性模型來模擬複雜的黑箱模型 (In Local Range, Using Simple Linear Model to Simulate Complex Black Box Model)
  - 計算所有特徵的平均值 (Calculating Average of All Features)，統計特徵的平均數。
  - 將模型轉換為決策樹 (Converting Model to Decision Tree)，改變模型架構。
  - 重新訓練一個白箱模型 (Retraining a White Box Model)，完全重新訓練。
  correct_index: 0
  explanation: LIME 假設即使模型整體是非線性的，但在局部小範圍內通常是線性的，因此可以用簡單模型來近似解釋。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  usage: quiz
- id: 10006
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: LIME 的 Model-agnostic 特性意味著什麼？
  type: multiple_choice
  options:
  - 它不需要模型 (It Does Not Require Model)，可以在無模型情況下使用。
  - 它只能解釋神經網路 (It Can Only Explain Neural Networks)，僅限於特定模型類型。
  - 它只能解釋線性模型 (It Can Only Explain Linear Models)，僅限於線性架構。
  - "它適用於任何類型的模型（與模型無關）(It Applies to Any Type of Model: Model-Agnostic)"
  correct_index: 3
  explanation: Model-agnostic 代表該技術不依賴特定模型的內部結構，可以應用於 SVM、隨機森林、神經網路等任何模型。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  usage: quiz
- id: 10007
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP (Shapley Values) 源自於哪個領域的理論？
  type: multiple_choice
  options:
  - 生物學 (Biology)，研究生物系統的科學。
  - 賽局理論 (Game Theory)，研究策略互動的數學理論。
  - 心理學 (Psychology)，研究人類行為與心理的科學。
  - 物理學 (Physics)，研究物質與能量的科學。
  correct_index: 1
  explanation: SHAP 基於合作賽局理論中的 Shapley Value，計算每個特徵（玩家）對最終預測（總收益）的邊際貢獻。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  usage: quiz
- id: 10008
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP 值的主要優點是？
  type: multiple_choice
  options:
  - 只能做全局解釋 (Can Only Do Global Explanations)，僅能解釋模型整體行為。
  - 計算速度最快 (Fastest Computation Speed)，處理效率最高。
  - 提供數學上一致且公平的解釋 (Providing Mathematically Consistent and Fair Explanations)
  - 不需要任何計算 (No Computation Required)，可以直接使用。
  correct_index: 2
  explanation: SHAP 提供了理論上唯一滿足公平性與一致性公理的解釋方法，能精確量化特徵貢獻。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  usage: quiz
- id: 10009
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 反事實解釋 (Counterfactual Explanation) 的形式通常是？
  type: multiple_choice
  options:
  - 這是一個貓的圖片 (This Is a Cat Image)，描述性的說明。
  - 特徵 A 的重要性是 0.5 (Feature A's Importance Is 0.5)，特徵重要性的數值。
  - 如果特徵 X 改變成 Y，預測結果就會變成 Z (If Feature X Changes to Y, Prediction Result Will Become Z)
  - 模型的準確率是 90% (Model Accuracy Is 90%)，模型效能的指標。
  correct_index: 2
  explanation: 反事實解釋提供「如果...就會...」的假設性情境，告訴使用者如何改變輸入以獲得想要的結果。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  usage: quiz
- id: 10010
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 反事實解釋的三大原則不包括下列何者？
  type: multiple_choice
  options:
  - 稀疏性 (Sparsity)，建議改變的特徵數量應盡量少。
  - 有效性 (Validity)，建議的改變必須能真正改變預測結果。
  - 複雜性 (Complexity)，建議的複雜程度。
  - 可操作性 (Actionability)，建議的改變必須是使用者能夠執行的。
  correct_index: 2
  explanation: 好的反事實解釋應該簡單易懂（稀疏性），而不是複雜；且建議必須是使用者能做到的（可操作性）。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  usage: quiz
- id: 10011
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 「如果你年輕 10 歲，貸款就會通過」這是一個好的反事實解釋嗎？
  type: multiple_choice
  options:
  - "否，因為它違反了「可操作性」原則（使用者無法改變年齡）(No, Because It Violates Actionability Principle: Users Cannot Change Age)"
  - 否，因為它不夠精確 (No, Because It Is Not Precise Enough)，建議不夠準確。
  - 是，因為它很誠實 (Yes, Because It Is Honest)，建議真實可靠。
  - 是，因為它很簡單 (Yes, Because It Is Simple)，建議容易理解。
  correct_index: 0
  explanation: 建議使用者改變無法改變的特徵（如年齡、出生地）是沒有建設性的，違反了可操作性原則。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  usage: both
- id: 10012
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 特徵重要度 (Feature Importance) 通常無法做到什麼？
  type: multiple_choice
  options:
  - 解釋單一筆預測的具體原因 (Explaining Specific Reasons for Single Prediction)，屬於局部解釋的功能。
  - 找出無關特徵 (Finding Irrelevant Features)，識別不重要特徵。
  - 比較特徵權重 (Comparing Feature Weights)，評估特徵相對重要性。
  - 排序特徵的影響力 (Ranking Feature Influence)，屬於全局解釋的功能。
  correct_index: 0
  explanation: 傳統的特徵重要度（如隨機森林的 Gini Importance）是全局指標，無法解釋為何「某個特定案例」被判斷為正或負。
  tags:
  - chap-ai-foundation-chapter10
  - sec-feature-importance
  usage: both
- id: 10013
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 線性迴歸模型的可解釋性來自於？
  type: multiple_choice
  options:
  - 它使用深度學習 (It Uses Deep Learning)，採用複雜的神經網路架構。
  - 它沒有參數 (It Has No Parameters)，模型無需參數。
  - 它的預測很準 (Its Predictions Are Accurate)，預測正確率極高。
  - 它的係數 (Weights) 直接反映了特徵與結果的正負相關及強度 (Its Coefficients Directly Reflect Positive/Negative Correlation and Strength Between Features and Results)
  correct_index: 3
  explanation: 線性迴歸的方程式 y = wx + b 中，w 的大小和正負號直接告訴我們 x 對 y 的影響，非常直觀。
  tags:
  - chap-ai-foundation-chapter10
  - sec-black-white-box
  usage: both
- id: 10014
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 為什麼深度學習模型被稱為黑箱？
  type: multiple_choice
  options:
  - 因為它們不公開原始碼 (Because They Do Not Open Source Code)，程式碼不公開。
  - 因為它們包含數百萬個參數與非線性轉換，難以追蹤單一特徵的影響路徑 (Because They Contain Millions of Parameters and Non-Linear Transformations, Difficult to Track Single Feature's Impact Path)
  - 因為它們通常在暗房訓練 (Because They Are Usually Trained in Dark Rooms)，訓練環境特殊。
  - 因為它們只能處理黑白圖片 (Because They Can Only Process Black and White Images)，僅限於特定資料類型。
  correct_index: 1
  explanation: 深度神經網路的複雜結構使得輸入與輸出之間的映射關係變得極度抽象且難以解析。
  tags:
  - chap-ai-foundation-chapter10
  - sec-black-white-box
  usage: both
- id: 10015
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: LIME 透過什麼方式來生成解釋？
  type: multiple_choice
  options:
  - 重寫模型架構 (Rewriting Model Architecture)，重新設計模型結構。
  - 對輸入資料進行擾動 (Perturbation)，觀察輸出變化 (Perturbing Input Data, Observing Output Changes)
  - 計算梯度的平均值 (Calculating Average of Gradients)，統計梯度的平均數。
  - 解析神經網路的權重 (Parsing Neural Network Weights)，直接分析模型參數。
  correct_index: 1
  explanation: LIME 透過在原始資料點附近隨機撒點（擾動），探測模型在該區域的行為邊界。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  usage: both
- id: 10016
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP Summary Plot 可以展示什麼資訊？
  type: multiple_choice
  options:
  - 模型的損失函數 (Model's Loss Function)，用於優化的目標函數。
  - 只有特徵重要性排序 (Only Feature Importance Ranking)，僅提供排序資訊。
  - 模型的訓練過程 (Model's Training Process)，訓練的歷史記錄。
  - 特徵重要性排序以及特徵值高低對預測結果的正負影響 (Feature Importance Ranking and Positive/Negative Impact of Feature Values on Prediction Results)
  correct_index: 3
  explanation: SHAP Summary Plot 結合了特徵重要性與特徵效應，能顯示出「數值高的特徵 A 會導致預測值增加還是減少」。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  usage: both
- id: 10017
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 如果客戶問：「我該怎麼做才能讓貸款通過？」，最適合用哪種技術回答？
  type: multiple_choice
  options:
  - LIME (Local Interpretable Model-agnostic Explanations)，局部可解釋的模型無關解釋方法。
  - 反事實解釋 (Counterfactual Explanation)，提供「如果...就會...」的假設性情境。
  - 混淆矩陣 (Confusion Matrix)，用於評估分類模型效能的矩陣。
  - SHAP (Shapley Additive Explanations)，基於賽局理論的解釋方法。
  correct_index: 1
  explanation: 這是一個尋求「行動建議」的問題，反事實解釋能直接提供達成目標所需的改變條件。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  usage: both
- id: 10018
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 可解釋性 (Explainability) 與模型效能 (Performance) 之間通常存在什麼關係？
  type: multiple_choice
  options:
  - 權衡關係 (Trade-off)，提升一個會降低另一個。
  - 無關 (Unrelated)，兩者之間沒有關係。
  - 完全相同 (Completely Identical)，兩者數值相同。
  - 正相關 (Positive Correlation)，兩者同時增加或減少。
  correct_index: 0
  explanation: 通常模型越複雜（如深度學習），效能越好但可解釋性越差；模型越簡單（如線性迴歸），可解釋性越好但效能可能受限。
  tags:
  - chap-ai-foundation-chapter10
  - chap-ai-foundation-chapter10-summary
  usage: both
- id: 10019
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 反事實解釋中的「稀疏性 (Sparsity)」原則建議？
  type: multiple_choice
  options:
  - 建議改變所有特徵 (Suggesting Changes to All Features)，修改所有輸入變數。
  - 建議改變的特徵數量越多越好 (More Features to Change Is Better)，改變越多特徵越好。
  - 建議改變的特徵數量越少越好 (Fewer Features to Change Is Better)，符合稀疏性原則。
  - 不建議任何改變 (Not Suggesting Any Changes)，完全不提供建議。
  correct_index: 2
  explanation: 為了讓使用者容易執行，建議的改變應該集中在少數幾個關鍵特徵上，而不是要求使用者改頭換面。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  usage: both
- id: 10020
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP 值為正數代表該特徵？
  type: multiple_choice
  options:
  - "對預測結果有正向影響（推高分數）(Positive Impact on Prediction Results: Raising Score)"
  - 對預測結果無影響 (No Impact on Prediction Results)，特徵不影響預測。
  - 特徵值是正數 (Feature Value Is Positive)，數值為正。
  - "對預測結果有負向影響（拉低分數）(Negative Impact on Prediction Results: Lowering Score)"
  correct_index: 0
  explanation: SHAP 值代表相對於基準值，該特徵將預測結果推高（正值）或拉低（負值）的程度。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  usage: both
- id: 10021
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 下列何者屬於高風險 AI 應用領域，特別需要 XAI？
  type: multiple_choice
  options:
  - 醫療診斷與金融貸款 (Medical Diagnosis and Financial Loans)，高風險決策場景。
  - 垃圾郵件分類 (Spam Email Classification)，低風險分類任務。
  - 音樂推薦 (Music Recommendation)，個人化推薦系統。
  - 遊戲 NPC 行為 (Game NPC Behavior)，遊戲中的非玩家角色行為。
  correct_index: 0
  explanation: 醫療與金融涉及人身安全與財產權益，法規與倫理要求決策必須透明可解釋。
  tags:
  - chap-ai-foundation-chapter10
  - chap-ai-foundation-chapter10-summary
  usage: both
- id: 10022
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: LIME 解釋的線性模型是？
  type: multiple_choice
  options:
  - 全局的 (Global)，解釋模型整體行為。
  - 隨機的 (Random)，無系統性的隨機解釋。
  - 局部的 (Local)，解釋單一預測實例。
  - 非線性的 (Non-Linear)，非線性關係的解釋。
  correct_index: 2
  explanation: LIME 訓練的解釋模型只在被解釋樣本的局部鄰域內有效，不能推廣到整個資料空間。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  usage: both
- id: 10023
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP 的計算複雜度通常？
  type: multiple_choice
  options:
  - "非常高（因為要考慮所有特徵組合）(Very High: Because Need to Consider All Feature Combinations)"
  - 非常低 (Very Low)，計算成本極低。
  - 為零 (Zero)，完全不需要計算。
  - 是常數 (Is Constant)，計算量固定不變。
  correct_index: 0
  explanation: 精確計算 Shapley Value 需要遍歷所有可能的特徵組合，計算量隨特徵數指數成長，通常需使用近似演算法。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  usage: both
- id: 10024
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 反事實解釋的「有效性 (Validity)」是指？
  type: multiple_choice
  options:
  - 建議的改變必須真的能讓預測結果翻盤 (Suggested Changes Must Truly Reverse Prediction Results)，符合有效性原則。
  - 建議必須很便宜 (Suggestions Must Be Very Cheap)，成本考量。
  - 建議必須很短 (Suggestions Must Be Very Short)，長度限制。
  - 建議必須合法 (Suggestions Must Be Legal)，法規遵循。
  correct_index: 0
  explanation: 如果使用者照著建議做了改變，結果卻沒變（例如貸款還是被拒），那這個解釋就是無效的。
