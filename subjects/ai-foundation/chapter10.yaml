- chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 情境：在醫療診斷中，醫生通常更偏好哪種模型？
  type: multiple_choice
  options:
  - 準確率 99% 但完全無法解釋的黑箱模型
  - 準確率 95% 但能清楚解釋判斷依據的白箱或可解釋模型
  - 隨機猜測模型
  - 不需要模型
  correct_index: 1
  explanation: 在高風險領域（醫療、法律），可解釋性往往比微幅的準確率提升更重要，因為這關乎信任與責任。
