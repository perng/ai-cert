- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：LIME (Local Interpretable Model-agnostic Explanations) 的核心思想是？
  type: multiple_choice
  options:
  - 將整個黑箱模型轉換為白箱 (Converting Entire Black Box Model to White Box)，完全改變模型架構。
  - 在局部範圍內，用簡單的線性模型來模擬複雜的黑箱模型 (In Local Range, Using Simple Linear Model to Simulate Complex Black Box Model)
  - 計算所有特徵的平均值 (Calculating Average of All Features)，統計特徵的平均數。
  - 使用賽局理論 (Using Game Theory)，採用賽局理論方法。
  correct_index: 1
  explanation: LIME 假設在局部極小的範圍內，任何複雜的決策邊界都可以被視為線性的，因此可用簡單模型近似解釋。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  id: 11433
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：SHAP (Shapley Values) 源自於哪個領域的理論？
  type: multiple_choice
  options:
  - 生物學
  - 賽局理論 (Game Theory)
  - 物理學
  - 心理學
  correct_index: 1
  explanation: SHAP 基於合作賽局理論，計算每個特徵（玩家）對最終預測結果（總獎金）的邊際貢獻。
  tags:
  - chap-ai-foundation-chapter10
  - sec-shap
  id: 11434
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：客戶問：「我要怎麼做才能讓貸款通過？」這時候最適合提供哪種解釋？
  type: multiple_choice
  options:
  - 全局特徵重要性
  - LIME
  - 反事實解釋 (Counterfactual Explanation)
  - 混淆矩陣
  correct_index: 2
  explanation: 反事實解釋直接告訴使用者「如果改變某些條件（如增加收入），結果就會改變」，提供了具體的行動指引。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  id: 11435
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 情境：下列哪個模型通常被視為「白箱模型 (White Box)」，可解釋性最高？
  type: multiple_choice
  options:
  - 深度神經網路 (DNN)
  - 隨機森林
  - 決策樹 (Decision Tree)
  - 支持向量機 (SVM)
  correct_index: 2
  explanation: 決策樹的邏輯是顯式的「若...則...」規則，人類可以輕易追蹤並理解其決策路徑。
  tags:
  - chap-ai-foundation-chapter10
  - sec-black-white-box
  id: 11436
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：反事實解釋的三大原則中，「可操作性 (Actionability)」是指？
  type: multiple_choice
  options:
  - 建議必須是使用者能改變的 (如增加收入)
  - 建議必須很複雜
  - 建議必須改變很多特徵
  - 建議必須是不可逆的
  correct_index: 0
  explanation: 建議使用者無法改變的特徵（如年齡、出生地）是沒有意義的，好的解釋應聚焦於可改變的因素。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  id: 11437
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 情境：全局解釋 (Global Explanation) 主要回答什麼問題？
  type: multiple_choice
  options:
  - 為什麼這一筆特定的交易被判為詐欺？
  - 模型整體來說最看重哪些特徵？
  - 如果我改變年齡會怎樣？
  - 模型的準確率是多少？
  correct_index: 1
  explanation: 全局解釋關注模型整體的行為模式與特徵權重，而非單一案例。
  tags:
  - chap-ai-foundation-chapter10
  - sec-global-local
  id: 11438
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：SHAP 值為正數 (+10) 代表該特徵對預測結果的影響是？
  type: multiple_choice
  options:
  - 負向影響 (拉低分數)
  - 正向影響 (拉高分數)
  - 無影響
  - 隨機影響
  correct_index: 1
  explanation: 正的 SHAP 值表示該特徵的存在推高了預測值（相對於基準值）。
