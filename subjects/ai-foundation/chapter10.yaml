- id: 10051
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 層次與方法
  text: LIME (Local Interpretable Model-agnostic Explanations) 的主要特點是？
  type: multiple_choice
  options:
  - 它能解釋整個模型的運作邏輯 (Global Explanation)
  - 它透過擾動單一樣本的特徵，觀察預測變化，來解釋「為什麼模型對這個特定樣本做出這種判斷」 (Local Explanation)
  - 它只能用於線性模型
  - 它需要重新訓練模型
  correct_index: 1
  explanation: LIME 不管模型內部多複雜（黑箱），它只關心「如果我把圖片這塊遮住，你會不會認錯」，藉此推斷局部特徵的重要性。
  tags:
  - sec-ai-chapter10
  - sec-xai-levels
- id: 10052
  chapter_title: 可解釋 AI (XAI)
  section_title: XAI 層次與方法
  text: 在醫療診斷等高風險領域，為何我們有時會犧牲一點準確度來換取可解釋性？
  type: multiple_choice
  options:
  - 因為法規規定模型準確度不能太高
  - 因為若無法解釋診斷依據（黑箱），醫生和病人都無法信任 AI 的建議，且可能面臨法律責任
  - 因為可解釋的模型比較便宜
  - 因為醫生不喜歡太準的模型
  correct_index: 1
  explanation: 信任是 AI 落地的關鍵。一個說不出理由的神醫（黑箱 AI），在現代醫學倫理中是難以被接受的。
  tags:
  - sec-ai-chapter10
  - sec-xai-levels
- id: 10053
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 「反事實解釋 (Counterfactual Explanation)」通常是如何呈現的？
  type: multiple_choice
  options:
  - 告訴使用者：「如果你的年收入增加 5 萬，貸款申請就會通過」
  - 顯示模型的決策樹結構
  - 列出所有特徵的權重
  - 顯示一張熱力圖
  correct_index: 0
  explanation: 這種解釋方式最符合人類直覺，直接告訴使用者「怎麼做才能改變結果」，具有行動指導意義。
  tags:
  - sec-ai-chapter10
  - sec-explanation-tools
- id: 10054
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: SHAP (Shapley Additive Explanations) 值源自於博弈論，它試圖計算什麼？
  type: multiple_choice
  options:
  - 模型的運算時間
  - 資料的缺失比例
  - 每個特徵對於最終預測結果的邊際貢獻 (Marginal Contribution)
  - 特徵之間的相關係數
  correct_index: 2
  explanation: SHAP 公平地分配了每個特徵的功勞，告訴你「因為有年齡這個特徵，預測機率增加了 10%」。
  tags:
  - sec-ai-chapter10
  - sec-explanation-tools
- id: 11429
  chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 在「可解釋人工智慧（Explainable AI, XAI） 」領域中，LIME（Local Interpretable Model-agnostic Explanations）方法最核心的應用目 的是什麼？ (114年第四梯次)
  type: multiple_choice
  options:
  - 解釋單一樣本（局部預測）的黑箱模型決策過程
  - 全面提升黑箱模型整體的預測準確度
  - 將黑箱模型轉換成完全可解釋的模型作為替代
  - 用於生成大量擬真數據來替代訓練集
  correct_index: 0
  explanation: LIME 與 SHAP 是常見的 XAI 工具。LIME 提供局部解釋，SHAP 則基於博弈論計算特徵的邊際貢獻。 
