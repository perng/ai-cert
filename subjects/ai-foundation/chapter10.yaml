- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：LIME 的優點之一是 "Model-agnostic"，這意味著？
  type: multiple_choice
  options:
  - 它只能解釋線性模型
  - 它適用於任何類型的黑箱模型
  - 它不需要資料
  - 它計算很慢
  correct_index: 1
  explanation: LIME 不依賴於模型內部的具體結構（如神經網路的權重），只觀察輸入與輸出的變化，因此通用性極高。
  tags:
  - chap-ai-foundation-chapter10
  - sec-lime
  id: 11440
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: 解釋技術與工具
  text: 情境：反事實解釋的「稀疏性 (Sparsity)」原則建議？
  type: multiple_choice
  options:
  - 建議改變的特徵越少越好
  - 建議改變所有特徵
  - 建議不要改變
  - 建議改變最難的特徵
  correct_index: 0
  explanation: 要求使用者同時改變太多條件是不切實際的，好的建議應聚焦於 1-2 個關鍵改變。
  tags:
  - chap-ai-foundation-chapter10
  - sec-counterfactual
  id: 11441
  usage: both
- chapter_title: 可解釋 AI (XAI)
  section_title: XAI 的層次
  text: 情境：局部解釋 (Local Explanation) 適用於什麼場景？
  type: multiple_choice
  options:
  - 評估模型的整體效能
  - 解釋單一客戶為何被拒保
  - 篩選特徵
  - 比較不同模型
  correct_index: 1
  explanation: 局部解釋專注於剖析單一預測結果背後的具體原因。
