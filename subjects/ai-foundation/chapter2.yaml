questions:
- id: 2001
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 監督式學習 (Supervised Learning) 的核心特徵是什麼？
  type: multiple_choice
  options:
  - 使用無標籤的數據進行自我探索 (Using Unlabeled Data for Self-Exploration)，從無標籤數據中發現模式。
  - 不需要任何數據 (No Data Required)，可以在無數據情況下進行學習。
  - 使用有標籤的數據 (Labeled Data) 進行訓練 (Training with Labeled Data)
  - 透過獎勵與懲罰機制學習 (Learning Through Reward and Punishment Mechanisms)，屬於強化學習範式。
  correct_index: 2
  explanation: 監督式學習就像老師教學生，必須提供題目（輸入）和標準答案（標籤），讓模型學習兩者之間的關聯。
  tags:
  - chap-ai-foundation-chapter2
  - sec-supervised-learning
  usage: quiz
- id: 2002
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 下列哪一個應用場景最適合使用「監督式學習」？
  type: multiple_choice
  options:
  - 探索未知的火星地形 (Exploring Unknown Martian Terrain)，屬於非監督式學習的應用。
  - 將客戶自動分成未知的群體 (Automatically Grouping Customers into Unknown Segments)，屬於非監督式學習。
  - 讓機器人學會走路 (Teaching Robots to Walk)，屬於強化學習的應用。
  - 預測房價（根據坪數、地點等已知成交資料）(Predicting House Prices Based on Known Transaction Data)
  correct_index: 3
  explanation: 房價預測有明確的歷史數據（輸入）和成交價（標籤），屬於典型的監督式學習（迴歸問題）。
  tags:
  - chap-ai-foundation-chapter2
  - sec-supervised-learning
  usage: quiz
- id: 2003
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 垃圾郵件過濾系統通常屬於哪一種學習範式？
  type: multiple_choice
  options:
  - 監督式學習 (Supervised Learning)，使用已標籤的郵件進行訓練。
  - 強化學習 (Reinforcement Learning)，透過獎勵與懲罰機制學習。
  - 遷移學習 (Transfer Learning)，利用預訓練模型進行微調。
  - 非監督式學習 (Unsupervised Learning)，從無標籤數據中發現模式。
  correct_index: 0
  explanation: 系統透過學習已標記為「垃圾信」或「正常信」的郵件特徵來判斷新郵件，這是監督式學習中的分類任務。
  tags:
  - chap-ai-foundation-chapter2
  - sec-supervised-learning
  usage: quiz
- id: 2004
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 非監督式學習 (Unsupervised Learning) 的主要特點是什麼？
  type: multiple_choice
  options:
  - 需要預訓練模型 (Requiring Pre-trained Models)，必須先有已訓練的基礎模型。
  - 只有輸入數據，沒有標準答案 (標籤) (Only Input Data, No Labels/Standard Answers)
  - 依賴外部獎勵訊號 (Relying on External Reward Signals)，屬於強化學習的特徵。
  - 使用有標籤的數據 (Using Labeled Data)，屬於監督式學習的特徵。
  correct_index: 1
  explanation: 非監督式學習就像自修，模型必須在沒有標準答案的情況下，自己從數據中尋找隱藏的結構。
  tags:
  - chap-ai-foundation-chapter2
  - sec-unsupervised-learning
  usage: quiz
- id: 2005
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 下列何者是非監督式學習的典型應用？
  type: multiple_choice
  options:
  - 天氣預報 (Weather Forecasting)，使用歷史數據預測未來，屬於監督式學習。
  - 手寫數字辨識 (Handwritten Digit Recognition)，使用已標籤的數字圖片訓練，屬於監督式學習。
  - 語音轉文字 (Speech-to-Text)，使用已標籤的語音數據訓練，屬於監督式學習。
  - 顧客分群 (Customer Segmentation)，從無標籤數據中發現客戶群體，屬於非監督式學習。
  correct_index: 3
  explanation: 顧客分群通常事先不知道有哪些群體，需要模型自動根據消費行為將相似的客戶聚在一起，屬於非監督式學習。
  tags:
  - chap-ai-foundation-chapter2
  - sec-unsupervised-learning
  usage: quiz
- id: 2006
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 信用卡盜刷偵測（異常偵測）常使用哪種學習範式？
  type: multiple_choice
  options:
  - 遷移學習 (Transfer Learning)，利用預訓練模型進行微調。
  - 非監督式學習 (Unsupervised Learning)，從正常交易模式中識別異常。
  - 監督式學習 (Supervised Learning)，使用已標籤的盜刷案例進行訓練。
  - 強化學習 (Reinforcement Learning)，透過獎勵與懲罰機制學習。
  correct_index: 1
  explanation: 異常偵測常使用非監督式學習來找出與正常模式差異極大的數據點（異常值）。
  tags:
  - chap-ai-foundation-chapter2
  - sec-unsupervised-learning
  usage: quiz
- id: 2007
  chapter_title: AI 應用問題類型
  section_title: 半監督式學習 (Semi-supervised Learning)
  text: 為什麼會需要使用「半監督式學習」？
  type: multiple_choice
  options:
  - 因為模型運算速度太慢 (Model Computation Too Slow)，訓練時間過長影響效率。
  - 因為數據量太少 (Insufficient Data Volume)，訓練數據不足導致模型表現不佳。
  - 因為取得有標籤的數據成本很高，但無標籤數據很多 (High Cost of Labeled Data, But Abundant Unlabeled Data)
  - 因為不需要任何標籤 (No Labels Required)，可以在完全無標籤情況下學習。
  correct_index: 2
  explanation: 半監督式學習是為了解決標註成本高昂的問題，利用少量有標籤數據搭配大量無標籤數據來提升學習效果。
  tags:
  - chap-ai-foundation-chapter2
  - sec-semi-supervised-learning
  usage: quiz
- id: 2008
  chapter_title: AI 應用問題類型
  section_title: 半監督式學習 (Semi-supervised Learning)
  text: 醫療影像分析常採用半監督式學習，主要原因為何？
  type: multiple_choice
  options:
  - 醫療影像解析度太低 (Low Medical Image Resolution)，影像品質不足以進行分析。
  - 病人隱私問題 (Patient Privacy Issues)，法規限制數據使用與共享。
  - 醫生標註影像非常耗時且昂貴 (Doctor Annotation is Time-Consuming and Expensive)
  - AI 無法處理彩色圖片 (AI Cannot Process Color Images)，僅能處理黑白影像。
  correct_index: 2
  explanation: 專業醫生標註 X 光片需要高度專業且耗時，因此利用少量標註資料配合大量未標註資料是較經濟的做法。
  tags:
  - chap-ai-foundation-chapter2
  - sec-semi-supervised-learning
  usage: quiz
- id: 2009
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 強化學習 (Reinforcement Learning) 的學習機制最像下列哪一種過程？
  type: multiple_choice
  options:
  - 背誦教科書 (Memorizing Textbooks)，死記硬背固定的知識內容。
  - 觀看教學影片 (Watching Educational Videos)，被動接收資訊與指導。
  - 訓練寵物（透過獎勵與懲罰）(Training Pets Through Reward and Punishment)
  - 填寫問卷調查 (Filling Out Questionnaires)，收集結構化的回饋資訊。
  correct_index: 2
  explanation: 強化學習透過試誤 (Trial and Error) 以及環境給予的獎勵或懲罰來調整行為，就像訓練寵物一樣。
  tags:
  - chap-ai-foundation-chapter2
  - sec-reinforcement-learning
  usage: quiz
- id: 2010
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 在強化學習中，「代理人 (Agent)」指的是什麼？
  type: multiple_choice
  options:
  - 負責標註資料的人類 (Humans Responsible for Data Labeling)，提供訓練數據的標籤。
  - 正在學習的 AI 模型 (The Learning AI Model)，採取行動並進行學習的主體。
  - 最終的預測結果 (Final Prediction Results)，模型輸出的預測值。
  - 提供獎勵的環境 (Environment Providing Rewards)，給予回饋訊號的外部系統。
  correct_index: 1
  explanation: 代理人 (Agent) 是強化學習中採取行動並進行學習的主體，例如掃地機器人或圍棋程式。
  tags:
  - chap-ai-foundation-chapter2
  - sec-reinforcement-learning
  usage: quiz
- id: 2011
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 強化學習中的「探索 (Exploration)」是指什麼？
  type: multiple_choice
  options:
  - 堅持目前已知最好的策略 (Sticking to Currently Known Best Strategy)，屬於利用 (Exploitation) 的行為。
  - 分析過去的歷史數據 (Analyzing Past Historical Data)，回顧與總結過往經驗。
  - 嘗試新的、未知的行動以發現更好的策略 (Trying New, Unknown Actions to Discover Better Strategies)
  - 停止學習並輸出結果 (Stopping Learning and Outputting Results)，結束訓練過程。
  correct_index: 2
  explanation: 探索是指嘗試未曾做過的行動，雖然有風險，但有機會發現比目前策略更好的方法。
  tags:
  - chap-ai-foundation-chapter2
  - sec-reinforcement-learning
  usage: both
- id: 2012
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: AlphaGo 能夠超越人類棋手，主要歸功於哪種學習範式？
  type: multiple_choice
  options:
  - 監督式學習 (Supervised Learning)，使用人類棋譜進行訓練。
  - 強化學習 (Reinforcement Learning)，透過自我對弈與環境回饋學習。
  - 非監督式學習 (Unsupervised Learning)，從無標籤數據中發現模式。
  - 半監督式學習 (Semi-supervised Learning)，結合少量標籤與大量無標籤數據。
  correct_index: 1
  explanation: AlphaGo 透過強化學習進行自我對弈，從數百萬盤棋局中探索出人類未曾發現的致勝策略。
  tags:
  - chap-ai-foundation-chapter2
  - sec-reinforcement-learning
  usage: both
- id: 2013
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 遷移學習 (Transfer Learning) 的核心概念可以用哪句諺語形容？
  type: multiple_choice
  options:
  - 瞎子摸象 (Blind Men Touching an Elephant)，缺乏全面理解，僅看到局部。
  - 站在巨人的肩膀上 (Standing on the Shoulders of Giants)，利用前人成果建立新知識。
  - 熟能生巧 (Practice Makes Perfect)，透過反覆練習提升技能。
  - 揠苗助長 (Pulling Up Seedlings to Help Them Grow)，急於求成反而適得其反。
  correct_index: 1
  explanation: 遷移學習利用預訓練好的強大模型（巨人）來解決新的任務，避免從頭開始訓練，即「站在巨人的肩膀上」。
  tags:
  - chap-ai-foundation-chapter2
  - sec-transfer-learning
  usage: both
- id: 2014
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 使用預訓練模型 (Pre-trained Model) 進行微調 (Fine-tuning) 是哪種學習範式的特徵？
  type: multiple_choice
  options:
  - 非監督式學習 (Unsupervised Learning)，從無標籤數據中發現模式。
  - 強化學習 (Reinforcement Learning)，透過獎勵與懲罰機制學習。
  - 遷移學習 (Transfer Learning)，利用預訓練模型進行微調。
  - 監督式學習 (Supervised Learning)，使用有標籤數據進行訓練。
  correct_index: 2
  explanation: 這正是遷移學習的標準流程：先在大數據上預訓練，再於特定任務數據上進行微調。
  tags:
  - chap-ai-foundation-chapter2
  - sec-transfer-learning
  usage: both
- id: 2015
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 下列何者不是遷移學習的優勢？
  type: multiple_choice
  options:
  - 完全不需要任何新資料 (No New Data Required at All)，可以在無新數據情況下運作。
  - 減少對大量標註資料的需求 (Reducing Need for Large Amounts of Labeled Data)
  - 節省訓練時間 (Saving Training Time)，避免從頭開始訓練模型。
  - 可以利用現有的強大模型 (Utilizing Existing Powerful Models)，重用預訓練的模型。
  correct_index: 0
  explanation: 遷移學習通常仍需要少量的特定領域資料進行微調，並非完全不需要新資料。
  tags:
  - chap-ai-foundation-chapter2
  - sec-transfer-learning
  usage: both
- id: 2016
  chapter_title: AI 應用問題類型
  section_title: '1. 描述性分析 (Descriptive Analysis): 發生了什麼？'
  text: 資料分析的四個層次中，最基礎的是哪一個？
  type: multiple_choice
  options:
  - 診斷性分析 (Diagnostic Analysis)，探討事件發生的原因。
  - 預測性分析 (Predictive Analysis)，預測未來可能發生的事件。
  - 處方性分析 (Prescriptive Analysis)，提供最佳行動建議。
  - 描述性分析 (Descriptive Analysis)，總結過去發生的事情。
  correct_index: 3
  explanation: 描述性分析 (Descriptive Analysis) 是最基礎的層次，重點在於總結過去發生的事情（如報表）。
  tags:
  - chap-ai-foundation-chapter2
  - sec-descriptive-analysis
  usage: both
- id: 2017
  chapter_title: AI 應用問題類型
  section_title: '1. 描述性分析 (Descriptive Analysis): 發生了什麼？'
  text: 「上個月的銷售總額是多少？」這個問題屬於哪種分析層次？
  type: multiple_choice
  options:
  - 描述性分析 (Descriptive Analysis)，總結過去發生的事實。
  - 診斷性分析 (Diagnostic Analysis)，探討事件發生的原因。
  - 預測性分析 (Predictive Analysis)，預測未來可能發生的事件。
  - 處方性分析 (Prescriptive Analysis)，提供最佳行動建議。
  correct_index: 0
  explanation: 這是在詢問過去發生的事實，屬於描述性分析。
  tags:
  - chap-ai-foundation-chapter2
  - sec-descriptive-analysis
  usage: both
- id: 2018
  chapter_title: AI 應用問題類型
  section_title: '2. 診斷性分析 (Diagnostic Analysis): 為什麼發生？'
  text: 診斷性分析 (Diagnostic Analysis) 的主要目的是什麼？
  type: multiple_choice
  options:
  - 提供最佳行動建議 (Providing Optimal Action Recommendations)，屬於處方性分析。
  - 找出事件發生的原因 (Finding the Causes of Events)，探討為什麼發生。
  - 總結歷史數據 (Summarizing Historical Data)，屬於描述性分析。
  - 預測未來趨勢 (Predicting Future Trends)，屬於預測性分析。
  correct_index: 1
  explanation: 診斷性分析試圖回答「為什麼發生？」，透過鑽取數據找出成因。
  tags:
  - chap-ai-foundation-chapter2
  - sec-diagnostic-analysis
  usage: both
- id: 2019
  chapter_title: AI 應用問題類型
  section_title: '2. 診斷性分析 (Diagnostic Analysis): 為什麼發生？'
  text: 「為什麼上個月客戶流失率突然升高？」屬於哪種分析層次？
  type: multiple_choice
  options:
  - 診斷性分析 (Diagnostic Analysis)，探討問題背後的原因。
  - 預測性分析 (Predictive Analysis)，預測未來可能發生的事件。
  - 描述性分析 (Descriptive Analysis)，僅陳述過去發生的事實。
  - 處方性分析 (Prescriptive Analysis)，提供最佳行動建議。
  correct_index: 0
  explanation: 這是在探討問題背後的原因，屬於診斷性分析。
  tags:
  - chap-ai-foundation-chapter2
  - sec-diagnostic-analysis
  usage: both
- id: 2020
  chapter_title: AI 應用問題類型
  section_title: '3. 預測性分析 (Predictive Analysis): 將會發生什麼？'
  text: 預測性分析 (Predictive Analysis) 的核心功能是什麼？
  type: multiple_choice
  options:
  - 自動執行決策 (Automatically Executing Decisions)，屬於處方性分析的功能。
  - 解釋過去 (Explaining the Past)，屬於診斷性分析的功能。
  - 預測未來可能發生的事件 (Predicting Future Possible Events)
  - 監控現狀 (Monitoring Current Status)，屬於描述性分析的功能。
  correct_index: 2
  explanation: 預測性分析利用歷史數據模型來推估未來的趨勢或事件機率。
  tags:
  - chap-ai-foundation-chapter2
  - sec-predictive-analysis
  usage: both
- id: 2021
  chapter_title: AI 應用問題類型
  section_title: '3. 預測性分析 (Predictive Analysis): 將會發生什麼？'
  text: 「這台機器下週故障的機率是多少？」屬於哪種分析層次？
  type: multiple_choice
  options:
  - 處方性分析 (Prescriptive Analysis)，提供最佳行動建議。
  - 診斷性分析 (Diagnostic Analysis)，探討事件發生的原因。
  - 預測性分析 (Predictive Analysis)，預測未來事件的機率。
  - 描述性分析 (Descriptive Analysis)，僅陳述過去發生的事實。
  correct_index: 2
  explanation: 這是在預測未來事件（故障）的機率，屬於預測性分析。
  tags:
  - chap-ai-foundation-chapter2
  - sec-predictive-analysis
  usage: both
- id: 2022
  chapter_title: AI 應用問題類型
  section_title: '4. 處方性分析 (Prescriptive Analysis): 應該怎麼做？'
  text: 處方性分析 (Prescriptive Analysis) 是分析的最高境界，它能提供什麼？
  type: multiple_choice
  options:
  - 未來的預測數值 (Future Predicted Values)，屬於預測性分析的功能。
  - 事件發生的詳細原因 (Detailed Causes of Events)，屬於診斷性分析的功能。
  - 最佳行動建議與決策優化 (Optimal Action Recommendations and Decision Optimization)
  - 最準確的歷史報表 (Most Accurate Historical Reports)，屬於描述性分析的功能。
