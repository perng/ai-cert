questions:
- id: 2001
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 監督式學習 (Supervised Learning) 的核心特徵是什麼？
  type: multiple_choice
  options:
  - 使用無標籤的數據進行自我探索
  - 不需要任何數據
  - 使用有標籤的數據 (Labeled Data) 進行訓練
  - 透過獎勵與懲罰機制學習
  correct_index: 2
  explanation: 監督式學習就像老師教學生，必須提供題目（輸入）和標準答案（標籤），讓模型學習兩者之間的關聯。
  tags:
  - sec-chapter2
  - sec-supervised-learning
- id: 2002
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 下列哪一個應用場景最適合使用「監督式學習」？
  type: multiple_choice
  options:
  - 探索未知的火星地形
  - 將客戶自動分成未知的群體
  - 讓機器人學會走路
  - 預測房價（根據坪數、地點等已知成交資料）
  correct_index: 3
  explanation: 房價預測有明確的歷史數據（輸入）和成交價（標籤），屬於典型的監督式學習（迴歸問題）。
  tags:
  - sec-chapter2
  - sec-supervised-learning
- id: 2003
  chapter_title: AI 應用問題類型
  section_title: 監督式學習 (Supervised Learning)
  text: 垃圾郵件過濾系統通常屬於哪一種學習範式？
  type: multiple_choice
  options:
  - 監督式學習
  - 強化學習
  - 遷移學習
  - 非監督式學習
  correct_index: 0
  explanation: 系統透過學習已標記為「垃圾信」或「正常信」的郵件特徵來判斷新郵件，這是監督式學習中的分類任務。
  tags:
  - sec-chapter2
  - sec-supervised-learning
- id: 2004
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 非監督式學習 (Unsupervised Learning) 的主要特點是什麼？
  type: multiple_choice
  options:
  - 需要預訓練模型
  - 只有輸入數據，沒有標準答案 (標籤)
  - 依賴外部獎勵訊號
  - 使用有標籤的數據
  correct_index: 1
  explanation: 非監督式學習就像自修，模型必須在沒有標準答案的情況下，自己從數據中尋找隱藏的結構。
  tags:
  - sec-chapter2
  - sec-unsupervised-learning
- id: 2005
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 下列何者是非監督式學習的典型應用？
  type: multiple_choice
  options:
  - 天氣預報
  - 手寫數字辨識
  - 語音轉文字
  - 顧客分群 (Customer Segmentation)
  correct_index: 3
  explanation: 顧客分群通常事先不知道有哪些群體，需要模型自動根據消費行為將相似的客戶聚在一起，屬於非監督式學習。
  tags:
  - sec-chapter2
  - sec-unsupervised-learning
- id: 2006
  chapter_title: AI 應用問題類型
  section_title: 非監督式學習 (Unsupervised Learning)
  text: 信用卡盜刷偵測（異常偵測）常使用哪種學習範式？
  type: multiple_choice
  options:
  - 遷移學習
  - 非監督式學習
  - 監督式學習
  - 強化學習
  correct_index: 1
  explanation: 異常偵測常使用非監督式學習來找出與正常模式差異極大的數據點（異常值）。
  tags:
  - sec-chapter2
  - sec-unsupervised-learning
- id: 2007
  chapter_title: AI 應用問題類型
  section_title: 半監督式學習 (Semi-supervised Learning)
  text: 為什麼會需要使用「半監督式學習」？
  type: multiple_choice
  options:
  - 因為模型運算速度太慢
  - 因為數據量太少
  - 因為取得有標籤的數據成本很高，但無標籤數據很多
  - 因為不需要任何標籤
  correct_index: 2
  explanation: 半監督式學習是為了解決標註成本高昂的問題，利用少量有標籤數據搭配大量無標籤數據來提升學習效果。
  tags:
  - sec-chapter2
  - sec-semi-supervised-learning
- id: 2008
  chapter_title: AI 應用問題類型
  section_title: 半監督式學習 (Semi-supervised Learning)
  text: 醫療影像分析常採用半監督式學習，主要原因為何？
  type: multiple_choice
  options:
  - 醫療影像解析度太低
  - 病人隱私問題
  - 醫生標註影像非常耗時且昂貴
  - AI 無法處理彩色圖片
  correct_index: 2
  explanation: 專業醫生標註 X 光片需要高度專業且耗時，因此利用少量標註資料配合大量未標註資料是較經濟的做法。
  tags:
  - sec-chapter2
  - sec-semi-supervised-learning
- id: 2009
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 強化學習 (Reinforcement Learning) 的學習機制最像下列哪一種過程？
  type: multiple_choice
  options:
  - 背誦教科書
  - 觀看教學影片
  - 訓練寵物（透過獎勵與懲罰）
  - 填寫問卷調查
  correct_index: 2
  explanation: 強化學習透過試誤 (Trial and Error) 以及環境給予的獎勵或懲罰來調整行為，就像訓練寵物一樣。
  tags:
  - sec-chapter2
  - sec-reinforcement-learning
- id: 2010
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 在強化學習中，「代理人 (Agent)」指的是什麼？
  type: multiple_choice
  options:
  - 負責標註資料的人類
  - 正在學習的 AI 模型
  - 最終的預測結果
  - 提供獎勵的環境
  correct_index: 1
  explanation: 代理人 (Agent) 是強化學習中採取行動並進行學習的主體，例如掃地機器人或圍棋程式。
  tags:
  - sec-chapter2
  - sec-reinforcement-learning
- id: 2011
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: 強化學習中的「探索 (Exploration)」是指什麼？
  type: multiple_choice
  options:
  - 堅持目前已知最好的策略
  - 分析過去的歷史數據
  - 嘗試新的、未知的行動以發現更好的策略
  - 停止學習並輸出結果
  correct_index: 2
  explanation: 探索是指嘗試未曾做過的行動，雖然有風險，但有機會發現比目前策略更好的方法。
  tags:
  - sec-chapter2
  - sec-reinforcement-learning
- id: 2012
  chapter_title: AI 應用問題類型
  section_title: 強化學習 (Reinforcement Learning)
  text: AlphaGo 能夠超越人類棋手，主要歸功於哪種學習範式？
  type: multiple_choice
  options:
  - 監督式學習
  - 強化學習
  - 非監督式學習
  - 半監督式學習
  correct_index: 1
  explanation: AlphaGo 透過強化學習進行自我對弈，從數百萬盤棋局中探索出人類未曾發現的致勝策略。
  tags:
  - sec-chapter2
  - sec-reinforcement-learning
- id: 2013
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 遷移學習 (Transfer Learning) 的核心概念可以用哪句諺語形容？
  type: multiple_choice
  options:
  - 瞎子摸象
  - 站在巨人的肩膀上
  - 熟能生巧
  - 揠苗助長
  correct_index: 1
  explanation: 遷移學習利用預訓練好的強大模型（巨人）來解決新的任務，避免從頭開始訓練，即「站在巨人的肩膀上」。
  tags:
  - sec-chapter2
  - sec-transfer-learning
- id: 2014
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 使用預訓練模型 (Pre-trained Model) 進行微調 (Fine-tuning) 是哪種學習範式的特徵？
  type: multiple_choice
  options:
  - 非監督式學習
  - 強化學習
  - 遷移學習
  - 監督式學習
  correct_index: 2
  explanation: 這正是遷移學習的標準流程：先在大數據上預訓練，再於特定任務數據上進行微調。
  tags:
  - sec-chapter2
  - sec-transfer-learning
- id: 2015
  chapter_title: AI 應用問題類型
  section_title: 遷移學習 (Transfer Learning)
  text: 下列何者不是遷移學習的優勢？
  type: multiple_choice
  options:
  - 完全不需要任何新資料
  - 減少對大量標註資料的需求
  - 節省訓練時間
  - 可以利用現有的強大模型
  correct_index: 0
  explanation: 遷移學習通常仍需要少量的特定領域資料進行微調，並非完全不需要新資料。
  tags:
  - sec-chapter2
  - sec-transfer-learning
