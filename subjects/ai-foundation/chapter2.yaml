- id: 2051
  chapter_title: AI 應用與問題類型
  section_title: 機器學習範式
  text: 某銀行希望透過分析客戶過去的交易紀錄來偵測信用卡盜刷，但他們只有極少數確定的盜刷樣本，絕大多數都是正常交易。這種情況下，哪種學習範式最不適用？
  type: multiple_choice
  options:
  - 監督式學習 (Supervised Learning)，因為正樣本太少，模型難以學會盜刷特徵
  - 半監督式學習 (Semi-supervised Learning)，利用少量標註數據與大量未標註數據進行訓練
  - 強化學習 (Reinforcement Learning)，讓系統在即時交易中試錯並學習
  - 非監督式學習 (Unsupervised Learning)，利用異常檢測 (Anomaly Detection) 找出與正常行為差異極大的交易
  correct_index: 2
  explanation: 強化學習需要環境回饋與試錯，在金融交易中「試錯」代價太高（直接損失金錢），且缺乏即時明確的 Reward 訊號。
  tags:
  - sec-ai-chapter2
  - sec-learning-paradigms
