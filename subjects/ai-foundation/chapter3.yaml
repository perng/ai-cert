- id: 3039
  chapter_title: 數據處理生命週期與架構
  section_title: 資料管道
  text: 「資料沼澤 (Data Swamp)」是指什麼狀況？
  type: multiple_choice
  options:
  - 資料庫淹水
  - 資料處理速度太快
  - 資料量太少
  - 資料湖中的資料缺乏管理與治理，變成垃圾堆
  correct_index: 3
  explanation: 當資料湖缺乏適當的 metadata 管理、品質控管和生命週期管理時，就會變成難以使用的資料沼澤。
