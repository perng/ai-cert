  chapter_title: 數據處理生命週期與架構
  section_title: 探索性資料分析
  text: 某假設檢定設定顯著水準 α = 0.05，計算得到 p 值 = 0.03。一般應如何判斷？
  type: multiple_choice
  options:
  - p 值小於 α，因此拒絕虛無假設
  - p 值小於 α，因此一定證明對立假設百分之百正確
  - p 值大於 α，因此接受虛無假設
  - p 值代表虛無假設有 3% 的機率為真
  correct_index: 0
  explanation: 當 p 值小於顯著水準 α 時，通常拒絕虛無假設。p 值不是「虛無假設為真的機率」，而是在 H0 為真時觀察到目前或更極端結果的機率。
  tags:
  - chap-ai-foundation-chapter3
  - sec-hypothesis-testing
