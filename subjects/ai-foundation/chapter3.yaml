- id: 3035
  chapter_title: 數據處理生命週期與架構
  section_title: 資料隱私
  text: 「假名化 (Pseudonymization)」與「匿名化」的主要區別在於？
  type: multiple_choice
  options:
  - 匿名化比較不安全
  - 兩者完全相同
  - 假名化完全無法還原
  - 假名化可透過對照表還原，具可追溯性
  correct_index: 3
  explanation: 假名化使用代碼取代個資，但保留了對照表（金鑰），特定權限下可還原；匿名化則是永久去除連結，無法還原。
  tags:
  - sec-chapter3
  - sec-anonymization
- id: 3036
  chapter_title: 數據處理生命週期與架構
  section_title: 資料清理
  text: 下列何者不是處理缺失值的常見策略？
  type: multiple_choice
  options:
  - 保留缺失值並讓模型處理（如果模型支援）
  - 插補法
  - 刪除法
  - 將缺失值全部填為無限大
  correct_index: 3
  explanation: 將缺失值填為無限大通常會導致模型運算錯誤或發散，不是合理的處理方式。
  tags:
  - sec-chapter3
  - sec-missing-values
