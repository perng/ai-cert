  - sec-elt
- id: 3040
  chapter_title: 數據處理生命週期與架構
  section_title: 資料分析層次
  text: 貝塞爾校正 (Bessel's Correction) 在計算樣本標準差時，分母為什麼是 n-1？
  type: multiple_choice
  options:
  - 為了方便計算
  - 為了提供對母體變異數的不偏估計
  - 這是打字錯誤
  - 為了讓標準差變小
  correct_index: 1
  explanation: 使用 n-1 可以修正樣本變異數傾向於低估母體變異數的偏差，提供不偏估計。
  tags:
  - sec-chapter3
  - sec-descriptive-statistics
- id: 3051
  chapter_title: 數據工程與資料處理
  section_title: 數據類型與儲存
  text: 若你需要儲存大量的社交媒體貼文、圖片與影片，並希望未來能進行彈性的分析，應選擇哪種儲存方案？
  type: multiple_choice
  options:
  - 資料湖 (Data Lake)，如 Amazon S3
  - 關聯式資料庫 (RDBMS)，如 MySQL
  - 記憶體快取 (Redis)
  - Excel 試算表
  correct_index: 0
  explanation: 資料湖適合以原始格式儲存海量的結構化與非結構化數據 (Schema-on-Read)，保留最大的彈性。
  tags:
  - sec-ai-chapter3
  - sec-data-storage
- id: 3052
  chapter_title: 數據工程與資料處理
  section_title: 數據處理流程
  text: 在現代的大數據架構中，為何 ELT (Extract, Load, Transform) 逐漸取代傳統的 ETL？
  type: multiple_choice
  options:
  - 因為硬碟空間變貴了，必須先轉換再儲存
  - 因為雲端資料倉儲 (如 BigQuery, Snowflake) 的運算能力大幅提升，先載入再轉換能保留原始數據並加速處理
  - 因為 ETL 的工具已經停止維護
  - 因為 ELT 不需要寫程式
  correct_index: 1
  explanation: ELT 利用目標端強大的運算資源進行轉換，且保留了原始數據 (Raw Data) 供後續不同用途使用，更具靈活性。
  tags:
  - sec-ai-chapter3
  - sec-data-pipeline
- id: 3053
  chapter_title: 數據工程與資料處理
  section_title: 探索式資料分析 (EDA)
  text: 在 EDA 階段發現兩個變數高度相關 (Correlation)，我們可以斷定它們有因果關係 (Causation) 嗎？
  type: multiple_choice
  options:
  - 不行，可能存在混淆變數 (Confounding Variable) 或僅是巧合，必須進一步實驗驗證
  - 可以，只要相關係數大於 0.9
  - 不行，除非數據量超過一億筆
  - 可以，相關性即代表因果性
  correct_index: 0
  explanation: 「相關不等於因果」是統計學的基本原則。例如「冰淇淋銷量」與「溺水人數」正相關，是因為「夏天」這個共同因素。
  tags:
  - sec-ai-chapter3
  - sec-eda
- id: 3054
  chapter_title: 數據工程與資料處理
  section_title: 數據清洗與品質
  text: 處理缺失值 (Missing Values) 時，若該欄位缺失比例高達 80%，最安全的處理方式通常是？
  type: multiple_choice
  options:
  - 用平均值填補
  - 直接刪除該欄位 (Drop Column)
  - 用機器學習模型預測填補
  - 用 0 填補
  correct_index: 1
  explanation: 當缺失比例過高，填補過多人工數據會引入嚴重偏差，且該特徵可能本身就缺乏資訊價值，刪除是較穩健的選擇。
  tags:
  - sec-ai-chapter3
  - sec-data-cleaning
- id: 3055
  chapter_title: 數據工程與資料處理
  section_title: 數據清洗與品質
  text: 在偵測異常值 (Outliers) 時，使用 IQR (四分位距) 法比使用 Z-Score 法有什麼優勢？
  type: multiple_choice
  options:
  - IQR 法計算比較簡單
  - IQR 法可以偵測出更多的異常值
  - Z-Score 法已經過時了
  - IQR 法對數據分佈的假設較少，不需要數據符合常態分佈 (Normal Distribution)
  correct_index: 3
  explanation: Z-Score 高度依賴平均值與標準差，容易受極端值影響且假設常態分佈；IQR 基於排序位置，對偏態分佈更穩健。
  tags:
  - sec-ai-chapter3
  - sec-data-cleaning
- id: 3056
  chapter_title: 數據工程與資料處理
  section_title: 數據處理流程
  text: 對於即時詐欺偵測系統，應採用哪種數據處理架構？
  type: multiple_choice
  options:
  - 隨機抽樣處理
  - 批次處理 (Batch Processing)，每天晚上跑一次
  - 串流處理 (Streaming Processing)，如 Apache Kafka + Flink
  - 手動處理，由人工審核每一筆交易
  correct_index: 2
  explanation: 詐欺偵測講求毫秒級的反應速度，批次處理的延遲太高，無法在損失發生前攔截。
  tags:
  - sec-ai-chapter3
  - sec-data-pipeline
