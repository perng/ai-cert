  usage: quiz
- id: 3073
  chapter_title: 數據處理生命週期與架構
  section_title: 探索性資料分析
  text: 驗證性資料分析 (CDA) 與探索性資料分析 (EDA) 最大的差異是什麼？
  type: multiple_choice
  options:
  - EDA 主要驗證既有假設，CDA 主要任意探索資料
  - CDA 著重驗證先前提出的假設，EDA 著重發現模式、關聯與異常
  - CDA 只能使用圖片資料，EDA 只能使用表格資料
  - EDA 不需要任何資料，CDA 不需要任何統計方法
  correct_index: 1
  explanation: EDA 的重點是開放式探索資料、形成假設；CDA 的重點是使用統計檢定、模型或實驗設計來驗證假設是否被資料支持。
