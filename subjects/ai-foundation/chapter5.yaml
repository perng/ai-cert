  - 模型無法計算出係數
  correct_index: 2
  explanation: 異質變異數 (Heteroscedasticity) 意味著模型在不同數值範圍的預測誤差不一致（例如預測豪宅價格的誤差遠大於小套房），影響統計推論的有效性。
