questions:
- id: 5001
  chapter_title: 監督式學習演算法
  section_title: 監督式學習概述
  text: 監督式學習 (Supervised Learning) 的核心運作模式最像什麼？
  type: multiple_choice
  options:
  - 訓練寵物（獎勵與懲罰）(Training Pets with Rewards and Punishments)，屬於強化學習的模式。
  - 隨機猜測 (Random Guessing)，無學習過程的隨機預測。
  - 嬰兒自我探索 (Infant Self-Exploration)，屬於非監督式學習的模式。
  - 人類的正規教育（老師給題目和答案）(Formal Human Education: Teacher Provides Questions and Answers)
  correct_index: 3
  explanation: 監督式學習需要輸入資料 (題目) 和對應的標籤 (答案)，就像老師教學生一樣。
  tags:
  - chap-ai-foundation-chapter5
  - chap-ai-foundation-chapter5-summary
  usage: quiz
- id: 5002
  chapter_title: 監督式學習演算法
  section_title: 監督式學習概述
  text: 如果目標變數是「明天會不會下雨（是/否）」，這是哪種任務？
  type: multiple_choice
  options:
  - 降維 (Dimensionality Reduction)，減少特徵維度的技術。
  - 迴歸 (Regression)，預測連續數值的任務。
  - 分類 (Classification)，預測離散類別的任務。
  - 分群 (Clustering)，從無標籤數據中發現群體。
  correct_index: 2
  explanation: 預測離散的類別（是/否）屬於分類任務。
  tags:
  - chap-ai-foundation-chapter5
  - sec-classification
  usage: quiz
- id: 5003
  chapter_title: 監督式學習演算法
  section_title: 監督式學習概述
  text: 如果目標變數是「明天的氣溫（攝氏度）」，這是哪種任務？
  type: multiple_choice
  options:
  - 迴歸 (Regression)，預測連續數值的任務。
  - 強化學習 (Reinforcement Learning)，透過獎勵與懲罰機制學習。
  - 分群 (Clustering)，從無標籤數據中發現群體。
  - 分類 (Classification)，預測離散類別的任務。
  correct_index: 0
  explanation: 預測連續的數值（氣溫）屬於迴歸任務。
  tags:
  - chap-ai-foundation-chapter5
  - sec-regression
  usage: quiz
- id: 5004
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: K-近鄰演算法 (KNN) 的核心概念可以用哪句成語形容？
  type: multiple_choice
  options:
  - 近朱者赤，近墨者黑 (Near Vermillion, One Becomes Red; Near Ink, One Becomes Black)，根據鄰居決定類別。
  - 知錯能改 (Knowing Mistakes and Correcting Them)，從錯誤中學習的過程。
  - 瞎子摸象 (Blind Men Touching an Elephant)，缺乏全面理解僅看到局部。
  - 三個臭皮匠，勝過諸葛亮 (Three Cobblers Surpass Zhuge Liang)，集體智慧優於個人。
  correct_index: 0
  explanation: KNN 透過觀察最近的鄰居來決定類別，即「近朱者赤」。
  tags:
  - chap-ai-foundation-chapter5
  - sec-knn
  usage: quiz
- id: 5005
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: KNN 演算法中，如果 K 值設得太小（如 K=1），容易發生什麼問題？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  - 模型過於簡單 (Model Too Simple)，無法捕捉資料中的複雜關係。
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化到新資料。
  - 計算速度變慢 (Slower Computation Speed)，需要更多時間進行預測。
  correct_index: 2
  explanation: K=1 代表只看最近的一個鄰居，容易受雜訊干擾，導致過度擬合。
  tags:
  - chap-ai-foundation-chapter5
  - sec-knn
  usage: quiz
- id: 5006
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 貝氏分類器 (Naive Bayes) 的「樸素/天真 (Naive)」假設是指什麼？
  type: multiple_choice
  options:
  - 假設資料呈常態分佈 (Assuming Data Follows Normal Distribution)，某些版本的假設。
  - 假設沒有雜訊 (Assuming No Noise)，資料完全乾淨無錯誤。
  - 假設類別數量很少 (Assuming Few Categories)，僅適用於少量類別。
  - 假設所有特徵之間互相獨立 (Assuming All Features Are Mutually Independent)
  correct_index: 3
  explanation: Naive Bayes 假設特徵之間互不影響（獨立），雖然這在現實中很少見，但簡化了計算。
  tags:
  - chap-ai-foundation-chapter5
  - sec-naive-bayes
  usage: quiz
- id: 5007
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 垃圾郵件過濾系統最常使用哪種演算法？
  type: multiple_choice
  options:
  - 貝氏分類器 (Naive Bayes)，計算速度快且擅長處理高維度文本特徵。
  - 線性迴歸 (Linear Regression)，用於預測連續數值的演算法。
  - K-Means，用於非監督式分群的演算法。
  - PCA (Principal Component Analysis)，用於降維的技術。
  correct_index: 0
  explanation: Naive Bayes 計算速度快且擅長處理高維度文本特徵，是垃圾郵件過濾的經典選擇。
  tags:
  - chap-ai-foundation-chapter5
  - sec-naive-bayes
  usage: quiz
- id: 5008
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 邏輯迴歸 (Logistic Regression) 雖然名字有迴歸，但它主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 路徑規劃 (Path Planning)，尋找最短路徑的優化問題。
  - 圖片生成 (Image Generation)，創造新影像的生成任務。
  - 二元分類 (Binary Classification)，預測兩個類別之一的任務。
  - 數值預測 (Numeric Prediction)，預測連續數值的迴歸任務。
  correct_index: 2
  explanation: 邏輯迴歸透過 Sigmoid 函數輸出機率，通常用於二元分類（如是/否）。
  tags:
  - chap-ai-foundation-chapter5
  - sec-logistic-regression
  usage: quiz
- id: 5009
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 邏輯迴歸使用哪個函數將數值壓縮到 0 到 1 之間？
  type: multiple_choice
  options:
  - Tanh (Hyperbolic Tangent)，將數值壓縮到 -1 到 1 之間的函數。
  - ReLU (Rectified Linear Unit)，將負數轉為 0 的激活函數。
  - Sigmoid，將數值壓縮到 0 到 1 之間的 S 型函數。
  - Softmax，將多個數值轉換為機率分佈的函數。
  correct_index: 2
  explanation: Sigmoid 函數呈 S 型曲線，能將任意實數映射到 (0, 1) 區間，代表機率。
  tags:
  - chap-ai-foundation-chapter5
  - sec-logistic-regression
  usage: quiz
- id: 5010
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 支援向量機 (SVM) 的核心目標是什麼？
  type: multiple_choice
  options:
  - 最大化決策邊界 (Margin)，在類別之間畫出最寬的分隔線。
  - 最大化樹的深度 (Maximizing Tree Depth)，增加決策樹的層數。
  - 最小化誤差平方和 (Minimizing Sum of Squared Errors)，減少預測誤差。
  - 最小化特徵數量 (Minimizing Feature Count)，減少使用的特徵數。
  correct_index: 0
  explanation: SVM 試圖在類別之間畫出一條最寬的「馬路」，即最大化邊界。
  tags:
  - chap-ai-foundation-chapter5
  - sec-svm
  usage: quiz
- id: 5011
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 當資料在低維空間無法線性分割時，SVM 使用什麼技巧解決？
  type: multiple_choice
  options:
  - 核函數技巧 (Kernel Trick)，將資料投影到高維空間使其線性可分。
  - 降維 (Dimensionality Reduction)，減少特徵維度的技術。
  - 特徵選擇 (Feature Selection)，選擇重要特徵的方法。
  - 隨機採樣 (Random Sampling)，隨機選擇資料樣本的方法。
  correct_index: 0
  explanation: Kernel Trick 將資料投影到高維空間，使其變得線性可分。
  tags:
  - chap-ai-foundation-chapter5
  - sec-svm
  usage: both
- id: 5012
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 決策樹 (Decision Tree) 的最大優點是什麼？
  type: multiple_choice
  options:
  - 可解釋性強 (White Box)，決策規則清晰易懂。
  - 不易過度擬合 (Less Prone to Overfitting)，模型較為穩健。
  - 計算速度最快 (Fastest Computation Speed)，預測速度極快。
  - 預測準確率最高 (Highest Prediction Accuracy)，在所有演算法中表現最佳。
  correct_index: 0
  explanation: 決策樹的規則（如年齡 > 30）清晰易懂，非專業人士也能理解，屬於白箱模型。
  tags:
  - chap-ai-foundation-chapter5
  - sec-decision-tree
  usage: both
- id: 5013
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 決策樹容易發生什麼問題，導致在訓練集表現很好但在測試集很差？
  type: multiple_choice
  options:
  - 梯度消失 (Gradient Vanishing)，神經網路訓練中的梯度問題。
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化到新資料。
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  - 無法收斂 (Cannot Converge)，模型無法達到穩定狀態。
  correct_index: 1
  explanation: 決策樹如果長得太深，會死記硬背訓練資料的細節（包含雜訊），導致過度擬合。
  tags:
  - chap-ai-foundation-chapter5
  - sec-decision-tree
  usage: both
- id: 5014
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 隨機森林 (Random Forest) 是由許多什麼模型組成的？
  type: multiple_choice
  options:
  - 邏輯迴歸 (Logistic Regression)，用於二元分類的線性模型。
  - 決策樹 (Decision Tree)，透過樹狀結構進行決策的模型。
  - 類神經網路 (Neural Networks)，模擬生物神經元的深度學習模型。
  - SVM (Support Vector Machine)，使用最大邊界原理的分類模型。
  correct_index: 1
  explanation: 隨機森林由許多棵決策樹組成，透過投票來決定最終結果。
  tags:
  - chap-ai-foundation-chapter5
  - sec-random-forest
  usage: both
- id: 5015
  chapter_title: 監督式學習演算法
  section_title: 集成學習
  text: Bagging (如隨機森林) 的主要目的是降低模型的什麼？
  type: multiple_choice
  options:
  - 雜訊 (Noise)，資料中的隨機誤差。
  - 維度 (Dimensionality)，特徵的數量。
  - 變異 (Variance)，模型對資料變化的敏感度。
  - 偏差 (Bias)，模型預測的系統性誤差。
  correct_index: 2
  explanation: Bagging 透過平均多個模型的結果，能有效降低變異，減少過度擬合。
  tags:
  - chap-ai-foundation-chapter5
  - sec-bagging
  usage: both
- id: 5016
  chapter_title: 監督式學習演算法
  section_title: 集成學習
  text: Boosting (如 XGBoost) 的主要目的是降低模型的什麼？
  type: multiple_choice
  options:
  - 特徵數 (Feature Count)，使用的特徵數量。
  - 資料量 (Data Volume)，訓練資料的數量。
  - 變異 (Variance)，模型對資料變化的敏感度。
  - 偏差 (Bias)，模型預測的系統性誤差。
  correct_index: 3
  explanation: Boosting 透過循序修正前一個模型的錯誤，能有效降低偏差，提升準確度。
  tags:
  - chap-ai-foundation-chapter5
  - sec-boosting
  usage: both
- id: 5017
  chapter_title: 監督式學習演算法
  section_title: 集成學習
  text: 下列關於 Bagging 和 Boosting 的比較，何者正確？
  type: multiple_choice
  options:
  - Bagging 是序列訓練，Boosting 是並行訓練 (Bagging: Sequential, Boosting: Parallel)，訓練順序相反。
  - 兩者都是序列訓練 (Both Are Sequential Training)，都需要依序訓練模型。
  - Bagging 是並行訓練，Boosting 是序列訓練 (Bagging: Parallel, Boosting: Sequential)
  - 兩者都是並行訓練 (Both Are Parallel Training)，都可以同時訓練多個模型。
  correct_index: 2
  explanation: Bagging (隨機森林) 的樹互不影響可同時訓練 (並行)；Boosting 的樹依賴前一棵樹的結果 (序列)。
  tags:
  - chap-ai-foundation-chapter5
  - sec-bagging-vs-boosting
  usage: both
- id: 5018
  chapter_title: 監督式學習演算法
  section_title: 迴歸演算法
  text: 線性迴歸 (Linear Regression) 使用什麼作為損失函數？
  type: multiple_choice
  options:
  - 交叉熵 (Cross Entropy)，用於分類任務的損失函數。
  - 均方誤差 (MSE) (Mean Squared Error)，用於迴歸任務的損失函數。
  - F1-Score，用於評估分類模型效能的指標。
  - 準確率 (Accuracy)，用於評估分類模型正確率的指標。
  correct_index: 1
  explanation: 線性迴歸通常使用 MSE (預測值與真實值的距離平方和) 來評估誤差。
  tags:
  - chap-ai-foundation-chapter5
  - sec-linear-regression
  usage: both
- id: 5019
  chapter_title: 監督式學習演算法
  section_title: 迴歸演算法
  text: Lasso 回歸 (L1 正則化) 的主要功能是什麼？
  type: multiple_choice
  options:
  - 處理共線性 (Handling Multicollinearity)，解決特徵間高度相關的問題。
  - 將權重變大 (Increasing Weights)，放大模型參數的數值。
  - 增加模型複雜度 (Increasing Model Complexity)，讓模型更複雜以學習更多模式。
  - 特徵選擇 (將不重要特徵權重變為 0) (Feature Selection: Setting Unimportant Feature Weights to Zero)
  correct_index: 3
  explanation: Lasso 加入絕對值懲罰項，傾向於將不重要的特徵權重壓縮至 0，達到特徵選擇的效果。
  tags:
  - chap-ai-foundation-chapter5
  - sec-regularized-regression
  usage: both
- id: 5020
  chapter_title: 監督式學習演算法
  section_title: 迴歸演算法
  text: Ridge 回歸 (L2 正則化) 主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 共線性 (Multicollinearity) 與過度擬合 (Multicollinearity and Overfitting)
  - 資料缺失 (Missing Data)，處理缺失值的問題。
  - 特徵選擇 (Feature Selection)，選擇重要特徵的方法。
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  correct_index: 0
  explanation: Ridge 加入平方懲罰項，能限制權重大小，防止共線性導致的參數不穩定。
  tags:
  - chap-ai-foundation-chapter5
  - sec-regularized-regression
  usage: both
- id: 5021
  chapter_title: 監督式學習演算法
  section_title: 演算法比較
  text: 如果需要向監管單位解釋拒絕貸款的原因，應優先選擇哪種模型？
  type: multiple_choice
  options:
  - 深度神經網路 (Deep Neural Networks)，複雜的黑箱模型難以解釋。
  - 決策樹 (Decision Tree)，提供清晰規則路徑的白箱模型。
  - SVM (Support Vector Machine)，使用最大邊界原理的分類模型。
  - 隨機森林 (Random Forest)，由多棵決策樹組成的集成模型。
  correct_index: 1
  explanation: 決策樹提供清晰的規則路徑，解釋性最強，適合需要合規解釋的場景。
  tags:
  - chap-ai-foundation-chapter5
  - sec-algo-comparison
  usage: both
- id: 5022
  chapter_title: 監督式學習演算法
  section_title: 演算法比較
  text: 在 Kaggle 比賽中，哪種演算法常因其強大的效能而獲勝？
  type: multiple_choice
  options:
  - XGBoost / LightGBM (Boosting)，基於梯度提升的強大集成學習演算法。
  - KNN (K-Nearest Neighbors)，基於距離計算的簡單分類演算法。
  - 線性迴歸 (Linear Regression)，用於預測連續數值的基礎模型。
  - Naive Bayes，基於機率的快速分類演算法。
  correct_index: 0
  explanation: 基於 Gradient Boosting 的演算法 (如 XGBoost) 因其極高的準確率，是競賽中的常勝軍。
  tags:
  - chap-ai-foundation-chapter5
  - sec-algo-comparison
  usage: both
- id: 5023
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: KNN 是一種 Lazy Learning，這意味著什麼？
  type: multiple_choice
  options:
  - 它沒有顯式的訓練過程，預測時才進行計算 (No Explicit Training Process, Computation Only During Prediction)
  - 它只能處理簡單問題 (Can Only Handle Simple Problems)，適用範圍有限。
  - 它需要訓練很久 (Requires Long Training Time)，訓練過程耗時。
  - 它很懶，不想學習 (Too Lazy to Learn)，不願意進行學習過程。
  correct_index: 0
  explanation: KNN 在訓練階段只是把資料存起來，直到預測時才計算距離，因此稱為 Lazy Learning。
  tags:
  - chap-ai-foundation-chapter5
  - sec-knn
  usage: both
- id: 5024
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: SVM 中的「支援向量」指的是？
  type: multiple_choice
  options:
  - 異常值 (Outliers)，與正常資料差異極大的資料點。
  - 落在決策邊界邊緣、決定邊界位置的關鍵資料點 (Key Data Points on Decision Boundary Edges That Determine Boundary Position)
  - 所有的資料點 (All Data Points)，資料集中的每一個樣本。
  - 中心點 (Center Point)，資料分佈的中心位置。
  correct_index: 1
  explanation: 只有落在 Margin 邊緣的點（支援向量）會影響 SVM 的決策邊界，其他點都不重要。
  tags:
  - chap-ai-foundation-chapter5
  - sec-svm
  usage: both
- id: 5025
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
