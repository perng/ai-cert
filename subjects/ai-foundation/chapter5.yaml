- id: 5056
  chapter_title: 監督式學習演算法
  section_title: 回歸演算法
  text: 線性回歸的基本假設中，若違反了「殘差變異數同質性 (Homoscedasticity)」，會發生什麼事？
  type: multiple_choice
  options:
  - 模型的預測值會變成負數
  - 模型會自動轉變成非線性回歸
