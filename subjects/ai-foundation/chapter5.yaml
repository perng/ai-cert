- id: 5051
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 在癌症篩檢模型中，我們通常更看重 Recall (召回率) 而非 Precision (精確率)，原因是？
  type: multiple_choice
  options:
  - 因為醫院希望找出越少病人越好 (Hospitals Want to Find Fewer Patients)，減少醫療負擔。
  - 因為漏掉一個真正有病的患者 (False Negative) 可能導致延誤治療甚至死亡，代價遠高於虛驚一場 (Missing a Truly Sick Patient May Lead to Delayed Treatment or Death, Cost Far Exceeds False Alarm)
  - 因為誤判一個健康人有病 (False Positive) 後果很嚴重 (Misdiagnosing a Healthy Person Has Serious Consequences)，會造成不必要的恐慌。
  - 因為 Recall 計算比較簡單 (Recall Calculation is Simpler)，計算過程較為容易。
  correct_index: 1
  explanation: 在攸關性命的篩檢中，寧可錯殺一百（誤判有病再複檢），不可放過一個（漏判導致病情惡化）。
  tags:
  - sec-ai-chapter5
  - sec-classification
  usage: both
- id: 5052
  chapter_title: 監督式學習演算法
  section_title: 集成學習
  text: Bagging (如 Random Forest) 與 Boosting (如 XGBoost) 的主要區別在於？
  type: multiple_choice
  options:
  - Bagging 是串列訓練，Boosting 是平行訓練 (Bagging: Sequential, Boosting: Parallel)，訓練順序相反。
  - Bagging 透過並行訓練多個獨立模型來降低變異數 (Variance)，Boosting 透過循序修正前一個模型的錯誤來降低偏差 (Bias) (Bagging: Parallel Training to Reduce Variance, Boosting: Sequential Error Correction to Reduce Bias)
  - Bagging 只能用於分類，Boosting 只能用於回歸 (Bagging Only for Classification, Boosting Only for Regression)，任務類型限制。
  - Bagging 容易過擬合，Boosting 不容易過擬合 (Bagging Prone to Overfitting, Boosting Not Prone to Overfitting)，過擬合傾向相反。
  correct_index: 1
  explanation: Bagging 是「三個臭皮匠勝過諸葛亮」（多樣性投票），Boosting 是「知錯能改，善莫大焉」（專注改進錯誤）。
  tags:
  - sec-ai-chapter5
  - sec-ensemble
  usage: both
- id: 5053
  chapter_title: 監督式學習演算法
  section_title: 回歸演算法
  text: 當特徵數量多於樣本數量，或特徵間存在高度共線性 (Multicollinearity) 時，為何 Ridge Regression (L2) 優於一般
    Linear Regression？
  type: multiple_choice
  options:
  - 因為 Ridge 不需要截距項
  - 因為 Ridge 引入了懲罰項，限制了係數的大小，避免模型對雜訊過度敏感而導致過擬合
  - 因為 Ridge 計算速度比較快
  - 因為 Ridge 可以將係數變為 0
  correct_index: 1
  explanation: 共線性會導致最小平方法 (OLS) 的解不穩定（係數暴增），L2 正則化透過約束係數大小來穩定模型。
  tags:
  - sec-ai-chapter5
  - sec-regression
  usage: both
- id: 5054
  chapter_title: 監督式學習演算法
  section_title: 分類演算法
  text: 決策樹 (Decision Tree) 最大的缺點是容易過擬合，通常透過什麼方式來解決？
  type: multiple_choice
  options:
  - 不做任何處理
  - 使用更多的特徵
  - 增加樹的深度
  - 剪枝 (Pruning) 或限制樹的最大深度 (Max Depth)
  correct_index: 3
  explanation: 決策樹若不加限制，會生長到每個葉節點只有一個樣本，完全記住訓練資料。剪枝能簡化模型，提升泛化能力。
  tags:
  - sec-ai-chapter5
  - sec-classification
  usage: both
- id: 5055
  chapter_title: 監督式學習演算法
  section_title: 集成學習
  text: 隨機森林 (Random Forest) 中的「隨機」體現在哪兩個方面？
  type: multiple_choice
  options:
  - 隨機決定樹的深度、隨機決定葉節點數量
  - 隨機輸出預測結果、隨機刪除資料
