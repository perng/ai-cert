- id: 12033
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: Google 產品線與資訊防護
  text: 相較於將數位浮水印直接顯示於影片角落（Visible Watermark），採用 SynthID 這類隱含式像素級浮水印的主要考量為何？
  type: multiple_choice
  options:
  - 隱含式浮水印可以無限期保存於區塊鏈上
  - 隱含式浮水印不會破壞觀看體驗與畫面美感，同時依然能讓演算法偵測其為 AI 生成
  - 隱含式浮水印可以完全取代影片壓縮演算法
  - 隱含式浮水印能夠自動追蹤上傳者的 GPS 定位
  correct_index: 1
  explanation: 商業級影片或圖片不希望因為印上明顯的浮水印而破壞畫面美感與實用性。隱含式浮水印（如 SynthID）能在不被人眼察覺的狀態下達到防偽目的，兼顧了品質與安全性。
  tags:
