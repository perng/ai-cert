  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 下列哪一項功能屬於進階 AI 程式碼輔助工具（如 Agentic IDEs）能做到，但傳統基礎語法補全工具做不到的？
  type: multiple_choice
  options:
  - 根據目前游標前方的文字預測下一個單字
  - 顯示該語言的標準函數庫說明書
  - 讀取多個檔案後直接制定修改計畫、自動編輯程式碼、執行測試並修正發現的錯誤
  - 將程式碼文字標上不同的顏色以利閱讀
  correct_index: 2
  explanation: 傳統的補全工具（如早期版本）只能進行片段預測。新一代的 Agent-based 開發工具（如 Cursor 等）具備跨檔案分析、多步規劃、自動編輯與自主 debug 的能力，這也是「代理式修改」的核心特徵。
  tags:
