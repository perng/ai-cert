- id: 12026
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: OpenAI 產品線與前沿技術
  text: 針對多代理系統 (Multi-Agent System) 中常見的「錯誤傳遞」風險，以下何種描述最為貼切？
  type: multiple_choice
  options:
  - 前端網頁發生 UI 顯示錯誤，直接導致後端資料庫當機
  - 某個 Agent 產生幻覺或抓錯資料，下游負責決策或執行的 Agent 盲目相信該資料並採取錯誤行動
  - 模型在訓練時將不相關的標籤連結在一起
  - 浮水印技術無法被解碼器成功讀取
  correct_index: 1
  explanation: 在多代理協作流程（如 Research ➔ Plan ➔ Execute）中，若上游的 Researcher Agent 產生了錯誤資訊，下游的 Execute Agent 沒有查證能力，就會將錯誤放大並執行，這就是多代理系統特有的「錯誤傳遞」風險。
  tags:
  - chap-ai-foundation-chapter12
  - sec-agentkit
  usage: quiz
- id: 12027
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: Google 產品線與資訊防護
  text: 關於 Gemini 1.5 Pro 等支援「長上下文 (Long Context)」的 AI 模型，其最重要的突破在於？
  type: multiple_choice
  options:
  - 模型不再需要 GPU 即可在手機端極速運行
  - 能夠原生處理長達數十萬甚至百萬級別的 Token，開發者可直接餵入整本厚重手冊而不需切片檢索
  - 能夠自動編譯執行任何程式語言，達到零錯誤率
  - 成功消滅了大型語言模型所有的幻覺問題
  correct_index: 1
  explanation: 長上下文模型最大的進展是記憶容量的巨幅提升（從早期 4K 提升至 1M/2M Token）。這使得「全文本分析」成為可能，開發者不一定要依賴複雜的文本切片與檢索 (RAG) 技術，就能讓模型了解大範圍的上下文。
  tags:
  - chap-ai-foundation-chapter12
  - sec-gemini-veo
  usage: quiz
- id: 12028
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: OpenAI 產品線與前沿技術
  text: 開發者透過 Agent 框架整合企業內部系統時，為了防止模型遭到提示注入 (Prompt Injection) 後惡意刪除資料庫，最有效的防範措施是？
  type: multiple_choice
  options:
  - 限制該 Agent 連接器 (Connector) 的權限，僅賦予「唯讀 (Read-only)」或最低必要權限
  - 只允許模型使用文言文回應使用者
  - 每天重新啟動伺服器一次
  - 在 Prompt 中大聲警告模型「絕對不可以做壞事」
  correct_index: 0
  explanation: 在 Agent 安全治理中，「最小權限原則」最為關鍵。不要賦予 Agent 超過其任務所需的權限，若 Agent 只需查詢訂單，就不應給予刪除訂單或修改資料庫的權限，這是防止提示注入導致破壞性後果的底線防禦。
  tags:
  - chap-ai-foundation-chapter12
  - sec-agentkit
  usage: quiz
- id: 12029
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 企業在提升工程師使用 AI Coding 效率的培訓中，對於「提問能力 (Prompting)」最正確的指導原則是什麼？
  type: multiple_choice
  options:
  - 只需給予最短的指令（例如：「幫我寫一個登入功能」），讓 AI 自由發揮
  - 提供豐富的上下文，包含需求限制、錯誤訊息、既有系統架構與具體的驗收條件
  - 故意給出錯誤的邏輯，測試 AI 能不能自行發現
  - 每次提問前都要輸入長達五千字的背景知識
  correct_index: 1
  explanation: 好的 Prompt 是成功的一半。開發者應將 AI 視為新進員工，提供清晰明確的上下文、約束條件、相關檔案與錯誤訊息，AI 才能給出符合專案風格且具體的程式碼建議。
  tags:
  - chap-ai-foundation-chapter12
  - sec-coding-tools-adoption
  usage: quiz
- id: 12030
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: Google 產品線與資訊防護
  text: 在企業導入 AI 內容生成時，若特別強調「所產出的廣告影片不可出現物理動態異常（如主角手指突然增加或汽車倒著開）」，應優先評估模型的哪一項指標？
  type: multiple_choice
  options:
  - 文字生成速度 (Tokens per second)
  - 時空一致性 (Spatiotemporal Consistency)
