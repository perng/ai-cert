  - 文字壓縮與摘要能力
  correct_index: 2
  explanation: Agent 要能執行自動化任務（如寫腳本並丟給 Selenium 執行），最關鍵的就是讓模型擁有呼叫外部工具的能力（Tool Calling）。這讓 LLM 突破純文字世界的限制，與真實軟體環境互動。
