- id: 12032
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: OpenAI 產品線與前沿技術
  text: 若企業需開發一套「全自動化的軟體測試 AI Agent」，該 Agent 需要能讀取測試計畫、撰寫測試腳本、呼叫 Selenium 執行測試並回報結果。這種架構最依賴 LLM 的哪一項延伸能力？
  type: multiple_choice
  options:
  - 多國語言翻譯能力
  - 圖像識別能力
