- id: 12021
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: 商用模型選型比較
  text: 某法律事務所需要一套 AI 系統來閱讀一份長達三百頁的法庭紀錄，並從中摘要特定證人的證詞。若不需要頻繁更新資料或追蹤細部引用權限，下列何種技術最能以最簡單架構滿足需求？
  type: multiple_choice
  options:
  - 即時端到端語音模型 (GPT-Realtime)
  - 具備超大上下文窗口的模型 (如 Gemini 1.5 Pro)
  - Agent 流程編排框架 (如 AgentKit)
  - 內容出處證明標準 (C2PA)
  correct_index: 1
  explanation: 處理一次性、固定且篇幅龐大（如數百頁）的單一文件摘要，最適合直接利用長上下文模型 (Long Context Window)，無須額外建置 RAG 或複雜的代理系統。
  tags:
  - chap-ai-foundation-chapter12
  - sec-commercial-model-selection
  usage: quiz
- id: 12022
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 開發者使用 AI 程式碼輔助工具時，模型給出的建議品質往往取決於「上下文 (Context)」。下列何者「不是」現代 AI 開發工具常用來提升建議品質的上下文來源？
  type: multiple_choice
  options:
  - 開發者目前正在編輯的檔案內容與相鄰的分頁
  - 終端機 (Terminal) 的錯誤輸出訊息
  - 開發者私人社群軟體上的對話紀錄
  - 專案程式碼庫的全局索引 (Codebase Indexing)
  correct_index: 2
  explanation: AI Coding Assistants 會讀取開發環境中的檔案、分頁、終端機輸出與專案索引來補充電腦語言的上下文。但它們無法（也不應）讀取開發者與工作無關的私人社群軟體紀錄，這會引發嚴重的隱私問題。
  tags:
  - chap-ai-foundation-chapter12
  - sec-coding-tools-mechanism
  usage: quiz
- id: 12023
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 在企業導入 AI 輔助寫程式工具時，會面臨「授權與版權風險」。這主要是指什麼情況？
  type: multiple_choice
  options:
  - AI 工具必須每年重新付費授權才能使用
  - 生成的程式碼可能過度雷同於開源社群受保護的片段，導致企業產品違反開源授權條款
  - 企業開發者喪失了自身程式碼的著作權
  - 開發者不小心將自己的銀行帳號寫入程式碼中
  correct_index: 1
  explanation: LLM 訓練自海量開源程式碼，有時會直接「背誦」出帶有 GPL 或其他限制性授權條款的程式片段。企業若照單全收，可能會面臨版權侵權與違約的法律風險。
  tags:
  - chap-ai-foundation-chapter12
  - sec-coding-tools-limits
  usage: quiz
- id: 12024
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 當開發者要求 AI 幫忙撰寫一段複雜的演算法，AI 回傳了看起來專業且富有說服力的解釋與程式碼。下列哪一種態度是企業應極力避免的「過度信任風險」？
  type: multiple_choice
  options:
  - 因為 AI 解釋得很合理，所以省略單元測試與人工 Code Review 直接推送到主分支
  - 將程式碼複製到沙盒環境中進行單元測試與邊界值測試
  - 使用 SAST (靜態應用程式安全測試) 工具掃描 AI 產生的程式碼
  - 邀請另一位資深工程師進行人工代碼審查
  correct_index: 0
  explanation: AI 的「文字接龍」特性使其極擅長產生「聽起來很有道理的廢話」或包含隱蔽漏洞的程式碼。省略測試與審查是過度信任的最大風險，正確作法是將 AI 當作不可信的實習生，嚴格檢驗其產出。
  tags:
  - chap-ai-foundation-chapter12
  - sec-coding-tools-limits
  usage: quiz
- id: 12025
  chapter_title: 2024-2025 主流商用模型與應用生態
  section_title: AI 程式碼輔助工具 (AI Coding Assistants)
  text: 企業制定「AI Coding 導入建議流程」時，首要之務為何？
  type: multiple_choice
  options:
  - 立刻裁撤 30% 的初階工程師以節省成本
  - 訂定明確的使用政策，規範哪些程式碼與內部機密可提供給 AI 工具
  - 關閉所有版本控制系統，完全依賴 AI 工具的記憶
