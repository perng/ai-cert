  - RAG 檢索準確度 (Context Precision)
  correct_index: 1
  explanation: 生成影片最容易出現的問題是物體隨時間改變形狀或違反物理規律。「時空一致性」是衡量影片生成模型（如 Sora、Veo）品質的最關鍵指標。
