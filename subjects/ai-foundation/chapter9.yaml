  - '最終效能評估 (不可用於訓練或調整) (Final Performance Evaluation: Cannot Be Used for Training or Adjustment)'
  - 沒用 (No Use)，完全沒有用途。
  correct_index: 2
  explanation: 測試集模擬真實上線環境，必須完全隔離，以確保評估的客觀性。
