- chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: 情境：早停 (Early Stopping) 的運作機制是？
  type: multiple_choice
  options:
  - 訓練固定次數後停止 (Stopping After Fixed Number of Training Iterations)，預設訓練週期。
  - 當驗證集誤差開始上升時停止訓練 (Stopping Training When Validation Set Error Starts Increasing)
  - 當訓練集誤差為 0 時停止 (Stopping When Training Set Error Reaches Zero)，可能導致過擬合。
  - 隨機停止 (Random Stopping)，無系統性地結束訓練。
  correct_index: 1
  explanation: 監控驗證集誤差，一旦發現誤差不降反升（開始過擬合），即刻停止訓練。
