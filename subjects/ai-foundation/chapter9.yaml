questions:
- id: 9001
  chapter_title: 模型評估與效能優化
  section_title: 資料集劃分 (Data Splitting)
  text: 在機器學習中，將資料集劃分為訓練集、驗證集和測試集的主要目的是？
  type: multiple_choice
  options:
  - 增加資料量 (Increasing Data Volume)，擴充訓練資料集。
  - '公平評估模型效能，避免作弊（偷看答案）(Fairly Evaluating Model Performance, Avoiding Cheating: Peeking at Answers)'
  - 減少計算時間 (Reducing Computation Time)，縮短處理時間。
  - 方便儲存 (Convenient Storage)，簡化資料管理。
  correct_index: 1
  explanation: 透過劃分資料集，確保模型在未見過的資料上進行測試，以評估其真實的泛化能力。
  tags:
  - chap-ai-foundation-chapter9
  - sec-data-split
  usage: quiz
- id: 9002
  chapter_title: 模型評估與效能優化
  section_title: 資料集劃分 (Data Splitting)
  text: 驗證集 (Validation Set) 的主要用途是什麼？
  type: multiple_choice
  options:
  - 最終效能評估 (Final Performance Evaluation)，屬於測試集的用途。
  - 資料增強 (Data Augmentation)，擴充訓練資料的方法。
  - 調整超參數 (Hyperparameters) 與挑選最佳模型 (Adjusting Hyperparameters and Selecting Best Model)
  - 訓練模型權重 (Training Model Weights)，屬於訓練集的用途。
  correct_index: 2
  explanation: 驗證集就像模擬考，用來在訓練過程中評估模型表現，以調整學習率、樹的深度等超參數。
  tags:
  - chap-ai-foundation-chapter9
  - sec-data-split
  usage: quiz
- id: 9003
  chapter_title: 模型評估與效能優化
  section_title: K-fold 交叉驗證 (Cross-Validation)
  text: K-fold 交叉驗證 (Cross-Validation) 的主要優點是？
  type: multiple_choice
  options:
  - 不需要測試集 (No Test Set Required)，可以省略測試階段。
  - 可以自動調整參數 (Can Automatically Adjust Parameters)，自動化超參數優化。
  - 每一筆資料都有機會被用來訓練和驗證，評估結果更穩健 (Every Data Point Has Opportunity to Be Used for Training and Validation, More Robust Evaluation Results)
  - 計算速度最快 (Fastest Computation Speed)，處理效率最高。
  correct_index: 2
  explanation: K-fold 輪流使用不同部分的資料當驗證集，能避免因資料切分運氣好壞而導致的評估偏差。
  tags:
  - chap-ai-foundation-chapter9
  - sec-cross-validation
  usage: quiz
- id: 9004
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 混淆矩陣 (Confusion Matrix) 中的 TP (True Positive) 代表什麼？
  type: multiple_choice
  options:
  - '實際有病，預測有病（抓到了）(Actually Sick, Predicted Sick: Caught)，真陽性 (True Positive)。'
  - 實際沒病，預測有病 (Actually Not Sick, Predicted Sick)，假陽性 (False Positive)。
  - 實際有病，預測沒病 (Actually Sick, Predicted Not Sick)，假陰性 (False Negative)。
  - 實際沒病，預測沒病 (Actually Not Sick, Predicted Not Sick)，真陰性 (True Negative)。
  correct_index: 0
  explanation: True Positive (真陽性) 代表模型正確地預測了正類別（如成功抓到病人）。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9005
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 在資料極度不平衡的情況下（如詐欺偵測），哪個指標最容易產生誤導？
  type: multiple_choice
  options:
  - Precision (精確率)，預測為正的樣本中真正為正的比例。
  - Recall (召回率)，所有正樣本中被成功找出的比例。
  - Accuracy (準確率) (Accuracy)，所有預測中正確的比例。
  - F1-Score，精確率與召回率的調和平均數。
  correct_index: 2
  explanation: 如果詐欺只佔 1%，模型全部猜「正常」也有 99% 準確率，但完全沒用，因此 Accuracy 會騙人。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9006
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 精確率 (Precision) 的定義是？
  type: multiple_choice
  options:
  - 所有被判斷為有病的人中，真的有病的比例 (Proportion of Actually Sick Among Those Predicted Sick)，精確率 (Precision) 的定義。
  - 預測錯誤的比例 (Proportion of Prediction Errors)，錯誤率的定義。
  - 答對的總比例 (Overall Proportion of Correct Answers)，準確率 (Accuracy) 的定義。
  - 所有真的有病的人中，被抓到的比例 (Proportion of Actually Sick Caught)，召回率 (Recall) 的定義。
  correct_index: 0
  explanation: Precision 關注的是「預測為正」的樣本中，有多少是真的正樣本（寧缺勿濫）。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9007
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 召回率 (Recall) 的定義是？
  type: multiple_choice
  options:
  - 預測錯誤的比例 (Proportion of Prediction Errors)，錯誤率的定義。
  - 所有被判斷為有病的人中，真的有病的比例 (Proportion of Actually Sick Among Those Predicted Sick)，精確率 (Precision) 的定義。
  - 答對的總比例 (Overall Proportion of Correct Answers)，準確率 (Accuracy) 的定義。
  - 所有真的有病的人中，被成功抓出來的比例 (Proportion of Actually Sick Successfully Caught)
  correct_index: 3
  explanation: Recall 關注的是「真實為正」的樣本中，有多少被模型成功找出來（寧濫勿缺）。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9008
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 癌症篩檢模型應該最重視哪個指標？
  type: multiple_choice
  options:
  - Precision (精確率)，預測為正的樣本中真正為正的比例。
  - Recall (召回率)，所有正樣本中被成功找出的比例。
  - MSE (Mean Squared Error)，用於迴歸任務的損失函數。
  - Accuracy (準確率)，所有預測中正確的比例。
  correct_index: 1
  explanation: 癌症篩檢漏診後果嚴重（人命關天），因此希望盡可能抓出所有病人，即最大化 Recall。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9009
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 垃圾郵件過濾應該最重視哪個指標？
  type: multiple_choice
  options:
  - MAE (Mean Absolute Error)，用於迴歸任務的損失函數。
  - Recall (召回率)，所有正樣本中被成功找出的比例。
  - Precision (精確率)，預測為正的樣本中真正為正的比例。
  - Accuracy (準確率)，所有預測中正確的比例。
  correct_index: 2
  explanation: 使用者很討厭重要信件被誤判為垃圾信（False Positive），因此希望預測為垃圾信的準度要高，即最大化 Precision。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9010
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: F1-Score 是哪兩個指標的調和平均數？
  type: multiple_choice
  options:
  - MSE 和 MAE (MSE and MAE)，用於迴歸任務的損失函數。
  - TPR 和 FPR (TPR and FPR)，真陽性率與假陽性率。
  - Accuracy 和 Recall (Accuracy and Recall)，準確率與召回率。
  - Precision 和 Recall (Precision and Recall)，精確率與召回率的調和平均數。
  correct_index: 3
  explanation: F1-Score 綜合考量了 Precision 和 Recall，適用於需要平衡兩者的場景。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: quiz
- id: 9011
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: AUC-ROC 曲線中，AUC = 0.5 代表模型的表現如何？
  type: multiple_choice
  options:
  - 預測完全相反 (Predictions Completely Opposite)，所有預測都錯誤。
  - 完美預測 (Perfect Predictions)，所有預測都正確。
  - 跟隨機亂猜一樣 (Same as Random Guessing)，預測能力等同於隨機。
  - 非常準確 (Very Accurate)，預測正確率極高。
  correct_index: 2
  explanation: AUC = 0.5 代表 ROC 曲線是對角線，意味著模型沒有鑑別力，跟丟銅板亂猜一樣。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: both
- id: 9012
  chapter_title: 模型評估與效能優化
  section_title: 迴歸指標 (Regression Metrics)
  text: 均方誤差 (MSE) 的特點是？
  type: multiple_choice
  options:
  - 數值範圍在 0 到 1 之間 (Value Range Between 0 and 1)，標準化的數值範圍。
  - 對離群值不敏感 (Not Sensitive to Outliers)，不受極端值影響。
  - 會放大極端誤差（因為平方）(Amplifies Extreme Errors Due to Squaring)
  - 只能用於分類 (Only for Classification)，僅適用於分類任務。
  correct_index: 2
  explanation: MSE 計算誤差的平方和，因此大誤差的影響會被顯著放大，適合用於懲罰大錯的模型。
  tags:
  - chap-ai-foundation-chapter9
  - sec-regression-metrics
  usage: both
- id: 9013
  chapter_title: 模型評估與效能優化
  section_title: 迴歸指標 (Regression Metrics)
  text: R-squared (決定係數) 為 1 代表什麼？
  type: multiple_choice
  options:
  - 模型完全無法解釋資料變異 (Model Completely Cannot Explain Data Variance)，R² = 0 的情況。
  - 模型完美擬合所有資料點 (Model Perfectly Fits All Data Points)，R² = 1 的情況。
  - 模型跟猜平均值一樣 (Model Same as Guessing Mean)，R² = 0 的情況。
  - 模型過度擬合 (Model Overfitting)，模型過於複雜無法泛化。
  correct_index: 1
  explanation: R-squared = 1 表示預測值與真實值完全一致，沒有任何殘差。
  tags:
  - chap-ai-foundation-chapter9
  - sec-regression-metrics
  usage: both
- id: 9014
  chapter_title: 模型評估與效能優化
  section_title: 偏差-變異權衡 (Bias-Variance Tradeoff)
  text: 高偏差 (High Bias) 通常對應到什麼問題？
  type: multiple_choice
  options:
  - 資料不平衡 (Data Imbalance)，不同類別的樣本數量差異極大。
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  - 計算錯誤 (Calculation Error)，演算法計算過程有誤。
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化到新資料。
  correct_index: 1
  explanation: 高偏差代表模型太簡單，連訓練集的規律都學不會，即欠擬合。
  tags:
  - chap-ai-foundation-chapter9
  - sec-bias-variance
  usage: both
- id: 9015
  chapter_title: 模型評估與效能優化
  section_title: 偏差-變異權衡 (Bias-Variance Tradeoff)
  text: 高變異 (High Variance) 通常對應到什麼問題？
  type: multiple_choice
  options:
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化到新資料。
  - 資料太少 (Insufficient Data)，訓練資料量不足。
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  - 模型太簡單 (Model Too Simple)，模型複雜度不足。
  correct_index: 0
  explanation: 高變異代表模型在訓練集表現很好，但在驗證集表現很差，即過度擬合。
  tags:
  - chap-ai-foundation-chapter9
  - sec-bias-variance
  usage: both
- id: 9016
  chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: 下列何者不是解決過度擬合 (Overfitting) 的方法？
  type: multiple_choice
  options:
  - 使用 Dropout (Using Dropout)，隨機關閉部分神經元防止過擬合。
  - 使用 L2 正則化 (Using L2 Regularization)，限制權重大小防止過擬合。
  - 增加資料量 (Increasing Data Volume)，擴充訓練資料集。
  - '增加模型複雜度（如加深網路）(Increasing Model Complexity: e.g., Deepening Network)，會加劇過擬合。'
  correct_index: 3
  explanation: 增加模型複雜度會讓模型更容易死記硬背，反而會加重過度擬合。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  usage: both
- id: 9017
  chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: L1 正則化 (Lasso) 的特殊效果是？
  type: multiple_choice
  options:
  - '讓不重要的特徵權重變成 0 (特徵選擇) (Making Unimportant Feature Weights Zero: Feature Selection)'
  - 讓權重變大 (Making Weights Larger)，放大模型參數。
  - 讓所有權重相等 (Making All Weights Equal)，統一參數數值。
  - 增加計算時間 (Increasing Computation Time)，延長處理時間。
  correct_index: 0
  explanation: L1 正則化傾向於產生稀疏解，即將不重要的特徵係數壓縮為 0。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  usage: both
- id: 9018
  chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: Dropout 機制是如何運作的？
  type: multiple_choice
  options:
  - 停止訓練 (Stopping Training)，提前結束訓練過程。
  - 刪除訓練資料 (Deleting Training Data)，移除部分訓練樣本。
  - 訓練時隨機關閉一部分神經元 (Randomly Closing Some Neurons During Training)
  - 刪除錯誤的標籤 (Deleting Wrong Labels)，移除不正確的標註。
  correct_index: 2
  explanation: Dropout 在每次迭代中隨機讓部分神經元失活，強迫網路學習分散特徵，避免依賴特定路徑。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  usage: both
- id: 9019
  chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: 早停 (Early Stopping) 是監控哪個數據來決定何時停止訓練？
  type: multiple_choice
  options:
  - 測試集誤差 (Test Loss)，最終評估模型的誤差。
  - 訓練集誤差 (Training Loss)，模型在訓練資料上的誤差。
  - 驗證集誤差 (Validation Loss)，用於調整超參數的誤差指標。
  - 訓練時間 (Training Time)，模型訓練所需的時間。
  correct_index: 2
  explanation: 當訓練集誤差下降但驗證集誤差開始上升時，代表過擬合開始，此時應停止訓練。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  usage: both
- id: 9020
  chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: 資料增強 (Data Augmentation) 的主要目的是？
  type: multiple_choice
  options:
  - 透過變換原始資料創造新樣本，增加資料多樣性以抗過擬合 (Creating New Samples Through Transforming Original Data, Increasing Data Diversity to Resist Overfitting)
  - 修正錯誤標籤 (Correcting Wrong Labels)，修正不正確的標註。
  - 壓縮圖片 (Compressing Images)，減少影像檔案大小。
  - 減少資料量 (Reducing Data Volume)，縮小訓練資料集。
  correct_index: 0
  explanation: 資料增強透過旋轉、裁切等方式擴充訓練資料，讓模型看過更多變體，提升泛化能力。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  usage: both
- id: 9021
  chapter_title: 模型評估與效能優化
  section_title: 資料集劃分 (Data Splitting)
  text: 測試集 (Test Set) 絕對不能用於什麼用途？
  type: multiple_choice
  options:
  - 計算 Accuracy
  - 訓練模型或調整超參數
  - 最終效能評估
  - 計算 Confusion Matrix
  correct_index: 1
  explanation: 測試集必須保持純淨，若用於訓練或調參（偷看答案），評估結果將失去公信力（資料洩漏）。
  tags:
  - chap-ai-foundation-chapter9
  - sec-data-split
  usage: both
- id: 9022
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 混淆矩陣中，FN (False Negative) 代表？
  type: multiple_choice
  options:
  - '誤報 (沒病判有病) (False Alarm: Not Sick But Predicted Sick)，假陽性 (False Positive)。'
  - '漏報 (有病判沒病) (Missed Case: Sick But Predicted Not Sick)，假陰性 (False Negative)。'
  - 正確排除 (Correctly Excluded)，真陰性 (True Negative)。
  - 正確抓到 (Correctly Caught)，真陽性 (True Positive)。
  correct_index: 1
  explanation: False Negative (假陰性) 代表實際是正樣本（有病），但模型錯誤預測為負樣本（沒病），即漏報。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: both
- id: 9023
  chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: ROC 曲線的 X 軸和 Y 軸分別是？
  type: multiple_choice
  options:
  - Precision 和 Recall (Precision and Recall)，精確率與召回率。
  - Accuracy 和 Loss (Accuracy and Loss)，準確率與損失函數。
  - TP 和 TN (TP and TN)，真陽性與真陰性。
  - 'FPR (誤報率) 和 TPR (召回率) (FPR: False Positive Rate and TPR: Recall)，假陽性率與真陽性率。'
  correct_index: 3
  explanation: ROC 曲線描繪了在不同門檻下，FPR (False Positive Rate) 與 TPR (True Positive Rate) 的權衡關係。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  usage: both
- id: 9024
  chapter_title: 模型評估與效能優化
  section_title: 迴歸指標 (Regression Metrics)
  text: 平均絕對誤差 (MAE) 的優點是？
  type: multiple_choice
  options:
  - 可微分 (Differentiable)，可以計算梯度進行優化。
  - 會放大誤差 (Amplifies Errors)，對極端值敏感。
  - 計算複雜 (Complex Computation)，運算過程較為困難。
  - 對離群值較不敏感，解釋直觀 (Less Sensitive to Outliers, Intuitive Interpretation)
  correct_index: 3
