  usage: both
- id: 11439
  chapter_title: 模型評估與優化
  section_title: 歷屆考題
  text: 某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院 日數集中在 3–7 天，但仍有少數重症患者因治療需求而住院日數明顯 偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測 準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合 此需求？  答案 題    目 (114年第四梯次)
  type: multiple_choice
  options:
  - 在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標 (During Model Validation, Simultaneously Presenting MAE and Error Indicators for Critical Care Subgroup)
  - 僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差 (Only Performing Cross-Validation on General Patient Samples to Avoid Critical Cases Raising Error)
  - 將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影 響 (Standardizing All Patients' Length of Stay to Reduce Impact of Value Range Differences)
  - 只採用單一的整體決定係數 (R²) 作為模型優劣的判斷依據 (Only Using Single Overall R² as Model Quality Judgment Criterion)
  correct_index: 0
  explanation: 此題涉及 評估指標 的核心概念。正確答案為「在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標」。
