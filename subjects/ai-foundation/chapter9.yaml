  section_title: 防止過擬合技術 (Regularization)
  text: 情境：L2 正則化 (Ridge) 對權重的影響是？
  type: multiple_choice
  options:
  - 讓權重變成 0 (Making Weights Zero)，屬於 L1 正則化的效果。
  - 讓權重變小但不為 0 (Making Weights Smaller But Not Zero)
  - 讓權重變大 (Making Weights Larger)，放大模型參數。
  - 沒影響 (No Effect)，對權重完全沒有影響。
  correct_index: 1
  explanation: L2 懲罰權重的平方和，傾向於讓權重均勻變小，防止單一特徵獨大。
