- chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 情境：在癌症篩檢中，我們最不希望漏掉任何一個病人（寧可誤判也要抓到）。應優先優化哪個指標？
  type: multiple_choice
  options:
  - 準確率 (Accuracy)，所有預測中正確的比例。
  - 精確率 (Precision)，預測為正的樣本中真正為正的比例。
  - 召回率 (Recall)，所有正樣本中被成功找出的比例。
  - 特異度 (Specificity)，真陰性在所有負樣本中的比例。
  correct_index: 2
  explanation: Recall 衡量真的有病的人中有多少被抓出來。漏診代價極高，故需最大化 Recall。
