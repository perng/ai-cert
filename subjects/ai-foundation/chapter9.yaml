- id: 9051
  chapter_title: 模型評估與優化
  section_title: 評估指標
  text: 在一個 99% 都是負樣本（正常）的不平衡資料集中，若模型全部預測為「正常」，其 Accuracy 會高達 99%。這說明了什麼？
  type: multiple_choice
  options:
  - Accuracy 是一個完美的指標
  - 模型表現非常優秀
  - 不需要再做任何優化
  - 在不平衡資料集中，Accuracy 具有高度誤導性，應改用 F1-Score 或 AUC-ROC
  correct_index: 3
  explanation: 這就是「準確度的悖論」。模型雖然準，但對我們真正關心的少數類（如詐欺、疾病）完全無能為力。
  tags:
  - sec-ai-chapter9
  - sec-evaluation-metrics
