- chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 情境：AUC-ROC 曲線中，AUC = 0.5 代表什麼？
  type: multiple_choice
  options:
  - 模型完美 (Model Perfect)，預測能力極佳。
  - 模型跟隨機亂猜一樣 (Model Same as Random Guessing)，預測能力等同於隨機。
  - 模型還不錯 (Model Not Bad)，預測能力尚可。
  - 模型完全錯誤 (Model Completely Wrong)，所有預測都錯誤。
  correct_index: 1
  explanation: AUC=0.5 代表對角線，意味著模型沒有鑑別力，效果等同丟銅板。
