- chapter_title: 模型評估與效能優化
  section_title: 偏差-變異權衡 (Bias-Variance Tradeoff)
  text: 情境：欠擬合 (Underfitting) 通常是因為？
  type: multiple_choice
  options:
  - 模型太複雜 (Model Too Complex)，模型複雜度過高。
  - 模型太簡單，無法捕捉資料規律 (Model Too Simple, Unable to Capture Data Patterns)
  - 資料太多 (Too Much Data)，訓練資料過多。
  - 訓練太久 (Training Too Long)，訓練週期過長。
  correct_index: 1
  explanation: 高偏差 (High Bias) 意味著模型能力不足，連訓練集的規律都學不會。
