  - Accuracy (準確率)，所有預測中正確的比例。
  - MSE (Mean Squared Error)，用於迴歸任務的損失函數。
  correct_index: 1
  explanation: Precision 衡量被判為垃圾信中真的是垃圾信的比例。高 Precision 代表誤判率 (FP) 低。
