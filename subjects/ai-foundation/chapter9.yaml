- id: 9054
  chapter_title: 模型評估與優化
  section_title: 誤差分析與正則化
  text: Early Stopping (早停法) 是如何防止過擬合的？
  type: multiple_choice
  options:
  - 隨機停止訓練 (Randomly Stopping Training)，無系統性地結束訓練。
  - 在訓練開始前就停止 (Stopping Before Training Begins)，完全不進行訓練。
  - 監控驗證集 (Validation Set) 的誤差，一旦誤差不再下降甚至開始上升，就停止訓練 (Monitoring Validation Set Error, Stopping Training Once Error Stops Decreasing or Starts Increasing)
