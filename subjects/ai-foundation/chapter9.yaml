- chapter_title: 模型評估與效能優化
  section_title: 偏差-變異權衡 (Bias-Variance Tradeoff)
  text: 情境：模型在訓練集上表現極好 (99%)，但在測試集上表現很差 (60%)。這是什麼現象？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)，模型過於簡單無法學習複雜模式。
  - 過度擬合 (Overfitting)，模型過於複雜無法泛化到新資料。
  - 高偏差 (High Bias)，模型預測的系統性誤差較大。
  - 資料不足 (Insufficient Data)，訓練資料量不足。
  correct_index: 1
  explanation: 訓練集與測試集效能差距過大，代表模型死記了訓練資料（高變異），泛化能力差。
  tags:
  - chap-ai-foundation-chapter9
  - sec-bias-variance
  id: 11445
  usage: both
- chapter_title: 模型評估與效能優化
  section_title: K-fold 交叉驗證 (Cross-Validation)
  text: 情境：K-fold 交叉驗證 (Cross-Validation) 的主要好處是？
  type: multiple_choice
  options:
  - 計算速度快 (Fast Computation Speed)，處理效率高。
  - 每一筆資料都有機會被當作驗證集，評估結果更穩健 (Every Data Point Has Opportunity to Be Used as Validation Set, More Robust Evaluation Results)
  - 不需要測試集 (No Test Set Required)，可以省略測試階段。
  - 模型更簡單 (Model Simpler)，模型複雜度較低。
  correct_index: 1
  explanation: 透過輪流驗證，能避免因單次切分運氣不好而導致的評估偏差，充分利用有限資料。
  tags:
  - chap-ai-foundation-chapter9
  - sec-cross-validation
  id: 11446
  usage: both
- chapter_title: 模型評估與效能優化
  section_title: 防止過擬合技術 (Regularization)
  text: 情境：Dropout 技術是如何防止過度擬合的？
  type: multiple_choice
  options:
  - 增加資料量 (Increasing Data Volume)，擴充訓練資料集。
  - 訓練時隨機關閉部分神經元，減少對特定路徑的依賴 (Randomly Closing Some Neurons During Training, Reducing Dependence on Specific Paths)
  - 刪除錯誤標籤 (Deleting Wrong Labels)，移除不正確的標註。
  - 增加層數 (Adding Layers)，會加劇過擬合。
  correct_index: 1
  explanation: Dropout 破壞了神經元間的共伴適應 (Co-adaptation)，達到類似集成學習的效果，增強強健性。
  tags:
  - chap-ai-foundation-chapter9
  - sec-prevent-overfitting
  id: 11447
  usage: both
- chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 情境：混淆矩陣中，TP=90, FP=10, FN=5, TN=895。準確率 (Accuracy) 是多少？
  type: multiple_choice
  options:
  - 90% (Ninety Percent)，準確率為 90%。
  - 98.5% (Ninety-Eight Point Five Percent)，正確的準確率計算結果。
  - 10% (Ten Percent)，準確率為 10%。
  - 50% (Fifty Percent)，準確率為 50%。
  correct_index: 1
  explanation: Accuracy = (TP+TN) / Total = (90+895) / 1000 = 98.5%。
  tags:
  - chap-ai-foundation-chapter9
  - sec-classification-metrics
  id: 11448
  usage: both
- chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 情境：對於垃圾郵件過濾器，我們希望盡量不要把重要信件誤判為垃圾信。應看重哪個指標？
