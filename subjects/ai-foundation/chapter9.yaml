- id: 9053
  chapter_title: 模型評估與優化
  section_title: 誤差分析與優化
  text: 當模型在訓練集表現很好，但在測試集表現很差（High Variance），這通常是發生了什麼問題？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)
