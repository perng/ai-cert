  section_title: 評估流程與指標
  text: 在一個 99% 都是負樣本（正常）的不平衡資料集中，若模型全部預測為「正常」，其 Accuracy 會高達 99%。這說明了什麼？
  type: multiple_choice
  options:
  - Accuracy 是一個完美的指標 (Accuracy Is a Perfect Metric)，準確率完全可靠。
  - 模型表現非常優秀 (Model Performance Is Excellent)，預測能力極佳。
  - 不需要再做任何優化 (No Further Optimization Needed)，模型已達最佳狀態。
  - 在不平衡資料集中，Accuracy 具有高度誤導性，應改用 F1-Score 或 AUC-ROC (In Imbalanced Datasets, Accuracy Is Highly Misleading, Should Use F1-Score or AUC-ROC Instead)
