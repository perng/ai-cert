- chapter_title: 模型評估與效能優化
  section_title: 分類指標 (Classification Metrics)
  text: 情境：F1-Score 是哪兩個指標的調和平均？
  type: multiple_choice
  options:
  - Accuracy 與 Recall (Accuracy and Recall)，準確率與召回率。
  - Precision 與 Recall (Precision and Recall)，精確率與召回率的調和平均數。
  - TPR 與 FPR (TPR and FPR)，真陽性率與假陽性率。
  - MSE 與 MAE (MSE and MAE)，用於迴歸任務的損失函數。
  correct_index: 1
  explanation: F1-Score 綜合考量 Precision 與 Recall，適用於兩者需兼顧的場景。
