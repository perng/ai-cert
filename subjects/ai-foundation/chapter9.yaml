- id: 9054
  chapter_title: 模型評估與優化
  section_title: 誤差分析與優化
  text: Early Stopping (早停法) 是如何防止過擬合的？
  type: multiple_choice
  options:
  - 隨機停止訓練
  - 在訓練開始前就停止
  - 監控驗證集 (Validation Set) 的誤差，一旦誤差不再下降甚至開始上升，就停止訓練
  - 當訓練集誤差為 0 時停止
  correct_index: 2
  explanation: 這就像在煮麵，要在麵條剛好熟（驗證誤差最低）的時候撈起來，煮太久（訓練太久）就會爛掉（過擬合）。
  tags:
  - sec-ai-chapter9
  - sec-error-analysis
- id: 11439
  chapter_title: 模型評估與優化
  section_title: 評估指標
  text: 某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院 日數集中在 3–7 天，但仍有少數重症患者因治療需求而住院日數明顯 偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測 準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合 此需求？  答案 題    目 (114年第四梯次)
  type: multiple_choice
  options:
  - 在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標
  - 僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差
  - 將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影 響
  - 只採用單一的整體決定係數 (R²) 作為模型優劣的判斷依據
  correct_index: 0
  explanation: 此題涉及 評估指標 的核心概念。正確答案為「在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標」。 
  tags:
  - past-exam
  - 114-4
  - sec-ai-chapter9
  - sec-evaluation-metrics
- id: 11406
  chapter_title: 模型評估與優化
  section_title: 誤差分析與優化
  text: 在 Lasso 模型中，L1 正則化（Regularization）導致參數收斂為零的 原因為何？ (114年第四梯次)
  type: multiple_choice
  options:
  - L1 正則化忽略目標變數
  - L1 對梯度有平滑作用
  - L1 對大係數懲罰較強，促使稀疏解；  答案 題    目
  - L1 會轉換損失函數為非凸形
  correct_index: 2
  explanation: L1 正則化 (Lasso) 具有特徵選擇的功能，因為其幾何特性（菱形約束區域）傾向於讓不重要的特徵權重收斂為 0，從而產生稀疏模型。 
