- chapter_title: 模型評估與效能優化
  section_title: 迴歸指標 (Regression Metrics)
  text: 情境：迴歸問題中，MSE (均方誤差) 相比 MAE (平均絕對誤差) 的特點是？
  type: multiple_choice
  options:
  - '對離群值更敏感 (會放大極端誤差) (More Sensitive to Outliers: Amplifies Extreme Errors)'
  - 對離群值不敏感 (Not Sensitive to Outliers)，不受極端值影響。
  - 計算較慢 (Slower Computation)，運算過程較為困難。
  - 數值較小 (Smaller Values)，誤差數值較小。
  correct_index: 0
  explanation: 因為誤差被平方，大誤差的影響會被顯著放大，使模型更傾向於消除大誤差。
