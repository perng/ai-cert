  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：某新創公司想做「貓狗分類器」，但手上只有 100 張照片。技術長建議不要用深度學習，改用傳統機器學習（如 SVM）。理由可能是？
  type: multiple_choice
  options:
  - 深度學習準確率太低 (Low Accuracy)，在分類任務上表現不佳。
  - 深度學習需要海量數據才能收斂，小數據集下傳統 ML 效果可能更好且不易過擬合 (Requiring Massive Data, Traditional ML Better on Small Datasets)
  - SVM 運算更慢 (Slower Computation)，處理速度不如深度學習。
  - SVM 是最新的技術 (Latest Technology)，代表最先進的機器學習方法。
  correct_index: 1
  explanation: 深度學習是「數據飢渴」的，在小數據集上往往不如傳統機器學習演算法有效率且穩健。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ml-vs-dl-cost
  id: 11407
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：AlphaGo 在圍棋上擊敗人類，但它不懂圍棋的歷史，也不會感到開心或難過。這顯示目前的 AI 缺乏？
  type: multiple_choice
  options:
  - 計算能力 (Computational Power)，硬體運算效能不足。
  - 自我意識與通用性 (Consciousness & Generalization)，缺乏意識與跨領域能力。
  - 數據 (Data)，訓練數據不足或品質不佳。
  - 演算法 (Algorithms)，使用的演算法不夠先進或有效。
  correct_index: 1
  explanation: 這是弱 AI (ANI) 的典型特徵：在特定任務表現優異，但缺乏像人類一樣的意識、情感與跨領域理解力。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-def
  id: 11408
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：關於「資料驅動 (Data-Driven)」與「規則驅動 (Rule-Based)」的比較，下列何者描述正確？
  type: multiple_choice
  options:
  - 規則驅動需要大量數據 (Requiring Large Datasets)，對數據量需求極高。
  - 資料驅動是「輸入 + 輸出 = 規則」(Data-Driven: Input + Output = Rules)，從數據中學習模式。
  - 規則驅動適合模糊的問題 (Suitable for Ambiguous Problems)，能處理不確定性。
  - 資料驅動不需要運算資源 (No Computational Resources Needed)，運算成本為零。
  correct_index: 1
  explanation: 資料驅動（機器學習）的核心是讓電腦從「輸入」與「輸出（答案）」中自動歸納出「規則（模型）」。
  tags:
  - chap-ai-foundation-chapter1
  - sec-data-vs-rule
  id: 11409
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：在醫療影像診斷中，AI 負責標記出 X 光片上的可疑病灶，但最終診斷報告必須由醫生簽名確認。這是為了？
  type: multiple_choice
  options:
  - 節省醫生時間 (Saving Doctor's Time)，提高醫療效率與產能。
  - 確保責任歸屬與診斷正確性 (HITL) (Ensuring Accountability and Diagnostic Accuracy)
  - 訓練 AI (Training AI)，收集數據以改進模型表現。
  - 讓 AI 取代醫生 (Replacing Doctors)，完全由 AI 進行醫療決策。
  correct_index: 1
  explanation: HITL (Human-in-the-loop) 模式確保了關鍵決策（如醫療診斷）的最終責任在人，AI 僅作為輔助。
  tags:
  - chap-ai-foundation-chapter1
  - sec-human-ai-collab
  id: 11410
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：符號式 AI (Symbolic AI) 在 1980 年代沒落的主要原因之一是？
  type: multiple_choice
  options:
  - 電腦跑太快 (Computers Too Fast)，運算速度超出需求導致效率問題。
  - 知識擷取瓶頸 (Knowledge Acquisition Bottleneck)，難以將專家知識轉化為規則。
  - 數據太多 (Too Much Data)，數據量過大導致處理困難。
  - 規則太簡單 (Rules Too Simple)，規則庫不足以處理複雜問題。
  correct_index: 1
  explanation: 將人類專家的隱性知識轉化為明確的邏輯規則非常困難且耗時，限制了符號式 AI 的擴展性。
  tags:
  - chap-ai-foundation-chapter1
  - sec-symbolic-ai
  id: 11411
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：深度學習 (DL) 相比於傳統機器學習 (ML)，最大的突破在於？
  type: multiple_choice
  options:
  - 運算速度更快 (Faster Computation)，訓練與推論速度明顯提升。
  - 不再需要人工特徵工程 (Feature Engineering)，自動從原始數據中提取特徵。
  - 模型更小 (Smaller Models)，參數數量大幅減少。
  - 不需要數據 (No Data Needed)，可以在無數據情況下運作。
  correct_index: 1
  explanation: 傳統 ML 高度依賴專家定義特徵（如定義鳥有翅膀），DL 則能直接從原始像素中學習特徵，實現了端到端學習。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ml-vs-dl-cost
  id: 11412
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：統計式 AI (Statistical AI) 的一個主要缺點是「黑盒子 (Black Box)」問題，這意味著？
  type: multiple_choice
  options:
  - 模型外殼是黑色的 (Black Exterior)，硬體外觀為黑色設計。
  - 難以解釋模型內部的決策邏輯 (Difficult to Explain Internal Decision Logic)
  - 模型只能在晚上運作 (Only Works at Night)，需要特定時間條件。
  - 模型不準確 (Model Inaccuracy)，預測結果錯誤率極高。
  correct_index: 1
  explanation: 統計模型（特別是深度學習）內部有數以億計的參數，人類難以直觀理解它是如何得出某個結論的。
  tags:
  - chap-ai-foundation-chapter1
  - sec-statistical-ai
  id: 11413
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：為了訓練一個能辨識「紅綠燈」的 AI，需要大量人力在圖片上框出紅綠燈的位置。這個過程屬於？
  type: multiple_choice
  options:
  - 資料標註 (Data Labeling)，屬於 HITL (Human-in-the-loop)，人類提供標準答案。
  - 非監督式學習 (Unsupervised Learning)，從無標籤數據中發現模式。
  - 強化學習 (Reinforcement Learning)，透過獎勵與懲罰機制進行學習。
  - 規則引擎 (Rule Engine)，基於預定義規則進行邏輯推論。
  correct_index: 0
  explanation: 資料標註是典型的人在迴圈中 (HITL)，人類提供標準答案讓 AI 學習。
  tags:
  - chap-ai-foundation-chapter1
  - sec-human-ai-collab
  id: 11414
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：若要解決的問題是「預測鐵達尼號乘客的生存率」，且資料是結構化的表格（年齡、票價、艙等）。最經濟實惠的選擇是？
  type: multiple_choice
  options:
  - 訓練一個 100 層的深度神經網路 (Training a 100-Layer Deep Neural Network)，使用複雜的深度學習架構。
  - 使用傳統機器學習模型（如決策樹或隨機森林）(Using Traditional ML Models: Decision Trees or Random Forests)
  - 手寫規則 (Hand-Written Rules)，人工定義 If-Then 邏輯規則。
  - 使用生成式 AI (Using Generative AI)，利用生成模型進行預測。
  correct_index: 1
  explanation: 對於結構化表格數據 (Tabular Data)，傳統 ML 模型通常能以較低的運算成本達到與 DL 相當甚至更好的效果。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ml-vs-dl-cost
  id: 11415
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：圖靈測試 (Turing Test) 的主要目的是？
  type: multiple_choice
  options:
  - 測試電腦的運算速度 (Testing Computational Speed)，評估硬體處理效能。
  - 判斷機器是否具備展現出與人類無法區分的智慧行為的能力 (Testing if Machine Can Exhibit Indistinguishable Intelligence from Humans)
  - 測試網路連線 (Testing Network Connectivity)，檢查網路連線品質。
  - 測試硬體耐用度 (Testing Hardware Durability)，評估設備使用壽命。
  correct_index: 1
  explanation: 圖靈測試由艾倫·圖靈提出，如果人類評審無法區分對話對象是人還是機器，則該機器通過測試。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-def
  id: 11416
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：AIOps 系統自動監控伺服器，發現硬碟快滿了，於是自動清理暫存檔。這屬於？
  type: multiple_choice
  options:
  - HITL (Human-in-the-loop)，人類參與決策流程。
  - HOTL (Human-over-the-loop)，人類監督 AI 運作。
  - HOOTL (Human-out-of-the-loop)，完全自動化無需人類介入。
  - 手動維運 (Manual Operations)，完全由人類手動執行所有任務。
  correct_index: 2
  explanation: 如果清理過程完全自動化且無需人類批准，則屬於 HOOTL。若需人類批准則為 HOTL。通常 AIOps 的自動修復傾向於 HOOTL
    以求時效。
  tags:
