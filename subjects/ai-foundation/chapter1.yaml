  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：高頻交易系統在毫秒間自動完成數萬筆交易，人類根本來不及反應。這種模式稱為？
  type: multiple_choice
  options:
  - HITL (Human-in-the-loop)，人類參與決策流程。
  - HOTL (Human-over-the-loop)，人類監督 AI 運作。
  - HOOTL (Human-out-of-the-loop)，完全自動化無需人類介入。
  - 混合模式 (Hybrid Mode)，結合多種協作模式的混合架構。
  correct_index: 2
  explanation: HOOTL 模式下，人類完全不介入決策迴圈，適用於超出人類反應速度的場景，但需有嚴格的安全機制。
