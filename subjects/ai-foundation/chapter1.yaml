- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：在自駕車的 Level 3 等級中，車輛主要由 AI 駕駛，但駕駛人必須坐在駕駛座上，隨時準備在系統發出警示時接手。這屬於哪種協作模式？
  type: multiple_choice
  options:
  - 人在迴圈中 (HITL)，人類必須參與每個決策步驟。
  - 人在迴圈上 (HOTL)，AI 獨立運作，人類僅在異常時介入監督。
  - 人在迴圈外 (HOOTL)，完全自動化無需人類介入。
  - 完全自動化 (Fully Automated)，無需任何人類監督或介入。
  correct_index: 1
  explanation: HOTL (Human-on-the-loop) 模式下，AI 執行主要任務，人類扮演監督者，僅在例外狀況發生時介入。
