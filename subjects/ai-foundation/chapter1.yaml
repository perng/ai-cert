- id: 1024
  chapter_title: 人工智慧的本質與層次架構
  section_title: 符號式 AI
  text: 「知識擷取瓶頸 (Knowledge Acquisition Bottleneck)」指的是什麼困難？
  type: multiple_choice
  options:
  - 電腦運算速度太慢無法處理知識 (Insufficient Processing Speed)，硬體效能不足以執行知識處理。
  - 網路速度太慢無法下載知識 (Slow Network Speed)，無法快速獲取外部知識資源。
  - 將人類專家的隱性知識轉化為明確規則耗時費力 (Converting Tacit Knowledge to Explicit Rules is Time-Consuming)
  - 硬碟容量不足以儲存知識 (Insufficient Storage Capacity)，無法容納大量知識資料。
  correct_index: 2
  explanation: 知識擷取瓶頸是指將人類專家腦中那些「只可意會不可言傳」的隱性知識，轉化為電腦能執行的 If-Then 規則是非常困難且耗時的。
  tags:
  - chap-ai-foundation-chapter1
  - def-knowledge-bottleneck
  usage: both
- id: 1025
  chapter_title: 人工智慧的本質與層次架構
  section_title: 統計式 AI
  text: 統計式 AI 能夠處理哪種類型的數據，這是符號式 AI 難以做到的？
  type: multiple_choice
  options:
  - 非結構化數據（如影像、語音、自然語言）(Unstructured Data: Images, Speech, Natural Language)
  - 數學公式 (Mathematical Formulas)，需要精確的符號運算與邏輯推導。
  - 明確的邏輯規則 (Explicit Logical Rules)，基於 If-Then 條件判斷的規則系統。
  - 結構化資料庫 (Structured Databases)，具有固定格式與架構的表格數據。
  correct_index: 0
  explanation: 統計式 AI (機器學習) 擅長從模糊、複雜的非結構化數據中找出模式，而符號式 AI 難以定義規則來處理這些數據。
  tags:
  - chap-ai-foundation-chapter1
  - sec-statistical-ai
  usage: both
- id: 1026
  chapter_title: 人工智慧的本質與層次架構
  section_title: 統計式 AI
  text: 「垃圾進，垃圾出 (Garbage In, Garbage Out)」主要描述統計式 AI 的什麼缺點？
  type: multiple_choice
  options:
  - 缺乏彈性 (Lack of Flexibility)，難以適應新的問題情境或數據分佈變化。
  - 可解釋性低 (Low Interpretability)，模型決策過程難以理解與解釋。
  - 運算成本過高 (High Computational Cost)，訓練與推論需要大量計算資源。
  - 高度依賴數據品質 (Highly Dependent on Data Quality)，訓練數據的品質直接影響模型表現。
  correct_index: 3
  explanation: 統計式 AI 的模型是從數據中學習而來的，如果訓練數據品質低劣或有錯誤，模型的表現也會很差。
  tags:
  - chap-ai-foundation-chapter1
  - sec-statistical-ai
  usage: both
- id: 1027
  chapter_title: 人工智慧的本質與層次架構
  section_title: 統計式 AI
  text: 如果訓練數據包含偏見 (Bias)，統計式 AI 模型會如何？
  type: multiple_choice
  options:
  - 拒絕學習 (Refusing to Learn)，模型會停止訓練過程以避免學習偏見。
  - 自動修正偏見 (Automatically Correcting Bias)，模型會識別並消除數據中的偏見。
  - 崩潰無法運作 (System Crash)，模型會因為偏見而完全失效。
  - 學到並複製這些偏見 (Learning and Replicating Bias)，模型會反映訓練數據中的統計偏見。
  correct_index: 3
  explanation: 機器學習模型會忠實地反映訓練數據中的統計規律，因此若數據有偏見，模型也會產生有偏見的結果。
  tags:
  - chap-ai-foundation-chapter1
  - sec-statistical-ai
  usage: both
