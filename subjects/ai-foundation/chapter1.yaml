questions:
- id: 1001
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 下列關於人工智慧 (AI) 的定義，何者最為準確？
  type: multiple_choice
  options:
  - AI 必須具備自我意識 (Self-Consciousness) 才能稱為 AI，這是判斷 AI 是否真正智慧的關鍵標準。
  - AI 只能處理邏輯運算 (Logical Operations)，無法處理感知任務 (Perceptual Tasks) 或理解複雜情境。
  - AI 旨在創造能夠展現智慧行為的機器，增強人類解決問題的能力。
  - AI 的目標僅僅是模仿人類的外觀 (Human Appearance)，追求視覺上的相似性而非功能性。
  correct_index: 2
  explanation: AI 的目標是模擬人類認知功能（如學習、推理）並增強人類智慧，不一定需要自我意識或模仿外觀。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-def
  usage: quiz
- id: 1002
  chapter_title: 人工智慧的本質與層次架構
  section_title: 弱 AI vs. 強 AI
  text: AlphaGo 圍棋程式屬於下列哪一種類型的 AI？
  type: multiple_choice
  options:
  - 弱人工智慧 (ANI)，專精於單一任務的 AI 系統。
  - 超人工智慧 (Super AI)，在所有領域都超越人類智慧的 AI。
  - 強人工智慧 (AGI)，具備通用智慧的 AI 系統。
  - 符號式 AI (Symbolic AI)，基於規則與符號推論的 AI 方法。
  correct_index: 0
  explanation: AlphaGo 專精於單一任務（圍棋），無法跨領域學習或具備自我意識，因此屬於弱 AI (ANI)。
  tags:
  - chap-ai-foundation-chapter1
  - def-ani
  usage: quiz
- id: 1003
  chapter_title: 人工智慧的本質與層次架構
  section_title: 弱 AI vs. 強 AI
  text: 關於強人工智慧 (AGI)，下列描述何者正確？
  type: multiple_choice
  options:
  - 只能處理單一領域的任務 (Single-Domain Tasks)，缺乏跨領域遷移學習的能力。
  - 具備像人類一樣的通用智慧，能跨領域學習與推理。
  - 目前已經廣泛應用於日常生活中（如 Siri），是現今最成熟的 AI 技術。
  - 其智慧程度遠遠超越人類最聰明的水平 (Surpassing Human Intelligence)，在所有認知領域都優於人類。
  correct_index: 1
  explanation: 強人工智慧 (AGI) 具備人類般的通用智慧，能跨領域遷移學習。目前的 Siri 屬於弱 AI，超越人類智慧的是超 AI。
  tags:
  - chap-ai-foundation-chapter1
  - def-agi
  usage: quiz
- id: 1004
  chapter_title: 人工智慧的本質與層次架構
  section_title: 超人工智慧 (Super AI)
  text: 當 AI 在科學創新、藝術創作等所有領域的智慧都遠超越人類時，稱之為？
  type: multiple_choice
  options:
  - 弱人工智慧 (ANI)，專精於特定任務但無法跨領域的 AI。
  - 符號式 AI (Symbolic AI)，基於明確規則進行邏輯推論的 AI。
  - 強人工智慧 (AGI)，具備人類般通用智慧的 AI。
  - 超人工智慧 (Super AI)，在所有領域都遠超越人類智慧的 AI。
  correct_index: 3
  explanation: 超人工智慧 (Super AI) 定義為在所有領域的智慧都遠遠超越最聰明的人類。
  tags:
  - chap-ai-foundation-chapter1
  - sec-super-ai
  usage: quiz
- id: 1005
  chapter_title: 人工智慧的本質與層次架構
  section_title: 符號式 AI
  text: 下列何者是「符號式 AI (Symbolic AI)」的主要缺點？
  type: multiple_choice
  options:
  - 需要大量的運算資源 (GPU)，訓練成本高昂且耗時。
  - 無法處理邏輯推論問題 (Logical Reasoning)，在需要明確推理的場景中表現不佳。
  - 缺乏可解釋性 (Black Box)，難以理解模型的內部決策過程。
  - 知識擷取瓶頸與缺乏彈性 (Knowledge Acquisition Bottleneck & Lack of Flexibility)
  correct_index: 3
  explanation: 符號式 AI 依賴人工規則，難以處理模糊問題（缺乏彈性），且將專家知識轉化為規則非常耗時（知識擷取瓶頸）。
  tags:
  - chap-ai-foundation-chapter1
  - sec-symbolic-ai
  usage: quiz
- id: 1006
  chapter_title: 人工智慧的本質與層次架構
  section_title: 符號式 AI
  text: 「專家系統 (Expert Systems)」屬於哪一種 AI 技術範疇？
  type: multiple_choice
  options:
  - 統計式 AI (Statistical AI)，依賴數據驅動的學習方法。
  - 深度學習 (Deep Learning)，使用多層神經網路進行特徵提取。
  - 非監督式學習 (Unsupervised Learning)，從無標籤數據中發現模式。
  - 符號式 AI (Symbolic AI)
  correct_index: 3
  explanation: 專家系統是符號式 AI 的代表技術，由人類專家定義明確的邏輯規則進行推論。
  tags:
  - chap-ai-foundation-chapter1
  - def-expert-systems
  usage: quiz
- id: 1007
  chapter_title: 人工智慧的本質與層次架構
  section_title: 統計式 AI
  text: 統計式 AI (Statistical AI) 與符號式 AI 最大的不同在於？
  type: multiple_choice
  options:
  - 統計式 AI 具有高度可解釋性 (High Interpretability)，決策過程清晰透明。
  - 統計式 AI 無法處理影像或語音 (Images or Speech)，僅限於結構化數據。
  - 統計式 AI 依賴人工手寫規則 (Manually Written Rules)，需要專家定義邏輯。
  - 統計式 AI 從大量數據中自動找出規律 (Automatically Finding Patterns from Large Data)
  correct_index: 3
  explanation: 統計式 AI (機器學習) 的核心是不再由人類手寫規則，而是讓電腦從數據中利用統計方法找出規律。
  tags:
  - chap-ai-foundation-chapter1
  - sec-statistical-ai
  usage: quiz
- id: 1008
  chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 關於 AI、機器學習 (ML) 與深度學習 (DL) 的包含關係，下列何者正確？
  type: multiple_choice
  options:
  - AI > ML > DL，人工智慧包含機器學習，機器學習包含深度學習。
  - AI > DL > ML，人工智慧包含深度學習，深度學習包含機器學習。
  - ML > AI > DL，機器學習包含人工智慧，人工智慧包含深度學習。
  - DL > ML > AI，深度學習包含機器學習，機器學習包含人工智慧。
  correct_index: 0
  explanation: 深度學習是機器學習的子集，而機器學習是人工智慧的子集。關係為 AI > ML > DL。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-ml-dl
  usage: quiz
- id: 1009
  chapter_title: 人工智慧的本質與層次架構
  section_title: 資料驅動 vs. 規則驅動
  text: 機器學習 (Machine Learning) 的核心邏輯可以用下列哪個公式表示？
  type: multiple_choice
  options:
  - 輸入 + 運算 = 儲存 (Input + Computation = Storage)，數據處理後儲存結果。
  - 輸入 + 規則 = 輸出 (Input + Rules = Output)，傳統規則驅動的方法。
  - 輸入 + 輸出 = 規則 (模型) (Input + Output = Rules/Model)，機器學習的核心邏輯。
  - 規則 + 輸出 = 輸入 (Rules + Output = Input)，反向推導的過程。
  correct_index: 2
  explanation: 機器學習是「資料驅動」的，電腦從輸入數據和對應的輸出答案中，自己學習出規則（模型）。
  tags:
  - chap-ai-foundation-chapter1
  - def-data-driven
  usage: quiz
- id: 1010
  chapter_title: 人工智慧的本質與層次架構
  section_title: 傳統機器學習 vs. 深度學習
  text: 相較於深度學習，下列何者是「傳統機器學習」的特徵？
  type: multiple_choice
  options:
  - 特徵工程通常由人工專家手動提取 (Manual Feature Engineering by Experts)
  - 模型通常是無法解釋的黑盒子 (Black Box Models)，決策過程難以理解。
  - 需要大量數據才能運作良好 (Requiring Large Datasets)，對數據量需求極高。
  - 主要依賴 GPU 進行加速運算 (GPU-Accelerated Computing)，需要高效能硬體支援。
  correct_index: 0
  explanation: 傳統機器學習高度依賴人工特徵工程 (Feature Engineering)，而深度學習具備自動特徵提取能力。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ml-vs-dl-cost
  usage: quiz
- id: 1011
  chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 在「資料標註 (Data Labeling)」的工作中，人類必須教導 AI 什麼是正確答案，這屬於哪種協作模式？
  type: multiple_choice
  options:
  - 人在迴圈上 (HOTL)，人類監督 AI 運作，僅在異常時介入。
  - 人在迴圈外 (HOOTL)，完全自動化，人類不介入決策流程。
  - 全自動化模式 (Fully Automated Mode)，無需任何人類介入或監督。
  - 人在迴圈中 (HITL)，人類是決策流程中不可或缺的環節。
  correct_index: 3
  explanation: HITL (Human-in-the-loop) 指人類是系統運作不可或缺的一部分，如資料標註或醫療最終診斷。
  tags:
  - chap-ai-foundation-chapter1
  - sec-hitl
  usage: both
- id: 1012
  chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 在「自駕車 (Level 3)」的應用中，人類駕駛必須隨時準備接手，這屬於哪種協作模式？
  type: multiple_choice
  options:
  - 全自動無人監控 (Fully Automated Without Monitoring)，完全由 AI 自主運作。
  - 人在迴圈中 (HITL)，人類必須參與每個決策步驟。
  - 人在迴圈上 (HOTL)，AI 獨立運作，人類僅在異常時介入監督。
  - 人在迴圈外 (HOOTL)，完全自動化無需人類監控。
  correct_index: 2
  explanation: HOTL (Human-over-the-loop) 指 AI 可獨立完成大部分任務，人類扮演監督者，僅在異常時介入。Level 3
    自駕車符合此定義。
  tags:
  - chap-ai-foundation-chapter1
  - sec-hotl
  usage: both
- id: 1013
  chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 下列哪個場景最適合採用「人在迴圈外 (HOOTL)」模式？
  type: multiple_choice
  options:
  - 法律判決 (Legal Judgments)，需要人類法官進行最終裁決。
  - 醫療診斷與手術 (Medical Diagnosis and Surgery)，需要醫生進行專業判斷。
  - 高頻交易 (High-Frequency Trading)，需要在毫秒級內完成決策。
  - 招聘面試 (Job Interviews)，需要人類評估候選人的綜合能力。
  correct_index: 2
  explanation: 高頻交易需要在毫秒級內做出決策，人類無法即時反應，因此適合全自動化的 HOOTL 模式。
  tags:
  - chap-ai-foundation-chapter1
  - sec-hootl
  usage: both
- id: 1014
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 發展歷史
  text: 人工智慧 (AI) 這個術語是在哪一場會議中正式誕生的？
  type: multiple_choice
  options:
  - 1997 深藍電腦對弈 (1997 Deep Blue Chess Match)，IBM 電腦擊敗棋王的重要事件。
  - 1950 圖靈測試 (1950 Turing Test)，艾倫·圖靈提出的智慧測試方法。
  - 1956 達特茅斯會議 (Dartmouth Conference)，正式確立人工智慧學科的歷史會議。
  - 2012 ImageNet 競賽 (2012 ImageNet Competition)，深度學習在影像辨識的突破。
  correct_index: 2
  explanation: 1956 年的達特茅斯會議 (Dartmouth Conference) 被公認為 AI 的誕生地，正式確立了人工智慧這個學科。
  tags:
  - chap-ai-foundation-chapter1
  - chap-ai-foundation-chapter1-summary
  usage: both
- id: 1015
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 發展歷史
  text: 圖靈測試 (Turing Test) 的主要目的是什麼？
  type: multiple_choice
  options:
  - 測試機器能否辨識圖像 (Testing Image Recognition)，評估視覺處理能力。
  - 測試機器是否具備人類智慧（能否騙過人類評審）(Testing if Machine Can Fool Human Judges)
  - 測試電腦的運算速度 (Testing Computational Speed)，評估硬體效能。
  - 測試機器能否下贏圍棋 (Testing Go Playing Ability)，評估策略遊戲能力。
  correct_index: 1
  explanation: 圖靈測試由艾倫·圖靈提出，旨在測試機器是否能展現出與人類無異的智慧行為，若人類評審無法區分機器與真人，則通過測試。
  tags:
  - chap-ai-foundation-chapter1
  - chap-ai-foundation-chapter1-summary
  usage: both
- id: 1016
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 發展歷史
  text: 2012 年哪一個模型的出現標誌著深度學習 (Deep Learning) 的爆發？
  type: multiple_choice
  options:
  - ChatGPT，OpenAI 開發的大型語言模型，擅長對話與文本生成。
  - Deep Blue，IBM 開發的西洋棋 AI，1997 年擊敗世界冠軍。
  - AlexNet，2012 年 ImageNet 競賽冠軍，開啟深度學習時代。
  - AlphaGo，DeepMind 開發的圍棋 AI，2016 年擊敗世界冠軍。
  correct_index: 2
  explanation: 2012 年 AlexNet 在 ImageNet 競賽中大幅降低錯誤率，證明了深度學習在影像辨識的強大能力，開啟了深度學習的爆發期。
  tags:
  - chap-ai-foundation-chapter1
  - chap-ai-foundation-chapter1-summary
  usage: both
- id: 1017
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 下列哪一項不是 AI 的主要目標？
  type: multiple_choice
  options:
  - 完全取代人類所有工作 (Replacing All Human Jobs)，消除人類在職場的角色。
  - 模擬人類認知功能 (Simulating Human Cognitive Functions)，如學習、推理、感知等。
  - 解決複雜問題 (Solving Complex Problems)，處理超出人類能力的計算任務。
  - 增強人類智慧 (Enhancing Human Intelligence)，協助人類做出更好的決策。
  correct_index: 0
  explanation: AI 的目標是增強人類智慧與解決問題，而非完全取代人類，特別是在涉及情感、道德與創造力的領域。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-def
  usage: both
- id: 1018
  chapter_title: 人工智慧的本質與層次架構
  section_title: 弱 AI vs. 強 AI
  text: 下列關於弱人工智慧 (ANI) 的敘述，何者錯誤？
  type: multiple_choice
  options:
  - 它是目前唯一實現的 AI 類型 (The Only Currently Implemented AI Type)，是現今唯一存在的 AI。
  - Siri 和 Google Assistant 都是弱 AI (Siri and Google Assistant are ANI)，屬於專精型 AI 系統。
  - 它專精於特定任務 (Specialized in Specific Tasks)，在單一領域表現優異。
  - 它具備自我意識 (Self-Awareness)，能夠認知自身的存在與思考。
  correct_index: 3
  explanation: 弱 AI (ANI) 不具備自我意識，這是強 AI (AGI) 的特徵。
  tags:
  - chap-ai-foundation-chapter1
  - def-ani
  usage: both
- id: 1019
  chapter_title: 人工智慧的本質與層次架構
  section_title: 弱 AI vs. 強 AI
  text: 人臉辨識系統雖然能精準辨識身分，卻無法欣賞照片的美感，這說明了弱 AI 的什麼特性？
  type: multiple_choice
  options:
  - 缺乏邏輯推理能力 (Lack of Logical Reasoning)，無法進行複雜的邏輯推導。
  - 缺乏通用智慧與情感理解 (Lack of General Intelligence and Emotional Understanding)
  - 缺乏數據支持 (Lack of Data Support)，訓練數據不足導致表現不佳。
  - 缺乏運算能力 (Lack of Computational Power)，硬體效能不足以執行任務。
  correct_index: 1
  explanation: 弱 AI 缺乏通用智慧和情感理解能力，只能執行被設計好的特定任務（如辨識像素特徵）。
  tags:
  - chap-ai-foundation-chapter1
  - def-ani
  usage: both
- id: 1020
  chapter_title: 人工智慧的本質與層次架構
  section_title: 弱 AI vs. 強 AI
  text: 強人工智慧 (AGI) 的關鍵特徵之一是什麼？
  type: multiple_choice
  options:
  - 運算速度必須達到光速 (Computational Speed Must Reach Light Speed)，需要極高的處理速度。
  - 只能處理影像數據 (Only Processing Image Data)，僅限於視覺資訊處理。
  - 必須使用生物神經元 (Must Use Biological Neurons)，需要真實的神經細胞。
  - 具備跨領域遷移學習的能力 (Cross-Domain Transfer Learning Capability)
  correct_index: 3
  explanation: AGI 的核心特徵是具備像人類一樣的通用智慧，能夠將在一個領域學到的知識遷移應用到另一個未知的領域。
  tags:
  - chap-ai-foundation-chapter1
  - def-agi
  usage: both
- id: 1021
  chapter_title: 人工智慧的本質與層次架構
  section_title: 超人工智慧 (Super AI)
  text: 超人工智慧 (Super AI) 的出現引發了哪方面的深刻討論？
  type: multiple_choice
  options:
  - 網路頻寬不足 (Insufficient Network Bandwidth)，無法傳輸大量數據。
  - 硬體散熱問題 (Hardware Cooling Issues)，運算產生的熱量難以有效散發。
  - AI 安全與控制的倫理問題 (AI Safety and Control Ethical Issues)，如何確保 AI 目標與人類利益一致。
  - 數據儲存成本 (Data Storage Costs)，儲存大量訓練數據的費用過高。
  correct_index: 2
  explanation: 當 AI 智慧超越人類時，如何確保其目標與人類利益一致（AI Alignment）以及如何控制它，是倫理與安全領域的重大議題。
  tags:
  - chap-ai-foundation-chapter1
  - sec-super-ai
  usage: both
- id: 1022
  chapter_title: 人工智慧的本質與層次架構
  section_title: 符號式 AI
