- id: 1042
  chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境題：你正在開發一個垃圾郵件過濾器。若垃圾郵件的特徵每天都在變（例如從「中獎」變成「幸運得主」再變成「LUCKY WINNER」），為何「資料驅動
    (Data-Driven)」的方法通常優於「規則驅動 (Rule-Based)」？
  type: multiple_choice
  options:
  - 因為資料驅動的模型不需要任何運算資源 (No Computational Resources Needed)，運算成本為零。
  - 因為資料驅動能自動從新數據中學習變異模式，解決了規則驅動難以窮舉所有變化的「知識擷取瓶頸」(Automatically Learning Variant Patterns, Solving Knowledge Acquisition Bottleneck)
  - 因為規則驅動的系統完全無法處理文字 (Cannot Process Text at All)，僅限於數值運算。
  - 因為資料驅動的模型具有最高的可解釋性 (Highest Interpretability)，決策過程完全透明。
  correct_index: 1
  explanation: 規則驅動面對無限變化的模式時會遇到瓶頸（需人工不斷新增規則），而機器學習（資料驅動）能自動適應數據分佈的改變。
  tags:
  - chap-ai-foundation-chapter1
  - sec-data-vs-rule
  usage: mock
- id: 11401
  chapter_title: 人工智慧的本質與層次架構
  section_title: 人機協作模式
  text: 在人工智慧系統的決策流程中，下列哪一種情境最符合「人在迴圈上 （Human-over-the-loop）」所強調的監督機制？ (114年第四梯次)
  type: multiple_choice
  options:
  - AI 系統只能提供建議，人類需主動下達命令才能進行決策 (AI Only Provides Suggestions, Human Must Actively Command)，AI 僅為輔助工具。
  - 人類對 AI 的運行進行日常監督，必要時可立即介入修正或干預 (Daily Supervision with Immediate Intervention Capability)
  - 人類平時不參與 AI 的運作，僅在發生異常或重大錯誤時才接手控制 (No Regular Participation, Only Intervening in Anomalies)，屬於被動監控模式。
  - AI 的所有判斷與行動在執行前，皆須經過人類逐一審核與批准 (All Decisions Require Human Review and Approval)，屬於嚴格審核模式。
  correct_index: 1
  explanation: Human-in-the-loop (HITL) 強調在 AI 系統中保留人類的監督與介入，特別是在高風險決策或模型信心不足時。
  tags:
  - past-exam
  - 114-4
  - sec-ai-chapter1
  usage: mock
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：某科技公司宣稱開發出「通用人工智慧 (AGI)」，能像人類一樣處理任何未見過的任務。但經測試發現，該系統在下圍棋時表現完美，卻無法回答簡單的數學題。這說明該系統實際上屬於？
  type: multiple_choice
  options:
  - 強人工智慧 (AGI)，具備通用智慧能處理各種任務的 AI。
  - 弱人工智慧 (ANI)，專精於單一領域但無法跨領域的 AI。
  - 超人工智慧 (ASI)，在所有領域都超越人類智慧的 AI。
  - 符號式 AI (Symbolic AI)，基於規則與符號進行邏輯推論的 AI。
  correct_index: 1
  explanation: 弱 AI (ANI) 的特徵是專精於單一領域（如下棋），無法跨領域遷移學習。真正的 AGI 應具備通用性。
  tags:
  - chap-ai-foundation-chapter1
  - sec-ai-def
  id: 11402
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：早期的醫療診斷系統是透過醫生手寫數千條「如果...則...」的規則來運作。這類系統遇到新型病毒時往往束手無策。這反映了哪種 AI 的侷限性？
  type: multiple_choice
  options:
  - 統計式 AI (Statistical AI)，從數據中學習統計規律的 AI 方法。
  - 符號式 AI (Symbolic AI)，依賴人類定義規則的 AI 方法。
  - 深度學習 (Deep Learning)，使用多層神經網路的機器學習方法。
  - 生成式 AI (Generative AI)，能夠生成新內容的 AI 技術。
  correct_index: 1
  explanation: 符號式 AI 依賴人類定義的規則，缺乏彈性，難以處理規則庫以外的未知情況（知識擷取瓶頸）。
  tags:
  - chap-ai-foundation-chapter1
  - sec-symbolic-ai
  id: 11403
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：客戶要求開發一個能自動從海量圖片中識別「瑕疵品」的系統，且不想人工定義瑕疵的特徵（如裂痕長度）。應選擇哪種技術？
  type: multiple_choice
  options:
  - 專家系統 (Expert Systems)，基於規則庫進行知識推論的系統。
  - 傳統機器學習 (SVM)，需要人工定義特徵的機器學習方法。
  - 深度學習 (Deep Learning)，具備自動特徵提取能力的機器學習方法。
  - 邏輯迴歸 (Logistic Regression)，用於分類問題的統計學習方法。
  correct_index: 2
  explanation: 深度學習具備「自動特徵提取 (End-to-End Learning)」的能力，無需人工定義特徵，特別適合複雜的影像識別任務。
