- chapter_title: 人工智慧的本質與層次架構
  section_title: AI 的定義與範疇
  text: 情境：超人工智慧 (Super AI) 的定義是？
  type: multiple_choice
  options:
  - 會下圍棋的 AI (Go-Playing AI)，專精於圍棋對弈的弱 AI。
  - 在所有領域（包括創造力、社交）都超越人類智慧的 AI (Surpassing Human Intelligence in All Domains)
  - 能自動駕駛的 AI (Self-Driving AI)，專精於自動駕駛任務的弱 AI。
  - 能聊天的 AI (Chatbot AI)，專精於對話任務的弱 AI。
  correct_index: 1
  explanation: Super AI 指的是在智力、創造力等各方面都全面碾壓人類的假設性存在。
