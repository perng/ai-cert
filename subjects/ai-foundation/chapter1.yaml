- chapter_title: 人工智慧的本質與層次架構
  section_title: 人類與 AI 的協作模式
  text: 情境：Netflix 的影片推薦系統屬於哪種協作模式？
  type: multiple_choice
  options:
  - HITL (Human-in-the-loop)，人類參與每個推薦決策。
  - HOTL (Human-over-the-loop)，人類監督推薦系統運作。
  - HOOTL (Human-out-of-the-loop)，全自動推薦無需人類介入。
  - 人工推薦 (Manual Recommendation)，完全由人類手動選擇推薦內容。
  correct_index: 2
  explanation: 推薦過程是全自動的，根據演算法直接向用戶展示結果，人類員工不會介入每一次的推薦決策。
