  id: 11417
  usage: both
- chapter_title: 人工智慧的本質與層次架構
  section_title: 技術層次關係
  text: 情境：下列哪種技術不屬於「機器學習」的範疇？
  type: multiple_choice
  options:
  - 深度學習 (Deep Learning)，使用多層神經網路的機器學習方法。
  - 支援向量機 (SVM)，使用超平面進行分類的機器學習方法。
  - 專家系統 (Expert Systems)，基於規則庫的符號式 AI，不屬於機器學習。
  - 決策樹 (Decision Tree)，透過樹狀結構進行分類的機器學習方法。
  correct_index: 2
  explanation: 專家系統屬於「符號式 AI」或「規則驅動 AI」，不具備從數據中學習的能力，因此不屬於機器學習。
  tags:
