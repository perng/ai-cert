  - 完全無法運作 (Completely Non-Functional)，在小數據集上會失敗。
  - 表現通常比深度學習差 (Generally Worse Performance)，準確率明顯較低。
  correct_index: 1
  explanation: 深度學習依賴海量數據，若數據量不足，傳統機器學習（如 SVM, Random Forest）往往能有更好或相當的表現。
