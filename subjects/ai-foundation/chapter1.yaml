- id: 1032
  chapter_title: 人工智慧的本質與層次架構
  section_title: 傳統機器學習 vs. 深度學習
  text: 為什麼深度學習通常需要高階 GPU？
  type: multiple_choice
  options:
  - 因為 GPU 比較便宜 (More Cost-Effective)，能夠降低整體運算成本。
