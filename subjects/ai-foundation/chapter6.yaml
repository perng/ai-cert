  text: 關於監督式學習（Supervised Learning ） 與非監督式學習 （Unsupervised Learning）的目標，下列敘述何者錯誤？ 1.非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與 降維，而不依賴外部標籤。 2.監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測 任務。 3.非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。 4.監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間 的差距，學習輸入與目標之間的對應函數。 5.所有監督式學習任務都必須要有大量完整標註資料，否則無法進行 任何有效的模型訓練。 6.非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進行模式學習。 (114年第四梯次)
