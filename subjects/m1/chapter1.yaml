- id: 3141
  chapter_title: 人工智慧數學基礎
  section_title: 深度思考情境題
  text: 情境：你正在開發一個用於檢測罕見疾病的 AI 模型。該疾病的發病率僅為 0.1%。如果你訓練的模型預測所有人都「沒病」，其準確率 (Accuracy) 將高達 99.9%。請問這個指標是否足以評估模型好壞？為什麼？
  type: multiple_choice
  options:
  - 足以，因為 99.9% 準確率非常高。
  - 不足以，因為這忽略了偽陽性。
  - 不足以，應參考召回率 (Recall) 或 F1-score。
  - 足以，只要模型運算速度夠快。
  correct_index: 2
  explanation: 在類別不平衡（Imbalanced Data）問題中，準確率 (Accuracy) 往往具有欺騙性。模型只需盲目猜測多數類別即可獲得高分，但對於我們真正關心的少數類別（罕見病）卻毫無偵測能力。因此需使用 Recall, Precision 或 F1-score 等指標。
  tags:
  - chap-m1-ch1
  - sec-scenario
- id: 3142
  chapter_title: 人工智慧數學基礎
  section_title: 深度思考情境題
  text: 情境：在訓練神經網路時，你發現損失函數 (Loss) 在訓練集上持續下降，但在驗證集 (Validation Set) 上卻開始上升。這代表發生了什麼現象？應採取什麼數學上的策略來解決？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)；應增加模型複雜度。
  - 過擬合 (Overfitting)；應使用正則化 (Regularization)。
  - 梯度消失；應更換活化函數。
  - 學習率過大；應降低學習率。
  correct_index: 1
  explanation: 訓練集表現好但驗證集表現變差是典型的過擬合現象。數學上，這意味著模型擬合了訓練數據中的雜訊。解決方案包括在損失函數中加入正則化項（限制權重大小）或使用 Dropout 等技術。
  tags:
  - chap-m1-ch1
  - sec-scenario
- id: 3143
  chapter_title: 人工智慧數學基礎
  section_title: 深度思考情境題
  text: 情境：某電商平台希望透過 A/B 測試來評估新版網頁是否能提升購買率。經過一週測試，A 組購買率 5.0%，B 組 5.2%，p-value 為 0.03。若顯著水準設為 0.05，你應如何解讀並建議？
  type: multiple_choice
  options:
  - p-value < 0.05，差異顯著，建議採用 B 版網頁。
  - p-value < 0.05，差異不顯著，建議維持 A 版。
  - 雖然統計顯著，但 0.2% 的提升可能不具商業實質意義。
  - 數據不足，無法判斷。
  correct_index: 2
  explanation: 雖然 p < 0.05 達到統計顯著性，但在商業決策中，還需考慮「實質顯著性」。0.2% 的微幅提升是否值得投入巨大的改版成本？這需要結合商業邏輯（如預期營收增加 vs 開發成本）進行綜合判斷，而非僅看 p-value。
  tags:
  - chap-m1-ch1
  - sec-scenario
- id: 3144
  chapter_title: 人工智慧數學基礎
  section_title: 深度思考情境題
  text: 情境：在使用梯度下降法訓練模型時，若損失函數的曲面呈現狹長的峽谷狀（在一個方向坡度陡，另一個方向坡度緩），標準 SGD 容易發生什麼問題？應如何改善？
  type: multiple_choice
  options:
  - 收斂過快；應減少學習率。
  - 在峽谷壁間來回震盪，收斂緩慢；應使用動量 (Momentum) 或自適應學習率優化器。
  - 直接發散；應增加批次大小。
  - 陷入局部最小值；應使用隨機初始化。
  correct_index: 1
  explanation: 在狹長峽谷狀的損失曲面上，SGD 容易在陡峭方向上大幅震盪，而在平緩方向上移動緩慢。動量法 (Momentum) 能累積過去的梯度方向，加速通過平緩區並抑制震盪；Adam 等自適應方法則能針對不同參數調整學習率，有效解決此問題。
  tags:
  - chap-m1-ch1
  - sec-scenario
- id: 3145
  chapter_title: 人工智慧數學基礎
  section_title: 深度思考情境題
  text: 情境：你正在處理一個高維度的數據集（如 1000 個特徵），打算使用 PCA 進行降維。PCA 透過特徵值分解找到主成分。若前兩個主成分的特徵值總和佔所有特徵值總和的 95%，這代表什麼幾何意義？
  type: multiple_choice
  options:
  - 數據在二維空間中是線性不可分的。
  - 數據 95% 的變異量 (Variance) 集中在由這兩個主成分構成的二維平面上。
  - 數據有 95% 是雜訊。
  - 剩下的 998 個維度完全沒有用。
  correct_index: 1
  explanation: PCA 的特徵值代表了對應主成分方向上的變異量。若前兩個主成分解釋了 95% 的總變異，意味著數據的主要結構（資訊）幾乎都保留在這 2D 平面上，這為高維數據的視覺化和簡化提供了強有力的數學依據。
  tags:
  - chap-m1-ch1
  - sec-scenario
