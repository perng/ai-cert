  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：在 A/B 測試中，若計算出的 p-value 為 0.03，且顯著水準 (alpha) 設為 0.05，決策應為？
  type: multiple_choice
  options:
  - 重新測試，因為 p-value 太接近 0.05
  - 拒絕虛無假設 (H0)，認為結果具統計顯著性 (Statistically Significant)
  - 接受虛無假設 (H0)，認為無顯著差異
  - 無法判斷，需要更多數據
  correct_index: 1
  explanation: 當 p-value < alpha 時，表示在 H0 為真的前提下觀察到此結果的機率極低，因此拒絕 H0。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3148
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 線性代數
  text: 情境：在推薦系統中，若想計算兩個使用者對電影喜好的相似程度，常計算其特徵向量的？
  type: multiple_choice
  options:
  - 內積 (Dot Product) 或 餘弦相似度 (Cosine Similarity)
  - 外積 (Outer Product)
  - 行列式值 (Determinant)
  - 特徵值 (Eigenvalue)
  correct_index: 0
  explanation: 內積與餘弦相似度能衡量兩個向量在方向上的一致性，即使用者的喜好是否相近。
