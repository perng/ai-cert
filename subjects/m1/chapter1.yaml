  - chap-m1-ch1
  - sec-prob-stats
  id: 3151
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 線性代數
  text: 情境：若兩個向量的內積為 0，代表它們在幾何上的關係是？
  type: multiple_choice
  options:
  - 兩向量相等 (Equal)
  - 兩向量正交或垂直 (Orthogonal / Perpendicular)
  - 兩向量平行 (Parallel)
  - 兩向量方向相反 (Opposite)
  correct_index: 1
  explanation: 內積為 0 意味著兩個向量之間沒有投影分量，即互相垂直。
  tags:
  - chap-m1-ch1
  - sec-linear-algebra
  id: 3152
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 微積分與最佳化
  text: 情境：函數在某一點的「梯度 (Gradient)」指向？
  type: multiple_choice
  options:
  - 函數值增長最快的方向 (Direction of Steepest Ascent)
  - 切線方向 (Tangent Direction)
  - 函數值下降最快的方向 (Direction of Steepest Descent)
  - 水平方向 (Horizontal Direction)
  correct_index: 0
  explanation: 梯度向量指向函數值增加速率最大的方向。
  tags:
  - chap-m1-ch1
  - sec-calculus-optimization
  id: 3153
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：泊松分佈 (Poisson Distribution) 最適合用來預測？
  type: multiple_choice
  options:
  - 股票價格 (Stock Prices)
  - 考試成績 (Exam Scores)
  - 某段時間內客服中心接到的電話數量 (Number of Calls in a Time Interval)
  - 身高體重 (Height and Weight)
  correct_index: 2
  explanation: 泊松分佈適用於描述固定時間或空間內稀有事件發生的次數。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3154
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 線性代數
  text: 情境：矩陣 $A$ 的特徵值 $\lambda$ 和特徵向量 $v$ 滿足什麼關係？
  type: multiple_choice
  options:
  - $Av = v$
  - $Av = 0$
  - $Av = \lambda v$，即矩陣作用於特徵向量等於縮放該向量
  - $A = \lambda v$
  correct_index: 2
  explanation: 矩陣作用在特徵向量上，僅改變其長度（縮放 $\lambda$ 倍），不改變方向。
  tags:
  - chap-m1-ch1
  - sec-linear-algebra
  id: 3155
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：變異數 (Variance) 主要用來衡量數據的？
  type: multiple_choice
  options:
  - 數據的中心位置 (Central Tendency)
  - 數據的最大值 (Maximum Value)
  - 數據的離散程度或分散狀況 (Dispersion / Spread)
  - 數據的最小值 (Minimum Value)
  correct_index: 2
  explanation: 變異數計算數據點與平均值的距離平方平均，反映數據的波動大小。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3156
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 微積分與最佳化
  text: 情境：導數 (Derivative) 在幾何上的意義是？
  type: multiple_choice
  options:
  - 函數的最大值 (Maximum Value)
  - 曲線下的面積 (Area Under Curve)
  - 函數的最小值 (Minimum Value)
  - 曲線在該點的切線斜率 (Slope of Tangent)，代表瞬時變化率
  correct_index: 3
  explanation: 導數描述函數在某一點的瞬時變化率，幾何上表現為切線斜率。
  tags:
  - chap-m1-ch1
  - sec-calculus-optimization
  id: 3157
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：中央極限定理 (CLT) 指出，當樣本數夠大時，樣本平均數的抽樣分佈會趨近於？
  type: multiple_choice
  options:
  - 均勻分佈 (Uniform Distribution)
  - 指數分佈 (Exponential Distribution)
  - 常態分佈 (Normal Distribution)
  - 泊松分佈 (Poisson Distribution)
  correct_index: 2
  explanation: CLT 是統計推論的基礎，解釋了為何常態分佈在自然界中如此常見。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3158
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 線性代數
  text: 情境：矩陣乘法 $C = AB$ 中，$C_{ij}$ 的值是？
  type: multiple_choice
  options:
  - $A$ 的第 $i$ 列與 $B$ 的第 $j$ 行的內積 (Dot Product of Row i of A and Column j of B)
  - $A_{ij} + B_{ij}$ (Element-wise Addition)
  - $A$ 的第 $i$ 行與 $B$ 的第 $j$ 列的內積
  - $A_{ij} * B_{ij}$ (Element-wise Multiplication)
  correct_index: 0
  explanation: 矩陣乘法的定義是左矩陣的列向量與右矩陣的行向量做內積。
  tags:
  - chap-m1-ch1
  - sec-linear-algebra
  id: 3159
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 微積分與最佳化
  text: 情境：在訓練神經網路時，我們通常希望「最小化」哪個函數？
  type: multiple_choice
  options:
  - 活化函數 (Activation Function)
  - 輸入函數 (Input Function)
  - 損失函數 (Loss Function)，衡量預測值與真實值的誤差
  - 輸出函數 (Output Function)
  correct_index: 2
  explanation: 損失函數衡量模型預測與真實值的誤差，訓練目標就是讓這個誤差越小越好。
  tags:
  - chap-m1-ch1
  - sec-calculus-optimization
  id: 3160
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：二項式分佈 (Binomial Distribution) 的期望值是？
  type: multiple_choice
  options:
  - $p$
  - $np$，即試驗次數乘以成功機率
  - $n$
  - $np(1-p)$，這是變異數
  correct_index: 1
  explanation: "二項式分佈是 $n$ 次獨立伯努利試驗的總和，故期望值為 $n \times p$。"
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3161
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：Type I Error (型一錯誤) 是指？
  type: multiple_choice
  options:
  - 數據收集過程中的錯誤 (Data Collection Error)
  - 計算過程中的數值錯誤 (Calculation Error)
  - H0 為真卻拒絕 H0 (False Positive / Type I Error)
  - H0 為假卻接受 H0 (False Negative / Type II Error)
  correct_index: 2
  explanation: "顯著水準 $\alpha$ 就是在控制發生 Type I Error 的機率上限。"
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3162
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 線性代數
  text: 情境：PCA (主成分分析) 利用矩陣的什麼特性來找到數據變異最大的方向？
  type: multiple_choice
  options:
  - 轉置矩陣 (Transpose Matrix)
  - 逆矩陣 (Inverse Matrix)
  - 特徵向量 (Eigenvectors)，代表數據分佈的主軸方向
  - 對角矩陣 (Diagonal Matrix)
  correct_index: 2
  explanation: 共變異數矩陣的特徵向量指出了數據分佈的主軸方向。
  tags:
  - chap-m1-ch1
  - sec-linear-algebra
  id: 3163
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 微積分與最佳化
  text: 情境：偏導數 (Partial Derivative) 是指？
  type: multiple_choice
  options:
  - 多變數函數對其中一個變數求導，將其他變數視為常數 (Partial Derivative)
  - 對所有變數同時求導 (Total Derivative)
  - 無法計算 (Undefined)
  - 積分的相反運算 (Anti-derivative)
  correct_index: 0
  explanation: 在多變數函數中，偏導數分析單一變數變化對函數值的影響。
  tags:
  - chap-m1-ch1
  - sec-calculus-optimization
  id: 3164
  usage: both
- chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 情境：標準差 (Standard Deviation) 與變異數的關係是？
  type: multiple_choice
  options:
  - 標準差 = 變異數 (Standard Deviation = Variance)
  - 標準差 = 變異數的平方根 (Standard Deviation = Square Root of Variance)
  - 兩者沒有數學關係 (No Relationship)
  - 標準差 = 變異數的平方 (Standard Deviation = Variance Squared)
  correct_index: 1
  explanation: 標準差將變異數開根號，使其單位與原始數據一致，較易解讀。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  id: 3165
  usage: both
- id: 3166
  chapter_title: 人工智慧數學基礎
  section_title: 機率與統計
  text: 貝氏定理在機器學習中的核心用途為何？
  type: multiple_choice
  options:
  - 將先驗知識與新觀察資料結合，更新事件發生的後驗機率
  - 將所有特徵強制轉換為常態分佈
  - 讓梯度下降不需要設定學習率
  - 保證模型在測試資料上一定不會過擬合
  correct_index: 0
  explanation: 貝氏定理用 $P(B|A)$、$P(A)$ 與 $P(B)$ 更新 $P(A|B)$，常用於分類與不確定性推論。
  tags:
  - chap-m1-ch1
  - sec-prob-stats
  usage: both
- id: 3167
  chapter_title: 人工智慧數學基礎
  section_title: 微積分與最佳化
  text: 若迴歸資料含有明顯離群值，且希望損失函數不要過度放大大誤差，下列何者通常比 MSE 更穩健？
  type: multiple_choice
  options:
  - MAE 或 Huber Loss
  - Softmax
  - 交叉熵損失
  - Gini 不純度
  correct_index: 0
  explanation: MSE 會平方誤差，對離群值非常敏感；MAE 與 Huber Loss 對極端誤差較穩健。
  tags:
  - chap-m1-ch1
  - sec-calculus-optimization
  usage: both
