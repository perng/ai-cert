  usage: both
- id: 3232
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據不一致 (Inconsistency) 的例子是？
  type: multiple_choice
  options:
  - 存在異常值 (Outliers)
  - 數據量太少 (Insufficient Data)
  - 同一地址在不同記錄中寫法不同 (Inconsistent Representation)，如 "St." vs "Street"
  - 某欄位有缺失值 (Missing Values)
  correct_index: 2
  explanation: 數據不一致指同一實體的表示方式不統一，這會阻礙正確的統計與分析，需透過標準化清洗解決。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
  usage: both
- id: 3233
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 嵌入法 (Embedded Method) 與包裹法 (Wrapper Method) 的主要區別是？
  type: multiple_choice
  options:
  - 嵌入法隨機選擇特徵 (Embedded selects randomly)
  - 嵌入法不使用模型 (Embedded uses no model)
  - 嵌入法在模型訓練過程中同時進行特徵選擇 (Feature selection during training)
  - 包裹法只適用於回歸 (Wrapper only for regression)
  correct_index: 2
  explanation: 包裹法需反覆訓練模型多次；嵌入法（如 Lasso, 決策樹）則是在單次訓練過程中，利用算法本身的機制（如權重懲罰、資訊增益）完成特徵選擇。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
  usage: both
- id: 3234
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據整合 (Data Integration) 的主要挑戰不包括？
  type: multiple_choice
  options:
  - 實體識別 (Entity Resolution)，識別不同來源的同一實體
  - 模型選擇 (Model Selection)，這屬於建模階段
  - 數據值衝突 (Data Value Conflict)，解決不同來源的數值差異
  - 數據冗餘 (Data Redundancy)，處理重複資訊
  correct_index: 1
  explanation: 數據整合關注的是合併不同來源的數據，挑戰在於識別同一實體、處理重複和衝突。模型選擇屬於建模階段。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
  usage: both
- id: 3235
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 多項式特徵 (Polynomial Features) 擴展的主要用途是？
  type: multiple_choice
  options:
  - 減少特徵數量 (Reduce Feature Count)
  - 消除雜訊 (Eliminate Noise)
  - 處理缺失值 (Handle Missing Values)
  - 讓線性模型能夠擬合非線性關係 (Enable Linear Models to fit Non-linear Relationships)
  correct_index: 3
  explanation: 通過增加特徵的高次項（如 $x^2, x^3$），可以將原本的非線性問題映射到高維空間，使其變為線性可分。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
  usage: both
- id: 3236
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據縮減 (Data Reduction) 的策略不包括？
  type: multiple_choice
  options:
  - 數值歸約 (Numerosity Reduction)，如抽樣
  - 數據壓縮 (Data Compression)，如小波轉換
  - 數據增強 (Data Augmentation)，這會增加數據量
  - 降維 (Dimensionality Reduction)，如 PCA
  correct_index: 2
