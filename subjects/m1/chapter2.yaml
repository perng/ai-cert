- id: 3239
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 領域知識 (Domain Knowledge) 在特徵工程中的作用是？
  type: multiple_choice
  options:
  - 不重要，讓 AI 自己學就好
  - 至關重要，能指導我們構建有意義的特徵
  - 僅用於資料清洗
  - 僅用於結果解釋
  correct_index: 1
  explanation: 機器學習不是魔法。領域知識能幫助我們理解數據背後的機制，創造出模型容易學習的特徵（如金融中的負債比率）。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3240
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據轉換 (Data Transformation) 中的「平滑化 (Smoothing)」常用於？
  type: multiple_choice
  options:
  - 增加雜訊
  - 去除雜訊，揭示數據趨勢
  - 增加異常值
  - 降維
  correct_index: 1
  explanation: 平滑化（如移動平均）可以過濾掉短期的隨機波動（雜訊），讓長期趨勢更明顯。
