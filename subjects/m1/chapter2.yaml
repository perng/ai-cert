  section_title: 特徵工程
  text: 情境：特徵選擇中的「包裹法 (Wrapper Method)」通常比過濾法？
  type: multiple_choice
  options:
  - 慢且計算成本高，但通常能找到對特定模型更好的特徵組合 (Slower but Better Performance)
