  id: 3246
  usage: both
- chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 情境：若要使用 KNN 演算法，為什麼通常需要先對資料進行正規化 (Normalization)？
  type: multiple_choice
  options:
  - 為了加密 (Encryption)
  - 為了節省空間 (Save Space)
  - 因為 KNN 基於距離計算，若特徵尺度差異過大 (如身高 vs 薪水)，大尺度的特徵會主導距離計算 (Dominance by Scale)
  - KNN 不需要正規化 (Not Required)
  correct_index: 2
  explanation: 正規化能將所有特徵縮放到相同範圍，避免特定特徵權重過大。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
  id: 3247
  usage: both
- chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 情境：PCA (主成分分析) 的主要功能是？
  type: multiple_choice
  options:
  - 分類 (Classification)
  - 填補缺失值 (Impute Missing Values)
  - 增加特徵數量 (Increase Features)
  - 線性降維，保留數據中變異數最大的方向 (Linear Dimensionality Reduction)
  correct_index: 3
  explanation: PCA 透過投影將高維數據壓縮到低維空間，同時盡可能保留原始資訊（變異數）。
