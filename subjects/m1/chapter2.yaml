- chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 情境：如果缺失值比例過高（如超過 50%），通常建議？
  type: multiple_choice
  options:
  - 刪除該欄位 (Drop Feature)，因為資訊量太少
  - 用 0 填補 (Zero Imputation)
  - 保留 (Keep as is)
  - 用平均值填補 (Mean Imputation)
  correct_index: 0
  explanation: 過多缺失值的特徵通常缺乏資訊量，強行填補可能引入雜訊。
