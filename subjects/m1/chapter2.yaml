  - sec-data-preprocessing
- id: 3241
  chapter_title: 資料處理基礎
  section_title: 深度思考情境題
  text: 情境：你正在為一個即時詐欺偵測系統建立模型。數據集包含數百萬筆交易，但其中只有 0.1% 是詐欺（嚴重類別不平衡）。在進行特徵工程與預處理時，你應避免下列哪種操作？
  type: multiple_choice
  options:
  - 使用 SMOTE 進行過採樣 (Oversampling)。
  - 使用欠採樣 (Undersampling) 減少正常交易數量。
  - 直接使用準確率 (Accuracy) 作為特徵選擇的評估指標。
  - 構建反映用戶過去行為模式的聚合特徵。
  correct_index: 2
  explanation: 在極度不平衡的數據中，準確率會產生誤導（盲猜「正常」就有 99.9% 準確率）。若基於準確率來選擇特徵，可能會選出對偵測詐欺毫無幫助的特徵，應改用 F1-score 或 AUC。
  tags:
  - chap-m1-ch2
  - sec-scenario
- id: 3242
  chapter_title: 資料處理基礎
  section_title: 深度思考情境題
  text: 情境：你正在處理一個包含「國家」特徵的全球銷售數據集，共有 180 個不同的國家。若直接使用 One-Hot Encoding，會產生 180 個新欄位，導致維度災難。下列哪種替代方案最不合適？
  type: multiple_choice
  options:
  - Target Encoding：用各國的平均銷售額代替國家名稱。
  - Frequency Encoding：用各國在數據中出現的頻率代替。
  - Label Encoding：按字母順序將國家編碼為 1~180 的整數。
  - 將低頻國家合併為 "Other" 類別，再進行 One-Hot Encoding。
  correct_index: 2
  explanation: Label Encoding 會賦予國家一個無意義的順序（如阿富汗=1, 辛巴威=180），模型可能會錯誤地學習到「國家編號越大，銷售額越高」這種不存在的線性關係。Target Encoding 或合併低頻類別是更好的選擇。
  tags:
  - chap-m1-ch2
  - sec-scenario
- id: 3243
  chapter_title: 資料處理基礎
  section_title: 深度思考情境題
  text: 情境：在房價預測任務中，你發現訓練集和測試集的特徵分佈有顯著差異（Covariate Shift），例如訓練集多為市中心小豪宅，測試集多為郊區大別墅。這時進行標準化 (Standardization) 應注意什麼？
  type: multiple_choice
  options:
  - 應將訓練集和測試集和併後一起計算均值和標準差。
  - 應分別對訓練集和測試集獨立計算均值和標準差進行轉換。
  - 應僅使用訓練集的均值和標準差來轉換測試集。
  - 不應進行標準化。
  correct_index: 2
  explanation: 嚴格來說，測試集代表未知的未來數據，我們不能預先知道其分佈。正確流程永遠是 `scaler.fit(train)` 然後 `scaler.transform(train)` 和 `scaler.transform(test)`。若分佈差異過大，應考慮重新收集數據或使用領域適應 (Domain Adaptation) 技術，而非錯誤地操作數據。
  tags:
  - chap-m1-ch2
  - sec-scenario
- id: 3244
  chapter_title: 資料處理基礎
  section_title: 深度思考情境題
  text: 情境：你使用 PCA 將數據降維到 2D 進行視覺化，發現不同類別的點混雜在一起，無法區分。這是否代表這些數據在本質上無法分類？
  type: multiple_choice
  options:
  - 是，PCA 證明了它們線性不可分。
  - 否，PCA 是一種線性降維，可能無法捕捉複雜的非線性流形結構。
  - 是，說明數據品質太差。
  - 否，說明應該保留更多主成分。
  correct_index: 1
  explanation: PCA 只能提取線性特徵。許多高維數據（如圖像、文字）的結構是非線性的（流形），在 PCA 的線性投影下會重疊。t-SNE 或 UMAP 等非線性方法更有機會將它們分開。
  tags:
  - chap-m1-ch2
  - sec-scenario
- id: 3245
  chapter_title: 資料處理基礎
  section_title: 深度思考情境題
  text: 情境：某特徵存在大量缺失值，你決定使用 KNN (K-Nearest Neighbors) 進行填補。在執行 KNN 填補之前，必須先執行哪項預處理步驟？為什麼？
  type: multiple_choice
  options:
  - 刪除異常值；因為 KNN 對異常值不敏感。
  - 資料正規化 (Normalization)；因為 KNN 基於距離計算。
  - PCA 降維；為了加速計算。
  - One-Hot Encoding；因為 KNN 只能處理類別特徵。
  correct_index: 1
  explanation: KNN 依賴歐幾里得距離尋找最近鄰居。若未正規化，數值範圍大的特徵（如薪水 50000）會掩蓋數值範圍小的特徵（如年齡 30），使得「鄰居」的定義失真，填補結果不準確。
  tags:
  - chap-m1-ch2
  - sec-scenario
