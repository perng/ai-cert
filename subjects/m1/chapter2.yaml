- chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 情境：特徵選擇中的「過濾法 (Filter Method)」是依據什麼來篩選特徵？
  type: multiple_choice
  options:
  - 統計指標 (Statistical Metrics)，如相關係數、卡方檢定
  - 模型準確率 (Model Accuracy)
  - 隨機選擇 (Random Selection)
  - 人工挑選 (Manual Selection)
  correct_index: 0
  explanation: 過濾法不依賴特定模型，而是計算特徵與目標變數間的統計關聯性。
