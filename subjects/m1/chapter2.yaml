questions:
- id: 3201
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 在處理缺失值時，若某個特徵的缺失比例極高（例如超過 80%），通常建議採取什麼策略？
  type: multiple_choice
  options:
  - 使用平均值填補
  - 使用眾數填補
  - 直接刪除該特徵 (Column)
  - 使用機器學習模型預測填補
  correct_index: 2
  explanation: 當缺失比例過高時，該特徵所含的有效資訊極少，填補反而可能引入大量雜訊，因此直接刪除通常是較佳選擇。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3202
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: Min-Max Scaling 將數據縮放到哪個區間？
  type: multiple_choice
  options:
  - [-1, 1]
  - [0, 1]
  - [0, 100]
  - [-infinity, infinity]
  correct_index: 1
  explanation: Min-Max Scaling 的公式為 $(x - min) / (max - min)$，結果必然落在 [0, 1] 之間。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3203
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: Z-score 標準化 (Standardization) 後的數據，其平均值 (Mean) 和標準差 (Std) 分別為？
  type: multiple_choice
  options:
  - Mean=1, Std=0
  - Mean=0, Std=1
  - Mean=0, Std=0
  - Mean=1, Std=1
  correct_index: 1
  explanation: Z-score 標準化將數據轉換為標準常態分佈，其中心為 0，標準差為 1。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3204
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 獨熱編碼 (One-Hot Encoding) 主要用於處理哪種類型的數據？
  type: multiple_choice
  options:
  - 連續型數值 (Continuous Numerical)
  - 無序的類別型特徵 (Nominal Categorical)
  - 時間序列 (Time Series)
  - 圖像像素 (Image Pixels)
  correct_index: 1
  explanation: One-Hot Encoding 將無序類別（如顏色：紅、藍、綠）轉換為二進位向量，避免模型誤以為類別之間存在順序或大小關係。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3205
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 主成分分析 (PCA) 是一種什麼類型的機器學習技術？
  type: multiple_choice
  options:
  - 監督式學習 (Supervised Learning)
  - 非監督式降維 (Unsupervised Dimensionality Reduction)
  - 強化學習 (Reinforcement Learning)
  - 深度學習 (Deep Learning)
  correct_index: 1
  explanation: PCA 不需要標籤 (Labels)，它僅根據特徵間的共變異數結構來尋找主成分，屬於非監督式學習。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3206
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: PCA 的第一個主成分 (PC1) 具有什麼特性？
  type: multiple_choice
  options:
  - 解釋了數據中最小的變異數
  - 解釋了數據中最大的變異數
  - 與原始特徵完全無關
  - 總是垂直於 PC2
  correct_index: 1
  explanation: PCA 尋找投影方向時，PC1 是數據變異量（資訊量）最大的方向。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3207
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: t-SNE 演算法的主要優勢在於？
  type: multiple_choice
  options:
  - 計算速度極快
  - 能保留數據的全局結構 (Global Structure)
  - 能保留數據的局部結構 (Local Structure)
  - 可以處理缺失值
  correct_index: 2
  explanation: t-SNE 擅長將高維空間中距離相近的點在低維空間中保持靠近，因此非常適合將高維數據降維到 2D/3D 進行視覺化以觀察群聚。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3208
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 下列哪種特徵選擇方法是「使用模型來評估特徵子集的效果」，例如遞歸特徵消除 (RFE)？
  type: multiple_choice
  options:
  - 過濾法 (Filter)
  - 包裹法 (Wrapper)
  - 嵌入法 (Embedded)
  - 隨機法 (Random)
  correct_index: 1
  explanation: Wrapper 方法將特徵選擇視為一個搜尋問題，反覆訓練模型來評估不同特徵組合的效能，RFE 即為典型代表。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3209
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 為什麼在使用基於距離的演算法（如 KNN, K-Means）前，必須進行特徵正規化？
  type: multiple_choice
  options:
  - 為了消除缺失值
  - 為了將類別轉為數值
  - 避免數值範圍較大的特徵主導了距離計算
  - 為了增加特徵維度
  correct_index: 2
  explanation: 若特徵 A 範圍是 0-1，特徵 B 範圍是 0-1000，計算歐幾里得距離時，特徵 B 的影響力會遠大於 A。正規化可確保所有特徵權重相等。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3210
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: Lasso 回歸 (L1 Regularization) 具有什麼特殊功能，常被用作嵌入法 (Embedded) 的特徵選擇？
  type: multiple_choice
  options:
  - 將所有係數變大
  - 將不重要的特徵係數壓縮為 0
  - 增加模型複雜度
  - 消除共線性
  correct_index: 1
  explanation: L1 正則化傾向於產生稀疏解，即將不重要的特徵權重降為 0，從而實現自動特徵選擇。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3211
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 下列哪種缺失值填補方法最能保持數據的原始分佈形狀，且不會減少變異數？
  type: multiple_choice
  options:
  - 平均值填補
  - 眾數填補
  - 隨機抽樣填補 (Random Sample Imputation)
  - 刪除法
  correct_index: 2
  explanation: 平均值填補會人為減少變異數（數據變集中）。隨機抽樣填補從現有數據中隨機抽取值來填補，較能維持原始分佈特性。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3212
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: PCA 降維過程中，我們通常通過觀察什麼來決定保留多少個主成分？
  type: multiple_choice
  options:
  - 特徵向量的長度
  - 解釋變異數比率 (Explained Variance Ratio) 的累積和
  - 數據的維度
  - 樣本數量
  correct_index: 1
  explanation: 我們通常希望保留的主成分能解釋大部分的原始數據變異（如 95%），因此會觀察累積解釋變異數比率曲線。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3213
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: t-SNE 中的 "t" 代表什麼？
  type: multiple_choice
  options:
  - 時間 (Time)
  - 溫度 (Temperature)
  - Student's t-distribution (學生 t 分佈)
  - Tensor
  correct_index: 2
  explanation: t-SNE 在低維空間使用 t 分佈（長尾分佈）來計算點之間的相似度，這有助於緩解「擁擠問題」，讓群聚分得更開。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3214
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 對於有序類別特徵 (Ordinal Features)，如「尺寸：S, M, L, XL」，最適合的編碼方式是？
  type: multiple_choice
  options:
  - One-Hot Encoding
  - Label Encoding (整數編碼)
  - 頻率編碼
  - 雜湊編碼
  correct_index: 1
  explanation: 因為類別間存在順序關係 (S < M < L < XL)，將其映射為整數 (0, 1, 2, 3) 可以保留這種順序資訊供模型學習。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3215
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 異常值 (Outliers) 檢測中，常用的 IQR (Interquartile Range) 方法是如何定義異常值的？
  type: multiple_choice
  options:
  - 超過平均值 3 個標準差
  - 小於 Q1 - 1.5*IQR 或 大於 Q3 + 1.5*IQR
  - 數值最大的前 1%
  - 數值為負數
  correct_index: 1
  explanation: 箱型圖法則定義異常值為落在 [Q1 - 1.5*IQR, Q3 + 1.5*IQR] 範圍之外的點。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3216
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 共線性 (Multicollinearity) 指的是？
  type: multiple_choice
  options:
  - 特徵與目標變數高度相關
  - 特徵之間存在高度線性相關
  - 數據缺失太多
  - 模型過擬合
  correct_index: 1
  explanation: 共線性是指自變數（特徵）之間存在高度相關性，這會導致線性回歸模型的係數估計不穩定，難以解釋特徵重要性。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3217
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 下列哪種情況下，資料洩漏 (Data Leakage) 最容易發生？
  type: multiple_choice
  options:
  - 在分割訓練集和測試集之前進行標準化 (Normalization)
  - 在訓練集上訓練模型
  - 使用交叉驗證
  - 刪除缺失值
  correct_index: 0
  explanation: 若在分割前對全體數據進行標準化，測試集的資訊（如平均值、標準差）會洩漏到訓練集中，導致評估結果過於樂觀。正確做法是先分割，再用訓練集的參數去轉換測試集。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3218
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 過濾法 (Filter Method) 進行特徵選擇的主要缺點是？
  type: multiple_choice
  options:
  - 計算量太大
  - 忽略了特徵之間的交互作用 (Interaction)
  - 容易過擬合
  - 需要大量標籤
  correct_index: 1
  explanation: 過濾法通常單獨評估每個特徵與目標的相關性，可能選出冗餘特徵，且無法發現只有組合起來才有效的特徵。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3219
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: PCA 數學推導中，我們計算共變異數矩陣的特徵向量，這些特徵向量代表了？
  type: multiple_choice
  options:
  - 數據的主成分方向
  - 數據的平均值
  - 數據的類別中心
  - 雜訊的大小
  correct_index: 0
  explanation: 共變異數矩陣的特徵向量指向數據變異量最大的方向，即主成分方向。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3220
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 在處理偏態分佈 (Skewed Distribution) 的數據（如長尾分佈）時，常用的轉換方法是？
  type: multiple_choice
  options:
  - 平方轉換
  - 對數轉換 (Log Transformation)
  - 絕對值轉換
  - 倒數轉換
  correct_index: 1
  explanation: 對數轉換可以壓縮大數值、拉伸小數值，有效地將右偏（長尾）分佈轉換為接近常態分佈，利於模型學習。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3221
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 目標編碼 (Target Encoding) 是用什麼來替換類別特徵？
  type: multiple_choice
  options:
  - 類別的頻率
  - 該類別對應的目標變數 (Target) 的平均值
  - 隨機數
  - 類別的排名
  correct_index: 1
  explanation: Target Encoding 直接利用標籤資訊，將類別替換為該類別樣本的目標均值。這對高基數特徵很有效，但需小心資料洩漏。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3222
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: SMOTE (Synthetic Minority Over-sampling Technique) 用於解決什麼問題？
  type: multiple_choice
  options:
  - 缺失值
  - 類別不平衡 (Class Imbalance)
  - 過擬合
  - 維度災難
  correct_index: 1
  explanation: SMOTE 透過在少數類別樣本之間插值生成合成樣本，以平衡數據集，避免模型偏向多數類別。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3223
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 哪種降維方法是線性的？
  type: multiple_choice
  options:
  - t-SNE
  - PCA
  - Autoencoder
  - Isomap
  correct_index: 1
  explanation: PCA 透過線性投影尋找主成分，是線性降維。t-SNE 和 Autoencoder 則是非線性的。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3224
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據清洗中的「去重 (Deduplication)」是指？
  type: multiple_choice
  options:
  - 刪除重複的特徵
  - 刪除重複的記錄 (Rows)
  - 刪除重複的模型
  - 刪除重複的標籤
  correct_index: 1
  explanation: 去重是指識別並移除數據集中完全相同或重複的樣本行，以免影響統計結果或模型訓練。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3225
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 遞歸特徵消除 (RFE) 的工作原理是？
  type: multiple_choice
  options:
  - 隨機選擇特徵
  - 訓練模型，剔除權重最小的特徵
  - 計算所有特徵的相關係數
  - 使用 PCA 轉換
  correct_index: 1
  explanation: RFE 是一種貪婪算法，反覆訓練模型並移除最不重要的特徵，直到達到預定的特徵數量。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3226
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 離散化 (Discretization) 或分箱 (Binning) 的主要目的是？
  type: multiple_choice
  options:
  - 將類別轉為數值
  - 將連續數值轉為區間或類別
  - 填補缺失值
  - 增加數據量
  correct_index: 1
  explanation: 分箱將連續變數（如年齡）切分為區間（如少年、青年、老年），可以平滑雜訊並讓線性模型能處理非線性關係。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3227
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 在 PCA 中，若特徵值 (Eigenvalue) 為 0，代表什麼？
  type: multiple_choice
  options:
  - 該方向上的變異數為 0，無資訊量
  - 該方向最重要
  - 計算錯誤
  - 數據是常態分佈
  correct_index: 0
  explanation: 特徵值代表對應特徵向量方向上的變異數。若為 0，表示數據在該方向上沒有變化（退化），可以捨棄。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3228
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 為什麼在進行 PCA 之前通常需要先對數據進行標準化 (Standardization)？
  type: multiple_choice
  options:
  - PCA 只能處理正數
  - PCA 對變異數敏感，若特徵尺度不同，大尺度的特徵會主導主成分
  - 為了加速計算
  - 為了處理缺失值
  correct_index: 1
  explanation: PCA 尋找最大變異數方向。若未標準化，數值範圍大的特徵（變異數大）會被誤認為最重要，導致分析失真。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3229
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 下列何者不是特徵工程的目的？
  type: multiple_choice
  options:
  - 提高模型預測準確度
  - 減少過擬合
  - 增加數據的雜訊
  - 提高計算效率
  correct_index: 2
  explanation: 特徵工程旨在提取有用資訊、去除雜訊，而非增加雜訊。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3230
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 哪種編碼方式會導致特徵維度急劇增加（維度災難）？
  type: multiple_choice
  options:
  - Label Encoding
  - One-Hot Encoding
  - Target Encoding
  - Binary Encoding
  correct_index: 1
  explanation: One-Hot Encoding 為每個類別創建一個新欄位。若類別數量龐大（如郵遞區號），特徵空間會變得非常稀疏且巨大。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
- id: 3231
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 交互作用特徵 (Interaction Features) 是指？
  type: multiple_choice
  options:
  - 兩個特徵相加
  - 兩個或多個特徵的組合（如乘積）
  - 刪除相關特徵
  - 隨機生成的特徵
  correct_index: 1
  explanation: 例如「房價」可能與「寬度」和「深度」單獨的關係不大，但與「面積」（寬度 x 深度）高度相關。這就是交互作用。
  tags:
  - chap-m1-ch2
  - sec-feature-engineering
- id: 3232
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 數據不一致 (Inconsistency) 的例子是？
  type: multiple_choice
  options:
  - 某欄位有缺失值
  - 同一地址在不同記錄中寫法不同
  - 數據量太少
  - 存在異常值
  correct_index: 1
  explanation: 數據不一致指同一實體的表示方式不統一，這會阻礙正確的統計與分析，需透過標準化清洗解決。
  tags:
