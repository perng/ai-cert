  - 提高模型預測準確度 (Improve Accuracy)
  - 減少過擬合 (Reduce Overfitting)
  - 提高計算效率 (Improve Computational Efficiency)
  correct_index: 0
  explanation: 特徵工程旨在提取有用資訊、去除雜訊，而非增加雜訊。
