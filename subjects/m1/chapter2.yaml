- id: 3238
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 雜訊 (Noise) 與異常值 (Outlier) 的區別是？
  type: multiple_choice
  options:
  - 雜訊是隨機誤差，異常值是偏離整體的極端觀測值
  - 兩者完全相同
  - 雜訊是有用的資訊
  - 異常值總是錯誤的
  correct_index: 0
  explanation: 雜訊通常是測量誤差或隨機波動；異常值則是真實存在但極端的數據，可能包含重要資訊（如詐欺）或僅是錯誤。
  tags:
