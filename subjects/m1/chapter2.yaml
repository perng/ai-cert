- chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 情境：Min-Max Scaling 會將數據縮放到哪個範圍？
  type: multiple_choice
  options:
  - '[0, 1] 之間 (Range [0, 1])'
  - '[0, 100] 之間 (Range [0, 100])'
