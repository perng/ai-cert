- id: 3237
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 在時間序列特徵工程中，「滯後特徵 (Lag Features)」是指？
  type: multiple_choice
  options:
  - 未來的數據
  - 過去時間點的觀測值
  - 時間戳記
  - 季節性指標
  correct_index: 1
  explanation: 滯後特徵將過去的值作為預測當前的特徵，是時間序列預測中最基礎且有效的特徵。
