- chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 情境：One-Hot Encoding 的一個缺點是？
  type: multiple_choice
  options:
  - 當類別數量很多時，會導致特徵維度暴增 (Curse of Dimensionality)
  - 準確率低 (Low Accuracy)
  - 無法處理文字 (Cannot Handle Text)
  - 計算簡單 (Simple Calculation)
  correct_index: 0
  explanation: 若類別有 1000 種，One-Hot 會產生 1000 個新欄位，造成資料稀疏與運算負擔。
