  usage: both
- id: 3238
  chapter_title: 資料處理基礎
  section_title: 資料預處理
  text: 雜訊 (Noise) 與異常值 (Outlier) 的區別是？
  type: multiple_choice
  options:
  - 兩者完全相同 (Identical)
  - 雜訊是有用的資訊 (Noise is useful)
  - 雜訊是隨機誤差，異常值是偏離整體的極端觀測值 (Noise vs Outlier)
  - 異常值總是錯誤的 (Outliers are always errors)
  correct_index: 2
  explanation: 雜訊通常是測量誤差或隨機波動；異常值則是真實存在但極端的數據，可能包含重要資訊（如詐欺）或僅是錯誤。
  tags:
  - chap-m1-ch2
  - sec-data-preprocessing
  usage: both
- id: 3239
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 領域知識 (Domain Knowledge) 在特徵工程中的作用是？
  type: multiple_choice
  options:
  - 僅用於資料清洗 (Only for Cleaning)
  - 僅用於結果解釋 (Only for Interpretation)
  - 不重要，讓 AI 自己學就好 (Not Important)
  - 至關重要，能指導我們構建有意義的特徵 (Crucial for Feature Construction)
  correct_index: 3
  explanation: 機器學習不是魔法。領域知識能幫助我們理解數據背後的機制，創造出模型容易學習的特徵（如金融中的負債比率）。
  tags:
