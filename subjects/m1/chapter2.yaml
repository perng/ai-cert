  usage: both
- id: 3231
  chapter_title: 資料處理基礎
  section_title: 特徵工程
  text: 交互作用特徵 (Interaction Features) 是指？
  type: multiple_choice
  options:
  - 隨機生成的特徵 (Randomly Generated Features)
  - 兩個或多個特徵的組合（如乘積）(Combination/Product of Features)
  - 刪除相關特徵 (Removing Correlated Features)
  - 兩個特徵相加 (Addition of Features)
  correct_index: 1
  explanation: 例如「房價」可能與「寬度」和「深度」單獨的關係不大，但與「面積」（寬度 x 深度）高度相關。這就是交互作用。
  tags:
  - chap-m1-ch2
