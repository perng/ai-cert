  section_title: 資料預處理
  text: 情境：對於基於梯度下降的演算法（如神經網路），正規化的好處是？
  type: multiple_choice
  options:
  - 減少資料量 (Reduce Data Size)
  - 防止過擬合 (Prevent Overfitting)
  - 增加模型複雜度 (Increase Complexity)
