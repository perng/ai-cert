  id: 3351
  usage: both
- chapter_title: 機器學習基礎概念
  section_title: 監督式學習
  text: 情境：SVM 的「核函數 (Kernel Trick)」主要用途是？
  type: multiple_choice
  options:
  - 將低維線性不可分的數據映射到高維空間，使其線性可分 (Map to High-dimensional Space)
  - 壓縮數據 (Compress Data)
  - 降維 (Dimensionality Reduction)
  - 加速計算 (Accelerate Calculation)
  correct_index: 0
  explanation: Kernel Trick 讓 SVM 能有效處理非線性分類問題。
  tags:
  - chap-m1-ch3
  - sec-supervised-learning
  id: 3352
  usage: both
- chapter_title: 機器學習基礎概念
  section_title: 模型評估
  text: 情境：F1 Score 是哪兩個指標的調和平均數？
  type: multiple_choice
  options:
  - Precision 與 Recall
  - TPR 與 FPR
  - Bias 與 Variance
  - Accuracy 與 Recall
  correct_index: 0
  explanation: F1 Score 綜合考量了精確率與召回率，適合評估類別不平衡的資料。
  tags:
  - chap-m1-ch3
  - sec-model-evaluation
  id: 3353
  usage: both
- chapter_title: 機器學習基礎概念
  section_title: 監督式學習
  text: 情境：KNN 演算法中的 K 值若設得太小（例如 K=1），容易導致？
