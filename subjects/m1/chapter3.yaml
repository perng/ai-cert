- chapter_title: 機器學習基礎概念
  section_title: 非監督式學習
  text: 情境：K-Means 分群中，如何決定最佳的 K 值？
  type: multiple_choice
  options:
  - 看心情 (Intuition)
  - K 越大越好 (Larger K is Better)
  - 隨機猜測 (Random Guess)
  - 手肘法 (Elbow Method)，觀察 WCSS 的轉折點
  correct_index: 3
  explanation: 手肘法觀察 WCSS 隨 K 增加的下降幅度，尋找邊際效益遞減的轉折點。
