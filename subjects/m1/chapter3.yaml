  id: 3349
  usage: both
- chapter_title: 機器學習基礎概念
  section_title: 模型評估
  text: 情境：若模型在訓練集表現極好，但在測試集表現很差，這通常是什麼現象？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)，模型太簡單
  - 資料太少 (Insufficient Data)
  - 過擬合 (Overfitting)，模型在訓練集表現好但在測試集表現差
  - 模型太簡單 (Model too Simple)
  correct_index: 2
  explanation: 過擬合代表模型死記了訓練資料的雜訊，導致泛化能力低落。
  tags:
  - chap-m1-ch3
  - sec-model-evaluation
  id: 3350
  usage: both
- chapter_title: 機器學習基礎概念
  section_title: 監督式學習
  text: 情境：決策樹使用什麼指標來決定如何分割節點？
  type: multiple_choice
  options:
  - 距離 (Distance)
  - 資訊獲利 (Information Gain) 或 Gini 不純度 (Gini Impurity)
  - 梯度 (Gradient)
  - 變異數 (Variance)
  correct_index: 1
  explanation: 這些指標衡量分割後資料純度的提升程度，純度越高越好。
