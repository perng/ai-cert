  - 輸出範圍太大 (Output Range too Large)
  correct_index: 0
  explanation: 標準 ReLU 在負區間梯度為 0，可能導致神經元永遠不再激活（死亡）。Leaky ReLU 在負區間給予一個很小的斜率（如 0.01），保留了梯度流動。
