  chapter_title: 深度學習簡介
  section_title: 深度思考情境題
  text: 情境：你正在訓練一個深層神經網路，發現前幾層的權重幾乎不更新，導致模型無法學習。檢查後發現你使用了 Sigmoid 活化函數。這是什麼問題？應如何解決？
