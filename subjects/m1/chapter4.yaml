  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: Leaky ReLU 解決了 ReLU 的什麼問題？
  type: multiple_choice
  options:
  - Dead ReLU 問題（神經元死亡） (Dead ReLU Problem)
