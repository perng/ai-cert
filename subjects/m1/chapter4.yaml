questions:
- id: 3401
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 感知器 (Perceptron) 的基本運算過程是？
  type: multiple_choice
  options:
  - 先通過活化函數，再進行加權求和 (Activation then Weighted Sum)
  - 先進行加權求和，再通過活化函數 (Weighted Sum then Activation)
  - 僅進行加權求和 (Weighted Sum Only)
  - 僅進行活化函數運算 (Activation Function Only)
  correct_index: 1
  explanation: 感知器接收輸入 $x$，計算加權和 $z = w^T x + b$，然後將 $z$ 輸入活化函數 $\phi(z)$ 得到輸出。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3402
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 為什麼神經網路需要活化函數 (Activation Function)？
  type: multiple_choice
  options:
  - 為了將輸出限制在 0 和 1 之間 (Range Constraint)
  - 為了引入非線性，使模型能學習複雜的模式 (Introduce Non-linearity)
  - 為了減少參數數量 (Reduce Parameters)
  - 為了增加計算速度 (Increase Speed)
  correct_index: 1
  explanation: 若沒有非線性活化函數，多層神經網路在數學上僅等價於單層線性模型，無法解決 XOR 等非線性問題。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3403
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: ReLU (Rectified Linear Unit) 活化函數的公式是？
  type: multiple_choice
  options:
  - $f(x) = x$ (Linear)
  - $f(x) = \tanh(x)$ (Tanh)
  - $f(x) = 1 / (1 + e^{-x})$ (Sigmoid)
  - $f(x) = \max(0, x)$ (ReLU)
  correct_index: 3
  explanation: ReLU 函數在 $x > 0$ 時輸出 $x$，在 $x \le 0$ 時輸出 0。它計算簡單且有效緩解了梯度消失問題。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3404
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: Softmax 函數通常用於神經網路的哪一層？
  type: multiple_choice
  options:
  - 隱藏層 (Hidden Layer)
  - 輸入層 (Input Layer)
  - 多分類問題的輸出層 (Output Layer for Multi-class Classification)
  - 卷積層 (Convolutional Layer)
  correct_index: 2
  explanation: Softmax 將輸出向量轉換為機率分佈（所有元素總和為 1），因此非常適合用於多分類任務的最終輸出。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3405
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 反向傳播 (Backpropagation) 演算法的核心數學原理是？
  type: multiple_choice
  options:
  - 微積分中的連鎖律 (Chain Rule)
  - 矩陣分解 (Matrix Factorization)
  - 積分 (Integration)
  - 傅立葉變換 (Fourier Transform)
  correct_index: 0
  explanation: 反向傳播利用連鎖律，將損失函數對輸出層的梯度一層層反向傳遞回輸入層，以計算每個權重的梯度。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3406
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 損失函數 (Loss Function) 的作用是？
  type: multiple_choice
  options:
  - 減少模型的參數量 (Reduce Parameters)
  - 決定模型的架構 (Determine Architecture)
  - 衡量模型預測值與真實值之間的誤差 (Measure Error)
  - 增加模型的準確率 (Increase Accuracy)
  correct_index: 2
  explanation: 損失函數量化了模型預測的好壞，最佳化的目標就是最小化這個函數值。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: quiz
- id: 3407
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 對於二元分類問題，最常用的損失函數是？
  type: multiple_choice
  options:
  - 均方誤差 (MSE)
  - Hinge Loss
  - 交叉熵損失 (Cross-Entropy Loss)
  - 絕對誤差 (MAE)
  correct_index: 2
  explanation: 交叉熵損失能有效衡量兩個機率分佈（預測機率 vs 真實標籤）之間的差異，特別適合分類問題。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: quiz
- id: 3408
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: SGD (Stochastic Gradient Descent) 與傳統梯度下降的主要區別是？
  type: multiple_choice
  options:
  - SGD 不需要計算梯度 (No Gradient)
  - SGD 只能用於線性模型 (Linear Models Only)
  - SGD 每次隨機抽取一個樣本（或小批次）計算梯度 (Random Sampling)
  - SGD 使用所有數據計算梯度 (Batch Gradient Descent)
  correct_index: 2
  explanation: 傳統梯度下降每次更新都要遍歷整個數據集，計算量大；SGD 透過隨機採樣估計梯度，速度快且能跳出局部最佳解。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: quiz
- id: 3409
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: Adam 最佳化器結合了哪兩種技術的優點？
  type: multiple_choice
  options:
  - L1 和 L2 正則化 (Regularization)
  - SGD 和 Adagrad
  - Momentum 和 RMSprop (Momentum & Adaptive Learning Rate)
  - Dropout 和 Batch Normalization
  correct_index: 2
  explanation: Adam 同時利用了一階矩估計（Momentum，慣性）和二階矩估計（RMSprop，自適應學習率），是目前最常用的最佳化器。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: quiz
- id: 3410
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 梯度消失 (Vanishing Gradient) 問題會導致什麼後果？
  type: multiple_choice
  options:
  - 模型過擬合 (Overfitting)
  - 深層網路的前面幾層參數幾乎無法更新 (Parameters Not Updating)
  - 模型訓練速度變快 (Faster Training)
  - 損失函數變成負數 (Negative Loss)
  correct_index: 1
  explanation: 當梯度趨近於 0 時，權重更新量 $\Delta w = -\eta \cdot \text{gradient}$ 也趨近於 0，使得深層網路的前端層「學不動」。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: quiz
- id: 3411
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: Sigmoid 函數的輸出範圍是？
  type: multiple_choice
  options:
  - -1 到 1 之間 (Range [-1, 1])
  - 0 到無窮大 (Range [0, infinity])
  - 負無窮大到正無窮大 (Range [-infinity, infinity])
  - 0 到 1 之間 (Range [0, 1])
  correct_index: 3
  explanation: Sigmoid 將輸入壓縮到 (0, 1) 區間，常用於二元分類的輸出層表示機率。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3412
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 均方誤差 (MSE) 最適合用於哪類問題？
  type: multiple_choice
  options:
  - 多元分類 (Multi-class Classification)
  - 二元分類 (Binary Classification)
  - 迴歸 (Regression)，預測連續數值
  - 分群 (Clustering)
  correct_index: 2
  explanation: MSE 衡量預測數值與真實數值之差的平方平均，是迴歸問題的標準損失函數。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3413
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 在神經網路中，「權重 (Weights)」的作用是？
  type: multiple_choice
  options:
  - 引入非線性 (Introduce Non-linearity)
  - 儲存輸入數據 (Store Input Data)
  - 計算損失 (Calculate Loss)
  - 調節信號的強度，決定輸入特徵的重要性 (Adjust Signal Strength)
  correct_index: 3
  explanation: 權重 $w$ 決定了輸入 $x$ 對下一層神經元輸出的影響程度，是模型需要學習的主要參數。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3414
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 「偏差 (Bias)」在神經元 $z = wx + b$ 中的作用類似於直線方程式中的？
  type: multiple_choice
  options:
  - 截距
  - 斜率
  - 變數
  - 誤差
  correct_index: 0
  explanation: 偏差 $b$ 允許活化函數向左或向右平移，這對於擬合數據至關重要（就像直線 $y=ax+b$ 中的截距 $b$）。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3415
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 學習率 (Learning Rate) 過大會導致？
  type: multiple_choice
  options:
  - 模型準確率提高 (Improved Accuracy)
  - 在最小值附近震盪甚至發散，無法收斂 (Oscillation or Divergence)
  - 梯度消失 (Vanishing Gradient)
  - 收斂速度極慢 (Slow Convergence)
  correct_index: 1
  explanation: 學習率決定步長。步長太大可能直接跨過山谷底部的最低點，甚至衝到對面更高的位置，導致無法收斂。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3416
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 前向傳播 (Forward Propagation) 的主要目的是？
  type: multiple_choice
  options:
  - 更新權重 (Update Weights)
  - 根據當前參數計算預測輸出 (Calculate Output)
  - 計算梯度 (Calculate Gradients)
  - 初始化參數 (Initialize Parameters)
  correct_index: 1
  explanation: 前向傳播是數據從輸入層流向輸出層的過程，最終產生預測結果。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3417
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: Momentum (動量) 技術的主要目的是？
  type: multiple_choice
  options:
  - 加速收斂並抑制震盪 (Accelerate Convergence & Dampen Oscillations)
  - 自動調整學習率 (Auto Adjust Learning Rate)
  - 減少參數量 (Reduce Parameters)
  - 防止過擬合 (Prevent Overfitting)
  correct_index: 0
  explanation: 動量模擬物理慣性，讓參數更新方向保持一致，能加速通過平緩區域並減少在峽谷中的震盪。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3418
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 哪種活化函數在輸入為負時輸出為 0，輸入為正時輸出為輸入值本身？
  type: multiple_choice
  options:
  - Tanh (Hyperbolic Tangent)
  - ReLU (Rectified Linear Unit)
  - Leaky ReLU
  - Sigmoid (S-shaped)
  correct_index: 1
  explanation: 這是 ReLU (Rectified Linear Unit) 的定義：$\max(0, x)$。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3419
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 全連接層 (Fully Connected Layer) 的特點是？
  type: multiple_choice
  options:
  - 每個神經元只連接到上一層的部分神經元 (Sparse Connection)
  - 權重是共享的 (Shared Weights)
  - 神經元之間沒有連接 (No Connection)
  - 每個神經元都與上一層的所有神經元相連 (Dense Connection)
  correct_index: 3
  explanation: 全連接層（Dense Layer）中，上一層的每個輸出都連接到下一層的每個輸入，參數數量最多。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3420
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: Epoch 在深度學習訓練中代表什麼？
  type: multiple_choice
  options:
  - 整個訓練數據集完整通過模型一次 (前向+反向) (Full Dataset Pass)
  - 一個批次 (Batch) 的數據通過模型
  - 一次參數更新 (One Update Step)
  - 訓練結束 (Training End)
  correct_index: 0
  explanation: 一個 Epoch 意味著模型已經看過所有的訓練數據一次。通常需要多個 Epoch 才能訓練收斂。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3421
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: Tanh 活化函數的輸出範圍是？
  type: multiple_choice
  options:
  - 0 到無窮大 (Range [0, infinity])
  - 負無窮大到正無窮大 (Range [-infinity, infinity])
  - -1 到 1 之間 (Range [-1, 1])
  - 0 到 1 之間 (Range [0, 1])
  correct_index: 2
  explanation: Tanh (雙曲正切) 函數將輸入壓縮到 (-1, 1)，其中心為 0，通常比 Sigmoid 收斂更快。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3422
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 批次大小 (Batch Size) 對訓練有什麼影響？
  type: multiple_choice
  options:
  - 批次越小，梯度估計越準確 (Smaller Batch, More Accurate Gradient)
  - 批次越大，泛化能力越好 (Larger Batch, Better Generalization)
  - 批次越大，訓練越快，但記憶體需求越高 (Faster but High Memory)
  - 批次大小不影響訓練 (No Effect)
  correct_index: 2
  explanation: 大批次能利用矩陣運算的並行性加速訓練，但需要更多 GPU 記憶體；小批次引入更多雜訊，有時有助於泛化。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3423
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 深度神經網路 (DNN) 中的「深度」指的是？
  type: multiple_choice
  options:
  - 訓練的時間 (Training Time)
  - 每一層神經元的數量 (Neurons per Layer)
  - 數據的維度 (Data Dimensions)
  - 隱藏層的數量 (Number of Hidden Layers)
  correct_index: 3
  explanation: 深度學習之所以「深」，是因為它堆疊了多個隱藏層，使其能學習分層次的特徵表示。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3424
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 權重初始化 (Weight Initialization) 若將所有權重設為 0，會發生什麼？
  type: multiple_choice
  options:
  - 模型訓練非常快 (Fast Training)
  - 喪失對稱性 (Symmetry Breaking) 失敗，導致所有神經元學到相同特徵
  - 模型準確率最高 (Highest Accuracy)
  - 不會有影響 (No Effect)
  correct_index: 1
  explanation: 若所有權重初始化為 0，則同一層的所有神經元在反向傳播時獲得的梯度都相同，導致它們永遠同步更新，無法學習不同的特徵。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3425
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 為什麼 ReLU 比 Sigmoid 更受歡迎？
  type: multiple_choice
  options:
  - ReLU 在正區間梯度恆為 1，有效解決梯度消失問題 (Solves Vanishing Gradient)
  - ReLU 是線性的 (Linear)
  - ReLU 輸出範圍是 (-1, 1) (Range [-1, 1])
  - ReLU 計算複雜 (Complex Calculation)
  correct_index: 0
  explanation: Sigmoid 在兩端飽和區梯度趨近 0，導致梯度消失。ReLU 簡單且在正區間無此問題，加速了深層網路的收斂。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3426
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: RMSprop 最佳化器的主要特點是？
  type: multiple_choice
  options:
  - 不更新權重 (No Weight Update)
  - 自適應調整學習率 (Adaptive Learning Rate)
  - 使用動量 (Use Momentum)
  - 隨機梯度下降 (Stochastic Gradient Descent)
  correct_index: 1
  explanation: RMSprop 通過除以梯度的滑動平均平方根來調整每個參數的學習率，解決了 Adagrad 學習率單調遞減過快的問題。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3427
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 多層感知器 (MLP) 至少包含幾層？
  type: multiple_choice
  options:
  - '2 層 (輸入、輸出) (2 Layers: Input, Output)'
  - '3 層 (輸入、隱藏、輸出) (3 Layers: Input, Hidden, Output)'
  - 無限層 (Infinite Layers)
  - '1 層 (輸入層) (1 Layer: Input)'
  correct_index: 1
  explanation: MLP 至少包含一個隱藏層，才能處理非線性問題。結構為：輸入層 -> 隱藏層 -> 輸出層。
  tags:
  - chap-m1-ch4
  - sec-neural-networks
  usage: both
- id: 3428
  chapter_title: 深度學習簡介
  section_title: 最佳化
  text: 什麼是「早停 (Early Stopping)」？
  type: multiple_choice
  options:
  - 當驗證集誤差不再下降（甚至開始上升）時停止訓練 (Stop when Validation Error Plateaus/Increases)
  - 在訓練開始前停止 (Stop Before Training)
  - 當訓練集誤差為 0 時停止 (Stop when Training Error is 0)
  - 固定訓練 10 個 Epoch (Fixed Epochs)
  correct_index: 0
  explanation: 早停是一種正則化技術，通過監控驗證集表現來決定何時停止訓練，避免模型過度擬合訓練數據。
  tags:
  - chap-m1-ch4
  - sec-optimization
  usage: both
- id: 3429
  chapter_title: 深度學習簡介
  section_title: 神經網路
  text: 輸入層 (Input Layer) 的神經元數量取決於？
  type: multiple_choice
  options:
  - 輸出類別數量 (Number of Output Classes)
  - 輸入數據的特徵維度 (Input Feature Dimensions)
  - 隨機決定 (Randomly Determined)
  - 隱藏層數量 (Number of Hidden Layers)
  correct_index: 1
  explanation: 輸入層負責接收原始數據，其神經元數量必須等於輸入向量的維度（特徵數）。
