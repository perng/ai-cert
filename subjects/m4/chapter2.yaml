- id: 6238
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: Self-Attention (自注意力) 機制計算的是？
  type: multiple_choice
  options:
  - 輸入與輸出的關係
  - 輸入序列中每個元素與其他所有元素的相關性
  - 圖像與文字的關係
  - 過去與未來的關係
  correct_index: 1
  explanation: 每個字都去「關注」句子裡的其他字，計算出相關性權重，從而理解上下文（如 "it" 到底指代什麼）。
