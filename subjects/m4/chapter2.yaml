- id: 6240
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 為什麼 ResNet 能訓練上千層的網路？
  type: multiple_choice
  options:
  - 因為使用了高效能的 GPU 進行訓練
  - 因為使用了 Dropout 技術防止過擬合
  - 因為使用了殘差連接 (Residual Connection)，解決了梯度消失問題
