- id: 6235
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 領域適應 (Domain Adaptation) 是遷移學習的一種，旨在解決什麼問題？
  type: multiple_choice
  options:
  - 訓練數據和測試數據分佈不同
  - 模型太小
  - 計算太慢
  - 標籤錯誤
  correct_index: 1
  explanation: 例如在白天圖片上訓練的自駕車模型，要遷移到晚上場景。雖然任務一樣（開車），但數據分佈（光照）變了。
  tags:
