- id: 6245
  chapter_title: 深度學習框架與架構
  section_title: 深度思考情境題
  text: 情境：你的模型在訓練集和驗證集上表現都很好，但部署到實際環境後，發現對於「模糊」或「遮擋」的圖片辨識率極低。這說明了什麼？
  type: multiple_choice
  options:
  - 模型過擬合。
  - 訓練數據缺乏多樣性 (魯棒性不足)。
  - 模型欠擬合。
  - 框架有問題。
  correct_index: 1
  explanation: 模型沒看過模糊圖片，自然不會認。數據增強能模擬真實世界的各種惡劣情況，提升模型的魯棒性。
