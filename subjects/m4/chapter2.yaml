- id: m4-114-2-006
  chapter_title: 深度學習框架與架構
  section_title: 歷屆考題
  text: '某智慧城市團隊開發一套交通監控系統，用於即時辨識路口監視器影像中的車輛與行人。團隊比較後發現，卷積神經網路（Convolutional NeuralNetwork, CNN）在訓練與推論效率上，明顯優於傳統的全連接神經網路（Fully Connected Neural Network, FCNN）。請問下列何者為主要原因？


    (114年第二梯次)'
  content:
  - type: text
    text: 某智慧城市團隊開發一套交通監控系統，用於即時辨識路口監視器影像中的車輛與行人。團隊比較後發現，卷積神經網路（Convolutional NeuralNetwork, CNN）在訓練與推論效率上，明顯優於傳統的全連接神經網路（Fully Connected Neural Network, FCNN）。請問下列何者為主要原因？
  - type: text
    text: (114年第二梯次)
  type: multiple_choice
  options:
  - text: CNN 能自動學習影像的旋轉與比例不變性
    content:
    - type: text
      text: CNN 能自動學習影像的旋轉與比例不變性
  - text: CNN 可直接跳過人工特徵提取步驟進行分類
    content:
    - type: text
      text: CNN 可直接跳過人工特徵提取步驟進行分類
  - text: CNN 透過區域感知（Local Receptive Field）與參數共享（ParameterSharing）機制，降低模型參數量與運算複雜度
    content:
    - type: text
      text: CNN 透過區域感知（Local Receptive Field）與參數共享（ParameterSharing）機制，降低模型參數量與運算複雜度
  - text: CNN 捨棄激勵函數（Activation Function），以加快運算速度
    content:
    - type: text
      text: CNN 捨棄激勵函數（Activation Function），以加快運算速度
  correct_index: 2
  explanation: CNN 利用局部感受野與參數共享，讓同一卷積核在不同位置重複使用，因此比全連接網路大幅減少參數量與運算成本。
  tags:
  - chap-m4-ch2
  - sec-past-exam
  - past-exam
  usage: mock
