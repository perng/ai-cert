- id: 6239
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 負遷移 (Negative Transfer) 是指？
  type: multiple_choice
  options:
  - 遷移學習效果很好
  - 遷移學習導致新任務的性能反而下降
  - 訓練失敗
  - 模型變小
  correct_index: 1
  explanation: 如果源任務和目標任務差異太大（如用貓狗模型去預測股市），強行遷移反而會引入雜訊，干擾學習。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
- id: 6240
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 為什麼 ResNet 能訓練上千層的網路？
  type: multiple_choice
  options:
  - 因為 GPU 很強
  - 因為使用了殘差連接 (Residual Connection)
  - 因為數據很多
  - 因為使用了 Dropout
  correct_index: 1
  explanation: $H(x) = F(x) + x$。學習「殘差」比學習原始映射容易，且恆等映射 ($F(x)=0$) 保證了深層網路至少不會比淺層差。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
- id: 6241
  chapter_title: 深度學習框架與架構
  section_title: 深度思考情境題
  text: 情境：你需要開發一個即時的手機端人臉識別 App。你會選擇哪個模型架構？
  type: multiple_choice
  options:
  - VGG16
  - MobileNetV2 或 EfficientNet-Lite
  - ResNet-152
  - Transformer-XL
  correct_index: 1
  explanation: 手機端對延遲和功耗要求極高。MobileNet 專為此設計，犧牲極小的精度換取極快的速度。
  tags:
  - chap-m4-ch2
  - sec-scenario
- id: 6242
  chapter_title: 深度學習框架與架構
  section_title: 深度思考情境題
  text: 情境：你只有 100 張醫學影像，想訓練一個分類模型。直接訓練效果很差。你應該？
  type: multiple_choice
  options:
  - 放棄。
  - 使用遷移學習 (Transfer Learning) 和數據增強。
  - 自己標註 100 萬張圖。
  - 使用 GAN 生成數據。
  correct_index: 1
  explanation: 這是遷移學習的殺手級應用。雖然醫學影像和自然圖像不同，但底層的邊緣、紋理特徵是通用的。預訓練模型提供了很好的初始化，數據增強則擴充了樣本。
  tags:
  - chap-m4-ch2
  - sec-scenario
- id: 6243
  chapter_title: 深度學習框架與架構
  section_title: 深度思考情境題
  text: 情境：你在訓練一個深層 RNN 時遇到梯度爆炸 (Gradient Exploding)，導致 Loss 變成 NaN。最有效的解決方法是？
  type: multiple_choice
  options:
  - 增加學習率。
  - 梯度裁剪 (Gradient Clipping)。
  - 增加層數。
  - 移除激活函數。
  correct_index: 1
  explanation: 梯度裁剪設定一個閾值（如 5），如果梯度超過這個值就強行切斷，防止它無限膨脹摧毀權重。
  tags:
  - chap-m4-ch2
  - sec-scenario
