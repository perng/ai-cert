questions:
- id: 6201
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: PyTorch 框架的主要特色是什麼，使其成為學術界研究的首選？
  type: multiple_choice
  options:
  - 靜態計算圖 (Static Computation Graph)，需先定義後執行
  - 只能在 CPU 上運行，不支援 GPU 加速
  - 動態計算圖 (Dynamic Computation Graph)，支援 Define-by-Run
  - 不支援 Python 語言，僅支援 C++
  correct_index: 2
  explanation: PyTorch 採用動態圖機制 (Define-by-Run)，允許在執行過程中改變網路結構，使得除錯和實驗新想法變得非常直觀和容易。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: quiz
- id: 6202
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: MobileNet 架構為了在行動裝置上高效運行，使用了哪種關鍵技術來減少參數和計算量？
  type: multiple_choice
  options:
  - 殘差連接 (Residual Connection)，解決梯度消失問題
  - 膠囊網路 (Capsule Network)，增強空間關係理解
  - 注意力機制 (Attention Mechanism)，提升特徵提取能力
  - 深度可分離卷積 (Depthwise Separable Convolution)，大幅降低運算量
  correct_index: 3
  explanation: 深度可分離卷積將標準卷積分解為 Depthwise 和 Pointwise 兩個步驟，大幅降低了運算成本。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: quiz
- id: 6203
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 當新任務的數據量很小，且與預訓練模型的原任務非常相似時，應採用哪種遷移學習策略？
  type: multiple_choice
  options:
  - 特徵提取 (Feature Extraction)，凍結卷積層只訓練分類層
  - 微調整個模型 (Fine-tuning all layers)，更新所有層的權重
  - 隨機初始化權重，並使用較大的學習率
  - 從頭訓練 (Train from Scratch)，隨機初始化所有權重
  correct_index: 0
  explanation: 數據量少時容易過擬合，且任務相似意味著底層特徵通用，因此凍結預訓練好的特徵提取層，僅訓練最後的分類層是最安全有效的策略。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
  usage: quiz
- id: 6204
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: EfficientNet 提出的「複合縮放 (Compound Scaling)」方法，主張同時調整哪三個維度以獲得最佳效能？
  type: multiple_choice
  options:
  - 卷積核大小 (Kernel Size)、步長 (Stride)、填充 (Padding)
  - 訓練集大小、驗證集大小、測試集大小
  - 學習率 (Learning Rate)、批次大小 (Batch Size)、迭代次數 (Epochs)
  - 深度 (Depth)、寬度 (Width)、解析度 (Resolution)
  correct_index: 3
  explanation: EfficientNet 發現單純增加深度、寬度或解析度都有邊際效應遞減的問題，因此提出透過固定比例同時縮放這三者來達到最佳平衡。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: quiz
- id: 6205
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 雙向 RNN (Bidirectional RNN) 的主要優勢在於？
  type: multiple_choice
  options:
  - 能同時利用過去 (Past) 和未來 (Future) 的上下文信息
  - 只能處理靜態的圖像數據，無法處理序列
  - 不需要反向傳播演算法進行訓練
  - 計算速度比單向 RNN 快，因為可以並行處理
  correct_index: 0
  explanation: 雙向 RNN 包含兩個方向的隱藏層，一個從前向後讀，一個從後向前讀，因此在每個時間點都能看到完整的上下文（如整句翻譯）。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: quiz
- id: 6206
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: 由 Google Research 開發，結合 Autograd 和 XLA，以極快速度著稱的框架是？
  type: multiple_choice
  options:
  - PyTorch，由 Facebook 開發的深度學習框架
  - TensorFlow，由 Google 開發的深度學習框架
  - Caffe，早期的深度學習框架
  - JAX，支援高效能數值計算與自動微分
  correct_index: 3
  explanation: JAX 是 Google 推出的新一代高效能數值計算庫，特別適合需要大規模並行加速的前沿研究。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: quiz
- id: 6207
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: Inception (GoogLeNet) 模組的核心設計理念是？
  type: multiple_choice
  options:
  - 並行使用不同大小的卷積核 (1x1, 3x3, 5x5) 以捕捉多尺度特徵
  - 移除所有活化函數以簡化計算
  - 使用全連接層替代卷積層以減少參數
  - 網路層數越深越好，以提取更高階特徵
  correct_index: 0
  explanation: Inception 模組透過並行路徑讓網路自動選擇最適合的卷積核大小，從而能同時捕捉局部和全局特徵。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: quiz
- id: 6208
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: TensorFlow 的高階 API，以易用性著稱的是？
  type: multiple_choice
  options:
  - Sonnet，DeepMind 開發的庫
  - Keras，提供簡潔直觀的模型構建介面
  - Estimator，用於大規模分佈式訓練
  - Slim，TensorFlow 的輕量級庫
  correct_index: 1
  explanation: Keras 被整合進 TensorFlow (tf.keras) 作為官方的高階 API，提供了簡潔直觀的介面來構建和訓練模型。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: quiz
- id: 6209
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: TensorFlow 1.x 版本主要採用哪種計算圖機制？
  type: multiple_choice
  options:
  - 無計算圖 (No Computation Graph)
  - 靜態計算圖 (Static Computation Graph)，即 Define-and-Run
  - 混合計算圖 (Hybrid Computation Graph)
  - 動態計算圖 (Dynamic Computation Graph)，即 Define-by-Run
  correct_index: 1
  explanation: TF 1.x 採用 "Define-and-Run" 模式，先定義好整個圖結構再執行。雖然優化容易，但除錯困難。TF 2.x 預設改為 Eager Execution (類似 PyTorch)。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: quiz
- id: 6210
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: LSTM 中的「遺忘閘 (Forget Gate)」負責？
  type: multiple_choice
  options:
  - 決定哪些舊的資訊需要從細胞狀態中丟棄 (Forget)
  - 決定當前的隱藏狀態 (Hidden State) 應該輸出什麼
  - 決定哪些新的資訊需要存入細胞狀態 (Cell State)
  - 初始化網路的權重參數
  correct_index: 0
  explanation: 這是 LSTM 解決長期依賴問題的關鍵。如果某些舊資訊（如上一章的主題）不再重要，遺忘閘會將其清除，騰出空間給新資訊。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: quiz
- id: 6211
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 微調 (Fine-tuning) 時，通常建議使用什麼樣的學習率？
  type: multiple_choice
  options:
  - 比從頭訓練時更小的學習率 (Smaller Learning Rate)，以避免破壞預訓練權重
  - 使用與從頭訓練相同的學習率
  - 比從頭訓練時更大的學習率，以加快收斂
  - 隨機選擇學習率
  correct_index: 0
  explanation: 預訓練模型的權重已經很好了，我們只想做微小的調整。如果學習率太大，會破壞原本學到的特徵（災難性遺忘）。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
  usage: both
- id: 6212
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: Attention 機制最初是為了解決什麼問題而提出的？
  type: multiple_choice
  options:
  - 模型訓練的計算速度太慢
  - 機器翻譯中長序列的資訊丟失問題 (Information Loss in Long Sequences)
  - 圖像分類任務的準確率過低
  - 模型容易發生過擬合現象
  correct_index: 1
  explanation: 傳統 Seq2Seq 將整句壓縮成一個固定長度的向量，長句資訊會丟失。Attention 允許解碼器在生成每個字時，回頭去「看」源句中最相關的部分。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6213
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: TFLite (TensorFlow Lite) 的主要用途是？
  type: multiple_choice
  options:
  - 用於網頁前端開發
  - 在雲端伺服器上進行大規模模型訓練
  - 在行動裝置和嵌入式設備上進行高效的模型推論 (On-device Inference)
  - 進行數據清洗與預處理
  correct_index: 2
  explanation: TFLite 是 TF 的輕量化版本，專為手機、IoT 設備設計，支援量化等優化技術。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: both
- id: 6214
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 深度可分離卷積 (Depthwise Separable Convolution) 將標準卷積分解為哪兩步？
  type: multiple_choice
  options:
  - 標準卷積 (Convolution) 和最大池化 (Max Pooling)
  - 深度卷積 (Depthwise Convolution) 和逐點卷積 (Pointwise Convolution)
  - 卷積層 (Convolutional Layer) 和全連接層 (Fully Connected Layer)
  - 前向傳播 (Forward Propagation) 和反向傳播 (Backward Propagation)
  correct_index: 1
  explanation: 先對每個通道獨立卷積 (Depthwise)，再用 1x1 卷積 (Pointwise) 組合通道資訊。這比標準卷積少了很多乘法運算。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6215
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: ImageNet 預訓練模型通常包含多少類的分類能力？
  type: multiple_choice
  options:
  - 1000 類常見物體 (1000 Classes)
  - 100 類常見物體
  - 10000 類常見物體
  - 10 類常見物體
  correct_index: 0
  explanation: 標準的 ImageNet (ILSVRC) 競賽數據集包含 1000 個類別。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
  usage: both
- id: 6216
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: GRU (Gated Recurrent Unit) 相比於 LSTM 的主要區別是？
  type: multiple_choice
  options:
  - 結構更複雜，參數更多，訓練更慢
  - 不能處理時間序列數據
  - 準確率總是比 LSTM 更高
  - 結構更簡單，參數更少 (Fewer Parameters)，計算效率更高
  correct_index: 3
  explanation: GRU 將 LSTM 的遺忘閘和輸入閘合併為更新閘，移除了 Cell State，效果通常與 LSTM 相當但更輕量。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6217
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: 自動微分 (Automatic Differentiation) 的作用是？
  type: multiple_choice
  options:
  - 自動清洗和預處理數據
  - 自動生成模型訓練程式碼
  - 自動計算反向傳播所需的梯度 (Gradients)
  - 自動調整模型的超參數 (Hyperparameters)
  correct_index: 2
  explanation: 這是深度學習框架的核心功能。你只要寫前向傳播 (Forward)，框架會自動幫你算好反向傳播 (Backward) 的梯度。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: both
- id: 6218
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: Transformer 架構完全基於哪種機制？
  type: multiple_choice
  options:
  - 多層感知機 (MLP)
  - 自注意力機制 (Self-Attention Mechanism)
  - 循環神經網路 (RNN)
  - 卷積神經網路 (CNN)
  correct_index: 1
  explanation: '"Attention Is All You Need"。Transformer 拋棄了 RNN 的循環結構，完全依賴注意力機制來捕捉序列依賴，實現了高度並行化。'
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6219
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 凍結 (Freezing) 層的意思是？
  type: multiple_choice
  options:
  - 將該層從網路中刪除
  - 在反向傳播時不更新該層的參數 (Disable Gradient Update)
  - 將該層的所有權重參數設為 0
  - 降低該層的 Softmax 溫度參數
  correct_index: 1
  explanation: 保持預訓練學到的特徵不變，只訓練我們新加的層。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
  usage: both
- id: 6220
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 1x1 卷積 (Pointwise Convolution) 的主要作用之一是？
  type: multiple_choice
  options:
  - 對圖像進行模糊處理
  - 提取圖像的空間特徵 (Spatial Features)
  - 對圖像進行放大處理
  - 改變特徵圖的通道數 (Channel Reduction/Expansion)，即升維或降維
  correct_index: 3
  explanation: 1x1 卷積不改變圖像長寬，只改變深度（通道數）。常用於 Inception 和 ResNet 中進行降維以減少計算量。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6221
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: ONNX (Open Neural Network Exchange) 的目的是？
  type: multiple_choice
  options:
  - 完全取代 Python 程式語言
  - 使用無損演算法壓縮模型大小
  - 提供一種開放的模型交換格式 (Open Format)，促進不同框架間的互操作性
  - 對模型參數進行加密保護
  correct_index: 2
  explanation: 它是 AI 模型的「通用語言」，解決了框架碎片化的問題，方便模型部署。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: both
- id: 6222
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: 複合縮放 (Compound Scaling) 中的 $\phi$ 係數是用來？
  type: multiple_choice
  options:
  - 控制模型的學習率 (Learning Rate)
  - 統一控制深度、寬度、解析度的縮放比例 (Scaling Coefficient)
  - 控制模型的正則化強度 (Regularization Strength)
  - 控制訓練時的批次大小 (Batch Size)
  correct_index: 1
  explanation: EfficientNet 定義了一組公式，只要給定一個 $\phi$ (如 B0 到 B7)，就能自動算出最佳的三維縮放倍率。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6223
  chapter_title: 深度學習框架與架構
  section_title: 遷移學習與微調策略
  text: 什麼情況下適合使用「微調整個模型」？
  type: multiple_choice
  options:
  - 目標任務的數據量極小
  - 只要模型參數量很大就可以
  - 計算資源極其有限，無法訓練大模型
  - 目標任務的數據量較大，且新任務與原任務有一定差異
  correct_index: 3
  explanation: 數據夠多，我們就有本錢去調整整個網路的權重，讓它更適應新任務，而不用擔心過擬合。
  tags:
  - chap-m4-ch2
  - sec-transfer-learning
  usage: both
- id: 6224
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: RNN 的主要缺點是？
  type: multiple_choice
  options:
  - 無法並行計算 (Sequential Computation)，且存在梯度消失問題
  - 只能處理文字數據，無法處理圖像
  - 網路結構太簡單，無法提取特徵
  - 模型的參數量太多，導致過擬合
  correct_index: 0
  explanation: 必須等 t-1 算完才能算 t，這限制了訓練速度。且梯度在長序列中傳遞會逐漸衰減（遺忘）。
  tags:
  - chap-m4-ch2
  - sec-adv-architectures
  usage: both
- id: 6225
  chapter_title: 深度學習框架與架構
  section_title: 深度學習框架
  text: XLA (Accelerated Linear Algebra) 是什麼？
  type: multiple_choice
  options:
  - 一種新的神經網路模型架構
  - 一種新的深度學習程式語言
  - 一種針對線性代數運算的編譯器優化技術 (Compiler Optimization)
  - 一種新的 GPU 硬體架構
  correct_index: 2
  explanation: XLA 會將多個運算融合 (Fusion) 成一個 kernel，減少記憶體存取次數，大幅提升執行效率。
  tags:
  - chap-m4-ch2
  - sec-dl-frameworks
  usage: both
- id: 6226
  chapter_title: 深度學習框架與架構
  section_title: 進階架構
  text: Inception 模組中的 1x1 卷積通常放在 3x3 和 5x5 卷積之前，目的是？
  type: multiple_choice
  options:
  - 增加模型的參數量 (Parameters)
  - 沒有特別目的，只是為了增加網路深度
  - 升維 (Dimensionality Expansion)，增加特徵圖的通道數
  - 降維 (Dimensionality Reduction)，減少特徵圖的通道數以降低計算量
  correct_index: 3
