questions:
- id: 6301
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 網格搜尋 (Grid Search) 的主要缺點是？
  type: multiple_choice
  options:
  - 計算成本極高，隨著參數數量增加呈指數級增長 (Curse of Dimensionality)
  - 實作非常困難且複雜
  - 容易陷入局部最佳解 (Local Optima)
  - 無法找到全域最佳解
  correct_index: 0
  explanation: 網格搜尋窮舉所有組合，雖然保證找到範圍內的最佳解，但對於高維度參數空間來說，計算量是不可接受的。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: quiz
- id: 6302
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: L1 正規化 (Lasso) 的一個重要特性是？
  type: multiple_choice
  options:
  - 加速模型的訓練收斂速度
  - 傾向於產生稀疏權重 (Sparse Weights)，可用於特徵選擇
  - 使權重變得平滑 (Smooth Weights)
  - 顯著增加模型的複雜度
  correct_index: 1
  explanation: L1 懲罰項的幾何形狀（菱形）使得最佳解容易落在座標軸上，從而將不重要的特徵權重壓縮為 0。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: quiz
- id: 6303
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: Dropout 技術在訓練過程中如何運作？
  type: multiple_choice
  options:
  - 隨機丟棄 (歸零) 一部分神經元，防止過度依賴特定特徵
  - 固定神經元權重不進行更新
  - 移除所有神經元並重新初始化
  - 隨機增加額外的神經元以擴展網路
  correct_index: 0
  explanation: Dropout 就像讓神經元「輪流休息」，防止它們過度依賴彼此（Co-adaptation），從而減少過擬合。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: quiz
- id: 6304
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 量化 (Quantization) 通常將權重從 FP32 轉換為？
  type: multiple_choice
  options:
  - INT8 (8 位整數)，以減少模型大小並加速推論
  - FP16 (16 位半精度浮點數)
  - Binary (二進位制)
  - FP64 (64 位雙精度浮點數)
  correct_index: 0
  explanation: 將 32 位浮點數轉為 8 位整數，模型體積直接縮小 4 倍，且整數運算在硬體上通常更快。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: quiz
- id: 6305
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 知識蒸餾 (Knowledge Distillation) 的核心思想是？
  type: multiple_choice
  options:
  - 刪除部分訓練數據以減少計算量
  - 使用壓縮演算法壓縮圖片數據
  - 訓練一個參數量更大的模型以提高準確率
  - 讓小的學生模型 (Student) 模仿大的教師模型 (Teacher) 的輸出與行為
  correct_index: 3
  explanation: 學生模型不僅學習正確答案，還學習教師模型的「猶豫」（例如這張圖有 90% 像貓，10% 像狗），這些額外資訊有助於小模型達到接近大模型的效能。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: quiz
- id: 6306
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 貝葉斯最佳化 (Bayesian Optimization) 相比於隨機搜尋的優勢是？
  type: multiple_choice
  options:
  - 不需要定義搜尋空間 (Search Space)
  - 利用過去的評估結果建立概率模型，更聰明地選擇下一個參數組合
  - 運算速度最快，因為不涉及複雜計算
  - 實作更簡單，不需要額外的庫
  correct_index: 1
  explanation: 隨機搜尋是盲目的，而貝葉斯優化是「有記憶」的，它會根據之前的嘗試結果來修正搜尋方向，效率更高。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: quiz
- id: 6307
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 提前停止 (Early Stopping) 的判斷依據是？
  type: multiple_choice
  options:
  - 訓練集誤差 (Training Loss) 不再下降
  - 驗證集誤差 (Validation Loss) 不再下降甚至開始上升
  - 訓練時間到達預設的上限
  - 測試集誤差 (Test Loss) 不再下降
  correct_index: 1
  explanation: 當訓練誤差持續下降但驗證誤差開始上升時，表示模型開始過擬合了，這時應該立即停止訓練。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: quiz
- id: 6308
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 批次正規化 (Batch Normalization) 的主要優點不包括？
  type: multiple_choice
  options:
  - 加速訓練收斂 (Faster Convergence)
  - 允許使用更高的學習率 (Higher Learning Rate)
  - 具有輕微的正規化效果 (Regularization Effect)
  - 顯著減少模型參數數量 (Parameter Reduction)
  correct_index: 3
  explanation: BN 層本身包含可學習的參數（scale 和 shift），因此實際上增加了少量的參數量，而不是減少。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: quiz
- id: 6309
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 結構化剪枝 (Structured Pruning) 相比於非結構化剪枝的優勢是？
  type: multiple_choice
  options:
  - 壓縮率比非結構化剪枝更高
  - 精度損失比非結構化剪枝更小
  - 實作邏輯更簡單
  - 移除整個通道或卷積核，通用硬體即可加速 (Hardware Acceleration)
  correct_index: 3
  explanation: 非結構化剪枝會把權重矩陣挖得像蜂窩一樣（稀疏矩陣），一般 CPU/GPU 難以加速；結構化剪枝直接把矩陣變小，加速效果立竿見影。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: quiz
- id: 6310
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 下列哪項屬於超參數 (Hyperparameter)？
  type: multiple_choice
  options:
  - 神經網路的偏差 (Biases)
  - 神經網路的權重 (Weights)
  - 模型的輸出結果 (Output)
  - 學習率 (Learning Rate)
  correct_index: 3
  explanation: 權重和偏差是模型在訓練過程中自己學出來的參數；學習率是人為設定的，控制學習的速度，屬於超參數。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: quiz
- id: 6311
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: L2 正規化 (Ridge) 傾向於讓權重？
  type: multiple_choice
  options:
  - 變為無限大 (Explosion)
  - 保持不變 (Constant)
  - 變小但不為 0 (平滑化)，抑制權重過大
  - 變為 0 (Sparsity)
  correct_index: 2
  explanation: L2 懲罰項是權重的平方和，它會抑制過大的權重值，使模型對單一特徵不那麼敏感，從而減少過擬合。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6312
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: Optuna 是一個什麼框架？
  type: multiple_choice
  options:
  - 數據清洗與預處理框架
  - 深度學習模型訓練框架
  - 自動超參數優化框架 (Auto Hyperparameter Optimization Framework)
  - 網頁前端開發框架
  correct_index: 2
  explanation: Optuna 是目前最流行的超參數調優工具，支援高效的 TPE 演算法和自動剪枝功能。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: both
- id: 6313
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 剪枝 (Pruning) 的基本原理是？
  type: multiple_choice
  options:
  - 增加網路的層數
  - 改變激活函數的類型
  - 增加神經元的數量
  - 移除神經網路中不重要的連接或神經元 (Removing Unimportant Connections)
  correct_index: 3
  explanation: 就像修剪樹木一樣，剪掉那些對輸出貢獻微乎其微的連接，可以讓模型變小變快。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: both
- id: 6314
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 正規化 (Regularization) 的主要目的是？
  type: multiple_choice
  options:
  - 減少訓練數據的使用量
  - 增加訓練誤差以避免過擬合
  - 防止過擬合 (Overfitting)，提升模型的泛化能力
  - 加速模型訓練過程
  correct_index: 2
  explanation: 透過限制模型的複雜度（懲罰大權重），強迫模型學習更簡單、更通用的規律，而不是死記硬背訓練數據。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6315
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 隨機搜尋 (Random Search) 相比於網格搜尋的一個優點是？
  type: multiple_choice
  options:
  - 保證一定能找到全域最佳解
  - 只能搜尋整數類型的參數
  - 實作邏輯更複雜
  - 在相同的計算預算下，通常能探索更多重要參數的取值 (Better Coverage)
  correct_index: 3
  explanation: 對於某些參數對模型影響不大而某些影響很大的情況，網格搜尋可能會浪費時間在不重要的參數上，而隨機搜尋能更均勻地覆蓋重要參數的空間。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: both
- id: 6316
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: Batch Normalization 通常放在哪裡？
  type: multiple_choice
  options:
  - 在損失函數之後 (After Loss Function)
  - 在每一層的激活函數之前 (Before Activation) 或之後 (After Activation)
  - 在輸入層之前 (Before Input Layer)
  - 在輸出層之後 (After Output Layer)
  correct_index: 1
  explanation: BN 層對每一層的輸入進行標準化，解決了內部協變量偏移 (Internal Covariate Shift) 問題，讓每一層都能在穩定的分佈下學習。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6317
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 知識蒸餾中的 Soft targets 是指？
  type: multiple_choice
  options:
  - 真實的標籤 (One-hot Encoded Labels)
  - 隨機生成的標籤
  - 錯誤的標籤
  - 教師模型輸出層經過 Softmax 後的機率分佈 (Probability Distribution)
  correct_index: 3
  explanation: Soft targets 包含了比 Hard targets (0 或 1) 豐富得多的資訊，例如類別之間的相似性關係。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: both
- id: 6318
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 權重衰減 (Weight Decay) 通常等同於哪種正規化？
  type: multiple_choice
  options:
  - L1 正規化 (Lasso Regularization)
  - Dropout 技術
  - Batch Normalization 技術
  - L2 正規化 (Ridge Regularization)
  correct_index: 3
  explanation: 在隨機梯度下降 (SGD) 中，L2 正規化的效果就是在每次更新時讓權重衰減一點點。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6319
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 學習率 (Learning Rate) 過大會導致？
  type: multiple_choice
  options:
  - 模型收斂速度變慢
  - 模型發生過擬合 (Overfitting)
  - 模型無法收斂，在最佳解附近震盪甚至發散 (Oscillation or Divergence)
  - 模型發生欠擬合 (Underfitting)
  correct_index: 2
  explanation: 步伐太大，容易跨過最低點，甚至越跑越遠。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: both
- id: 6320
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: Post-Training Quantization (PTQ) 是指？
  type: multiple_choice
  options:
  - 在訓練過程中進行量化
  - 在模型訓練完成後再進行量化 (Quantization after Training)
  - 完全不進行量化
  - 隨機進行量化
  correct_index: 1
  explanation: PTQ 不需要重新訓練模型，只需少量校準數據即可完成量化，是最簡單快速的壓縮方法。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: both
- id: 6321
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: Dropout 在測試 (Inference) 階段通常如何處理？
  type: multiple_choice
  options:
  - 移除所有神經元，只保留輸出層
  - 繼續隨機丟棄神經元，以保持一致性
  - 重新訓練一個沒有 Dropout 的模型
  - 停止丟棄神經元，並將權重乘以 (1 - dropout_rate) 進行縮放
  correct_index: 3
  explanation: 測試時我們希望模型火力全開，使用所有神經元。為了保持輸出數值的尺度與訓練時（只有部分神經元工作）一致，需要進行縮放。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6322
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: Batch Size 過小通常會導致？
  type: multiple_choice
  options:
  - 記憶體溢出 (Out of Memory)
  - 梯度估計雜訊大，導致訓練過程震盪 (Unstable Training)
  - 模型的泛化能力下降
  - 訓練速度變快
  correct_index: 1
  explanation: 小 Batch 的梯度方向隨機性大，雖然有助於跳出局部最佳解，但也可能導致訓練不穩定。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: both
- id: 6323
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 稀疏矩陣 (Sparse Matrix) 是指？
  type: multiple_choice
  options:
  - 矩陣中大部分元素為 1
  - 矩陣的維度很小
  - 矩陣的維度很大
  - 矩陣中大部分元素為 0 (Mostly Zeros)
  correct_index: 3
  explanation: 非結構化剪枝會產生稀疏矩陣。儲存和計算稀疏矩陣需要特殊的格式（如 CSR）和硬體支援才能發揮優勢。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: both
- id: 6324
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 欠擬合 (Underfitting) 發生時，通常表現為？
  type: multiple_choice
  options:
  - 模型結構太複雜
  - 訓練誤差低，測試誤差低
  - 訓練誤差低，測試誤差高 (High Variance)
  - 訓練誤差高，測試誤差也高 (High Bias)
  correct_index: 3
  explanation: 模型太笨了，連訓練數據的規律都學不會，更別說舉一反三了。通常是因為模型複雜度不足或特徵不足。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6325
  chapter_title: 模型最佳化與調校
  section_title: 超參數調校
  text: 哪種搜尋策略最適合並行化 (Parallelization)？
  type: multiple_choice
  options:
  - 網格搜尋 (Grid Search) 和隨機搜尋 (Random Search)
  - 梯度下降法 (Gradient Descent)
  - 貝葉斯最佳化 (Bayesian Optimization)
  - 模擬退火演算法 (Simulated Annealing)
  correct_index: 0
  explanation: 網格搜尋和隨機搜尋的每一次嘗試都是獨立的，互不影響，因此可以同時在多台機器上跑。貝葉斯優化則依賴上一次的結果，較難並行。
  tags:
  - chap-m4-ch3
  - sec-hyperparameter-tuning
  usage: both
- id: 6326
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: L1 正規化常用於特徵選擇的原因是？
  type: multiple_choice
  options:
  - 它讓權重變小但不為 0
  - 它計算簡單且收斂速度快
  - 它讓權重變大以增加模型複雜度
  - 它傾向於將不重要的特徵權重壓縮為 0 (Sparsity)，從而實現特徵選擇
  correct_index: 3
  explanation: 權重為 0 意味著該特徵被模型「拋棄」了，這就是自動特徵選擇的過程。
  tags:
  - chap-m4-ch3
  - sec-regularization
  usage: both
- id: 6327
  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 量化感知訓練 (Quantization-Aware Training, QAT) 是指？
  type: multiple_choice
  options:
  - 在訓練過程中模擬量化誤差 (Simulate Quantization Error)，使模型適應低精度
  - 只量化激活值 (Activations)
  - 只量化權重參數
  - 訓練後量化 (Post-Training Quantization)
  correct_index: 0
  explanation: QAT 讓模型在訓練時就「預習」量化後的世界，因此能比 PTQ 獲得更高的精度，適合對精度要求高的場景。
  tags:
  - chap-m4-ch3
  - sec-model-compression
  usage: both
- id: 6328
  chapter_title: 模型最佳化與調校
  section_title: 正規化技術
  text: 驗證集 (Validation Set) 的主要用途是？
  type: multiple_choice
  options:
  - 用於增加訓練數據量
  - 用於最終評估模型的泛化效能
  - 用於調整超參數 (Hyperparameters) 與監控過擬合 (Overfitting)
  - 用於訓練模型參數 (Weights)
  correct_index: 2
