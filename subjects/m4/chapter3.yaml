  chapter_title: 模型最佳化與調校
  section_title: 模型壓縮
  text: 在神經網路中，了解各層的運算量分佈，有助於模型壓縮與硬體加速的策略設計。請問在 VGG16 中，下列何者運算量(FLOPs)最多？ (114年第二梯次)
  type: multiple_choice
  options:
  - 卷積層(Conv2d)
  - 全連接層(Linear)
  - ReLU 激活函數
  - 池化層(MaxPool2d, AdaptiveAvgPool2d)
  correct_index: 0
  explanation: 卷積層需要對特徵圖的每個像素進行滑動視窗運算，因此貢獻了絕大部分的 FLOPs（浮點運算量），儘管其參數量較少。全連接層雖然參數多，但只進行一次矩陣乘法，運算量相對較小。
