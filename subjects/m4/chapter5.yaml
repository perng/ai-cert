  id: 6552
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: ML 中的公平性、當責性與透明度
  text: 情境：歷史偏見 (Historical Bias) 源於？
  type: multiple_choice
  options:
  - 數據採集過程中的隨機錯誤
  - 數據反映了歷史上存在的社會不公與歧視 (Historical Injustice)
  - 演算法本身的邏輯錯誤
  - 計算過程中的數值誤差
  correct_index: 1
  explanation: AI 只是學到了人類社會過去的偏見（如性別刻板印象）。
  tags:
  - chap-m4-ch5
  - sec-fat
  id: 6553
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: 模型監控與治理
  text: 情境：當檢測到嚴重的數據漂移時，通常應該？
  type: multiple_choice
  options:
  - 完全不理會，繼續使用舊模型
  - 使用新數據重新訓練模型 (Retraining) 以適應新的分佈
  - 直接刪除模型並停止服務
  - 關閉整個系統進行維護
  correct_index: 1
  explanation: 確保模型能適應新的數據分佈。
  tags:
  - chap-m4-ch5
  - sec-model-governance
  id: 6554
