  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: ML 中的公平性、當責性與透明度
  text: 情境：選擇性偏見 (Selection Bias) 是指？
  type: multiple_choice
  options:
  - 模型選擇了錯誤的演算法
  - 訓練數據不能代表真實世界的母體 (Sampling Bias)
  - 特徵選擇過程出現錯誤
  - 演算法本身存在偏見
  correct_index: 1
  explanation: 例如用白人數據訓練人臉辨識，導致對黑人辨識率低。
