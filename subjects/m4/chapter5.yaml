- id: m4-code-125
  chapter_title: 機器學習治理與倫理
  section_title: 程式閱讀理解
  text: 閱讀下列審計查詢，主要想找什麼？
  content:
  - type: text
    text: 閱讀下列審計查詢，主要想找什麼？
  - type: code
    language: sql
    code: "SELECT user_id, COUNT(*) AS exports\nFROM audit_log\nWHERE action = 'EXPORT'\n  AND dataset LIKE '%pii%'\n  AND event_time >= current_date - interval '7 days'\nGROUP BY user_id\nHAVING COUNT(*) > 5;"
  type: multiple_choice
  options:
  - 最近 7 天大量匯出 PII 資料的使用者
  - 所有登入失敗的使用者
  - 模型 AUC 低於門檻的版本
  - 沒有任何資料存取紀錄
  correct_index: 0
  explanation: 查詢篩選 PII 匯出事件並按使用者統計，HAVING > 5 用於找出高頻匯出者以供稽核。
  tags:
  - chap-m4-ch5
  - sec-code-reading
  - code-reading
  usage: quiz
