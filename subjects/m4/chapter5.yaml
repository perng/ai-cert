  id: 6551
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: 解決偏見與確保可解釋性
  text: 情境：全域解釋 (Global Interpretability) 關注的是？
  type: multiple_choice
  options:
  - 單個樣本的具體預測原因
  - 模型整體的運作邏輯 (Global Model Logic)，如特徵重要性排行
  - 模型的預測誤差
  - 模型的訓練時間
  correct_index: 1
  explanation: 了解哪些特徵對模型整體來說最重要。
  tags:
  - chap-m4-ch5
