- chapter_title: 機器學習治理與倫理
  section_title: 模型監控與治理
  text: 情境：概念漂移 (Concept Drift) 發生時，意味著？
  type: multiple_choice
  options:
  - 數據的儲存格式發生了變化
  - 輸入特徵與目標變數之間的映射關係發生了變化 (Relationship Change)，如詐欺模式改變
  - 模型本身發生了故障
  - 伺服器硬體發生故障
  correct_index: 1
  explanation: 舊模型不再適用於新的規律，需重新訓練。
  tags:
  - chap-m4-ch5
  - sec-model-governance
  id: 6548
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: 解決偏見與確保可解釋性
  text: 情境：LIME 的主要作用是？
  type: multiple_choice
  options:
  - 提供模型的全域解釋 (Global Interpretability)
  - 提供局部解釋 (Local Interpretability)，解釋單個預測的決策依據
  - 用於訓練新的機器學習模型
  - 用於壓縮模型以減少體積
  correct_index: 1
  explanation: 在局部擬合一個簡單模型來解釋複雜模型的決策。
  tags:
