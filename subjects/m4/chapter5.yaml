- id: m4-114-2-028
  chapter_title: 機器學習治理與倫理
  section_title: 歷屆考題
  text: '一家零售電商公司希望建立顧客流失預測模型，用以判斷哪些會員可能在三個月內不再消費。團隊以去年會員資料進行訓練，並僅採用「曾經購買三次以上」的活躍顧客紀錄作為樣本。模型上線後，對整體會員進行預測時，發現模型對於新註冊會員與低消費會員的預測準確率明顯偏低。下列何者為造成此現象最可能的原因？


    (114年第二梯次)'
  content:
  - type: text
    text: 一家零售電商公司希望建立顧客流失預測模型，用以判斷哪些會員可能在三個月內不再消費。團隊以去年會員資料進行訓練，並僅採用「曾經購買三次以上」的活躍顧客紀錄作為樣本。模型上線後，對整體會員進行預測時，發現模型對於新註冊會員與低消費會員的預測準確率明顯偏低。下列何者為造成此現象最可能的原因？
  - type: text
    text: (114年第二梯次)
  type: multiple_choice
  options:
  - text: 特徵設計未排除與會員忠誠度高度相關的變數，導致特徵偏差（Feature Bias）
    content:
    - type: text
      text: 特徵設計未排除與會員忠誠度高度相關的變數，導致特徵偏差（Feature Bias）
  - text: 標記（Label）由人工標註，導致標籤偏差（Label Bias）
    content:
    - type: text
      text: 標記（Label）由人工標註，導致標籤偏差（Label Bias）
  - text: 訓練樣本僅涵蓋高活躍顧客，造成取樣偏差（Sampling Bias）
    content:
    - type: text
      text: 訓練樣本僅涵蓋高活躍顧客，造成取樣偏差（Sampling Bias）
  - text: 模型未進行超參數調整，導致過擬合（Overfitting）
    content:
    - type: text
      text: 模型未進行超參數調整，導致過擬合（Overfitting）
  correct_index: 2
  explanation: 訓練樣本只包含高活躍顧客，與上線時的整體會員分佈不一致，會造成取樣偏差，使模型對新會員與低消費會員泛化不佳。
  tags:
  - chap-m4-ch5
  - sec-past-exam
  - past-exam
  usage: mock
- id: m4-114-2-036
  chapter_title: 機器學習治理與倫理
  section_title: 歷屆考題
  text: '某銀行計畫與多家合作機構共同訓練一個AI 信用風險預測模型，為避免客戶交易資料在傳輸與運算過程中外洩，技術團隊評估使用同態加密（Homomorphic Encryption）技術。下列何者最能正確描述同態加密在此應用中的關鍵特性？


    (114年第二梯次)'
  content:
  - type: text
    text: 某銀行計畫與多家合作機構共同訓練一個AI 信用風險預測模型，為避免客戶交易資料在傳輸與運算過程中外洩，技術團隊評估使用同態加密（Homomorphic Encryption）技術。下列何者最能正確描述同態加密在此應用中的關鍵特性？
  - type: text
    text: (114年第二梯次)
  type: multiple_choice
  options:
  - text: 系統以隨機雜訊（Noise）干擾輸出，確保統計結果不洩漏個資
    content:
    - type: text
      text: 系統以隨機雜訊（Noise）干擾輸出，確保統計結果不洩漏個資
  - text: 各參與銀行透過安全通道交換私鑰，確保模型參數一致
    content:
    - type: text
      text: 各參與銀行透過安全通道交換私鑰，確保模型參數一致
  - text: 將原始資料壓縮並同時加密，以減少加密後資料量與運算時間
    content:
    - type: text
      text: 將原始資料壓縮並同時加密，以減少加密後資料量與運算時間
  - text: 資料在加密狀態下仍可進行數值運算，模型訓練可於未解密資料上完成
    content:
    - type: text
      text: 資料在加密狀態下仍可進行數值運算，模型訓練可於未解密資料上完成
  correct_index: 3
  explanation: 同態加密允許在密文上直接做特定數值運算，使模型訓練或推論可在不解密資料的情況下進行。
  tags:
  - chap-m4-ch5
  - sec-past-exam
  - past-exam
  usage: mock
- id: m4-114-2-037
  chapter_title: 機器學習治理與倫理
  section_title: 歷屆考題
  text: '某跨銀行風控平台希望整合多家銀行的用戶行為資料，用於訓練信用風險預測模型。由於競爭與法規限制，各銀行僅願意提供加密後資料，且資料在任何時間不得被平台解密。同時，平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。下列哪一組技術最能完整對應上述需求？


    (114年第二梯次)'
  content:
  - type: text
    text: 某跨銀行風控平台希望整合多家銀行的用戶行為資料，用於訓練信用風險預測模型。由於競爭與法規限制，各銀行僅願意提供加密後資料，且資料在任何時間不得被平台解密。同時，平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。下列哪一組技術最能完整對應上述需求？
  - type: text
    text: (114年第二梯次)
  type: multiple_choice
  options:
  - text: 對稱加密（Symmetric Encryption）＋ 單向雜湊（Hash Function）＋非對稱加密（Asymmetric Encryption）＋ 差分隱私（DifferentialPrivacy）
    content:
    - type: text
      text: 對稱加密（Symmetric Encryption）＋ 單向雜湊（Hash Function）＋非對稱加密（Asymmetric Encryption）＋ 差分隱私（DifferentialPrivacy）
  - text: '同態加密（Homomorphic Encryption）＋ 非對稱加密（AsymmetricEncryption）＋ 單向雜湊（ One-way Hash Function）＋ 對稱加密


      （Symmetric Encryption）'
    content:
    - type: text
      text: '同態加密（Homomorphic Encryption）＋ 非對稱加密（AsymmetricEncryption）＋ 單向雜湊（ One-way Hash Function）＋ 對稱加密


        （Symmetric Encryption）'
  - text: 差分隱私（Differential Privacy）＋ 對稱加密（SymmetricEncryption）＋ 同態加密（Homomorphic Encryption）＋ 數位簽章（Digital Signature）
    content:
    - type: text
      text: 差分隱私（Differential Privacy）＋ 對稱加密（SymmetricEncryption）＋ 同態加密（Homomorphic Encryption）＋ 數位簽章（Digital Signature）
