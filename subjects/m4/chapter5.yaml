  id: 6549
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: ML 中的公平性、當責性與透明度
  text: 情境：FAT 原則中的「透明度 (Transparency)」要求？
  type: multiple_choice
  options:
  - 模型的原始程式碼必須完全公開
  - 模型的決策過程應該是可見、可理解且可解釋的 (Explainable Decision Process)
  - 所有的訓練數據必須公開
  - 伺服器硬體架構必須透明
  correct_index: 1
  explanation: 避免黑箱決策，建立使用者信任。
  tags:
  - chap-m4-ch5
  - sec-fat
  id: 6550
  usage: both
- chapter_title: 機器學習治理與倫理
  section_title: 模型監控與治理
  text: 情境：PSI (Population Stability Index) 用於衡量？
  type: multiple_choice
  options:
  - 模型的預測準確率 (Accuracy)
  - 數據分佈的穩定性 (Data Drift)，用於檢測輸入數據是否發生顯著變化
  - 模型的訓練速度
  - 模型的記憶體使用量
  correct_index: 1
  explanation: PSI > 0.25 通常表示數據發生了顯著漂移。
