- chapter_title: 機器學習治理與倫理
  section_title: 模型監控與治理
  text: 情境：數據漂移 (Data Drift) 指的是？
  type: multiple_choice
  options:
  - 數據完全遺失了
  - 輸入數據的統計分佈隨時間發生變化 (Statistical Distribution Change)
