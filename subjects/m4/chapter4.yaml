    text: 閱讀下列 SARSA 更新，與 Q-learning 的主要差異是什麼？
  - type: code
    language: python
    code: 'target = reward + gamma * Q[next_state, next_action]

      Q[state, action] += alpha * (target - Q[state, action])'
  type: multiple_choice
  options:
