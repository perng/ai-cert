- id: 6441
  chapter_title: 強化學習
  section_title: 深度思考情境題
  text: 情境：你訓練一個玩迷宮遊戲的 AI，但發現它一直在原地打轉，不肯去終點。檢查發現你設定每走一步扣 0.01 分（為了鼓勵走最短路徑），終點給 10
    分。為什麼它會打轉？
  type: multiple_choice
  options:
  - 扣分太少。
  - 可能是折扣因子 γ 太小，或探索率 ε 太低。
  - AI 太笨。
  - 迷宮太難。
  correct_index: 1
  explanation: 這是常見的獎勵設計陷阱。如果遠處的大獎勵被 γ 折扣到微乎其微，代理就會為了避免眼前的微小懲罰而選擇消極策略。需要調整 γ 或獎勵結構。
  tags:
  - chap-m4-ch4
  - sec-scenario
  usage: mock
- id: 6442
  chapter_title: 強化學習
  section_title: 深度思考情境題
  text: 情境：在訓練機械手臂抓取物體時，你發現模擬環境中訓練完美的模型，在真實世界完全無法工作。這叫什麼問題？該如何解決？
  type: multiple_choice
  options:
  - 過擬合。
  - Reality Gap (現實差距)。應使用域隨機化 (Domain Randomization)。
  - 欠擬合。
  - 硬體故障。
  correct_index: 1
  explanation: 模擬永遠無法完美複製現實。透過在模擬中引入大量隨機擾動，讓模型「見多識廣」，它在面對真實世界的複雜性時就能視為另一種擾動而從容應對。
  tags:
  - chap-m4-ch4
  - sec-scenario
  usage: mock
- id: 6443
  chapter_title: 強化學習
  section_title: 深度思考情境題
  text: 情境：使用 DQN 玩 Atari 遊戲時，訓練初期 Loss 波動非常大且不收斂。你檢查了程式碼沒錯。最可能忽略了什麼機制？
  type: multiple_choice
