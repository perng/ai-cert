  - sec-scenario
  usage: mock
- id: 6444
  chapter_title: 強化學習
  section_title: 深度思考情境題
  text: 情境：你的代理在訓練過程中表現極不穩定，有時候很高分，有時候很低分。你使用的是策略梯度方法。這可能是什麼原因？
  type: multiple_choice
  options:
  - 學習率太大。應改用 PPO 或 TRPO。
