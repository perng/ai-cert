    code: "V[s] = max(\n    sum(P[s,a,s2] * (R[s,a,s2] + gamma * V[s2]) for s2 in states)\n    for a in actions\n)"
  type: multiple_choice
  options:
  - 在所有動作中選擇期望回報最高者
  - 隨機選擇下一狀態
  - 計算資料最大值
  - 固定採取第一個 action
  correct_index: 0
  explanation: Bellman optimality update 對所有 action 的期望回報取最大值，估計最佳狀態價值。
