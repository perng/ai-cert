questions:
- id: 6401
  chapter_title: 強化學習
  section_title: 基本概念
  text: 在強化學習中，代理 (Agent) 的目標是？
  type: multiple_choice
  options:
  - 預測未來的環境狀態
  - 最大化累積獎勵 (Cumulative Reward) 或長期回報 (Return)
  - 最小化行動次數以節省能量
  - 模仿人類專家的行為 (Imitation Learning)
  correct_index: 1
  explanation: 強化學習的核心就是透過試錯，學會一套策略，讓長期獲得的總獎勵（回報）最大化。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: quiz
- id: 6402
  chapter_title: 強化學習
  section_title: 基本概念
  text: 探索 (Exploration) 與利用 (Exploitation) 的權衡是指？
  type: multiple_choice
  options:
  - 選擇最適合的機器學習演算法
  - 選擇最佳的訓練資料集
  - 選擇嘗試未知行動 (Exploration) 還是選擇當前已知最佳行動 (Exploitation)
  - 選擇最昂貴的高效能硬體設備
  correct_index: 2
  explanation: 只利用不探索會陷入局部最佳解（井底之蛙）；只探索不利用則無法累積高分。必須在兩者間取得平衡。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: quiz
- id: 6403
  chapter_title: 強化學習
  section_title: 貝爾曼方程式
  text: 折扣因子 (Discount Factor) γ 的作用是？
  type: multiple_choice
  options:
  - 減少環境中的隨機雜訊
  - 加速模型的訓練速度
  - 平衡當前即時獎勵與未來長期獎勵的重要性 (Future Reward Weighting)
  - 增加代理行動的隨機性
  correct_index: 2
  explanation: γ=0 代表只看眼前利益；γ 接近 1 代表非常重視長遠利益。
  tags:
  - chap-m4-ch4
  - sec-bellman
  usage: quiz
- id: 6404
  chapter_title: 強化學習
  section_title: 演算法
  text: Q-learning 是一種什麼類型的演算法？
  type: multiple_choice
  options:
  - 基於值的 (Value-based) 演算法，學習動作價值函數 Q(s, a)
  - 基於模型的 (Model-based) 演算法，學習環境模型
  - 監督式學習 (Supervised Learning) 演算法
  - 基於策略的 (Policy-based) 演算法
  correct_index: 0
  explanation: Q-learning 不直接學策略，而是學每個動作「值多少分」(Q值)，然後選分最高的動作做。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: quiz
- id: 6405
  chapter_title: 強化學習
  section_title: 演算法
  text: DQN (Deep Q-Network) 引入了什麼技術來解決數據相關性問題？
  type: multiple_choice
  options:
  - 遞歸神經網路 (RNN) 用於處理序列數據
  - 經驗重播 (Experience Replay)，打破數據的時間相關性
  - 卷積神經網路 (CNN) 用於提取特徵
  - 隨機森林 (Random Forest) 用於決策
  correct_index: 1
  explanation: RL 的數據是序列產生的，前後高度相關。經驗重播將數據存入緩衝區並隨機打散採樣，讓神經網路訓練更穩定。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: quiz
- id: 6406
  chapter_title: 強化學習
  section_title: 演算法
  text: 策略梯度 (Policy Gradients) 方法的主要優勢是？
  type: multiple_choice
  options:
  - 能直接處理連續動作空間 (Continuous Action Space)，如機器人控制
  - 不需要使用神經網路進行近似
  - 只能處理離散動作空間 (Discrete Action Space)
  - 計算邏輯最簡單且收斂最快
  correct_index: 0
  explanation: 對於機器人手臂控制等需要輸出連續數值（如角度、力度）的任務，策略梯度比 Q-learning 更自然且有效。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: quiz
- id: 6407
  chapter_title: 強化學習
  section_title: 應用案例
  text: AlphaGo 結合了深度強化學習與什麼技術？
  type: multiple_choice
  options:
  - 蒙地卡羅樹搜尋 (Monte Carlo Tree Search, MCTS)
  - 遺傳演算法 (Genetic Algorithm)
  - 支援向量機 (Support Vector Machine)
  - 隨機森林 (Random Forest)
  correct_index: 0
  explanation: 深度學習負責直覺判斷（這步棋好不好），MCTS 負責邏輯推演（往後多看幾步），兩者結合戰勝了人類。
  tags:
  - chap-m4-ch4
  - sec-rl-applications
  usage: quiz
- id: 6408
  chapter_title: 強化學習
  section_title: 基本概念
  text: ε-Greedy 策略中的 ε 代表？
  type: multiple_choice
  options:
  - 模型的學習率 (Learning Rate)
  - 未來獎勵的折扣因子 (Discount Factor)
  - 隨機探索的機率 (Exploration Probability)
  - 環境給予的獎勵值 (Reward Value)
  correct_index: 2
  explanation: 以 ε 的機率亂走（探索），以 1-ε 的機率走已知的最佳路徑（利用）。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: quiz
- id: 6409
  chapter_title: 強化學習
  section_title: 演算法
  text: PPO (Proximal Policy Optimization) 如何保證訓練穩定性？
  type: multiple_choice
  options:
  - 限制策略更新的幅度 (Clip 操作)，避免策略崩潰
  - 增加學習率以加快收斂
  - 減少環境給予的獎勵數值
  - 使用更深層的神經網路架構
  correct_index: 0
  explanation: 策略梯度對步長非常敏感。PPO 透過限制新舊策略的差異，確保每次更新都是安全且有效的。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: quiz
- id: 6410
  chapter_title: 強化學習
  section_title: 應用案例
  text: Sim2Real 技術主要用於解決什麼問題？
  type: multiple_choice
  options:
  - 遊戲關卡的自動生成與通關
  - 推薦系統的冷啟動問題
  - 圖像識別與分類任務
  - 先在模擬環境訓練再遷移到真實世界 (Simulation to Reality Transfer)
  correct_index: 3
  explanation: 讓機器人在真實世界摔倒幾萬次是不現實的。Sim2Real 讓它在虛擬世界摔夠了，學會走路後再放到現實中微調。
  tags:
  - chap-m4-ch4
  - sec-rl-applications
  usage: quiz
- id: 6411
  chapter_title: 強化學習
  section_title: 基本概念
  text: 強化學習中的「狀態 (State)」是指？
  type: multiple_choice
  options:
  - 代理 (Agent) 的心理狀態或內部記憶
  - 遊戲目前的得分或獎勵總和
  - 模型訓練的進度百分比
  - 環境當前的狀況描述 (Observation)，包含決策所需資訊
  correct_index: 3
  explanation: 狀態是代理做決策的依據，包含了環境的所有相關資訊（如棋盤局面、機器人關節角度）。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: both
- id: 6412
  chapter_title: 強化學習
  section_title: 貝爾曼方程式
  text: 價值函數 V(s) 代表？
  type: multiple_choice
  options:
  - 狀態 s 的計算複雜度
  - 狀態 s 發生的機率
  - 當前獲得的即時獎勵 (Immediate Reward)
  - 從狀態 s 開始的預期累積獎勵 (Expected Cumulative Reward)
  correct_index: 3
  explanation: 價值函數評估的是「長遠來看，處於這個狀態有多好」，而不僅僅是當下拿到的糖果。
  tags:
  - chap-m4-ch4
  - sec-bellman
  usage: both
- id: 6413
  chapter_title: 強化學習
  section_title: 演算法
  text: DQN 使用神經網路是為了近似？
  type: multiple_choice
  options:
  - 狀態轉移函數 (Transition Function)
  - 獎勵函數 (Reward Function)
  - 策略函數 (Policy Function)
  - Q 函數 (Q-function)，即動作價值函數
  correct_index: 3
  explanation: 當狀態空間太大（如螢幕像素）無法用表格 (Q-table) 存下時，用神經網路來擬合 Q 值函數。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6414
  chapter_title: 強化學習
  section_title: 演算法
  text: 時序差分 (Temporal Difference, TD) 誤差是用來？
  type: multiple_choice
  options:
  - 更新 Q 值，利用對未來的估計來修正當前的估計 (Bootstrapping)
  - 計算反向傳播的梯度 (Gradient Calculation)
  - 評估模型的準確率
  - 預測未來的環境狀態
  correct_index: 0
  explanation: TD 是 RL 的精髓：不用等到遊戲結束，根據「下一步的估計值」就能更新「這一步的價值」。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6415
  chapter_title: 強化學習
  section_title: 應用案例
  text: 在推薦系統中，強化學習將用戶的點擊或購買視為？
  type: multiple_choice
  options:
  - 系統的狀態 (State)
  - 環境給予的懲罰 (Penalty)
  - 系統採取的行動 (Action)
  - 環境給予的獎勵 (Reward)，用於評估推薦的好壞
  correct_index: 3
  explanation: 推薦系統是代理，推薦內容是行動，用戶點擊就是環境給的獎勵。目標是最大化長期點擊率（累積獎勵）。
  tags:
  - chap-m4-ch4
  - sec-rl-applications
  usage: both
- id: 6416
  chapter_title: 強化學習
  section_title: 演算法
  text: 固定目標網路 (Fixed Target Network) 在 DQN 中的作用是？
  type: multiple_choice
  options:
  - 穩定訓練目標，避免 Q 值估計發散 (Target Instability)
  - 增加代理的探索能力
  - 減少記憶體的使用量
  - 加速神經網路的計算速度
  correct_index: 0
  explanation: 如果射箭的靶子（目標值）一直動，很難射準。固定目標網路讓靶子暫時不動一段時間，讓訓練更穩定。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6417
  chapter_title: 強化學習
  section_title: 基本概念
  text: 策略 (Policy) π(a|s) 定義了？
  type: multiple_choice
  options:
  - 獎勵函數的計算公式
  - 代理在給定狀態 s 下選擇行動 a 的機率或規則 (Behavior Rule)
  - 狀態的價值評估方式
  - 環境運作的物理規則
  correct_index: 1
  explanation: 策略就是代理的「大腦」，決定了在什麼情況下該做什麼事。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: both
- id: 6418
  chapter_title: 強化學習
  section_title: 演算法
  text: Q-learning 的 Q 表 (Q-table) 儲存的是？
  type: multiple_choice
  options:
  - 過去所有回合的歷史記錄
  - 狀態之間的轉移機率矩陣
  - 狀態-行動對 (State-Action pair) 的預期累積獎勵值
  - 代理採取的策略分佈
  correct_index: 2
  explanation: Q(s, a) 告訴代理：在狀態 s 做動作 a，預期能拿多少分。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6419
  chapter_title: 強化學習
  section_title: 演算法
  text: 策略梯度方法直接優化的是？
  type: multiple_choice
  options:
  - 策略函數 π(θ)，即直接調整網路參數以優化策略
  - 狀態價值函數 V(s)
  - 獎勵函數 R(s, a)
  - 環境的動力學模型
  correct_index: 0
  explanation: 它不透過 Q 值間接推導，而是直接調整策略網路的參數，讓好動作的機率變大，壞動作的機率變小。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6420
  chapter_title: 強化學習
  section_title: 基本概念
  text: 環境 (Environment) 對代理的行動做出的反饋包括？
  type: multiple_choice
  options:
  - 策略更新的指令
  - 只有新的狀態資訊
  - 只有獎勵信號
  - 新的狀態 (Next State) 和獎勵 (Reward) 信號
  correct_index: 3
  explanation: 代理做了一個動作後，環境會變（轉移到新狀態），並告訴代理這個動作好不好（給獎勵）。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: both
- id: 6421
  chapter_title: 強化學習
  section_title: 演算法
  text: 經驗重播 (Experience Replay) 的緩衝區儲存的是？
  type: multiple_choice
  options:
  - 過去的轉移樣本 (s, a, r, s')，用於後續的隨機採樣訓練
  - 只有環境給予的獎勵值
  - 神經網路的模型參數
  - 只有環境的圖像數據
  correct_index: 0
  explanation: 這些四元組記錄了代理的歷史經驗，是 DQN 訓練的素材。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6422
  chapter_title: 強化學習
  section_title: 應用案例
  text: OpenAI Gym 是一個？
  type: multiple_choice
  options:
  - 一個虛擬的健身房應用程式
  - 一個特定的強化學習演算法庫
  - 一個深度學習模型訓練框架
  - 提供標準化環境 (Standardized Environments) 以測試和比較 RL 演算法的工具包
  correct_index: 3
  explanation: Gym 提供了統一的介面（reset, step），讓開發者能專注於演算法設計，而不用自己寫遊戲環境。
  tags:
  - chap-m4-ch4
  - sec-rl-applications
  usage: both
- id: 6423
  chapter_title: 強化學習
  section_title: 貝爾曼方程式
  text: 貝爾曼方程式中的 max 操作意味著？
  type: multiple_choice
  options:
  - 獎勵值是固定不變的
  - 環境的反應是隨機不可預測的
  - 代理總是選擇最差的行動以進行探索
  - 代理假設自己會選擇能帶來最大價值的最佳行動 (Optimal Action)
  correct_index: 3
  explanation: 這是最佳化控制的基礎：當前狀態的價值，取決於我接下來能做的「最好」選擇。
  tags:
  - chap-m4-ch4
  - sec-bellman
  usage: both
- id: 6424
  chapter_title: 強化學習
  section_title: 演算法
  text: Q-learning 是 On-policy 還是 Off-policy？
  type: multiple_choice
  options:
  - 兩者皆非
  - Off-policy (異策略)，因為學習的策略與行動的策略不同
  - On-policy (同策略)
  - 兩者皆是
  correct_index: 1
  explanation: Q-learning 更新時使用的是 max Q(s', a')（假設下一步做最好的動作），而實際行動可能因為 ε-Greedy 而選了別的。學習的策略與行動的策略不同，故為 Off-policy。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6425
  chapter_title: 強化學習
  section_title: 演算法
  text: 在連續動作空間 (如駕駛方向盤角度) 中，哪種方法通常更適用？
  type: multiple_choice
  options:
  - Q-learning 演算法
  - DQN (Deep Q-Network) 演算法
  - 傳統的查表法 (Tabular Method)
  - 策略梯度 (Policy Gradients) / PPO 等策略類方法
  correct_index: 3
  explanation: Q-learning/DQN 需要對動作取 max，在連續空間中很難做（無限多個動作）。策略梯度直接輸出動作分佈，天然支持連續動作。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6426
  chapter_title: 強化學習
  section_title: 基本概念
  text: 稀疏獎勵 (Sparse Reward) 問題是指？
  type: multiple_choice
  options:
  - 代理很難獲得獎勵，導致難以學習有效策略 (Difficulty in Learning)
  - 獎勵隨機出現，沒有規律
  - 環境給予的獎勵是負值
  - 環境給予的獎勵太多，導致代理不知所措
  correct_index: 0
  explanation: 就像在大海撈針。如果做了幾萬步操作都沒有任何反饋，代理根本不知道自己做得對不對，這是 RL 的一大難題。
  tags:
  - chap-m4-ch4
  - sec-rl-concepts
  usage: both
- id: 6427
  chapter_title: 強化學習
  section_title: 演算法
  text: Actor-Critic 架構結合了哪兩種方法？
  type: multiple_choice
  options:
  - Q-learning 和 SARSA 演算法
  - 策略梯度 (Actor) 和 價值函數 (Critic) 方法
  - DQN 和 CNN 架構
  - 隨機森林和 SVM 模型
  correct_index: 1
  explanation: Actor 負責做動作（策略），Critic 負責打分數（價值）。兩者互補，訓練更穩定且效率更高。
  tags:
  - chap-m4-ch4
  - sec-rl-algorithms
  usage: both
- id: 6428
  chapter_title: 強化學習
  section_title: 貝爾曼方程式
  text: 如果折扣因子 γ = 0，代理會？
  type: multiple_choice
  options:
  - 隨機採取行動，不考慮獎勵
  - 變得極度短視，只在乎當下的即時獎勵 (Immediate Reward)
  - 變得極度遠視，只在乎未來的獎勵
  - 停止所有行動
  correct_index: 1
  explanation: 未來的價值都被乘上 0 了，所以代理只在乎 R(s, a)，完全不管後面的 V(s')。
  tags:
  - chap-m4-ch4
  - sec-bellman
  usage: both
- id: 6429
  chapter_title: 強化學習
  section_title: 演算法
  text: DQN 中的 Loss Function 通常計算什麼之間的差異？
  type: multiple_choice
  options:
  - 預測的 Q 值與目標 Q 值 (Target Q) 之間的均方誤差 (MSE)
  - 策略函數與價值函數之間的差異
  - 狀態與行動之間的差異
  - 獎勵與懲罰之間的差異
