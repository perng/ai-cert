  - 環境太簡單。
  - 代理太聰明。
  correct_index: 0
  explanation: 策略梯度方法對步長（學習率）極度敏感。一步走錯可能導致策略崩潰，且很難救回來。PPO 透過 Clip 機制限制了這一步的大小，保證了單調不減的改進。
  tags:
  - chap-m4-ch4
  - sec-scenario
  usage: mock
