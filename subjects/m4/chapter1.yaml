questions:
- id: 6101
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 隨機森林 (Random Forest) 是基於哪種整合學習技術？
  type: multiple_choice
  options:
  - Clustering (分群法)，如 K-Means
  - Stacking (堆疊法)，結合多個模型的預測
  - Bagging (Bootstrap Aggregating)，如隨機森林
  - Boosting (提升法)，如 AdaBoost
  correct_index: 2
  explanation: 隨機森林透過 Bagging 技術並行訓練多棵決策樹，每棵樹使用隨機採樣的數據與特徵，最後透過投票或平均來整合結果。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6102
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 梯度提升 (Gradient Boosting) 的核心思想是？
  type: multiple_choice
  options:
  - 串行訓練模型，每一個新模型都試圖修正前一個模型的殘差 (Residuals)
  - 隨機選擇特徵進行分割以增加多樣性
  - 使用元學習器 (Meta-learner) 組合多個基學習器的預測結果
  - 並行訓練多個獨立的弱學習器
  correct_index: 0
  explanation: Gradient Boosting 是一種迭代式的 Boosting 方法，每一輪新的弱學習器都是為了減少上一輪模型的殘差 (Residual)。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6103
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 在關聯規則學習中，「支持度 (Support)」指標代表什麼？
  type: multiple_choice
  options:
  - 規則的提升效果 (Lift)
  - 規則的可信程度 (Confidence)
  - 規則的複雜度或長度
  - 規則在數據集中出現的頻率或機率 (Frequency)
  correct_index: 3
  explanation: 支持度衡量一個項目集（如「啤酒與尿布」）在所有交易中出現的機率或頻率。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: quiz
- id: 6104
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 孤立森林 (Isolation Forest) 檢測異常點的核心原理是？
  type: multiple_choice
  options:
  - 異常點距離群集中心的歐氏距離較遠
  - 異常點的重構誤差 (Reconstruction Error) 較大
  - 異常點更容易被隨機分割隔離，因此在樹中的路徑長度較短
  - 異常點周圍的數據密度較高
  correct_index: 2
  explanation: 孤立森林利用異常點「少且不同」的特性，在隨機構建的樹中，異常點通常會比正常點更快被隔離到葉節點（即路徑更短）。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: quiz
- id: 6105
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: CatBoost 演算法最大的特色在於擅長處理哪種類型的特徵？
  type: multiple_choice
  options:
  - 類別特徵 (Categorical Features)，無需預先進行 One-hot Encoding
  - 具有時間依賴性的時間序列特徵 (Time-series Features)
  - 非結構化的文本特徵 (Text Features)
  - 高維度的圖像特徵 (Image Features)
  correct_index: 0
  explanation: CatBoost (Categorical Boosting) 專為處理類別型特徵而設計，能自動處理編碼問題，無需預先進行 One-hot
    Encoding。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6106
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 在決策樹中，若「吉尼不純度 (Gini Impurity)」越小，代表該節點的純度如何？
  type: multiple_choice
  options:
  - 越低，表示樣本越混雜
  - 無法判斷，取決於數據量
  - 越高，表示樣本越純 (Pure)
  - 不變，與純度無關
  correct_index: 2
  explanation: Gini 不純度衡量樣本集合的混雜程度。數值為 0 代表所有樣本屬於同一類（最純），數值越大代表越混雜。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6107
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 若關聯規則 A -> B 的「提升度 (Lift)」大於 1，代表什麼意義？
  type: multiple_choice
  options:
  - A 與 B 是相互獨立的 (Independent)
  - A 的出現會降低 B 出現的機率
  - A 與 B 呈現負相關 (Negative Correlation)
  - A 的出現會提高 B 出現的機率 (Positive Correlation)
  correct_index: 3
  explanation: Lift > 1 表示 A 的發生對 B 的發生有正向影響；Lift = 1 表示獨立；Lift < 1 表示負相關。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: quiz
- id: 6108
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: Stacking (堆疊法) 通常使用什麼來組合多個基學習器的預測結果？
  type: multiple_choice
  options:
  - 簡單平均法 (Simple Averaging)
  - 多數決投票 (Majority Voting)
  - 元學習器 (Meta-learner)，如 Logistic Regression
  - 隨機選擇一個基學習器的結果
  correct_index: 2
  explanation: Stacking 訓練一個第二層模型（元學習器），將第一層多個基學習器的輸出作為輸入特徵，學習如何最佳地組合它們。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6109
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: LightGBM 相比於 XGBoost 的一個主要優勢是？
  type: multiple_choice
  options:
  - 程式碼實作更為簡單直觀
  - 支援更多種類的機器學習演算法
  - 訓練速度更快，且記憶體佔用更低 (Efficiency)
  - 預測的準確率顯著更高
  correct_index: 2
  explanation: LightGBM 使用基於直方圖的演算法和 Leaf-wise 生長策略，大幅減少了計算量和記憶體消耗。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: quiz
- id: 6110
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: Apriori 演算法的主要缺點是？
  type: multiple_choice
  options:
  - 無法發現任何有意義的關聯規則
  - 挖掘出的規則準確率較低
  - 只能處理連續型的數值數據
  - 需要多次掃描資料庫以生成候選集，導致效率較低
  correct_index: 3
  explanation: Apriori 每次生成候選集都需要掃描一次資料庫，當數據量大時，I/O 開銷非常大。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: quiz
- id: 6111
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 隨機森林中的「隨機」體現在哪兩個方面？
  type: multiple_choice
  options:
  - 隨機採樣數據 (Bootstrap Sampling) 和隨機選擇特徵子集 (Feature Subsampling)
  - 隨機選擇標籤和隨機選擇損失函數
  - 隨機選擇模型架構和隨機選擇超參數
  - 隨機初始化權重和隨機停止訓練過程
  correct_index: 0
  explanation: 這種雙重隨機性增加了樹之間的多樣性 (Diversity)，從而降低了整合模型的變異數 (Variance)，防止過擬合。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6112
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: FP-Growth 演算法如何改進 Apriori 的效率？
  type: multiple_choice
  options:
  - 使用 GPU 進行平行運算加速
  - 忽略所有低頻項目以簡化計算
  - 構建 FP 樹 (FP-Tree) 結構，只需掃描兩次資料庫
  - 隨機減少數據量以加快處理速度
  correct_index: 2
  explanation: FP-Growth 將數據壓縮成一棵樹結構，避免了多次掃描資料庫，大大提高了頻繁項集挖掘的效率。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6113
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 資訊熵 (Entropy) 越大，代表系統？
  type: multiple_choice
  options:
  - 越有序，資訊量越少
  - 越混亂，不確定性 (Uncertainty) 越高
  - 越簡單，結構越單一
  - 越穩定，變化越少
  correct_index: 1
  explanation: 熵是衡量混亂程度的指標。如果一個集合裡各類別樣本數量相等，熵最大（最難猜）；如果只有一類，熵為 0。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6114
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: Local Outlier Factor (LOF) 適合檢測哪種異常？
  type: multiple_choice
  options:
  - 全域異常 (Global Outliers)，即相對於整體數據的異常
  - 時間序列中的異常波動
  - 局部異常 (Local Outliers)，即相對於其鄰近區域的異常
  - 圖像中的噪點異常
  correct_index: 2
  explanation: 有些點雖然在全域看來不稀疏，但相對於它周圍密集的鄰居來說，它顯得孤立，這就是局部異常。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6115
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: XGBoost 中的「正則化項」有什麼作用？
  type: multiple_choice
  options:
  - 控制模型複雜度，防止過擬合 (Overfitting)
  - 增加特徵的數量
  - 加速模型的訓練過程
  - 減少訓練數據的數量
  correct_index: 0
  explanation: XGBoost 在目標函數中加入了對葉節點數量和權重的懲罰項，這使得它比傳統的 GBDT 更不容易過擬合。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6116
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: One-Class SVM 是一種什麼類型的演算法？
  type: multiple_choice
  options:
  - 聚類分析 (Clustering Analysis)
  - 非監督式異常檢測 (Unsupervised Anomaly Detection)
  - 迴歸分析 (Regression Analysis)
  - 監督式分類 (Supervised Classification)
  correct_index: 1
  explanation: 它只需要「正常」數據進行訓練，學習一個包圍正常數據的邊界。落在邊界外的就被視為異常。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6117
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: Bagging 的主要目的是降低模型的？
  type: multiple_choice
  options:
  - 訓練誤差 (Training Error)
  - 偏差 (Bias)，即模型的準確度
  - 變異數 (Variance)，即模型的穩定性
  - 計算成本 (Computational Cost)
  correct_index: 2
  explanation: 通過平均多個模型的預測，Bagging 能有效平滑單個模型的隨機誤差，從而降低整體變異數。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6118
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 信賴度 (Confidence) P(Y|X) 衡量的是？
  type: multiple_choice
  options:
  - X 出現的邊際機率 P(X)
  - X 和 Y 同時出現的聯合機率 P(X, Y)
  - Y 出現的邊際機率 P(Y)
  - 在包含 X 的交易中，同時包含 Y 的條件機率 P(Y|X)
  correct_index: 3
  explanation: 即「買了 X 的人，有多大比例也會買 Y」。這是衡量規則強度的重要指標。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6119
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: Boosting 的主要目的是降低模型的？
  type: multiple_choice
  options:
  - 訓練所需的數據量 (Data Volume)
  - 數據中的噪音 (Noise)
  - 偏差 (Bias)，提高模型的擬合能力
  - 變異數 (Variance)，提高模型的穩定性
  correct_index: 2
  explanation: Boosting 透過不斷修正前一個模型的錯誤（擬合殘差），逐步逼近真實函數，從而降低偏差。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6120
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 孤立森林 (Isolation Forest) 對於高維數據的表現通常？
  type: multiple_choice
  options:
  - 表現很好，因為它不需要計算距離，避免了維度詛咒
  - 表現很差，受維度詛咒影響
  - 表現與維度無關，效果一般
  - 無法處理高維數據
  correct_index: 0
  explanation: 許多基於距離的演算法在高維空間會失效（維度詛咒），而孤立森林基於隨機分割，對高維數據有較好的魯棒性。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6121
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 資訊增益 (Information Gain) 是指？
  type: multiple_choice
  options:
  - 分裂前後資訊熵的差值 (Entropy Difference)，即不確定性的減少量
  - 分裂後的資訊熵 (Entropy after Split)
  - 分裂前的資訊熵 (Entropy before Split)
  - 所有節點資訊熵的總和
  correct_index: 0
  explanation: 決策樹選擇特徵的標準是：哪個特徵能讓系統的混亂程度（熵）下降最多，即資訊增益最大。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6122
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 關聯規則學習中，如果 Lift = 1，表示？
  type: multiple_choice
  options:
  - 兩個項目呈現正相關 (Positive Correlation)
  - 兩個項目呈現負相關 (Negative Correlation)
  - 兩個項目是統計獨立的 (Statistically Independent)，無關聯
  - 該關聯規則無效
  correct_index: 2
  explanation: Lift = P(XY) / (P(X)P(Y))。如果等於 1，說明 P(XY) = P(X)P(Y)，即統計獨立。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6123
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 隨機森林處理迴歸問題時，通常採用什麼方式整合結果？
  type: multiple_choice
  options:
  - 取所有樹預測值的最小值
  - 取所有樹預測值的最大值
  - 計算所有樹預測值的平均值 (Averaging)
  - 多數決投票 (Majority Voting)
  correct_index: 2
  explanation: 對於數值預測，平均所有樹的預測值是最直觀且有效的整合方式。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6124
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 異常檢測在工業界的一個常見應用是？
  type: multiple_choice
  options:
  - 電商平台的商品推薦系統
  - 圖像分類與識別
  - 語音識別與合成
  - 工業設備的預測性維護 (Predictive Maintenance)，如偵測異常震動
  correct_index: 3
  explanation: 機器壞掉前通常會有異常的震動或溫度，異常檢測能捕捉這些訊號，提前預警。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6125
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 哪種 Boosting 演算法使用了 Leaf-wise (按葉子生長) 策略？
  type: multiple_choice
  options:
  - Random Forest (隨機森林)
  - LightGBM (Light Gradient Boosting Machine)
  - AdaBoost (Adaptive Boosting)
  - XGBoost (eXtreme Gradient Boosting)
  correct_index: 1
  explanation: Leaf-wise 策略每次選擇分裂增益最大的葉子進行分裂，而不是像 Level-wise 那樣一層層長。這通常能得到更深的樹和更高的精度，但也更容易過擬合。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6126
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: Stacking 的第一層模型通常稱為？
  type: multiple_choice
  options:
  - 元學習器 (Meta-learner)
  - 弱學習器 (Weak Learners)
  - 基學習器 (Base Learners)，如 SVM, RF, KNN 等
  - 強學習器 (Strong Learners)
  correct_index: 2
  explanation: 第一層由多個不同的模型（如 SVM, RF, KNN）組成，它們的輸出被當作第二層模型的輸入特徵。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6127
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 在 Apriori 演算法中，如果一個項目集是頻繁的，那麼它的所有子集？
  type: multiple_choice
  options:
  - 必須是不頻繁的 (Infrequent)
  - 可能是頻繁的，也可能是不頻繁的
  - 必須也是頻繁的 (Frequent)
  - 無法確定，取決於數據分佈
  correct_index: 2
  explanation: 這是 Apriori 原理：如果 {啤酒, 尿布} 常出現，那 {啤酒} 和 {尿布} 單獨出現的次數一定更多（或相等），所以也一定是頻繁的。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6128
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 隨機森林能否計算特徵重要性？
  type: multiple_choice
  options:
  - 只能計算線性特徵的重要性
  - 不能，隨機森林是黑盒模型
  - 能，根據特徵在樹分裂中帶來的平均不純度減少量 (Mean Decrease Impurity) 來評估
  - 只能計算類別特徵的重要性
  correct_index: 2
  explanation: 某個特徵被選為分裂點的次數越多，且帶來的純度提升越大，該特徵就越重要。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6129
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 異常檢測中的「污染率 (Contamination)」參數是指？
  type: multiple_choice
  options:
  - 預期數據集中異常點所佔的比例 (Proportion of Outliers)
  - 模型的分類錯誤率
  - 數據中的隨機雜訊比例
  - 模型的訓練時間限制
  correct_index: 0
  explanation: 這是 Isolation Forest 等演算法的重要超參數，告訴模型「大概有多少比例的數據是壞人」，用來決定切分異常的閾值。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6130
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: XGBoost 支援並行處理 (Parallel Processing)，是指？
  type: multiple_choice
  options:
  - 並行對多個樣本進行預測
  - 在特徵粒度上進行並行計算 (Feature-level Parallelism)，如計算分裂增益
  - 並行訓練多棵決策樹
  - 並行從網路下載數據
  correct_index: 1
  explanation: Boosting 本質是串行的（樹要一棵棵長），但 XGBoost 優化了建樹過程，能同時在多個 CPU 核心上計算不同特徵的分裂增益，從而加速訓練。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6131
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 為什麼 One-Class SVM 適合處理不平衡數據的異常檢測？
  type: multiple_choice
  options:
  - 因為它會自動對數據進行平衡處理
  - 因為它忽略正常樣本
  - 因為它只需要正常樣本進行訓練 (Training with Normal Data only)，無需異常樣本
  - 因為它會忽略所有的正常樣本
  - 因為它需要大量的異常樣本進行訓練
  correct_index: 2
  explanation: 在很多場景（如飛機引擎故障），異常樣本極難取得。One-Class SVM 只要學會「什麼是正常」，凡是不像正常的都當作異常，完美解決了負樣本缺乏的問題。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6132
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 決策樹容易發生什麼問題？
  type: multiple_choice
  options:
  - 欠擬合 (Underfitting)
  - 計算速度太慢
  - 無法處理類別型特徵
  - 過擬合 (Overfitting)，即對訓練數據記憶過深
  correct_index: 3
  explanation: 單棵決策樹如果沒有限制深度，會傾向於死記硬背訓練數據的每一個細節（包括雜訊），導致泛化能力差。隨機森林通過整合多棵樹解決了這個問題。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6133
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 關聯規則 {麵包, 牛奶} -> {雞蛋} 的 Confidence = 0.8 意味著？
  type: multiple_choice
  options:
  - 80% 的交易同時包含麵包和牛奶
  - 雞蛋的總銷量是麵包和牛奶總銷量的 80%
  - 80% 的所有交易中都包含雞蛋
  - 在同時購買了麵包和牛奶的交易中，有 80% 也購買了雞蛋
  correct_index: 3
  explanation: 這是條件機率 P(雞蛋 | 麵包, 牛奶) = 0.8。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6134
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 弱學習器 (Weak Learner) 通常是指？
  type: multiple_choice
  options:
  - 準確率非常低的模型
  - 訓練時間非常長的複雜模型
  - 表現僅比隨機猜測好一點點的簡單模型 (Slightly better than random guessing)
  - 參數量非常龐大的深度學習模型
  correct_index: 2
  explanation: Boosting 的魔力就在於能將許多個「臭皮匠」（弱學習器）組合成一個「諸葛亮」（強學習器）。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6135
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 孤立森林中，異常點的路徑長度通常？
  type: multiple_choice
  options:
  - 路徑長度為 0
  - 較短，因為異常點容易被隨機分割隔離
  - 與正常點的路徑長度一樣
  - 較長，因為異常點難以被隔離
  correct_index: 1
  explanation: 異常點因為「格格不入」，在隨機切分空間時，很容易一兩刀就被切出來（隔離），所以位於樹的淺層，路徑短。
  tags:
  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6136
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: 隨機森林的 OOB (Out-of-Bag) 誤差可以用來？
  type: multiple_choice
  options:
  - 用於增加訓練數據量
  - 用於計算梯度下降
  - 計算梯度
  - 用於評估模型的泛化能力 (Generalization Ability)，無需額外的驗證集
  - 用於訓練模型參數
  correct_index: 3
  explanation: 由於 Bootstrap 採樣，每棵樹大約有 1/3 的數據沒看過（OOB 數據）。用這些數據來測試這棵樹，平均後就是 OOB 誤差，近似於交叉驗證誤差。
  tags:
  - chap-m4-ch1
  - sec-ensemble-methods
  usage: both
- id: 6137
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 頻繁項目集 (Frequent Itemset) 是指？
  type: multiple_choice
  options:
  - 價格最高的商品組合
  - 隨機組合的項目集
  - 支持度 (Support) 大於等於最小支持度閾值的項目集
  - 利潤最高的商品組合
  correct_index: 2
  explanation: 只有出現頻率夠高的組合，才值得我們去分析它們之間的關聯規則。
