    text: 閱讀下列梯度提升設定，哪一項最可能降低過擬合風險？
  - type: code
    language: python
    code: "gbdt = GradientBoostingClassifier(\n    n_estimators=1000,\n    learning_rate=0.03,\n    max_depth=2,\n    subsample=0.8,\n)"
  type: multiple_choice
  options:
  - 較小 learning_rate、淺樹與 subsample 可降低單次更新與模型複雜度
  - n_estimators 越大必然不會過擬合
  - subsample=0.8 代表只保留 80% 特徵欄位
  - max_depth=2 會讓模型變成線性迴歸
  correct_index: 0
  explanation: 小 learning rate、淺樹與隨機抽樣都常用來抑制 boosting 過擬合，但仍需驗證集或早停搭配。
