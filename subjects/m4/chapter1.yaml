- id: m4-114-2-047
  chapter_title: 進階機器學習
  section_title: 歷屆考題
  text: '在郵遞區號自動辨識的研究中，研究人員收集了一份手寫數字影像資料集，每一張影像為8×8 的灰階圖片，共包含多個手寫數字樣本。這份資料集來自UCI Machine Learning Repository，常被用於數字辨識與機器學習方法的教學與實驗。在過程中，研究人員發現資料中可能存在雜訊，例如筆跡模糊或影像中附加的干擾點，這會影響後續分類模型的效能。因此，他們希望透過資料降噪的方法，提升後續分類的準確度。同時，他們也想透過 KNN (K-NearestNeighbors) 搭配交叉驗證來評估模型表現，確保模型在不同資料切割下都能有穩定的預測能力。


    部分樣本經繪製後的外觀如下圖所示：


    根據這份資料來回答46~47 題。


