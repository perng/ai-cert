  - 使用 Stacking 或簡單平均 (Blending) 將這三個模型整合起來
  correct_index: 3
  explanation: 這是競賽拿分的標準操作。模型間的相關性低意味著它們犯錯的地方不同，整合它們可以互補長短，通常能帶來顯著的性能提升。
