- id: 6144
  chapter_title: 進階機器學習演算法
  section_title: 深度思考情境題
  text: 情境：你的 XGBoost 模型在訓練集上準確率 99%，但在測試集上只有 70%。你應該調整哪些參數來解決這個問題？
  type: multiple_choice
