  - 應該把尿布和啤酒擺在一起，或進行交叉銷售 (Cross-selling)
  - 這是巧合，忽略這個發現
  correct_index: 2
  explanation: Lift > 1 且很高，表示強關聯。這是經典的交叉銷售 (Cross-selling) 機會，利用這種關聯性可以顯著提升客單價。
