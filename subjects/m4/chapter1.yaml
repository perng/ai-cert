  - chap-m4-ch1
  - sec-adv-unsupervised
  usage: both
- id: 6140
  chapter_title: 進階機器學習演算法
  section_title: 整合方法
  text: Stacking 的主要風險是？
  type: multiple_choice
  options:
  - 模型無法解釋
  - 預測準確率過低
  - 過擬合 (Overfitting)，特別是當沒有正確使用交叉驗證時
  - 欠擬合 (Underfitting)
  correct_index: 2
  explanation: 疊了兩層模型，複雜度大增。如果沒有做好交叉驗證（如使用 Out-of-fold 預測），很容易發生數據洩漏導致過擬合。
