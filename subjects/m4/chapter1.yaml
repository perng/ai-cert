- id: 6141
  chapter_title: 進階機器學習演算法
  section_title: 深度思考情境題
  text: 情境：你正在參加一個預測房價的 Kaggle 比賽。你已經訓練了 XGBoost, LightGBM, 和 Random Forest 三個模型，它們的表現都差不多，但預測結果的相關性不高。為了進一步提升排名，你應該怎麼做？
  type: multiple_choice
  options:
  - 只選表現最好的一個。
  - 使用 Stacking 或簡單平均 (Blending) 將這三個模型整合起來。
  - 放棄比賽。
  - 重新收集數據。
  correct_index: 1
  explanation: 這是競賽拿分的標準操作。模型間的相關性低意味著它們犯錯的地方不同，整合它們可以互補長短，通常能帶來顯著的性能提升。
