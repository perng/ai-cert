  usage: both
- id: 6139
  chapter_title: 進階機器學習演算法
  section_title: 進階非監督式學習
  text: 異常檢測中的「偽陽性 (False Positive)」是指？
  type: multiple_choice
  options:
  - 將正常數據誤判為異常 (False Alarm)
  - 漏報異常 (False Negative)
  - 正確判斷正常 (True Negative)
  - 正確檢測到異常 (True Positive)
  correct_index: 0
  explanation: 狼來了（但狼沒來）。在工業檢測中，偽陽性太高會導致不必要的停機檢查，增加成本。
