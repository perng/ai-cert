    text: 閱讀下列偽程式，這是哪一種整合學習流程？
  - type: code
    language: text
    code: "for t in range(T):\n    sample = bootstrap(train_data)\n    tree_t = train_decision_tree(sample)\n    trees.append(tree_t)\n\nprediction = majority_vote([tree.predict(x) for tree in trees])"
  type: multiple_choice
  options:
  - Bagging / Random Forest 類型流程
  - Gradient descent 單模型訓練
  - K-means 更新中心點
  - Policy gradient 更新策略
  correct_index: 0
  explanation: 對資料做 bootstrap、訓練多棵樹並投票，是 bagging 的核心流程，也是隨機森林的基礎。
