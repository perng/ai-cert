- id: 6199
  chapter_title: 進階機器學習演算法
  text: "某公司針對製程感測器資料進行主成分分析 (PCA)，經標準化與協方差矩陣分解後，得到三個主成分的特徵值如下：$\\lambda_1=6.0, \\lambda_2=3.0, \\lambda_3=1.0$。若團隊決定僅保留能解釋至少 80% 總變異量的主成分，以進行後續模型建構，下列哪一項敘述最合理且數據解讀正確？ \n**💡 總變異量 = $6.0 + 3.0 + 1.0 = 10.0$**\n**💡 前兩個主成分解釋的變異量百分比 = $\\frac{6.0 + 3.0}{10.0} = 0.9 = 90\\%$** (114年第二梯次)"
  type: multiple_choice
  options:
  - 前兩個主成分合計解釋 90% 的總變異量，因此可安全降維至二維，且仍保留大部分資訊
  - 第一主成分解釋 60% 的變異量，表示資料結構呈現明顯線性關係，僅保留一維即可避免過擬合
  - 雖然前兩個主成分可解釋超過 80% 變異量，但第二主成分貢獻仍高達 30%，不宜捨棄第三主成分
  - 三個特徵值相差不大，顯示各主成分變異均衡，降維可能導致資訊損失
  correct_index: 0
  explanation: 前兩個主成分解釋變異量 = (6+3)/10 = 90% > 80%，保留前兩個即可。
  tags:
  - chap-m4-ch1
  usage: mock
- id: 6200
  chapter_title: 進階機器學習演算法
  text: "某銀行計畫與多家合作機構共同訓練一個 AI 信用風險預測模型，為避免客戶交易資料在傳輸與運算過程中外洩，技術團隊評估使用同態加密 (Homomorphic Encryption) 技術。下列何者最能正確描述同態加密在此應用中的關鍵特性？ (114年第二梯次)"
  type: multiple_choice
  options:
  - 系統以隨機雜訊 (Noise) 干擾輸出，確保統計結果不洩漏個資
  - 各參與銀行透過安全通道交換私鑰，確保模型參數一致
  - 將原始資料壓縮並同時加密，以減少加密後資料量與運算時間
  - 資料在加密狀態下仍可進行數值運算，模型訓練可於未解密資料上完成
  correct_index: 3
  explanation: 同態加密允許在密文上進行運算，結果解密後等於在明文上運算的結果，適合隱私保護機器學習。
  tags:
  - chap-m4-ch1
  usage: mock
- id: 6201
  chapter_title: 進階機器學習演算法
  text: "某跨銀行風控平台希望整合多家銀行的用戶行為資料，用於訓練信用風險預測模型。由於競爭與法規限制，各銀行僅願意提供加密後資料，且資料在任何時間不得被平台解密。同時，平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。下列哪一組技術最能完整對應上述需求？ (114年第二梯次)"
  type: multiple_choice
  options:
  - 對稱加密 (Symmetric Encryption) + 單向雜湊 (Hash Function) + 非對稱加密 (Asymmetric Encryption) + 差分隱私 (Differential Privacy)
  - 同態加密 (Homomorphic Encryption) + 非對稱加密 (Asymmetric Encryption) + 單向雜湊 (One-way Hash Function) + 對稱加密 (Symmetric Encryption) 
  - 差分隱私 (Differential Privacy) + 對稱加密 (Symmetric Encryption) + 同態加密 (Homomorphic Encryption) + 數位簽章 (Digital Signature)
  - 同態加密 (Homomorphic Encryption) + 安全多方計算 (Secure Multi-party Computation, MPC) + 雜湊函數 (Hash Function) + 對稱加密 (Symmetric Encryption)
  correct_index: 1
  explanation: 結合同態加密 (運算)、非對稱加密 (傳輸/金鑰交換)、雜湊 (完整性) 等技術能滿足高規格安全需求。
  tags:
  - chap-m4-ch1
  usage: mock
