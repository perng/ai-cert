  chapter_title: 進階機器學習演算法
  section_title: 深度思考情境題
  text: 情境：你使用孤立森林檢測信用卡詐欺，發現檢測出的異常點中有很多是 VIP 客戶的大額消費（偽陽性）。你該如何改進？
  type: multiple_choice
  options:
  - 接受這個結果，不做任何調整
  - 降低污染率 (Contamination) 參數，或增加更多上下文特徵
