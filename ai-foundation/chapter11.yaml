questions:
  - id: 11001
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "AI 模型產生偏見 (Bias) 的主要原因通常是？"
    type: multiple_choice
    options:
      - "演算法本身的數學錯誤"
      - "訓練資料反映了歷史上的社會偏見或抽樣不均"
      - "電腦硬體故障"
      - "程式碼寫太長"
    correct_index: 1
    explanation: "AI 模型是從歷史數據中學習，若數據本身包含人類社會的偏見（如性別歧視），模型就會學到並放大這些偏見。"
    tags: ["sec-chapter11", "sec-bias-fairness"]

  - id: 11002
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "Amazon 的 AI 招聘系統曾發生什麼倫理問題？"
    type: multiple_choice
    options:
      - "洩漏個資"
      - "歧視女性求職者（對包含女性詞彙的履歷扣分）"
      - "系統當機"
      - "錄取太多人"
    correct_index: 1
    explanation: "因為過去科技業多為男性，AI 學習歷史數據後誤以為「男性」是好員工的特徵，導致歧視女性。"
    tags: ["sec-chapter11", "sec-bias-fairness"]

  - id: 11003
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "差分隱私 (Differential Privacy) 的核心技術是？"
    type: multiple_choice
    options:
      - "資料加密"
      - "在資料中加入適量的數學雜訊 (Noise)"
      - "刪除資料"
      - "使用區塊鏈"
    correct_index: 1
    explanation: "差分隱私透過加入雜訊，使得攻擊者無法分辨特定個人的資訊，但仍能保持整體統計數據的準確性。"
    tags: ["sec-chapter11", "sec-privacy"]

  - id: 11004
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "聯邦學習 (Federated Learning) 的最大特色是？"
    type: multiple_choice
    options:
      - "所有資料都上傳到雲端"
      - "數據不離地 (Data stays local)，只交換模型參數"
      - "不需要模型"
      - "只能由政府使用"
    correct_index: 1
    explanation: "聯邦學習讓模型在本地裝置訓練，只回傳參數更新給伺服器，原始私密資料保留在用戶端。"
    tags: ["sec-chapter11", "sec-privacy"]

  - id: 11005
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "在 AI 輔助決策（如醫療診斷）中，「人機協作 (Human-in-the-loop)」意味著？"
    type: multiple_choice
    options:
      - "AI 全權負責"
      - "人類完全不介入"
      - "最終決策權與責任仍在人類專家身上"
      - "AI 取代人類"
    correct_index: 2
    explanation: "高風險決策不能全交給 AI，必須有人類專家審核 AI 的建議並做出最終決定。"
    tags: ["sec-chapter11", "sec-accountability"]

  - id: 11006
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "台灣《人工智慧基本法》草案中提到的「監理沙盒 (Regulatory Sandbox)」目的是？"
    type: multiple_choice
    options:
      - "禁止 AI 發展"
      - "允許企業在風險可控範圍內測試創新技術，暫時豁免部分法規"
      - "處罰違規企業"
      - "建立兒童遊樂場"
    correct_index: 1
    explanation: "監理沙盒提供一個實驗場域，讓創新技術能在法規尚未完備前先行測試，促進產業發展。"
    tags: ["sec-chapter11", "sec-taiwan-ai-law"]

  - id: 11007
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "台灣金融業運用 AI 的核心原則中，關於「治理 (Governance)」的重點是？"
    type: multiple_choice
    options:
      - "由 IT 部門全權負責"
      - "董事會與高層管理階層應負起監督責任"
      - "外包給廠商負責"
      - "不需要治理"
    correct_index: 1
    explanation: "金管會強調 AI 治理是董事會層級的責任，不能僅視為技術操作層面的問題。"
    tags: ["sec-chapter11", "sec-financial-ai"]

  - id: 11008
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "歐盟《人工智慧法案》(EU AI Act) 採取什麼樣的監管模式？"
    type: multiple_choice
    options:
      - "全面禁止"
      - "完全放任"
      - "風險導向 (Risk-based approach)"
      - "技術導向"
    correct_index: 2
    explanation: "EU AI Act 根據 AI 應用的風險等級（不可接受、高、有限、最小）實施不同強度的監管。"
    tags: ["sec-chapter11", "sec-eu-ai-act"]

  - id: 11009
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "根據 EU AI Act，「社會信用評分 (Social Scoring)」屬於哪一級風險？"
    type: multiple_choice
    options:
      - "最小風險"
      - "有限風險"
      - "高風險"
      - "不可接受風險 (Unacceptable Risk) - 禁止"
    correct_index: 3
    explanation: "社會信用評分被認為嚴重侵犯人權，在歐盟是完全禁止的。"
    tags: ["sec-chapter11", "sec-eu-ai-act"]

  - id: 11010
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "根據 EU AI Act，招聘系統或醫療器材 AI 屬於哪一級風險？"
    type: multiple_choice
    options:
      - "最小風險"
      - "有限風險"
      - "高風險 (High Risk) - 嚴格監管"
      - "不可接受風險"
    correct_index: 2
    explanation: "這些應用直接影響人們的生計與健康，被列為高風險，需通過嚴格的合規評估。"
    tags: ["sec-chapter11", "sec-eu-ai-act"]

  - id: 11011
    chapter_title: "AI 治理、法規與倫理"
    section_title: "台灣與國際法規架構"
    text: "根據 EU AI Act，聊天機器人 (Chatbot) 屬於哪一級風險，需履行什麼義務？"
    type: multiple_choice
    options:
      - "高風險，需審查"
      - "有限風險 (Limited Risk)，需履行透明度義務（告知是 AI）"
      - "不可接受風險，需禁止"
      - "最小風險，不需監管"
    correct_index: 1
    explanation: "使用者有權知道自己正在與機器互動，因此必須揭露 AI 身分。"
    tags: ["sec-chapter11", "sec-eu-ai-act"]

  - id: 11012
    chapter_title: "AI 治理、法規與倫理"
    section_title: "AI 產品評測標準"
    text: "數位發展部 AI 產品評測中心的評測指標不包含下列何者？"
    type: multiple_choice
    options:
      - "安全性 (Safety)"
      - "公平性 (Fairness)"
      - "資料複雜性 (Data Complexity)"
      - "可解釋性 (Explainability)"
    correct_index: 2
    explanation: "評測中心主要評估模型本身的性能與安全，資料品質通常被視為廠商的責任，不在直接評測範圍內。"
    tags: ["sec-chapter11", "sec-moda-eval"]

  - id: 11013
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "「資料去偏 (Data Debiasing)」的主要目的是？"
    type: multiple_choice
    options:
      - "減少資料量"
      - "消除訓練資料中的不公平偏見，確保模型公平性"
      - "加快訓練速度"
      - "加密資料"
    correct_index: 1
    explanation: "透過調整資料分佈或演算法約束，減少模型因歷史數據而產生的歧視行為。"
    tags: ["sec-chapter11", "sec-bias-fairness"]

  - id: 11014
    chapter_title: "AI 治理、法規與倫理"
    section_title: "倫理原則與風險管理"
    text: "聯邦學習適合應用於哪個場景？"
    type: multiple_choice
    options:
      - "公開數據集的訓練"
