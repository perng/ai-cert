questions:
  - id: 4001
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵工程概述"
    text: "吳恩達 (Andrew Ng) 將特徵工程比喻為什麼過程？"
    type: multiple_choice
    options:
      - "開採原油"
      - "煉油的過程"
      - "建造工廠"
      - "銷售產品"
    correct_index: 1
    explanation: "吳恩達曾說：「數據就像原油，而特徵工程就是煉油的過程。」意指將原始數據提煉為有價值的特徵。"
    tags: ["sec-chapter4", "sec-chapter4-summary"]

  - id: 4002
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "為什麼在使用 KNN 或 K-Means 等演算法時，必須進行特徵縮放 (Feature Scaling)？"
    type: multiple_choice
    options:
      - "為了節省記憶體"
      - "為了避免數值大的特徵主導距離計算"
      - "為了將類別轉為數值"
      - "為了處理缺失值"
    correct_index: 1
    explanation: "這些演算法依賴距離計算，若特徵單位差異過大（如年薪 vs. 年齡），數值大的特徵會完全主導結果，導致模型偏差。"
    tags: ["sec-chapter4", "sec-feature-scaling"]

  - id: 4003
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "標準化 (Standardization / Z-score) 的轉換公式為何？"
    type: multiple_choice
    options:
      - "(x - min) / (max - min)"
      - "(x - mean) / standard_deviation"
      - "log(x)"
      - "x * 2"
    correct_index: 1
    explanation: "標準化是將數值減去平均數後，再除以標準差，使資料呈現平均為 0、標準差為 1 的分佈。"
    tags: ["sec-chapter4", "sec-feature-scaling"]

  - id: 4004
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "正規化 (Normalization / Min-Max Scaling) 通常將資料壓縮到哪個範圍？"
    type: multiple_choice
    options:
      - "[-1, 1]"
      - "[0, 1]"
      - "[0, 100]"
      - "[-infinity, infinity]"
    correct_index: 1
    explanation: "Min-Max Scaling 將資料線性轉換到 [0, 1] 之間，適用於對範圍敏感的演算法或影像處理。"
    tags: ["sec-chapter4", "sec-feature-scaling"]

  - id: 4005
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "對數轉換 (Log Transformation) 主要用於處理哪種分佈的資料？"
    type: multiple_choice
    options:
      - "常態分佈"
      - "均勻分佈"
      - "長尾分佈或右偏分佈"
      - "左偏分佈"
    correct_index: 2
    explanation: "對數轉換能壓縮極大值並拉開較小數值，使右偏（長尾）分佈更接近常態分佈，利於模型學習。"
    tags: ["sec-chapter4", "sec-feature-transformation"]

  - id: 4006
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "將「年齡」轉換為「年齡層（青年、中年、老年）」的技術稱為什麼？"
    type: multiple_choice
    options:
      - "特徵縮放"
      - "特徵分箱 (Binning)"
      - "獨熱編碼"
      - "特徵交叉"
    correct_index: 1
    explanation: "特徵分箱將連續數值切分為區間類別，有助於過濾微小雜訊並增加模型魯棒性。"
    tags: ["sec-chapter4", "sec-feature-transformation"]

  - id: 4007
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "對於「衣服尺寸 (S, M, L, XL)」這種有順序關係的類別，應使用哪種編碼？"
    type: multiple_choice
    options:
      - "獨熱編碼 (One-Hot Encoding)"
      - "序數編碼 (Ordinal Encoding)"
      - "雜湊編碼"
      - "頻率編碼"
    correct_index: 1
    explanation: "序數編碼能保留類別間的大小順序關係（如 S < M < L），適合有序類別。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4008
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "對於「顏色 (紅, 綠, 藍)」這種沒有順序關係的類別，應使用哪種編碼？"
    type: multiple_choice
    options:
      - "序數編碼 (Ordinal Encoding)"
      - "獨熱編碼 (One-Hot Encoding)"
      - "對數轉換"
      - "標準化"
    correct_index: 1
    explanation: "獨熱編碼將每個類別轉為獨立欄位，避免模型誤以為顏色之間有大小順序關係。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4009
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "當類別數量極多（如上萬個路名）時，使用獨熱編碼會導致什麼問題？"
    type: multiple_choice
    options:
      - "維度災難 (Curse of Dimensionality)"
      - "模型欠擬合"
      - "資料外洩"
      - "梯度消失"
    correct_index: 0
    explanation: "過多的類別會產生大量稀疏欄位，導致計算量爆炸且模型難以學習，稱為維度災難。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4010
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "特徵嵌入 (Feature Embedding) 的主要優勢是什麼？"
    type: multiple_choice
    options:
      - "將類別轉為高維度稀疏向量"
      - "將類別映射到低維度向量空間，並保留語意關係"
      - "完全不需要訓練"
      - "只能處理數值資料"
    correct_index: 1
    explanation: "Embedding 能將高基數類別壓縮到低維空間，且讓意義相近的類別在空間中距離較近。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4011
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "進階特徵技巧"
    text: "特徵交叉 (Feature Cross) 的目的是什麼？"
    type: multiple_choice
    options:
      - "減少特徵數量"
      - "組合多個特徵以捕捉非線性的交互作用"
      - "將數值轉為類別"
      - "處理缺失值"
    correct_index: 1
    explanation: "特徵交叉透過組合特徵（如經度 x 緯度），讓線性模型也能學習到非線性的複雜關係。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4012
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "下列何者不是特徵過多帶來的負面影響？"
    type: multiple_choice
    options:
      - "過度擬合 (Overfitting)"
      - "計算成本增加"
      - "維度災難"
      - "模型準確率必定提升"
    correct_index: 3
    explanation: "特徵過多包含雜訊，反而可能導致過度擬合，使模型在未知資料上表現變差，準確率不一定提升。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4013
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "使用「相關係數」來篩選特徵，屬於哪種特徵選擇方法？"
    type: multiple_choice
    options:
      - "過濾法 (Filter)"
      - "包裝法 (Wrapper)"
      - "嵌入法 (Embedded)"
      - "隨機法"
    correct_index: 0
    explanation: "過濾法在進入模型前，利用統計指標（如相關係數）先篩除不相關特徵。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4014
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "Lasso 回歸 (L1 Regularization) 自動將不重要特徵係數變為 0，屬於哪種方法？"
    type: multiple_choice
    options:
      - "過濾法 (Filter)"
      - "包裝法 (Wrapper)"
      - "嵌入法 (Embedded)"
      - "人工挑選"
    correct_index: 2
    explanation: "嵌入法是指特徵選擇過程融合在模型訓練過程中，Lasso 就是典型例子。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4015
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "在詐欺偵測中，如果詐欺樣本只有 1%，模型全部猜「正常」會有什麼結果？"
    type: multiple_choice
    options:
      - "準確率很低"
      - "準確率很高 (99%)，但毫無實用價值"
      - "召回率 (Recall) 很高"
      - "模型會崩潰"
    correct_index: 1
    explanation: "這就是準確率悖論 (Accuracy Paradox)，高準確率不代表模型能有效抓出少數類別。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4016
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "SMOTE (Synthetic Minority Over-sampling Technique) 的核心原理是？"
    type: multiple_choice
    options:
      - "直接複製少數類別樣本"
      - "隨機刪除多數類別樣本"
      - "在少數樣本及其鄰居連線上生成新樣本"
      - "調整類別權重"
    correct_index: 2
    explanation: "SMOTE 透過插值方式「無中生有」創造新樣本，而非單純複製，能增加樣本多樣性。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4017
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "ADASYN 與 SMOTE 的主要差異在於？"
    type: multiple_choice
    options:
      - "ADASYN 只刪除樣本"
      - "ADASYN 根據學習難度（邊界樣本）生成更多數據"
      - "ADASYN 只能處理影像"
      - "兩者完全相同"
    correct_index: 1
    explanation: "ADASYN 會在難以分類的邊界區域生成更多樣本，強迫模型學習這些困難案例。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4018
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "Tomek Links 主要用於哪種採樣策略？"
    type: multiple_choice
    options:
      - "過採樣 (Oversampling)"
      - "欠採樣 (Undersampling)"
      - "特徵選擇"
      - "特徵縮放"
    correct_index: 1
    explanation: "Tomek Links 用於找出邊界模糊的樣本對，並刪除其中的多數類別樣本，屬於欠採樣的一種。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4019
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "類別權重調整 (Class Weights) 是如何運作的？"
    type: multiple_choice
    options:
      - "增加少數類別的樣本數"
      - "減少多數類別的樣本數"
      - "提高模型答錯少數類別時的懲罰分數"
      - "忽略少數類別"
    correct_index: 2
    explanation: "透過給予少數類別更高的權重（懲罰），強迫模型重視這些樣本，而不需改變資料本身。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4020
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "若資料包含類別型特徵，能否直接使用標準的 SMOTE？"
    type: multiple_choice
    options:
      - "可以，沒問題"
      - "不行，因為無法計算類別間的歐氏距離"
      - "可以，但效果很差"
      - "視情況而定"
    correct_index: 1
    explanation: "標準 SMOTE 基於數值距離計算，無法處理類別（如無法計算紅色和藍色的平均），需改用 SMOTE-NC。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4021
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "在進行特徵縮放時，若資料包含極端值 (Outliers)，哪種方法較不適合？"
    type: multiple_choice
    options:
      - "標準化 (Standardization)"
      - "正規化 (Min-Max Scaling)"
      - "Robust Scaling"
      - "Log Transformation"
    correct_index: 1
    explanation: "Min-Max Scaling 使用最大值和最小值進行計算，極端值會導致大部分數據被壓縮到極小的範圍內。"
    tags: ["sec-chapter4", "sec-feature-scaling"]

  - id: 4022
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "遞迴特徵消除 (RFE) 屬於哪種特徵選擇方法？"
    type: multiple_choice
    options:
      - "過濾法 (Filter)"
      - "包裝法 (Wrapper)"
      - "嵌入法 (Embedded)"
      - "隨機法"
    correct_index: 1
    explanation: "RFE 反覆訓練模型並剔除最不重要的特徵，屬於包裝法。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4023
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "目標編碼 (Target Encoding) 的原理是？"
    type: multiple_choice
    options:
      - "用類別的序號取代"
      - "用該類別在目標變數的平均值取代"
      - "用 0 和 1 取代"
      - "用雜湊值取代"
    correct_index: 1
    explanation: "Target Encoding 直接利用目標變數的統計資訊（如平均房價）來代表該類別（如城市），能有效處理高基數特徵。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4024
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵工程概述"
    text: "下列哪種演算法不需要進行特徵縮放？"
    type: multiple_choice
    options:
      - "KNN (K-近鄰)"
      - "SVM (支援向量機)"
      - "決策樹 (Decision Tree)"
      - "類神經網路"
    correct_index: 2
    explanation: "決策樹是基於規則切分的（如年齡 > 20），只看數值大小關係，不計算距離，因此不受特徵尺度影響。"
    tags: ["sec-chapter4", "sec-feature-scaling"]

  - id: 4025
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "隨機過採樣 (Random Oversampling) 的主要缺點是什麼？"
    type: multiple_choice
    options:
      - "容易導致過度擬合 (Overfitting)"
      - "會丟失重要資訊"
      - "計算速度太慢"
      - "無法處理數值資料"
    correct_index: 0
    explanation: "因為只是單純複製樣本，模型會反覆看到完全相同的資料並死記硬背，導致過度擬合。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4026
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "特徵分箱 (Binning) 對模型有什麼好處？"
    type: multiple_choice
    options:
      - "提高精確度"
      - "增加模型魯棒性，減少對微小雜訊的敏感度"
      - "減少特徵數量"
      - "增加特徵數量"
    correct_index: 1
    explanation: "分箱將連續數值離散化，讓模型忽略微小的數值差異（如 25 歲和 26 歲），專注於大區間的趨勢。"
    tags: ["sec-chapter4", "sec-feature-transformation"]

  - id: 4027
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "過濾法 (Filter Method) 的優點是什麼？"
    type: multiple_choice
    options:
      - "考慮了特徵間的交互作用"
      - "計算速度快，獨立於模型"
      - "準確度最高"
      - "不易過度擬合"
    correct_index: 1
    explanation: "過濾法只計算統計指標，不需要訓練模型，因此速度最快。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4028
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "Word2Vec 是哪種技術的經典應用？"
    type: multiple_choice
    options:
      - "獨熱編碼"
      - "特徵嵌入 (Feature Embedding)"
      - "特徵雜湊"
      - "序數編碼"
    correct_index: 1
    explanation: "Word2Vec 將文字轉換為向量空間中的點，捕捉語意關係，是 Embedding 的代表作。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4029
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "進階特徵技巧"
    text: "在房價預測中，將「經度」和「緯度」組合成「區塊」，這是使用了什麼技巧？"
    type: multiple_choice
    options:
      - "特徵縮放"
      - "特徵交叉 (Feature Cross)"
      - "特徵選擇"
      - "特徵嵌入"
    correct_index: 1
    explanation: "這是典型的特徵交叉，透過組合兩個特徵來創造出具有地理意義的新特徵。"
    tags: ["sec-chapter4", "sec-advanced-features"]

  - id: 4030
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "不平衡資料處理"
    text: "隨機欠採樣 (Random Undersampling) 的風險是什麼？"
    type: multiple_choice
    options:
      - "過度擬合"
      - "丟失潛在有用的資訊"
      - "計算量增加"
      - "產生雜訊"
    correct_index: 1
    explanation: "隨機刪除多數類別樣本可能會不小心刪掉包含重要特徵的資料。"
    tags: ["sec-chapter4", "sec-imbalanced-data"]

  - id: 4031
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "數值特徵處理"
    text: "如果資料分佈呈現「長尾」現象，應該優先考慮哪種轉換？"
    type: multiple_choice
    options:
      - "平方轉換"
      - "對數轉換 (Log Transformation)"
      - "倒數轉換"
      - "指數轉換"
    correct_index: 1
    explanation: "Log 轉換能有效壓縮長尾端的數值，使分佈更均勻。"
    tags: ["sec-chapter4", "sec-feature-transformation"]

  - id: 4032
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "類別特徵編碼"
    text: "特徵雜湊 (Feature Hashing) 主要用於解決什麼問題？"
    type: multiple_choice
    options:
      - "類別順序問題"
      - "維度災難與高基數類別"
      - "缺失值問題"
      - "不平衡資料"
    correct_index: 1
    explanation: "Feature Hashing 將大量類別映射到固定數量的桶中，控制維度數量，解決高基數問題。"
    tags: ["sec-chapter4", "sec-categorical-encoding"]

  - id: 4033
    chapter_title: "特徵工程 (Feature Engineering)"
    section_title: "特徵選擇"
    text: "包裝法 (Wrapper Method) 的主要缺點是？"
    type: multiple_choice
    options:
